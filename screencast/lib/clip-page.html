<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>clip</title>
<style>
  @font-face { font-family: '72'; src: url('/fonts/72-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: '72'; src: url('/fonts/72-Bold.woff2') format('woff2'); font-weight: 700; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(120% 120% at 0% 0%, #123A62 0%, #0B1F33 55%, #081626 100%); font-family: '72', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1680px; border-radius: 14px; overflow: hidden; background: #0B1F33; box-shadow: 0 24px 64px rgba(0, 0, 0, .5); }
  .bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #0F2A47; color: #8FD0FF; font-size: 17px; letter-spacing: .02em; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #33B1FF; opacity: .55; display: block; }
  .bar span { margin-left: 8px; }
  video { display: block; width: 100%; }
</style>
</head>
<body>
<div class="frame"><div class="bar"><i></i><i></i><i></i><span id="title"></span></div><video id="clip" muted playsinline></video></div>
<script>
  // A recorded video clip in the cast frame, with the cast page's title protocol: `playing` at the first frame,
  // `ended` after the last, and the invisible pixel that keeps the last frame repainting.
  const q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = q.get('title') || 'Video';
  const clip = document.getElementById('clip');
  clip.addEventListener('playing', () => { document.title = 'playing'; }, { once: true });
  const keepPainting = () => {
    const px = document.createElement('div'); px.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px';
    document.body.appendChild(px); let k = 0; setInterval(() => { px.style.background = k++ % 2 ? '#081626' : '#081627'; }, 100);
  };
  clip.addEventListener('ended', () => { keepPainting(); document.title = 'ended'; });
  clip.src = q.get('src'); clip.play();
</script>
</body>
</html>
