name: CI Pipeline

on:
  workflow_dispatch:
    inputs:
      build_images:
        description: 'Build the Docker images, boot the admin container and scan the images (Phases 7-9)'
        type: boolean
        default: false
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  # Skips the Docker build, container validation and Trivy image scan (Phases 7-9) to save Actions
  # minutes; the local `pnpm run ci` still builds and scans the images. A manual run with the
  # `build_images` input ticked builds them here (pushes and pull requests always skip).
  SKIP_DOCKER_BUILD: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_images) && 'false' || 'true' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # A green run takes 60-90 minutes; a stalled download must fail with a log, not hold the
    # runner for GitHub's 6-hour default (2026-10-07: apt-get update hung 2 h 15 min on a mirror).
    timeout-minutes: 150

    # pgvector-enabled Postgres for the file_search DSN-gated integration suites
    # (test/fileSearch/integration/**). Bound to host port 55432, not the default
    # 5432, because Phase 8 of ci/ci-pipeline.js later runs `docker compose up`
    # against docker/docker-compose.yml, whose own postgres service also publishes
    # 5432 — a same-port service container would collide with it.
    services:
      pgvector:
        # Same tag as docker/docker-compose.yml and the Kyma manifest (see
        # comments there for why "-trixie" specifically) — kept identical for
        # test/prod parity, though this container is ephemeral per CI run so
        # the glibc-collation concern that motivates it doesn't apply here.
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filesearch_test
        ports:
          - 55432:5432
        # --shm-size: parallel HNSW builds and parallel queries in concurrently running suites share
        # the container's /dev/shm; Docker's 64 MB default runs out ("could not resize shared memory").
        options: >-
          --shm-size=1g
          --health-cmd="pg_isready -U postgres -d filesearch_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Fetch current + previous commit for git diff optimization

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: 'https://registry.npmjs.org'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.STORE_PATH }}
          ~/.cache/puppeteer
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Dependency gate (high/critical not on ci/audit-allowlist.json fail the run)
      run: node ci/audit-gate.js

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Trivy
      # Trivy for the Docker image scan (Phase 9), from its release page instead of apt, so it
      # does not depend on the Ubuntu mirrors. Pinned to a commit (v0.3.1) and a Trivy release.
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      if: env.SKIP_DOCKER_BUILD != 'true'
      timeout-minutes: 10
      with:
        version: v0.75.0
        cache: true

    - name: Install file_search extractor binaries (pandoc, pdftotext, tesseract, antiword)
      timeout-minutes: 10
      run: |
        # pandoc (.docx/.odt/.epub/.rst/.html/.tex), pdftotext from poppler-utils
        # (.pdf) and tesseract with English data (OCR of PDF pages
        # without a text layer) and antiword (legacy Word .doc) are spawned by the gateway's
        # extractors. Installing them here lets the FILE_SEARCH_TEST_BINARIES-gated suites
        # (test/fileSearch/integration/extractors.test.ts, legacyDoc.test.ts) run instead of skip.
        # Each apt attempt gives up on a stalled mirror after 20 s and is retried, so a slow
        # mirror costs minutes, not the job.
        for attempt in 1 2 3; do
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 update && break
          echo "apt-get update attempt $attempt failed; retrying"; sleep 10
          [ "$attempt" = 3 ] && exit 1
        done
        sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 install -y pandoc poppler-utils tesseract-ocr tesseract-ocr-eng antiword
        pandoc --version
        command -v antiword
        pdftotext -v
        tesseract --version
        # The gateway skips configured languages it has no data for; fail here, not in a test.
        langs="$(tesseract --list-langs 2>&1)"
        echo "$langs"
        for lang in eng; do
          echo "$langs" | grep -qx "$lang" || { echo "tesseract language data '$lang' is missing"; exit 1; }
        done

    - name: Set up SAP AI Core Service Key
      env:
        SECRET_VALUE: ${{ secrets.SAP_AI_CORE_SERVICE_KEY }}
      run: |
        # Verify secret is configured
        if [ -z "$SECRET_VALUE" ]; then
          echo "ERROR: SAP_AI_CORE_SERVICE_KEY secret not configured"
          echo "Please add your SAP AI Core service key as a GitHub secret"
          exit 1
        fi

        # Set as environment variable for subsequent steps
        # Using heredoc to safely handle multi-line JSON content
        {
          echo "SAP_AI_CORE_SERVICE_KEY<<EOF"
          echo "$SECRET_VALUE"
          echo "EOF"
        } >> $GITHUB_ENV

    - name: Make CI pipeline executable
      run: chmod +x ci/ci-pipeline.js

    - name: Free runner disk space
      # ubuntu-latest guarantees only ~14 GB free; the pipeline builds four images
      # with --no-cache and runs the browser-based UI journeys, and a run died with
      # the runner's own "No space left on device". Drop preinstalled toolchains this
      # project never uses and unused Docker images (the pgvector service container's
      # image is in use and survives). Node under /opt/hostedtoolcache is kept.
      run: |
        echo "before:"; df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/julia* || true
        docker image prune -af >/dev/null 2>&1 || true
        echo "after:"; df -h / | tail -1

    - name: Check the SAP relay
      timeout-minutes: 3
      env:
        SAP_RELAY_BASE: ${{ secrets.SAP_RELAY_BASE }}
      run: |
        if [ -z "$SAP_RELAY_BASE" ]; then
          echo "::notice::The SAP relay is not configured; SAP AI Core is reached directly."
          exit 0
        fi
        for attempt in 1 2 3; do
          # Only the status code is printed, never the URL (it carries the relay key); 000 = no response.
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$SAP_RELAY_BASE/healthz" 2>/dev/null || true)
          echo "SAP relay health attempt $attempt: HTTP ${code:-000}"
          if [ "$code" = 200 ]; then
            echo "The SAP relay is healthy."
            exit 0
          fi
          [ "$attempt" -lt 3 ] && sleep 10
        done
        echo "The SAP relay is not running — scale it up before pushing (see ci/sap-relay/README.md)."
        exit 1

    - name: Start MinIO for the file_search S3 suites
      # Not a service container: those cannot pass the `server /data` command. Runs after the disk
      # cleanup (which prunes unused images). Random credentials per run; the helper masks the secret
      # and exports FILE_SEARCH_TEST_S3_* (127.0.0.1:59000) to the steps below via GITHUB_ENV.
      timeout-minutes: 5
      run: node ci/scripts/file-search-test-s3.js start

    - name: Run CI Pipeline
      run: pnpm run ci
      env:
        SAP_RELAY_BASE: ${{ secrets.SAP_RELAY_BASE }}
        CI: true
        NODE_ENV: test
        # Force SQLite for CI tests
        cds.requires.db.kind: sqlite
        cds.requires.db.impl: "@cap-js/sqlite"
        cds.requires.db.credentials.url: "db/admin.db"
        # file_search: point the gateway's DSN-gated integration suites at the
        # pgvector service container above so they run instead of skipping.
        FILE_SEARCH_TEST_DSN: postgresql://postgres:postgres@localhost:55432/filesearch_test
        # Extractor binaries were installed in the step above, so the
        # FILE_SEARCH_TEST_BINARIES-gated suite runs too.
        FILE_SEARCH_TEST_BINARIES: "1"

    - name: Remove the file_search test MinIO
      if: always()
      # By name (FILE_SEARCH_TEST_S3_CONTAINER from the start step); a no-op if it never started.
      run: node ci/scripts/file-search-test-s3.js stop

    - name: Mask the SAP relay key in the uploaded artifacts
      if: always()
      env:
        SAP_RELAY_BASE: ${{ secrets.SAP_RELAY_BASE }}
      run: |
        # The gateway logs full SAP URLs, which through the relay carry its key. Replace the base URL and
        # the key (the path after the host) with <sap-relay> in everything the two artifacts below upload.
        # Neither value is ever printed.
        [ -n "$SAP_RELAY_BASE" ] || exit 0
        base="$SAP_RELAY_BASE"
        while [ "${base%/}" != "$base" ]; do base="${base%/}"; done
        hostpath="${base#*://}"
        case "$hostpath" in */*) key="${hostpath#*/}" ;; *) key="" ;; esac
        export RELAY_BASE="$base" RELAY_KEY="$key"
        shopt -s nullglob
        targets=()
        for t in ci-logs services/*/logs *.log services/*/coverage services/*/test-results.xml ci/reports/ui-journeys; do
          if [ -e "$t" ]; then targets+=("$t"); fi
        done
        [ ${#targets[@]} -gt 0 ] || exit 0
        patterns=(-e "$base")
        [ -n "$key" ] && patterns+=(-e "$key")
        mapfile -d '' files < <(grep -rlZF "${patterns[@]}" -- "${targets[@]}" || true)
        if [ ${#files[@]} -gt 0 ]; then
          perl -pi -e 's/\Q$ENV{RELAY_BASE}\E/<sap-relay>/g; s/\Q$ENV{RELAY_KEY}\E/<sap-relay>/g if length $ENV{RELAY_KEY}' -- "${files[@]}"
        fi
        echo "Masked the SAP relay in ${#files[@]} file(s)."

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          services/*/coverage/
          services/*/test-results.xml
          ci/reports/ui-journeys/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: service-logs
        path: |
          ci-logs/
          services/*/logs/
          *.log
        retention-days: 3
        if-no-files-found: ignore

  # Security checks are now integrated into the main CI pipeline
  # This reduces duplication and ensures consistency

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Consistent with main CI job

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      env:
        # Force SQLite for tests
        cds.requires.db.kind: sqlite
        cds.requires.db.impl: "@cap-js/sqlite"
        # No browser runs in this job (static checks only) - skip the Chrome for Testing download
        PUPPETEER_SKIP_DOWNLOAD: 'true'

    - name: Run TypeScript check
      run: |
        cd services/gateway && pnpm run build
        cd ../admin && pnpm run build
      env:
        # Force SQLite for tests
        cds.requires.db.kind: sqlite
        cds.requires.db.impl: "@cap-js/sqlite"

    - name: Documentation site check
      run: pnpm docs:check

    - name: Install ffmpeg for the screencast render tests
      timeout-minutes: 10
      run: |
        # screencast/teaser/render.test.mjs renders zooms with ffmpeg to check they glide; the
        # runner image has no ffmpeg. Same stalled-mirror retries as the extractor binaries.
        for attempt in 1 2 3; do
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 update && break
          echo "apt-get update attempt $attempt failed; retrying"; sleep 10
          [ "$attempt" = 3 ] && exit 1
        done
        sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
        ffmpeg -version | head -1

    - name: Screencast toolkit tests
      run: pnpm screencast:test

    - name: Check code formatting
      run: |
        echo "📋 Checking code formatting..."
        # Add your linting/formatting checks here
        # Example: pnpm run lint
        echo "✅ Code formatting checks passed"

    - name: Check for outdated dependencies
      run: |
        echo "📦 Checking for outdated dependencies..."
        pnpm outdated || true  # Don't fail on outdated deps, just warn

  # Docker security scanning is now integrated into the main CI pipeline (Phase 8)
  # The CI pipeline includes Trivy scanning after Docker builds when available
  # This provides comprehensive security coverage with proper timing