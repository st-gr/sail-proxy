name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  ci:
    runs-on: ubuntu-latest

    # pgvector-enabled Postgres for the file_search DSN-gated integration suites
    # (test/fileSearch/integration/**). Bound to host port 55432, not the default
    # 5432, because Phase 8 of ci/ci-pipeline.js later runs `docker compose up`
    # against docker/docker-compose.yml, whose own postgres service also publishes
    # 5432 — a same-port service container would collide with it.
    services:
      pgvector:
        # Same tag as docker/docker-compose.yml and the Kyma manifest (see
        # comments there for why "-trixie" specifically) — kept identical for
        # test/prod parity, though this container is ephemeral per CI run so
        # the glibc-collation concern that motivates it doesn't apply here.
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filesearch_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Fetch current + previous commit for git diff optimization

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: 'https://registry.npmjs.org'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Audit dependencies for known vulnerabilities
      run: pnpm audit --audit-level high || true

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Trivy
      run: |
        # Install Trivy for Docker image security scanning
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Install file_search extractor binaries (pandoc, pdftotext)
      run: |
        # pandoc (.docx/.odt/.epub/.rst/.html/.tex) and pdftotext from poppler-utils
        # (.pdf) are spawned by the gateway's extractor registry. Installing them
        # here lets the FILE_SEARCH_TEST_BINARIES-gated suite
        # (test/fileSearch/integration/extractors.test.ts) run instead of skip.
        # (Own `apt-get update` — don't rely on the Trivy step above having run one.)
        sudo apt-get update
        sudo apt-get install -y pandoc poppler-utils
        pandoc --version
        pdftotext -v

    - name: Set up SAP AI Core Service Key
      env:
        SECRET_VALUE: ${{ secrets.SAP_AI_CORE_SERVICE_KEY }}
      run: |
        # Verify secret is configured
        if [ -z "$SECRET_VALUE" ]; then
          echo "ERROR: SAP_AI_CORE_SERVICE_KEY secret not configured"
          echo "Please add your SAP AI Core service key as a GitHub secret"
          exit 1
        fi

        # Set as environment variable for subsequent steps
        # Using heredoc to safely handle multi-line JSON content
        {
          echo "SAP_AI_CORE_SERVICE_KEY<<EOF"
          echo "$SECRET_VALUE"
          echo "EOF"
        } >> $GITHUB_ENV

    - name: Make CI pipeline executable
      run: chmod +x ci/ci-pipeline.js

    - name: Run CI Pipeline
      run: pnpm run ci
      env:
        CI: true
        NODE_ENV: test
        # Force SQLite for CI tests
        cds.requires.db.kind: sqlite
        cds.requires.db.impl: "@cap-js/sqlite"
        cds.requires.db.credentials.url: "db/admin.db"
        # file_search: point the gateway's DSN-gated integration suites at the
        # pgvector service container above so they run instead of skipping.
        FILE_SEARCH_TEST_DSN: postgresql://postgres:postgres@localhost:55432/filesearch_test
        # Extractor binaries were installed in the step above, so the
        # FILE_SEARCH_TEST_BINARIES-gated suite runs too.
        FILE_SEARCH_TEST_BINARIES: "1"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          services/*/coverage/
          services/*/test-results.xml
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: service-logs
        path: |
          services/*/logs/
          *.log
        retention-days: 3
        if-no-files-found: ignore

  # Security checks are now integrated into the main CI pipeline
  # This reduces duplication and ensures consistency

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Consistent with main CI job

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      env:
        # Force SQLite for tests
        cds.requires.db.kind: sqlite
        cds.requires.db.impl: "@cap-js/sqlite"

    - name: Run TypeScript check
      run: |
        cd services/gateway && pnpm run build
        cd ../admin && pnpm run build
      env:
        # Force SQLite for tests
        cds.requires.db.kind: sqlite
        cds.requires.db.impl: "@cap-js/sqlite"

    - name: Check code formatting
      run: |
        echo "📋 Checking code formatting..."
        # Add your linting/formatting checks here
        # Example: pnpm run lint
        echo "✅ Code formatting checks passed"

    - name: Check for outdated dependencies
      run: |
        echo "📦 Checking for outdated dependencies..."
        pnpm outdated || true  # Don't fail on outdated deps, just warn

  # Docker security scanning is now integrated into the main CI pipeline (Phase 8)
  # The CI pipeline includes Trivy scanning after Docker builds when available
  # This provides comprehensive security coverage with proper timing