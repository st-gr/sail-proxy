issuer: http://localhost:8080/dex

storage:
  type: postgres
  config:
    host: postgres
    port: 5432
    database: sap_llm_gateway
    user: admin_user
    password: golden-postgres-password
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556
  # Allow nginx and direct access for development
  allowedOrigins: ["http://localhost:8080", "http://localhost:5556"]

logger:
  level: info
  format: json

oauth2:
  skipApprovalScreen: false
  responseTypes: ["code"]
  grantTypes: ["authorization_code", "refresh_token"]

enablePasswordDB: true

staticClients:
- id: oauth2-proxy
  redirectURIs:
  - 'http://localhost:8080/auth/callback'
  name: 'SAP LLM Gateway OAuth2 Proxy'
  secret: <hex32>
  trustedPeers:
  - oauth2-proxy

# Demo users for SAP LLM Gateway
staticPasswords:
- email: "admin@example.com"
  # Password: admin123 (bcrypt hash)
  hash: "$2b$10$u22sNtBUq9moy3S61/JtBeBljT396lPFR27D2A0QJZiwWEyKk6G9O"
  username: "admin"
  userID: "admin"
  groups:
  - "sap-llm-gateway-admin"

- email: "user@example.com"
  # Password: user123 (bcrypt hash)  
  hash: "$2b$10$ZV82PwPQoYRA21hvAOY6peaE0mL1zrmJAXG8kXQlUG.dUKBddFzBy"
  username: "user"
  userID: "user"
  groups:
  - "sap-llm-gateway-user"

