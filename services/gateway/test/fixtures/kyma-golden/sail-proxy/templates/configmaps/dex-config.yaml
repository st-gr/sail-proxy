apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: sail-proxy
data:
  config.yaml: |
    {
      "issuer": "https://sail-proxy.c-abc123.kyma.ondemand.com/dex",
      "storage": {
        "type": "kubernetes",
        "config": {
          "inCluster": true
        }
      },
      "web": {
        "http": "0.0.0.0:5556"
      },
      "logger": {
        "level": "debug",
        "format": "text"
      },
      "oauth2": {
        "skipApprovalScreen": true
      },
      "staticClients": [
        {
          "id": "oauth2-proxy",
          "redirectURIs": [
            "https://sail-proxy.c-abc123.kyma.ondemand.com/oauth2/callback"
          ],
          "name": "OAuth2 Proxy",
          "secret": "test-client-secret0000000000000000000000000000000000000000000000"
        }
      ],
      "staticPasswords": [
        {
          "email": "admin@example.com",
          "hash": "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W",
          "username": "admin"
        },
        {
          "email": "user@example.com",
          "hash": "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W",
          "username": "user"
        }
      ],
      "enablePasswordDB": true
    }
    
