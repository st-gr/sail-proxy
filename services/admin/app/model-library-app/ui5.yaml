specVersion: "3.2"
type: application
metadata:
  name: admin.model-library-app
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.ui.table
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        debug: false
        prependPathMappings:
          - /resources/
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        addToNamespace: true
        prependPathMappings:
          - /resources/
