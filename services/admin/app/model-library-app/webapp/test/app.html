<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Model Library - UI journey launch page</title>
	<!-- webapp/index.html with one difference: the themes come from the shell. Every app has its own
	     dev server, which would compile and keep its own copy of every library theme (some 200 MB per
	     app; the CI admin ran out of heap). -->
	<script id="sap-ui-bootstrap"
		src="../resources/sap-ui-core.js"
		data-sap-ui-libs="sap.m,sap.f,sap.uxap,sap.ui.layout,sap.ui.table"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-theme-roots='{"sap_horizon": "/shell/resources/"}'
		data-sap-ui-resourceroots='{"admin.modellibrary": "../"}'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-frameOptions="trusted">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div data-sap-ui-component data-name="admin.modellibrary" data-id="container" data-settings='{"id": "admin.modellibrary"}'></div>
</body>
</html>
