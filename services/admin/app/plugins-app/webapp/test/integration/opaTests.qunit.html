<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Plugins - UI journeys</title>
	<!-- Themes come from the shell: every app has its own dev server, which would compile and keep its
	     own copy of every library theme (some 200 MB per app; the CI admin ran out of heap). -->
	<script id="sap-ui-bootstrap"
		src="../../resources/sap-ui-core.js"
		data-sap-ui-resourceroots='{"admin.plugins": "../../"}'
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-theme-roots='{"sap_horizon": "/shell/resources/"}'
		data-sap-ui-language="en"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true">
	</script>
	<link rel="stylesheet" type="text/css" href="../../resources/sap/ui/thirdparty/qunit-2.css">
	<script src="../../resources/sap/ui/thirdparty/qunit-2.js"></script>
	<script>QUnit.config.autostart = false; QUnit.config.testTimeout = 300000;</script>
	<script src="opaTests.qunit.js"></script>
</head>
<body>
	<div id="qunit"></div>
	<div id="qunit-fixture"></div>
</body>
</html>
