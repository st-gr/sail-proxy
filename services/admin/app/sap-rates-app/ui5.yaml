specVersion: "3.2"
type: application
metadata:
  name: admin.saprates
framework:
  name: SAPUI5
  version: "1.136.22"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.mdc
    - name: sap.fe.core
    - name: sap.fe.templates
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        debug: false
        prependPathMappings:
          - /resources/
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        addToNamespace: true
        prependPathMappings:
          - /resources/
