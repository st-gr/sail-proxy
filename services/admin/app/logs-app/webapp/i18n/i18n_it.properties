tracesRawLeftOut=Alcune richieste acquisite solo in forma grezza non sono elencate. Scegli un intervallo più breve per vederle.
captureOn=L’acquisizione del payload è attiva: ogni richiesta lascia qui una traccia con i suoi dati. Una richiesta mascherata conserva il prompt e la risposta mascherati. Una richiesta non mascherata conserva il prompt completo, cifrato, e la sua apertura viene registrata nel log di audit.
captureOff=L’acquisizione del payload è disattivata: le richieste non lasciano contenuti qui. Le richieste di un’acquisizione grezza in corso lasciano qui i loro dati e conservano le loro fasi. L’acquisizione del payload si attiva nella scheda Interruttori e livelli.
payloadFilesOn=Il gateway scrive anche i payload di richieste e risposte in file: lo attiva PAYLOAD_LOGGING_ENABLED=true sul gateway oppure platform.logging.payload_logging_enabled nella configurazione. Questi file non sono mascherati in ogni fase e la loro lettura non viene registrata nel log di audit. Le tracce del payload e l’acquisizione grezza sono la via sottoposta ad audit; disattivate il log su file se non state facendo debug.
weakKeyMissing=Il servizio di amministrazione non ha METADATA_ENCRYPTION_KEY, quindi il contenuto acquisito viene sigillato con un valore di riserva pubblicamente noto: chiunque conosca quel valore può decifrare le fasi acquisite.
weakKeyTooShort=La METADATA_ENCRYPTION_KEY del servizio di amministrazione è più corta di 32 caratteri: chiunque ne conosca il valore può decifrare le fasi acquisite. Imposta un valore casuale lungo.
weakKeyPubliclyKnown=La METADATA_ENCRYPTION_KEY del servizio di amministrazione è un valore pubblicamente noto: chiunque lo conosca può decifrare le fasi acquisite. Imposta un valore casuale lungo.
