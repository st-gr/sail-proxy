captureOn=La capture de payload est activée : chaque requête laisse ici une trace avec ses données. Une requête masquée conserve son prompt et sa réponse masqués. Une requête non masquée conserve son prompt complet, chiffré, et son ouverture est consignée dans le journal d’audit.
captureOff=La capture de payload est désactivée : les requêtes ne laissent aucun contenu ici. Les requêtes d’une capture brute en cours laissent ici leurs données et conservent leurs étapes. La capture de payload s’active dans l’onglet Commutateurs et niveaux.
payloadFilesOn=Le gateway écrit aussi les payloads des requêtes et des réponses dans des fichiers : PAYLOAD_LOGGING_ENABLED=true sur le gateway, ou platform.logging.payload_logging_enabled dans la configuration, active cette écriture. Ces fichiers ne sont pas masqués à chaque étape, et leur lecture n’est pas consignée dans le journal d’audit. Les traces de payload et la capture brute sont la voie auditée ; désactivez la journalisation dans des fichiers sauf pour un débogage.
weakKeyMissing=Le service d’administration n’a pas de METADATA_ENCRYPTION_KEY : le contenu capturé est scellé avec une valeur de secours connue publiquement, et quiconque connaît cette valeur peut déchiffrer les étapes capturées.
weakKeyTooShort=La METADATA_ENCRYPTION_KEY du service d’administration fait moins de 32 caractères : quiconque connaît sa valeur peut déchiffrer les étapes capturées. Définissez une longue valeur aléatoire.
weakKeyPubliclyKnown=La METADATA_ENCRYPTION_KEY du service d’administration est une valeur connue publiquement : quiconque la connaît peut déchiffrer les étapes capturées. Définissez une longue valeur aléatoire.
