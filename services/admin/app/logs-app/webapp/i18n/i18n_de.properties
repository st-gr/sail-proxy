captureOn=Die Payload-Erfassung ist eingeschaltet: Jede Anfrage hinterlässt hier einen Trace mit ihren Eckdaten. Eine maskierte Anfrage behält ihren maskierten Prompt und ihre maskierte Antwort. Eine nicht maskierte Anfrage behält ihren vollständigen Prompt, verschlüsselt, und das Öffnen wird im Audit-Protokoll festgehalten.
captureOff=Die Payload-Erfassung ist ausgeschaltet: Anfragen hinterlassen hier keinen Inhalt. Die Anfragen einer laufenden Rohdatenerfassung hinterlassen hier ihre Eckdaten und behalten ihre Stufen. Die Payload-Erfassung wird auf dem Tab Schalter und Stufen geschaltet.
payloadFilesOn=Das Gateway schreibt außerdem Anfrage- und Antwort-Payloads in Dateien: PAYLOAD_LOGGING_ENABLED=true am Gateway oder platform.logging.payload_logging_enabled in der Konfiguration schaltet das ein. Diese Dateien sind nicht in jeder Stufe maskiert, und ihr Lesen wird nicht im Audit-Protokoll festgehalten. Payload-Traces und Rohdatenerfassung sind der protokollierte Weg; schalten Sie die Dateiprotokollierung aus, wenn Sie nicht gerade Fehler suchen.
weakKeyMissing=Der Admin-Service hat keinen METADATA_ENCRYPTION_KEY, daher wird erfasster Inhalt mit einem öffentlich bekannten Ersatzwert versiegelt: Wer diesen Wert kennt, kann die erfassten Stufen entschlüsseln.
weakKeyTooShort=Der METADATA_ENCRYPTION_KEY des Admin-Service ist kürzer als 32 Zeichen: Wer seinen Wert kennt, kann die erfassten Stufen entschlüsseln. Setzen Sie einen langen Zufallswert.
weakKeyPubliclyKnown=Der METADATA_ENCRYPTION_KEY des Admin-Service ist ein öffentlich bekannter Wert: Wer ihn kennt, kann die erfassten Stufen entschlüsseln. Setzen Sie einen langen Zufallswert.
