captureOn=A captura de payload está ativada: cada pedido deixa aqui um rastreio com os seus dados. Um pedido mascarado guarda o prompt e a resposta mascarados. Um pedido não mascarado guarda o prompt completo, encriptado, e abri-lo fica registado no registo de auditoria.
captureOff=A captura de payload está desativada: os pedidos não deixam conteúdo aqui. Os pedidos de uma captura em bruto em curso deixam aqui os seus dados e guardam as suas etapas. A captura de payload é ativada no separador Interruptores e níveis.
payloadFilesOn=O gateway também escreve em ficheiros os payloads dos pedidos e das respostas: ativa-o PAYLOAD_LOGGING_ENABLED=true no gateway ou platform.logging.payload_logging_enabled na configuração. Estes ficheiros não estão mascarados em todas as etapas, e a sua leitura não fica registada no registo de auditoria. Os rastreios de payload e a captura em bruto são a via auditada; desative o registo em ficheiros, exceto para depuração.
weakKeyMissing=O serviço de administração não tem METADATA_ENCRYPTION_KEY, pelo que o conteúdo capturado é selado com um valor de recurso publicamente conhecido: qualquer pessoa que conheça esse valor pode desencriptar as etapas capturadas.
weakKeyTooShort=A METADATA_ENCRYPTION_KEY do serviço de administração tem menos de 32 caracteres: qualquer pessoa que conheça o seu valor pode desencriptar as etapas capturadas. Defina um valor aleatório longo.
weakKeyPubliclyKnown=A METADATA_ENCRYPTION_KEY do serviço de administração é um valor publicamente conhecido: qualquer pessoa que o conheça pode desencriptar as etapas capturadas. Defina um valor aleatório longo.
