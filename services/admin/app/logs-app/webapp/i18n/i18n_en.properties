captureOn=Payload capture is on: every request leaves a trace here with its facts. A masked request keeps its masked prompt and answer. A request that is not masked keeps its full prompt, encrypted, and opening it is recorded in the audit log.
captureOff=Payload capture is off: requests leave no content here. The requests of a running raw capture leave their facts here and keep their stages. Payload capture is switched on the Switches and levels tab.
payloadFilesOn=The gateway also writes request and answer payloads to files: PAYLOAD_LOGGING_ENABLED=true on the gateway, or platform.logging.payload_logging_enabled in the configuration, switches this on. These files are not masked in every stage, and reading them is not recorded in the audit log. Payload traces and raw capture are the audited way; switch the file logger off unless you are debugging.
weakKeyMissing=The admin service has no METADATA_ENCRYPTION_KEY, so captured content is sealed with a publicly known fallback value: anyone who knows that value can decrypt the captured stages.
weakKeyTooShort=The METADATA_ENCRYPTION_KEY of the admin service is shorter than 32 characters: anyone who knows its value can decrypt the captured stages. Set a long random value.
weakKeyPubliclyKnown=The METADATA_ENCRYPTION_KEY of the admin service is a publicly known value: anyone who knows it can decrypt the captured stages. Set a long random value.
