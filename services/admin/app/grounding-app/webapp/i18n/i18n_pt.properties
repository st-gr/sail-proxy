reextractStartedRetryRefused=Nova leitura dos ficheiros iniciada. Não foi possível voltar a colocar em fila {0} ficheiros PowerPoint, Excel ou Word .doc agora: um lote deles ainda está a ser lido ou foi cancelado. Tente novamente mais tarde na lista de ficheiros.
reextractQueuedRetryRefused={0} ficheiros PowerPoint, Excel ou Word .doc estão novamente em fila. Não foi possível voltar a colocar {1} em fila agora: um lote deles ainda está a ser lido ou foi cancelado. Tente novamente mais tarde na lista de ficheiros.

