reextractErrSettingInvalid=A definição de fragmentação deste repositório vetorial não é válida, pelo que os seus ficheiros não podem voltar a ser fragmentados com ela. Altere antes a fragmentação.
reextractErrVisionModelUnavailable=A transcrição por visão não está disponível: está desativada neste gateway, ou o modelo de visão não está disponível ou não consegue ler imagens. Defina a visão da fragmentação como Desativada ou peça a um administrador que configure um modelo de visão disponível.
reextractRetryOnly={0} ficheiros PowerPoint, Excel ou Word .doc que não puderam ser lidos antes voltam a ser colocados em fila. Nenhum outro ficheiro precisa de ser lido novamente.
jobKind_reextract=Voltar a ler ficheiros
