shareWithTeamHint=Les membres de l’équipe peuvent rechercher dans ce magasin vectoriel et tester la récupération. Ils ne voient pas ses fichiers et ne peuvent pas le modifier.
chooseTeam=Équipe
shareConfirm=Partager
noTeamToShare=Vous n’administrez aucune équipe avec laquelle ce magasin vectoriel n’est pas déjà partagé.
detailTeamShares=Partagé avec des équipes
sharedWithOneTeam=Partagé avec 1 équipe
sharedWithTeams=Partagé avec {0} équipes
storeSharedWithTeam=Partagé avec {0}
storeUnsharedFromTeam=N’est plus partagé avec {0}
confirmUnshareTeam=Arrêter de partager ce magasin vectoriel avec {0} ?
unshareTeam=Arrêter le partage avec l’équipe
unknownTeam=Équipe {0}
errTeamAdminRequired=Seul un administrateur de cette équipe peut modifier ses partages.
errTeamNotFound=L’équipe n’existe plus.
