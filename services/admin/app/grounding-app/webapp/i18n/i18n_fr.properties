reextractIntro=Cette version lit mieux les fichiers PDF : elle lit par OCR les pages sans texte là où cette passerelle l’exécute, numérote les pages de chaque passage et applique le mode vision du magasin vectoriel. Les fichiers lus par une version antérieure sont relus avec le paramètre de segmentation actuel ; tous les autres fichiers sont conservés tels quels.
reextractEstimateNote=Tous les chiffres sont des estimations. Un PDF sans aucun texte compte pour le nombre maximal de pages que l’OCR ou la vision lit d’un fichier ; les pages sans texte d’autres PDF ne sont pas comptées. Les chiffres de vision sont des bornes supérieures.
reextractFiles=Fichiers relus
reextractKeptFiles=Fichiers conservés tels quels
reextractFilesWithoutText=Fichiers PDF sans texte
reextractRetryFiles=Fichiers PowerPoint, Excel et Word .doc remis en file
reextractRetryNote=Ces fichiers PowerPoint, Excel et Word .doc n’ont pas pu être lus auparavant. Ils sont remis en file et lus comme un nouveau téléversement ; leurs jetons sont comptés à la lecture.
reextractOcrUnavailable=L’OCR ne s’exécute pas sur cette passerelle : les pages sans texte restent sans texte, sauf si le mode vision du magasin vectoriel les lit.
reextractStart=Lancer la lecture
reextractStartNote=Les fichiers sont relus dans une tâche. La recherche continue d’utiliser les segments actuels jusqu’à la fin de la tâche ; une tâche annulée ou en échec les conserve.
reextractStarted=Relecture des fichiers lancée
reextractQueued=Les fichiers qui n’ont pas pu être lus auparavant sont remis en file
reextractRunningHint=Les fichiers de ce magasin vectoriel sont en cours de relecture. La recherche continue d’utiliser les segments actuels jusqu’à la fin.
reextractNothing=Chaque fichier de ce magasin vectoriel a été lu par la version actuelle ; il n’y a rien à relire.
reextractErrSettingInvalid=Le paramètre de segmentation de ce magasin vectoriel n’est pas valide ; ses fichiers ne peuvent donc pas être resegmentés avec lui. Modifiez plutôt la segmentation.
reextractErrVisionModelUnavailable=La transcription par vision n’est pas disponible : elle est désactivée sur cette passerelle, ou le modèle de vision n’est pas disponible ou ne lit pas les images. Réglez la vision de la segmentation sur Désactivée, ou demandez à un administrateur de configurer un modèle de vision disponible.
reextractRetryOnly={0} fichiers PowerPoint, Excel ou Word .doc qui n’ont pas pu être lus auparavant sont remis en file. Aucun autre fichier n’a besoin d’être relu.
jobKind_reextract=Relecture des fichiers
reextractRetryRefused=Les fichiers PowerPoint, Excel et Word .doc n’ont pas pu être remis en file pour l’instant : un de leurs lots est encore en lecture ou a été annulé. Réessayez-les plus tard dans la liste des fichiers.
reextractStartedRetryRefused=Relecture des fichiers lancée. {0} fichiers PowerPoint, Excel ou Word .doc n’ont pas pu être remis en file pour l’instant : un de leurs lots est encore en lecture ou a été annulé. Réessayez-les plus tard dans la liste des fichiers.
reextractQueuedRetryRefused={0} fichiers PowerPoint, Excel ou Word .doc sont remis en file. {1} n’ont pas pu être remis en file pour l’instant : un de leurs lots est encore en lecture ou a été annulé. Réessayez-les plus tard dans la liste des fichiers.

