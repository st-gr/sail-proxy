reextractOcrUnavailable=L’OCR non viene eseguito su questo gateway: le pagine senza testo restano senza testo, a meno che la modalità di visione dell’archivio vettoriale non le legga.
reextractStart=Avvia lettura
reextractStartNote=I file vengono riletti in un job. La ricerca continua a usare i segmenti attuali fino al termine del job; un job annullato o non riuscito li mantiene.
reextractStarted=Rilettura dei file avviata
reextractQueued=I file che non è stato possibile leggere prima sono di nuovo in coda
reextractRunningHint=I file di questo archivio vettoriale vengono riletti. La ricerca continua a usare i segmenti attuali fino al termine.
reextractNothing=Ogni file di questo archivio vettoriale è stato letto dalla versione attuale; non c’è nulla da rileggere.
reextractErrSettingInvalid=L’impostazione di segmentazione di questo archivio vettoriale non è valida, quindi i suoi file non possono essere risegmentati con essa. Modificare invece la segmentazione.
reextractErrVisionModelUnavailable=La trascrizione con visione non è disponibile: è disattivata su questo gateway, oppure il modello di visione non è disponibile o non legge immagini. Impostare la visione della segmentazione su Disattivata oppure chiedere a un amministratore di configurare un modello di visione disponibile.
reextractRetryOnly={0} file PowerPoint, Excel o Word .doc che non era possibile leggere prima vengono rimessi in coda. Nessun altro file deve essere riletto.
jobKind_reextract=Rilettura file
reextractRetryRefused=Non è stato possibile rimettere in coda ora i file PowerPoint, Excel e Word .doc: un loro batch è ancora in lettura o è stato annullato. Riprovarli più tardi nell’elenco dei file.
reextractStartedRetryRefused=Rilettura dei file avviata. Non è stato possibile rimettere in coda ora {0} file PowerPoint, Excel o Word .doc: un loro batch è ancora in lettura o è stato annullato. Riprovarli più tardi nell’elenco dei file.
reextractQueuedRetryRefused={0} file PowerPoint, Excel o Word .doc sono di nuovo in coda. Non è stato possibile rimetterne in coda ora {1}: un loro batch è ancora in lettura o è stato annullato. Riprovarli più tardi nell’elenco dei file.

