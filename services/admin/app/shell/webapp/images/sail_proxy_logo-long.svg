<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 -8 416 84" width="416" height="84">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33B1FF"/>
      <stop offset="100%" stop-color="#0A6ED1"/>
    </linearGradient>
  </defs>

  <!-- Tighter top-left spacing: minimal left/top padding -->
  <g transform="translate(8,58)">
    <text x="0" y="0"
          font-family="'JetBrains Mono', Menlo, Consolas, monospace"
          font-size="72" font-weight="700"
          fill="url(#textGrad)" letter-spacing="1">
      SAIL-PROXY
    </text>

    <!-- Dual underlines precisely under A and I (numeric positions, no expressions) -->
    <!-- Assume fixed char advance cw=44 px at this size; indices: S(0) A(1) I(2) -->
    <!-- A underline (slightly left and wider) -->
    <rect x="40" y="9" width="40" height="9" rx="0" fill="url(#textGrad)"/>
    <!-- I underline (slightly left and narrower) -->
    <rect x="86" y="9" width="29" height="9" rx="0" fill="url(#textGrad)"/>
  </g>
</svg>