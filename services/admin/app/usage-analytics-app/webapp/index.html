<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Analytics Dashboard</title>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.136.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.suite.ui.microchart,sap.viz,sap.ui.export"
        data-sap-ui-bindingSyntax="complex"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{
            "admin.usageanalytics": "./"
        }'>
    </script>
    <script>
        sap.ui.getCore().attachInit(function() {
            new sap.ui.core.ComponentContainer({
                name: "admin.usageanalytics",
                settings: {
                    id: "usage-analytics"
                }
            }).placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
