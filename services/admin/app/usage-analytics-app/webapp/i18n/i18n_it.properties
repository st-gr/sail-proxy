sapCostInfoTitle=Come viene calcolato il costo SAP
sapCostInfoHtml=<p>Il <strong>costo SAP</strong> è l’importo fatturato da SAP AI Core in Capacity Units, calcolato in base all’utilizzo di token registrato:<br/>token del modello &#8594; <strong>GenAI Tokens</strong> &#8594; <strong>Capacity Units</strong> &#8594; <strong>costo SAP</strong>.</p><p><strong>GenAI Tokens</strong> = inputTokens&#215;inputRate + outputTokens&#215;outputRate + (cacheReadTokens&#215;cacheReadFactor)&#215;cacheReadRate + (cacheWriteTokens&#215;cacheWriteFactor)&#215;cacheWriteRate + imageTokens&#215;imageRate.<br/>Le tariffe per modello provengono dalla tabella <strong>ModelCosts</strong> &#8212; i dati di individuazione dei modelli /v2 pubblicati da SAP (nota SAP 3437766, &#8220;GenAI tokens per 1,000 model tokens&#8221;), divise per 1.000. I fattori di cache allineano i conteggi di cache riportati dall’API a ciò che SAP misura effettivamente (ad es. lettura cache &#8776; 2&#215;).</p><p><strong>Capacity Units</strong> = GenAI Tokens &#215; <strong>fattore CU</strong> (1.90385, configurabile tramite platform.billing.cuFactor).</p><p><strong>Costo SAP</strong> = Capacity Units &#215; <strong>prezzo per CU</strong> (per tipo di utilizzo e periodo di validità, gestito in SAP Capacity Unit Prices).</p>
