sapCostInfoTitle=How SAP Cost is computed
sapCostInfoHtml=<p><strong>SAP Cost</strong> is the SAP AI Core Capacity-Unit billing amount, built from captured token usage:<br/>model tokens &#8594; <strong>GenAI Tokens</strong> &#8594; <strong>Capacity Units</strong> &#8594; <strong>SAP Cost</strong>.</p><p><strong>GenAI Tokens</strong> = inputTokens&#215;inputRate + outputTokens&#215;outputRate + (cacheReadTokens&#215;cacheReadFactor)&#215;cacheReadRate + (cacheWriteTokens&#215;cacheWriteFactor)&#215;cacheWriteRate + imageTokens&#215;imageRate.<br/>The per-model rates come from the <strong>ModelCosts</strong> table &#8212; the /v2 model-discovery data SAP publishes (SAP Note 3437766, &#8220;GenAI tokens per 1,000 model tokens&#8221;), divided by 1,000. The cache factors calibrate the API-reported cache counts to what SAP actually meters (e.g. cache-read &#8776; 2&#215;).</p><p><strong>Capacity Units</strong> = GenAI Tokens &#215; <strong>CU Factor</strong> (1.90385, configurable via platform.billing.cuFactor).</p><p><strong>SAP Cost</strong> = Capacity Units &#215; <strong>$/CU price</strong> (per usage type and validity period, maintained in SAP Capacity Unit Prices).</p>
