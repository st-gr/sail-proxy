sapCostInfoTitle=Cómo se calcula el costo de SAP
sapCostInfoHtml=<p>El <strong>costo de SAP</strong> es el importe facturado por SAP AI Core en Capacity Units, calculado a partir del uso de tokens registrado:<br/>tokens del modelo &#8594; <strong>GenAI Tokens</strong> &#8594; <strong>Capacity Units</strong> &#8594; <strong>costo de SAP</strong>.</p><p><strong>GenAI Tokens</strong> = inputTokens&#215;inputRate + outputTokens&#215;outputRate + (cacheReadTokens&#215;cacheReadFactor)&#215;cacheReadRate + (cacheWriteTokens&#215;cacheWriteFactor)&#215;cacheWriteRate + imageTokens&#215;imageRate.<br/>Las tarifas por modelo proceden de la tabla <strong>ModelCosts</strong> &#8212; los datos de descubrimiento de modelos /v2 que publica SAP (nota de SAP 3437766, &#8220;GenAI tokens per 1,000 model tokens&#8221;), divididas entre 1000. Los factores de caché ajustan los recuentos de caché que informa la API a lo que SAP mide realmente (p. ej., lectura de caché &#8776; 2&#215;).</p><p><strong>Capacity Units</strong> = GenAI Tokens &#215; <strong>factor CU</strong> (1.90385, configurable mediante platform.billing.cuFactor).</p><p><strong>Costo de SAP</strong> = Capacity Units &#215; <strong>precio por CU</strong> (por tipo de uso y periodo de validez, mantenido en SAP Capacity Unit Prices).</p>
