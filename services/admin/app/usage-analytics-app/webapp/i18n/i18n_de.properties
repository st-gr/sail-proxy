sapCostInfoTitle=So werden die SAP-Kosten berechnet
sapCostInfoHtml=<p><strong>SAP-Kosten</strong> sind der Abrechnungsbetrag von SAP AI Core in Capacity Units, berechnet aus der erfassten Token-Nutzung:<br/>Modell-Token &#8594; <strong>GenAI Tokens</strong> &#8594; <strong>Capacity Units</strong> &#8594; <strong>SAP-Kosten</strong>.</p><p><strong>GenAI Tokens</strong> = inputTokens&#215;inputRate + outputTokens&#215;outputRate + (cacheReadTokens&#215;cacheReadFactor)&#215;cacheReadRate + (cacheWriteTokens&#215;cacheWriteFactor)&#215;cacheWriteRate + imageTokens&#215;imageRate.<br/>Die Raten pro Modell stammen aus der Tabelle <strong>ModelCosts</strong> &#8212; den /v2-Modellerkennungsdaten, die SAP veröffentlicht (SAP-Hinweis 3437766, &#8222;GenAI tokens per 1,000 model tokens&#8220;), geteilt durch 1.000. Die Cache-Faktoren gleichen die von der API gemeldeten Cache-Zählungen an das an, was SAP tatsächlich misst (z. B. Cache-Lesen &#8776; 2&#215;).</p><p><strong>Capacity Units</strong> = GenAI Tokens &#215; <strong>CU-Faktor</strong> (1.90385, konfigurierbar über platform.billing.cuFactor).</p><p><strong>SAP-Kosten</strong> = Capacity Units &#215; <strong>Preis pro CU</strong> (je Nutzungsart und Gültigkeitszeitraum, gepflegt in SAP Capacity Unit Prices).</p>
