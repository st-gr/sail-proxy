sapCostInfoTitle=Zo worden de SAP-kosten berekend
sapCostInfoHtml=<p>De <strong>SAP-kosten</strong> zijn het factuurbedrag van SAP AI Core in Capacity Units, berekend uit het vastgelegde tokengebruik:<br/>modeltokens &#8594; <strong>GenAI Tokens</strong> &#8594; <strong>Capacity Units</strong> &#8594; <strong>SAP-kosten</strong>.</p><p><strong>GenAI Tokens</strong> = inputTokens&#215;inputRate + outputTokens&#215;outputRate + (cacheReadTokens&#215;cacheReadFactor)&#215;cacheReadRate + (cacheWriteTokens&#215;cacheWriteFactor)&#215;cacheWriteRate + imageTokens&#215;imageRate.<br/>De tarieven per model komen uit de tabel <strong>ModelCosts</strong> &#8212; de /v2-modeldetectiegegevens die SAP publiceert (SAP Note 3437766, &#8220;GenAI tokens per 1,000 model tokens&#8221;), gedeeld door 1.000. De cachefactoren stemmen de door de API gerapporteerde cachetellingen af op wat SAP werkelijk meet (bijv. cache lezen &#8776; 2&#215;).</p><p><strong>Capacity Units</strong> = GenAI Tokens &#215; <strong>CU-factor</strong> (1.90385, configureerbaar via platform.billing.cuFactor).</p><p><strong>SAP-kosten</strong> = Capacity Units &#215; <strong>prijs per CU</strong> (per gebruikstype en geldigheidsperiode, beheerd in SAP Capacity Unit Prices).</p>
