sapCostInfoTitle=Mode de calcul du coût SAP
sapCostInfoHtml=<p>Le <strong>coût SAP</strong> est le montant facturé par SAP AI Core en Capacity Units, calculé à partir de l’utilisation des jetons enregistrée :<br/>jetons du modèle &#8594; <strong>GenAI Tokens</strong> &#8594; <strong>Capacity Units</strong> &#8594; <strong>coût SAP</strong>.</p><p><strong>GenAI Tokens</strong> = inputTokens&#215;inputRate + outputTokens&#215;outputRate + (cacheReadTokens&#215;cacheReadFactor)&#215;cacheReadRate + (cacheWriteTokens&#215;cacheWriteFactor)&#215;cacheWriteRate + imageTokens&#215;imageRate.<br/>Les tarifs par modèle proviennent de la table <strong>ModelCosts</strong> &#8212; les données de découverte de modèles /v2 publiées par SAP (note SAP 3437766, &#8220;GenAI tokens per 1,000 model tokens&#8221;), divisés par 1 000. Les facteurs de cache ajustent les décomptes de cache signalés par l’API à ce que SAP mesure réellement (p. ex. lecture du cache &#8776; 2&#215;).</p><p><strong>Capacity Units</strong> = GenAI Tokens &#215; <strong>facteur CU</strong> (1.90385, configurable via platform.billing.cuFactor).</p><p><strong>Coût SAP</strong> = Capacity Units &#215; <strong>prix par CU</strong> (par type d’utilisation et période de validité, géré dans SAP Capacity Unit Prices).</p>
