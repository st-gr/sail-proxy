sapCostInfoTitle=Como é calculado o custo SAP
sapCostInfoHtml=<p>O <strong>custo SAP</strong> é o montante faturado pelo SAP AI Core em Capacity Units, calculado a partir da utilização de tokens registada:<br/>tokens do modelo &#8594; <strong>GenAI Tokens</strong> &#8594; <strong>Capacity Units</strong> &#8594; <strong>custo SAP</strong>.</p><p><strong>GenAI Tokens</strong> = inputTokens&#215;inputRate + outputTokens&#215;outputRate + (cacheReadTokens&#215;cacheReadFactor)&#215;cacheReadRate + (cacheWriteTokens&#215;cacheWriteFactor)&#215;cacheWriteRate + imageTokens&#215;imageRate.<br/>As tarifas por modelo provêm da tabela <strong>ModelCosts</strong> &#8212; os dados de descoberta de modelos /v2 que a SAP publica (nota SAP 3437766, &#8220;GenAI tokens per 1,000 model tokens&#8221;), divididas por 1000. Os fatores de cache ajustam as contagens de cache comunicadas pela API ao que a SAP efetivamente mede (p. ex., leitura de cache &#8776; 2&#215;).</p><p><strong>Capacity Units</strong> = GenAI Tokens &#215; <strong>fator CU</strong> (1.90385, configurável através de platform.billing.cuFactor).</p><p><strong>Custo SAP</strong> = Capacity Units &#215; <strong>preço por CU</strong> (por tipo de utilização e período de validade, mantido em SAP Capacity Unit Prices).</p>
