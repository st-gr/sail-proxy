<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration Management</title>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.136.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m,sap.f,sap.ui.core,sap.ui.codeeditor"
        data-sap-ui-resourceroots='{
            "admin.config": "./"
        }'
        data-sap-ui-onInit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-theme="sap_horizon">
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div data-sap-ui-component data-name="admin.config" data-id="container" data-settings='{"id" : "admin.config"}'></div>
</body>
</html>
