# Configuration form field texts by schema path - generated by ci/scripts/schema-texts.js.
# English is regenerated from the schema; other languages are translated in place and kept.
schema.providers.label=Aanbieders
schema.providers.description=Instellingen voor elke upstream-aanbieder, met de wire-naam in de route als sleutel (daarom behoudt `aws-bedrock` zijn koppelteken). Vandaag worden zes aanbieders gelezen - anthropic, aws-bedrock, google, openai, openrouter en perplexity; elke andere sleutel wordt geaccepteerd en gevalideerd, maar blijft inactief totdat de gateway hem kent. Elke benoemde aanbieder accepteert alleen zijn eigen lijst met instellingen, al blijven sommige geaccepteerde instellingen onder een bepaalde aanbieder inactief - de beschrijving van elk veld vermeldt waar het wordt gelezen; google is de smalste van de zes en bevat alleen substitute_models, gelezen door de route /google; elke andere algemene aanbiedersinstelling wordt eronder geweigerd in plaats van alleen inactief te blijven. Sleutels per aanbieder: https://st-gr.github.io/sail-proxy/developer/gateway#provider-configuration-keys
schema.providers.anthropic.label=Anthropic
schema.providers.anthropic.description=De aanbieder anthropic, bediend door het Anthropic-verzoekpad van de gateway: de instellingen die elke aanbieder heeft, plus de wire-versie van dat pad en de twee filters voor bètaflags.
schema.providers.anthropic.emulate_streaming_for_models.label=Streaming emuleren voor modellen
schema.providers.anthropic.emulate_streaming_for_models.description=Modellen waarvan de gateway het antwoord volledig verzamelt en daarna als stream afspeelt, omdat de deployment het zelf niet kan streamen. Vergeleken met de modelnaam die upstream wordt verzonden, exact of zonder het voorvoegsel 'provider--'. Vandaag alleen gebruikt voor de aanbieders anthropic en openai; een vermelding onder een andere aanbieder heeft geen effect.
schema.providers.anthropic.substitute_models.label=Vervangende modellen
schema.providers.anthropic.substitute_models.description=Modelhernoemingen voor deze aanbieder: een verzoek dat 'from' noemt (exacte overeenkomst, inclusief hoofdletters) wordt doorgestuurd als 'to'; de eerste overeenkomende vermelding wint en hernoemingen worden niet aan elkaar geschakeld. Het antwoord en het voor de kosten geregistreerde gebruik noemen dan het doorgestuurde model, niet de naam die de client heeft verzonden. Gelezen op de routes anthropic, aws-bedrock en google, op de chat-completions-route van openrouter en op de SAP RPT-predictieroutes (/sap/v1/rpt, uit de sap-rpt-lijst), elk voor de eigen aanbieder; op /openai/v1/chat/completions en /openai/v1/responses wordt eerst de openai-lijst geraadpleegd en daarna de perplexity-lijst.
schema.providers.anthropic.substitute_models.items.from.label=Van
schema.providers.anthropic.substitute_models.items.from.description=De modelnaam die de client verzendt.
schema.providers.anthropic.substitute_models.items.to.label=Naar
schema.providers.anthropic.substitute_models.items.to.description=De modelnaam die naar SAP AI Core wordt doorgestuurd, meestal een id van een gedeployed model zoals anthropic--claude-4.5-sonnet--deployed.
schema.providers.anthropic.substitute_models.items.description.label=Beschrijving
schema.providers.anthropic.substitute_models.items.description.description=Vrije notitie over deze hernoeming, voor wie de configuratie later leest. Wordt momenteel door de gateway genegeerd; verandert niets aan het gedrag van de hernoeming.
schema.providers.anthropic.unsupported_params.label=Niet-ondersteunde parameters
schema.providers.anthropic.unsupported_params.description=Verzoekparameters die deze aanbieder of dit model niet accepteert. De gateway verwijdert ze vóór het doorsturen naar SAP AI Core, dat het verzoek anders zou weigeren met 400 "does not support parameters: [...]". Een lijst per model vervangt de lijst op aanbiedersniveau in plaats van eraan toe te voegen.
schema.providers.anthropic.param_renames.label=Parameterhernoemingen
schema.providers.anthropic.param_renames.description=Parameterhernoemingen die op het directe deploymentpad worden toegepast, bijvoorbeeld max_tokens naar max_completion_tokens voor OpenAI-redeneermodellen die max_tokens weigeren. Een map per model vervangt de map op aanbiedersniveau in plaats van eraan toe te voegen.
schema.providers.anthropic.supports_responses_api.label=Ondersteunt de Responses API
schema.providers.anthropic.supports_responses_api.description=Of deze aanbieder of dit model via /openai/v1/responses mag worden bediend. Ontbreekt de waarde, dan blijft de ingebouwde familieregel gelden, die gedeployede GPT-5 en later en de o-serie toelaat.
schema.providers.anthropic.supports_prompt_caching.label=Ondersteunt promptcaching
schema.providers.anthropic.supports_prompt_caching.description=Of de modellen van deze aanbieder breekpunten voor de promptcache van Anthropic ontvangen. Volgorde van bepaling: de vlag per model models.overrides.<model>.supports_prompt_caching, dan deze vlag op aanbiedersniveau, dan een standaardwaarde true voor de aanbieder anthropic en false voor alle andere. False instellen waar caching wel werkt, kost bij elke beurt de volledige ongecachete invoerprijs, terwijl een onnodige true geen effect bleek te hebben - schakel het dus alleen uit voor een model waarvan bekend is dat het dit weigert.
schema.providers.anthropic.anthropic_bedrock_version.label=Anthropic Bedrock-versie
schema.providers.anthropic.anthropic_bedrock_version.description=De anthropic-version die de gateway naar SAP AI Core stuurt wanneer de client de header anthropic-version weglaat. Wordt alleen gelezen uit providers.anthropic, dus een kopie onder een andere aanbieder - aws-bedrock inbegrepen - heeft geen effect. Ontbreekt de waarde, dan wordt bedrock-2023-05-31 gebruikt.
schema.providers.anthropic.excluded_beta_headers.label=Uitgesloten bètaheaders
schema.providers.anthropic.excluded_beta_headers.description=Bètaflags van Anthropic die uit een verzoek worden verwijderd voordat het wordt doorgestuurd, voor functies die de SAP AI Core-deployment niet accepteert. Toegepast samen met de vlaggen die de gateway zelf in quarantaine plaatst na een upstream-400 'invalid beta flag'. Wordt alleen gelezen uit providers.anthropic; een lijst onder een andere aanbieder heeft geen effect.
schema.providers.anthropic.supported_beta_headers.label=Ondersteunde bètaheaders
schema.providers.anthropic.supported_beta_headers.description=Toelatingslijst van bètaflags van Anthropic: zolang die niet leeg is, worden alleen deze doorgestuurd, en excluded_beta_headers geldt daarbovenop nog steeds. Leeg of afwezig betekent helemaal geen toelatingslijst, dus elke vlag die de client heeft verzonden, gaat door - waardoor het toevoegen van een eerste vermelding hier stilzwijgend elke vlag laat vallen die er niet naast staat. Wordt alleen gelezen uit providers.anthropic.
schema.providers.anthropic.sap_cache_read_token_billing_factor.label=SAP-factureringsfactor voor cache-leestokens
schema.providers.anthropic.sap_cache_read_token_billing_factor.description=Kalibratiefactor die het AANTAL cache-LEES-invoertokens dat de model-API rapporteert, opschaalt naar het aantal dat SAP AI Core op zijn factuur meet, voor SAP-eigen kostenberekening in Capacity Units. Wordt gelezen door de beheerapp (niet door het verzoekpad van de gateway). Factuurafstemming over maart-juni 2026 toonde aan dat de SAP-factuurregel 'Cache Read Input Tokens' ~2x de cache_read_input_tokens is die de API teruggeeft en die sail-proxy getrouw vastlegt; het mechanisme is niet gedocumenteerd en wordt bij SAP nagevraagd. Let op: Anthropic en AWS Bedrock vermenigvuldigen de cache-PRIJS (lezen 0.1x, schrijven 1.25x/2x afhankelijk van de TTL), nooit het AANTAL tokens, dus dit is een kalibratie van de SAP-meting, niet het prijsmodel van Anthropic. De standaardwaarde 1.0 past geen correctie toe - stel deze (bijv. 2.0) pas in wanneer de navraag bij SAP de verhouding bevestigt.
schema.providers.anthropic.sap_cache_write_token_billing_factor.label=SAP-factureringsfactor voor cache-schrijftokens
schema.providers.anthropic.sap_cache_write_token_billing_factor.description=Kalibratiefactor die het AANTAL cache-SCHRIJF-invoertokens (aanmaak) dat de model-API rapporteert, opschaalt naar het aantal dat SAP AI Core op zijn factuur meet, voor SAP-eigen kostenberekening in Capacity Units. Wordt gelezen door de beheerapp (niet door het verzoekpad van de gateway). De afstemming over maart-juni 2026 van de SAP-regel 'Cache Write Input Tokens' tegen de door de API gerapporteerde cache_creation_input_tokens was van maand tot maand inconsistent (waarschijnlijk een effect van de grens van de factureringsperiode, omdat schrijfacties zich aan het begin van een sessie concentreren), dus anders dan bij de leesfactor is er geen eenduidige verhouding vastgesteld. De standaardwaarde 1.0 past geen correctie toe; laat deze op 1.0 staan, tenzij de navraag bij SAP een vaste schrijfverhouding vaststelt.
schema.providers.aws-bedrock.label=Aws-bedrock
schema.providers.aws-bedrock.description=De aanbieder aws-bedrock, bediend door hetzelfde verzoekpad in Anthropic-vorm: de instellingen die elke aanbieder heeft, plus de wire-versie van dat pad en de twee filters voor bètaflags - die de gateway in werkelijkheid allemaal uit providers.anthropic leest, dus een waarde hier wordt geaccepteerd en blijft inactief.
schema.providers.aws-bedrock.emulate_streaming_for_models.label=Streaming emuleren voor modellen
schema.providers.aws-bedrock.emulate_streaming_for_models.description=Modellen waarvan de gateway het antwoord volledig verzamelt en daarna als stream afspeelt, omdat de deployment het zelf niet kan streamen. Vergeleken met de modelnaam die upstream wordt verzonden, exact of zonder het voorvoegsel 'provider--'. Vandaag alleen gebruikt voor de aanbieders anthropic en openai; een vermelding onder een andere aanbieder heeft geen effect.
schema.providers.aws-bedrock.substitute_models.label=Vervangende modellen
schema.providers.aws-bedrock.substitute_models.description=Modelhernoemingen voor deze aanbieder: een verzoek dat 'from' noemt (exacte overeenkomst, inclusief hoofdletters) wordt doorgestuurd als 'to'; de eerste overeenkomende vermelding wint en hernoemingen worden niet aan elkaar geschakeld. Het antwoord en het voor de kosten geregistreerde gebruik noemen dan het doorgestuurde model, niet de naam die de client heeft verzonden. Gelezen op de routes anthropic, aws-bedrock en google, op de chat-completions-route van openrouter en op de SAP RPT-predictieroutes (/sap/v1/rpt, uit de sap-rpt-lijst), elk voor de eigen aanbieder; op /openai/v1/chat/completions en /openai/v1/responses wordt eerst de openai-lijst geraadpleegd en daarna de perplexity-lijst.
schema.providers.aws-bedrock.substitute_models.items.from.label=Van
schema.providers.aws-bedrock.substitute_models.items.from.description=De modelnaam die de client verzendt.
schema.providers.aws-bedrock.substitute_models.items.to.label=Naar
schema.providers.aws-bedrock.substitute_models.items.to.description=De modelnaam die naar SAP AI Core wordt doorgestuurd, meestal een id van een gedeployed model zoals anthropic--claude-4.5-sonnet--deployed.
schema.providers.aws-bedrock.substitute_models.items.description.label=Beschrijving
schema.providers.aws-bedrock.substitute_models.items.description.description=Vrije notitie over deze hernoeming, voor wie de configuratie later leest. Wordt momenteel door de gateway genegeerd; verandert niets aan het gedrag van de hernoeming.
schema.providers.aws-bedrock.unsupported_params.label=Niet-ondersteunde parameters
schema.providers.aws-bedrock.unsupported_params.description=Verzoekparameters die deze aanbieder of dit model niet accepteert. De gateway verwijdert ze vóór het doorsturen naar SAP AI Core, dat het verzoek anders zou weigeren met 400 "does not support parameters: [...]". Een lijst per model vervangt de lijst op aanbiedersniveau in plaats van eraan toe te voegen.
schema.providers.aws-bedrock.param_renames.label=Parameterhernoemingen
schema.providers.aws-bedrock.param_renames.description=Parameterhernoemingen die op het directe deploymentpad worden toegepast, bijvoorbeeld max_tokens naar max_completion_tokens voor OpenAI-redeneermodellen die max_tokens weigeren. Een map per model vervangt de map op aanbiedersniveau in plaats van eraan toe te voegen.
