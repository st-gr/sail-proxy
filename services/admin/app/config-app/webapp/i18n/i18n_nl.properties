schema.plugins.label=Plugins
schema.plugins.description=Instellingen van geïnstalleerde gateway-plugins, per plugin-id. Elke plugin documenteert zijn eigen instellingen; de gateway geeft een plugin zijn item ongewijzigd door, dus een plugin moet een onverwachte waarde kunnen verdragen. Items ontstaan door een plugin te installeren en worden hier niet handmatig ingevoerd.
