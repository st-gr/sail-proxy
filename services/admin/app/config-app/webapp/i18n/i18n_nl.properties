schema.providers.openrouter.default_pricing.label=Standaardprijzen
schema.providers.openrouter.default_pricing.description=Terugvalprijzen van OpenRouter - completion, image en prompt, elk een decimale tekenreeks. Worden momenteel door de gateway genegeerd; behouden zodat de meegeleverde waarde valideert en zichtbaar blijft voor een consument die later wordt toegevoegd. Bewerken verandert vandaag niets aan het gedrag.
schema.providers.openrouter.default_pricing.completion.label=Voltooiing
schema.providers.openrouter.default_pricing.completion.description=Prijs voor completiontokens, geschreven als decimale tekenreeks. Wordt momenteel door de gateway genegeerd, net als de rest van default_pricing: de modellijst in OpenRouter-formaat rapporteert in plaats daarvan eigen vaste prijzen.
schema.providers.openrouter.default_pricing.image.label=Afbeelding
schema.providers.openrouter.default_pricing.image.description=Prijs voor afbeeldingsinvoer, geschreven als decimale tekenreeks. Wordt momenteel door de gateway genegeerd, net als de rest van default_pricing: de modellijst in OpenRouter-formaat rapporteert in plaats daarvan eigen vaste prijzen.
schema.providers.openrouter.default_pricing.prompt.label=Prompt
schema.providers.openrouter.default_pricing.prompt.description=Prijs voor prompttokens, geschreven als decimale tekenreeks. Wordt momenteel door de gateway genegeerd, net als de rest van default_pricing: de modellijst in OpenRouter-formaat rapporteert in plaats daarvan eigen vaste prijzen.
schema.providers.openrouter.model_mappings.label=Modeltoewijzingen
schema.providers.openrouter.model_mappings.description=Standaardwaarden per upstream-aanbieder voor OpenRouter-verzoeken, waarvan de model-id’s als 'provider/model' worden geschreven. De eerste vermelding waarvan de aanbieder overeenkomt met het voorvoegsel van de id, zonder onderscheid tussen hoofd- en kleine letters, levert max_tokens wanneer de client die weglaat. Dat is het enige gebruikte veld: default_context_length en id_prefix zijn volgens dit schema verplicht, maar worden momenteel door de gateway genegeerd.
schema.providers.openrouter.model_mappings.items.default_context_length.label=Standaardcontextlengte
schema.providers.openrouter.model_mappings.items.default_context_length.description=Verplicht bij elke vermelding, maar wordt momenteel door de gateway genegeerd; behouden voor compatibiliteit.
schema.providers.openrouter.model_mappings.items.id_prefix.label=ID-voorvoegsel
schema.providers.openrouter.model_mappings.items.id_prefix.description=Verplicht bij elke vermelding, maar wordt momenteel door de gateway genegeerd; de vergelijking gebeurt op aanbieder, niet hierop.
schema.providers.openrouter.model_mappings.items.provider.label=Aanbieder
schema.providers.openrouter.model_mappings.items.provider.description=Wordt zonder onderscheid tussen hoofd- en kleine letters vergeleken met het deel van de model-id van de client vóór de schuine streep.
schema.providers.openrouter.model_mappings.items.max_tokens.label=Max. tokens
schema.providers.openrouter.model_mappings.items.max_tokens.description=Toegepast als max_tokens van het verzoek wanneer de client er geen verzendt. Ontbreekt de waarde, dan blijft het verzoek zonder.
schema.providers.perplexity.label=Perplexity
schema.providers.perplexity.description=De aanbieder perplexity: de instellingen die elke aanbieder heeft, en niets meer - het Perplexity-pad leest geen eigen instelling.
schema.providers.perplexity.emulate_streaming_for_models.label=Streaming emuleren voor modellen
schema.providers.perplexity.emulate_streaming_for_models.description=Modellen waarvan de gateway het antwoord volledig verzamelt en daarna als stream afspeelt, omdat de deployment het zelf niet kan streamen. Vergeleken met de modelnaam die upstream wordt verzonden, exact of zonder het voorvoegsel 'provider--'. Vandaag alleen gebruikt voor de aanbieders anthropic en openai; een vermelding onder een andere aanbieder heeft geen effect.
schema.providers.perplexity.substitute_models.label=Vervangende modellen
schema.providers.perplexity.substitute_models.description=Modelhernoemingen voor deze aanbieder: een verzoek dat 'from' noemt (exacte overeenkomst, inclusief hoofdletters) wordt doorgestuurd als 'to'; de eerste overeenkomende vermelding wint en hernoemingen worden niet aan elkaar geschakeld. Het antwoord en het voor de kosten geregistreerde gebruik noemen dan het doorgestuurde model, niet de naam die de client heeft verzonden. Gelezen op de routes anthropic, aws-bedrock en google, op de chat-completions-route van openrouter en op de SAP RPT-predictieroutes (/sap/v1/rpt, uit de sap-rpt-lijst), elk voor de eigen aanbieder; op /openai/v1/chat/completions en /openai/v1/responses wordt eerst de openai-lijst geraadpleegd en daarna de perplexity-lijst.
schema.providers.perplexity.substitute_models.items.from.label=Van
schema.providers.perplexity.substitute_models.items.from.description=De modelnaam die de client verzendt.
schema.providers.perplexity.substitute_models.items.to.label=Naar
schema.providers.perplexity.substitute_models.items.to.description=De modelnaam die naar SAP AI Core wordt doorgestuurd, meestal een id van een gedeployed model zoals anthropic--claude-4.5-sonnet--deployed.
schema.providers.perplexity.substitute_models.items.description.label=Beschrijving
schema.providers.perplexity.substitute_models.items.description.description=Vrije notitie over deze hernoeming, voor wie de configuratie later leest. Wordt momenteel door de gateway genegeerd; verandert niets aan het gedrag van de hernoeming.
schema.providers.perplexity.unsupported_params.label=Niet-ondersteunde parameters
schema.providers.perplexity.unsupported_params.description=Verzoekparameters die deze aanbieder of dit model niet accepteert. De gateway verwijdert ze vóór het doorsturen naar SAP AI Core, dat het verzoek anders zou weigeren met 400 "does not support parameters: [...]". Een lijst per model vervangt de lijst op aanbiedersniveau in plaats van eraan toe te voegen.
schema.providers.perplexity.param_renames.label=Parameterhernoemingen
schema.providers.perplexity.param_renames.description=Parameterhernoemingen die op het directe deploymentpad worden toegepast, bijvoorbeeld max_tokens naar max_completion_tokens voor OpenAI-redeneermodellen die max_tokens weigeren. Een map per model vervangt de map op aanbiedersniveau in plaats van eraan toe te voegen.
schema.providers.perplexity.supports_responses_api.label=Ondersteunt de Responses API
schema.providers.perplexity.supports_responses_api.description=Of deze aanbieder of dit model via /openai/v1/responses mag worden bediend. Ontbreekt de waarde, dan blijft de ingebouwde familieregel gelden, die gedeployede GPT-5 en later en de o-serie toelaat.
schema.providers.perplexity.supports_prompt_caching.label=Ondersteunt promptcaching
schema.providers.perplexity.supports_prompt_caching.description=Of de modellen van deze aanbieder breekpunten voor de promptcache van Anthropic ontvangen. Volgorde van bepaling: de vlag per model models.overrides.<model>.supports_prompt_caching, dan deze vlag op aanbiedersniveau, dan een standaardwaarde true voor de aanbieder anthropic en false voor alle andere. False instellen waar caching wel werkt, kost bij elke beurt de volledige ongecachete invoerprijs, terwijl een onnodige true geen effect bleek te hebben - schakel het dus alleen uit voor een model waarvan bekend is dat het dit weigert.
schema.providers._entry.description=De aanbiedersinstellingen die het verzoekpad van elke aanbieder kan bereiken, dus vijf van de zes benoemde aanbieders - allemaal behalve google - bevatten de volledige vorm. Elk veld is optioneel, en een ontbrekend veld betekent het ingebouwde gedrag van de gateway. Tegen deze vorm alleen wordt ook een aanbiedersleutel gevalideerd die de gateway niet leest: daar wordt een onbekende sleutel nog steeds geaccepteerd in plaats van geweigerd, en staat hij zonder effect in het bestand. Die vijf benoemde aanbieders voegen hun eigen instellingen hieraan toe en accepteren verder niets; google, de zesde, verwijst alleen naar het veld substitute_models van deze vorm en accepteert niets daarbuiten - de route /google leest nog geen andere aanbiedersinstelling.
schema.providers._entry.emulate_streaming_for_models.label=Streaming emuleren voor modellen
schema.providers._entry.emulate_streaming_for_models.description=Modellen waarvan de gateway het antwoord volledig verzamelt en daarna als stream afspeelt, omdat de deployment het zelf niet kan streamen. Vergeleken met de modelnaam die upstream wordt verzonden, exact of zonder het voorvoegsel 'provider--'. Vandaag alleen gebruikt voor de aanbieders anthropic en openai; een vermelding onder een andere aanbieder heeft geen effect.
schema.providers._entry.substitute_models.label=Vervangende modellen
schema.providers._entry.substitute_models.description=Modelhernoemingen voor deze aanbieder: een verzoek dat 'from' noemt (exacte overeenkomst, inclusief hoofdletters) wordt doorgestuurd als 'to'; de eerste overeenkomende vermelding wint en hernoemingen worden niet aan elkaar geschakeld. Het antwoord en het voor de kosten geregistreerde gebruik noemen dan het doorgestuurde model, niet de naam die de client heeft verzonden. Gelezen op de routes anthropic, aws-bedrock en google, op de chat-completions-route van openrouter en op de SAP RPT-predictieroutes (/sap/v1/rpt, uit de sap-rpt-lijst), elk voor de eigen aanbieder; op /openai/v1/chat/completions en /openai/v1/responses wordt eerst de openai-lijst geraadpleegd en daarna de perplexity-lijst.
schema.providers._entry.substitute_models.items.from.label=Van
schema.providers._entry.substitute_models.items.from.description=De modelnaam die de client verzendt.
schema.providers._entry.substitute_models.items.to.label=Naar
schema.providers._entry.substitute_models.items.to.description=De modelnaam die naar SAP AI Core wordt doorgestuurd, meestal een id van een gedeployed model zoals anthropic--claude-4.5-sonnet--deployed.
schema.providers._entry.substitute_models.items.description.label=Beschrijving
schema.providers._entry.substitute_models.items.description.description=Vrije notitie over deze hernoeming, voor wie de configuratie later leest. Wordt momenteel door de gateway genegeerd; verandert niets aan het gedrag van de hernoeming.
schema.providers._entry.unsupported_params.label=Niet-ondersteunde parameters
schema.providers._entry.unsupported_params.description=Verzoekparameters die deze aanbieder of dit model niet accepteert. De gateway verwijdert ze vóór het doorsturen naar SAP AI Core, dat het verzoek anders zou weigeren met 400 "does not support parameters: [...]". Een lijst per model vervangt de lijst op aanbiedersniveau in plaats van eraan toe te voegen.
schema.providers._entry.param_renames.label=Parameterhernoemingen
schema.providers._entry.param_renames.description=Parameterhernoemingen die op het directe deploymentpad worden toegepast, bijvoorbeeld max_tokens naar max_completion_tokens voor OpenAI-redeneermodellen die max_tokens weigeren. Een map per model vervangt de map op aanbiedersniveau in plaats van eraan toe te voegen.
schema.providers._entry.supports_responses_api.label=Ondersteunt de Responses API
schema.providers._entry.supports_responses_api.description=Of deze aanbieder of dit model via /openai/v1/responses mag worden bediend. Ontbreekt de waarde, dan blijft de ingebouwde familieregel gelden, die gedeployede GPT-5 en later en de o-serie toelaat.
schema.providers._entry.supports_prompt_caching.label=Ondersteunt promptcaching
schema.providers._entry.supports_prompt_caching.description=Of de modellen van deze aanbieder breekpunten voor de promptcache van Anthropic ontvangen. Volgorde van bepaling: de vlag per model models.overrides.<model>.supports_prompt_caching, dan deze vlag op aanbiedersniveau, dan een standaardwaarde true voor de aanbieder anthropic en false voor alle andere. False instellen waar caching wel werkt, kost bij elke beurt de volledige ongecachete invoerprijs, terwijl een onnodige true geen effect bleek te hebben - schakel het dus alleen uit voor een model waarvan bekend is dat het dit weigert.
schema.models.label=Modellen
schema.models.overrides.label=Overschrijvingen
schema.models.overrides.description=Aanpassingen per model die worden samengevoegd met de modellijst die de gateway bij SAP AI Core ophaalt. Elke sleutel is de interne id van een model, precies gespeld zoals die over de wire gaat.
schema.models.overrides._entry.description=Aanpassingen voor één model, samengevoegd met wat SAP AI Core ervoor rapporteert en hierboven met de interne id van het model als sleutel. Het samenvoegen is bewust open: elke sleutel die hieronder niet staat, wordt letterlijk naar het model gekopieerd en opnieuw in de modellijst gepubliceerd, ongevalideerd en ongetypeerd, in plaats van genegeerd. De velden hieronder zijn die waarop de gateway zelf reageert.
schema.models.overrides._entry.hooks.label=Hooks
schema.models.overrides._entry.hooks.description=Hooks voor dit model, met het verzoeksubpad dat ze activeren als sleutel (invoke, invoke-with-response-stream, converse, ...). Een subpad dat hier staat, VERVANGT de standaardwaarde van het endpoint in hooks.defaults voor dat subpad in plaats van ermee samen te voegen; een subpad dat hier niet staat, valt terug op die standaardwaarde. Een hook wordt alleen geactiveerd wanneer elke regel in zijn request.match klopt, en request.callback.id noemt de plug-in die wordt uitgevoerd.
schema.models.overrides._entry.hooks._entry.description=De hooklijst van één subpad, in volgorde geprobeerd. Dezelfde vorm dient voor hooks.defaults.<endpoint>.<subpath> en models.overrides.<model>.hooks.<subpath>, zodat de gateway één vorm ziet, welke van de twee die ook levert. Een hook wordt alleen geactiveerd wanneer ELKE regel die zijn request.match noemt, met het verzoek overeenkomt; request.callback.id noemt dan de plug-in die voor de lopende fase wordt uitgevoerd. Een hook waarvan de match niet klopt, of waarvan de callback geen voor die fase geregistreerde plug-in noemt, wordt overgeslagen en de volgende wordt geprobeerd - geen van beide is een fout tijdens runtime.
schema.models.overrides._entry.hooks._entry.items.request.label=Verzoek
schema.models.overrides._entry.hooks._entry.items.request.description=Wat moet overeenkomen en wat er wordt uitgevoerd als dat zo is. Vernoemd naar het verzoek, omdat de matcher alleen ooit het inkomende verzoek inspecteert; er is geen tegenhanger voor het antwoord, en verder wordt niets van een hook gelezen.
schema.models.overrides._entry.hooks._entry.items.request.callback.label=Callback
schema.models.overrides._entry.hooks._entry.items.request.callback.description=De plug-in die wordt uitgevoerd zodra elke regel in match overeenkomt.
schema.models.overrides._entry.hooks._entry.items.request.callback.id.label=ID
schema.models.overrides._entry.hooks._entry.items.request.callback.id.description=De id waaronder een plug-in zich heeft geregistreerd, opgezocht in het plug-inregister van de gateway voor de fase die wordt uitgevoerd. Dit schema kan de kruisverwijzing niet controleren: een id die geen plug-in voor die fase heeft geregistreerd, wordt gelogd als niet gevonden en de hook wordt overgeslagen, zodat het verzoek ongewijzigd doorgaat in plaats van te mislukken.
schema.models.overrides._entry.hooks._entry.items.request.match.label=Overeenkomst
schema.models.overrides._entry.hooks._entry.items.request.match.description=De regel-id’s die ALLEMAAL moeten overeenkomen, in volgorde geëvalueerd en afgebroken bij de eerste die niet overeenkomt. Elke id is een sleutel in hooks.definitions - een kruisverwijzing die dit schema niet kan controleren: een id die daar nergens is gedefinieerd, logt een waarschuwing en laat de hele hook niet overeenkomen, dus een typefout schakelt de plug-in stilzwijgend uit in plaats van hem onvoorwaardelijk te activeren. Een lege lijst wordt geweigerd, omdat een hook die op bijna alles moet draaien, wordt geschreven door in plaats daarvan een bewust brede regel te noemen - de meegeleverde payload:any komt overeen met elk verzoek waarvan de geparste body een niet-lege tekenreeks als model bevat, wat zo dicht bij onvoorwaardelijk komt als een regel kan komen en dat toch hardop zegt.
schema.models.overrides._entry.subpaths_native.label=Native subpaden
schema.models.overrides._entry.subpaths_native.description=De subpaden die dit model native bedient, in de eigen spelling van de gateway (invoke, invoke-with-response-stream, converse, converse-stream). Gelezen als de volledige lijst: zolang die aanwezig is, telt elk subpad dat erin ontbreekt als geëmuleerd. Ontbreekt de lijst, dan wordt teruggevallen op invoke plus invoke-with-response-stream. Vervangt de eigen waarde van de modellijst, wordt opnieuw gepubliceerd in de modelvermelding, en een vermelding die op -stream eindigt, voedt ook de regel streamingSupported hieronder.
schema.models.overrides._entry.subpaths_emulated.label=Geëmuleerde subpaden
schema.models.overrides._entry.subpaths_emulated.description=De subpaden die dit model via emulatie door de gateway bereikt in plaats van native. Er wordt niets op gerouteerd - een subpad telt als geëmuleerd simpelweg doordat het in subpaths_native ontbreekt - dus de lijst is alleen declaratief: hij vervangt de eigen waarde van de modellijst en wordt opnieuw gepubliceerd in de modelvermelding voor clients die hem inspecteren, en verder niets.
schema.models.overrides._entry.streamingSupported.label=Streaming ondersteund
schema.models.overrides._entry.streamingSupported.description=Of dit model streamingantwoorden ondersteunt; in camelCase omdat dat de eigen spelling van SAP AI Core in de modellijst is. Voor een model dat überhaupt een vermelding in overrides heeft: een expliciete true of false hier wint; anders betekent een vermelding in subpaths_native die op -stream eindigt true, tenzij de modellijst al false aangaf; anders wordt een model met deploymenttoegang dat een vermelding maar geen expliciete waarde heeft, op FALSE gezet - dus een vermelding toevoegen voor een streamingdeployment en deze vlag weglaten schakelt streaming uit. Een foundationmodel behoudt zijn AI Core-waarde. Het resultaat wordt op elke versie van het model toegepast.
schema.models.overrides._entry.supports_prompt_caching.label=Ondersteunt promptcaching
schema.models.overrides._entry.supports_prompt_caching.description=Of dit model breekpunten voor de promptcache van Anthropic ontvangt. Volgorde van bepaling: deze vlag per model, dan de vlag op aanbiedersniveau api_config.providers.<provider>.supports_prompt_caching, dan een standaardwaarde true voor modellen van de aanbieder Anthropic en false voor alle andere. Stel false in om een model uit te sluiten; een true op een Anthropic-model zonder overschrijving op aanbiedersniveau verandert niets.
schema.models.overrides._entry.anthropic_version.label=Anthropic-versie
schema.models.overrides._entry.anthropic_version.description=De anthropic_version die de gateway in de body van het Bedrock-invoke-verzoek van dit model plaatst wanneer de aanroeper er geen heeft meegegeven. Een body die het veld al bevat, blijft ongemoeid, en andere subpaden dan invoke worden niet aangeraakt. De meegeleverde waarde is bedrock-2023-05-31.
schema.models.overrides._entry.pseudonymization.label=Pseudonimisering
schema.models.overrides._entry.pseudonymization.description=Instellingen van de pseudonimiseringsplug-in. De activering (enabled) en de schakelaars per categorie (entities) gelden alleen voor deze plug-in; maskering vindt alleen plaats wanneer de plug-in daadwerkelijk voor een verzoek wordt uitgevoerd - hij moet in de hookketen zijn geregistreerd en er moet een activeringsbron worden geactiveerd.
schema.models.overrides._entry.pseudonymization.enabled.label=Ingeschakeld
schema.models.overrides._entry.pseudonymization.enabled.description=Dwingt maskering voor een verzoek af. Wordt alleen gelezen waar dit blok onder models.overrides.<model>.pseudonymization of hooks.defaults.<endpoint>.pseudonymization staat: true maskeert daar dat verzoek, waarbij het blok per model wint van het blok per endpoint. False of afwezig dwingt niets af - maskering kan nog steeds plaatsvinden wanneer een andere activeringsbron wordt geactiveerd, zoals een triggerwoord of een maskeringsveld in de body van het verzoek. Onder observability.pseudonymization wordt deze sleutel momenteel genegeerd; die laag levert elke andere instelling hier, behalve method en allow_user_bypass. Hoe dan ook moet de plug-in in de hookketen zijn aangesloten, anders wordt er helemaal niets gemaskeerd.
schema.models.overrides._entry.pseudonymization.method.label=Methode
schema.models.overrides._entry.pseudonymization.method.description=Maskeringsmodus: `pseudonymization` maskeert het verzoek en ontmaskert het antwoord; `anonymization` maskeert en ontmaskert nooit. Wordt alleen gelezen waar dit blok maskering afdwingt (een ingeschakelde hook of modeloverschrijving), niet onder `observability.pseudonymization`. Bepaalt ook de SIEM: alleen `pseudonymization` bewaart het gemaskeerde antwoord, dus onder `anonymization` krijgt een contentsink de prompt maar niet het antwoord. Weggelaten valt het terug op `pseudonymization`. Modi: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.models.overrides._entry.pseudonymization.allow_user_bypass.label=Omzeilen door gebruiker toestaan
schema.models.overrides._entry.pseudonymization.allow_user_bypass.description=Heeft alleen gevolgen binnen een blok dat maskering afdwingt (een ingeschakelde hook of modeloverschrijving); wordt niet gelezen onder `observability.pseudonymization`. Standaard false. Bij true kan een aanroeper maskering overslaan via de header `x-sail-proxy-pseudonymization: off` (hoofdletterongevoelig) of het bodyveld `pseudonymization_off: true`: de inhoud bereikt de LLM ongemaskeerd, en ook die sink waar een ingeschakelde SIEM-sink zowel `include_content` als `allow_unmasked_content` instelt. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.models.overrides._entry.pseudonymization.entities.label=Entiteiten
schema.models.overrides._entry.pseudonymization.entities.description=Maskeringsschakelaars per categorie: `true` maskeert de categorie op deze laag, `false` niet, en een categorie die niet wordt genoemd, erft de laag eronder (latere lagen winnen). De sleutels zijn de set bekende categorieën: de categorieën die standaard aan staan; drie opt-in-categorieën die uit staan bij levering (`profile-org`, `profile-location`, `profile-ip-address`); en `profile-sensitive-data`, een overkoepelende schakelaar die alle categorieën aanzet behalve die drie. Een sleutel buiten de set wordt hier geweigerd. Categorieën en lagen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.models.overrides._entry.pseudonymization.org_suffixes.label=Organisatieachtervoegsels
schema.models.overrides._entry.pseudonymization.org_suffixes.description=Achtervoegsels van rechtsvormen die een reeks woorden als organisatienaam markeren, bijv. Inc, LLC, GmbH. De vergelijking is bewust hoofdlettergevoelig, zodat een 'limited' in kleine letters in lopende tekst bewust niet als rechtsvorm wordt behandeld; elke vermelding komt bovendien overeen in volledig hoofdletters, zodat een factuur die ACME GMBH schreeuwt, wordt herkend als dezelfde organisatie als Acme GmbH. Heeft alleen effect zolang profile-org in entities is ingeschakeld; profile-org inschakelen met deze lijst leeg maskeert NIETS als organisatie en logt één waarschuwing. Elke vermelding wordt vóór de vergelijking bijgesneden, en een lege vermelding of een vermelding met alleen witruimte wordt stilzwijgend weggelaten in plaats van geweigerd.
schema.models.overrides._entry.pseudonymization.location_gazetteer.label=Locatiegazetteer
schema.models.overrides._entry.pseudonymization.location_gazetteer.description=Letterlijke locatietermen die de structurele detector maskeert - hoofdletterongevoelig, en alleen als heel woord of hele zinsnede; er wordt niets afgeleid uit hoofdlettergebruik of context. Heeft alleen effect zolang profile-location in entities is ingeschakeld; profile-location inschakelen met deze lijst leeg maskeert NIETS als locatie en logt één waarschuwing. Elke vermelding wordt bijgesneden, en een lege vermelding of een vermelding met alleen witruimte wordt stilzwijgend weggelaten. Wordt leeg geleverd: plaatsnamen zijn specifiek voor elke installatie en deze repository is openbaar, dus vul de lijst via deze beheerconfiguratieapp, nooit in bijgehouden code.
schema.models.overrides._entry.pseudonymization.min_confidence.label=Min. betrouwbaarheid
schema.models.overrides._entry.pseudonymization.min_confidence.description=Hoeveel bewijs een gedetecteerde waarde nodig heeft voordat deze wordt gemaskeerd, van 0 tot 1 (standaard 0.5). Een waarde wordt gemaskeerd zodra de score de drempel bereikt; een gewone naam met hoofdletter scoort ongeveer 0.5, een met een controlesom gevalideerd patroon 0.95, een aangepaste regel 1.0. Een hogere drempel laat eerst gewone namen vallen, dus maak een enkele luidruchtige categorie strenger met `thresholds`. Aangepaste regels, gevalideerde identificatoren en inloggegevens worden nooit door hun omgeving verlaagd. Details van de score: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.models.overrides._entry.pseudonymization.thresholds.label=Drempels
schema.models.overrides._entry.pseudonymization.thresholds.description=Betrouwbaarheidsdrempels per categorie, elk van 0 tot 1, die `min_confidence` overschrijven voor de genoemde categorieën; een niet-genoemde categorie behoudt `min_confidence`. De plek om streng te zijn voor één luidruchtige categorie - `profile-person` op 0.65 vraagt meer bewijs voor namen, terwijl gevalideerde identificatoren op de globale drempel blijven. De sleutels zijn dezelfde set bekende categorieën die `entities` accepteert; `profile-sensitive-data` wordt geaccepteerd maar doet niets. Afstemming per categorie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.models.overrides._entry.pseudonymization.allowlist.label=Toelatingslijst
schema.models.overrides._entry.pseudonymization.allowlist.description=Waarden die deze installatie nooit maskeert - een UIT-schakelaar, per waarde. Geraadpleegd vóór de betrouwbaarheidsscore, dus een vermelde waarde is vrijgesteld, hoeveel bewijs er ook is. Gebruik dit voor een terugkerend fout-positief met een eigen naam - een product- of rapporttitel die leest als een persoon. De lijsten van de lagen worden SAMENGEVOEGD, niet vervangen, dus een lagere laag voegt alleen een vrijstelling toe en laat er nooit een vallen. `terms` versus `patterns`, en het risico van te brede vermeldingen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.allowlist.terms.label=Termen
schema.models.overrides._entry.pseudonymization.allowlist.terms.description=Letterlijke waarden, vergeleken met de hele gedetecteerde waarde en HOOFDLETTERGEVOELIG. Bewust hoofdlettergevoelig: 'Watson Studio' is het product dat een beheerder wilde vrijstellen en 'watson studio' in een zin niet, en een hoofdletterongevoelige lijst zou ook een persoon vrijstellen wiens achternaam toevallig hetzelfde gespeld wordt. Een term komt alleen overeen met een waarde die de detectoren in zijn geheel hebben opgeleverd - 'Studio' vermelden stelt 'Watson Studio' niet vrij. Elke vermelding hier is een UIT-schakelaar voor maskering van precies die waarde, dus beperk de lijst tot waarden die werkelijk nooit persoonsgegevens zijn: een term die toevallig iemands naam is, stelt die persoon overal in deze installatie vrij van maskering, stilzwijgend en zonder iets in de log dat dit meldt.
schema.models.overrides._entry.pseudonymization.allowlist.patterns.label=Patronen
schema.models.overrides._entry.pseudonymization.allowlist.patterns.description=Reguliere expressies (JavaScript), elk vergeleken met de HELE gedetecteerde waarde: de gateway zet elke vermelding zelf tussen `^(?: )$`, dus schrijf `Z[A-Z0-9_]+`, niet `^Z[A-Z0-9_]+$`. De vergelijking is hoofdlettergevoelig. Elke vermelding is een UIT-schakelaar voor maskering, en een brede vermelding schakelt maskering uit zonder te mislukken - `[A-Z].*` schakelt bijna elke gedetecteerde persoonsnaam uit. Een overeenkomst met een ingebouwd PII-voorbeeld geeft een waarschuwing maar wordt TOCH toegepast. Houd elke vermelding smal. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.saturation_warn.label=Verzadigingswaarschuwing
schema.models.overrides._entry.pseudonymization.saturation_warn.description=Hoeveel VERSCHILLENDE gemaskeerde waarden één verzoek mag bevatten voordat het als verzadigd wordt gemeld (standaard 40). Alleen rapportage - het verandert nooit wat wordt gemaskeerd. Boven dit aantal logt de gateway per verzoek één waarschuwing met aantallen per categorie en de meest voorkomende waardeVORMEN (letters als X, cijfers als 9); er verschijnt nooit een gemaskeerde waarde. De SIEM-gebruiksgebeurtenis van het verzoek bevat dezelfde aantallen met een vlag `saturated` - aantallen, geen tekst. Het rapport lezen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.models.overrides._entry.pseudonymization.unknown_placeholders.label=Verzonnen plaatsaanduidingen
schema.models.overrides._entry.pseudonymization.unknown_placeholders.description=Wat er gebeurt wanneer een antwoord een gemaskeerde plaatsaanduiding bevat die nooit naar het model is verzonden. Modellen verzinnen er een in ongeveer 1 op de 125 gepseudonimiseerde antwoorden, en vaker naarmate een verzoek meer waarden maskeert; zo’n plaatsaanduiding noemt niemand en kan nooit worden opgelost. withhold (standaard): wordt vervangen door een eenvoudige markering zoals [name withheld] en gemeld als beveiligingsgebeurtenis. report: wordt alleen gemeld en bereikt de client ongewijzigd, voor een installatie waarvan de eigen ontwikkelaars via de gateway nieuwe plaatsaanduidingen in testgegevens schrijven. off: geen van beide. Een plaatsaanduiding die de client zelf in hetzelfde verzoek heeft verzonden, wordt nooit als verzonnen behandeld.
schema.models.overrides._entry.unsupported_params.label=Niet-ondersteunde parameters
schema.models.overrides._entry.unsupported_params.description=Verzoekparameters die deze aanbieder of dit model niet accepteert. De gateway verwijdert ze vóór het doorsturen naar SAP AI Core, dat het verzoek anders zou weigeren met 400 "does not support parameters: [...]". Een lijst per model vervangt de lijst op aanbiedersniveau in plaats van eraan toe te voegen.
schema.models.overrides._entry.param_renames.label=Parameterhernoemingen
schema.models.overrides._entry.param_renames.description=Parameterhernoemingen die op het directe deploymentpad worden toegepast, bijvoorbeeld max_tokens naar max_completion_tokens voor OpenAI-redeneermodellen die max_tokens weigeren. Een map per model vervangt de map op aanbiedersniveau in plaats van eraan toe te voegen.
schema.models.overrides._entry.supports_responses_api.label=Ondersteunt de Responses API
schema.models.overrides._entry.supports_responses_api.description=Of deze aanbieder of dit model via /openai/v1/responses mag worden bediend. Ontbreekt de waarde, dan blijft de ingebouwde familieregel gelden, die gedeployede GPT-5 en later en de o-serie toelaat.
schema.models.overrides._entry.cachePricing.label=Cacheprijzen
schema.models.overrides._entry.cachePricing.description=Promptcacheprijzen voor dit model; bewust in camelCase, de spelling cache_pricing wordt niet gelezen. Beide waarden zijn decimale kosten-TEKENREEKSEN per 1K tokens, nooit getallen: ze worden ongewijzigd overgenomen in de kostenlijst van elke versie en doorgegeven aan wat er ook om de cacheprijzen van dit model vraagt. Ontbreekt de waarde, dan rapporteert dit model helemaal geen cacheprijzen.
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.label=Invoerkosten cache lezen per 1K
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.description=Kosten voor het lezen van 1K gecachete invoertokens, als decimale tekenreeks - bijv. 0.00020, niet 0.0002e0 en geen getal.
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.label=Invoerkosten cache aanmaken per 1K
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.description=Kosten voor het schrijven van 1K invoertokens naar de cache, als decimale tekenreeks - bijv. 0.00254, geen getal.
schema.models.overrides._entry.inject_beta_features.label=Bètafuncties injecteren
schema.models.overrides._entry.inject_beta_features.description=Bètafunctievlaggen van Anthropic die de gateway toevoegt aan de Bedrock-invoke-verzoeken van dit model. Ze worden samengevoegd met de header anthropic-beta en een eventuele anthropic_beta in de body van het verzoek, en daarna gefilterd via supported_beta_headers, excluded_beta_headers en de quarantaine van bètaflags tijdens runtime - dus een vlag die hier staat, wordt toch weggelaten als hij niet wordt doorgelaten. Een lege lijst injecteert niets.
schema.models.overrides._entry.contextLength.label=Contextlengte
schema.models.overrides._entry.contextLength.description=Het contextvenster van dit model in tokens, alleen gebruikt als terugval: de gateway geeft de voorkeur aan de eigen contextlengte van de nieuwste versie uit SAP AI Core en leest deze waarde alleen wanneer de modellijst er geen bevat, voordat wordt teruggevallen op een standaardwaarde per familie. Wordt gerapporteerd als context_length, en de helft ervan als max_completion_tokens, in de modellijsten in OpenRouter- en OpenAI-formaat. 0 is geen bruikbare waarde.
schema.capabilities.label=Mogelijkheden
schema.capabilities.web_search.label=Zoeken op het web
schema.capabilities.web_search.description=Gehoste webzoektool (op basis van Perplexity). De enige instelling hier begrenst hoeveel zoekopdrachten één verzoek mag uitvoeren.
schema.capabilities.web_search.max_searches_per_request.label=Max. zoekopdrachten per verzoek
schema.capabilities.web_search.max_searches_per_request.description=Maximum aantal gehoste webzoekopdrachten dat één verzoek mag uitvoeren voordat de gateway stopt met het voortzetten van de beurt. Elke zoekopdracht kost een Perplexity-aanroep plus een volledige rondgang naar de deployment, dus dit is zowel een kostenbeheersing als de beëindigingsgarantie van de vervolglus. Een niet-gehele, nul-, negatieve of boven-10-waarde valt terug op de standaardwaarde 3 in plaats van te worden gerespecteerd - de grens mag nooit wegconfigureerbaar zijn.
schema.capabilities.file_search.label=Zoeken in bestanden
schema.capabilities.file_search.description=OpenAI-compatibele documentopvraging: opname via /v1/files, /v1/vector_stores, hybride zoeken en de gehoste tool file_search. Niets hier is verplicht - elk veld valt terug op zijn eigen meegeleverde standaardwaarde als het ontbreekt, dus een veld verwijderen is een geldige bewerking en geen fout.
schema.capabilities.file_search.enabled.label=Ingeschakeld
schema.capabilities.file_search.enabled.description=Hoofdschakelaar voor de hele functie, standaard true. Wordt gecombineerd met "er is een database geconfigureerd" en "de migratie is uitgevoerd": false laat elke route /v1/files en /v1/vector_stores antwoorden met 503 file_search_unavailable. De opnameworker (die ook het opnieuw inbedden uitvoert) en de twee opruimers controleren dit alleen bij het opstarten, dus start de gateway na een wijziging opnieuw. Reeds opgeslagen bestanden en stores blijven ongemoeid.
schema.capabilities.file_search.embedding_model.label=Embeddingmodel
schema.capabilities.file_search.embedding_model.description=Embeddingmodel dat bij de orkestratiedeployment van SAP AI Core wordt opgevraagd en bij elke teacher-loggebeurtenis wordt vastgelegd. Standaard text-embedding-3-large. Elke vector store behoudt het model waarmee hij is gebouwd: zijn zoekopdrachten en nieuwe bestanden gebruiken dat model, dus het wijzigen van deze instelling laat bestaande stores ongemoeid. Ze worden in de Grounding-cockpit als verouderd getoond, waar hun eigenaar of een beheerder ze met het nieuwe model opnieuw kan inbedden; tot dan antwoorden ze met hun oude vectoren. Een model met een andere vectorbreedte vereist ook een wijziging van embedding_dimensions, en opnieuw inbedden kan de breedte van een store niet veranderen.
schema.capabilities.file_search.embedding_dimensions.label=Embeddingdimensies
schema.capabilities.file_search.embedding_dimensions.description=Vectorbreedte, verzonden als parameter dimensions van het embeddingmodel en gebruikt om de vectorkolom aan te maken. Standaard 1536, en vast zodra er een store bestaat: een antwoordvector van een andere lengte wordt geweigerd, en elke store die aan de oude breedte vastzit, antwoordt met 409 - op een ZOEKOPDRACHT net zo goed als op een koppeling, dus hij beantwoordt geen query’s meer en kan nooit meer een bestand opnemen. Hij blijft wel op te sommen, op te halen en te verwijderen. Dit wijzigen op een gevulde installatie laat de stores dus stranden in plaats van ze te migreren: opnieuw inbedden vanuit de Grounding-cockpit behoudt de breedte van een store, dus zo’n store moet door een beheerder van de installatie worden gemigreerd.
schema.capabilities.file_search.rewrite_query.label=Query herschrijven
schema.capabilities.file_search.rewrite_query.description=Of POST /v1/vector_stores/{id}/search de query van de aanroeper via de orkestratiedeployment herschrijft voordat de embedding wordt berekend. Standaard false. Kost ongeveer 1.3s per zoekopdracht en is best-effort - een mislukte herschrijving valt terug op de oorspronkelijke query en laat de zoekopdracht nooit mislukken. Alleen dat REST-pad leest deze waarde, een rewrite_query per verzoek overschrijft hem, en de gehoste TOOL file_search geeft altijd false door, omdat het model de beurt van de gebruiker al in een query heeft omgezet.
schema.capabilities.file_search.rewrite_query_model.label=Model voor herschrijven van query
schema.capabilities.file_search.rewrite_query_model.description=Model dat voor de herschrijfaanroep wordt gebruikt, standaard gpt-5-mini. Configureerbaar in plaats van vast, omdat een modelnaam die op de ene SAP AI Core-tenant geldig is, door een andere kan worden geweigerd. Wordt alleen geraadpleegd wanneer rewrite_query aan staat.
schema.capabilities.file_search.hybrid.label=Hybride
schema.capabilities.file_search.hybrid.description=Terugvinden in fase 1 en optionele herrangschikking in fase 2. Fase 1 voert een rangschikking op vectorgelijkenis uit en - wanneer lexical_enabled - een full-textrangschikking, voegt de twee samen met reciprocal rank fusion en geeft de bovenste `candidates` chunks door aan de reranker.
schema.capabilities.file_search.hybrid.rrf_k.label=RRF-k
schema.capabilities.file_search.hybrid.rrf_k.description=Constante voor reciprocal rank fusion: elke rangschikking draagt 1/(k + rank) bij aan de samengevoegde score van een chunk. Standaard 60. Een grotere k verkleint het verschil tussen naburige posities, zodat overeenstemming tussen de twee rangschikkingen zwaarder weegt dan de eigen topresultaten van elk; een kleinere laat de top van elke rangschikking domineren. Wordt bij elke teacher-loggebeurtenis vastgelegd, dus een wijziging is zichtbaar in de labels.
schema.capabilities.file_search.hybrid.lexical_enabled.label=Lexicaal ingeschakeld
schema.capabilities.file_search.hybrid.lexical_enabled.description=Of de full-textrangschikking naast de vectorrangschikking draait. Standaard true. False voegt alleen de vectorrangschikking samen, dus exacte trefwoord- en identificatorovereenkomsten die embeddings missen, worden helemaal niet meer teruggevonden.
schema.capabilities.file_search.hybrid.lexical_query.label=Lexicale zoekopdracht
schema.capabilities.file_search.hybrid.lexical_query.description=Hoe de full-textrangschikking de zoekopdracht vergelijkt. "any" (standaard) houdt de woorden van de zoekopdracht die geen gangbare Engelse of Duitse stopwoorden en geen los teken (een losse letter of cijfer) zijn en vindt een chunk die er minstens één bevat, zodat een als zin geschreven vraag toch chunks met haar kernbegrippen vindt; chunks met meer van die begrippen staan hoger. "all" vindt alleen chunks die elk woord van de zoekopdracht bevatten, stopwoorden inbegrepen - het gedrag van eerdere versies, waaraan een vraag in natuurlijke taal zelden voldoet. Geldt alleen zolang lexical_enabled true is.
schema.capabilities.file_search.hybrid.candidates.label=Kandidaten
schema.capabilities.file_search.hybrid.candidates.description=Hoeveel samengevoegde chunks fase 1 terugvindt, standaard 50. Dit is de invoergrootte van de reranker en daarmee zijn kosten per zoekopdracht, en het is ook een harde bovengrens voor het antwoord: de max_num_results van de aanroeper wordt daarna toegepast, dus geen zoekopdracht kan meer chunks teruggeven dan dit.
schema.capabilities.file_search.hybrid.rerank.label=Herrangschikking
schema.capabilities.file_search.hybrid.rerank.description=Fase 2: een door SAP AI Core gehoste Cohere-cross-encoder scoort de kandidaten uit fase 1 tegen de query en geeft een gekalibreerde relevantiescore tussen 0 en 1 terug - de score waarop ranking_options.score_threshold filtert.
schema.capabilities.file_search.hybrid.rerank.enabled.label=Ingeschakeld
schema.capabilities.file_search.hybrid.rerank.enabled.description=Drie toestanden, en de drie waarden zijn geen gradaties van hetzelfde. false herrangschikt nooit: geen opzoeking van een deployment, geen aanroep, en de resultaten behouden hun samengevoegde volgorde. "auto" (de standaard) is best-effort - geen draaiende rerankerdeployment, of een mislukte, verlopen of misvormde aanroep, valt terug op de samengevoegde volgorde in plaats van de zoekopdracht te laten mislukken. true EIST fase 2: zowel "geen deployment gevonden" als "de aanroep is mislukt" laten de zoekopdracht dan mislukken, zodat een beheerder die om herrangschikking vroeg, nooit stilzwijgend niet-herrangschikte resultaten krijgt.
schema.capabilities.file_search.hybrid.rerank.model.label=Model
schema.capabilities.file_search.hybrid.rerank.model.description=De modelnaam waarmee zowel de reranker-deployment wordt gevonden - de eerste deployment met status RUNNING in het scenario foundation-models die een model met precies deze naam aanbiedt - als die bij de herrangschikkingsaanroep wordt meegestuurd. Standaard "cohere-reranker" - live geverifieerd tegen de tenant, en NIET de door SAP gepubliceerde "cohere-reranker-35". Dit is geen keuze van aanbieder: de gateway spreekt precies één herrangschikkingsprotocol en alleen de modelnaam varieert, daarom legt de teacher-log de aanbieder altijd vast als "cohere".
schema.capabilities.file_search.hybrid.rerank.input.label=Invoer
schema.capabilities.file_search.hybrid.rerank.input.description=Wat de reranker voor elke kandidaat-chunk leest. "context_and_text" (de standaard): de context van de chunk, als die er een heeft, gevolgd door de tekst; chunks zonder context (statische chunking) worden als hun tekst gelezen. "text": alleen de tekst van de chunk. De context verschijnt nooit in zoekresultaten.
schema.capabilities.file_search.ann.label=Benaderend zoeken
schema.capabilities.file_search.ann.description=Benaderend vectorzoeken voor grote vector stores, via de HNSW-index. Standaard uit: de vectorrangschikking vergelijkt de zoekopdracht dan met elke chunk van de doorzochte stores, wat exact is maar langer duurt naarmate de stores groter zijn. Ingeschakeld gebruikt een zoekopdracht de index alleen waar dat loont en blijft ze anders exact: met een attribuutfilter, wanneer ze hoogstens exact_max_chunks chunks of minder dan min_fraction van alle opgeslagen chunks doorzoekt, zolang de index nog niet het soort is dat de opdracht rebuild-index bouwt, en met pgvector ouder dan 0.8. Bij sommige vragen kan benaderend zoeken een volledige lijst passages geven die de meeste van de best passende chunks mist; meet daarom de recall op uw eigen gegevens met de recall-probe voordat u het inschakelt.
schema.capabilities.file_search.ann.enabled.label=Ingeschakeld
schema.capabilities.file_search.ann.enabled.description=Of zoekopdrachten over grote stores de HNSW-index gebruiken. Standaard false: elke zoekopdracht is exact. Geeft de index minder chunks terug dan gevraagd, dan wordt de zoekopdracht in plaats daarvan exact uitgevoerd.
schema.capabilities.file_search.ann.exact_max_chunks.label=Max. chunks voor exact zoeken
schema.capabilities.file_search.ann.exact_max_chunks.description=Een zoekopdracht over hoogstens zoveel chunks blijft exact, geteld over de stores die ze met één embeddingmodel doorzoekt. Standaard 20000. Hetzelfde getal bepaalt, of benaderend zoeken nu aan staat of niet, wanneer het full-textdeel van een zoekopdracht wordt begrensd: een zoekopdracht over meer chunks laat in haar zoekvraag op willekeurige woorden de woorden weg die in meer dan 5 procent van alle opgeslagen chunks voorkomen, en rangschikt de passages met alle woorden plus hoogstens 5000 andere full-texttreffers. Op een geanalyseerde tabel begrenst 0 het full-textdeel van elke zoekopdracht.
schema.capabilities.file_search.ann.min_fraction.label=Minimale fractie
schema.capabilities.file_search.ann.min_fraction.description=Een zoekopdracht over minder dan dit aandeel van alle opgeslagen chunks blijft exact: daar is exact zoeken sneller dan de index. Standaard 0.05 (5 procent).
schema.capabilities.file_search.chunking.label=Chunking
schema.capabilities.file_search.chunking.description=Hoe de documenten van een NIEUWE vectorstore in chunks worden opgedeeld. Een store neemt deze waarden over bij het aanmaken en houdt ze: ze hier wijzigen deelt een bestaande store nooit opnieuw op en verandert hem niet. De meegeleverde configuratie stelt "structure" in met 800 tokens zonder overlap, met contexten. Een sleutel die niet is ingesteld, betekent wat dit formulier ervoor toont: statische chunking zonder contexten; een configuratie van een eerdere versie, of een zonder dit blok, houdt dus statische chunking. Stores die zijn aangemaakt voordat deze instelling bestond, gebruiken statische chunking met 800/400. Een bestand dat met een expliciete statische chunking_strategy wordt gekoppeld, wordt in plaats daarvan met die strategie opgedeeld; "auto" of geen gebruikt de instelling van de store. De waarden worden gecontroleerd bij het aanmaken van een store: chunk_overlap_tokens mag niet meer zijn dan de helft van max_chunk_size_tokens, en contextual vereist de strategie "structure". Is de instelling ongeldig, dan krijgen nieuwe stores in plaats daarvan statische chunking met 800/400 en logt de gateway een waarschuwing.
schema.capabilities.file_search.chunking.strategy.label=Strategie
schema.capabilities.file_search.chunking.strategy.description="static" (de standaard indien niet ingesteld) deelt de tekst op in overlappende vensters van vaste grootte, zoals de statische strategie van OpenAI en eerdere versies. "structure" (ingesteld in de meegeleverde configuratie) volgt de secties en koppen van het document, zodat een chunk niet over een sectiegrens heen loopt; zo opgedeelde bestanden melden via de OpenAI-API het chunkingstrategietype "other". Contextual inschakelen vereist "structure".
schema.capabilities.file_search.chunking.max_chunk_size_tokens.label=Max. chunkgrootte in tokens
schema.capabilities.file_search.chunking.max_chunk_size_tokens.description=Grootste chunk, in tokens, tussen 100 en 4096. Standaard 800. Bij "static" is de grootte een schatting (aantal woorden maal 1.3); bij "structure" wordt ze met een echte tokenizer geteld.
schema.capabilities.file_search.chunking.chunk_overlap_tokens.label=Chunkoverlap in tokens
schema.capabilities.file_search.chunking.chunk_overlap_tokens.description=Hoeveel tokens elke chunk van zijn voorganger herhaalt, zodat een passage die over een grens is gesplitst toch in zijn geheel wordt gevonden. Indien niet ingesteld: 0 bij "structure", 400 bij "static". Mag niet meer zijn dan de helft van max_chunk_size_tokens. Bij "structure" geldt de overlap alleen binnen een sectie die meer dan één chunk nodig heeft.
schema.capabilities.file_search.chunking.contextual.label=Contextueel
schema.capabilities.file_search.chunking.contextual.description=Of elke chunk ook een korte context krijgt, geschreven door een taalmodel, die hem in zijn document plaatst en samen met hem wordt doorzocht. Uit indien niet ingesteld. Vereist de strategie "structure"; voegt bij de opname één modelaanroep per chunk toe, vastgelegd als gebruik van de eigenaar van de store.
schema.capabilities.file_search.contextual.label=Chunkcontexten
schema.capabilities.file_search.contextual.description=Hoe chunkcontexten worden geschreven voor vectorstores waarvan de chunkinginstelling contextueel is: bij de opname schrijft een taalmodel voor elke chunk een korte context, die samen met de chunk wordt doorzocht. Deze waarden zetten contextuele chunking niet aan; dat doet de chunkinginstelling van de store. Een mislukte of verlopen aanroep laat die chunk zonder context en laat het bestand nooit mislukken.
schema.capabilities.file_search.contextual.model.label=Model
schema.capabilities.file_search.contextual.model.description=Het SAP AI Core-orchestratiemodel dat de contexten schrijft. Standaard "gemini-3.5-flash-lite". Als het model niet beschikbaar is, worden bestanden zonder contexten opgenomen. Het document wordt met elke chunk van een bestand meegestuurd; Claude-modellen cachen het tussen deze aanroepen, andere modellen waar ze dat uit zichzelf doen.
schema.capabilities.file_search.contextual.max_document_tokens.label=Max. documentgrootte in tokens
schema.capabilities.file_search.contextual.max_document_tokens.description=Grootste document, in tokens, dat in zijn geheel met elke chunk wordt meegestuurd, tussen 8192 en 200000. Standaard 32000. Een langer document wordt meegestuurd als een uittreksel van deze grootte rond de chunk. Grotere waarden geven elke context meer van het document, maar kosten meer invoertokens per chunk.
schema.capabilities.file_search.contextual.concurrency.label=Gelijktijdigheid
schema.capabilities.file_search.contextual.concurrency.description=Hoeveel contextaanroepen voor één bestand tegelijk lopen, tussen 1 en 16. Standaard 4. De eerste chunk van een bestand loopt altijd alleen.
schema.capabilities.file_search.contextual.request_timeout_ms.label=Time-out per aanvraag (ms)
schema.capabilities.file_search.contextual.request_timeout_ms.description=Tijdslimiet van één contextaanroep, in milliseconden. Standaard 30000. Een aanroep die langer duurt, laat zijn chunk zonder context.
schema.capabilities.file_search.contextual.file_deadline_ms.label=Deadline per bestand (ms)
schema.capabilities.file_search.contextual.file_deadline_ms.description=Tijd, in milliseconden, waarna voor een bestand geen nieuwe contextaanroep meer start. Standaard 360000 (6 minuten). De overige chunks worden zonder context opgeslagen; het bestand wordt toch opgenomen.
schema.capabilities.file_search.contextual.max_input_tokens_per_file.label=Max. invoertokens per bestand
schema.capabilities.file_search.contextual.max_input_tokens_per_file.description=Invoertokens die de contextaanroepen van één bestand mogen gebruiken, tokens uit de cache inbegrepen, tussen 10000 en 1000000000. Standaard 20000000. Zodra een bestand ze heeft gebruikt, start er voor dat bestand geen nieuwe contextaanroep meer; de overige chunks worden zonder context opgeslagen en het bestand wordt toch opgenomen.
schema.capabilities.file_search.parent_sections.label=Bovenliggende secties
schema.capabilities.file_search.parent_sections.description=Hoe zoekresultaten uit vectorstores met chunking op structuur worden uitgebreid tot de sectie waaruit ze komen, zodat het model een treffer in zijn context leest. Meerdere treffers in één sectie worden één keer teruggegeven, als die sectie. Resultaten uit stores met statische chunking worden ongewijzigd teruggegeven.
schema.capabilities.file_search.parent_sections.max_tokens.label=Max. tokens
schema.capabilities.file_search.parent_sections.max_tokens.description=Grootste teruggegeven bovenliggende sectie, in tokens, tussen 200 en 8000. Standaard 1500. Een langere sectie wordt teruggegeven als een uittreksel van deze grootte rond de treffer; een treffer die op zichzelf al langer is, wordt alleen teruggegeven.
schema.capabilities.file_search.parent_sections.scope.label=Bereik
schema.capabilities.file_search.parent_sections.scope.description=Waar resultaten als bovenliggende secties worden teruggegeven: "tool" (de standaard) alleen in de file_search-tool van de Responses-API; "all" ook in het zoekeindpunt van de vectorstores, dat anders de overeenkomende chunks teruggeeft; "off" nergens.
schema.capabilities.file_search.limits.label=Limieten
schema.capabilities.file_search.limits.description=Harde bovengrenzen voor wat mag worden geüpload, geëxtraheerd en gekoppeld. Elke grens wordt afgedwongen waar die van toepassing is in plaats van door dit schema, dus deze waarden worden live gelezen en werken zonder herstart.
schema.capabilities.file_search.limits.max_file_bytes.label=Max. bytes per bestand
schema.capabilities.file_search.limits.max_file_bytes.description=De grootste upload die POST /v1/files accepteert, standaard 33554432 bytes (32 MiB). Afgedwongen TERWIJL de upload wordt gelezen in plaats van erna, dus een te grote body wordt afgekapt in plaats van in het geheugen te worden gebufferd, en de aanroeper krijgt een nette 4xx die de limiet noemt.
schema.capabilities.file_search.limits.max_tokens_per_file.label=Max. tokens per bestand
schema.capabilities.file_search.limits.max_tokens_per_file.description=Het grootste geëxtraheerde document, in geschatte tokens; standaard 5000000. Een bestand boven de limiet mislukt DEFINITIEF in plaats van opnieuw te worden geprobeerd. Deze waarde verlagen controleert reeds opgenomen bestanden niet opnieuw.
schema.capabilities.file_search.limits.max_files_per_store.label=Max. bestanden per vectoropslag
schema.capabilities.file_search.limits.max_files_per_store.description=Bovengrens voor het aantal bestanden dat aan één vectorstore is gekoppeld, standaard 10000. Begrenst de file_ids die worden geaccepteerd bij het aanmaken van een store - naast een harde limiet van 500 bestands-id’s per aanroep voor aanmaken of een bestandsbatch - en weigert een koppeling of bestandsbatch die de store boven deze grens zou brengen.
schema.capabilities.file_search.ingestion.label=Opname
schema.capabilities.file_search.ingestion.description=De achtergrondworker die een gekoppeld bestand extraheert, in chunks opdeelt, embedt en opslaat, en de bestanden van een store opnieuw inbedt waarvan het embeddingmodel wordt gewijzigd - uploads eerst. Hij haalt werk uit dezelfde file_search-databasepool die het zoekpad gebruikt, dus deze instellingen wegen de opnamedoorvoer af tegen de zoeklatentie.
schema.capabilities.file_search.ingestion.concurrency.label=Gelijktijdigheid
schema.capabilities.file_search.ingestion.concurrency.description=Hoeveel claim-en-verwerklussen de worker start, standaard 4; dezelfde lussen voeren ook het opnieuw inbedden uit. Elke lus neemt voor zijn databasestappen verbindingen uit de file_search-pool van 10 verbindingen. Wordt eenmaal bij het opstarten gelezen, dus een wijziging vereist een herstart.
schema.capabilities.file_search.ingestion.extract_timeout_ms.label=Time-out voor extractie (ms)
schema.capabilities.file_search.ingestion.extract_timeout_ms.description=Tijdslimiet voor het omzetten van één document naar tekst met een externe converter - PDF, docx, odt, epub en rst -, standaard 60000 ms. Platte-tekstformaten worden rechtstreeks gedecodeerd en hebben geen limiet. Een time-out laat die poging mislukken, niet de batch; het bestand wordt tot max_retries keer opnieuw geprobeerd.
schema.capabilities.file_search.ingestion.max_retries.label=Max. nieuwe pogingen
schema.capabilities.file_search.ingestion.max_retries.description=Pogingen per bestand voordat het als mislukt geldt, standaard 3; hetzelfde budget geldt voor elk bestand bij het opnieuw inbedden. Een geheel getal van 1 of meer wordt gebruikt zoals geschreven. 0 wordt met een waarschuwing als 1 gelezen - letterlijk genomen zou het elk gekoppeld bestand vóór zijn eerste poging laten mislukken. Al het andere - negatief, gebroken, niet-numeriek - telt als niet ingesteld en valt terug op 3, ook met een waarschuwing.
schema.capabilities.file_search.parsing.label=Documentverwerking
schema.capabilities.file_search.parsing.description=Hoe geüploade documenten worden gelezen voordat ze in chunks worden opgedeeld.
schema.capabilities.file_search.parsing.ocr.label=Tekstherkenning (OCR)
schema.capabilities.file_search.parsing.ocr.description=Tekstherkenning voor PDF-pagina's zonder tekstlaag, zoals scans. Ze draait waar het programma tesseract is geïnstalleerd (de Docker- en Kyma-images leveren het met Engels); de zelfstandige npm-CLI voert ze nooit uit.
schema.capabilities.file_search.parsing.ocr.languages.label=OCR-talen
schema.capabilities.file_search.parsing.ocr.languages.description=Tesseract-taalcodes die op een pagina worden herkend, zoals eng, deu of chi_sim; standaard eng. Voor een code moeten de taalgegevens geïnstalleerd zijn waar de gateway draait; een niet-geïnstalleerde code wordt overgeslagen met een waarschuwing in het gateway-log. Elke extra taal maakt OCR trager.
schema.capabilities.file_search.parsing.vision.label=Vision-transcriptie
schema.capabilities.file_search.parsing.vision.description=Transcriptie van lastige PDF-pagina’s door een vision-model van SAP AI Core: een pagina wordt als afbeelding verstuurd en het model schrijft de tekst ervan uit, tabellen inbegrepen. Ze draait alleen voor vectorstores waarvan de chunkinginstelling een vision-modus heeft (standaard uit; de modus van een store wijzigen chunkt de store opnieuw). Elke pagina is één modelaanroep, vastgelegd als gebruik van de eigenaar van de store; een pagina waarvan de aanroep mislukt, houdt haar tekst of gaat naar de tekstherkenning (OCR). Paginabeelden worden niet gemaskeerd: waar pseudonimisering is afgedwongen voor file_search-inhoud (voor het openai-eindpunt of voor een model), bereiken ze het model ongemaskeerd, en de cockpit en het gatewaylogboek waarschuwen daarvoor. Maskering die één aanvraag vraagt (een triggerwoord of een maskeringsveld) is niet te voorzien en wordt niet gemeld. De zelfstandige npm-CLI voert ze nooit uit.
schema.capabilities.file_search.parsing.vision.model.label=Model
schema.capabilities.file_search.parsing.vision.model.description=Het SAP AI Core-orchestratiemodel dat de pagina’s transcribeert; het moet afbeeldingen kunnen lezen. Standaard "gemini-3.5-flash-lite". Als het model niet beschikbaar is, kan geen vectorstore naar een vision-modus worden omgezet.
schema.capabilities.file_search.parsing.vision.default_mode.label=Standaardmodus
schema.capabilities.file_search.parsing.vision.default_mode.description=De vision-modus die nieuwe vectorstores krijgen: off (de standaard, geen vision-aanroepen), no_text (pagina’s zonder tekstlaag, zoals scans), auto (die, pagina’s met weinig tekst zoals figuren, en pagina’s met veel tabellen) of all (elke pagina). Bestaande stores houden hun eigen modus. Waar pseudonimisering is afgedwongen voor file_search-inhoud, bereiken de paginabeelden het model ongemaskeerd (er wordt een waarschuwing getoond); hetzelfde geldt, zonder waarschuwing, voor maskering die één aanvraag vraagt.
schema.capabilities.file_search.parsing.vision.max_pages_per_file.label=Max. pagina’s per bestand
schema.capabilities.file_search.parsing.vision.max_pages_per_file.description=Hoogste aantal pagina’s van één bestand dat naar het model wordt gestuurd, tussen 1 en 1000. Standaard 50. De overige pagina’s houden hun tekst of gaan naar de tekstherkenning (OCR).
schema.capabilities.file_search.parsing.vision.concurrency.label=Gelijktijdigheid
schema.capabilities.file_search.parsing.vision.concurrency.description=Hoeveel pagina’s van één bestand tegelijk worden getranscribeerd, tussen 1 en 8. Standaard 2.
schema.capabilities.file_search.parsing.vision.request_timeout_ms.label=Time-out per aanvraag (ms)
schema.capabilities.file_search.parsing.vision.request_timeout_ms.description=Tijdslimiet van de aanroep van één pagina, in milliseconden. Standaard 90000. Een pagina waarvan de aanroep langer duurt, houdt haar tekst of gaat naar de tekstherkenning (OCR).
schema.capabilities.file_search.parsing.vision.file_deadline_ms.label=Deadline per bestand (ms)
schema.capabilities.file_search.parsing.vision.file_deadline_ms.description=Langste tijd, in milliseconden, die vision aan één bestand mag besteden, en hoogstens 40 % van de resterende tijd voor de opname van het bestand. Standaard 240000 (4 minuten). Daarna start er geen pagina meer; het bestand wordt toch opgenomen.
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.label=Max. invoertokens per bestand
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.description=Invoertokens die de aanroepen van één bestand mogen gebruiken, tussen 10000 en 100000000. Standaard 150000 (een pagina gebruikt er ongeveer 1250). Zodra een bestand ze heeft gebruikt, start er voor dat bestand geen pagina meer.
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.label=Max. uitvoertokens per bestand
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.description=Uitvoertokens die de aanroepen van één bestand mogen gebruiken, tussen 10000 en 100000000. Standaard 120000. Zodra een bestand ze heeft gebruikt, start er voor dat bestand geen pagina meer.
schema.capabilities.file_search.blob_storage.label=Blobopslag
schema.capabilities.file_search.blob_storage.description=Waar de ruwe geüploade bytes staan. Inhoud wordt geadresseerd op zijn sha256-hash en met referentietelling bijgehouden, dus twee uploads met identieke inhoud slaan één kopie op. De instelling wordt bij elke toegang opnieuw gelezen, dus een wijziging werkt zonder herstart.
schema.capabilities.file_search.blob_storage.backend.label=Backend
schema.capabilities.file_search.blob_storage.backend.description=Waar NIEUWE uploads worden opgeslagen. "db", de standaard, houdt de bytes in de Postgres-database van file_search. "s3" schrijft ze als objecten naar de hieronder geconfigureerde bucket (AWS of een S3-compatibel endpoint) en houdt in de database alleen hun sleutel bij. Omschakelen verplaatst niets: elke blob wordt gelezen uit de opslag waarin hij is geschreven, dus bestaande blobs blijven leesbaar zolang die opslag bereikbaar is, en een migratie vanuit het paneel Blobopslag van Grounding-beheer verplaatst ze. "local" wordt niet ondersteund: elke upload antwoordt dan met 503 file_search_unavailable.
schema.capabilities.file_search.blob_storage.local_path.label=Lokaal pad
schema.capabilities.file_search.blob_storage.local_path.description=Hoofdmap in het bestandssysteem, gereserveerd voor een backend "local", standaard /var/lib/sail-proxy/blobs. De gateway ondersteunt "local" niet (zie backend), dus deze waarde wordt niet gelezen.
schema.capabilities.file_search.blob_storage.s3.label=S3
schema.capabilities.file_search.blob_storage.s3.description=Bucketcoördinaten voor de backend "s3". Inloggegevens worden hier niet geconfigureerd: ze komen uit de omgevingsvariabelen FILE_SEARCH_S3_ACCESS_KEY_ID en FILE_SEARCH_S3_SECRET_ACCESS_KEY van de gateway. Wordt gelezen bij elke toegang tot een in S3 opgeslagen blob - ook wanneer backend "db" is en er nog blobs in S3 staan - en door een migratie naar of vanuit S3. Het wijzigen van bucket, endpoint of prefix verplaatst geen objecten: blobs die onder de vorige waarden zijn geschreven, zijn niet leesbaar totdat die waarden zijn hersteld.
schema.capabilities.file_search.blob_storage.s3.bucket.label=Bucket
schema.capabilities.file_search.blob_storage.s3.bucket.description=Bucketnaam. Deze vormt de host <bucket>.s3.<region>.amazonaws.com, of het pad /<bucket>/<key> wanneer endpoint is ingesteld. Wordt leeg geleverd: zolang hij niet is ingesteld, antwoordt een upload met backend "s3" met 503 en wordt een migratie naar S3 geweigerd.
schema.capabilities.file_search.blob_storage.s3.prefix.label=Voorvoegsel
schema.capabilities.file_search.blob_storage.s3.prefix.description=Sleutelprefix waaronder elke blob wordt opgeslagen, standaard sail-proxy/blobs, zodat één bucket blobs naast ongerelateerde objecten kan bevatten. Padsegmenten van letters, cijfers, ".", "_" en "-", gescheiden door "/". De gateway leest, schrijft en verwijdert alleen sleutels onder dit prefix en somt de bucket nooit op. Geef elke file_search-database een eigen prefix (of bucket): sleutels worden afgeleid van de bestandsinhoud, dus twee installaties met hetzelfde prefix delen objecten, en de ene verwijdert objecten die de andere nog gebruikt.
schema.capabilities.file_search.blob_storage.s3.endpoint.label=Eindpunt
schema.capabilities.file_search.blob_storage.s3.endpoint.description=Niet-AWS S3-eindpunt - MinIO, Ceph of een andere S3-compatibele gateway. Indien ingesteld, gaan verzoeken naar <endpoint>/<bucket>/<key> in plaats van naar de AWS-hostvorm. Leeg, de standaard, betekent AWS.
schema.capabilities.file_search.blob_storage.s3.region.label=Regio
schema.capabilities.file_search.blob_storage.s3.region.description=SigV4-ondertekeningsregio, en deel van de hostnaam wanneer er geen endpoint is ingesteld. Wordt leeg geleverd, en is nog steeds verplicht voor ondertekening tegen een S3-compatibel eindpunt.
schema.capabilities.file_search.teacher_logging.label=Logging voor leraarmodel
schema.capabilities.file_search.teacher_logging.description=Legt de kandidaten van elke zoekopdracht en de scores van de reranker vast als teacherlabels, voor evaluatie en distillatie van de reranker. Fire-and-forget door constructie: niets wacht op het schrijven, en elke fout verschijnt alleen als waarschuwing. Alle vijf velden worden live op het zoekpad gelezen, dus ze kunnen vanuit deze cockpit zonder herstart worden gewijzigd.
schema.capabilities.file_search.teacher_logging.enabled.label=Ingeschakeld
schema.capabilities.file_search.teacher_logging.enabled.description=Of zoekgebeurtenissen überhaupt worden geschreven. Standaard uit, zodat een installatie van vóór deze sleutel nooit rijen begint te schrijven. Bewust onafhankelijk van store_chunk_text: logging inschakelen mag nooit uit zichzelf documentinhoud gaan opslaan.
schema.capabilities.file_search.teacher_logging.store_chunk_text.label=Chunktekst opslaan
schema.capabilities.file_search.teacher_logging.store_chunk_text.description=Of de chunkTEKST van elke kandidaat naast de hash wordt opgeslagen; standaard uit, en anders blijft de tekst leeg. Die tekst is documentinhoud van gebruikers, dus dit maakt van de labeltabellen een tweede kopie van het corpus - de hash alleen is genoeg om labels terug te koppelen aan chunks die nog bestaan.
schema.capabilities.file_search.teacher_logging.sample_rate.label=Steekproeffrequentie
schema.capabilities.file_search.teacher_logging.sample_rate.description=Kans dat een zoekopdracht wordt gelogd, van 0 tot 1; standaard 1.0. 1 logt elke zoekopdracht, 0 geen enkele, 0.1 ongeveer één op tien. Dit is de instelling om te verlagen wanneer het labelvolume een probleem is - niet max_concurrent_writes, dat schrijfacties laat vallen in plaats van ze uit te dunnen.
schema.capabilities.file_search.teacher_logging.source.label=Bron
schema.capabilities.file_search.teacher_logging.source.description=Vrije tekstlabel die op elke zoekgebeurtenis wordt geschreven, gebruikt wanneer de aanroeper er geen meegeeft. Standaard "production", zodat een evaluatie- of backfillrun van productieverkeer kan worden onderscheiden wanneer de labels worden teruggelezen.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.label=Max. gelijktijdige schrijfacties
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.description=Bovengrens voor lopende schrijfacties van teacherlabels, standaard 2; overtollige schrijfacties worden weggelaten, niet in de wachtrij gezet. Begrensd op de file_search-databasepoolgrootte van 10: daarboven begrenst de grens niets meer, omdat de extra schrijfacties gewoon in de eigen wachtrij van de pool wachten - waardoor "weggelaten, niet in de wachtrij" verandert in "in de wachtrij", precies het probleem dat de grens moet voorkomen. Een grotere waarde wordt met een waarschuwing afgekapt, dus ook een met de hand bewerkte api_config.json kan hem niet verhogen.
schema.capabilities.file_search.tool.label=Tool
schema.capabilities.file_search.tool.description=Het blok van de gehoste TOOL file_search - de tool die het model zelf aanroept - in tegenstelling tot het kale REST-pad POST /v1/vector_stores/{id}/search dat door de instellingen hierboven wordt bepaald. Elk veld wordt bij het lezen gecontroleerd en valt terug op zijn standaardwaarde in plaats van te worden omgezet, omdat een met de hand bewerkte api_config.json de gateway ongevalideerd bereikt.
schema.capabilities.file_search.tool.enabled.label=Ingeschakeld
schema.capabilities.file_search.tool.enabled.description=Gelezen als strikte boolean, standaard true - een met de hand bewerkte "true" of 1 wordt niet als true gelezen en valt terug op de standaardwaarde. Wordt momenteel door de gateway genegeerd: niets hangt af van de bepaalde waarde en de tool wordt hoe dan ook aangeboden, dus dit op false zetten verbergt de tool niet. Gebruik file_search.enabled om de functie uit te schakelen.
schema.capabilities.file_search.tool.max_searches_per_request.label=Max. zoekopdrachten per verzoek
schema.capabilities.file_search.tool.max_searches_per_request.description=Hoeveel file_search-aanroepen één verzoek mag doen voordat de gateway stopt met het voortzetten van de beurt. Een geheel getal van 1 tot 10 wordt gerespecteerd; al het andere - buiten bereik, gebroken, niet-numeriek - telt als niet ingesteld en valt met een waarschuwing terug op 3, dus een waarde buiten bereik hier is stilzwijgend niet de waarde die wordt gebruikt.
schema.capabilities.file_search.tool.max_num_results_default.label=Standaard max. aantal resultaten
schema.capabilities.file_search.tool.max_num_results_default.description=Chunks die worden teruggegeven wanneer een toolaanroep geen eigen max_num_results noemt. Een geheel getal van 1 tot 50 wordt gerespecteerd, al het andere valt terug op 10. Dat bereik is dezelfde grens waartegen een max_num_results per aanroep wordt gecontroleerd, en de eigen grens van OpenAI voor het veld. hybrid.candidates blijft de harde bovengrens voor wat een zoekopdracht kan teruggeven.
schema.capabilities.hosted_tools.label=Gehoste tools
schema.capabilities.hosted_tools.description=Grenzen voor de replaycache van resultaten van gehoste tools: hoe lang een resultaat opnieuw afspeelbaar blijft en hoeveel er tegelijk worden bewaard.
schema.capabilities.hosted_tools.result_cache_ttl_seconds.label=TTL van resultatencache (seconden)
schema.capabilities.hosted_tools.result_cache_ttl_seconds.description=Optioneel. Hoe lang de resultaten van een gehoste tool opnieuw afspeelbaar blijven voor een client die het aanroepitem opnieuw afspeelt. Een niet-gehele waarde of een waarde buiten bereik valt terug op de standaardwaarde van 3600 seconden, net als wanneer dit niet is ingesteld. Een cachemisser voert de vastgelegde query opnieuw uit in plaats van het antwoord te verslechteren.
schema.capabilities.hosted_tools.result_cache_max_entries.label=Max. items in resultatencache
schema.capabilities.hosted_tools.result_cache_max_entries.description=Optioneel. Hoeveel resultaten van gehoste tools tegelijk in de replaycache worden bewaard. Een niet-gehele waarde of een waarde buiten bereik valt terug op de standaardwaarde van 500 items, net als wanneer dit niet is ingesteld. Een cachemisser voert de vastgelegde query opnieuw uit in plaats van het antwoord te verslechteren.
schema.capabilities.namespace_tools.label=Namespacetools
schema.capabilities.namespace_tools.description=Hoe om te gaan met de wrappertool voor subagents `namespace` van Codex, die SAP AI Core direct weigert met een 400.
schema.capabilities.namespace_tools.mode.label=Modus
schema.capabilities.namespace_tools.mode.description=`flatten` (standaard) tilt de geneste functietools van een namespacetool naar het hoogste niveau zodat het verzoek wordt geaccepteerd, en herstelt daarna de namespace bij opnieuw afgespeelde aanroepen zodat Codex ze nog kan routeren. `strip` verwijdert de namespacetool en zijn geneste tools volledig. Elke andere waarde dan deze twee valt terug op flatten - het alternatief is een harde 400 die de beurt beëindigt.
schema.capabilities.custom_tools.label=Aangepaste tools
schema.capabilities.custom_tools.description=Vrije `custom`-tools van Codex (apply_patch). `translate` herschrijft ze naar functietools, die zowel de deployment- als de orkestratieroute accepteren; `strip` verwijdert ze, zodat het model bestanden via shellopdrachten bewerkt.
schema.capabilities.custom_tools.mode.label=Modus
schema.capabilities.custom_tools.mode.description=`translate` (standaard) herschrijft de vrije aangepaste tool naar een gewone functietool die beide routes accepteren, en voegt grammatica-/formaatrichtlijnen toe aan de beschrijving, omdat een functietool geen Lark-grammatica kan uitdrukken zoals een aangepaste tool dat kan. `strip` verwijdert aangepaste tools volledig, zodat het model bestanden in plaats daarvan via shellopdrachten bewerkt. Elke andere waarde dan deze twee valt terug op translate - het alternatief is een harde 400 die de beurt beëindigt.
schema.capabilities.tool_search.label=Tools zoeken
schema.capabilities.tool_search.description=De tool `tool_search` van Codex voor het ontdekken van uitgestelde tools. `translate` herschrijft hem naar een functietool, die zowel de deployment- als de orkestratieroute accepteren; `strip` verwijdert hem, waardoor het model geen uitgestelde tools zoals MCP-servers meer kan ontdekken.
schema.capabilities.tool_search.mode.label=Modus
schema.capabilities.tool_search.mode.description=`translate` (standaard) herschrijft de tool tool_search naar een gewone functietool die beide routes accepteren. `strip` verwijdert hem volledig. Elke andere waarde dan deze twee valt terug op translate - het alternatief is een harde 400 die de beurt beëindigt.
schema.capabilities.tool_search.hoist_discovered_tools.label=Ontdekte tools naar voren halen
schema.capabilities.tool_search.hoist_discovered_tools.description=Haalt door tool_search ontdekte tools naar het verzoek zodat het model ze kan aanroepen. Omzeilt dat codex uitgestelde MCP-tools alleen beschikbaar maakt wanneer de base_url van de aanbieder api.openai.com is; zet dit op false zodra dat upstream is opgelost. Kan hoe dan ook veilig aan blijven - namen die de client al declareert, worden overgeslagen.
schema.hooks.label=Hooks
schema.hooks.definitions.label=Definities
schema.hooks.definitions.description=De benoemde matchregels die de request.match van een hook kan noemen, met de regel-id als sleutel - de sleutel IS de id. Elke regel die een hook vermeldt, moet overeenkomen om die hook te activeren, en een regel-id die hier nergens is gedefinieerd, logt een waarschuwing en laat de hook met niets overeenkomen. Regels worden bij het eerste gebruik per id gecachet, dus een bewerking werkt bij de volgende herlaadbeurt van de configuratie in plaats van halverwege het proces.
schema.hooks.definitions._entry.type.label=Type
schema.hooks.definitions._entry.type.description=Welk deel van het verzoek de regel test, en dus welke van de velden hieronder van toepassing zijn. Dragend in plaats van beschrijvend: alleen deze vier waarden worden begrepen, en al het andere wordt gelogd als onbekend hooktype en komt met NIETS overeen - waardoor elke hook die de regel noemt, stilzwijgend wordt uitgeschakeld.
schema.hooks.definitions._entry.name.label=Naam
schema.hooks.definitions._entry.name.description=De verzoekheader die een 'header'-regel leest. Hoofdletterongevoelig: de naam wordt vóór het opzoeken naar kleine letters omgezet, net zoals de verzoekpijplijn headernamen normaliseert. Een verzoek zonder de header komt nooit overeen. Leeg is niet 'elke header' - zo’n regel zou nooit kunnen worden geactiveerd - dus wordt hier geweigerd in plaats van geaccepteerd.
schema.hooks.definitions._entry.path.label=Pad
schema.hooks.definitions._entry.path.description=Pad in puntnotatie in de geparste JSON-body van het verzoek voor een regel 'json-path' of 'json-path-regex'. Een voorafgaand '$.' wordt verwijderd, dus '$.max_tokens' en 'max_tokens' verwijzen naar dezelfde waarde; verdere JSONPath-ondersteuning is er niet - geen jokertekens, filters of haakjessyntaxis, en een segment met een punt erin kan niet worden aangesproken. 'json-path' volgt elk segment letterlijk, dus een numeriek segment indexeert een array. 'json-path-regex' laat daarnaast een niet-numeriek segment het eerste array-element nemen dat het bevat. Een verzoek zonder geparste body, of een pad dat naar niets verwijst, komt niet overeen.
schema.hooks.definitions._entry.equals.label=Gelijk aan
schema.hooks.definitions._entry.equals.description=De waarde waaraan het aangesproken element gelijk moet zijn - per type ANDERS vergeleken. Bij een `header`-regel is het GEEN strikte gelijkheid: mediatypen worden vergeleken (het deel vóór de eerste `;`, in kleine letters), dus `application/json` komt ook overeen met `application/json; charset=utf-8`. Dat bestaat omdat de strikte vergelijking die het verving, clients die een charset toevoegen, pseudonimisering liet omzeilen. Een equals-waarde die zelf een `;` bevat, wordt exact vergeleken, zodat een regel nog steeds een charset kan vastleggen. Bij een `json-path`-regel IS het strikte gelijkheid. Semantiek van de matcher: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.from.label=Van
schema.hooks.definitions._entry.from.description=Inclusieve ondergrens voor een 'header'-regel die een numerieke header vergelijkt - content-length in elke meegeleverde regel. De headerwaarde wordt gelezen als geheel getal met grondtal 10 en moet binnen [from, to] vallen; een waarde die niet kan worden geparst, komt nooit overeen. Wordt alleen gelezen wanneer equals ontbreekt EN beide grenzen aanwezig zijn: één grens alleen wordt genegeerd en de regel degradeert tot een kale aanwezigheidscontrole op de header.
schema.hooks.definitions._entry.to.label=Naar
schema.hooks.definitions._entry.to.description=Inclusieve bovengrens voor een 'header'-regel die een numerieke header vergelijkt. Er is geen open vorm: om 'minstens 10 KB' uit te drukken, combineren de meegeleverde regels from met een bewust enorme to (size:min10kb gebruikt 999999999), omdat het weglaten van een van beide grenzen de regel in een aanwezigheidscontrole verandert. Zie from.
schema.hooks.definitions._entry.regex.label=Regex
schema.hooks.definitions._entry.regex.description=De bron van een JavaScript-reguliere expressie. Een `json-path-regex`-regel test hem tegen datgene waarnaar het pad verwijst (een tekenreeks direct, een array element voor element, elk ander object tegen zijn JSON-vorm). Een `url-regex`-regel test hem tegen het verzoekpad en de querystring die de gateway ziet, NIET een absolute URL, dus `^https?://` kan nooit overeenkomen. Eenmaal gecompileerd en per regel gecachet; een expressie die de engine weigert, telt als geen overeenkomst. Semantiek van de matcher: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.flags.label=Vlaggen
schema.hooks.definitions._entry.flags.description=Vlaggen voor reguliere expressies die op regex worden toegepast, bijv. 'i' voor hoofdletterongevoelig. Beperkt tot de letters die de engine daadwerkelijk accepteert, omdat elke andere waarde de compilatie laat mislukken en die mislukking als geen overeenkomst wordt gemeld - de regel zou dan stilzwijgend nooit worden geactiveerd. Vlaggen maken deel uit van de cachesleutel van de gecompileerde expressie, dus twee regels die alleen in vlaggen verschillen, delen geen gecompileerde expressie. Vermijd 'g': een gecompileerde globale expressie wordt over verzoeken heen hergebruikt en verschuift zijn eigen positie, dus zo’n regel komt maar om de keer overeen.
schema.hooks.definitions._entry.desc.label=Omschr.
schema.hooks.definitions._entry.desc.description=Vrije notitie over waarvoor deze regel dient. Wordt momenteel door de gateway genegeerd; documenteert de regel voor wie dit bestand bewerkt en heeft geen effect op de vergelijking.
schema.hooks.defaults.label=Standaardwaarden
schema.hooks.defaults.description=Standaardhooks per endpoint, met de endpoint-id die de route gebruikt als sleutel - vandaag 'anthropic', 'openai' en 'aws-bedrock', en 'google' (subpaden generateContent, streamGenerateContent, embedContent). Worden alleen geraadpleegd wanneer het gevraagde model geen vermelding models.overrides.<model>.hooks voor het subpad heeft: een vermelding per model VERVANGT de standaardwaarde van het endpoint voor dat subpad in plaats van ermee samen te voegen.
schema.hooks.defaults._entry.description=De standaardwaarden van één endpoint: het optionele blok dat pseudonimisering afdwingt, plus één hooklijst per verzoeksubpad (invoke, invoke-with-response-stream, responses, responses-stream). Onbekende sleutels worden geweigerd, omdat elke andere sleutel hier als subpad wordt gelezen en geen route vraagt om een subpad dat dit endpoint niet bedient - dus een onbekende sleutel is een typefout die nooit zou draaien, geen instelling. Het subpadpatroon sluit 'pseudonymization' bewust uit, zodat die sleutel niet ook een hooklijst hoeft te zijn.
schema.hooks.defaults._entry.pseudonymization.label=Pseudonimisering
schema.hooks.defaults._entry.pseudonymization.description=Instellingen van de pseudonimiseringsplug-in. De activering (enabled) en de schakelaars per categorie (entities) gelden alleen voor deze plug-in; maskering vindt alleen plaats wanneer de plug-in daadwerkelijk voor een verzoek wordt uitgevoerd - hij moet in de hookketen zijn geregistreerd en er moet een activeringsbron worden geactiveerd.
schema.hooks.defaults._entry.pseudonymization.enabled.label=Ingeschakeld
schema.hooks.defaults._entry.pseudonymization.enabled.description=Dwingt maskering voor een verzoek af. Wordt alleen gelezen waar dit blok onder models.overrides.<model>.pseudonymization of hooks.defaults.<endpoint>.pseudonymization staat: true maskeert daar dat verzoek, waarbij het blok per model wint van het blok per endpoint. False of afwezig dwingt niets af - maskering kan nog steeds plaatsvinden wanneer een andere activeringsbron wordt geactiveerd, zoals een triggerwoord of een maskeringsveld in de body van het verzoek. Onder observability.pseudonymization wordt deze sleutel momenteel genegeerd; die laag levert elke andere instelling hier, behalve method en allow_user_bypass. Hoe dan ook moet de plug-in in de hookketen zijn aangesloten, anders wordt er helemaal niets gemaskeerd.
schema.hooks.defaults._entry.pseudonymization.method.label=Methode
schema.hooks.defaults._entry.pseudonymization.method.description=Maskeringsmodus: `pseudonymization` maskeert het verzoek en ontmaskert het antwoord; `anonymization` maskeert en ontmaskert nooit. Wordt alleen gelezen waar dit blok maskering afdwingt (een ingeschakelde hook of modeloverschrijving), niet onder `observability.pseudonymization`. Bepaalt ook de SIEM: alleen `pseudonymization` bewaart het gemaskeerde antwoord, dus onder `anonymization` krijgt een contentsink de prompt maar niet het antwoord. Weggelaten valt het terug op `pseudonymization`. Modi: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.label=Omzeilen door gebruiker toestaan
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.description=Heeft alleen gevolgen binnen een blok dat maskering afdwingt (een ingeschakelde hook of modeloverschrijving); wordt niet gelezen onder `observability.pseudonymization`. Standaard false. Bij true kan een aanroeper maskering overslaan via de header `x-sail-proxy-pseudonymization: off` (hoofdletterongevoelig) of het bodyveld `pseudonymization_off: true`: de inhoud bereikt de LLM ongemaskeerd, en ook die sink waar een ingeschakelde SIEM-sink zowel `include_content` als `allow_unmasked_content` instelt. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.hooks.defaults._entry.pseudonymization.entities.label=Entiteiten
schema.hooks.defaults._entry.pseudonymization.entities.description=Maskeringsschakelaars per categorie: `true` maskeert de categorie op deze laag, `false` niet, en een categorie die niet wordt genoemd, erft de laag eronder (latere lagen winnen). De sleutels zijn de set bekende categorieën: de categorieën die standaard aan staan; drie opt-in-categorieën die uit staan bij levering (`profile-org`, `profile-location`, `profile-ip-address`); en `profile-sensitive-data`, een overkoepelende schakelaar die alle categorieën aanzet behalve die drie. Een sleutel buiten de set wordt hier geweigerd. Categorieën en lagen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.hooks.defaults._entry.pseudonymization.org_suffixes.label=Organisatieachtervoegsels
schema.hooks.defaults._entry.pseudonymization.org_suffixes.description=Achtervoegsels van rechtsvormen die een reeks woorden als organisatienaam markeren, bijv. Inc, LLC, GmbH. De vergelijking is bewust hoofdlettergevoelig, zodat een 'limited' in kleine letters in lopende tekst bewust niet als rechtsvorm wordt behandeld; elke vermelding komt bovendien overeen in volledig hoofdletters, zodat een factuur die ACME GMBH schreeuwt, wordt herkend als dezelfde organisatie als Acme GmbH. Heeft alleen effect zolang profile-org in entities is ingeschakeld; profile-org inschakelen met deze lijst leeg maskeert NIETS als organisatie en logt één waarschuwing. Elke vermelding wordt vóór de vergelijking bijgesneden, en een lege vermelding of een vermelding met alleen witruimte wordt stilzwijgend weggelaten in plaats van geweigerd.
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.label=Locatiegazetteer
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.description=Letterlijke locatietermen die de structurele detector maskeert - hoofdletterongevoelig, en alleen als heel woord of hele zinsnede; er wordt niets afgeleid uit hoofdlettergebruik of context. Heeft alleen effect zolang profile-location in entities is ingeschakeld; profile-location inschakelen met deze lijst leeg maskeert NIETS als locatie en logt één waarschuwing. Elke vermelding wordt bijgesneden, en een lege vermelding of een vermelding met alleen witruimte wordt stilzwijgend weggelaten. Wordt leeg geleverd: plaatsnamen zijn specifiek voor elke installatie en deze repository is openbaar, dus vul de lijst via deze beheerconfiguratieapp, nooit in bijgehouden code.
schema.hooks.defaults._entry.pseudonymization.min_confidence.label=Min. betrouwbaarheid
schema.hooks.defaults._entry.pseudonymization.min_confidence.description=Hoeveel bewijs een gedetecteerde waarde nodig heeft voordat deze wordt gemaskeerd, van 0 tot 1 (standaard 0.5). Een waarde wordt gemaskeerd zodra de score de drempel bereikt; een gewone naam met hoofdletter scoort ongeveer 0.5, een met een controlesom gevalideerd patroon 0.95, een aangepaste regel 1.0. Een hogere drempel laat eerst gewone namen vallen, dus maak een enkele luidruchtige categorie strenger met `thresholds`. Aangepaste regels, gevalideerde identificatoren en inloggegevens worden nooit door hun omgeving verlaagd. Details van de score: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.hooks.defaults._entry.pseudonymization.thresholds.label=Drempels
schema.hooks.defaults._entry.pseudonymization.thresholds.description=Betrouwbaarheidsdrempels per categorie, elk van 0 tot 1, die `min_confidence` overschrijven voor de genoemde categorieën; een niet-genoemde categorie behoudt `min_confidence`. De plek om streng te zijn voor één luidruchtige categorie - `profile-person` op 0.65 vraagt meer bewijs voor namen, terwijl gevalideerde identificatoren op de globale drempel blijven. De sleutels zijn dezelfde set bekende categorieën die `entities` accepteert; `profile-sensitive-data` wordt geaccepteerd maar doet niets. Afstemming per categorie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.hooks.defaults._entry.pseudonymization.allowlist.label=Toelatingslijst
schema.hooks.defaults._entry.pseudonymization.allowlist.description=Waarden die deze installatie nooit maskeert - een UIT-schakelaar, per waarde. Geraadpleegd vóór de betrouwbaarheidsscore, dus een vermelde waarde is vrijgesteld, hoeveel bewijs er ook is. Gebruik dit voor een terugkerend fout-positief met een eigen naam - een product- of rapporttitel die leest als een persoon. De lijsten van de lagen worden SAMENGEVOEGD, niet vervangen, dus een lagere laag voegt alleen een vrijstelling toe en laat er nooit een vallen. `terms` versus `patterns`, en het risico van te brede vermeldingen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.label=Termen
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.description=Letterlijke waarden, vergeleken met de hele gedetecteerde waarde en HOOFDLETTERGEVOELIG. Bewust hoofdlettergevoelig: 'Watson Studio' is het product dat een beheerder wilde vrijstellen en 'watson studio' in een zin niet, en een hoofdletterongevoelige lijst zou ook een persoon vrijstellen wiens achternaam toevallig hetzelfde gespeld wordt. Een term komt alleen overeen met een waarde die de detectoren in zijn geheel hebben opgeleverd - 'Studio' vermelden stelt 'Watson Studio' niet vrij. Elke vermelding hier is een UIT-schakelaar voor maskering van precies die waarde, dus beperk de lijst tot waarden die werkelijk nooit persoonsgegevens zijn: een term die toevallig iemands naam is, stelt die persoon overal in deze installatie vrij van maskering, stilzwijgend en zonder iets in de log dat dit meldt.
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.label=Patronen
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.description=Reguliere expressies (JavaScript), elk vergeleken met de HELE gedetecteerde waarde: de gateway zet elke vermelding zelf tussen `^(?: )$`, dus schrijf `Z[A-Z0-9_]+`, niet `^Z[A-Z0-9_]+$`. De vergelijking is hoofdlettergevoelig. Elke vermelding is een UIT-schakelaar voor maskering, en een brede vermelding schakelt maskering uit zonder te mislukken - `[A-Z].*` schakelt bijna elke gedetecteerde persoonsnaam uit. Een overeenkomst met een ingebouwd PII-voorbeeld geeft een waarschuwing maar wordt TOCH toegepast. Houd elke vermelding smal. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.saturation_warn.label=Verzadigingswaarschuwing
schema.hooks.defaults._entry.pseudonymization.saturation_warn.description=Hoeveel VERSCHILLENDE gemaskeerde waarden één verzoek mag bevatten voordat het als verzadigd wordt gemeld (standaard 40). Alleen rapportage - het verandert nooit wat wordt gemaskeerd. Boven dit aantal logt de gateway per verzoek één waarschuwing met aantallen per categorie en de meest voorkomende waardeVORMEN (letters als X, cijfers als 9); er verschijnt nooit een gemaskeerde waarde. De SIEM-gebruiksgebeurtenis van het verzoek bevat dezelfde aantallen met een vlag `saturated` - aantallen, geen tekst. Het rapport lezen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.label=Verzonnen plaatsaanduidingen
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.description=Wat er gebeurt wanneer een antwoord een gemaskeerde plaatsaanduiding bevat die nooit naar het model is verzonden. Modellen verzinnen er een in ongeveer 1 op de 125 gepseudonimiseerde antwoorden, en vaker naarmate een verzoek meer waarden maskeert; zo’n plaatsaanduiding noemt niemand en kan nooit worden opgelost. withhold (standaard): wordt vervangen door een eenvoudige markering zoals [name withheld] en gemeld als beveiligingsgebeurtenis. report: wordt alleen gemeld en bereikt de client ongewijzigd, voor een installatie waarvan de eigen ontwikkelaars via de gateway nieuwe plaatsaanduidingen in testgegevens schrijven. off: geen van beide. Een plaatsaanduiding die de client zelf in hetzelfde verzoek heeft verzonden, wordt nooit als verzonnen behandeld.
schema.hooks.defaults._entry._entry.description=De hooklijst van één subpad, in volgorde geprobeerd. Dezelfde vorm dient voor hooks.defaults.<endpoint>.<subpath> en models.overrides.<model>.hooks.<subpath>, zodat de gateway één vorm ziet, welke van de twee die ook levert. Een hook wordt alleen geactiveerd wanneer ELKE regel die zijn request.match noemt, met het verzoek overeenkomt; request.callback.id noemt dan de plug-in die voor de lopende fase wordt uitgevoerd. Een hook waarvan de match niet klopt, of waarvan de callback geen voor die fase geregistreerde plug-in noemt, wordt overgeslagen en de volgende wordt geprobeerd - geen van beide is een fout tijdens runtime.
schema.hooks.defaults._entry._entry.items.request.label=Verzoek
schema.hooks.defaults._entry._entry.items.request.description=Wat moet overeenkomen en wat er wordt uitgevoerd als dat zo is. Vernoemd naar het verzoek, omdat de matcher alleen ooit het inkomende verzoek inspecteert; er is geen tegenhanger voor het antwoord, en verder wordt niets van een hook gelezen.
schema.hooks.defaults._entry._entry.items.request.callback.label=Callback
schema.hooks.defaults._entry._entry.items.request.callback.description=De plug-in die wordt uitgevoerd zodra elke regel in match overeenkomt.
schema.hooks.defaults._entry._entry.items.request.callback.id.label=ID
schema.hooks.defaults._entry._entry.items.request.callback.id.description=De id waaronder een plug-in zich heeft geregistreerd, opgezocht in het plug-inregister van de gateway voor de fase die wordt uitgevoerd. Dit schema kan de kruisverwijzing niet controleren: een id die geen plug-in voor die fase heeft geregistreerd, wordt gelogd als niet gevonden en de hook wordt overgeslagen, zodat het verzoek ongewijzigd doorgaat in plaats van te mislukken.
schema.hooks.defaults._entry._entry.items.request.match.label=Overeenkomst
schema.hooks.defaults._entry._entry.items.request.match.description=De regel-id’s die ALLEMAAL moeten overeenkomen, in volgorde geëvalueerd en afgebroken bij de eerste die niet overeenkomt. Elke id is een sleutel in hooks.definitions - een kruisverwijzing die dit schema niet kan controleren: een id die daar nergens is gedefinieerd, logt een waarschuwing en laat de hele hook niet overeenkomen, dus een typefout schakelt de plug-in stilzwijgend uit in plaats van hem onvoorwaardelijk te activeren. Een lege lijst wordt geweigerd, omdat een hook die op bijna alles moet draaien, wordt geschreven door in plaats daarvan een bewust brede regel te noemen - de meegeleverde payload:any komt overeen met elk verzoek waarvan de geparste body een niet-lege tekenreeks als model bevat, wat zo dicht bij onvoorwaardelijk komt als een regel kan komen en dat toch hardop zegt.
schema.platform.label=Platform
schema.platform.billing.label=Facturering
schema.platform.billing.description=Factureringsclassificatie van SAP AI Core voor deze subaccount. Wordt alleen gelezen door de SAP-eigen kostenberekening in Capacity Units van de beheerapp, nooit door het verzoekpad van de gateway.
schema.platform.billing.productive.label=Productief
schema.platform.billing.productive.description=Of SAP deze subaccount/tenant als PRODUCTIEF classificeert voor de facturering van SAP AI Core. isProductive() in sapCapacityService leest dit om de rij SapCapacityUnitPrice te kiezen - productief of niet-productief $/CU - die wordt gebruikt om Capacity Units te prijzen. De classificatie van SAP komt niet altijd overeen met de naam van de omgeving (een Sandbox-subaccount kan als productief zijn geclassificeerd), dus stel dit in op wat uw SAP-factuur/subaccount werkelijk is. Standaard false = niet-productief.
schema.platform.billing.cuFactor.label=CU-factor
schema.platform.billing.cuFactor.description=Omrekenfactor van SAP GenAI-tokens naar Capacity Units (SAP Note 3437766; uniform over alle facturen, niet per model gepubliceerd). cuFactor() in sapCapacityService leest dit - capacityUnits = genAiTokens x deze factor, globaal toegepast op elke gebruiksgebeurtenis (niet per gebruikstype), zowel voor live vastlegging als voor de herberekening met terugwerkende kracht. Wijzig dit alleen als SAP de CU-omrekening opnieuw publiceert. Standaard 1.90385. De waarde 0 geldt als niet ingesteld en valt terug op de standaard.
schema.platform.timeouts.label=Time-outs
schema.platform.timeouts.description=Maximale time-outs per verzoek die de gateway toepast op uitgaande LLM-aanroepen.
schema.platform.timeouts.default.label=Standaard
schema.platform.timeouts.default.description=Time-out in milliseconden voor niet-streamingverzoeken, van 1000 tot 3600000. Niet ingesteld of nul valt terug op 120000 ms (120 seconden).
schema.platform.timeouts.streaming.label=Streaming
schema.platform.timeouts.streaming.description=Time-out in milliseconden voor streamingverzoeken, van 1000 tot 3600000. Niet ingesteld of nul valt terug op 240000 ms (240 seconden).
schema.platform.logging.label=Logging
schema.platform.logging.description=Logniveau en -bestemming van de gateway. Wordt bij het opstarten door de gedeelde logger gelezen, en opnieuw telkens wanneer de gateway hem na een configuratiewijziging opnieuw initialiseert.
schema.platform.logging.components.label=Componenten
schema.platform.logging.components.description=Overschrijving van het logniveau per component, met de componentnaam precies zoals de gateway die logt als sleutel - bijvoorbeeld 'ConfigService' of 'AwsBedrockService'. Een component zonder vermelding hier gebruikt LOG_LEVEL als die is ingesteld, anders defaultLevel. Een vermelding heeft voor haar eigen component voorrang op LOG_LEVEL, dus een vastgezet component negeert de omgevingsvariabele; de meegeleverde configuratie bevat geen vermeldingen.
schema.platform.logging.components._entry.description=Logniveau voor deze component, dat defaultLevel overschrijft zolang het aanwezig is. Wordt hoofdletterongevoelig vergeleken met de niveaus die de logger implementeert (trace, debug, info, warn, error); een waarde die hij niet herkent, wordt stilzwijgend genegeerd, waarbij het eerder geldende niveau blijft staan in plaats van een fout te geven.
schema.platform.logging.defaultLevel.label=Standaardniveau
schema.platform.logging.defaultLevel.description=Logniveau voor elke component zonder vermelding in `components`. Als `LOG_LEVEL` op een herkend niveau is ingesteld, heeft dat voorrang en wordt dit veld genegeerd - en `LOG_LEVEL` is ingesteld in beide .env-voorbeelden en in de Kyma-manifesten, dus in een standaardinstallatie wint de omgeving. Anders wordt het hoofdletterongevoelig vergeleken met de niveaus van de logger (trace, debug, info, warn, error); een onbekende waarde wordt stilzwijgend genegeerd. Voorrang: https://st-gr.github.io/sail-proxy/developer/debugging#log-level-resolution
schema.platform.logging.log_folder_path.label=Pad van logmap
schema.platform.logging.log_folder_path.description=Map waarin de gateway zijn eigen logbestanden schrijft en - wanneer payload_logging_enabled true is - dumps van verzoek- en antwoordpayloads, in een submap payloads/. Valt terug op ./logs als niets is ingesteld.
schema.platform.logging.payload_logging_enabled.label=Payloadlogging ingeschakeld
schema.platform.logging.payload_logging_enabled.description=Bij true worden volledige verzoek- en antwoordbody’s naar log_folder_path/payloads geschreven voor foutopsporing. Bekende gevoelige headers worden afgeschermd, maar de bodyinhoud wordt ongewijzigd geschreven, dus laat dit uit buiten actieve foutopsporing. Standaard uit. De omgevingsvariabele PAYLOAD_LOGGING_ENABLED gaat, als die op true of false staat, boven deze waarde.
schema.platform.rate_limit_handling.label=Afhandeling van frequentielimieten
schema.platform.rate_limit_handling.description=Automatische backoff die de gateway toepast nadat een aanbieder een frequentielimiet meldt - een HTTP 429, of een foutmelding die overeenkomt met een trefwoord voor frequentielimieten. Puur reactief: vertraagt nieuwe pogingen zodra een frequentielimiet voor een model en subpad is gezien, het knijpt het verkeer niet vooraf af.
schema.platform.rate_limit_handling.enabled.label=Ingeschakeld
schema.platform.rate_limit_handling.enabled.description=Hoofdschakelaar voor backoff bij frequentielimieten. Bij false of afwezig is de vertraging altijd 0 seconden en heeft de rest van deze sectie geen effect.
schema.platform.rate_limit_handling.default_delay_seconds.label=Standaardvertraging (seconden)
schema.platform.rate_limit_handling.default_delay_seconds.description=Vertraging in seconden die wordt toegepast wanneer een frequentielimiet wordt gedetecteerd en noch subpath_specific_delays noch model_specific_delays een vermelding voor het endpoint heeft. Valt terug op 30 als niet ingesteld of nul.
schema.platform.rate_limit_handling.backoff_multiplier.label=Backoffvermenigvuldiger
schema.platform.rate_limit_handling.backoff_multiplier.description=Vermenigvuldiger die bij elke opeenvolgende frequentielimiet voor hetzelfde model en subpad op de vorige vertraging wordt toegepast: de nieuwe vertraging is de vorige maal deze waarde, begrensd op max_delay_seconds. Valt terug op 1.5 als niet ingesteld of nul; houd hem op 1 of hoger, anders zou elke opeenvolgende frequentielimiet korter in plaats van langer wachten.
schema.platform.rate_limit_handling.max_delay_seconds.label=Max. vertraging (seconden)
schema.platform.rate_limit_handling.max_delay_seconds.description=Bovengrens in seconden die de backoff bij opeenvolgende frequentielimieten hierboven niet kan overschrijden. Valt terug op 300 als niet ingesteld of nul.
schema.platform.rate_limit_handling.model_specific_delays.label=Vertragingen per model
schema.platform.rate_limit_handling.model_specific_delays.description=Overschrijving van de vertraging per model in seconden, met de model-id precies zoals geconfigureerd onder providers en models als sleutel - bijvoorbeeld 'anthropic--claude-4-opus--deployed'. Gecontroleerd na subpath_specific_delays en vóór default_delay_seconds; een vertraging van 0 hier telt als geen overschrijving, omdat alleen een vermelding ongelijk aan nul wordt gebruikt.
schema.platform.rate_limit_handling.model_specific_delays._entry.description=Vertraging in seconden die voor dit model wordt toegepast wanneer het een frequentielimiet bereikt.
schema.platform.rate_limit_handling.subpath_specific_delays.label=Vertragingen per subpad
schema.platform.rate_limit_handling.subpath_specific_delays.description=Overschrijving van de vertraging per subpad in seconden, met het API-subpad van de gateway als sleutel - bijvoorbeeld 'converse-stream' of 'invoke-with-response-stream'. Wordt als eerste gecontroleerd, vóór model_specific_delays en default_delay_seconds; een vertraging van 0 hier telt als geen overschrijving, omdat alleen een vermelding ongelijk aan nul wordt gebruikt.
schema.platform.rate_limit_handling.subpath_specific_delays._entry.description=Vertraging in seconden die voor dit subpad wordt toegepast wanneer het een frequentielimiet bereikt.
schema.platform.security.label=Beveiliging
schema.platform.security.description=Aandachtspunten voor ingress.
schema.platform.security.trust_forwarded_for.label=Forwarded-For vertrouwen
schema.platform.security.trust_forwarded_for.description=Vertrouw de door de client aangeleverde headers X-Forwarded-For en X-Real-IP - en het client-IP dat het webframework daaruit afleidt - bij het vastleggen van het client-IP in beveiligingsgebeurtenissen, in plaats van het ruwe peeradres van de socket te gebruiken. Schakel dit alleen in achter een proxy die die headers overschrijft in plaats van door te geven wat de client heeft verzonden; anders kan een client zijn eigen vastgelegde IP vervalsen.
schema.platform.security.credentialExpirationDays.label=Verloop van inloggegevens (dagen)
schema.platform.security.credentialExpirationDays.description=Aantal dagen dat inloggegevens geldig blijven: een API-sleutel of AWS-inloggegevens worden aangemaakt met expiresAt = nu + dit aantal dagen, en elke vernieuwing (rotatie) zet expiresAt opnieuw op nu + dit aantal dagen. Ontbrekende of ongeldige waarden vallen terug op 90. Inloggegevens die zijn aangemaakt voordat verloop bestond, hebben geen datum en verlopen nooit totdat een beheerder er een instelt.
schema.platform.quotas.label=Quota
schema.platform.quotas.description=Platformbrede standaardquota per gebruiker, door de gateway afgedwongen bij elk LLM-verzoek. De eigen beperking van een gebruiker (app Gebruikers en quota) overschrijft elk veld; null = onbeperkt. De vensters zijn de UTC-kalenderdag, de ISO-week (maandag 00:00 UTC) en de kalendermaand; uitgaven zijn de SAP-kosten plus de Connections-kosten in de valuta van de SAP Capacity Unit-prijs.
schema.platform.quotas.requestsPerMinute.label=Verzoeken per minuut
schema.platform.quotas.requestsPerMinute.description=Verzoeken per gebruiker per glijdende minuut. De limieten per set inloggegevens (RateLimits) gelden ook; een verzoek moet aan beide voldoen.
schema.platform.quotas.spendPerDay.label=Uitgaven per dag
schema.platform.quotas.spendPerDay.description=SAP-kosten plus Connections-kosten per gebruiker per UTC-dag.
schema.platform.quotas.spendPerWeek.label=Uitgaven per week
schema.platform.quotas.spendPerWeek.description=SAP-kosten plus Connections-kosten per gebruiker per ISO-week.
schema.platform.quotas.spendPerMonth.label=Uitgaven per maand
schema.platform.quotas.spendPerMonth.description=SAP-kosten plus Connections-kosten per gebruiker per kalendermaand.
schema.platform.quotas.tokensPerDay.label=Tokens per dag
schema.platform.quotas.tokensPerDay.description=Invoer-, uitvoer- en cache-schrijftokens per gebruiker per UTC-dag; cache-leesacties worden niet meegeteld.
schema.platform.quotas.tokensPerWeek.label=Tokens per week
schema.platform.quotas.tokensPerWeek.description=Invoer-, uitvoer- en cache-schrijftokens per gebruiker per ISO-week; cache-leesacties worden niet meegeteld.
schema.platform.quotas.tokensPerMonth.label=Tokens per maand
schema.platform.quotas.tokensPerMonth.description=Invoer-, uitvoer- en cache-schrijftokens per gebruiker per kalendermaand; cache-leesacties worden niet meegeteld.
schema.platform.toolGovernance.label=Toolgebruik
schema.platform.toolGovernance.description=Toolgebruik: hoe lang de rijen met toolgebruik per verzoek en hun dagelijkse aggregaten worden bewaard, en hoe elk clientprogramma de MCP-tools spelt die het zelf host.
schema.platform.toolGovernance.mcpNaming.label=MCP-naamgeving
schema.platform.toolGovernance.mcpNaming.description=Een client die zijn eigen MCP-servers draait, verzendt geen MCP-tooltype: Claude Code declareert elke tool als mcp__server__tool, terwijl codex ze binnen zijn eigen exec-tool bereikt. Deze conventies zetten zo’n naam om in de identiteit mcp:server/tool waarmee een beleidspatroon kan overeenkomen, zodat een client die nog niemand heeft gemeten, een configuratiewijziging is in plaats van een release.
schema.platform.toolGovernance.mcpNaming.namePattern.label=Patroon voor toolnaam
schema.platform.toolGovernance.mcpNaming.namePattern.description=Reguliere expressie die met een gedeclareerde toolnaam wordt vergeleken; de eerste groep is de MCP-server, de tweede de tool. De standaardwaarde leest mcp__codex_apps__sites_create_site als server codex_apps en tool sites_create_site.
schema.platform.toolGovernance.mcpNaming.clients.label=Clientprogramma’s
schema.platform.toolGovernance.mcpNaming.clients.description=Eén vermelding per clientprogramma. De eerste waarvan de User Agent-tekst in die van het verzoek voorkomt, is van toepassing; een verzoek dat met geen enkele overeenkomt, wordt nog steeds beheerst door wat het declareert. Een hier opgegeven lijst vervangt de ingebouwde voorinstellingen volledig; een vermelding zonder name, userAgent of containerTools wordt overgeslagen.
schema.platform.toolGovernance.mcpNaming.clients.items.name.label=Naam
schema.platform.toolGovernance.mcpNaming.clients.items.name.description=Hoe naar deze client wordt verwezen in de cockpit en de logs, bijvoorbeeld claude-code.
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.label=User Agent
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.description=Tekst die de client identificeert in de User Agent-header van het verzoek, bijvoorbeeld claude-cli. Wordt hoofdletterongevoelig overal in de header gezocht.
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.label=Containertools
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.description=Tools waarvan de aanroepbody geneste MCP-tools kan bereiken, zoals exec van codex. Leeg voor een client die zijn MCP-tools direct declareert, wat het gebruikelijke geval is.
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.label=Patroon voor geneste aanroep
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.description=Reguliere expressie die de naam van een geneste tool in de aanroepbody van een containertool vindt; de eerste groep is de naam. Alleen de namen worden gelezen, nooit de argumenten.
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.label=Patroon voor toolnaam
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.description=Reguliere expressie die het gedeelde patroon voor toolnamen alleen voor deze client vervangt; de eerste groep is de MCP-server, de tweede de tool, en een naam telt alleen als beide groepen niet leeg zijn. De vergelijking is hoofdlettergevoelig en vindt het patroon overal in de naam, tenzij het met ^ en $ is verankerd. Laat het weg om het gedeelde patroon te gebruiken. Een lege of ongeldige expressie komt voor deze client via het patroon met niets overeen (er wordt niet teruggevallen op het gedeelde patroon), maar de servernamen blijven wel gelden.
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.label=Servernamen
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.description=De MCP-servers die deze installatie draait, voor een client waarvan de toolnamen geen markering dragen, zoals opencode, die de tool ping_probe van server probe declareert als probe_ping_probe. Een gedeclareerde tool met de naam <server>_<tool> wordt dan de identiteit mcp:server/tool; het naampatroon wordt eerst geprobeerd, daarna de servers in de volgorde van de lijst, en de eerste passende server wint. Servernamen zijn hoofdlettergevoelig. Lege items worden genegeerd. Blijft de lijst leeg, dan blijven zulke tools gewone functietools.
schema.platform.toolGovernance.retention.label=Bewaring
schema.platform.toolGovernance.retention.rawDays.label=Bewaartermijn toolgebruik (dagen)
schema.platform.toolGovernance.retention.rawDays.description=Aantal dagen dat een rij met toolgebruik per verzoek wordt bewaard voordat de nachtelijke opschoning hem verwijdert. De dagelijkse aggregaten bewaren de totalen.
schema.platform.toolGovernance.retention.dailyDays.label=Bewaartermijn aggregaten toolgebruik (dagen)
schema.platform.toolGovernance.retention.dailyDays.description=Aantal dagen dat een dagelijks aggregaat van toolgebruik (per gebruiker, tool en dag) wordt bewaard. De inventaris en de gebruikerspagina lezen deze.
schema.platform.maintenance.label=Onderhoud
schema.platform.maintenance.description=Wanneer de beheerservice zijn dagelijkse onderhoud uitvoert: de herberekening van de kosten, het opnieuw opbouwen van de gebruiksbuckets en het opnieuw publiceren van het quotadocument van elke gebruiker.
schema.platform.maintenance.dailyRunAtUtc.label=Dagelijkse uitvoering om (UTC)
schema.platform.maintenance.dailyRunAtUtc.description=Tijdstip, in UTC, als HH:MM (24-uursnotatie), waarop de dagelijkse onderhoudsrun start. Niet ingesteld: de run start 5 minuten nadat de beheerservice is gestart en daarna elke 24 uur, dus een herdeployment rond het middaguur legt hem vast op het middaguur. Ingesteld: de eerste run start nog steeds 5 minuten na het opstarten; elke latere run start elke dag op dit tijdstip. Voorbeeld: om om middernacht Pacific Time te draaien, voert u 08:00 in zolang Pacific Standard Time geldt (UTC-8) of 07:00 tijdens Pacific Daylight Time (UTC-7) - de waarde wordt niet aangepast voor zomertijd.
schema.observability.label=Monitoring
schema.observability.pseudonymization.label=Pseudonimisering
schema.observability.pseudonymization.description=Instellingen van de pseudonimiseringsplug-in. De activering (enabled) en de schakelaars per categorie (entities) gelden alleen voor deze plug-in; maskering vindt alleen plaats wanneer de plug-in daadwerkelijk voor een verzoek wordt uitgevoerd - hij moet in de hookketen zijn geregistreerd en er moet een activeringsbron worden geactiveerd.
schema.observability.pseudonymization.enabled.label=Ingeschakeld
schema.observability.pseudonymization.enabled.description=Dwingt maskering voor een verzoek af. Wordt alleen gelezen waar dit blok onder models.overrides.<model>.pseudonymization of hooks.defaults.<endpoint>.pseudonymization staat: true maskeert daar dat verzoek, waarbij het blok per model wint van het blok per endpoint. False of afwezig dwingt niets af - maskering kan nog steeds plaatsvinden wanneer een andere activeringsbron wordt geactiveerd, zoals een triggerwoord of een maskeringsveld in de body van het verzoek. Onder observability.pseudonymization wordt deze sleutel momenteel genegeerd; die laag levert elke andere instelling hier, behalve method en allow_user_bypass. Hoe dan ook moet de plug-in in de hookketen zijn aangesloten, anders wordt er helemaal niets gemaskeerd.
schema.observability.pseudonymization.method.label=Methode
schema.observability.pseudonymization.method.description=Maskeringsmodus: `pseudonymization` maskeert het verzoek en ontmaskert het antwoord; `anonymization` maskeert en ontmaskert nooit. Wordt alleen gelezen waar dit blok maskering afdwingt (een ingeschakelde hook of modeloverschrijving), niet onder `observability.pseudonymization`. Bepaalt ook de SIEM: alleen `pseudonymization` bewaart het gemaskeerde antwoord, dus onder `anonymization` krijgt een contentsink de prompt maar niet het antwoord. Weggelaten valt het terug op `pseudonymization`. Modi: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.observability.pseudonymization.allow_user_bypass.label=Omzeilen door gebruiker toestaan
schema.observability.pseudonymization.allow_user_bypass.description=Heeft alleen gevolgen binnen een blok dat maskering afdwingt (een ingeschakelde hook of modeloverschrijving); wordt niet gelezen onder `observability.pseudonymization`. Standaard false. Bij true kan een aanroeper maskering overslaan via de header `x-sail-proxy-pseudonymization: off` (hoofdletterongevoelig) of het bodyveld `pseudonymization_off: true`: de inhoud bereikt de LLM ongemaskeerd, en ook die sink waar een ingeschakelde SIEM-sink zowel `include_content` als `allow_unmasked_content` instelt. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.observability.pseudonymization.entities.label=Entiteiten
schema.observability.pseudonymization.entities.description=Maskeringsschakelaars per categorie: `true` maskeert de categorie op deze laag, `false` niet, en een categorie die niet wordt genoemd, erft de laag eronder (latere lagen winnen). De sleutels zijn de set bekende categorieën: de categorieën die standaard aan staan; drie opt-in-categorieën die uit staan bij levering (`profile-org`, `profile-location`, `profile-ip-address`); en `profile-sensitive-data`, een overkoepelende schakelaar die alle categorieën aanzet behalve die drie. Een sleutel buiten de set wordt hier geweigerd. Categorieën en lagen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.observability.pseudonymization.org_suffixes.label=Organisatieachtervoegsels
schema.observability.pseudonymization.org_suffixes.description=Achtervoegsels van rechtsvormen die een reeks woorden als organisatienaam markeren, bijv. Inc, LLC, GmbH. De vergelijking is bewust hoofdlettergevoelig, zodat een 'limited' in kleine letters in lopende tekst bewust niet als rechtsvorm wordt behandeld; elke vermelding komt bovendien overeen in volledig hoofdletters, zodat een factuur die ACME GMBH schreeuwt, wordt herkend als dezelfde organisatie als Acme GmbH. Heeft alleen effect zolang profile-org in entities is ingeschakeld; profile-org inschakelen met deze lijst leeg maskeert NIETS als organisatie en logt één waarschuwing. Elke vermelding wordt vóór de vergelijking bijgesneden, en een lege vermelding of een vermelding met alleen witruimte wordt stilzwijgend weggelaten in plaats van geweigerd.
schema.observability.pseudonymization.location_gazetteer.label=Locatiegazetteer
schema.observability.pseudonymization.location_gazetteer.description=Letterlijke locatietermen die de structurele detector maskeert - hoofdletterongevoelig, en alleen als heel woord of hele zinsnede; er wordt niets afgeleid uit hoofdlettergebruik of context. Heeft alleen effect zolang profile-location in entities is ingeschakeld; profile-location inschakelen met deze lijst leeg maskeert NIETS als locatie en logt één waarschuwing. Elke vermelding wordt bijgesneden, en een lege vermelding of een vermelding met alleen witruimte wordt stilzwijgend weggelaten. Wordt leeg geleverd: plaatsnamen zijn specifiek voor elke installatie en deze repository is openbaar, dus vul de lijst via deze beheerconfiguratieapp, nooit in bijgehouden code.
schema.observability.pseudonymization.min_confidence.label=Min. betrouwbaarheid
schema.observability.pseudonymization.min_confidence.description=Hoeveel bewijs een gedetecteerde waarde nodig heeft voordat deze wordt gemaskeerd, van 0 tot 1 (standaard 0.5). Een waarde wordt gemaskeerd zodra de score de drempel bereikt; een gewone naam met hoofdletter scoort ongeveer 0.5, een met een controlesom gevalideerd patroon 0.95, een aangepaste regel 1.0. Een hogere drempel laat eerst gewone namen vallen, dus maak een enkele luidruchtige categorie strenger met `thresholds`. Aangepaste regels, gevalideerde identificatoren en inloggegevens worden nooit door hun omgeving verlaagd. Details van de score: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.observability.pseudonymization.thresholds.label=Drempels
schema.observability.pseudonymization.thresholds.description=Betrouwbaarheidsdrempels per categorie, elk van 0 tot 1, die `min_confidence` overschrijven voor de genoemde categorieën; een niet-genoemde categorie behoudt `min_confidence`. De plek om streng te zijn voor één luidruchtige categorie - `profile-person` op 0.65 vraagt meer bewijs voor namen, terwijl gevalideerde identificatoren op de globale drempel blijven. De sleutels zijn dezelfde set bekende categorieën die `entities` accepteert; `profile-sensitive-data` wordt geaccepteerd maar doet niets. Afstemming per categorie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.observability.pseudonymization.allowlist.label=Toelatingslijst
schema.observability.pseudonymization.allowlist.description=Waarden die deze installatie nooit maskeert - een UIT-schakelaar, per waarde. Geraadpleegd vóór de betrouwbaarheidsscore, dus een vermelde waarde is vrijgesteld, hoeveel bewijs er ook is. Gebruik dit voor een terugkerend fout-positief met een eigen naam - een product- of rapporttitel die leest als een persoon. De lijsten van de lagen worden SAMENGEVOEGD, niet vervangen, dus een lagere laag voegt alleen een vrijstelling toe en laat er nooit een vallen. `terms` versus `patterns`, en het risico van te brede vermeldingen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.allowlist.terms.label=Termen
schema.observability.pseudonymization.allowlist.terms.description=Letterlijke waarden, vergeleken met de hele gedetecteerde waarde en HOOFDLETTERGEVOELIG. Bewust hoofdlettergevoelig: 'Watson Studio' is het product dat een beheerder wilde vrijstellen en 'watson studio' in een zin niet, en een hoofdletterongevoelige lijst zou ook een persoon vrijstellen wiens achternaam toevallig hetzelfde gespeld wordt. Een term komt alleen overeen met een waarde die de detectoren in zijn geheel hebben opgeleverd - 'Studio' vermelden stelt 'Watson Studio' niet vrij. Elke vermelding hier is een UIT-schakelaar voor maskering van precies die waarde, dus beperk de lijst tot waarden die werkelijk nooit persoonsgegevens zijn: een term die toevallig iemands naam is, stelt die persoon overal in deze installatie vrij van maskering, stilzwijgend en zonder iets in de log dat dit meldt.
schema.observability.pseudonymization.allowlist.patterns.label=Patronen
schema.observability.pseudonymization.allowlist.patterns.description=Reguliere expressies (JavaScript), elk vergeleken met de HELE gedetecteerde waarde: de gateway zet elke vermelding zelf tussen `^(?: )$`, dus schrijf `Z[A-Z0-9_]+`, niet `^Z[A-Z0-9_]+$`. De vergelijking is hoofdlettergevoelig. Elke vermelding is een UIT-schakelaar voor maskering, en een brede vermelding schakelt maskering uit zonder te mislukken - `[A-Z].*` schakelt bijna elke gedetecteerde persoonsnaam uit. Een overeenkomst met een ingebouwd PII-voorbeeld geeft een waarschuwing maar wordt TOCH toegepast. Houd elke vermelding smal. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.saturation_warn.label=Verzadigingswaarschuwing
schema.observability.pseudonymization.saturation_warn.description=Hoeveel VERSCHILLENDE gemaskeerde waarden één verzoek mag bevatten voordat het als verzadigd wordt gemeld (standaard 40). Alleen rapportage - het verandert nooit wat wordt gemaskeerd. Boven dit aantal logt de gateway per verzoek één waarschuwing met aantallen per categorie en de meest voorkomende waardeVORMEN (letters als X, cijfers als 9); er verschijnt nooit een gemaskeerde waarde. De SIEM-gebruiksgebeurtenis van het verzoek bevat dezelfde aantallen met een vlag `saturated` - aantallen, geen tekst. Het rapport lezen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.observability.pseudonymization.unknown_placeholders.label=Verzonnen plaatsaanduidingen
schema.observability.pseudonymization.unknown_placeholders.description=Wat er gebeurt wanneer een antwoord een gemaskeerde plaatsaanduiding bevat die nooit naar het model is verzonden. Modellen verzinnen er een in ongeveer 1 op de 125 gepseudonimiseerde antwoorden, en vaker naarmate een verzoek meer waarden maskeert; zo’n plaatsaanduiding noemt niemand en kan nooit worden opgelost. withhold (standaard): wordt vervangen door een eenvoudige markering zoals [name withheld] en gemeld als beveiligingsgebeurtenis. report: wordt alleen gemeld en bereikt de client ongewijzigd, voor een installatie waarvan de eigen ontwikkelaars via de gateway nieuwe plaatsaanduidingen in testgegevens schrijven. off: geen van beide. Een plaatsaanduiding die de client zelf in hetzelfde verzoek heeft verzonden, wordt nooit als verzonnen behandeld.
schema.observability.siem.label=SIEM
schema.observability.siem.description=SIEM-export. Audit- en beveiligingsgebeurtenissen worden naar een outbox geschreven en minstens één keer aan elke ingeschakelde sink geleverd.
schema.observability.siem.enabled.label=Ingeschakeld
schema.observability.siem.enabled.description=Hoofdschakelaar. Bij false start de dispatcher niet, ongeacht de instellingen per sink.
schema.observability.siem.batch_size.label=Batchgrootte
schema.observability.siem.batch_size.description=Standaard aantal rijen dat per sink per tick wordt gelezen; een sink kan dit overschrijven.
schema.observability.siem.interval_ms.label=Interval (ms)
schema.observability.siem.interval_ms.description=Standaard verzendinterval in milliseconden; een sink kan dit overschrijven. De timerperiode is de kortste van alle intervallen die in gebruik zijn.
schema.observability.siem.reconcile_lookback_ms.label=Terugkijkperiode voor afstemming (ms)
schema.observability.siem.reconcile_lookback_ms.description=Hoe ver terug, in milliseconden, de herstelronde zoekt naar outboxgebeurtenissen die nooit aan een sink zijn overgedragen. Begrenst die scan en voorkomt dat een nieuw ingeschakelde sink de volledige bewaarde geschiedenis opnieuw afspeelt; oudere gebeurtenissen worden nooit achteraf aangevuld.
schema.observability.siem.content_max_bytes.label=Max. bytes inhoud
schema.observability.siem.content_max_bytes.description=Limiet, in UTF-8-bytes, die onafhankelijk op de prompt en op het antwoord wordt toegepast voordat een gebruiksgebeurtenis wordt gepubliceerd. Een ingekorte gebeurtenis bevat content.truncated: true, zodat een gedeeltelijke payload nooit voor een volledig gesprek wordt aangezien. 0 wordt geaccepteerd en maakt de inhoud leeg, gemarkeerd als ingekort. Standaard 8192, waar ook een negatieve of niet-numerieke waarde op uitkomt.
schema.observability.siem.categories.label=Categorieën
schema.observability.siem.categories.description=Gebeurteniscategorieën die worden geëxporteerd. 'usage' is één voltooiingsgebeurtenis per verzoek en is de enige categorie die gespreksinhoud kan bevatten; de meegeleverde lijst laat ze weg, dus exporteren ervan is een expliciete opt-in; een ontbrekende of lege lijst exporteert alle drie, usage inbegrepen.
schema.observability.siem.sinks.label=Sinks
schema.observability.siem.sinks.description=Geconfigureerde sinks. Een sink waarvan de instellingen niet door de validatie komen, wordt met een waarschuwing overgeslagen in plaats van de andere te stoppen.
schema.observability.siem.sinks.items.name.label=Naam
schema.observability.siem.sinks.items.name.description=Unieke sinknaam; de sleutel voor de leveringsrijen per sink en de backoffstatus.
schema.observability.siem.sinks.items.type.label=Type
schema.observability.siem.sinks.items.type.description=Sinkimplementatie. Bepaalt welke van de typespecifieke eigenschappen hieronder van toepassing zijn.
schema.observability.siem.sinks.items.enabled.label=Ingeschakeld
schema.observability.siem.sinks.items.enabled.description=Wordt geleverd als false. Naar een sink wordt alleen verzonden wanneer zowel siem.enabled als deze true zijn.
schema.observability.siem.sinks.items.include_content.label=Inhoud opnemen
schema.observability.siem.sinks.items.include_content.description=Opt-in: verzendt de prompt en het antwoord van elk verzoek naar deze sink, als deel van een gebruiksgebeurtenis. Standaard false, en false op elke meegeleverde sink. Wat wordt verzonden, is de gepseudonimiseerde vorm - plaatsaanduidingen, geen ruwe PII - tenzij ook allow_unmasked_content is ingesteld. Vereist 'usage' in siem.categories; de dispatcher verwijdert de inhoud volledig voor een sink waarvoor dit false is.
schema.observability.siem.sinks.items.allow_unmasked_content.label=Ongemaskeerde inhoud toestaan
schema.observability.siem.sinks.items.allow_unmasked_content.description=RISICO - leest ruwe gesprekken. Opt-in om inhoud te ontvangen die pseudonimisering nooit heeft gemaskeerd, omdat maskering voor dat verzoek was uitgeschakeld of omzeild: echte namen, adressen en alles wat een gebruiker heeft geplakt, volledig, dat dit systeem verlaat. Standaard false, en heeft alleen effect waar include_content ook true is. Blijft het false, dan verzendt zo’n verzoek alleen metadata en legt het content.omitted: 'not-masked' vast.
schema.observability.siem.sinks.items.include_credential_material.label=Materiaal van inloggegevens opnemen
schema.observability.siem.sinks.items.include_credential_material.description=Opt-in: verzendt de ruwe waarde van niet-opgeloste inloggegevens voor forensisch onderzoek. Standaard false; de dispatcher verwijdert het veld bij false.
schema.observability.siem.sinks.items.batch_size.label=Batchgrootte
schema.observability.siem.sinks.items.batch_size.description=Overschrijving per sink van siem.batch_size.
schema.observability.siem.sinks.items.interval_ms.label=Interval (ms)
schema.observability.siem.sinks.items.interval_ms.description=Overschrijving per sink van siem.interval_ms. Moet groter zijn dan de verzendtime-out van de sink, anders lopen verzendingen achter elkaar in de wachtrij.
schema.observability.siem.sinks.items.url.label=URL
