schema.providers.google.description=De aanbieder google, bediend door het Gemini-verzoekpad van de gateway. Vandaag wordt alleen substitute_models gerespecteerd; de andere algemene aanbiedersinstellingen zijn voor deze aanbieder nog niet aangesloten, dus - anders dan bij elke andere benoemde aanbieder hier - worden ze geweigerd in plaats van alleen inactief te blijven.
