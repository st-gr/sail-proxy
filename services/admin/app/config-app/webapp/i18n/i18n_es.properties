schema.providers.perplexity.param_renames.description=Cambios de nombre de parámetros aplicados en la ruta de despliegue directo, por ejemplo max_tokens a max_completion_tokens para los modelos de razonamiento de OpenAI que rechazan max_tokens. Un mapa por modelo sustituye al mapa del proveedor en lugar de añadirse a él.
schema.providers.perplexity.supports_responses_api.label=Admite la Responses API
schema.providers.perplexity.supports_responses_api.description=Si este proveedor o modelo puede atenderse en /openai/v1/responses. Si falta, se mantiene la regla integrada por familia, que admite GPT-5 desplegado y posteriores y la serie o.
schema.providers.perplexity.supports_prompt_caching.label=Admite caché de prompts
schema.providers.perplexity.supports_prompt_caching.description=Si los modelos de este proveedor reciben puntos de corte de caché de prompts de Anthropic. Orden de resolución: el flag por modelo models.overrides.<model>.supports_prompt_caching, luego este flag del proveedor y luego un valor predeterminado de true para el proveedor anthropic y false para todos los demás. Poner false donde la caché sí funciona cuesta el precio completo de entrada sin caché en cada turno, mientras que un true innecesario se midió como sin efecto - así que desactívelo solo para un modelo que se sepa que lo rechaza.
schema.providers._entry.description=Los ajustes de proveedor que puede alcanzar la ruta de solicitud de cualquier proveedor, por lo que cinco de los seis proveedores con nombre - todos menos google - contienen la forma completa. Todos los campos son opcionales, y un campo ausente significa el comportamiento integrado del gateway. Esta forma por sí sola es también contra la que se valida una clave de proveedor que el gateway no lee: allí una clave desconocida se sigue aceptando en lugar de rechazarse, y queda en el archivo sin efecto. Esos cinco proveedores con nombre añaden sus propios ajustes encima de estos y no aceptan nada más; google, el sexto, solo hace referencia al campo substitute_models de esta forma y no acepta nada más allá - la ruta /google aún no lee ningún otro ajuste de proveedor.
schema.providers._entry.emulate_streaming_for_models.label=Emular streaming para modelos
schema.providers._entry.emulate_streaming_for_models.description=Modelos cuya respuesta el gateway recopila completa y luego reproduce como stream, porque el despliegue no puede transmitirla por sí mismo. Se comparan con el nombre de modelo enviado upstream, exactamente o sin el prefijo 'provider--'. Hoy solo se usa para los proveedores anthropic y openai; una entrada bajo cualquier otro proveedor no tiene efecto.
schema.providers._entry.substitute_models.label=Modelos sustitutos
schema.providers._entry.substitute_models.description=Cambios de nombre de modelo para este proveedor: una solicitud que nombra 'from' (coincidencia exacta, incluidas mayúsculas y minúsculas) se reenvía como 'to'; gana la primera entrada que coincide y los cambios de nombre no se encadenan. La respuesta y el uso registrado para el coste indican entonces el modelo reenviado, no el nombre que envió el cliente. Se lee en las rutas anthropic, aws-bedrock y google, en la ruta de chat completions de openrouter y en las rutas de predicción de SAP RPT (/sap/v1/rpt, desde la lista sap-rpt), cada una para su propio proveedor; en /openai/v1/chat/completions y /openai/v1/responses se consulta primero la lista de openai y después la de perplexity.
schema.providers._entry.substitute_models.items.from.label=De
schema.providers._entry.substitute_models.items.from.description=El nombre de modelo que envía el cliente.
schema.providers._entry.substitute_models.items.to.label=A
schema.providers._entry.substitute_models.items.to.description=El nombre de modelo reenviado a SAP AI Core, normalmente un id de modelo desplegado como anthropic--claude-4.5-sonnet--deployed.
schema.providers._entry.substitute_models.items.description.label=Descripción
schema.providers._entry.substitute_models.items.description.description=Nota de texto libre sobre este cambio de nombre, para quien lea la configuración más adelante. Actualmente el gateway la ignora; no cambia nada en el comportamiento del cambio de nombre.
schema.providers._entry.unsupported_params.label=Parámetros no admitidos
schema.providers._entry.unsupported_params.description=Parámetros de solicitud que este proveedor o modelo no acepta. El gateway los quita antes de reenviar a SAP AI Core, que de lo contrario rechazaría la solicitud con 400 "does not support parameters: [...]". Una lista por modelo sustituye a la lista del proveedor en lugar de añadirse a ella.
schema.providers._entry.param_renames.label=Cambios de nombre de parámetros
schema.providers._entry.param_renames.description=Cambios de nombre de parámetros aplicados en la ruta de despliegue directo, por ejemplo max_tokens a max_completion_tokens para los modelos de razonamiento de OpenAI que rechazan max_tokens. Un mapa por modelo sustituye al mapa del proveedor en lugar de añadirse a él.
schema.providers._entry.supports_responses_api.label=Admite la Responses API
schema.providers._entry.supports_responses_api.description=Si este proveedor o modelo puede atenderse en /openai/v1/responses. Si falta, se mantiene la regla integrada por familia, que admite GPT-5 desplegado y posteriores y la serie o.
schema.providers._entry.supports_prompt_caching.label=Admite caché de prompts
schema.providers._entry.supports_prompt_caching.description=Si los modelos de este proveedor reciben puntos de corte de caché de prompts de Anthropic. Orden de resolución: el flag por modelo models.overrides.<model>.supports_prompt_caching, luego este flag del proveedor y luego un valor predeterminado de true para el proveedor anthropic y false para todos los demás. Poner false donde la caché sí funciona cuesta el precio completo de entrada sin caché en cada turno, mientras que un true innecesario se midió como sin efecto - así que desactívelo solo para un modelo que se sepa que lo rechaza.
schema.models.label=Modelos
schema.models.overrides.label=Anulaciones
schema.models.overrides.description=Ajustes por modelo combinados con la lista de modelos que el gateway obtiene de SAP AI Core. Cada clave es el id interno de un modelo, escrito exactamente como aparece en la transmisión.
schema.models.overrides._entry.description=Ajustes para un modelo, combinados con lo que SAP AI Core informa sobre él y con el id interno del modelo como clave arriba. La combinación es deliberadamente abierta: cualquier clave no indicada abajo se copia tal cual en el modelo y se vuelve a publicar en la lista de modelos, sin validar ni tipar, en lugar de ignorarse. Los campos de abajo son aquellos sobre los que actúa el propio gateway.
schema.models.overrides._entry.hooks.label=Hooks
schema.models.overrides._entry.hooks.description=Hooks para este modelo, con el subpath de solicitud que activan como clave (invoke, invoke-with-response-stream, converse, ...). Un subpath indicado aquí SUSTITUYE al valor predeterminado del endpoint en hooks.defaults para ese subpath en lugar de combinarse con él; un subpath no indicado recurre a ese valor predeterminado. Un hook se dispara solo cuando se cumplen todas las reglas de su request.match, y request.callback.id nombra el plugin que se ejecuta.
schema.models.overrides._entry.hooks._entry.description=La lista de hooks de un subpath, probados en orden. La misma forma sirve para hooks.defaults.<endpoint>.<subpath> y models.overrides.<model>.hooks.<subpath>, de modo que el gateway ve una sola forma, la aporte cualquiera de las dos. Un hook se dispara solo cuando TODAS las reglas que nombra su request.match coinciden con la solicitud; request.callback.id nombra entonces el plugin que se ejecuta para la fase en curso. Un hook cuyo match no se cumple, o cuyo callback no nombra ningún plugin registrado para esa fase, se omite y se prueba el siguiente - ninguno de los dos casos es un error en tiempo de ejecución.
schema.models.overrides._entry.hooks._entry.items.request.label=Solicitud
schema.models.overrides._entry.hooks._entry.items.request.description=Lo que debe coincidir y lo que se ejecuta cuando coincide. Se llama así por la solicitud porque el comparador solo inspecciona la solicitud entrante; no hay equivalente para la respuesta, y no se lee nada más de un hook.
schema.models.overrides._entry.hooks._entry.items.request.callback.label=Callback
schema.models.overrides._entry.hooks._entry.items.request.callback.description=El plugin que se ejecuta una vez que han coincidido todas las reglas de match.
schema.models.overrides._entry.hooks._entry.items.request.callback.id.label=ID
schema.models.overrides._entry.hooks._entry.items.request.callback.id.description=El id con el que se registró un plugin, buscado en el registro de plugins del gateway para la fase en ejecución. Este esquema no puede comprobar la referencia cruzada: un id que ningún plugin registró para esa fase se registra en el log como no encontrado y el hook se omite, por lo que la solicitud pasa sin modificar en lugar de fallar.
schema.models.overrides._entry.hooks._entry.items.request.match.label=Coincidencia
schema.models.overrides._entry.hooks._entry.items.request.match.description=Los ids de regla que deben coincidir TODOS, evaluados en orden y abandonados en el primero que no coincide. Cada id es una clave de hooks.definitions - una referencia cruzada que este esquema no puede comprobar: un id que no está definido allí registra una advertencia y hace que todo el hook no coincida, por lo que una errata desactiva el plugin en silencio en lugar de dispararlo incondicionalmente. Una lista vacía se rechaza, porque un hook que debe ejecutarse sobre casi todo se escribe nombrando en su lugar una regla deliberadamente amplia - la regla entregada payload:any coincide con cualquier solicitud cuyo cuerpo analizado contenga un model de cadena no vacía, que es lo más cercano a incondicional que puede ser una regla y aun así lo dice explícitamente.
schema.models.overrides._entry.subpaths_native.label=Subpaths nativos
schema.models.overrides._entry.subpaths_native.description=Los subpaths que este modelo atiende de forma nativa, con la grafía propia del gateway (invoke, invoke-with-response-stream, converse, converse-stream). Se lee como la lista completa: mientras está presente, todo subpath que falte en ella cuenta como emulado. Si falta, se recurre a invoke más invoke-with-response-stream. Sustituye al valor propio de la lista de modelos, se vuelve a publicar en la entrada del modelo, y una entrada que termina en -stream también alimenta la regla streamingSupported de abajo.
schema.models.overrides._entry.subpaths_emulated.label=Subpaths emulados
schema.models.overrides._entry.subpaths_emulated.description=Los subpaths a los que este modelo llega mediante emulación del gateway en lugar de forma nativa. Nada se enruta según esto - un subpath cuenta como emulado simplemente por faltar en subpaths_native -, así que la lista es solo declarativa: sustituye al valor propio de la lista de modelos y se vuelve a publicar en la entrada del modelo para los clientes que la inspeccionan, y nada más.
schema.models.overrides._entry.streamingSupported.label=Streaming admitido
schema.models.overrides._entry.streamingSupported.description=Si este modelo admite respuestas en streaming; en camelCase porque es la grafía propia de SAP AI Core en la lista de modelos. Para un modelo que tenga alguna entrada en overrides: un true o false explícito aquí gana; si no, una entrada de subpaths_native que termina en -stream significa true, salvo que la lista de modelos ya dijera false; si no, un modelo con acceso por despliegue que tiene una entrada pero ningún valor explícito se fuerza a FALSE - así que añadir una entrada para un despliegue con streaming y omitir este flag desactiva el streaming. Un modelo fundacional conserva su valor de AI Core. El resultado se aplica a todas las versiones del modelo.
schema.models.overrides._entry.supports_prompt_caching.label=Admite caché de prompts
schema.models.overrides._entry.supports_prompt_caching.description=Si este modelo recibe puntos de corte de caché de prompts de Anthropic. Orden de resolución: este flag por modelo, luego el flag del proveedor api_config.providers.<provider>.supports_prompt_caching y luego un valor predeterminado de true para los modelos del proveedor Anthropic y false para todos los demás. Póngalo en false para excluir un modelo; un true en un modelo de Anthropic sin anulación a nivel de proveedor no cambia nada.
schema.models.overrides._entry.anthropic_version.label=Versión de Anthropic
schema.models.overrides._entry.anthropic_version.description=La anthropic_version que el gateway pone en el cuerpo de la solicitud invoke de Bedrock de este modelo cuando el llamante no aporta ninguna. Un cuerpo que ya contiene el campo no se toca, y los subpaths distintos de invoke no se modifican. El valor entregado es bedrock-2023-05-31.
schema.models.overrides._entry.pseudonymization.label=Seudonimización
schema.models.overrides._entry.pseudonymization.description=Ajustes del plugin de seudonimización. La activación (enabled) y los conmutadores por categoría (entities) solo se aplican a este plugin; el enmascaramiento ocurre únicamente cuando el plugin se ejecuta realmente para una solicitud - debe estar registrado en la cadena de hooks y debe dispararse una fuente de activación.
schema.models.overrides._entry.pseudonymization.enabled.label=Habilitado
schema.models.overrides._entry.pseudonymization.enabled.description=Fuerza la activación del enmascaramiento para una solicitud. Solo se lee donde este bloque está bajo models.overrides.<model>.pseudonymization o hooks.defaults.<endpoint>.pseudonymization: true allí enmascara esa solicitud, y el bloque por modelo gana sobre el bloque por endpoint. False o ausente no fuerza nada - el enmascaramiento aún puede ejecutarse cuando se dispara otra fuente de activación, como una palabra desencadenante o un campo de enmascaramiento en el cuerpo de la solicitud. Bajo observability.pseudonymization esta clave se ignora actualmente; esa capa aporta todos los demás ajustes de aquí excepto method y allow_user_bypass. En cualquier caso, el plugin debe estar conectado a la cadena de hooks, o no se enmascara nada en absoluto.
schema.models.overrides._entry.pseudonymization.method.label=Método
schema.models.overrides._entry.pseudonymization.method.description=Modo de enmascaramiento: `pseudonymization` enmascara la solicitud y desenmascara la respuesta; `anonymization` enmascara y nunca desenmascara. Solo se lee donde este bloque fuerza la activación del enmascaramiento (un hook habilitado o una anulación de modelo), no bajo `observability.pseudonymization`. También condiciona el SIEM: solo `pseudonymization` conserva la respuesta enmascarada, así que con `anonymization` un sink de contenido recibe el prompt pero no la respuesta. Si se omite, se usa `pseudonymization`. Modos: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.models.overrides._entry.pseudonymization.allow_user_bypass.label=Permitir omisión por el usuario
schema.models.overrides._entry.pseudonymization.allow_user_bypass.description=Solo tiene efecto dentro de un bloque de activación forzada (un hook habilitado o una anulación de modelo); no se lee bajo `observability.pseudonymization`. Valor predeterminado false. Si es true, un llamante puede omitir el enmascaramiento mediante el encabezado `x-sail-proxy-pseudonymization: off` (sin distinguir mayúsculas y minúsculas) o el campo del cuerpo `pseudonymization_off: true`: el contenido llega sin enmascarar al LLM y, cuando un sink SIEM habilitado establece tanto `include_content` como `allow_unmasked_content`, también a ese sink. Detalles: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.models.overrides._entry.pseudonymization.entities.label=Entidades
schema.models.overrides._entry.pseudonymization.entities.description=Conmutadores de enmascaramiento por categoría: `true` enmascara la categoría en esta capa, `false` no, y una categoría no indicada hereda la capa inferior (las capas posteriores ganan). Las claves son el conjunto de categorías conocidas: las categorías activadas por defecto; tres opcionales que vienen desactivadas (`profile-org`, `profile-location`, `profile-ip-address`); y `profile-sensitive-data`, un comodín que activa todas excepto esas tres. Una clave fuera del conjunto se rechaza aquí. Categorías y capas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.models.overrides._entry.pseudonymization.org_suffixes.label=Sufijos de organización
schema.models.overrides._entry.pseudonymization.org_suffixes.description=Sufijos de forma jurídica que marcan una serie de palabras como nombre de organización, p. ej. Inc, LLC, GmbH. La coincidencia distingue mayúsculas y minúsculas a propósito, de modo que un 'limited' en minúsculas en un texto no se trata deliberadamente como forma jurídica; cada entrada coincide además escrita totalmente en mayúsculas, de modo que una factura que escribe ACME GMBH se reconoce como la misma organización que Acme GmbH. Solo tiene efecto mientras profile-org esté habilitado en entities; habilitar profile-org con esta lista vacía NO enmascara nada como organización y registra una advertencia. Cada entrada se recorta antes de la comparación, y una entrada vacía o solo con espacios se descarta en silencio en lugar de rechazarse.
schema.models.overrides._entry.pseudonymization.location_gazetteer.label=Nomenclátor de ubicaciones
schema.models.overrides._entry.pseudonymization.location_gazetteer.description=Términos de ubicación literales que enmascara el detector estructural - sin distinguir mayúsculas y minúsculas, y solo como palabra o frase completa; no se infiere nada de las mayúsculas ni del contexto. Solo tiene efecto mientras profile-location esté habilitado en entities; habilitar profile-location con esta lista vacía NO enmascara nada como ubicación y registra una advertencia. Cada entrada se recorta, y una entrada vacía o solo con espacios se descarta en silencio. Viene vacía: los nombres de lugares dependen de cada implantación y este repositorio es público, así que rellénela mediante esta aplicación de configuración de administración, nunca en código versionado.
schema.models.overrides._entry.pseudonymization.min_confidence.label=Confianza mín.
schema.models.overrides._entry.pseudonymization.min_confidence.description=Cuánta evidencia necesita un valor detectado antes de enmascararse, de 0 a 1 (predeterminado 0.5). Un valor se enmascara cuando su puntuación alcanza el umbral; un nombre propio simple puntúa alrededor de 0.5, un patrón validado por suma de comprobación 0.95, una regla personalizada 1.0. Subir el umbral elimina primero los nombres simples, así que, para endurecer una sola categoría ruidosa, use `thresholds` en su lugar. Las reglas personalizadas, los identificadores validados y las credenciales nunca se rebajan por su entorno. Detalle de la puntuación: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.models.overrides._entry.pseudonymization.thresholds.label=Umbrales
schema.models.overrides._entry.pseudonymization.thresholds.description=Umbrales de confianza por categoría, cada uno de 0 a 1, que anulan `min_confidence` para las categorías nombradas; una no indicada conserva `min_confidence`. El lugar para ser estricto con una sola categoría ruidosa - `profile-person` en 0.65 exige más evidencia para los nombres mientras los identificadores validados se quedan en el umbral global. Las claves son el mismo conjunto de categorías conocidas que admite `entities`; `profile-sensitive-data` se acepta pero no hace nada. Ajuste por categoría: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.models.overrides._entry.pseudonymization.allowlist.label=Lista de permitidos
schema.models.overrides._entry.pseudonymization.allowlist.description=Valores que esta implantación nunca enmascara - un interruptor de APAGADO, por valor. Se consulta antes de la puntuación de confianza, por lo que un valor listado queda exento por mucha evidencia que haya. Úsela para un falso positivo recurrente con nombre propio - un título de producto o de informe que parece una persona. Las listas de las capas se CONCATENAN, no se sustituyen, así que una capa inferior solo añade una exención, nunca quita una. `terms` frente a `patterns`, y el riesgo de las entradas demasiado amplias: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.allowlist.terms.label=Términos
schema.models.overrides._entry.pseudonymization.allowlist.terms.description=Valores literales, comparados con el valor detectado completo y DISTINGUIENDO mayúsculas y minúsculas. Distingue mayúsculas a propósito: 'Watson Studio' es el producto que un operador quería eximir y 'watson studio' en una frase no lo es, y una lista sin distinción de mayúsculas eximiría también a una persona cuyo apellido casualmente se escribe igual. Un término solo coincide con un valor que los detectores produjeron completo - listar 'Studio' no exime 'Watson Studio'. Cada entrada aquí es un interruptor de APAGADO del enmascaramiento para ese valor exacto, así que limite la lista a valores que realmente nunca son datos personales: un término que casualmente es el nombre de alguien exime a esa persona del enmascaramiento en toda esta implantación, en silencio y sin nada en el log que lo indique.
schema.models.overrides._entry.pseudonymization.allowlist.patterns.label=Patrones
schema.models.overrides._entry.pseudonymization.allowlist.patterns.description=Expresiones regulares (JavaScript), cada una comparada con el valor detectado COMPLETO: el propio gateway envuelve cada entrada en `^(?: )$`, así que escriba `Z[A-Z0-9_]+`, no `^Z[A-Z0-9_]+$`. La coincidencia distingue mayúsculas y minúsculas. Cada entrada es un interruptor de APAGADO del enmascaramiento, y una amplia desactiva el enmascaramiento sin fallar - `[A-Z].*` desactiva casi todos los nombres de persona detectados. Una coincidencia con una muestra de PII integrada genera una advertencia pero AUN ASÍ se aplica. Mantenga cada entrada acotada. Detalle: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.saturation_warn.label=Aviso de saturación
schema.models.overrides._entry.pseudonymization.saturation_warn.description=Cuántos valores enmascarados DISTINTOS puede contener una solicitud antes de que se notifique como saturada (predeterminado 40). Solo informa - nunca cambia lo que se enmascara. Por encima del número, el gateway registra una advertencia por solicitud con recuentos por categoría y las FORMAS de valor más comunes (letras como X, dígitos como 9); nunca aparece ningún valor enmascarado. El evento SIEM de uso de la solicitud contiene los mismos recuentos con un flag `saturated` - recuentos, no texto. Cómo leer el informe: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.models.overrides._entry.pseudonymization.unknown_placeholders.label=Marcadores inventados
schema.models.overrides._entry.pseudonymization.unknown_placeholders.description=Qué ocurre cuando una respuesta contiene un marcador enmascarado que nunca se envió al modelo. Los modelos inventan uno en aproximadamente 1 de cada 125 respuestas seudonimizadas, y con más frecuencia cuantos más valores enmascara una solicitud; un marcador así no nombra a nadie y nunca puede resolverse. withhold (predeterminado): se sustituye por una marca simple como [name withheld] y se notifica como evento de seguridad. report: solo se notifica y llega sin cambios al cliente, para una implantación cuyos propios desarrolladores escriben nuevos marcadores en datos de prueba a través del gateway. off: ninguna de las dos cosas. Un marcador que el propio cliente envió en la misma solicitud nunca se trata como inventado.
schema.models.overrides._entry.unsupported_params.label=Parámetros no admitidos
schema.models.overrides._entry.unsupported_params.description=Parámetros de solicitud que este proveedor o modelo no acepta. El gateway los quita antes de reenviar a SAP AI Core, que de lo contrario rechazaría la solicitud con 400 "does not support parameters: [...]". Una lista por modelo sustituye a la lista del proveedor en lugar de añadirse a ella.
schema.models.overrides._entry.param_renames.label=Cambios de nombre de parámetros
schema.models.overrides._entry.param_renames.description=Cambios de nombre de parámetros aplicados en la ruta de despliegue directo, por ejemplo max_tokens a max_completion_tokens para los modelos de razonamiento de OpenAI que rechazan max_tokens. Un mapa por modelo sustituye al mapa del proveedor en lugar de añadirse a él.
schema.models.overrides._entry.supports_responses_api.label=Admite la Responses API
schema.models.overrides._entry.supports_responses_api.description=Si este proveedor o modelo puede atenderse en /openai/v1/responses. Si falta, se mantiene la regla integrada por familia, que admite GPT-5 desplegado y posteriores y la serie o.
schema.models.overrides._entry.cachePricing.label=Precios de caché
schema.models.overrides._entry.cachePricing.description=Precios de caché de prompts para este modelo; en camelCase a propósito, la grafía cache_pricing no se lee. Ambos valores son CADENAS de costo decimal por 1K tokens, nunca números: se trasladan sin cambios a la lista de costos de cada versión y se entregan a quien solicite los precios de caché de este modelo. Si falta, este modelo no informa ningún precio de caché.
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.label=Costo de entrada de lectura de caché por 1K
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.description=Costo de leer 1K tokens de entrada en caché, como cadena decimal - p. ej. 0.00020, no 0.0002e0 y no un número.
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.label=Costo de entrada de creación de caché por 1K
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.description=Costo de escribir 1K tokens de entrada en la caché, como cadena decimal - p. ej. 0.00254, no un número.
schema.models.overrides._entry.inject_beta_features.label=Inyectar funciones beta
schema.models.overrides._entry.inject_beta_features.description=Flags de funciones beta de Anthropic que el gateway añade a las solicitudes invoke de Bedrock de este modelo. Se combinan con el encabezado anthropic-beta y con cualquier anthropic_beta que contenga el cuerpo de la solicitud, y luego se filtran a través de supported_beta_headers, excluded_beta_headers y la cuarentena de flags beta en tiempo de ejecución - así que un flag listado aquí se descarta igualmente si no se le permite pasar. Una lista vacía no inyecta nada.
schema.models.overrides._entry.contextLength.label=Longitud de contexto
schema.models.overrides._entry.contextLength.description=La ventana de contexto de este modelo en tokens, usada solo como reserva: el gateway prefiere la longitud de contexto propia de la última versión según SAP AI Core y solo lee este valor cuando la lista de modelos no contiene ninguna, antes de recurrir a un valor predeterminado por familia. Se informa como context_length, y la mitad como max_completion_tokens, en las listas de modelos en formato OpenRouter y OpenAI. 0 no es un valor utilizable.
schema.capabilities.label=Capacidades
schema.capabilities.web_search.label=Búsqueda web
schema.capabilities.web_search.description=Herramienta de búsqueda web alojada (basada en Perplexity). El único ajuste aquí limita cuántas búsquedas puede ejecutar una sola solicitud.
schema.capabilities.web_search.max_searches_per_request.label=Máx. búsquedas por solicitud
schema.capabilities.web_search.max_searches_per_request.description=Límite de búsquedas web alojadas que puede realizar una solicitud antes de que el gateway deje de continuar el turno. Cada búsqueda cuesta una llamada a Perplexity más un viaje de ida y vuelta completo al despliegue, así que es un control de costos además de la garantía de terminación del bucle de continuación. Un valor no entero, cero, negativo o superior a 10 recurre al valor predeterminado de 3 en lugar de respetarse - el límite nunca debe poder eliminarse por configuración.
schema.capabilities.file_search.label=Búsqueda de archivos
schema.capabilities.file_search.description=Recuperación de documentos compatible con OpenAI: ingesta en /v1/files, /v1/vector_stores, búsqueda híbrida y la herramienta alojada file_search. Nada aquí es obligatorio - cada campo recurre a su propio valor predeterminado entregado cuando falta, así que eliminar un campo es una edición válida, no un error.
schema.capabilities.file_search.enabled.label=Habilitado
schema.capabilities.file_search.enabled.description=Interruptor principal de toda la función, predeterminado true. Se combina con "hay una base de datos configurada" y "la migración se ha ejecutado": false hace que todas las rutas /v1/files y /v1/vector_stores respondan 503 file_search_unavailable. El proceso de ingesta (que también ejecuta la nueva incrustación) y los dos depuradores solo lo comprueban al iniciarse, así que, tras cambiarlo, reinicie el gateway. Los archivos y almacenes ya guardados no se tocan.
schema.capabilities.file_search.embedding_model.label=Modelo de embedding
schema.capabilities.file_search.embedding_model.description=Modelo de embedding solicitado al despliegue de orquestación de SAP AI Core y registrado en cada evento del teacher log. Predeterminado text-embedding-3-large. Cada almacén vectorial conserva el modelo con el que se creó: sus búsquedas y sus archivos nuevos usan ese modelo, así que cambiar este ajuste no afecta a los almacenes existentes. Aparecen como obsoletos en el cockpit de Grounding, donde su propietario o un administrador puede volver a incrustarlos con el modelo nuevo; hasta entonces siguen respondiendo con sus vectores antiguos. Un modelo con otra anchura de vector también requiere cambiar embedding_dimensions, y volver a incrustar no puede cambiar la anchura de un almacén.
schema.capabilities.file_search.embedding_dimensions.label=Dimensiones de embedding
schema.capabilities.file_search.embedding_dimensions.description=Anchura del vector, enviada como parámetro dimensions del modelo de embedding y usada para crear la columna de vectores. Predeterminado 1536, y fijo una vez que existe un almacén: un vector de respuesta de cualquier otra longitud se rechaza, y todo almacén fijado a la anchura antigua responde 409 - tanto a una BÚSQUEDA como a una vinculación, así que deja de responder consultas y nunca puede aceptar otro archivo. Sigue pudiendo listarse, recuperarse y eliminarse. Por tanto, cambiar esto en una implantación con datos deja sus almacenes varados en lugar de migrarlos: volver a incrustar desde el cockpit de Grounding conserva la anchura de un almacén, así que un almacén así necesita una migración por parte de un operador.
schema.capabilities.file_search.rewrite_query.label=Reescribir consulta
schema.capabilities.file_search.rewrite_query.description=Si POST /v1/vector_stores/{id}/search reescribe la consulta del llamante a través del despliegue de orquestación antes de generar su embedding. Predeterminado false. Cuesta alrededor de 1.3s por búsqueda y es de mejor esfuerzo - una reescritura fallida recurre a la consulta original y nunca hace fallar la búsqueda. Solo esa ruta REST lee este valor, un rewrite_query por solicitud lo anula, y la HERRAMIENTA alojada file_search siempre pasa false porque el modelo ya ha convertido el turno del usuario en una consulta.
schema.capabilities.file_search.rewrite_query_model.label=Modelo de reescritura de consulta
schema.capabilities.file_search.rewrite_query_model.description=Modelo usado para la llamada de reescritura, predeterminado gpt-5-mini. Configurable en lugar de fijo porque un nombre de modelo válido en un tenant de SAP AI Core puede ser rechazado por otro. Solo se consulta cuando rewrite_query está activado.
schema.capabilities.file_search.hybrid.label=Híbrido
schema.capabilities.file_search.hybrid.description=Recuperación de la etapa 1 y reordenación opcional de la etapa 2. La etapa 1 ejecuta una clasificación por similitud vectorial y - cuando lexical_enabled - una clasificación de texto completo, fusiona ambas con reciprocal rank fusion y entrega los `candidates` mejores fragmentos al reordenador.
schema.capabilities.file_search.hybrid.rrf_k.label=k de RRF
schema.capabilities.file_search.hybrid.rrf_k.description=Constante de reciprocal rank fusion: cada clasificación aporta 1/(k + rank) a la puntuación fusionada de un fragmento. Predeterminado 60. Una k mayor aplana la diferencia entre posiciones vecinas, de modo que el acuerdo entre las dos clasificaciones importa más que el primer resultado de cada una; una menor deja que domine la cabeza de cada clasificación. Se registra en cada evento del teacher log, así que un cambio es visible en las etiquetas.
schema.capabilities.file_search.hybrid.lexical_enabled.label=Léxico habilitado
schema.capabilities.file_search.hybrid.lexical_enabled.description=Si la clasificación de texto completo se ejecuta junto a la clasificación vectorial. Predeterminado true. False fusiona solo la clasificación vectorial, así que las coincidencias exactas de palabras clave e identificadores que los embeddings no captan dejan de recuperarse por completo.
schema.capabilities.file_search.hybrid.lexical_query.label=Consulta léxica
schema.capabilities.file_search.hybrid.lexical_query.description=Cómo la clasificación de texto completo compara la consulta. "any" (predeterminado) conserva las palabras de la consulta que no son palabras vacías comunes en inglés o alemán ni un solo carácter (una letra o un dígito sueltos) y coincide con un chunk que contiene al menos una de ellas, así que una pregunta escrita como frase sigue encontrando chunks con sus términos clave; los chunks con más de esos términos se clasifican más arriba. "all" solo coincide con chunks que contienen todas las palabras de la consulta, palabras vacías incluidas - el comportamiento de versiones anteriores, que una pregunta en lenguaje natural rara vez cumple. Solo se aplica mientras lexical_enabled sea true.
schema.capabilities.file_search.hybrid.candidates.label=Candidatos
schema.capabilities.file_search.hybrid.candidates.description=Cuántos fragmentos fusionados recupera la etapa 1, predeterminado 50. Es el tamaño de entrada del reordenador y, por tanto, su costo por búsqueda, y también es un techo estricto de la respuesta: el max_num_results del llamante se aplica después, así que ninguna búsqueda puede devolver más fragmentos que este.
schema.capabilities.file_search.hybrid.rerank.label=Reordenación
schema.capabilities.file_search.hybrid.rerank.description=Etapa 2: un cross-encoder de Cohere alojado en SAP AI Core puntúa los candidatos de la etapa 1 frente a la consulta y devuelve una puntuación de relevancia calibrada entre 0 y 1 - la puntuación con la que filtra ranking_options.score_threshold.
schema.capabilities.file_search.hybrid.rerank.enabled.label=Habilitado
schema.capabilities.file_search.hybrid.rerank.enabled.description=Tres estados, y los tres valores no son grados de lo mismo. false nunca reordena: sin búsqueda de despliegue, sin llamada, y los resultados conservan su orden fusionado. "auto" (el predeterminado) es de mejor esfuerzo - si no hay ningún despliegue de reordenador en ejecución, o la llamada falla, agota el tiempo o está mal formada, se recurre al orden fusionado en lugar de hacer fallar la búsqueda. true EXIGE la etapa 2: tanto "no se encontró ningún despliegue" como "la llamada falló" hacen fallar la búsqueda, de modo que a un operador que pidió reordenación nunca se le sirven en silencio resultados sin reordenar.
schema.capabilities.file_search.hybrid.rerank.model.label=Modelo
schema.capabilities.file_search.hybrid.rerank.model.description=El nombre de modelo que sirve tanto para encontrar el despliegue del reordenador - el primer despliegue en estado RUNNING del escenario foundation-models que sirve un modelo con exactamente este nombre - como para la llamada de reordenación. Predeterminado "cohere-reranker" - verificado en vivo con el tenant, y NO el "cohere-reranker-35" publicado por SAP. No es una elección de proveedor: el gateway habla exactamente un protocolo de reordenación y solo varía el nombre del modelo, por eso el teacher log siempre registra el proveedor como "cohere".
schema.capabilities.file_search.hybrid.rerank.input.label=Entrada
schema.capabilities.file_search.hybrid.rerank.input.description=Lo que lee el reordenador para cada fragmento candidato. "context_and_text" (el predeterminado): el contexto del fragmento, si tiene uno, seguido de su texto; los fragmentos sin contexto (fragmentación estática) se leen como su texto. "text": solo el texto del fragmento. El contexto nunca aparece en los resultados de búsqueda.
schema.capabilities.file_search.ann.label=Búsqueda aproximada
schema.capabilities.file_search.ann.description=Búsqueda vectorial aproximada para vector stores grandes, mediante el índice HNSW. Desactivada por defecto: la clasificación vectorial compara entonces la consulta con cada chunk de los stores buscados, lo que es exacto pero tarda más cuanto más grandes son los stores. Activada, una búsqueda usa el índice solo donde compensa y sigue siendo exacta en los demás casos: con un filtro de atributos, cuando busca como máximo exact_max_chunks chunks o menos de min_fraction de todos los chunks almacenados, mientras el índice no sea todavía del tipo que construye el comando rebuild-index, y con pgvector anterior a 0.8. En algunas preguntas, la búsqueda aproximada puede devolver una lista completa de pasajes que omite la mayoría de los chunks que mejor coinciden, así que mida su recall con sus propios datos con la sonda de recall antes de activarla.
schema.capabilities.file_search.ann.enabled.label=Habilitado
schema.capabilities.file_search.ann.enabled.description=Si las búsquedas sobre stores grandes usan el índice HNSW. Predeterminado false: toda búsqueda es exacta. Cuando el índice devuelve menos chunks de los solicitados, la búsqueda se ejecuta de forma exacta.
schema.capabilities.file_search.ann.exact_max_chunks.label=Máx. de chunks para búsqueda exacta
schema.capabilities.file_search.ann.exact_max_chunks.description=Una búsqueda sobre como máximo esta cantidad de chunks sigue siendo exacta, contados sobre los stores que busca con un mismo modelo de embedding. Predeterminado 20000. El mismo número decide, esté activada o no la búsqueda aproximada, cuándo se limita la parte de texto completo de una búsqueda: una búsqueda sobre más chunks deja fuera de su consulta de cualquier palabra las palabras que contienen más del 5 por ciento de todos los chunks almacenados, y clasifica los pasajes con todas las palabras más como máximo otras 5000 coincidencias de texto completo. En una tabla analizada, 0 limita la parte de texto completo de toda búsqueda.
schema.capabilities.file_search.ann.min_fraction.label=Fracción mínima
schema.capabilities.file_search.ann.min_fraction.description=Una búsqueda sobre menos de esta proporción de todos los chunks almacenados sigue siendo exacta: ahí la búsqueda exacta es más rápida que el índice. Predeterminado 0.05 (5 por ciento).
schema.capabilities.file_search.chunking.label=Fragmentación
schema.capabilities.file_search.chunking.description=Cómo se dividen en fragmentos los documentos de un almacén vectorial NUEVO. Un almacén toma estos valores al crearse y los conserva: cambiarlos aquí nunca vuelve a fragmentar ni modifica un almacén existente. La configuración incluida define "structure" con 800 tokens sin solapamiento, con contextos. Una clave no definida significa lo que este formulario muestra para ella: fragmentación estática sin contextos, de modo que una configuración de una versión anterior, o una sin este bloque, mantiene la fragmentación estática. Los almacenes creados antes de que existiera este ajuste usan fragmentación estática de 800/400. Un archivo vinculado con una chunking_strategy estática explícita se divide con esa estrategia; "auto" o ninguna usa el ajuste del almacén. Los valores se comprueban al crear un almacén: chunk_overlap_tokens no debe superar la mitad de max_chunk_size_tokens, y contextual requiere la estrategia "structure". Si el ajuste no es válido, los almacenes nuevos reciben en su lugar fragmentación estática de 800/400 y el gateway registra una advertencia.
schema.capabilities.file_search.chunking.strategy.label=Estrategia
schema.capabilities.file_search.chunking.strategy.description="static" (el predeterminado si no se indica) divide el texto en ventanas solapadas de tamaño fijo, como la estrategia estática de OpenAI y las versiones anteriores. "structure" (definido en la configuración incluida) sigue las secciones y los encabezados del documento, de modo que un fragmento no cruza el límite de una sección; los archivos divididos así informan del tipo de estrategia de fragmentación "other" a través de la API de OpenAI. Activar contextual requiere "structure".
schema.capabilities.file_search.chunking.max_chunk_size_tokens.label=Tamaño máx. de fragmento en tokens
schema.capabilities.file_search.chunking.max_chunk_size_tokens.description=Fragmento más grande, en tokens, entre 100 y 4096. Predeterminado 800. Con "static" el tamaño es una estimación (número de palabras por 1.3); con "structure" se cuenta con un tokenizador real.
schema.capabilities.file_search.chunking.chunk_overlap_tokens.label=Tokens de solapamiento de fragmentos
schema.capabilities.file_search.chunking.chunk_overlap_tokens.description=Cuántos tokens repite cada fragmento de su predecesor, para que un pasaje dividido por un límite se recupere entero. Si no se indica: 0 con "structure", 400 con "static". No debe superar la mitad de max_chunk_size_tokens. Con "structure" el solapamiento solo se aplica dentro de una sección que necesita más de un fragmento.
schema.capabilities.file_search.chunking.contextual.label=Contextual
schema.capabilities.file_search.chunking.contextual.description=Si cada fragmento recibe además un contexto breve, escrito por un modelo de lenguaje, que lo sitúa en su documento y se busca junto con él. Desactivado si no se indica. Requiere la estrategia "structure"; añade una llamada al modelo por fragmento durante la ingesta, registrada como uso del propietario del almacén.
schema.capabilities.file_search.contextual.label=Contextos de fragmentos
schema.capabilities.file_search.contextual.description=Cómo se escriben los contextos de los fragmentos para los almacenes vectoriales cuyo ajuste de fragmentación es contextual: durante la ingesta, un modelo de lenguaje escribe un contexto breve para cada fragmento, que se busca junto con el fragmento. Estos valores no activan la fragmentación contextual; lo hace el ajuste de fragmentación del almacén. Una llamada fallida o que agota el tiempo deja ese fragmento sin contexto y nunca hace fallar el archivo.
schema.capabilities.file_search.contextual.model.label=Modelo
schema.capabilities.file_search.contextual.model.description=El modelo de orquestación de SAP AI Core que escribe los contextos. Predeterminado "gemini-3.5-flash-lite". Si el modelo no está disponible, los archivos se ingieren sin contextos. El documento se envía con cada fragmento de un archivo; los modelos Claude lo guardan en caché entre estas llamadas, los demás modelos lo hacen donde lo hacen por sí mismos.
schema.capabilities.file_search.contextual.max_document_tokens.label=Tamaño máx. de documento en tokens
schema.capabilities.file_search.contextual.max_document_tokens.description=Documento más grande, en tokens, que se envía completo con cada fragmento, entre 8192 y 200000. Predeterminado 32000. Un documento más largo se envía como un extracto de este tamaño alrededor del fragmento. Los valores mayores dan a cada contexto más del documento, pero cuestan más tokens de entrada por fragmento.
schema.capabilities.file_search.contextual.concurrency.label=Concurrencia
schema.capabilities.file_search.contextual.concurrency.description=Cuántas llamadas de contexto de un archivo se ejecutan a la vez, entre 1 y 16. Predeterminado 4. El primer fragmento de un archivo siempre se ejecuta solo.
schema.capabilities.file_search.contextual.request_timeout_ms.label=Tiempo de espera de la solicitud (ms)
schema.capabilities.file_search.contextual.request_timeout_ms.description=Límite de tiempo de una llamada de contexto, en milisegundos. Predeterminado 30000. Una llamada que tarda más deja su fragmento sin contexto.
schema.capabilities.file_search.contextual.file_deadline_ms.label=Plazo por archivo (ms)
schema.capabilities.file_search.contextual.file_deadline_ms.description=Tiempo, en milisegundos, tras el cual no se inicia ninguna otra llamada de contexto para un archivo. Predeterminado 360000 (6 minutos). Los fragmentos restantes se guardan sin contexto; el archivo se ingiere igualmente.
schema.capabilities.file_search.contextual.max_input_tokens_per_file.label=Máx. de tokens de entrada por archivo
schema.capabilities.file_search.contextual.max_input_tokens_per_file.description=Tokens de entrada que pueden usar las llamadas de contexto de un archivo, incluidos los tokens en caché, entre 10000 y 1000000000. Predeterminado 20000000. Cuando un archivo los ha usado, no se inicia ninguna otra llamada de contexto para él; los fragmentos restantes se guardan sin contexto y el archivo se ingiere igualmente.
schema.capabilities.file_search.parent_sections.label=Secciones superiores
schema.capabilities.file_search.parent_sections.description=Cómo se amplían los resultados de búsqueda de los almacenes vectoriales con fragmentación por estructura a la sección de la que proceden, para que el modelo lea una coincidencia en su contexto. Varias coincidencias en una sección se devuelven una sola vez, como esa sección. Los resultados de almacenes con fragmentación estática se devuelven tal cual.
schema.capabilities.file_search.parent_sections.max_tokens.label=Máx. tokens
schema.capabilities.file_search.parent_sections.max_tokens.description=Sección superior más grande que se devuelve, en tokens, entre 200 y 8000. Predeterminado 1500. Una sección más larga se devuelve como un extracto de este tamaño alrededor de la coincidencia; una coincidencia que por sí sola es más larga se devuelve sola.
schema.capabilities.file_search.parent_sections.scope.label=Ámbito
schema.capabilities.file_search.parent_sections.scope.description=Dónde se devuelven los resultados como secciones superiores: "tool" (el predeterminado) solo en la herramienta file_search de la API Responses; "all" también en el endpoint de búsqueda de los almacenes vectoriales, que en otro caso devuelve los fragmentos coincidentes; "off" en ningún sitio.
schema.capabilities.file_search.limits.label=Límites
schema.capabilities.file_search.limits.description=Techos estrictos de lo que se puede subir, extraer y vincular. Cada uno se aplica donde corresponde, no mediante este esquema, así que estos valores se leen en vivo y surten efecto sin reiniciar.
schema.capabilities.file_search.limits.max_file_bytes.label=Máx. bytes por archivo
schema.capabilities.file_search.limits.max_file_bytes.description=La mayor subida que acepta POST /v1/files, predeterminado 33554432 bytes (32 MiB). Se aplica MIENTRAS se lee la subida, no después, así que un cuerpo demasiado grande se corta en lugar de almacenarse en memoria, y el llamante recibe un 4xx limpio que nombra el límite.
schema.capabilities.file_search.limits.max_tokens_per_file.label=Máx. tokens por archivo
schema.capabilities.file_search.limits.max_tokens_per_file.description=El mayor documento extraído, en tokens estimados; predeterminado 5000000. Un archivo por encima del límite falla DE FORMA PERMANENTE en lugar de reintentarse. Reducir este valor no vuelve a comprobar los archivos ya ingeridos.
schema.capabilities.file_search.limits.max_files_per_store.label=Máx. archivos por almacén
schema.capabilities.file_search.limits.max_files_per_store.description=Techo de archivos vinculados a un almacén vectorial, predeterminado 10000. Limita los file_ids aceptados al crear un almacén - junto a un límite estricto de 500 ids de archivo por llamada de creación o de lote de archivos - y rechaza una vinculación o un lote de archivos que haría superarlo al almacén.
schema.capabilities.file_search.ingestion.label=Ingesta
schema.capabilities.file_search.ingestion.description=El proceso en segundo plano que extrae, fragmenta, genera embeddings y almacena un archivo vinculado, y vuelve a incrustar los archivos de un almacén cuyo modelo de embedding se está cambiando - primero las subidas. Toma trabajo del mismo pool de base de datos de file_search que usa la ruta de búsqueda, así que estos ajustes equilibran el rendimiento de la ingesta frente a la latencia de búsqueda.
schema.capabilities.file_search.ingestion.concurrency.label=Concurrencia
schema.capabilities.file_search.ingestion.concurrency.description=Cuántos bucles de reclamar y procesar inicia el proceso, predeterminado 4; los mismos bucles ejecutan también la nueva incrustación. Cada uno toma conexiones del pool de file_search de 10 conexiones para sus pasos de base de datos. Se lee una vez al iniciar, así que un cambio requiere reiniciar.
schema.capabilities.file_search.ingestion.extract_timeout_ms.label=Tiempo de espera de extracción (ms)
schema.capabilities.file_search.ingestion.extract_timeout_ms.description=Límite de tiempo para convertir un documento a texto con un conversor externo - PDF, docx, odt, epub y rst -, predeterminado 60000 ms. Los formatos de texto plano se decodifican directamente y no tienen límite. Un tiempo de espera agotado hace fallar ese intento, no el lote; el archivo se reintenta hasta max_retries veces.
schema.capabilities.file_search.ingestion.max_retries.label=Máx. reintentos
schema.capabilities.file_search.ingestion.max_retries.description=Intentos por archivo antes de que se dé por fallido, predeterminado 3; el mismo presupuesto se aplica a cada archivo de una nueva incrustación. Un entero de 1 o más se usa tal cual. 0 se lee como 1, con una advertencia - tomado al pie de la letra, haría fallar cada archivo vinculado antes de su primer intento. Cualquier otra cosa - negativo, fraccionario, no numérico - cuenta como no establecido y recurre a 3, también con una advertencia.
schema.capabilities.file_search.parsing.label=Análisis de documentos
schema.capabilities.file_search.parsing.description=Cómo se leen los documentos subidos antes de dividirlos en fragmentos.
schema.capabilities.file_search.parsing.ocr.label=Reconocimiento de texto (OCR)
schema.capabilities.file_search.parsing.ocr.description=Reconocimiento de texto para páginas PDF sin capa de texto, como los escaneos. Se ejecuta donde está instalado el programa tesseract (las imágenes de Docker y Kyma lo incluyen con inglés); la CLI independiente de npm nunca lo ejecuta.
schema.capabilities.file_search.parsing.ocr.languages.label=Idiomas de OCR
schema.capabilities.file_search.parsing.ocr.languages.description=Códigos de idioma de Tesseract que se reconocen en una página, como eng, deu o chi_sim; predeterminado eng. Un código necesita sus datos de idioma instalados donde se ejecuta el gateway; uno que no está instalado se omite con una advertencia en el registro del gateway. Cada idioma añadido hace que el OCR sea más lento.
schema.capabilities.file_search.parsing.vision.label=Transcripción por visión
schema.capabilities.file_search.parsing.vision.description=Transcripción de páginas PDF difíciles mediante un modelo de visión de SAP AI Core: una página se envía como imagen y el modelo escribe su texto, tablas incluidas. Solo se ejecuta para los almacenes vectoriales cuyo ajuste de fragmentación tiene un modo de visión (desactivado de forma predeterminada; cambiar el modo de un almacén lo vuelve a fragmentar). Cada página es una llamada al modelo, registrada como uso del propietario del almacén; una página cuya llamada falla conserva su texto o pasa al reconocimiento de texto (OCR). Las imágenes de las páginas no se enmascaran: donde la seudonimización está forzada para el contenido de file_search (para el endpoint openai o para un modelo), llegan al modelo sin enmascarar, y la cabina y el registro del gateway lo advierten. El enmascaramiento que pide una sola solicitud (una palabra clave o un campo de enmascaramiento) no se puede prever y no se advierte. La CLI independiente de npm nunca la ejecuta.
schema.capabilities.file_search.parsing.vision.model.label=Modelo
schema.capabilities.file_search.parsing.vision.model.description=El modelo de orquestación de SAP AI Core que transcribe las páginas; debe leer imágenes. Predeterminado "gemini-3.5-flash-lite". Si el modelo no está disponible, ningún almacén vectorial puede cambiarse a un modo de visión.
schema.capabilities.file_search.parsing.vision.default_mode.label=Modo predeterminado
schema.capabilities.file_search.parsing.vision.default_mode.description=El modo de visión que reciben los almacenes vectoriales nuevos: off (el predeterminado, sin llamadas de visión), no_text (páginas sin capa de texto, como los escaneos), auto (esas, páginas con poco texto como figuras y páginas con muchas tablas) o all (todas las páginas). Los almacenes existentes conservan su propio modo. Donde la seudonimización está forzada para el contenido de file_search, las imágenes de las páginas llegan al modelo sin enmascarar (se muestra una advertencia); lo mismo ocurre, sin advertencia, con el enmascaramiento que pide una sola solicitud.
schema.capabilities.file_search.parsing.vision.max_pages_per_file.label=Máx. de páginas por archivo
schema.capabilities.file_search.parsing.vision.max_pages_per_file.description=Número máximo de páginas de un archivo que se envían al modelo, entre 1 y 1000. Predeterminado 50. Las páginas restantes conservan su texto o pasan al reconocimiento de texto (OCR).
schema.capabilities.file_search.parsing.vision.concurrency.label=Concurrencia
schema.capabilities.file_search.parsing.vision.concurrency.description=Cuántas páginas de un archivo se transcriben al mismo tiempo, entre 1 y 8. Predeterminado 2.
schema.capabilities.file_search.parsing.vision.request_timeout_ms.label=Tiempo de espera de la solicitud (ms)
schema.capabilities.file_search.parsing.vision.request_timeout_ms.description=Límite de tiempo de la llamada de una página, en milisegundos. Predeterminado 90000. Una página cuya llamada tarda más conserva su texto o pasa al reconocimiento de texto (OCR).
schema.capabilities.file_search.parsing.vision.file_deadline_ms.label=Plazo por archivo (ms)
schema.capabilities.file_search.parsing.vision.file_deadline_ms.description=Tiempo máximo, en milisegundos, que la visión puede dedicar a un archivo, y como mucho el 40 % del tiempo restante para la ingesta del archivo. Predeterminado 240000 (4 minutos). Después no se inicia ninguna otra página; el archivo se ingiere igualmente.
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.label=Máx. de tokens de entrada por archivo
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.description=Tokens de entrada que pueden usar las llamadas de un archivo, entre 10000 y 100000000. Predeterminado 150000 (una página usa unos 1250). Cuando un archivo los ha usado, no se inicia ninguna otra página para él.
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.label=Máx. de tokens de salida por archivo
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.description=Tokens de salida que pueden usar las llamadas de un archivo, entre 10000 y 100000000. Predeterminado 120000. Cuando un archivo los ha usado, no se inicia ninguna otra página para él.
schema.capabilities.file_search.blob_storage.label=Almacenamiento de blobs
schema.capabilities.file_search.blob_storage.description=Dónde se guardan los bytes subidos sin procesar. El contenido se direcciona por su hash sha256 y se cuentan sus referencias, así que dos subidas de contenido idéntico almacenan una sola copia. El ajuste se lee de nuevo en cada acceso, así que un cambio surte efecto sin reiniciar.
schema.capabilities.file_search.blob_storage.backend.label=Backend
schema.capabilities.file_search.blob_storage.backend.description=Dónde se guardan las NUEVAS subidas. "db", el predeterminado, mantiene los bytes en la base de datos Postgres de file_search. "s3" los escribe como objetos en el bucket configurado abajo (AWS o un endpoint compatible con S3) y en la base de datos guarda solo su clave. Cambiarlo no mueve nada: cada blob se lee del almacenamiento en el que se escribió, así que los blobs existentes siguen legibles mientras ese almacenamiento sea accesible, y una migración desde el panel Almacenamiento de blobs de Administración de Grounding los mueve. "local" no está soportado: toda subida responde entonces 503 file_search_unavailable.
schema.capabilities.file_search.blob_storage.local_path.label=Ruta local
schema.capabilities.file_search.blob_storage.local_path.description=Raíz del sistema de archivos reservada para un backend "local", por defecto /var/lib/sail-proxy/blobs. El gateway no soporta "local" (véase backend), así que este valor no se lee.
schema.capabilities.file_search.blob_storage.s3.label=S3
schema.capabilities.file_search.blob_storage.s3.description=Coordenadas del bucket para el backend "s3". Las credenciales no se configuran aquí: proceden de las variables de entorno FILE_SEARCH_S3_ACCESS_KEY_ID y FILE_SEARCH_S3_SECRET_ACCESS_KEY del gateway. Se lee en cada acceso a un blob guardado en S3 - también cuando backend es "db" y quedan blobs en S3 - y en una migración hacia o desde S3. Cambiar el bucket, el endpoint o el prefijo no mueve ningún objeto: los blobs escritos con los valores anteriores no se pueden leer hasta que se restablezcan esos valores.
schema.capabilities.file_search.blob_storage.s3.bucket.label=Bucket
schema.capabilities.file_search.blob_storage.s3.bucket.description=Nombre del bucket. Forma el host <bucket>.s3.<region>.amazonaws.com, o la ruta /<bucket>/<key> cuando endpoint está definido. Se entrega vacío: hasta que se defina, una subida con backend "s3" responde 503 y una migración a S3 se rechaza.
schema.capabilities.file_search.blob_storage.s3.prefix.label=Prefijo
schema.capabilities.file_search.blob_storage.s3.prefix.description=Prefijo de clave bajo el que se guarda cada blob, por defecto sail-proxy/blobs, para que un bucket pueda contener blobs junto a objetos ajenos. Segmentos de ruta de letras, dígitos, ".", "_" y "-", separados por "/". El gateway solo lee, escribe y borra claves bajo este prefijo y nunca lista el bucket. Cada base de datos de file_search necesita su propio prefijo (o bucket): las claves se derivan del contenido del archivo, así que dos instalaciones que comparten un prefijo comparten objetos, y una borra objetos que la otra todavía usa.
schema.capabilities.file_search.blob_storage.s3.endpoint.label=Endpoint
schema.capabilities.file_search.blob_storage.s3.endpoint.description=Endpoint S3 no de AWS - MinIO, Ceph u otro gateway compatible con S3. Si está establecido, las solicitudes van a <endpoint>/<bucket>/<key> en lugar de a la forma de host de AWS. Vacío, el predeterminado, significa AWS.
schema.capabilities.file_search.blob_storage.s3.region.label=Región
schema.capabilities.file_search.blob_storage.s3.region.description=Región de firma SigV4, y parte del nombre de host cuando no hay endpoint establecido. Viene vacía, y sigue siendo obligatoria para firmar frente a un endpoint compatible con S3.
schema.capabilities.file_search.teacher_logging.label=Registro del modelo profesor
schema.capabilities.file_search.teacher_logging.description=Registra los candidatos de cada búsqueda y las puntuaciones del reordenador como etiquetas teacher, para la evaluación y destilación del reordenador. Sin espera por diseño: nada espera a la escritura, y cada fallo solo aparece como advertencia. Los cinco campos se leen en vivo en la ruta de búsqueda, así que pueden cambiarse desde este cockpit sin reiniciar.
schema.capabilities.file_search.teacher_logging.enabled.label=Habilitado
schema.capabilities.file_search.teacher_logging.enabled.description=Si se escriben eventos de búsqueda. Desactivado por defecto, así que una instalación anterior a esta clave nunca empieza a escribir filas. Deliberadamente independiente de store_chunk_text: activar el registro nunca debe por sí solo empezar a persistir el contenido de los documentos.
schema.capabilities.file_search.teacher_logging.store_chunk_text.label=Almacenar texto de fragmentos
schema.capabilities.file_search.teacher_logging.store_chunk_text.description=Si el TEXTO del fragmento de cada candidato se almacena junto a su hash; desactivado por defecto, y en ese caso el texto queda vacío. Ese texto es contenido de documentos de usuarios, así que esto convierte las tablas de etiquetas en una segunda copia del corpus - el hash por sí solo basta para unir las etiquetas a los fragmentos que aún existen.
schema.capabilities.file_search.teacher_logging.sample_rate.label=Frecuencia de muestreo
schema.capabilities.file_search.teacher_logging.sample_rate.description=Probabilidad de que una búsqueda se registre, de 0 a 1; predeterminado 1.0. 1 registra todas las búsquedas, 0 ninguna, 0.1 aproximadamente una de cada diez. Este es el ajuste que se debe bajar cuando el volumen de etiquetas es un problema - no max_concurrent_writes, que descarta escrituras en lugar de reducirlas.
schema.capabilities.file_search.teacher_logging.source.label=Origen
schema.capabilities.file_search.teacher_logging.source.description=Etiqueta de texto libre escrita en cada evento de búsqueda, usada siempre que el llamante no pasa ninguna. Predeterminado "production", para que una ejecución de evaluación o de relleno pueda distinguirse del tráfico de producción cuando se vuelven a leer las etiquetas.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.label=Máx. escrituras concurrentes
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.description=Techo de escrituras de etiquetas teacher en curso, predeterminado 2; las escrituras sobrantes se descartan, no se ponen en cola. Limitado al tamaño del pool de base de datos de file_search de 10: por encima de eso el techo deja de limitar nada, porque las escrituras adicionales simplemente esperan en la cola propia del pool - convirtiendo "descartadas, no en cola" en "en cola", el fallo que el límite existe para evitar. Un valor mayor se recorta con una advertencia, así que un api_config.json editado a mano tampoco puede subirlo.
schema.capabilities.file_search.tool.label=Herramienta
schema.capabilities.file_search.tool.description=El bloque de la HERRAMIENTA alojada file_search - la herramienta a la que llama el propio modelo -, a diferencia de la ruta REST sin procesar POST /v1/vector_stores/{id}/search que rigen los ajustes de arriba. Cada campo se comprueba al leerse y recurre a su valor predeterminado en lugar de convertirse, porque un api_config.json editado a mano llega al gateway sin validar.
schema.capabilities.file_search.tool.enabled.label=Habilitado
schema.capabilities.file_search.tool.enabled.description=Se lee como booleano estricto, predeterminado true - un "true" o 1 editado a mano no se lee como true y recurre al valor predeterminado. Actualmente el gateway lo ignora: nada depende del valor resuelto y la herramienta se ofrece en cualquier caso, así que ponerlo en false no oculta la herramienta. Use file_search.enabled para desactivar la función.
schema.capabilities.file_search.tool.max_searches_per_request.label=Máx. búsquedas por solicitud
schema.capabilities.file_search.tool.max_searches_per_request.description=Cuántas llamadas a file_search puede hacer una solicitud antes de que el gateway deje de continuar el turno. Se respeta un entero de 1 a 10; cualquier otra cosa - fuera de rango, fraccionario, no numérico - cuenta como no establecido y recurre a 3 con una advertencia, así que un valor fuera de rango aquí no es, en silencio, el valor que se ejecuta.
schema.capabilities.file_search.tool.max_num_results_default.label=Máx. resultados predeterminado
schema.capabilities.file_search.tool.max_num_results_default.description=Fragmentos devueltos cuando una llamada a la herramienta no indica un max_num_results propio. Se respeta un entero de 1 a 50; cualquier otra cosa recurre a 10. Ese rango es el mismo límite con el que se comprueba un max_num_results por llamada, y el límite propio de OpenAI para el campo. hybrid.candidates sigue siendo el techo estricto de lo que puede devolver una búsqueda.
schema.capabilities.hosted_tools.label=Herramientas alojadas
schema.capabilities.hosted_tools.description=Límites de la caché de reproducción de resultados de herramientas alojadas: cuánto tiempo sigue siendo reproducible un resultado y cuántos se conservan a la vez.
schema.capabilities.hosted_tools.result_cache_ttl_seconds.label=TTL de la caché de resultados (segundos)
schema.capabilities.hosted_tools.result_cache_ttl_seconds.description=Opcional. Cuánto tiempo siguen siendo reproducibles los resultados de una herramienta alojada para un cliente que reproduce el elemento de llamada. Un valor no entero o fuera de rango recurre al predeterminado de 3600 segundos, igual que dejarlo sin establecer. Un fallo de caché vuelve a ejecutar la consulta registrada en lugar de degradar la respuesta.
schema.capabilities.hosted_tools.result_cache_max_entries.label=Máx. entradas de la caché de resultados
schema.capabilities.hosted_tools.result_cache_max_entries.description=Opcional. Cuántos resultados de herramientas alojadas se conservan a la vez en la caché de reproducción. Un valor no entero o fuera de rango recurre al predeterminado de 500 entradas, igual que dejarlo sin establecer. Un fallo de caché vuelve a ejecutar la consulta registrada en lugar de degradar la respuesta.
schema.capabilities.namespace_tools.label=Herramientas namespace
schema.capabilities.namespace_tools.description=Cómo tratar la herramienta envoltorio de subagentes `namespace` de Codex, que SAP AI Core rechaza directamente con un 400.
schema.capabilities.namespace_tools.mode.label=Modo
schema.capabilities.namespace_tools.mode.description=`flatten` (predeterminado) eleva las herramientas de función anidadas de una herramienta namespace al nivel superior para que la solicitud se acepte, y luego restaura el namespace en las llamadas reproducidas para que Codex aún pueda enrutarlas. `strip` quita por completo la herramienta namespace y sus herramientas anidadas. Cualquier valor distinto de estos dos recurre a flatten - la alternativa es un 400 estricto que mata el turno.
schema.capabilities.custom_tools.label=Herramientas personalizadas
schema.capabilities.custom_tools.description=Herramientas `custom` de formato libre de Codex (apply_patch). `translate` las reescribe como herramientas de función, que aceptan tanto la ruta de despliegue como la de orquestación; `strip` las quita, dejando que el modelo edite archivos mediante comandos de shell.
schema.capabilities.custom_tools.mode.label=Modo
schema.capabilities.custom_tools.mode.description=`translate` (predeterminado) reescribe la herramienta personalizada de formato libre como una herramienta de función normal que aceptan ambas rutas, añadiendo a su descripción indicaciones de gramática/formato, ya que una herramienta de función no puede expresar una gramática Lark como sí puede una herramienta personalizada. `strip` quita por completo las herramientas personalizadas, dejando que el modelo edite archivos mediante comandos de shell. Cualquier valor distinto de estos dos recurre a translate - la alternativa es un 400 estricto que mata el turno.
schema.capabilities.tool_search.label=Búsqueda de herramientas
schema.capabilities.tool_search.description=La herramienta de descubrimiento de herramientas diferidas `tool_search` de Codex. `translate` la reescribe como una herramienta de función, que aceptan tanto la ruta de despliegue como la de orquestación; `strip` la quita, dejando al modelo sin poder descubrir herramientas diferidas como los servidores MCP.
schema.capabilities.tool_search.mode.label=Modo
schema.capabilities.tool_search.mode.description=`translate` (predeterminado) reescribe la herramienta tool_search como una herramienta de función normal que aceptan ambas rutas. `strip` la quita por completo. Cualquier valor distinto de estos dos recurre a translate - la alternativa es un 400 estricto que mata el turno.
schema.capabilities.tool_search.hoist_discovered_tools.label=Elevar herramientas descubiertas
schema.capabilities.tool_search.hoist_discovered_tools.description=Eleva a la solicitud las herramientas descubiertas por tool_search para que el modelo pueda llamarlas. Sortea que codex solo expone herramientas MCP diferidas cuando el base_url del proveedor es api.openai.com; póngalo en false una vez que se corrija upstream. Es seguro dejarlo activado en cualquier caso - los nombres que el cliente ya declara se omiten.
schema.hooks.label=Hooks
schema.hooks.definitions.label=Definiciones
schema.hooks.definitions.description=Las reglas de coincidencia con nombre que puede nombrar el request.match de un hook, con el id de regla como clave - la clave ES el id. Todas las reglas que lista un hook deben coincidir para que ese hook se dispare, y un id de regla no definido aquí registra una advertencia y hace que el hook no coincida con nada. Las reglas se almacenan en caché por id en el primer uso, así que una edición surte efecto en la siguiente recarga de la configuración, no a mitad del proceso.
schema.hooks.definitions._entry.type.label=Tipo
schema.hooks.definitions._entry.type.description=Qué parte de la solicitud comprueba la regla y, por tanto, cuáles de los campos de abajo se aplican. Es funcional, no descriptivo: solo se entienden estos cuatro valores, y cualquier otro se registra como tipo de hook desconocido y no coincide con NADA - desactivando en silencio todos los hooks que nombran la regla.
schema.hooks.definitions._entry.name.label=Nombre
schema.hooks.definitions._entry.name.description=El encabezado de solicitud que lee una regla 'header'. Sin distinguir mayúsculas y minúsculas: el nombre se pasa a minúsculas antes de la búsqueda, igual que la canalización de solicitudes normaliza los nombres de encabezado. Una solicitud que no contiene el encabezado nunca coincide. Vacío no es 'cualquier encabezado' - una regla así nunca podría dispararse -, así que aquí se rechaza en lugar de aceptarse.
schema.hooks.definitions._entry.path.label=Ruta
schema.hooks.definitions._entry.path.description=Ruta en notación de puntos dentro del cuerpo JSON analizado de la solicitud para una regla 'json-path' o 'json-path-regex'. Se quita un '$.' inicial, así que '$.max_tokens' y 'max_tokens' direccionan el mismo valor; no hay más soporte de JSONPath - ni comodines, ni filtros, ni sintaxis de corchetes, y un segmento que contiene un punto no puede direccionarse. 'json-path' sigue cada segmento literalmente, así que un segmento numérico indexa un array. 'json-path-regex' permite además que un segmento no numérico tome el primer elemento del array que lo contiene. Una solicitud sin cuerpo analizado, o una ruta que no se resuelve en nada, no coincide.
schema.hooks.definitions._entry.equals.label=Igual a
schema.hooks.definitions._entry.equals.description=El valor al que debe ser igual lo direccionado - comparado de forma DIFERENTE según el tipo. En una regla `header` NO es igualdad estricta: se comparan los tipos de medio (la parte anterior al primer `;`, en minúsculas), así que `application/json` también coincide con `application/json; charset=utf-8`. Existe porque la comparación estricta a la que sustituyó permitía a los clientes que añaden charset eludir la seudonimización. Un valor de equals que contiene a su vez un `;` se compara exactamente, así que una regla aún puede fijar un charset. En una regla `json-path` SÍ es igualdad estricta. Semántica del comparador: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.from.label=De
schema.hooks.definitions._entry.from.description=Límite inferior inclusivo para una regla 'header' que compara un encabezado numérico - content-length en todas las reglas entregadas. El valor del encabezado se lee como entero en base 10 y debe quedar dentro de [from, to]; un valor que no se puede analizar nunca coincide. Solo se lee cuando equals falta Y ambos límites están presentes: un límite solo se ignora y la regla se degrada a una mera comprobación de presencia del encabezado.
schema.hooks.definitions._entry.to.label=A
schema.hooks.definitions._entry.to.description=Límite superior inclusivo para una regla 'header' que compara un encabezado numérico. No hay forma abierta: para expresar 'al menos 10 KB', las reglas entregadas combinan from con un to deliberadamente enorme (size:min10kb usa 999999999), porque omitir cualquiera de los límites convierte la regla en una comprobación de presencia. Vea from.
schema.hooks.definitions._entry.regex.label=Regex
schema.hooks.definitions._entry.regex.description=El código fuente de una expresión regular de JavaScript. Una regla `json-path-regex` la comprueba contra aquello en lo que se resolvió la ruta (una cadena directamente, un array elemento por elemento, cualquier otro objeto contra su forma JSON). Una regla `url-regex` la comprueba contra la ruta y la cadena de consulta de la solicitud que ve el gateway, NO una URL absoluta, así que `^https?://` nunca puede coincidir. Se compila una vez y se almacena en caché por regla; una expresión que el motor rechaza cuenta como sin coincidencia. Semántica del comparador: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.flags.label=Flags
schema.hooks.definitions._entry.flags.description=Flags de expresión regular aplicados a regex, p. ej. 'i' para no distinguir mayúsculas y minúsculas. Se limitan a las letras que el motor acepta realmente, porque cualquier otro valor hace fallar la compilación y ese fallo se notifica como sin coincidencia - la regla nunca se dispararía, en silencio. Los flags forman parte de la clave de caché de la expresión compilada, así que dos reglas que solo difieren en los flags no comparten una expresión compilada. Evite 'g': una expresión global compilada se reutiliza entre solicitudes y avanza su propia posición, así que una regla así coincide una vez sí y otra no.
schema.hooks.definitions._entry.desc.label=Desc.
schema.hooks.definitions._entry.desc.description=Nota de texto libre sobre la finalidad de esta regla. Actualmente el gateway la ignora; documenta la regla para quien edite este archivo y no tiene efecto en la coincidencia.
schema.hooks.defaults.label=Valores predeterminados
schema.hooks.defaults.description=Hooks predeterminados por endpoint, con el identificador de endpoint que usa la ruta como clave - 'anthropic', 'openai' y 'aws-bedrock' hoy, y 'google' (subpaths generateContent, streamGenerateContent, embedContent). Solo se consultan cuando el modelo solicitado no tiene una entrada models.overrides.<model>.hooks para el subpath: una entrada por modelo SUSTITUYE al valor predeterminado del endpoint para ese subpath en lugar de combinarse con él.
schema.hooks.defaults._entry.description=Los valores predeterminados de un endpoint: el bloque opcional de activación forzada de la seudonimización, más una lista de hooks por subpath de solicitud (invoke, invoke-with-response-stream, responses, responses-stream). Las claves desconocidas se rechazan, porque cualquier otra clave aquí se lee como subpath y ninguna ruta pide un subpath que este endpoint no atienda - así que una clave no reconocida es una errata que nunca se ejecutaría, no un ajuste. El patrón de subpath excluye deliberadamente 'pseudonymization', para que esa clave no tenga que ser también una lista de hooks.
schema.hooks.defaults._entry.pseudonymization.label=Seudonimización
schema.hooks.defaults._entry.pseudonymization.description=Ajustes del plugin de seudonimización. La activación (enabled) y los conmutadores por categoría (entities) solo se aplican a este plugin; el enmascaramiento ocurre únicamente cuando el plugin se ejecuta realmente para una solicitud - debe estar registrado en la cadena de hooks y debe dispararse una fuente de activación.
schema.hooks.defaults._entry.pseudonymization.enabled.label=Habilitado
schema.hooks.defaults._entry.pseudonymization.enabled.description=Fuerza la activación del enmascaramiento para una solicitud. Solo se lee donde este bloque está bajo models.overrides.<model>.pseudonymization o hooks.defaults.<endpoint>.pseudonymization: true allí enmascara esa solicitud, y el bloque por modelo gana sobre el bloque por endpoint. False o ausente no fuerza nada - el enmascaramiento aún puede ejecutarse cuando se dispara otra fuente de activación, como una palabra desencadenante o un campo de enmascaramiento en el cuerpo de la solicitud. Bajo observability.pseudonymization esta clave se ignora actualmente; esa capa aporta todos los demás ajustes de aquí excepto method y allow_user_bypass. En cualquier caso, el plugin debe estar conectado a la cadena de hooks, o no se enmascara nada en absoluto.
schema.hooks.defaults._entry.pseudonymization.method.label=Método
schema.hooks.defaults._entry.pseudonymization.method.description=Modo de enmascaramiento: `pseudonymization` enmascara la solicitud y desenmascara la respuesta; `anonymization` enmascara y nunca desenmascara. Solo se lee donde este bloque fuerza la activación del enmascaramiento (un hook habilitado o una anulación de modelo), no bajo `observability.pseudonymization`. También condiciona el SIEM: solo `pseudonymization` conserva la respuesta enmascarada, así que con `anonymization` un sink de contenido recibe el prompt pero no la respuesta. Si se omite, se usa `pseudonymization`. Modos: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.label=Permitir omisión por el usuario
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.description=Solo tiene efecto dentro de un bloque de activación forzada (un hook habilitado o una anulación de modelo); no se lee bajo `observability.pseudonymization`. Valor predeterminado false. Si es true, un llamante puede omitir el enmascaramiento mediante el encabezado `x-sail-proxy-pseudonymization: off` (sin distinguir mayúsculas y minúsculas) o el campo del cuerpo `pseudonymization_off: true`: el contenido llega sin enmascarar al LLM y, cuando un sink SIEM habilitado establece tanto `include_content` como `allow_unmasked_content`, también a ese sink. Detalles: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.hooks.defaults._entry.pseudonymization.entities.label=Entidades
schema.hooks.defaults._entry.pseudonymization.entities.description=Conmutadores de enmascaramiento por categoría: `true` enmascara la categoría en esta capa, `false` no, y una categoría no indicada hereda la capa inferior (las capas posteriores ganan). Las claves son el conjunto de categorías conocidas: las categorías activadas por defecto; tres opcionales que vienen desactivadas (`profile-org`, `profile-location`, `profile-ip-address`); y `profile-sensitive-data`, un comodín que activa todas excepto esas tres. Una clave fuera del conjunto se rechaza aquí. Categorías y capas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.hooks.defaults._entry.pseudonymization.org_suffixes.label=Sufijos de organización
schema.hooks.defaults._entry.pseudonymization.org_suffixes.description=Sufijos de forma jurídica que marcan una serie de palabras como nombre de organización, p. ej. Inc, LLC, GmbH. La coincidencia distingue mayúsculas y minúsculas a propósito, de modo que un 'limited' en minúsculas en un texto no se trata deliberadamente como forma jurídica; cada entrada coincide además escrita totalmente en mayúsculas, de modo que una factura que escribe ACME GMBH se reconoce como la misma organización que Acme GmbH. Solo tiene efecto mientras profile-org esté habilitado en entities; habilitar profile-org con esta lista vacía NO enmascara nada como organización y registra una advertencia. Cada entrada se recorta antes de la comparación, y una entrada vacía o solo con espacios se descarta en silencio en lugar de rechazarse.
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.label=Nomenclátor de ubicaciones
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.description=Términos de ubicación literales que enmascara el detector estructural - sin distinguir mayúsculas y minúsculas, y solo como palabra o frase completa; no se infiere nada de las mayúsculas ni del contexto. Solo tiene efecto mientras profile-location esté habilitado en entities; habilitar profile-location con esta lista vacía NO enmascara nada como ubicación y registra una advertencia. Cada entrada se recorta, y una entrada vacía o solo con espacios se descarta en silencio. Viene vacía: los nombres de lugares dependen de cada implantación y este repositorio es público, así que rellénela mediante esta aplicación de configuración de administración, nunca en código versionado.
schema.hooks.defaults._entry.pseudonymization.min_confidence.label=Confianza mín.
schema.hooks.defaults._entry.pseudonymization.min_confidence.description=Cuánta evidencia necesita un valor detectado antes de enmascararse, de 0 a 1 (predeterminado 0.5). Un valor se enmascara cuando su puntuación alcanza el umbral; un nombre propio simple puntúa alrededor de 0.5, un patrón validado por suma de comprobación 0.95, una regla personalizada 1.0. Subir el umbral elimina primero los nombres simples, así que, para endurecer una sola categoría ruidosa, use `thresholds` en su lugar. Las reglas personalizadas, los identificadores validados y las credenciales nunca se rebajan por su entorno. Detalle de la puntuación: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.hooks.defaults._entry.pseudonymization.thresholds.label=Umbrales
schema.hooks.defaults._entry.pseudonymization.thresholds.description=Umbrales de confianza por categoría, cada uno de 0 a 1, que anulan `min_confidence` para las categorías nombradas; una no indicada conserva `min_confidence`. El lugar para ser estricto con una sola categoría ruidosa - `profile-person` en 0.65 exige más evidencia para los nombres mientras los identificadores validados se quedan en el umbral global. Las claves son el mismo conjunto de categorías conocidas que admite `entities`; `profile-sensitive-data` se acepta pero no hace nada. Ajuste por categoría: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.hooks.defaults._entry.pseudonymization.allowlist.label=Lista de permitidos
schema.hooks.defaults._entry.pseudonymization.allowlist.description=Valores que esta implantación nunca enmascara - un interruptor de APAGADO, por valor. Se consulta antes de la puntuación de confianza, por lo que un valor listado queda exento por mucha evidencia que haya. Úsela para un falso positivo recurrente con nombre propio - un título de producto o de informe que parece una persona. Las listas de las capas se CONCATENAN, no se sustituyen, así que una capa inferior solo añade una exención, nunca quita una. `terms` frente a `patterns`, y el riesgo de las entradas demasiado amplias: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.label=Términos
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.description=Valores literales, comparados con el valor detectado completo y DISTINGUIENDO mayúsculas y minúsculas. Distingue mayúsculas a propósito: 'Watson Studio' es el producto que un operador quería eximir y 'watson studio' en una frase no lo es, y una lista sin distinción de mayúsculas eximiría también a una persona cuyo apellido casualmente se escribe igual. Un término solo coincide con un valor que los detectores produjeron completo - listar 'Studio' no exime 'Watson Studio'. Cada entrada aquí es un interruptor de APAGADO del enmascaramiento para ese valor exacto, así que limite la lista a valores que realmente nunca son datos personales: un término que casualmente es el nombre de alguien exime a esa persona del enmascaramiento en toda esta implantación, en silencio y sin nada en el log que lo indique.
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.label=Patrones
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.description=Expresiones regulares (JavaScript), cada una comparada con el valor detectado COMPLETO: el propio gateway envuelve cada entrada en `^(?: )$`, así que escriba `Z[A-Z0-9_]+`, no `^Z[A-Z0-9_]+$`. La coincidencia distingue mayúsculas y minúsculas. Cada entrada es un interruptor de APAGADO del enmascaramiento, y una amplia desactiva el enmascaramiento sin fallar - `[A-Z].*` desactiva casi todos los nombres de persona detectados. Una coincidencia con una muestra de PII integrada genera una advertencia pero AUN ASÍ se aplica. Mantenga cada entrada acotada. Detalle: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.saturation_warn.label=Aviso de saturación
schema.hooks.defaults._entry.pseudonymization.saturation_warn.description=Cuántos valores enmascarados DISTINTOS puede contener una solicitud antes de que se notifique como saturada (predeterminado 40). Solo informa - nunca cambia lo que se enmascara. Por encima del número, el gateway registra una advertencia por solicitud con recuentos por categoría y las FORMAS de valor más comunes (letras como X, dígitos como 9); nunca aparece ningún valor enmascarado. El evento SIEM de uso de la solicitud contiene los mismos recuentos con un flag `saturated` - recuentos, no texto. Cómo leer el informe: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.label=Marcadores inventados
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.description=Qué ocurre cuando una respuesta contiene un marcador enmascarado que nunca se envió al modelo. Los modelos inventan uno en aproximadamente 1 de cada 125 respuestas seudonimizadas, y con más frecuencia cuantos más valores enmascara una solicitud; un marcador así no nombra a nadie y nunca puede resolverse. withhold (predeterminado): se sustituye por una marca simple como [name withheld] y se notifica como evento de seguridad. report: solo se notifica y llega sin cambios al cliente, para una implantación cuyos propios desarrolladores escriben nuevos marcadores en datos de prueba a través del gateway. off: ninguna de las dos cosas. Un marcador que el propio cliente envió en la misma solicitud nunca se trata como inventado.
schema.hooks.defaults._entry._entry.description=La lista de hooks de un subpath, probados en orden. La misma forma sirve para hooks.defaults.<endpoint>.<subpath> y models.overrides.<model>.hooks.<subpath>, de modo que el gateway ve una sola forma, la aporte cualquiera de las dos. Un hook se dispara solo cuando TODAS las reglas que nombra su request.match coinciden con la solicitud; request.callback.id nombra entonces el plugin que se ejecuta para la fase en curso. Un hook cuyo match no se cumple, o cuyo callback no nombra ningún plugin registrado para esa fase, se omite y se prueba el siguiente - ninguno de los dos casos es un error en tiempo de ejecución.
schema.hooks.defaults._entry._entry.items.request.label=Solicitud
schema.hooks.defaults._entry._entry.items.request.description=Lo que debe coincidir y lo que se ejecuta cuando coincide. Se llama así por la solicitud porque el comparador solo inspecciona la solicitud entrante; no hay equivalente para la respuesta, y no se lee nada más de un hook.
schema.hooks.defaults._entry._entry.items.request.callback.label=Callback
schema.hooks.defaults._entry._entry.items.request.callback.description=El plugin que se ejecuta una vez que han coincidido todas las reglas de match.
schema.hooks.defaults._entry._entry.items.request.callback.id.label=ID
schema.hooks.defaults._entry._entry.items.request.callback.id.description=El id con el que se registró un plugin, buscado en el registro de plugins del gateway para la fase en ejecución. Este esquema no puede comprobar la referencia cruzada: un id que ningún plugin registró para esa fase se registra en el log como no encontrado y el hook se omite, por lo que la solicitud pasa sin modificar en lugar de fallar.
schema.hooks.defaults._entry._entry.items.request.match.label=Coincidencia
schema.hooks.defaults._entry._entry.items.request.match.description=Los ids de regla que deben coincidir TODOS, evaluados en orden y abandonados en el primero que no coincide. Cada id es una clave de hooks.definitions - una referencia cruzada que este esquema no puede comprobar: un id que no está definido allí registra una advertencia y hace que todo el hook no coincida, por lo que una errata desactiva el plugin en silencio en lugar de dispararlo incondicionalmente. Una lista vacía se rechaza, porque un hook que debe ejecutarse sobre casi todo se escribe nombrando en su lugar una regla deliberadamente amplia - la regla entregada payload:any coincide con cualquier solicitud cuyo cuerpo analizado contenga un model de cadena no vacía, que es lo más cercano a incondicional que puede ser una regla y aun así lo dice explícitamente.
schema.platform.label=Plataforma
schema.platform.billing.label=Facturación
schema.platform.billing.description=Clasificación de facturación de SAP AI Core para esta subcuenta. Solo la lee la contabilidad de costos nativa de SAP en Capacity Units de la aplicación de administración, nunca la ruta de solicitud del gateway.
schema.platform.billing.productive.label=Productivo
schema.platform.billing.productive.description=Si SAP clasifica esta subcuenta/tenant como PRODUCTIVA para la facturación de SAP AI Core. isProductive() en sapCapacityService lo lee para elegir la fila de SapCapacityUnitPrice - $/CU productivo frente a no productivo - usada para valorar las Capacity Units. La clasificación de SAP no siempre coincide con el nombre del entorno (una subcuenta Sandbox puede clasificarse como productiva), así que establezca aquí lo que realmente es su factura/subcuenta de SAP. Predeterminado false = no productiva.
schema.platform.billing.cuFactor.label=Factor CU
schema.platform.billing.cuFactor.description=Factor de conversión de tokens GenAI de SAP a Capacity Units (SAP Note 3437766; uniforme en todas las facturas, no publicado por modelo). cuFactor() en sapCapacityService lo lee - capacityUnits = genAiTokens x este factor, aplicado globalmente a cada evento de uso (no por tipo de uso), tanto para la captura en vivo como para el recálculo retroactivo. Cámbielo solo si SAP vuelve a publicar la conversión a CU. Predeterminado 1.90385. Un valor de 0 se trata como no establecido y recurre al predeterminado.
schema.platform.timeouts.label=Tiempos de espera
schema.platform.timeouts.description=Techos de tiempo de espera por solicitud que el gateway aplica a las llamadas salientes al LLM.
schema.platform.timeouts.default.label=Predeterminado
schema.platform.timeouts.default.description=Tiempo de espera en milisegundos para solicitudes sin streaming, de 1000 a 3600000. Sin establecer o cero recurre a 120000 ms (120 segundos).
schema.platform.timeouts.streaming.label=Streaming
schema.platform.timeouts.streaming.description=Tiempo de espera en milisegundos para solicitudes con streaming, de 1000 a 3600000. Sin establecer o cero recurre a 240000 ms (240 segundos).
schema.platform.logging.label=Registro
schema.platform.logging.description=Nivel y destino del log del gateway. Lo lee el logger compartido al iniciar, y de nuevo cada vez que el gateway lo reinicializa tras un cambio de configuración.
schema.platform.logging.components.label=Componentes
schema.platform.logging.components.description=Anulación del nivel de log por componente, con el nombre del componente exactamente como lo registra el gateway como clave - por ejemplo 'ConfigService' o 'AwsBedrockService'. Un componente sin entrada aquí usa LOG_LEVEL cuando está definido y, en caso contrario, defaultLevel. Una entrada prevalece sobre LOG_LEVEL para su propio componente, de modo que un componente fijado ignora la variable de entorno; la configuración suministrada no incluye ninguna entrada.
schema.platform.logging.components._entry.description=Nivel de log para este componente, que anula defaultLevel mientras esté presente. Se compara sin distinguir mayúsculas y minúsculas con los niveles que implementa el logger (trace, debug, info, warn, error); un valor que no reconoce se ignora en silencio, dejando vigente el nivel efectivo anterior en lugar de generar un error.
schema.platform.logging.defaultLevel.label=Nivel predeterminado
schema.platform.logging.defaultLevel.description=Nivel de log para cualquier componente sin entrada en `components`. Si `LOG_LEVEL` está establecido en un nivel reconocido, tiene prioridad y este campo se ignora - y `LOG_LEVEL` viene establecido en ambos ejemplos de .env y en los manifiestos de Kyma, así que en una implantación estándar gana el entorno. En caso contrario, se compara sin distinguir mayúsculas y minúsculas con los niveles del logger (trace, debug, info, warn, error); un valor no reconocido se ignora en silencio. Prioridad: https://st-gr.github.io/sail-proxy/developer/debugging#log-level-resolution
schema.platform.logging.log_folder_path.label=Ruta de la carpeta de logs
schema.platform.logging.log_folder_path.description=Directorio en el que el gateway escribe sus propios archivos de log y - cuando payload_logging_enabled es true - los volcados de payloads de solicitud y respuesta, en un subdirectorio payloads/. Si no se establece, recurre a ./logs.
schema.platform.logging.payload_logging_enabled.label=Registro de payloads habilitado
schema.platform.logging.payload_logging_enabled.description=Si es true, escribe los cuerpos completos de solicitud y respuesta en log_folder_path/payloads para depuración. Los encabezados conocidos como sensibles se ocultan, pero el contenido del cuerpo se escribe tal cual, así que manténgalo desactivado fuera de una depuración activa. Desactivado por defecto. La variable de entorno PAYLOAD_LOGGING_ENABLED, si se establece en true o false, prevalece sobre este valor.
schema.platform.rate_limit_handling.label=Gestión de límites de frecuencia
schema.platform.rate_limit_handling.description=Espera automática que aplica el gateway después de que un proveedor señale un límite de frecuencia - un HTTP 429, o un mensaje de error que coincide con una palabra clave de límite de frecuencia. Puramente reactiva: retrasa los reintentos una vez que se ha visto un límite de frecuencia para un modelo y un subpath, no limita el tráfico de antemano.
schema.platform.rate_limit_handling.enabled.label=Habilitado
schema.platform.rate_limit_handling.enabled.description=Interruptor principal de la espera por límite de frecuencia. Si es false o falta, el retraso es siempre 0 segundos y el resto de esta sección no tiene efecto.
schema.platform.rate_limit_handling.default_delay_seconds.label=Retraso predeterminado (segundos)
schema.platform.rate_limit_handling.default_delay_seconds.description=Retraso en segundos aplicado cuando se detecta un límite de frecuencia y ni subpath_specific_delays ni model_specific_delays tienen una entrada para el endpoint. Recurre a 30 si no se establece o es cero.
schema.platform.rate_limit_handling.backoff_multiplier.label=Multiplicador de espera
schema.platform.rate_limit_handling.backoff_multiplier.description=Multiplicador aplicado al retraso anterior en cada límite de frecuencia consecutivo para el mismo modelo y subpath: el nuevo retraso es el anterior multiplicado por este valor, con un máximo de max_delay_seconds. Recurre a 1.5 si no se establece o es cero; manténgalo en 1 o más, o cada límite de frecuencia consecutivo esperaría menos en lugar de más.
schema.platform.rate_limit_handling.max_delay_seconds.label=Retraso máx. (segundos)
schema.platform.rate_limit_handling.max_delay_seconds.description=Techo en segundos que la espera por límites de frecuencia consecutivos de arriba no puede superar. Recurre a 300 si no se establece o es cero.
schema.platform.rate_limit_handling.model_specific_delays.label=Retrasos por modelo
schema.platform.rate_limit_handling.model_specific_delays.description=Anulación del retraso por modelo en segundos, con el id del modelo exactamente como está configurado en providers y models como clave - por ejemplo 'anthropic--claude-4-opus--deployed'. Se comprueba después de subpath_specific_delays y antes de default_delay_seconds; un retraso de 0 aquí cuenta como sin anulación, porque solo se usa una entrada distinta de cero.
schema.platform.rate_limit_handling.model_specific_delays._entry.description=Retraso en segundos aplicado a este modelo cuando alcanza un límite de frecuencia.
schema.platform.rate_limit_handling.subpath_specific_delays.label=Retrasos por subpath
schema.platform.rate_limit_handling.subpath_specific_delays.description=Anulación del retraso por subpath en segundos, con el subpath de la API del gateway como clave - por ejemplo 'converse-stream' o 'invoke-with-response-stream'. Se comprueba primero, antes de model_specific_delays y default_delay_seconds; un retraso de 0 aquí cuenta como sin anulación, porque solo se usa una entrada distinta de cero.
schema.platform.rate_limit_handling.subpath_specific_delays._entry.description=Retraso en segundos aplicado a este subpath cuando alcanza un límite de frecuencia.
schema.platform.security.label=Seguridad
schema.platform.security.description=Aspectos de la entrada (ingress).
schema.platform.security.trust_forwarded_for.label=Confiar en Forwarded-For
schema.platform.security.trust_forwarded_for.description=Confiar en los encabezados X-Forwarded-For y X-Real-IP aportados por el cliente - y en la IP de cliente que el framework web deriva de ellos - al registrar la IP del cliente en los eventos de seguridad, en lugar de usar la dirección bruta del par del socket. Habilítelo solo detrás de un proxy que sobrescriba esos encabezados en lugar de dejar pasar lo que haya enviado el cliente; de lo contrario, un cliente puede falsificar su propia IP registrada.
schema.platform.security.credentialExpirationDays.label=Caducidad de credenciales (días)
schema.platform.security.credentialExpirationDays.description=Días que una credencial sigue siendo válida: una clave de API o credencial de AWS se crea con expiresAt = ahora + este número de días, y cada renovación (rotación) vuelve a mover expiresAt a ahora + este número de días. Los valores ausentes o no válidos recurren a 90. Las credenciales creadas antes de que existiera la caducidad no tienen fecha y nunca caducan hasta que un administrador establezca una.
schema.platform.quotas.label=Cuotas
schema.platform.quotas.description=Cuotas predeterminadas por usuario para toda la plataforma, aplicadas por el gateway en cada solicitud al LLM. La restricción propia de un usuario (aplicación Usuarios y cuotas) anula cada campo; null = ilimitado. Las ventanas son el día natural UTC, la semana ISO (lunes 00:00 UTC) y el mes natural; el gasto es el costo de SAP más el costo de Connections en la moneda del precio de la Capacity Unit de SAP.
schema.platform.quotas.requestsPerMinute.label=Solicitudes por minuto
schema.platform.quotas.requestsPerMinute.description=Solicitudes por usuario por minuto deslizante. También se aplican los límites por credencial (RateLimits); una solicitud debe superar ambos.
schema.platform.quotas.spendPerDay.label=Gasto por día
schema.platform.quotas.spendPerDay.description=Costo de SAP más costo de Connections por usuario por día UTC.
schema.platform.quotas.spendPerWeek.label=Gasto por semana
schema.platform.quotas.spendPerWeek.description=Costo de SAP más costo de Connections por usuario por semana ISO.
schema.platform.quotas.spendPerMonth.label=Gasto por mes
schema.platform.quotas.spendPerMonth.description=Costo de SAP más costo de Connections por usuario por mes natural.
schema.platform.quotas.tokensPerDay.label=Tokens por día
schema.platform.quotas.tokensPerDay.description=Tokens de entrada, de salida y de escritura en caché por usuario por día UTC; las lecturas de caché no se cuentan.
schema.platform.quotas.tokensPerWeek.label=Tokens por semana
schema.platform.quotas.tokensPerWeek.description=Tokens de entrada, de salida y de escritura en caché por usuario por semana ISO; las lecturas de caché no se cuentan.
schema.platform.quotas.tokensPerMonth.label=Tokens por mes
schema.platform.quotas.tokensPerMonth.description=Tokens de entrada, de salida y de escritura en caché por usuario por mes natural; las lecturas de caché no se cuentan.
schema.platform.toolGovernance.label=Gobernanza de herramientas
schema.platform.toolGovernance.description=Gobernanza de herramientas: cuánto tiempo se conservan las filas de uso de herramientas por solicitud y sus agregados diarios, y cómo escribe cada programa cliente las herramientas MCP que aloja él mismo.
schema.platform.toolGovernance.mcpNaming.label=Nomenclatura MCP
schema.platform.toolGovernance.mcpNaming.description=Un cliente que ejecuta sus propios servidores MCP no envía ningún tipo de herramienta MCP: Claude Code declara cada herramienta como mcp__server__tool, mientras que codex llega a ellas dentro de su propia herramienta exec. Estas convenciones convierten un nombre así en la identidad mcp:server/tool con la que puede coincidir un patrón de política, de modo que un cliente que nadie ha medido todavía es un cambio de configuración y no una nueva versión.
schema.platform.toolGovernance.mcpNaming.namePattern.label=Patrón de nombre de herramienta
schema.platform.toolGovernance.mcpNaming.namePattern.description=Expresión regular comparada con un nombre de herramienta declarado; el primer grupo es el servidor MCP, el segundo la herramienta. El valor predeterminado lee mcp__codex_apps__sites_create_site como servidor codex_apps y herramienta sites_create_site.
schema.platform.toolGovernance.mcpNaming.clients.label=Programas cliente
schema.platform.toolGovernance.mcpNaming.clients.description=Una entrada por programa cliente. Se aplica la primera cuyo texto de User Agent aparece en el de la solicitud; una solicitud que no coincide con ninguna sigue rigiéndose por lo que declara. Una lista indicada aquí sustituye por completo los ajustes predefinidos integrados; una entrada sin name, userAgent o containerTools se omite.
schema.platform.toolGovernance.mcpNaming.clients.items.name.label=Nombre
schema.platform.toolGovernance.mcpNaming.clients.items.name.description=Cómo se denomina este cliente en el cockpit y en los logs, por ejemplo claude-code.
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.label=User Agent
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.description=Texto que identifica al cliente en el encabezado User Agent de la solicitud, por ejemplo claude-cli. Se compara sin distinguir mayúsculas y minúsculas en cualquier parte del encabezado.
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.label=Herramientas contenedoras
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.description=Herramientas cuyo cuerpo de llamada puede llegar a herramientas MCP anidadas, como el exec de codex. Vacío para un cliente que declara sus herramientas MCP directamente, que es el caso habitual.
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.label=Patrón de llamada anidada
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.description=Expresión regular que encuentra el nombre de una herramienta anidada dentro del cuerpo de llamada de una herramienta contenedora; el primer grupo es el nombre. Solo se leen los nombres, nunca los argumentos.
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.label=Patrón de nombre de herramienta
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.description=Expresión regular que sustituye el patrón compartido de nombre de herramienta solo para este cliente; el primer grupo es el servidor MCP, el segundo la herramienta, y un nombre solo cuenta cuando ambos grupos no están vacíos. La coincidencia distingue entre mayúsculas y minúsculas y encuentra el patrón en cualquier parte del nombre, salvo que esté anclado con ^ y $. Omítala para usar el patrón compartido. Una expresión vacía o no válida no coincide con nada por patrón para este cliente (no recurre al patrón compartido), aunque los nombres de servidor siguen aplicándose.
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.label=Nombres de servidor
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.description=Los servidores MCP que ejecuta esta instalación, para un cliente cuyos nombres de herramienta no llevan ninguna marca, como opencode, que declara la herramienta ping_probe del servidor probe como probe_ping_probe. Una herramienta declarada con el nombre <server>_<tool> pasa entonces a ser la identidad mcp:server/tool; primero se prueba el patrón de nombre, luego los servidores en el orden de la lista, y gana el primer servidor que coincida. Los nombres de servidor distinguen entre mayúsculas y minúsculas. Las entradas vacías se ignoran. Si la lista queda vacía, esas herramientas siguen siendo herramientas de función ordinarias.
schema.platform.toolGovernance.retention.label=Conservación
schema.platform.toolGovernance.retention.rawDays.label=Conservación del uso de herramientas (días)
schema.platform.toolGovernance.retention.rawDays.description=Días que se conserva una fila de uso de herramientas por solicitud antes de que la depuración nocturna la elimine. Los agregados diarios conservan los totales.
schema.platform.toolGovernance.retention.dailyDays.label=Conservación de agregados de uso de herramientas (días)
schema.platform.toolGovernance.retention.dailyDays.description=Días que se conserva un agregado diario de uso de herramientas (por usuario, herramienta y día). El inventario y la página del usuario los leen.
schema.platform.maintenance.label=Mantenimiento
schema.platform.maintenance.description=Cuándo ejecuta el servicio de administración su mantenimiento diario: el recálculo de costos, la reconstrucción de los buckets de uso y la nueva publicación del documento de cuota de cada usuario.
schema.platform.maintenance.dailyRunAtUtc.label=Ejecución diaria a las (UTC)
schema.platform.maintenance.dailyRunAtUtc.description=Hora del día, en UTC, como HH:MM (24 horas), a la que comienza la ejecución diaria de mantenimiento. Sin establecer: la ejecución comienza 5 minutos después de que se inicie el servicio de administración y luego cada 24 horas, así que un nuevo despliegue a mediodía la fija a mediodía. Establecida: la primera ejecución sigue comenzando 5 minutos después del inicio; cada ejecución posterior comienza a esta hora cada día. Ejemplo: para ejecutarla a medianoche hora del Pacífico, introduzca 08:00 mientras rige la hora estándar del Pacífico (UTC-8) o 07:00 durante el horario de verano del Pacífico (UTC-7) - el valor no se ajusta al horario de verano.
schema.observability.label=Observabilidad
schema.observability.pseudonymization.label=Seudonimización
schema.observability.pseudonymization.description=Ajustes del plugin de seudonimización. La activación (enabled) y los conmutadores por categoría (entities) solo se aplican a este plugin; el enmascaramiento ocurre únicamente cuando el plugin se ejecuta realmente para una solicitud - debe estar registrado en la cadena de hooks y debe dispararse una fuente de activación.
schema.observability.pseudonymization.enabled.label=Habilitado
schema.observability.pseudonymization.enabled.description=Fuerza la activación del enmascaramiento para una solicitud. Solo se lee donde este bloque está bajo models.overrides.<model>.pseudonymization o hooks.defaults.<endpoint>.pseudonymization: true allí enmascara esa solicitud, y el bloque por modelo gana sobre el bloque por endpoint. False o ausente no fuerza nada - el enmascaramiento aún puede ejecutarse cuando se dispara otra fuente de activación, como una palabra desencadenante o un campo de enmascaramiento en el cuerpo de la solicitud. Bajo observability.pseudonymization esta clave se ignora actualmente; esa capa aporta todos los demás ajustes de aquí excepto method y allow_user_bypass. En cualquier caso, el plugin debe estar conectado a la cadena de hooks, o no se enmascara nada en absoluto.
schema.observability.pseudonymization.method.label=Método
schema.observability.pseudonymization.method.description=Modo de enmascaramiento: `pseudonymization` enmascara la solicitud y desenmascara la respuesta; `anonymization` enmascara y nunca desenmascara. Solo se lee donde este bloque fuerza la activación del enmascaramiento (un hook habilitado o una anulación de modelo), no bajo `observability.pseudonymization`. También condiciona el SIEM: solo `pseudonymization` conserva la respuesta enmascarada, así que con `anonymization` un sink de contenido recibe el prompt pero no la respuesta. Si se omite, se usa `pseudonymization`. Modos: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.observability.pseudonymization.allow_user_bypass.label=Permitir omisión por el usuario
schema.observability.pseudonymization.allow_user_bypass.description=Solo tiene efecto dentro de un bloque de activación forzada (un hook habilitado o una anulación de modelo); no se lee bajo `observability.pseudonymization`. Valor predeterminado false. Si es true, un llamante puede omitir el enmascaramiento mediante el encabezado `x-sail-proxy-pseudonymization: off` (sin distinguir mayúsculas y minúsculas) o el campo del cuerpo `pseudonymization_off: true`: el contenido llega sin enmascarar al LLM y, cuando un sink SIEM habilitado establece tanto `include_content` como `allow_unmasked_content`, también a ese sink. Detalles: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.observability.pseudonymization.entities.label=Entidades
schema.observability.pseudonymization.entities.description=Conmutadores de enmascaramiento por categoría: `true` enmascara la categoría en esta capa, `false` no, y una categoría no indicada hereda la capa inferior (las capas posteriores ganan). Las claves son el conjunto de categorías conocidas: las categorías activadas por defecto; tres opcionales que vienen desactivadas (`profile-org`, `profile-location`, `profile-ip-address`); y `profile-sensitive-data`, un comodín que activa todas excepto esas tres. Una clave fuera del conjunto se rechaza aquí. Categorías y capas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.observability.pseudonymization.org_suffixes.label=Sufijos de organización
schema.observability.pseudonymization.org_suffixes.description=Sufijos de forma jurídica que marcan una serie de palabras como nombre de organización, p. ej. Inc, LLC, GmbH. La coincidencia distingue mayúsculas y minúsculas a propósito, de modo que un 'limited' en minúsculas en un texto no se trata deliberadamente como forma jurídica; cada entrada coincide además escrita totalmente en mayúsculas, de modo que una factura que escribe ACME GMBH se reconoce como la misma organización que Acme GmbH. Solo tiene efecto mientras profile-org esté habilitado en entities; habilitar profile-org con esta lista vacía NO enmascara nada como organización y registra una advertencia. Cada entrada se recorta antes de la comparación, y una entrada vacía o solo con espacios se descarta en silencio en lugar de rechazarse.
schema.observability.pseudonymization.location_gazetteer.label=Nomenclátor de ubicaciones
schema.observability.pseudonymization.location_gazetteer.description=Términos de ubicación literales que enmascara el detector estructural - sin distinguir mayúsculas y minúsculas, y solo como palabra o frase completa; no se infiere nada de las mayúsculas ni del contexto. Solo tiene efecto mientras profile-location esté habilitado en entities; habilitar profile-location con esta lista vacía NO enmascara nada como ubicación y registra una advertencia. Cada entrada se recorta, y una entrada vacía o solo con espacios se descarta en silencio. Viene vacía: los nombres de lugares dependen de cada implantación y este repositorio es público, así que rellénela mediante esta aplicación de configuración de administración, nunca en código versionado.
schema.observability.pseudonymization.min_confidence.label=Confianza mín.
schema.observability.pseudonymization.min_confidence.description=Cuánta evidencia necesita un valor detectado antes de enmascararse, de 0 a 1 (predeterminado 0.5). Un valor se enmascara cuando su puntuación alcanza el umbral; un nombre propio simple puntúa alrededor de 0.5, un patrón validado por suma de comprobación 0.95, una regla personalizada 1.0. Subir el umbral elimina primero los nombres simples, así que, para endurecer una sola categoría ruidosa, use `thresholds` en su lugar. Las reglas personalizadas, los identificadores validados y las credenciales nunca se rebajan por su entorno. Detalle de la puntuación: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.observability.pseudonymization.thresholds.label=Umbrales
schema.observability.pseudonymization.thresholds.description=Umbrales de confianza por categoría, cada uno de 0 a 1, que anulan `min_confidence` para las categorías nombradas; una no indicada conserva `min_confidence`. El lugar para ser estricto con una sola categoría ruidosa - `profile-person` en 0.65 exige más evidencia para los nombres mientras los identificadores validados se quedan en el umbral global. Las claves son el mismo conjunto de categorías conocidas que admite `entities`; `profile-sensitive-data` se acepta pero no hace nada. Ajuste por categoría: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.observability.pseudonymization.allowlist.label=Lista de permitidos
schema.observability.pseudonymization.allowlist.description=Valores que esta implantación nunca enmascara - un interruptor de APAGADO, por valor. Se consulta antes de la puntuación de confianza, por lo que un valor listado queda exento por mucha evidencia que haya. Úsela para un falso positivo recurrente con nombre propio - un título de producto o de informe que parece una persona. Las listas de las capas se CONCATENAN, no se sustituyen, así que una capa inferior solo añade una exención, nunca quita una. `terms` frente a `patterns`, y el riesgo de las entradas demasiado amplias: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.allowlist.terms.label=Términos
schema.observability.pseudonymization.allowlist.terms.description=Valores literales, comparados con el valor detectado completo y DISTINGUIENDO mayúsculas y minúsculas. Distingue mayúsculas a propósito: 'Watson Studio' es el producto que un operador quería eximir y 'watson studio' en una frase no lo es, y una lista sin distinción de mayúsculas eximiría también a una persona cuyo apellido casualmente se escribe igual. Un término solo coincide con un valor que los detectores produjeron completo - listar 'Studio' no exime 'Watson Studio'. Cada entrada aquí es un interruptor de APAGADO del enmascaramiento para ese valor exacto, así que limite la lista a valores que realmente nunca son datos personales: un término que casualmente es el nombre de alguien exime a esa persona del enmascaramiento en toda esta implantación, en silencio y sin nada en el log que lo indique.
schema.observability.pseudonymization.allowlist.patterns.label=Patrones
schema.observability.pseudonymization.allowlist.patterns.description=Expresiones regulares (JavaScript), cada una comparada con el valor detectado COMPLETO: el propio gateway envuelve cada entrada en `^(?: )$`, así que escriba `Z[A-Z0-9_]+`, no `^Z[A-Z0-9_]+$`. La coincidencia distingue mayúsculas y minúsculas. Cada entrada es un interruptor de APAGADO del enmascaramiento, y una amplia desactiva el enmascaramiento sin fallar - `[A-Z].*` desactiva casi todos los nombres de persona detectados. Una coincidencia con una muestra de PII integrada genera una advertencia pero AUN ASÍ se aplica. Mantenga cada entrada acotada. Detalle: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.saturation_warn.label=Aviso de saturación
schema.observability.pseudonymization.saturation_warn.description=Cuántos valores enmascarados DISTINTOS puede contener una solicitud antes de que se notifique como saturada (predeterminado 40). Solo informa - nunca cambia lo que se enmascara. Por encima del número, el gateway registra una advertencia por solicitud con recuentos por categoría y las FORMAS de valor más comunes (letras como X, dígitos como 9); nunca aparece ningún valor enmascarado. El evento SIEM de uso de la solicitud contiene los mismos recuentos con un flag `saturated` - recuentos, no texto. Cómo leer el informe: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.observability.pseudonymization.unknown_placeholders.label=Marcadores inventados
schema.observability.pseudonymization.unknown_placeholders.description=Qué ocurre cuando una respuesta contiene un marcador enmascarado que nunca se envió al modelo. Los modelos inventan uno en aproximadamente 1 de cada 125 respuestas seudonimizadas, y con más frecuencia cuantos más valores enmascara una solicitud; un marcador así no nombra a nadie y nunca puede resolverse. withhold (predeterminado): se sustituye por una marca simple como [name withheld] y se notifica como evento de seguridad. report: solo se notifica y llega sin cambios al cliente, para una implantación cuyos propios desarrolladores escriben nuevos marcadores en datos de prueba a través del gateway. off: ninguna de las dos cosas. Un marcador que el propio cliente envió en la misma solicitud nunca se trata como inventado.
schema.observability.siem.label=SIEM
schema.observability.siem.description=Exportación SIEM. Los eventos de auditoría y de seguridad se escriben en un outbox y se entregan al menos una vez a cada sink habilitado.
schema.observability.siem.enabled.label=Habilitado
schema.observability.siem.enabled.description=Interruptor principal. Si es false, el distribuidor no se inicia, independientemente de los ajustes de cada sink.
schema.observability.siem.batch_size.label=Tamaño de lote
schema.observability.siem.batch_size.description=Filas predeterminadas leídas por sink en cada ciclo; un sink puede anularlo.
schema.observability.siem.interval_ms.label=Intervalo (ms)
schema.observability.siem.interval_ms.description=Intervalo de envío predeterminado en milisegundos; un sink puede anularlo. El período del temporizador es el más corto de todos los intervalos en uso.
schema.observability.siem.reconcile_lookback_ms.label=Retrospectiva de conciliación (ms)
schema.observability.siem.reconcile_lookback_ms.description=Hasta qué punto atrás, en milisegundos, busca la pasada de reparación eventos del outbox que nunca se entregaron a un sink. Limita ese análisis e impide que un sink recién habilitado reproduzca todo el historial conservado; los eventos más antiguos nunca se rellenan con posterioridad.
schema.observability.siem.content_max_bytes.label=Máx. bytes de contenido
schema.observability.siem.content_max_bytes.description=Límite, en bytes UTF-8, aplicado de forma independiente al prompt y a la respuesta antes de publicar un evento de uso. Un evento recortado contiene content.truncated: true, de modo que un payload parcial nunca se confunde con una conversación completa. Se acepta 0 y vacía el contenido, marcado como recortado. Predeterminado 8192, que es también donde acaba un valor negativo o no numérico.
schema.observability.siem.categories.label=Categorías
schema.observability.siem.categories.description=Categorías de eventos que se exportan. 'usage' es un evento de finalización por solicitud y es la única categoría que puede contener contenido de conversaciones; la lista suministrada la omite, así que exportarla es una activación explícita; una lista ausente o vacía exporta las tres, usage incluida.
schema.observability.siem.sinks.label=Sinks
schema.observability.siem.sinks.description=Sinks configurados. Un sink cuyos ajustes no superan la validación se omite con una advertencia en lugar de detener a los demás.
schema.observability.siem.sinks.items.name.label=Nombre
schema.observability.siem.sinks.items.name.description=Nombre único del sink; la clave usada para las filas de entrega por sink y el estado de espera.
schema.observability.siem.sinks.items.type.label=Tipo
schema.observability.siem.sinks.items.type.description=Implementación del sink. Determina cuáles de las propiedades específicas del tipo de abajo se aplican.
schema.observability.siem.sinks.items.enabled.label=Habilitado
schema.observability.siem.sinks.items.enabled.description=Viene en false. Un sink solo se envía cuando tanto siem.enabled como este son true.
schema.observability.siem.sinks.items.include_content.label=Incluir contenido
schema.observability.siem.sinks.items.include_content.description=Activación explícita: envía a este sink el prompt y la respuesta de cada solicitud, como parte de un evento de uso. Predeterminado false, y false en todos los sinks entregados. Lo que envía es la forma seudonimizada - marcadores, no PII sin procesar - salvo que también esté establecido allow_unmasked_content. Requiere 'usage' en siem.categories; el distribuidor quita el contenido por completo para un sink donde esto es false.
schema.observability.siem.sinks.items.allow_unmasked_content.label=Permitir contenido sin enmascarar
schema.observability.siem.sinks.items.allow_unmasked_content.description=RIESGO - lee conversaciones sin procesar. Activación explícita para recibir contenido que la seudonimización nunca enmascaró, porque el enmascaramiento estaba desactivado u omitido para esa solicitud: nombres reales, direcciones y cualquier cosa que un usuario haya pegado, completa, saliendo de este sistema. Predeterminado false, y solo tiene efecto cuando include_content también es true. Si se deja en false, una solicitud así solo envía metadatos y registra content.omitted: 'not-masked'.
schema.observability.siem.sinks.items.include_credential_material.label=Incluir material de credenciales
schema.observability.siem.sinks.items.include_credential_material.description=Activación explícita: envía el valor sin procesar de una credencial no resuelta con fines forenses. Predeterminado false; el distribuidor quita el campo cuando es false.
schema.observability.siem.sinks.items.batch_size.label=Tamaño de lote
schema.observability.siem.sinks.items.batch_size.description=Anulación por sink de siem.batch_size.
schema.observability.siem.sinks.items.interval_ms.label=Intervalo (ms)
schema.observability.siem.sinks.items.interval_ms.description=Anulación por sink de siem.interval_ms. Debe superar el tiempo de espera de envío del sink, o los envíos se ponen en cola uno tras otro.
schema.observability.siem.sinks.items.url.label=URL
schema.observability.siem.sinks.items.url.description=webhook: URL de ingesta completa.
schema.observability.siem.sinks.items.token_env.label=Token
schema.observability.siem.sinks.items.token_env.description=Nombre de la ranura de credencial. Nunca un valor de credencial - api_config.json se versiona en tres copias sincronizadas en un repositorio público.
schema.observability.siem.sinks.items.endpoint.label=Endpoint
schema.observability.siem.sinks.items.endpoint.description=otel: endpoint de logs OTLP/HTTP.
schema.observability.siem.sinks.items.headers_env.label=Encabezados
schema.observability.siem.sinks.items.headers_env.description=Nombre de la ranura de credencial. Nunca un valor de credencial - api_config.json se versiona en tres copias sincronizadas en un repositorio público.
schema.observability.siem.sinks.items.site.label=Sitio
schema.observability.siem.sinks.items.site.description=datadog: host del sitio, p. ej. datadoghq.com o datadoghq.eu.
schema.observability.siem.sinks.items.api_key_env.label=Clave de API
schema.observability.siem.sinks.items.api_key_env.description=Nombre de la ranura de credencial. Nunca un valor de credencial - api_config.json se versiona en tres copias sincronizadas en un repositorio público.
schema.observability.siem.sinks.items.dcr_endpoint.label=Endpoint DCR
schema.observability.siem.sinks.items.dcr_endpoint.description=azure_sentinel: URL del Data Collection Endpoint.
schema.observability.siem.sinks.items.dcr_immutable_id.label=ID inmutable de DCR
schema.observability.siem.sinks.items.dcr_immutable_id.description=azure_sentinel: id inmutable de la Data Collection Rule.
schema.observability.siem.sinks.items.stream_name.label=Nombre del stream
schema.observability.siem.sinks.items.stream_name.description=azure_sentinel: nombre de stream personalizado, p. ej. Custom-SailProxy_CL.
schema.observability.siem.sinks.items.tenant_id.label=ID de tenant
schema.observability.siem.sinks.items.tenant_id.description=azure_sentinel: id de tenant de Entra.
schema.observability.siem.sinks.items.client_id.label=ID de cliente
schema.observability.siem.sinks.items.client_id.description=azure_sentinel: id de la aplicación (cliente) de Entra.
schema.observability.siem.sinks.items.client_secret_env.label=Secreto de cliente
schema.observability.siem.sinks.items.client_secret_env.description=Nombre de la ranura de credencial. Nunca un valor de credencial - api_config.json se versiona en tres copias sincronizadas en un repositorio público.
schema.observability.siem.sinks.items.project_id.label=ID de proyecto
schema.observability.siem.sinks.items.project_id.description=gcs_pubsub: id de proyecto de Google Cloud.
schema.observability.siem.sinks.items.topic_id.label=ID de tema
schema.observability.siem.sinks.items.topic_id.description=gcs_pubsub: id del tema de Pub/Sub.
schema.observability.siem.sinks.items.service_account_json_env.label=JSON de la cuenta de servicio
schema.observability.siem.sinks.items.service_account_json_env.description=Nombre de la ranura de credencial. Nunca un valor de credencial - api_config.json se versiona en tres copias sincronizadas en un repositorio público.
schema.observability.siem.sinks.items.bucket.label=Bucket
schema.observability.siem.sinks.items.bucket.description=s3: bucket de destino.
schema.observability.siem.sinks.items.region.label=Región
schema.observability.siem.sinks.items.region.description=s3: región de AWS.
schema.observability.siem.sinks.items.prefix.label=Prefijo
schema.observability.siem.sinks.items.prefix.description=s3: prefijo de clave; los objetos se guardan en <prefix>/YYYY/MM/DD/HH/<uuid>.ndjson en UTC.
schema.observability.siem.sinks.items.access_key_id_env.label=ID de clave de acceso
schema.observability.siem.sinks.items.access_key_id_env.description=Nombre de la ranura de credencial. Nunca un valor de credencial - api_config.json se versiona en tres copias sincronizadas en un repositorio público.
schema.observability.siem.sinks.items.secret_access_key_env.label=Clave de acceso secreta
schema.observability.siem.sinks.items.secret_access_key_env.description=Nombre de la ranura de credencial. Nunca un valor de credencial - api_config.json se versiona en tres copias sincronizadas en un repositorio público.
schema.plugins.label=Plugins
schema.plugins.description=Ajustes de los plugins del gateway instalados, por id de plugin. Cada plugin documenta sus propios ajustes; el gateway entrega a un plugin su entrada sin cambios, por lo que un plugin debe tolerar un valor inesperado. Las entradas se crean al instalar un plugin, no se escriben aquí.
