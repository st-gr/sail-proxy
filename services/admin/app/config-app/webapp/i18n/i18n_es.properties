schema.providers.openrouter.default_pricing.label=Precios predeterminados
schema.providers.openrouter.default_pricing.description=Precios de reserva de OpenRouter - completion, image y prompt, cada uno una cadena decimal. Actualmente el gateway los ignora; se conservan para que el valor entregado se valide y siga visible para cualquier consumidor que se añada más adelante. Editarlo hoy no cambia ningún comportamiento.
schema.providers.openrouter.default_pricing.completion.label=Finalización
schema.providers.openrouter.default_pricing.completion.description=Precio de los tokens de completion, escrito como cadena decimal. Actualmente el gateway lo ignora, como el resto de default_pricing: la lista de modelos en formato OpenRouter informa en su lugar precios fijos propios.
schema.providers.openrouter.default_pricing.image.label=Imagen
schema.providers.openrouter.default_pricing.image.description=Precio de la entrada de imagen, escrito como cadena decimal. Actualmente el gateway lo ignora, como el resto de default_pricing: la lista de modelos en formato OpenRouter informa en su lugar precios fijos propios.
schema.providers.openrouter.default_pricing.prompt.label=Prompt
schema.providers.openrouter.default_pricing.prompt.description=Precio de los tokens de prompt, escrito como cadena decimal. Actualmente el gateway lo ignora, como el resto de default_pricing: la lista de modelos en formato OpenRouter informa en su lugar precios fijos propios.
schema.providers.openrouter.model_mappings.label=Asignaciones de modelos
schema.providers.openrouter.model_mappings.description=Valores predeterminados por proveedor upstream para las solicitudes de OpenRouter, cuyos ids de modelo se escriben 'provider/model'. La primera entrada cuyo proveedor coincide con el prefijo del id, sin distinguir mayúsculas y minúsculas, aporta max_tokens cuando el cliente lo omite. Es el único campo que se usa: default_context_length e id_prefix son obligatorios según este esquema, pero actualmente el gateway los ignora.
schema.providers.openrouter.model_mappings.items.default_context_length.label=Longitud de contexto predeterminada
schema.providers.openrouter.model_mappings.items.default_context_length.description=Obligatorio en cada entrada, pero actualmente el gateway lo ignora; se conserva por compatibilidad.
schema.providers.openrouter.model_mappings.items.id_prefix.label=Prefijo de ID
schema.providers.openrouter.model_mappings.items.id_prefix.description=Obligatorio en cada entrada, pero actualmente el gateway lo ignora; la coincidencia se hace por proveedor, no por este campo.
schema.providers.openrouter.model_mappings.items.provider.label=Proveedor
schema.providers.openrouter.model_mappings.items.provider.description=Se compara, sin distinguir mayúsculas y minúsculas, con la parte del id de modelo del cliente anterior a la barra.
schema.providers.openrouter.model_mappings.items.max_tokens.label=Máx. tokens
schema.providers.openrouter.model_mappings.items.max_tokens.description=Se aplica como max_tokens de la solicitud cuando el cliente no envía ninguno. Si falta, la solicitud queda sin él.
