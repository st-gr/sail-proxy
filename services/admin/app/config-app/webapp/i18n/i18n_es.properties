# Configuration form field texts by schema path - generated by ci/scripts/schema-texts.js.
# English is regenerated from the schema; other languages are translated in place and kept.
schema.providers.label=Proveedores
schema.providers.description=Ajustes de cada proveedor upstream, con su nombre de transmisión en la ruta como clave (por eso `aws-bedrock` conserva su guion). Hoy se leen seis proveedores - anthropic, aws-bedrock, google, openai, openrouter y perplexity; cualquier otra clave se acepta y se valida, pero permanece inactiva hasta que el gateway la conozca. Cada proveedor con nombre acepta solo su propia lista de ajustes, aunque algunos ajustes aceptados quedan inactivos bajo un proveedor concreto - la descripción de cada campo indica dónde se lee; google es el más restringido de los seis y solo contiene substitute_models, leído por la ruta /google; cualquier otro ajuste común de proveedor se rechaza bajo él en lugar de quedar simplemente inactivo. Claves por proveedor: https://st-gr.github.io/sail-proxy/developer/gateway#provider-configuration-keys
schema.providers.anthropic.label=Anthropic
schema.providers.anthropic.description=El proveedor anthropic, atendido por la ruta de solicitud Anthropic del gateway: los ajustes que contiene todo proveedor, más la versión de transmisión de esa ruta y sus dos filtros de flags beta.
schema.providers.anthropic.emulate_streaming_for_models.label=Emular streaming para modelos
schema.providers.anthropic.emulate_streaming_for_models.description=Modelos cuya respuesta el gateway recopila completa y luego reproduce como stream, porque el despliegue no puede transmitirla por sí mismo. Se comparan con el nombre de modelo enviado upstream, exactamente o sin el prefijo 'provider--'. Hoy solo se usa para los proveedores anthropic y openai; una entrada bajo cualquier otro proveedor no tiene efecto.
schema.providers.anthropic.substitute_models.label=Modelos sustitutos
schema.providers.anthropic.substitute_models.description=Cambios de nombre de modelo para este proveedor: una solicitud que nombra 'from' (coincidencia exacta, incluidas mayúsculas y minúsculas) se reenvía como 'to'; gana la primera entrada que coincide y los cambios de nombre no se encadenan. La respuesta y el uso registrado para el coste indican entonces el modelo reenviado, no el nombre que envió el cliente. Se lee en las rutas anthropic, aws-bedrock y google, en la ruta de chat completions de openrouter y en las rutas de predicción de SAP RPT (/sap/v1/rpt, desde la lista sap-rpt), cada una para su propio proveedor; en /openai/v1/chat/completions y /openai/v1/responses se consulta primero la lista de openai y después la de perplexity.
schema.providers.anthropic.substitute_models.items.from.label=De
schema.providers.anthropic.substitute_models.items.from.description=El nombre de modelo que envía el cliente.
schema.providers.anthropic.substitute_models.items.to.label=A
schema.providers.anthropic.substitute_models.items.to.description=El nombre de modelo reenviado a SAP AI Core, normalmente un id de modelo desplegado como anthropic--claude-4.5-sonnet--deployed.
schema.providers.anthropic.substitute_models.items.description.label=Descripción
schema.providers.anthropic.substitute_models.items.description.description=Nota de texto libre sobre este cambio de nombre, para quien lea la configuración más adelante. Actualmente el gateway la ignora; no cambia nada en el comportamiento del cambio de nombre.
schema.providers.anthropic.unsupported_params.label=Parámetros no admitidos
schema.providers.anthropic.unsupported_params.description=Parámetros de solicitud que este proveedor o modelo no acepta. El gateway los quita antes de reenviar a SAP AI Core, que de lo contrario rechazaría la solicitud con 400 "does not support parameters: [...]". Una lista por modelo sustituye a la lista del proveedor en lugar de añadirse a ella.
schema.providers.anthropic.param_renames.label=Cambios de nombre de parámetros
schema.providers.anthropic.param_renames.description=Cambios de nombre de parámetros aplicados en la ruta de despliegue directo, por ejemplo max_tokens a max_completion_tokens para los modelos de razonamiento de OpenAI que rechazan max_tokens. Un mapa por modelo sustituye al mapa del proveedor en lugar de añadirse a él.
schema.providers.anthropic.supports_responses_api.label=Admite la Responses API
schema.providers.anthropic.supports_responses_api.description=Si este proveedor o modelo puede atenderse en /openai/v1/responses. Si falta, se mantiene la regla integrada por familia, que admite GPT-5 desplegado y posteriores y la serie o.
schema.providers.anthropic.supports_prompt_caching.label=Admite caché de prompts
schema.providers.anthropic.supports_prompt_caching.description=Si los modelos de este proveedor reciben puntos de corte de caché de prompts de Anthropic. Orden de resolución: el flag por modelo models.overrides.<model>.supports_prompt_caching, luego este flag del proveedor y luego un valor predeterminado de true para el proveedor anthropic y false para todos los demás. Poner false donde la caché sí funciona cuesta el precio completo de entrada sin caché en cada turno, mientras que un true innecesario se midió como sin efecto - así que desactívelo solo para un modelo que se sepa que lo rechaza.
schema.providers.anthropic.anthropic_bedrock_version.label=Versión de Anthropic Bedrock
schema.providers.anthropic.anthropic_bedrock_version.description=La anthropic-version que el gateway envía a SAP AI Core cuando el cliente omite el encabezado anthropic-version. Solo se lee de providers.anthropic, por lo que una copia bajo cualquier otro proveedor - aws-bedrock incluido - no tiene efecto. Si falta, se usa bedrock-2023-05-31.
schema.providers.anthropic.excluded_beta_headers.label=Encabezados beta excluidos
schema.providers.anthropic.excluded_beta_headers.description=Flags beta de Anthropic que se quitan de una solicitud antes de reenviarla, para funciones que el despliegue de SAP AI Core no acepta. Se aplican junto con los flags que el propio gateway pone en cuarentena tras un 400 'invalid beta flag' upstream. Solo se lee de providers.anthropic; una lista bajo cualquier otro proveedor no tiene efecto.
schema.providers.anthropic.supported_beta_headers.label=Encabezados beta admitidos
schema.providers.anthropic.supported_beta_headers.description=Lista de permitidos de flags beta de Anthropic: mientras no esté vacía, solo se reenvían estos, y excluded_beta_headers sigue aplicándose encima. Vacía o ausente significa que no hay lista de permitidos, así que pasa todo flag que haya enviado el cliente - lo que convierte la primera entrada añadida aquí en un descarte silencioso de todos los flags no listados junto a ella. Solo se lee de providers.anthropic.
schema.providers.anthropic.sap_cache_read_token_billing_factor.label=Factor de facturación SAP de tokens de lectura de caché
schema.providers.anthropic.sap_cache_read_token_billing_factor.description=Factor de calibración que escala el NÚMERO de tokens de entrada de LECTURA de caché que informa la API del modelo hasta el número que SAP AI Core mide en su factura, para la contabilidad de costos nativa de SAP en Capacity Units. Lo lee la aplicación de administración (no la ruta de solicitud del gateway). La conciliación de facturas de marzo a junio de 2026 halló que la partida 'Cache Read Input Tokens' de SAP es ~2x los cache_read_input_tokens que devuelve la API y que sail-proxy registra fielmente; el mecanismo no está documentado y se está consultando con SAP. Tenga en cuenta que Anthropic y AWS Bedrock multiplican el PRECIO de la caché (lectura 0.1x, escritura 1.25x/2x según el TTL), nunca el NÚMERO de tokens, así que se trata de una calibración de la medición de SAP, no del modelo de precios de Anthropic. El valor predeterminado 1.0 no aplica ningún ajuste - establézcalo (p. ej. 2.0) solo cuando la consulta a SAP confirme la proporción.
schema.providers.anthropic.sap_cache_write_token_billing_factor.label=Factor de facturación SAP de tokens de escritura de caché
schema.providers.anthropic.sap_cache_write_token_billing_factor.description=Factor de calibración que escala el NÚMERO de tokens de entrada de ESCRITURA (creación) de caché que informa la API del modelo hasta el número que SAP AI Core mide en su factura, para la contabilidad de costos nativa de SAP en Capacity Units. Lo lee la aplicación de administración (no la ruta de solicitud del gateway). La conciliación de marzo a junio de 2026 de la partida 'Cache Write Input Tokens' de SAP frente a los cache_creation_input_tokens informados por la API fue incoherente de un mes a otro (probablemente un efecto del límite del período de facturación, ya que las escrituras se concentran al inicio de la sesión), así que, a diferencia del factor de lectura, no se ha establecido una proporción única. El valor predeterminado 1.0 no aplica ningún ajuste; déjelo en 1.0 salvo que la consulta a SAP establezca una proporción de escritura firme.
schema.providers.aws-bedrock.label=Aws-bedrock
schema.providers.aws-bedrock.description=El proveedor aws-bedrock, atendido por la misma ruta de solicitud con forma de Anthropic: los ajustes que contiene todo proveedor, más la versión de transmisión de esa ruta y sus dos filtros de flags beta - cada uno de los cuales el gateway lee en realidad de providers.anthropic, por lo que un valor aquí se acepta y queda inactivo.
schema.providers.aws-bedrock.emulate_streaming_for_models.label=Emular streaming para modelos
schema.providers.aws-bedrock.emulate_streaming_for_models.description=Modelos cuya respuesta el gateway recopila completa y luego reproduce como stream, porque el despliegue no puede transmitirla por sí mismo. Se comparan con el nombre de modelo enviado upstream, exactamente o sin el prefijo 'provider--'. Hoy solo se usa para los proveedores anthropic y openai; una entrada bajo cualquier otro proveedor no tiene efecto.
schema.providers.aws-bedrock.substitute_models.label=Modelos sustitutos
schema.providers.aws-bedrock.substitute_models.description=Cambios de nombre de modelo para este proveedor: una solicitud que nombra 'from' (coincidencia exacta, incluidas mayúsculas y minúsculas) se reenvía como 'to'; gana la primera entrada que coincide y los cambios de nombre no se encadenan. La respuesta y el uso registrado para el coste indican entonces el modelo reenviado, no el nombre que envió el cliente. Se lee en las rutas anthropic, aws-bedrock y google, en la ruta de chat completions de openrouter y en las rutas de predicción de SAP RPT (/sap/v1/rpt, desde la lista sap-rpt), cada una para su propio proveedor; en /openai/v1/chat/completions y /openai/v1/responses se consulta primero la lista de openai y después la de perplexity.
schema.providers.aws-bedrock.substitute_models.items.from.label=De
schema.providers.aws-bedrock.substitute_models.items.from.description=El nombre de modelo que envía el cliente.
schema.providers.aws-bedrock.substitute_models.items.to.label=A
schema.providers.aws-bedrock.substitute_models.items.to.description=El nombre de modelo reenviado a SAP AI Core, normalmente un id de modelo desplegado como anthropic--claude-4.5-sonnet--deployed.
schema.providers.aws-bedrock.substitute_models.items.description.label=Descripción
schema.providers.aws-bedrock.substitute_models.items.description.description=Nota de texto libre sobre este cambio de nombre, para quien lea la configuración más adelante. Actualmente el gateway la ignora; no cambia nada en el comportamiento del cambio de nombre.
schema.providers.aws-bedrock.unsupported_params.label=Parámetros no admitidos
schema.providers.aws-bedrock.unsupported_params.description=Parámetros de solicitud que este proveedor o modelo no acepta. El gateway los quita antes de reenviar a SAP AI Core, que de lo contrario rechazaría la solicitud con 400 "does not support parameters: [...]". Una lista por modelo sustituye a la lista del proveedor en lugar de añadirse a ella.
schema.providers.aws-bedrock.param_renames.label=Cambios de nombre de parámetros
schema.providers.aws-bedrock.param_renames.description=Cambios de nombre de parámetros aplicados en la ruta de despliegue directo, por ejemplo max_tokens a max_completion_tokens para los modelos de razonamiento de OpenAI que rechazan max_tokens. Un mapa por modelo sustituye al mapa del proveedor en lugar de añadirse a él.
schema.providers.aws-bedrock.supports_responses_api.label=Admite la Responses API
schema.providers.aws-bedrock.supports_responses_api.description=Si este proveedor o modelo puede atenderse en /openai/v1/responses. Si falta, se mantiene la regla integrada por familia, que admite GPT-5 desplegado y posteriores y la serie o.
schema.providers.aws-bedrock.supports_prompt_caching.label=Admite caché de prompts
schema.providers.aws-bedrock.supports_prompt_caching.description=Si los modelos de este proveedor reciben puntos de corte de caché de prompts de Anthropic. Orden de resolución: el flag por modelo models.overrides.<model>.supports_prompt_caching, luego este flag del proveedor y luego un valor predeterminado de true para el proveedor anthropic y false para todos los demás. Poner false donde la caché sí funciona cuesta el precio completo de entrada sin caché en cada turno, mientras que un true innecesario se midió como sin efecto - así que desactívelo solo para un modelo que se sepa que lo rechaza.
schema.providers.aws-bedrock.anthropic_bedrock_version.label=Versión de Anthropic Bedrock
schema.providers.aws-bedrock.anthropic_bedrock_version.description=La anthropic-version que el gateway envía a SAP AI Core cuando el cliente omite el encabezado anthropic-version. Solo se lee de providers.anthropic, por lo que una copia bajo cualquier otro proveedor - aws-bedrock incluido - no tiene efecto. Si falta, se usa bedrock-2023-05-31.
