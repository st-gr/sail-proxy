schema.providers.openai.openai_deployment_api_version.label=Versión de API de despliegue de Openai
schema.providers.openai.openai_deployment_api_version.description=Parámetro api-version de Azure-OpenAI que se añade a la URL /chat/completions de un modelo OpenAI desplegado. Solo se lee de providers.openai y solo se envía para ese proveedor, porque los despliegues de Perplexity rechazan el parámetro. Se escribe como YYYY-MM-DD, opcionalmente con -preview. Si falta, no se añade ninguna api-version.
schema.providers.openrouter.label=Openrouter
