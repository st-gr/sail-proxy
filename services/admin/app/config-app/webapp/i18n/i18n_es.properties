schema.providers.google.description=El proveedor google, atendido por la ruta de solicitud Gemini del gateway. Hoy solo se respeta substitute_models; los demás ajustes comunes de proveedor aún no están conectados para este proveedor, por lo que - a diferencia de todos los demás proveedores con nombre aquí - se rechazan en lugar de quedar simplemente inactivos.
