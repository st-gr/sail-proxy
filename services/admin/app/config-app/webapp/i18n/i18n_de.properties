schema.plugins.label=Plugins
schema.plugins.description=Einstellungen installierter Gateway-Plugins, nach Plugin-ID geordnet. Jedes Plugin dokumentiert seine Einstellungen selbst; das Gateway übergibt einem Plugin seinen Eintrag unverändert, ein Plugin muss also mit einem unerwarteten Wert zurechtkommen. Einträge entstehen durch die Installation eines Plugins und werden hier nicht von Hand angelegt.
