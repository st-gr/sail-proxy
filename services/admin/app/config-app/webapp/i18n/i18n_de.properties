# Configuration form field texts by schema path - generated by ci/scripts/schema-texts.js.
# English is regenerated from the schema; other languages are translated in place and kept.
schema.providers.label=Anbieter
schema.providers.description=Einstellungen für jeden Upstream-Anbieter, mit seinem Wire-Namen in der Route als Schlüssel (daher behält `aws-bedrock` seinen Bindestrich). Sechs Anbieter werden heute gelesen - anthropic, aws-bedrock, google, openai, openrouter und perplexity; jeder andere Schlüssel wird akzeptiert und geprüft, bleibt aber wirkungslos, bis das Gateway ihn kennt. Jeder benannte Anbieter akzeptiert nur seine eigene Liste von Einstellungen, wobei einige akzeptierte Einstellungen unter einem bestimmten Anbieter wirkungslos sind - die Beschreibung jedes Felds nennt, wo es gelesen wird; google ist der schmalste der sechs und enthält nur substitute_models, gelesen von der Route /google; jede andere allgemeine Anbietereinstellung wird darunter abgelehnt statt nur wirkungslos zu bleiben. Schlüssel je Anbieter: https://st-gr.github.io/sail-proxy/developer/gateway#provider-configuration-keys
schema.providers.anthropic.label=Anthropic
schema.providers.anthropic.description=Der Anbieter anthropic, bedient vom Anthropic-Anfragepfad des Gateways: die Einstellungen, die jeder Anbieter hat, plus die Wire-Version dieses Pfads und seine zwei Beta-Flag-Filter.
schema.providers.anthropic.emulate_streaming_for_models.label=Streaming für Modelle emulieren
schema.providers.anthropic.emulate_streaming_for_models.description=Modelle, deren Antwort das Gateway vollständig sammelt und dann als Stream wiedergibt, weil das Deployment sie nicht selbst streamen kann. Abgeglichen mit dem upstream gesendeten Modellnamen, entweder exakt oder ohne das Präfix 'provider--'. Heute nur für die Anbieter anthropic und openai verwendet; ein Eintrag unter einem anderen Anbieter hat keine Wirkung.
schema.providers.anthropic.substitute_models.label=Ersatzmodelle
schema.providers.anthropic.substitute_models.description=Modellumbenennungen für diesen Anbieter: Eine Anfrage, die 'from' nennt (exakter Abgleich, einschließlich Groß- und Kleinschreibung), wird als 'to' weitergeleitet; der erste passende Eintrag gewinnt, und Umbenennungen werden nicht verkettet. Die Antwort und die für die Kosten erfasste Nutzung nennen dann das weitergeleitete Modell, nicht den Namen, den der Client gesendet hat. Gelesen auf den Routen anthropic, aws-bedrock und google, auf der Chat-Completions-Route von openrouter sowie auf den SAP-RPT-Predict-Routen (/sap/v1/rpt, aus der sap-rpt-Liste), jeweils für den eigenen Anbieter; auf /openai/v1/chat/completions und /openai/v1/responses wird zuerst die openai-Liste herangezogen, dann die perplexity-Liste.
schema.providers.anthropic.substitute_models.items.from.label=Von
schema.providers.anthropic.substitute_models.items.from.description=Der Modellname, den der Client sendet.
schema.providers.anthropic.substitute_models.items.to.label=Nach
schema.providers.anthropic.substitute_models.items.to.description=Der an SAP AI Core weitergeleitete Modellname, typischerweise eine Deployment-Modell-ID wie anthropic--claude-4.5-sonnet--deployed.
schema.providers.anthropic.substitute_models.items.description.label=Beschreibung
schema.providers.anthropic.substitute_models.items.description.description=Freitextnotiz zu dieser Umbenennung, für alle, die die Konfiguration später lesen. Derzeit vom Gateway ignoriert; sie ändert nichts am Verhalten der Umbenennung.
schema.providers.anthropic.unsupported_params.label=Nicht unterstützte Parameter
schema.providers.anthropic.unsupported_params.description=Anfrageparameter, die dieser Anbieter oder dieses Modell nicht akzeptiert. Das Gateway entfernt sie vor der Weiterleitung an SAP AI Core, das die Anfrage sonst mit 400 "does not support parameters: [...]" ablehnen würde. Eine Liste je Modell ersetzt die Liste auf Anbieterebene, statt sie zu ergänzen.
schema.providers.anthropic.param_renames.label=Parameterumbenennungen
schema.providers.anthropic.param_renames.description=Parameterumbenennungen auf dem Direct-Deployment-Pfad, zum Beispiel max_tokens zu max_completion_tokens für OpenAI-Reasoning-Modelle, die max_tokens ablehnen. Eine Zuordnung je Modell ersetzt die Zuordnung auf Anbieterebene, statt sie zu ergänzen.
schema.providers.anthropic.supports_responses_api.label=Unterstützt Responses API
schema.providers.anthropic.supports_responses_api.description=Ob dieser Anbieter oder dieses Modell über /openai/v1/responses bedient werden darf. Fehlt der Wert, gilt die eingebaute Familienregel, die Deployment-Modelle ab GPT-5 und die o-Serie zulässt.
schema.providers.anthropic.supports_prompt_caching.label=Unterstützt Prompt-Caching
schema.providers.anthropic.supports_prompt_caching.description=Ob die Modelle dieses Anbieters Anthropic-Prompt-Cache-Breakpoints erhalten. Auflösungsreihenfolge: das Flag models.overrides.<model>.supports_prompt_caching je Modell, dann dieses Flag auf Anbieterebene, dann ein Standard von true für den Anbieter anthropic und false für jeden anderen. false zu setzen, wo Caching tatsächlich funktioniert, kostet bei jedem Durchgang den vollen ungecachten Eingabepreis, während ein unnötiges true als wirkungslos gemessen wurde - deaktivieren Sie es daher nur für ein Modell, von dem bekannt ist, dass es dies ablehnt.
schema.providers.anthropic.anthropic_bedrock_version.label=Anthropic-Bedrock-Version
schema.providers.anthropic.anthropic_bedrock_version.description=Die anthropic-version, die das Gateway an SAP AI Core sendet, wenn der Client den Header anthropic-version weglässt. Nur aus providers.anthropic gelesen, daher hat eine Kopie unter einem anderen Anbieter - auch aws-bedrock - keine Wirkung. Fehlt der Wert, wird bedrock-2023-05-31 verwendet.
schema.providers.anthropic.excluded_beta_headers.label=Ausgeschlossene Beta-Header
schema.providers.anthropic.excluded_beta_headers.description=Anthropic-Beta-Flags, die vor der Weiterleitung aus einer Anfrage entfernt werden, für Funktionen, die das SAP-AI-Core-Deployment nicht akzeptiert. Zusammen mit den Flags angewendet, die das Gateway nach einem upstream-Fehler 400 'invalid beta flag' selbst in Quarantäne nimmt. Nur aus providers.anthropic gelesen; eine Liste unter einem anderen Anbieter hat keine Wirkung.
schema.providers.anthropic.supported_beta_headers.label=Unterstützte Beta-Header
schema.providers.anthropic.supported_beta_headers.description=Positivliste der Anthropic-Beta-Flags: Solange sie nicht leer ist, werden nur diese weitergeleitet, und excluded_beta_headers gilt zusätzlich. Leer oder fehlend bedeutet gar keine Positivliste, sodass jedes vom Client gesendete Flag durchgeht - das Hinzufügen eines ersten Eintrags hier verwirft daher stillschweigend jedes nicht daneben aufgeführte Flag. Nur aus providers.anthropic gelesen.
schema.providers.anthropic.sap_cache_read_token_billing_factor.label=SAP-Abrechnungsfaktor für Cache-Read-Token
schema.providers.anthropic.sap_cache_read_token_billing_factor.description=Kalibrierungsfaktor, der die von der Modell-API gemeldete ANZAHL der Cache-READ-Eingabetoken auf die Anzahl hochskaliert, die SAP AI Core auf seiner Rechnung misst, für die SAP-native Kostenrechnung in Capacity Units. Von der Admin-App gelesen (nicht vom Gateway-Anfragepfad). Ein Rechnungsabgleich über Mär-Jun 2026 ergab, dass die SAP-Position 'Cache Read Input Tokens' etwa das 2-Fache der cache_read_input_tokens beträgt, die die API liefert und sail-proxy getreu erfasst; der Mechanismus ist undokumentiert und bei SAP angefragt. Beachten Sie, dass Anthropic und AWS Bedrock den Cache-PREIS multiplizieren (Lesen 0.1x, Schreiben 1.25x/2x je nach TTL), nie die Token-ANZAHL; dies ist also eine Kalibrierung der SAP-Messung, nicht das Anthropic-Preismodell. Der Standard 1.0 nimmt keine Anpassung vor - setzen Sie ihn (z. B. 2.0) erst, wenn die SAP-Anfrage das Verhältnis bestätigt.
schema.providers.anthropic.sap_cache_write_token_billing_factor.label=SAP-Abrechnungsfaktor für Cache-Write-Token
schema.providers.anthropic.sap_cache_write_token_billing_factor.description=Kalibrierungsfaktor, der die von der Modell-API gemeldete ANZAHL der Cache-WRITE-Eingabetoken (Erstellung) auf die Anzahl hochskaliert, die SAP AI Core auf seiner Rechnung misst, für die SAP-native Kostenrechnung in Capacity Units. Von der Admin-App gelesen (nicht vom Gateway-Anfragepfad). Der Abgleich der SAP-Position 'Cache Write Input Tokens' mit den von der API gemeldeten cache_creation_input_tokens für Mär-Jun 2026 war von Monat zu Monat uneinheitlich (wahrscheinlich ein Effekt der Abrechnungsperiodengrenze, da sich Schreibvorgänge am Sitzungsbeginn häufen), sodass anders als beim Lesefaktor kein einheitliches Verhältnis feststeht. Der Standard 1.0 nimmt keine Anpassung vor; belassen Sie ihn bei 1.0, bis die SAP-Anfrage ein festes Schreibverhältnis ergibt.
schema.providers.aws-bedrock.label=Aws-bedrock
schema.providers.aws-bedrock.description=Der Anbieter aws-bedrock, bedient vom selben Anthropic-förmigen Anfragepfad: die Einstellungen, die jeder Anbieter hat, plus die Wire-Version dieses Pfads und seine zwei Beta-Flag-Filter - die das Gateway allerdings jeweils aus providers.anthropic liest, sodass ein Wert hier akzeptiert wird, aber wirkungslos bleibt.
schema.providers.aws-bedrock.emulate_streaming_for_models.label=Streaming für Modelle emulieren
schema.providers.aws-bedrock.emulate_streaming_for_models.description=Modelle, deren Antwort das Gateway vollständig sammelt und dann als Stream wiedergibt, weil das Deployment sie nicht selbst streamen kann. Abgeglichen mit dem upstream gesendeten Modellnamen, entweder exakt oder ohne das Präfix 'provider--'. Heute nur für die Anbieter anthropic und openai verwendet; ein Eintrag unter einem anderen Anbieter hat keine Wirkung.
schema.providers.aws-bedrock.substitute_models.label=Ersatzmodelle
schema.providers.aws-bedrock.substitute_models.description=Modellumbenennungen für diesen Anbieter: Eine Anfrage, die 'from' nennt (exakter Abgleich, einschließlich Groß- und Kleinschreibung), wird als 'to' weitergeleitet; der erste passende Eintrag gewinnt, und Umbenennungen werden nicht verkettet. Die Antwort und die für die Kosten erfasste Nutzung nennen dann das weitergeleitete Modell, nicht den Namen, den der Client gesendet hat. Gelesen auf den Routen anthropic, aws-bedrock und google, auf der Chat-Completions-Route von openrouter sowie auf den SAP-RPT-Predict-Routen (/sap/v1/rpt, aus der sap-rpt-Liste), jeweils für den eigenen Anbieter; auf /openai/v1/chat/completions und /openai/v1/responses wird zuerst die openai-Liste herangezogen, dann die perplexity-Liste.
schema.providers.aws-bedrock.substitute_models.items.from.label=Von
schema.providers.aws-bedrock.substitute_models.items.from.description=Der Modellname, den der Client sendet.
schema.providers.aws-bedrock.substitute_models.items.to.label=Nach
schema.providers.aws-bedrock.substitute_models.items.to.description=Der an SAP AI Core weitergeleitete Modellname, typischerweise eine Deployment-Modell-ID wie anthropic--claude-4.5-sonnet--deployed.
