schema.observability.siem.sinks.items.client_secret_env.description=Name des Zugangsdaten-Slots. Nie ein Zugangsdatenwert - api_config.json wird in drei synchronisierten Kopien in einem öffentlichen Repository versioniert.
schema.observability.siem.sinks.items.project_id.label=Projekt-ID
schema.observability.siem.sinks.items.project_id.description=gcs_pubsub: Google-Cloud-Projekt-ID.
schema.observability.siem.sinks.items.topic_id.label=Topic-ID
schema.observability.siem.sinks.items.topic_id.description=gcs_pubsub: Pub/Sub-Topic-ID.
schema.observability.siem.sinks.items.service_account_json_env.label=Service-Account-JSON
schema.observability.siem.sinks.items.service_account_json_env.description=Name des Zugangsdaten-Slots. Nie ein Zugangsdatenwert - api_config.json wird in drei synchronisierten Kopien in einem öffentlichen Repository versioniert.
schema.observability.siem.sinks.items.bucket.label=Bucket
schema.observability.siem.sinks.items.bucket.description=s3: Ziel-Bucket.
schema.observability.siem.sinks.items.region.label=Region
schema.observability.siem.sinks.items.region.description=s3: AWS-Region.
schema.observability.siem.sinks.items.prefix.label=Präfix
schema.observability.siem.sinks.items.prefix.description=s3: Schlüsselpräfix; Objekte landen unter <prefix>/YYYY/MM/DD/HH/<uuid>.ndjson in UTC.
