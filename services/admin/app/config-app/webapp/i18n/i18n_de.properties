schema.providers.openrouter.default_pricing.label=Standardpreise
schema.providers.openrouter.default_pricing.description=Ersatzpreise für OpenRouter - completion, image und prompt, jeweils als Dezimalzeichenkette. Derzeit vom Gateway ignoriert; beibehalten, damit der ausgelieferte Wert gültig bleibt und für einen später hinzukommenden Verbraucher sichtbar ist. Eine Änderung bewirkt heute nichts.
schema.providers.openrouter.default_pricing.completion.label=Ausgabe (Completion)
schema.providers.openrouter.default_pricing.completion.description=Preis für Completion-Token, als Dezimalzeichenkette geschrieben. Derzeit vom Gateway ignoriert, wie der Rest von default_pricing: Die Modellliste im OpenRouter-Format meldet stattdessen eigene feste Preise.
schema.providers.openrouter.default_pricing.image.label=Bild
schema.providers.openrouter.default_pricing.image.description=Preis für Bildeingaben, als Dezimalzeichenkette geschrieben. Derzeit vom Gateway ignoriert, wie der Rest von default_pricing: Die Modellliste im OpenRouter-Format meldet stattdessen eigene feste Preise.
schema.providers.openrouter.default_pricing.prompt.label=Prompt
schema.providers.openrouter.default_pricing.prompt.description=Preis für Prompt-Token, als Dezimalzeichenkette geschrieben. Derzeit vom Gateway ignoriert, wie der Rest von default_pricing: Die Modellliste im OpenRouter-Format meldet stattdessen eigene feste Preise.
schema.providers.openrouter.model_mappings.label=Modellzuordnungen
schema.providers.openrouter.model_mappings.description=Standards je Upstream-Anbieter für OpenRouter-Anfragen, deren Modell-IDs als 'provider/model' geschrieben werden. Der erste Eintrag, dessen provider ohne Beachtung der Groß-/Kleinschreibung zum Präfix der ID passt, liefert max_tokens, wenn der Client es weglässt. Das ist das einzige verwendete Feld: default_context_length und id_prefix verlangt dieses Schema, das Gateway ignoriert sie derzeit aber.
schema.providers.openrouter.model_mappings.items.default_context_length.label=Standard-Kontextlänge
schema.providers.openrouter.model_mappings.items.default_context_length.description=In jedem Eintrag erforderlich, derzeit aber vom Gateway ignoriert; aus Kompatibilitätsgründen beibehalten.
schema.providers.openrouter.model_mappings.items.id_prefix.label=ID-Präfix
schema.providers.openrouter.model_mappings.items.id_prefix.description=In jedem Eintrag erforderlich, derzeit aber vom Gateway ignoriert; abgeglichen wird über provider, nicht über dieses Feld.
schema.providers.openrouter.model_mappings.items.provider.label=Anbieter
schema.providers.openrouter.model_mappings.items.provider.description=Ohne Beachtung der Groß-/Kleinschreibung mit dem Teil der Modell-ID des Clients vor dem Schrägstrich abgeglichen.
schema.providers.openrouter.model_mappings.items.max_tokens.label=Max. Token
schema.providers.openrouter.model_mappings.items.max_tokens.description=Wird als max_tokens der Anfrage verwendet, wenn der Client keines sendet. Fehlt der Wert, bleibt die Anfrage ohne.
schema.providers.perplexity.label=Perplexity
schema.providers.perplexity.description=Der Anbieter perplexity: die Einstellungen, die jeder Anbieter hat, und nichts darüber hinaus - der Perplexity-Pfad liest keine eigene Einstellung.
schema.providers.perplexity.emulate_streaming_for_models.label=Streaming für Modelle emulieren
schema.providers.perplexity.emulate_streaming_for_models.description=Modelle, deren Antwort das Gateway vollständig sammelt und dann als Stream wiedergibt, weil das Deployment sie nicht selbst streamen kann. Abgeglichen mit dem upstream gesendeten Modellnamen, entweder exakt oder ohne das Präfix 'provider--'. Heute nur für die Anbieter anthropic und openai verwendet; ein Eintrag unter einem anderen Anbieter hat keine Wirkung.
schema.providers.perplexity.substitute_models.label=Ersatzmodelle
schema.providers.perplexity.substitute_models.description=Modellumbenennungen für diesen Anbieter: Eine Anfrage, die 'from' nennt (exakter Abgleich, einschließlich Groß- und Kleinschreibung), wird als 'to' weitergeleitet; der erste passende Eintrag gewinnt, und Umbenennungen werden nicht verkettet. Die Antwort und die für die Kosten erfasste Nutzung nennen dann das weitergeleitete Modell, nicht den Namen, den der Client gesendet hat. Gelesen auf den Routen anthropic, aws-bedrock und google, auf der Chat-Completions-Route von openrouter sowie auf den SAP-RPT-Predict-Routen (/sap/v1/rpt, aus der sap-rpt-Liste), jeweils für den eigenen Anbieter; auf /openai/v1/chat/completions und /openai/v1/responses wird zuerst die openai-Liste herangezogen, dann die perplexity-Liste.
schema.providers.perplexity.substitute_models.items.from.label=Von
schema.providers.perplexity.substitute_models.items.from.description=Der Modellname, den der Client sendet.
schema.providers.perplexity.substitute_models.items.to.label=Nach
schema.providers.perplexity.substitute_models.items.to.description=Der an SAP AI Core weitergeleitete Modellname, typischerweise eine Deployment-Modell-ID wie anthropic--claude-4.5-sonnet--deployed.
schema.providers.perplexity.substitute_models.items.description.label=Beschreibung
schema.providers.perplexity.substitute_models.items.description.description=Freitextnotiz zu dieser Umbenennung, für alle, die die Konfiguration später lesen. Derzeit vom Gateway ignoriert; sie ändert nichts am Verhalten der Umbenennung.
schema.providers.perplexity.unsupported_params.label=Nicht unterstützte Parameter
schema.providers.perplexity.unsupported_params.description=Anfrageparameter, die dieser Anbieter oder dieses Modell nicht akzeptiert. Das Gateway entfernt sie vor der Weiterleitung an SAP AI Core, das die Anfrage sonst mit 400 "does not support parameters: [...]" ablehnen würde. Eine Liste je Modell ersetzt die Liste auf Anbieterebene, statt sie zu ergänzen.
schema.providers.perplexity.param_renames.label=Parameterumbenennungen
schema.providers.perplexity.param_renames.description=Parameterumbenennungen auf dem Direct-Deployment-Pfad, zum Beispiel max_tokens zu max_completion_tokens für OpenAI-Reasoning-Modelle, die max_tokens ablehnen. Eine Zuordnung je Modell ersetzt die Zuordnung auf Anbieterebene, statt sie zu ergänzen.
schema.providers.perplexity.supports_responses_api.label=Unterstützt Responses API
schema.providers.perplexity.supports_responses_api.description=Ob dieser Anbieter oder dieses Modell über /openai/v1/responses bedient werden darf. Fehlt der Wert, gilt die eingebaute Familienregel, die Deployment-Modelle ab GPT-5 und die o-Serie zulässt.
schema.providers.perplexity.supports_prompt_caching.label=Unterstützt Prompt-Caching
schema.providers.perplexity.supports_prompt_caching.description=Ob die Modelle dieses Anbieters Anthropic-Prompt-Cache-Breakpoints erhalten. Auflösungsreihenfolge: das Flag models.overrides.<model>.supports_prompt_caching je Modell, dann dieses Flag auf Anbieterebene, dann ein Standard von true für den Anbieter anthropic und false für jeden anderen. false zu setzen, wo Caching tatsächlich funktioniert, kostet bei jedem Durchgang den vollen ungecachten Eingabepreis, während ein unnötiges true als wirkungslos gemessen wurde - deaktivieren Sie es daher nur für ein Modell, von dem bekannt ist, dass es dies ablehnt.
schema.providers._entry.description=Die Anbietereinstellungen, die der Anfragepfad jedes Anbieters erreichen kann; fünf der sechs benannten Anbieter - alle außer google - haben daher die ganze Form. Jedes Feld ist optional, und ein fehlendes Feld bedeutet das eingebaute Verhalten des Gateways. Gegen diese Form allein wird auch ein Anbieterschlüssel geprüft, den das Gateway nicht liest: Dort wird ein unbekannter Schlüssel weiterhin akzeptiert statt abgelehnt und steht wirkungslos in der Datei. Diese fünf benannten Anbieter fügen darauf ihre eigenen Einstellungen hinzu und akzeptieren nichts anderes; google, der sechste, verweist nur auf das Feld substitute_models dieser Form und akzeptiert nichts darüber hinaus - die Route /google liest noch keine andere Anbietereinstellung.
schema.providers._entry.emulate_streaming_for_models.label=Streaming für Modelle emulieren
schema.providers._entry.emulate_streaming_for_models.description=Modelle, deren Antwort das Gateway vollständig sammelt und dann als Stream wiedergibt, weil das Deployment sie nicht selbst streamen kann. Abgeglichen mit dem upstream gesendeten Modellnamen, entweder exakt oder ohne das Präfix 'provider--'. Heute nur für die Anbieter anthropic und openai verwendet; ein Eintrag unter einem anderen Anbieter hat keine Wirkung.
schema.providers._entry.substitute_models.label=Ersatzmodelle
schema.providers._entry.substitute_models.description=Modellumbenennungen für diesen Anbieter: Eine Anfrage, die 'from' nennt (exakter Abgleich, einschließlich Groß- und Kleinschreibung), wird als 'to' weitergeleitet; der erste passende Eintrag gewinnt, und Umbenennungen werden nicht verkettet. Die Antwort und die für die Kosten erfasste Nutzung nennen dann das weitergeleitete Modell, nicht den Namen, den der Client gesendet hat. Gelesen auf den Routen anthropic, aws-bedrock und google, auf der Chat-Completions-Route von openrouter sowie auf den SAP-RPT-Predict-Routen (/sap/v1/rpt, aus der sap-rpt-Liste), jeweils für den eigenen Anbieter; auf /openai/v1/chat/completions und /openai/v1/responses wird zuerst die openai-Liste herangezogen, dann die perplexity-Liste.
schema.providers._entry.substitute_models.items.from.label=Von
schema.providers._entry.substitute_models.items.from.description=Der Modellname, den der Client sendet.
schema.providers._entry.substitute_models.items.to.label=Nach
schema.providers._entry.substitute_models.items.to.description=Der an SAP AI Core weitergeleitete Modellname, typischerweise eine Deployment-Modell-ID wie anthropic--claude-4.5-sonnet--deployed.
schema.providers._entry.substitute_models.items.description.label=Beschreibung
schema.providers._entry.substitute_models.items.description.description=Freitextnotiz zu dieser Umbenennung, für alle, die die Konfiguration später lesen. Derzeit vom Gateway ignoriert; sie ändert nichts am Verhalten der Umbenennung.
schema.providers._entry.unsupported_params.label=Nicht unterstützte Parameter
schema.providers._entry.unsupported_params.description=Anfrageparameter, die dieser Anbieter oder dieses Modell nicht akzeptiert. Das Gateway entfernt sie vor der Weiterleitung an SAP AI Core, das die Anfrage sonst mit 400 "does not support parameters: [...]" ablehnen würde. Eine Liste je Modell ersetzt die Liste auf Anbieterebene, statt sie zu ergänzen.
schema.providers._entry.param_renames.label=Parameterumbenennungen
schema.providers._entry.param_renames.description=Parameterumbenennungen auf dem Direct-Deployment-Pfad, zum Beispiel max_tokens zu max_completion_tokens für OpenAI-Reasoning-Modelle, die max_tokens ablehnen. Eine Zuordnung je Modell ersetzt die Zuordnung auf Anbieterebene, statt sie zu ergänzen.
schema.providers._entry.supports_responses_api.label=Unterstützt Responses API
schema.providers._entry.supports_responses_api.description=Ob dieser Anbieter oder dieses Modell über /openai/v1/responses bedient werden darf. Fehlt der Wert, gilt die eingebaute Familienregel, die Deployment-Modelle ab GPT-5 und die o-Serie zulässt.
schema.providers._entry.supports_prompt_caching.label=Unterstützt Prompt-Caching
schema.providers._entry.supports_prompt_caching.description=Ob die Modelle dieses Anbieters Anthropic-Prompt-Cache-Breakpoints erhalten. Auflösungsreihenfolge: das Flag models.overrides.<model>.supports_prompt_caching je Modell, dann dieses Flag auf Anbieterebene, dann ein Standard von true für den Anbieter anthropic und false für jeden anderen. false zu setzen, wo Caching tatsächlich funktioniert, kostet bei jedem Durchgang den vollen ungecachten Eingabepreis, während ein unnötiges true als wirkungslos gemessen wurde - deaktivieren Sie es daher nur für ein Modell, von dem bekannt ist, dass es dies ablehnt.
schema.models.label=Modelle
schema.models.overrides.label=Überschreibungen
schema.models.overrides.description=Anpassungen je Modell, eingemischt in die Modellliste, die das Gateway von SAP AI Core abruft. Jeder Schlüssel ist die interne ID eines Modells, genau so geschrieben, wie sie auf dem Wire erscheint.
schema.models.overrides._entry.description=Anpassungen für ein Modell, eingemischt in das, was SAP AI Core dafür meldet, und oben mit der internen ID des Modells als Schlüssel. Das Einmischen ist bewusst offen: Jeder unten nicht aufgeführte Schlüssel wird unverändert auf das Modell kopiert und in der Modellliste neu veröffentlicht, ungeprüft und untypisiert, statt ignoriert zu werden. Die Felder unten sind diejenigen, auf die das Gateway selbst reagiert.
schema.models.overrides._entry.hooks.label=Hooks
schema.models.overrides._entry.hooks.description=Hooks für dieses Modell, mit dem Anfrage-Subpfad als Schlüssel, den sie scharf schalten (invoke, invoke-with-response-stream, converse, ...). Ein hier aufgeführter Subpfad ERSETZT den Endpunkt-Standard in hooks.defaults für diesen Subpfad, statt sich mit ihm zu vereinen; ein nicht aufgeführter Subpfad fällt auf diesen Standard zurück. Ein Hook löst nur aus, wenn jede Regel in seinem request.match zutrifft, und request.callback.id nennt das auszuführende Plug-in.
schema.models.overrides._entry.hooks._entry.description=Die Hook-Liste eines Subpfads, der Reihe nach probiert. Dieselbe Form dient hooks.defaults.<endpoint>.<subpath> und models.overrides.<model>.hooks.<subpath>, sodass das Gateway eine Form sieht, gleich welche der beiden sie geliefert hat. Ein Hook löst nur aus, wenn JEDE Regel, die sein request.match nennt, auf die Anfrage zutrifft; request.callback.id nennt dann das Plug-in, das für die laufende Phase ausgeführt wird. Ein Hook, dessen match nicht zutrifft oder dessen callback kein für diese Phase registriertes Plug-in nennt, wird übersprungen und der nächste probiert - keines von beiden ist zur Laufzeit ein Fehler.
schema.models.overrides._entry.hooks._entry.items.request.label=Anfrage
schema.models.overrides._entry.hooks._entry.items.request.description=Was zutreffen muss und was dann ausgeführt wird. Nach der Anfrage benannt, weil der Matcher nur die eingehende Anfrage prüft; es gibt kein Gegenstück für die Antwort, und sonst wird an einem Hook nichts gelesen.
schema.models.overrides._entry.hooks._entry.items.request.callback.label=Callback
schema.models.overrides._entry.hooks._entry.items.request.callback.description=Das Plug-in, das ausgeführt wird, sobald jede Regel in match zugetroffen hat.
schema.models.overrides._entry.hooks._entry.items.request.callback.id.label=ID
schema.models.overrides._entry.hooks._entry.items.request.callback.id.description=Die ID, unter der sich ein Plug-in registriert hat, nachgeschlagen in der Plug-in-Registry des Gateways für die laufende Phase. Dieses Schema kann den Querverweis nicht prüfen: Eine ID, die kein Plug-in für diese Phase registriert hat, wird als nicht gefunden protokolliert und der Hook übersprungen, sodass die Anfrage unverändert durchgeht, statt fehlzuschlagen.
schema.models.overrides._entry.hooks._entry.items.request.match.label=Abgleich
schema.models.overrides._entry.hooks._entry.items.request.match.description=Die Regel-IDs, die ALLE zutreffen müssen, der Reihe nach ausgewertet und bei der ersten nicht zutreffenden abgebrochen. Jede ID ist ein Schlüssel in hooks.definitions - ein Querverweis, den dieses Schema nicht prüfen kann: Eine dort nirgends definierte ID protokolliert eine Warnung und lässt den ganzen Hook nicht zutreffen, sodass ein Tippfehler das Plug-in stillschweigend deaktiviert, statt es bedingungslos auszulösen. Eine leere Liste wird abgelehnt, denn ein Hook, der bei fast allem laufen soll, wird stattdessen mit einer bewusst breiten Regel geschrieben - das ausgelieferte payload:any trifft auf jede Anfrage zu, deren geparster Body ein nicht leeres String-model enthält; das ist so nah an bedingungslos, wie eine Regel kommt, und sagt es trotzdem offen.
schema.models.overrides._entry.subpaths_native.label=Native Subpfade
schema.models.overrides._entry.subpaths_native.description=Die Subpfade, die dieses Modell nativ bedient, in der Schreibweise des Gateways (invoke, invoke-with-response-stream, converse, converse-stream). Als vollständige Liste gelesen: Solange sie vorhanden ist, gilt jeder darin fehlende Subpfad als emuliert. Fehlt sie, gelten invoke und invoke-with-response-stream. Sie ersetzt den eigenen Wert der Modellliste, wird am Modelleintrag neu veröffentlicht, und ein Eintrag, der auf -stream endet, speist auch die Regel streamingSupported unten.
schema.models.overrides._entry.subpaths_emulated.label=Emulierte Subpfade
schema.models.overrides._entry.subpaths_emulated.description=Die Subpfade, die dieses Modell über die Emulation des Gateways statt nativ erreicht. Nichts wird danach geroutet - ein Subpfad gilt schon dadurch als emuliert, dass er in subpaths_native fehlt -, daher ist die Liste rein deklarativ: Sie ersetzt den eigenen Wert der Modellliste und wird am Modelleintrag für Clients, die ihn prüfen, neu veröffentlicht, und mehr nicht.
schema.models.overrides._entry.streamingSupported.label=Streaming unterstützt
schema.models.overrides._entry.streamingSupported.description=Ob dieses Modell Streaming-Antworten unterstützt; camelCase, weil das die eigene Schreibweise von SAP AI Core in der Modellliste ist. Für ein Modell, das überhaupt einen overrides-Eintrag hat: Ein explizites true oder false hier gewinnt; andernfalls bedeutet ein subpaths_native-Eintrag, der auf -stream endet, true, sofern die Modellliste nicht bereits false gemeldet hat; andernfalls wird ein Deployment-Access-Modell mit Eintrag, aber ohne expliziten Wert auf FALSE gezwungen - wer also einen Eintrag für ein Streaming-Deployment hinzufügt und dieses Flag weglässt, schaltet Streaming aus. Ein Foundation-Modell behält seinen AI-Core-Wert. Das Ergebnis gilt für jede Version des Modells.
schema.models.overrides._entry.supports_prompt_caching.label=Unterstützt Prompt-Caching
schema.models.overrides._entry.supports_prompt_caching.description=Ob dieses Modell Anthropic-Prompt-Cache-Breakpoints erhält. Auflösungsreihenfolge: dieses Flag je Modell, dann das Flag auf Anbieterebene api_config.providers.<provider>.supports_prompt_caching, dann ein Standard von true für Modelle des Anbieters Anthropic und false für alle anderen. Setzen Sie false, um ein Modell auszunehmen; ein true bei einem Anthropic-Modell ohne Überschreibung auf Anbieterebene ändert nichts.
schema.models.overrides._entry.anthropic_version.label=Anthropic-Version
schema.models.overrides._entry.anthropic_version.description=Die anthropic_version, die das Gateway in den Body der Bedrock-invoke-Anfrage dieses Modells einsetzt, wenn der Aufrufer keine geliefert hat. Ein Body, der das Feld bereits enthält, bleibt unverändert, und andere Subpfade als invoke werden nicht berührt. Der ausgelieferte Wert ist bedrock-2023-05-31.
schema.models.overrides._entry.pseudonymization.label=Pseudonymisierung
schema.models.overrides._entry.pseudonymization.description=Einstellungen des Pseudonymisierungs-Plug-ins. Aktivierung (enabled) und die Kategorieschalter (entities) gelten nur für dieses Plug-in; maskiert wird nur, wenn das Plug-in für eine Anfrage tatsächlich läuft - es muss in der Hook-Kette registriert sein, und eine Aktivierungsquelle muss auslösen.
schema.models.overrides._entry.pseudonymization.enabled.label=Aktiviert
schema.models.overrides._entry.pseudonymization.enabled.description=Erzwingt die Maskierung für eine Anfrage. Nur gelesen, wo dieser Block unter models.overrides.<model>.pseudonymization oder hooks.defaults.<endpoint>.pseudonymization steht: true maskiert dort diese Anfrage, wobei der Block je Modell den Block je Endpunkt übertrifft. False oder fehlend erzwingt nichts - die Maskierung kann trotzdem laufen, wenn eine andere Aktivierungsquelle auslöst, etwa ein Triggerwort oder ein Maskierungsfeld im Anfrage-Body. Unter observability.pseudonymization wird dieser Schlüssel derzeit ignoriert; diese Ebene trägt jede andere Einstellung hier bei, außer method und allow_user_bypass. In jedem Fall muss das Plug-in in die Hook-Kette eingebunden sein, sonst wird gar nichts maskiert.
schema.models.overrides._entry.pseudonymization.method.label=Methode
schema.models.overrides._entry.pseudonymization.method.description=Maskierungsmodus: `pseudonymization` maskiert die Anfrage und demaskiert die Antwort; `anonymization` maskiert und demaskiert nie. Nur gelesen, wo dieser Block die Maskierung erzwingt (ein aktivierter Hook oder eine Modellüberschreibung), nicht unter `observability.pseudonymization`. Er steuert auch SIEM: Nur `pseudonymization` behält die maskierte Antwort, sodass eine Content-Sink unter `anonymization` den Prompt erhält, aber nicht die Antwort. Fehlt der Wert, gilt `pseudonymization`. Modi: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.models.overrides._entry.pseudonymization.allow_user_bypass.label=Umgehung durch Benutzer zulassen
schema.models.overrides._entry.pseudonymization.allow_user_bypass.description=Nur innerhalb eines Blocks wirksam, der die Maskierung erzwingt (ein aktivierter Hook oder eine Modellüberschreibung); unter `observability.pseudonymization` nicht gelesen. Standard false. Bei true kann ein Aufrufer die Maskierung über den Header `x-sail-proxy-pseudonymization: off` (ohne Beachtung der Groß-/Kleinschreibung) oder das Body-Feld `pseudonymization_off: true` überspringen: Der Inhalt erreicht das LLM unmaskiert und, wo eine aktivierte SIEM-Sink sowohl `include_content` als auch `allow_unmasked_content` setzt, auch diese Sink. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.models.overrides._entry.pseudonymization.entities.label=Entitäten
schema.models.overrides._entry.pseudonymization.entities.description=Maskierungsschalter je Kategorie: `true` maskiert die Kategorie auf dieser Ebene, `false` nicht, und eine nicht aufgeführte Kategorie erbt die darunterliegende Ebene (spätere Ebenen gewinnen). Schlüssel sind die Menge der bekannten Kategorien: die standardmäßig aktiven Kategorien; drei Opt-in-Kategorien, die deaktiviert ausgeliefert werden (`profile-org`, `profile-location`, `profile-ip-address`); und `profile-sensitive-data`, ein Pauschalschalter, der alle außer diesen dreien aktiviert. Ein Schlüssel außerhalb der Menge wird hier abgelehnt. Kategorien und Ebenen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.models.overrides._entry.pseudonymization.org_suffixes.label=Rechtsform-Suffixe
schema.models.overrides._entry.pseudonymization.org_suffixes.description=Rechtsform-Suffixe, die eine Wortfolge als Organisationsnamen kennzeichnen, z. B. Inc, LLC, GmbH. Der Abgleich beachtet bewusst die Groß-/Kleinschreibung, sodass ein kleingeschriebenes 'limited' im Fließtext absichtlich nicht als Rechtsform gilt; jeder Eintrag trifft zusätzlich vollständig großgeschrieben zu, sodass eine Rechnung, die ACME GMBH schreit, als dieselbe Organisation wie Acme GmbH erkannt wird. Wirksam nur, solange profile-org in entities aktiviert ist; wird profile-org bei leerer Liste aktiviert, wird NICHTS als Organisation maskiert und eine Warnung protokolliert. Jeder Eintrag wird vor dem Abgleich getrimmt, und ein leerer oder nur aus Leerzeichen bestehender Eintrag wird stillschweigend verworfen statt abgelehnt.
schema.models.overrides._entry.pseudonymization.location_gazetteer.label=Ortsverzeichnis
schema.models.overrides._entry.pseudonymization.location_gazetteer.description=Wörtliche Ortsbegriffe, die der strukturelle Detektor maskiert - ohne Beachtung der Groß-/Kleinschreibung und nur als ganzes Wort oder ganze Wendung; aus Großschreibung oder Kontext wird nichts abgeleitet. Wirksam nur, solange profile-location in entities aktiviert ist; wird profile-location bei leerer Liste aktiviert, wird NICHTS als Ort maskiert und eine Warnung protokolliert. Jeder Eintrag wird getrimmt, und ein leerer oder nur aus Leerzeichen bestehender Eintrag wird stillschweigend verworfen. Wird leer ausgeliefert: Ortsnamen sind deploymentspezifisch und dieses Repository ist öffentlich, daher befüllen Sie sie über diese Admin-Konfigurations-App, nie in versioniertem Code.
schema.models.overrides._entry.pseudonymization.min_confidence.label=Min. Konfidenz
schema.models.overrides._entry.pseudonymization.min_confidence.description=Wie viel Evidenz ein erkannter Wert vor der Maskierung braucht, von 0 bis 1 (Standard 0.5). Ein Wert wird maskiert, sobald seine Bewertung die Schwelle erreicht; ein einfacher großgeschriebener Name erzielt etwa 0.5, ein per Prüfsumme validiertes Muster 0.95, eine benutzerdefinierte Regel 1.0. Eine höhere Schwelle lässt zuerst einfache Namen fallen; verschärfen Sie eine störende Kategorie daher besser mit `thresholds`. Benutzerdefinierte Regeln, validierte Kennungen und Zugangsdaten werden durch ihr Umfeld nie herabgestuft. Details zur Bewertung: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.models.overrides._entry.pseudonymization.thresholds.label=Schwellenwerte
schema.models.overrides._entry.pseudonymization.thresholds.description=Konfidenzschwellen je Kategorie, jeweils 0 bis 1, die `min_confidence` für die genannten Kategorien überschreiben; eine nicht aufgeführte behält `min_confidence`. Der Ort, um bei einer einzelnen störenden Kategorie streng zu sein - `profile-person` mit 0.65 verlangt mehr Evidenz für Namen, während validierte Kennungen bei der globalen Schwelle bleiben. Schlüssel sind dieselbe Menge bekannter Kategorien, die `entities` annimmt; `profile-sensitive-data` wird akzeptiert, bewirkt aber nichts. Feinabstimmung je Kategorie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.models.overrides._entry.pseudonymization.allowlist.label=Positivliste
schema.models.overrides._entry.pseudonymization.allowlist.description=Werte, die dieses Deployment nie maskiert - ein AUS-Schalter je Wert. Vor der Konfidenzbewertung herangezogen, sodass ein aufgeführter Wert ausgenommen ist, egal wie viel Evidenz es gibt. Verwenden Sie es für ein wiederkehrendes falsch positives Ergebnis mit eigenem Namen - einen Produkt- oder Berichtstitel, der wie eine Person klingt. Die Listen der Ebenen werden VERKETTET, nicht ersetzt, sodass eine untere Ebene nur eine Ausnahme hinzufügt, nie eine entfernt. `terms` gegenüber `patterns` und die Gefahr zu breiter Einträge: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.allowlist.terms.label=Begriffe
schema.models.overrides._entry.pseudonymization.allowlist.terms.description=Wörtliche Werte, verglichen mit dem gesamten erkannten Wert und UNTER BEACHTUNG DER GROSS-/KLEINSCHREIBUNG. Bewusst so: 'Watson Studio' ist das Produkt, das ein Betreiber ausnehmen wollte, 'watson studio' in einem Satz nicht, und eine Liste ohne Beachtung der Schreibweise würde auch eine Person ausnehmen, deren Nachname zufällig gleich geschrieben wird. Ein Begriff trifft nur auf einen Wert zu, den die Detektoren als Ganzes erzeugt haben - 'Studio' aufzuführen nimmt 'Watson Studio' nicht aus. Jeder Eintrag hier ist ein AUS-Schalter der Maskierung für genau diesen Wert; beschränken Sie die Liste daher auf Werte, die wirklich nie personenbezogene Daten sind: Ein Begriff, der zufällig der Name einer Person ist, nimmt diese Person überall in diesem Deployment von der Maskierung aus, stillschweigend und ohne einen Hinweis im Protokoll.
schema.models.overrides._entry.pseudonymization.allowlist.patterns.label=Muster
schema.models.overrides._entry.pseudonymization.allowlist.patterns.description=Reguläre Ausdrücke (JavaScript), jeweils mit dem GESAMTEN erkannten Wert abgeglichen: Das Gateway umschließt jeden Eintrag selbst mit `^(?: )$`, schreiben Sie also `Z[A-Z0-9_]+`, nicht `^Z[A-Z0-9_]+$`. Der Abgleich beachtet die Groß-/Kleinschreibung. Jeder Eintrag ist ein AUS-Schalter der Maskierung, und ein breiter deaktiviert die Maskierung, ohne zu scheitern - `[A-Z].*` schaltet fast jeden erkannten Personennamen ab. Ein Treffer auf ein eingebautes PII-Beispiel warnt, wird aber TROTZDEM angewendet. Halten Sie jeden Eintrag eng. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.saturation_warn.label=Sättigungswarnung
schema.models.overrides._entry.pseudonymization.saturation_warn.description=Wie viele VERSCHIEDENE maskierte Werte eine Anfrage enthalten darf, bevor sie als gesättigt gemeldet wird (Standard 40). Nur Berichterstattung - es ändert nie, was maskiert wird. Oberhalb der Zahl protokolliert das Gateway je Anfrage eine Warnung mit Zählungen je Kategorie und den häufigsten Wert-FORMEN (Buchstaben als X, Ziffern als 9); nie erscheint ein maskierter Wert. Das Nutzungs-SIEM-Ereignis der Anfrage trägt dieselben Zählungen mit einem Flag `saturated` - Zählungen, kein Text. Den Bericht lesen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.models.overrides._entry.pseudonymization.unknown_placeholders.label=Erfundene Platzhalter
schema.models.overrides._entry.pseudonymization.unknown_placeholders.description=Was geschieht, wenn eine Antwort einen maskierten Platzhalter enthält, der dem Modell nie gesendet wurde. Modelle erfinden einen in etwa 1 von 125 pseudonymisierten Antworten, und umso häufiger, je mehr Werte eine Anfrage maskiert; ein solcher Platzhalter bezeichnet niemanden und kann nie aufgelöst werden. withhold (Standard): Er wird durch eine einfache Markierung wie [name withheld] ersetzt und als Sicherheitsereignis gemeldet. report: Er wird nur gemeldet und erreicht den Client unverändert, für ein Deployment, dessen eigene Entwickler über das Gateway neue Platzhalter in Test-Fixtures schreiben. off: keines von beiden. Ein Platzhalter, den der Client selbst in derselben Anfrage gesendet hat, gilt nie als erfunden.
schema.models.overrides._entry.unsupported_params.label=Nicht unterstützte Parameter
schema.models.overrides._entry.unsupported_params.description=Anfrageparameter, die dieser Anbieter oder dieses Modell nicht akzeptiert. Das Gateway entfernt sie vor der Weiterleitung an SAP AI Core, das die Anfrage sonst mit 400 "does not support parameters: [...]" ablehnen würde. Eine Liste je Modell ersetzt die Liste auf Anbieterebene, statt sie zu ergänzen.
schema.models.overrides._entry.param_renames.label=Parameterumbenennungen
schema.models.overrides._entry.param_renames.description=Parameterumbenennungen auf dem Direct-Deployment-Pfad, zum Beispiel max_tokens zu max_completion_tokens für OpenAI-Reasoning-Modelle, die max_tokens ablehnen. Eine Zuordnung je Modell ersetzt die Zuordnung auf Anbieterebene, statt sie zu ergänzen.
schema.models.overrides._entry.supports_responses_api.label=Unterstützt Responses API
schema.models.overrides._entry.supports_responses_api.description=Ob dieser Anbieter oder dieses Modell über /openai/v1/responses bedient werden darf. Fehlt der Wert, gilt die eingebaute Familienregel, die Deployment-Modelle ab GPT-5 und die o-Serie zulässt.
schema.models.overrides._entry.cachePricing.label=Cache-Preise
schema.models.overrides._entry.cachePricing.description=Prompt-Cache-Preise für dieses Modell; bewusst camelCase, eine Schreibweise cache_pricing wird nicht gelesen. Beide Werte sind dezimale Kosten-STRINGS je 1K Token, nie Zahlen: Sie werden unverändert in die Kostenliste jeder Version übernommen und an alles übergeben, was die Cache-Preise dieses Modells abfragt. Fehlt der Wert, meldet dieses Modell überhaupt keine Cache-Preise.
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.label=Kosten für Cache-Lesen je 1K Eingabetoken
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.description=Kosten für das Lesen von 1K gecachten Eingabetoken, als Dezimalzeichenkette - z. B. 0.00020, nicht 0.0002e0 und keine Zahl.
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.label=Kosten für Cache-Erstellung je 1K Eingabetoken
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.description=Kosten für das Schreiben von 1K Eingabetoken in den Cache, als Dezimalzeichenkette - z. B. 0.00254, keine Zahl.
schema.models.overrides._entry.inject_beta_features.label=Beta-Features einfügen
schema.models.overrides._entry.inject_beta_features.description=Anthropic-Beta-Feature-Flags, die das Gateway den Bedrock-invoke-Anfragen dieses Modells hinzufügt. Sie werden mit dem Header anthropic-beta und einem etwaigen anthropic_beta im Anfrage-Body vereint und dann durch supported_beta_headers, excluded_beta_headers und die Beta-Flag-Quarantäne zur Laufzeit gefiltert - ein hier aufgeführtes Flag wird also trotzdem verworfen, wenn es nicht durchgelassen wird. Eine leere Liste fügt nichts ein.
schema.models.overrides._entry.contextLength.label=Kontextlänge
schema.models.overrides._entry.contextLength.description=Das Kontextfenster dieses Modells in Token, nur als Rückfallwert verwendet: Das Gateway bevorzugt die Kontextlänge der neuesten Version aus SAP AI Core und liest diesen Wert nur, wenn die Modellliste keinen enthält, bevor es auf einen Standard je Modellfamilie zurückfällt. Er wird in den Modelllisten im OpenRouter- und OpenAI-Format als context_length gemeldet und zur Hälfte als max_completion_tokens. 0 ist kein brauchbarer Wert.
schema.capabilities.label=Fähigkeiten
schema.capabilities.web_search.label=Websuche
schema.capabilities.web_search.description=Gehostetes Websuch-Tool (Perplexity-gestützt). Der eine Regler hier begrenzt, wie viele Suchen eine einzelne Anfrage ausführen darf.
schema.capabilities.web_search.max_searches_per_request.label=Max. Suchen je Anfrage
schema.capabilities.web_search.max_searches_per_request.description=Obergrenze gehosteter Websuchen, die eine Anfrage ausführen darf, bevor das Gateway die Fortsetzung des Durchgangs beendet. Jede Suche kostet einen Perplexity-Aufruf plus einen vollständigen Deployment-Roundtrip; dies ist also eine Kostenkontrolle und zugleich die Abbruchgarantie der Fortsetzungsschleife. Ein nicht ganzzahliger, null, negativer oder über 10 liegender Wert fällt auf den Standard 3 zurück, statt berücksichtigt zu werden - die Grenze darf sich nie wegkonfigurieren lassen.
schema.capabilities.file_search.label=Dateisuche
schema.capabilities.file_search.description=OpenAI-kompatibler Dokumentabruf: /v1/files-Aufnahme, /v1/vector_stores, hybride Suche und das gehostete Tool file_search. Nichts hier ist erforderlich - jedes Feld fällt bei Fehlen auf seinen eigenen ausgelieferten Standard zurück, daher ist das Löschen eines Felds eine gültige Änderung und kein Fehler.
schema.capabilities.file_search.enabled.label=Aktiviert
schema.capabilities.file_search.enabled.description=Hauptschalter für die gesamte Funktion, Standard true. Er wird kombiniert mit "eine Datenbank ist konfiguriert" und "die Migration ist gelaufen": false lässt jede Route /v1/files und /v1/vector_stores mit 503 file_search_unavailable antworten. Der Aufnahme-Worker (der auch die Neueinbettung ausführt) und die beiden Sweeper prüfen ihn nur beim Start; starten Sie das Gateway nach einer Änderung daher neu. Bereits gespeicherte Dateien und Stores bleiben unberührt.
schema.capabilities.file_search.embedding_model.label=Embedding-Modell
schema.capabilities.file_search.embedding_model.description=Embedding-Modell, das beim Orchestrierungs-Deployment von SAP AI Core angefordert und bei jedem Ereignis des Lehrermodell-Protokolls erfasst wird. Standard text-embedding-3-large. Jeder Vektorspeicher behält das Modell, mit dem er aufgebaut wurde: Seine Suchen und neuen Dateien verwenden dieses Modell, eine Änderung dieser Einstellung lässt bestehende Vektorspeicher also unberührt. Sie erscheinen im Grounding-Cockpit als veraltet, wo ihr Eigentümer oder ein Administrator sie mit dem neuen Modell neu einbetten kann; bis dahin antworten sie weiter mit ihren alten Vektoren. Ein Modell mit einer anderen Vektorbreite erfordert zusätzlich eine Änderung von embedding_dimensions, und das Neueinbetten kann die Breite eines Vektorspeichers nicht ändern.
schema.capabilities.file_search.embedding_dimensions.label=Embedding-Dimensionen
schema.capabilities.file_search.embedding_dimensions.description=Vektorbreite, gesendet als Parameter dimensions des Embedding-Modells und verwendet zum Anlegen der Vektorspalte. Standard 1536 und fest, sobald ein Store existiert: Ein Antwortvektor anderer Länge wird abgelehnt, und jeder auf die alte Breite festgelegte Store antwortet mit 409 - bei einer SUCHE ebenso wie beim Anhängen, sodass er keine Abfragen mehr beantwortet und nie wieder eine Datei aufnehmen kann. Er bleibt auflistbar, abrufbar und löschbar. Eine Änderung auf einem befüllten Deployment lässt seine Stores daher liegen, statt sie zu migrieren: Das Neueinbetten aus dem Grounding-Cockpit behält die Breite eines Stores bei, ein solcher Store muss daher von einem Betreiber migriert werden.
schema.capabilities.file_search.rewrite_query.label=Abfrage umschreiben
schema.capabilities.file_search.rewrite_query.description=Ob POST /v1/vector_stores/{id}/search die Abfrage des Aufrufers über das Orchestrierungs-Deployment umschreibt, bevor sie eingebettet wird. Standard false. Es kostet etwa 1.3s je Suche und erfolgt nach bestem Bemühen - ein fehlgeschlagenes Umschreiben fällt auf die ursprüngliche Abfrage zurück und lässt die Suche nie scheitern. Nur dieser REST-Pfad liest den Wert, ein rewrite_query je Anfrage überschreibt ihn, und das gehostete TOOL file_search übergibt immer false, weil das Modell den Beitrag des Benutzers bereits in eine Abfrage verwandelt hat.
schema.capabilities.file_search.rewrite_query_model.label=Modell für das Umschreiben der Abfrage
schema.capabilities.file_search.rewrite_query_model.description=Für den Umschreibe-Aufruf verwendetes Modell, Standard gpt-5-mini. Konfigurierbar statt fest, weil ein auf einem SAP-AI-Core-Tenant gültiger Modellname von einem anderen abgelehnt werden kann. Nur herangezogen, wenn rewrite_query aktiv ist.
schema.capabilities.file_search.hybrid.label=Hybrid
schema.capabilities.file_search.hybrid.description=Recall in Stufe 1 und das optionale Reranking in Stufe 2. Stufe 1 führt ein Vektorähnlichkeits-Ranking und - wenn lexical_enabled - ein Volltext-Ranking aus, verschmilzt beide per Reciprocal Rank Fusion und übergibt die besten `candidates` Chunks an den Reranker.
schema.capabilities.file_search.hybrid.rrf_k.label=RRF-k
schema.capabilities.file_search.hybrid.rrf_k.description=Konstante der Reciprocal Rank Fusion: Jedes Ranking trägt 1/(k + rank) zum verschmolzenen Score eines Chunks bei. Standard 60. Ein größeres k ebnet den Abstand zwischen benachbarten Rängen ein, sodass die Übereinstimmung beider Rankings mehr zählt als der jeweils eigene Spitzentreffer; ein kleineres lässt die Spitze jedes Rankings dominieren. Bei jedem Ereignis des Lehrermodell-Protokolls erfasst, daher ist eine Änderung in den Labels sichtbar.
schema.capabilities.file_search.hybrid.lexical_enabled.label=Lexikalisch aktiviert
schema.capabilities.file_search.hybrid.lexical_enabled.description=Ob das Volltext-Ranking neben dem Vektor-Ranking läuft. Standard true. False verschmilzt nur das Vektor-Ranking, sodass exakte Schlüsselwort- und Kennungstreffer, die Embeddings verfehlen, überhaupt nicht mehr gefunden werden.
schema.capabilities.file_search.hybrid.lexical_query.label=Lexikalische Abfrage
schema.capabilities.file_search.hybrid.lexical_query.description=Wie das Volltext-Ranking die Anfrage abgleicht. "any" (Standard) behält die Wörter der Anfrage, die keine gängigen englischen oder deutschen Stoppwörter und nicht nur ein Zeichen lang sind (ein einzelner Buchstabe oder eine einzelne Ziffer), und trifft einen Chunk, der mindestens eines davon enthält, sodass eine als Satz formulierte Frage trotzdem Chunks mit ihren Schlüsselbegriffen findet; Chunks mit mehr dieser Begriffe stehen weiter oben. "all" trifft nur Chunks, die jedes Wort der Anfrage enthalten, Stoppwörter eingeschlossen - das Verhalten früherer Versionen, das eine Frage in natürlicher Sprache selten erfüllt. Gilt nur, solange lexical_enabled true ist.
schema.capabilities.file_search.hybrid.candidates.label=Kandidaten
schema.capabilities.file_search.hybrid.candidates.description=Wie viele verschmolzene Chunks Stufe 1 abruft, Standard 50. Das ist die Eingabegröße des Rerankers und damit seine Kosten je Suche, und zugleich eine harte Obergrenze für die Antwort: max_num_results des Aufrufers wird danach angewendet, sodass keine Suche mehr Chunks als diese liefern kann.
schema.capabilities.file_search.hybrid.rerank.label=Reranking
schema.capabilities.file_search.hybrid.rerank.description=Stufe 2: Ein bei SAP AI Core gehosteter Cohere-Cross-Encoder bewertet die Kandidaten aus Stufe 1 gegen die Abfrage und liefert einen kalibrierten Relevanz-Score zwischen 0 und 1 - den Score, nach dem ranking_options.score_threshold filtert.
schema.capabilities.file_search.hybrid.rerank.enabled.label=Aktiviert
schema.capabilities.file_search.hybrid.rerank.enabled.description=Dreiwertig, und die drei Werte sind keine Abstufungen derselben Sache. false führt nie ein Reranking aus: keine Deployment-Suche, kein Aufruf, und die Ergebnisse behalten ihre verschmolzene Reihenfolge. "auto" (der Standard) erfolgt nach bestem Bemühen - kein laufendes Reranker-Deployment oder ein fehlgeschlagener, abgelaufener oder fehlerhafter Aufruf fällt auf die verschmolzene Reihenfolge zurück, statt die Suche scheitern zu lassen. true VERLANGT Stufe 2: Sowohl "no deployment found" als auch "the call failed" lassen stattdessen die Suche scheitern, sodass ein Betreiber, der ein Reranking verlangt hat, nie stillschweigend Ergebnisse ohne Reranking erhält.
schema.capabilities.file_search.hybrid.rerank.model.label=Modell
schema.capabilities.file_search.hybrid.rerank.model.description=Der Modellname, mit dem das Reranker-Deployment gefunden wird - das erste Deployment im Status RUNNING im Szenario foundation-models, das ein Modell genau dieses Namens bereitstellt - und der beim Rerank-Aufruf gesendet wird. Standard "cohere-reranker" - live gegen den Tenant geprüft, und NICHT das von SAP veröffentlichte "cohere-reranker-35". Dies ist keine Anbieterwahl: Das Gateway spricht genau ein Rerank-Protokoll, und nur der Modellname variiert; deshalb erfasst das Lehrermodell-Protokoll den Anbieter immer als "cohere".
schema.capabilities.file_search.hybrid.rerank.input.label=Eingabe
schema.capabilities.file_search.hybrid.rerank.input.description=Was der Reranker für jeden Kandidaten-Chunk liest. "context_and_text" (der Standard): den Kontext des Chunks, sofern er einen hat, gefolgt von seinem Text; Chunks ohne Kontext (statisches Chunking) werden als ihr Text gelesen. "text": nur den Text des Chunks. Der Kontext erscheint nie in Suchergebnissen.
schema.capabilities.file_search.ann.label=Approximative Suche
schema.capabilities.file_search.ann.description=Approximative Vektorsuche für große Vector Stores über den HNSW-Index. Standardmäßig aus: Das Vektor-Ranking vergleicht die Anfrage dann mit jedem Chunk der durchsuchten Stores, was exakt ist, aber umso länger dauert, je größer die Stores sind. Eingeschaltet nutzt eine Suche den Index nur dort, wo er sich lohnt, und bleibt sonst exakt: mit einem Attributfilter, wenn sie höchstens exact_max_chunks Chunks oder weniger als min_fraction aller gespeicherten Chunks durchsucht, solange der Index noch nicht die Art ist, die der Befehl rebuild-index baut, und mit pgvector älter als 0.8. Approximative Suche kann bei manchen Fragen eine vollständige Liste von Passagen liefern, die die meisten der am besten passenden Chunks verfehlt; messen Sie deshalb ihren Recall mit Ihren eigenen Daten mit dem Recall-Probe, bevor Sie sie einschalten.
schema.capabilities.file_search.ann.enabled.label=Aktiviert
schema.capabilities.file_search.ann.enabled.description=Ob Suchen über große Stores den HNSW-Index nutzen. Standard false: Jede Suche ist exakt. Liefert der Index weniger Chunks als angefordert, läuft die Suche stattdessen exakt.
schema.capabilities.file_search.ann.exact_max_chunks.label=Max. Chunks für exakte Suche
schema.capabilities.file_search.ann.exact_max_chunks.description=Eine Suche über höchstens so viele Chunks bleibt exakt, gezählt über die Stores, die sie mit einem Embedding-Modell durchsucht. Standard 20000. Dieselbe Zahl bestimmt unabhängig davon, ob die approximative Suche eingeschaltet ist, wann der Volltextteil einer Suche begrenzt wird: Eine Suche über mehr Chunks lässt in ihrer Abfrage nach beliebigen Wörtern die Wörter weg, die mehr als 5 Prozent aller gespeicherten Chunks enthalten, und bewertet die Passagen mit allen Wörtern sowie höchstens 5000 weitere Volltexttreffer. Auf einer analysierten Tabelle begrenzt 0 den Volltextteil jeder Suche.
schema.capabilities.file_search.ann.min_fraction.label=Mindestanteil
schema.capabilities.file_search.ann.min_fraction.description=Eine Suche über weniger als diesen Anteil aller gespeicherten Chunks bleibt exakt: Dort ist die exakte Suche schneller als der Index. Standard 0.05 (5 Prozent).
schema.capabilities.file_search.chunking.label=Chunking
schema.capabilities.file_search.chunking.description=Wie die Dokumente eines NEUEN Vektorspeichers in Chunks zerlegt werden. Ein Vektorspeicher übernimmt diese Werte bei seiner Anlage und behält sie: Eine Änderung hier zerlegt keinen bestehenden Vektorspeicher neu und ändert ihn nicht. Die ausgelieferte Konfiguration setzt "structure" mit 800 Token ohne Überlappung, mit Kontexten. Ein nicht gesetzter Schlüssel bedeutet, was dieses Formular für ihn anzeigt: statisches Chunking ohne Kontexte; eine Konfiguration einer früheren Version oder eine ohne diesen Block behält daher statisches Chunking. Vektorspeicher, die vor dieser Einstellung angelegt wurden, verwenden statisches Chunking mit 800/400. Eine Datei, die mit einer expliziten statischen chunking_strategy angehängt wird, wird stattdessen mit dieser Strategie zerlegt; "auto" oder keine Angabe verwendet die Einstellung des Vektorspeichers. Die Werte werden beim Anlegen eines Vektorspeichers geprüft: chunk_overlap_tokens darf die Hälfte von max_chunk_size_tokens nicht überschreiten, und contextual setzt die Strategie "structure" voraus. Ist die Einstellung ungültig, erhalten neue Vektorspeicher stattdessen statisches Chunking mit 800/400, und das Gateway protokolliert eine Warnung.
schema.capabilities.file_search.chunking.strategy.label=Strategie
schema.capabilities.file_search.chunking.strategy.description="static" (der Standard ohne Angabe) zerlegt den Text in überlappende Fenster fester Größe, wie die statische Strategie von OpenAI und frühere Versionen. "structure" (in der ausgelieferten Konfiguration gesetzt) folgt den Abschnitten und Überschriften des Dokuments, sodass ein Chunk nicht über eine Abschnittsgrenze hinausreicht; so zerlegte Dateien melden über die OpenAI-API den Chunking-Strategietyp "other". Um contextual einzuschalten, ist "structure" erforderlich.
schema.capabilities.file_search.chunking.max_chunk_size_tokens.label=Max. Chunk-Größe in Token
schema.capabilities.file_search.chunking.max_chunk_size_tokens.description=Größter Chunk in Token, zwischen 100 und 4096. Standard 800. Bei "static" ist die Größe eine Schätzung (Wortanzahl mal 1.3); bei "structure" wird sie mit einem echten Tokenizer gezählt.
schema.capabilities.file_search.chunking.chunk_overlap_tokens.label=Chunk-Überlappung in Token
schema.capabilities.file_search.chunking.chunk_overlap_tokens.description=Wie viele Token jeder Chunk von seinem Vorgänger wiederholt, damit eine über eine Grenze geteilte Passage trotzdem ganz gefunden wird. Ohne Angabe: 0 bei "structure", 400 bei "static". Darf die Hälfte von max_chunk_size_tokens nicht überschreiten. Bei "structure" gilt die Überlappung nur innerhalb eines Abschnitts, der mehr als einen Chunk braucht.
schema.capabilities.file_search.chunking.contextual.label=Kontextbezogen
schema.capabilities.file_search.chunking.contextual.description=Ob jeder Chunk zusätzlich einen kurzen, von einem Sprachmodell geschriebenen Kontext erhält, der ihn in seinem Dokument einordnet und mit ihm durchsucht wird. Ohne Angabe aus. Setzt die Strategie "structure" voraus; fügt bei der Aufnahme einen Modellaufruf je Chunk hinzu, der als Nutzung des Eigentümers des Vektorspeichers erfasst wird.
schema.capabilities.file_search.contextual.label=Chunk-Kontexte
schema.capabilities.file_search.contextual.description=Wie Chunk-Kontexte für Vektorspeicher geschrieben werden, deren Chunking-Einstellung kontextbezogen ist: Bei der Aufnahme schreibt ein Sprachmodell für jeden Chunk einen kurzen Kontext, der zusammen mit dem Chunk durchsucht wird. Diese Werte schalten kontextbezogenes Chunking nicht ein; das tut die Chunking-Einstellung des Vektorspeichers. Ein fehlgeschlagener oder abgelaufener Aufruf lässt diesen Chunk ohne Kontext und lässt die Datei nie fehlschlagen.
schema.capabilities.file_search.contextual.model.label=Modell
schema.capabilities.file_search.contextual.model.description=Das SAP AI Core-Orchestrierungsmodell, das die Kontexte schreibt. Standard "gemini-3.5-flash-lite". Ist das Modell nicht verfügbar, werden Dateien ohne Kontexte aufgenommen. Das Dokument wird mit jedem Chunk einer Datei gesendet; Claude-Modelle speichern es zwischen diesen Aufrufen im Cache, andere Modelle dort, wo sie das von sich aus tun.
schema.capabilities.file_search.contextual.max_document_tokens.label=Max. Dokumentgröße in Token
schema.capabilities.file_search.contextual.max_document_tokens.description=Größtes Dokument in Token, das vollständig mit jedem Chunk gesendet wird, zwischen 8192 und 200000. Standard 32000. Ein längeres Dokument wird als Ausschnitt dieser Größe um den Chunk herum gesendet. Größere Werte geben jedem Kontext mehr vom Dokument, kosten aber mehr Eingabe-Token je Chunk.
schema.capabilities.file_search.contextual.concurrency.label=Parallelität
schema.capabilities.file_search.contextual.concurrency.description=Wie viele Kontextaufrufe für eine Datei gleichzeitig laufen, zwischen 1 und 16. Standard 4. Der erste Chunk einer Datei läuft immer allein.
schema.capabilities.file_search.contextual.request_timeout_ms.label=Anfrage-Timeout (ms)
schema.capabilities.file_search.contextual.request_timeout_ms.description=Zeitlimit eines Kontextaufrufs in Millisekunden. Standard 30000. Ein Aufruf, der länger dauert, lässt seinen Chunk ohne Kontext.
schema.capabilities.file_search.contextual.file_deadline_ms.label=Frist je Datei (ms)
schema.capabilities.file_search.contextual.file_deadline_ms.description=Zeit in Millisekunden, nach der für eine Datei kein weiterer Kontextaufruf startet. Standard 360000 (6 Minuten). Die übrigen Chunks werden ohne Kontext gespeichert; die Datei wird trotzdem aufgenommen.
schema.capabilities.file_search.contextual.max_input_tokens_per_file.label=Max. Eingabe-Token je Datei
schema.capabilities.file_search.contextual.max_input_tokens_per_file.description=Eingabe-Token, die die Kontextaufrufe einer Datei verbrauchen dürfen, Token aus dem Cache eingeschlossen, zwischen 10000 und 1000000000. Standard 20000000. Hat eine Datei sie verbraucht, startet für sie kein weiterer Kontextaufruf; die übrigen Chunks werden ohne Kontext gespeichert, und die Datei wird trotzdem aufgenommen.
schema.capabilities.file_search.parent_sections.label=Übergeordnete Abschnitte
schema.capabilities.file_search.parent_sections.description=Wie Suchergebnisse aus Vektorspeichern mit Chunking nach Struktur auf den Abschnitt erweitert werden, aus dem sie stammen, damit das Modell einen Treffer in seinem Zusammenhang liest. Mehrere Treffer in einem Abschnitt werden einmal zurückgegeben, als dieser Abschnitt. Ergebnisse aus Vektorspeichern mit statischem Chunking werden unverändert zurückgegeben.
schema.capabilities.file_search.parent_sections.max_tokens.label=Max. Token
schema.capabilities.file_search.parent_sections.max_tokens.description=Größter zurückgegebener übergeordneter Abschnitt in Token, zwischen 200 und 8000. Standard 1500. Ein längerer Abschnitt wird als Ausschnitt dieser Größe um den Treffer zurückgegeben; ein Treffer, der allein schon länger ist, wird allein zurückgegeben.
schema.capabilities.file_search.parent_sections.scope.label=Geltungsbereich
schema.capabilities.file_search.parent_sections.scope.description=Wo Ergebnisse als übergeordnete Abschnitte zurückgegeben werden: "tool" (der Standard) nur im file_search-Tool der Responses-API; "all" auch im Suchendpunkt der Vektorspeicher, der sonst die passenden Chunks zurückgibt; "off" nirgends.
schema.capabilities.file_search.limits.label=Grenzwerte
schema.capabilities.file_search.limits.description=Harte Obergrenzen für das, was hochgeladen, extrahiert und angehängt werden darf. Jede wird dort durchgesetzt, wo sie gilt, nicht durch dieses Schema; diese Werte werden daher live gelesen und wirken ohne Neustart.
schema.capabilities.file_search.limits.max_file_bytes.label=Max. Dateigröße in Byte
schema.capabilities.file_search.limits.max_file_bytes.description=Größter Upload, den POST /v1/files akzeptiert, Standard 33554432 Byte (32 MiB). WÄHREND des Einlesens durchgesetzt, nicht danach, sodass ein zu großer Body abgeschnitten statt in den Speicher gepuffert wird und der Aufrufer ein sauberes 4xx mit der Grenze erhält.
schema.capabilities.file_search.limits.max_tokens_per_file.label=Max. Token je Datei
schema.capabilities.file_search.limits.max_tokens_per_file.description=Größtes extrahiertes Dokument in geschätzten Token; Standard 5000000. Eine Datei über der Grenze scheitert ENDGÜLTIG, statt erneut versucht zu werden. Eine Senkung prüft bereits aufgenommene Dateien nicht erneut.
schema.capabilities.file_search.limits.max_files_per_store.label=Max. Dateien je Vektorspeicher
schema.capabilities.file_search.limits.max_files_per_store.description=Obergrenze der an einen Vektorspeicher angehängten Dateien, Standard 10000. Sie begrenzt die beim Anlegen eines Vektorspeichers akzeptierten file_ids - neben einer harten Grenze von 500 Datei-IDs je Anlege- oder Datei-Batch-Aufruf - und lehnt ein Anhängen oder einen Datei-Batch ab, der den Vektorspeicher darüber hinaus brächte.
schema.capabilities.file_search.ingestion.label=Aufnahme
schema.capabilities.file_search.ingestion.description=Der Hintergrund-Worker, der eine angehängte Datei extrahiert, in Chunks zerlegt, einbettet und speichert, und die Dateien eines Stores neu einbettet, dessen Embedding-Modell gerade geändert wird - Uploads zuerst. Er holt sich Arbeit aus demselben file_search-Datenbankpool, den der Suchpfad verwendet; diese Regler wägen daher Aufnahmedurchsatz gegen Suchlatenz ab.
schema.capabilities.file_search.ingestion.concurrency.label=Parallelität
schema.capabilities.file_search.ingestion.concurrency.description=Wie viele Übernahme-und-Verarbeitungs-Schleifen der Worker startet, Standard 4; dieselben Schleifen führen auch die Neueinbettung aus. Jede bezieht für ihre Datenbankschritte Verbindungen aus dem file_search-Pool mit 10 Verbindungen. Einmal beim Start gelesen, daher braucht eine Änderung einen Neustart.
schema.capabilities.file_search.ingestion.extract_timeout_ms.label=Extraktions-Timeout (ms)
schema.capabilities.file_search.ingestion.extract_timeout_ms.description=Zeitlimit für die Umwandlung eines Dokuments in Text mit einem externen Konverter - PDF, docx, odt, epub und rst -, Standard 60000 ms. Reine Textformate werden direkt dekodiert und haben kein Limit. Ein Timeout lässt diesen Versuch scheitern, nicht den Batch; die Datei wird bis zu max_retries erneut versucht.
schema.capabilities.file_search.ingestion.max_retries.label=Max. Wiederholungen
schema.capabilities.file_search.ingestion.max_retries.description=Versuche je Datei, bevor sie als gescheitert gilt, Standard 3; dasselbe Budget gilt für jede Datei einer Neueinbettung. Eine ganze Zahl ab 1 wird wie angegeben verwendet. 0 wird mit einer Warnung als 1 gelesen - wörtlich genommen würde jede angehängte Datei vor ihrem ersten Versuch scheitern. Alles andere - negativ, gebrochen, nicht numerisch - gilt als nicht gesetzt und fällt auf 3 zurück, ebenfalls mit einer Warnung.
schema.capabilities.file_search.parsing.label=Dokumentverarbeitung
schema.capabilities.file_search.parsing.description=Wie hochgeladene Dokumente gelesen werden, bevor sie in Chunks zerlegt werden.
schema.capabilities.file_search.parsing.ocr.label=Texterkennung (OCR)
schema.capabilities.file_search.parsing.ocr.description=Texterkennung für PDF-Seiten ohne Textebene, etwa Scans. Sie läuft dort, wo das Programm tesseract installiert ist (die Docker- und Kyma-Images enthalten es mit Englisch); die eigenständige npm-CLI führt sie nie aus.
schema.capabilities.file_search.parsing.ocr.languages.label=OCR-Sprachen
schema.capabilities.file_search.parsing.ocr.languages.description=Tesseract-Sprachcodes, die auf einer Seite erkannt werden, etwa eng, deu oder chi_sim; Standard eng. Für einen Code müssen seine Sprachdaten dort installiert sein, wo das Gateway läuft; ein nicht installierter Code wird mit einer Warnung im Gateway-Log übersprungen. Jede zusätzliche Sprache macht die OCR langsamer.
schema.capabilities.file_search.parsing.vision.label=Vision-Transkription
schema.capabilities.file_search.parsing.vision.description=Transkription schwieriger PDF-Seiten durch ein Vision-Modell von SAP AI Core: Eine Seite wird als Bild gesendet, und das Modell schreibt ihren Text aus, Tabellen eingeschlossen. Sie läuft nur für Vektorspeicher, deren Chunking-Einstellung einen Vision-Modus hat (standardmäßig aus; eine Änderung des Modus eines Vektorspeichers chunkt ihn neu). Jede Seite ist ein Modellaufruf, erfasst als Nutzung des Eigentümers des Vektorspeichers; eine Seite, deren Aufruf fehlschlägt, behält ihren Text oder geht an die Texterkennung (OCR). Seitenbilder werden nicht maskiert: Wo die Pseudonymisierung für file_search-Inhalte erzwungen ist (für den Endpunkt openai oder für ein Modell), erreichen sie das Modell unmaskiert, und das Cockpit und das Gateway-Protokoll warnen davor. Eine Maskierung, die eine einzelne Anfrage verlangt (ein Triggerwort oder ein Maskierungsfeld), ist nicht vorhersehbar und wird nicht gemeldet. Die eigenständige npm-CLI führt sie nie aus.
schema.capabilities.file_search.parsing.vision.model.label=Modell
schema.capabilities.file_search.parsing.vision.model.description=Das SAP AI Core-Orchestrierungsmodell, das die Seiten transkribiert; es muss Bilder lesen können. Standard "gemini-3.5-flash-lite". Ist das Modell nicht verfügbar, kann kein Vektorspeicher auf einen Vision-Modus umgestellt werden.
schema.capabilities.file_search.parsing.vision.default_mode.label=Standardmodus
schema.capabilities.file_search.parsing.vision.default_mode.description=Der Vision-Modus, den neue Vektorspeicher erhalten: off (Standard, keine Vision-Aufrufe), no_text (Seiten ohne Textebene, etwa Scans), auto (diese, Seiten mit wenig Text wie Abbildungen und tabellenlastige Seiten) oder all (jede Seite). Bestehende Vektorspeicher behalten ihren eigenen Modus. Wo die Pseudonymisierung für file_search-Inhalte erzwungen ist, erreichen die Seitenbilder das Modell unmaskiert (eine Warnung wird angezeigt); dasselbe gilt ohne Warnung für eine Maskierung, die eine einzelne Anfrage verlangt.
schema.capabilities.file_search.parsing.vision.max_pages_per_file.label=Max. Seiten je Datei
schema.capabilities.file_search.parsing.vision.max_pages_per_file.description=Höchstzahl der Seiten einer Datei, die an das Modell gesendet werden, zwischen 1 und 1000. Standard 50. Die übrigen Seiten behalten ihren Text oder gehen an die Texterkennung (OCR).
schema.capabilities.file_search.parsing.vision.concurrency.label=Parallelität
schema.capabilities.file_search.parsing.vision.concurrency.description=Wie viele Seiten einer Datei gleichzeitig transkribiert werden, zwischen 1 und 8. Standard 2.
schema.capabilities.file_search.parsing.vision.request_timeout_ms.label=Anfrage-Timeout (ms)
schema.capabilities.file_search.parsing.vision.request_timeout_ms.description=Zeitlimit des Aufrufs einer Seite, in Millisekunden. Standard 90000. Eine Seite, deren Aufruf länger dauert, behält ihren Text oder geht an die Texterkennung (OCR).
schema.capabilities.file_search.parsing.vision.file_deadline_ms.label=Frist je Datei (ms)
schema.capabilities.file_search.parsing.vision.file_deadline_ms.description=Längste Zeit in Millisekunden, die Vision für eine Datei aufwenden darf, und höchstens 40 % der verbleibenden Zeit für die Aufnahme der Datei. Standard 240000 (4 Minuten). Danach startet keine weitere Seite; die Datei wird trotzdem aufgenommen.
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.label=Max. Eingabe-Token je Datei
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.description=Eingabe-Token, die die Aufrufe einer Datei verbrauchen dürfen, zwischen 10000 und 100000000. Standard 150000 (eine Seite braucht etwa 1250). Hat eine Datei sie verbraucht, startet für sie keine weitere Seite.
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.label=Max. Ausgabe-Token je Datei
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.description=Ausgabe-Token, die die Aufrufe einer Datei verbrauchen dürfen, zwischen 10000 und 100000000. Standard 120000. Hat eine Datei sie verbraucht, startet für sie keine weitere Seite.
schema.capabilities.file_search.blob_storage.label=Blob-Speicher
schema.capabilities.file_search.blob_storage.description=Wo die rohen hochgeladenen Bytes liegen. Inhalte werden über ihren sha256-Hash adressiert und referenzgezählt, sodass zwei Uploads identischen Inhalts eine Kopie speichern. Die Einstellung wird bei jedem Zugriff neu gelesen, daher wirkt eine Änderung ohne Neustart.
schema.capabilities.file_search.blob_storage.backend.label=Backend
schema.capabilities.file_search.blob_storage.backend.description=Wohin NEUE Uploads gespeichert werden. "db", der Standard, hält die Bytes in der file_search-Postgres-Datenbank. "s3" schreibt sie als Objekte in den unten konfigurierten Bucket (AWS oder ein S3-kompatibler Endpunkt) und behält in der Datenbank nur ihren Schlüssel. Ein Wechsel verschiebt nichts: Jeder Blob wird aus dem Speicher gelesen, in den er geschrieben wurde, daher bleiben vorhandene Blobs lesbar, solange dieser Speicher erreichbar ist, und eine Migration im Panel Blob-Speicher der Grounding-Administration verschiebt sie. "local" wird nicht unterstützt: Jeder Upload antwortet dann mit 503 file_search_unavailable.
schema.capabilities.file_search.blob_storage.local_path.label=Lokaler Pfad
schema.capabilities.file_search.blob_storage.local_path.description=Dateisystem-Stammverzeichnis, reserviert für ein Backend "local", Standard /var/lib/sail-proxy/blobs. Das Gateway unterstützt "local" nicht (siehe backend), daher wird dieser Wert nicht gelesen.
schema.capabilities.file_search.blob_storage.s3.label=S3
schema.capabilities.file_search.blob_storage.s3.description=Bucket-Koordinaten für das Backend "s3". Zugangsdaten werden hier nicht konfiguriert: Sie stammen aus den Umgebungsvariablen FILE_SEARCH_S3_ACCESS_KEY_ID und FILE_SEARCH_S3_SECRET_ACCESS_KEY des Gateways. Gelesen bei jedem Zugriff auf einen in S3 gespeicherten Blob - auch wenn backend "db" ist und noch Blobs in S3 liegen - und von einer Migration nach oder aus S3. Eine Änderung von Bucket, Endpunkt oder Präfix verschiebt keine Objekte: Unter den vorherigen Werten geschriebene Blobs sind nicht lesbar, bis diese Werte wiederhergestellt sind.
schema.capabilities.file_search.blob_storage.s3.bucket.label=Bucket
schema.capabilities.file_search.blob_storage.s3.bucket.description=Bucket-Name. Er bildet den Host <bucket>.s3.<region>.amazonaws.com oder den Pfad /<bucket>/<key>, wenn endpoint gesetzt ist. Wird leer ausgeliefert: Bis er gesetzt ist, antwortet ein Upload mit backend "s3" mit 503, und eine Migration nach S3 wird abgelehnt.
schema.capabilities.file_search.blob_storage.s3.prefix.label=Präfix
schema.capabilities.file_search.blob_storage.s3.prefix.description=Schlüsselpräfix, unter dem jeder Blob gespeichert wird, Standard sail-proxy/blobs, sodass ein Bucket Blobs neben fremden Objekten enthalten kann. Pfadsegmente aus Buchstaben, Ziffern, ".", "_" und "-", getrennt durch "/". Das Gateway liest, schreibt und löscht nur Schlüssel unter diesem Präfix und listet den Bucket nie auf. Jede file_search-Datenbank braucht ein eigenes Präfix (oder einen eigenen Bucket): Die Schlüssel werden aus dem Dateiinhalt abgeleitet, daher teilen sich zwei Installationen mit demselben Präfix Objekte, und eine löscht Objekte, die die andere noch verwendet.
schema.capabilities.file_search.blob_storage.s3.endpoint.label=Endpunkt
schema.capabilities.file_search.blob_storage.s3.endpoint.description=S3-Endpunkt außerhalb von AWS - MinIO, Ceph oder ein anderes S3-kompatibles Gateway. Wenn gesetzt, gehen Anfragen an <endpoint>/<bucket>/<key> statt an die AWS-Host-Form. Leer, der Standard, bedeutet AWS.
schema.capabilities.file_search.blob_storage.s3.region.label=Region
schema.capabilities.file_search.blob_storage.s3.region.description=SigV4-Signaturregion und Teil des Hostnamens, wenn kein endpoint gesetzt ist. Wird leer ausgeliefert und ist auch für das Signieren gegenüber einem S3-kompatiblen Endpunkt erforderlich.
schema.capabilities.file_search.teacher_logging.label=Protokollierung für Lehrermodell
schema.capabilities.file_search.teacher_logging.description=Erfasst die Kandidaten jeder Suche und die Scores des Rerankers als Teacher-Labels, für die Auswertung und Destillation des Rerankers. Konstruktionsbedingt Fire-and-forget: Nichts wartet auf das Schreiben, und jeder Fehler zeigt sich nur als Warnung. Alle fünf Felder werden live auf dem Suchpfad gelesen und können daher in diesem Cockpit ohne Neustart geändert werden.
schema.capabilities.file_search.teacher_logging.enabled.label=Aktiviert
schema.capabilities.file_search.teacher_logging.enabled.description=Ob Suchereignisse überhaupt geschrieben werden. Standardmäßig aus, sodass eine Installation, die älter als dieser Schlüssel ist, nie anfängt, Zeilen zu schreiben. Bewusst unabhängig von store_chunk_text: Das Einschalten des Loggings darf nie von selbst beginnen, Dokumentinhalte zu speichern.
schema.capabilities.file_search.teacher_logging.store_chunk_text.label=Chunk-Text speichern
schema.capabilities.file_search.teacher_logging.store_chunk_text.description=Ob der Chunk-TEXT jedes Kandidaten neben seinem Hash gespeichert wird; standardmäßig aus, und der Text bleibt sonst leer. Dieser Text ist Dokumentinhalt von Benutzern, daher macht dies die Label-Tabellen zu einer zweiten Kopie des Korpus - der Hash allein genügt, um Labels wieder mit noch vorhandenen Chunks zu verknüpfen.
schema.capabilities.file_search.teacher_logging.sample_rate.label=Abtastrate
schema.capabilities.file_search.teacher_logging.sample_rate.description=Wahrscheinlichkeit, dass eine Suche protokolliert wird, von 0 bis 1; Standard 1.0. 1 protokolliert jede Suche, 0 keine, 0.1 etwa jede zehnte. Dies ist der Regler, den Sie senken, wenn das Label-Volumen ein Problem ist - nicht max_concurrent_writes, das Schreibvorgänge verwirft, statt sie auszudünnen.
schema.capabilities.file_search.teacher_logging.source.label=Quelle
schema.capabilities.file_search.teacher_logging.source.description=Freitext-Label, das in jedes Suchereignis geschrieben wird, sofern der Aufrufer keines übergibt. Standard "production", damit sich ein Evaluierungs- oder Backfill-Lauf beim späteren Lesen der Labels vom Produktionsverkehr unterscheiden lässt.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.label=Max. gleichzeitige Schreibvorgänge
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.description=Obergrenze gleichzeitig laufender Teacher-Label-Schreibvorgänge, Standard 2; überzählige Schreibvorgänge werden verworfen, nicht eingereiht. Begrenzt auf die Größe des file_search-Datenbankpools von 10: Darüber begrenzt die Obergrenze nichts mehr, weil die zusätzlichen Schreibvorgänge einfach in der eigenen Warteschlange des Pools warten - aus "verworfen, nicht eingereiht" würde "eingereiht", genau der Fehler, den die Grenze verhindern soll. Ein größerer Wert wird mit einer Warnung gekappt, sodass auch eine von Hand bearbeitete api_config.json ihn nicht anheben kann.
schema.capabilities.file_search.tool.label=Tool
schema.capabilities.file_search.tool.description=Der Block für das gehostete TOOL file_search - das Tool, das das Modell selbst aufruft - im Gegensatz zum rohen REST-Pfad POST /v1/vector_stores/{id}/search, den die Einstellungen oben steuern. Jedes Feld wird beim Lesen geprüft und fällt auf seinen Standard zurück, statt umgewandelt zu werden, weil eine von Hand bearbeitete api_config.json das Gateway ungeprüft erreicht.
schema.capabilities.file_search.tool.enabled.label=Aktiviert
schema.capabilities.file_search.tool.enabled.description=Als strikter boolescher Wert gelesen, Standard true - ein von Hand eingetragenes "true" oder 1 gilt nicht als true und fällt auf den Standard zurück. Derzeit vom Gateway ignoriert: Nichts hängt vom aufgelösten Wert ab, und das Tool wird in jedem Fall angeboten; false zu setzen blendet das Tool also nicht aus. Verwenden Sie file_search.enabled, um die Funktion abzuschalten.
schema.capabilities.file_search.tool.max_searches_per_request.label=Max. Suchen je Anfrage
schema.capabilities.file_search.tool.max_searches_per_request.description=Wie viele file_search-Aufrufe eine Anfrage machen darf, bevor das Gateway die Fortsetzung des Durchgangs beendet. Eine ganze Zahl von 1 bis 10 wird berücksichtigt; alles andere - außerhalb des Bereichs, gebrochen, nicht numerisch - gilt als nicht gesetzt und fällt mit einer Warnung auf 3 zurück; ein Wert außerhalb des Bereichs ist hier also stillschweigend nicht der Wert, der tatsächlich gilt.
schema.capabilities.file_search.tool.max_num_results_default.label=Standard für max. Ergebnisanzahl
schema.capabilities.file_search.tool.max_num_results_default.description=Zurückgegebene Chunks, wenn ein Tool-Aufruf kein eigenes max_num_results nennt. Eine ganze Zahl von 1 bis 50 wird berücksichtigt, alles andere fällt auf 10 zurück. Dieser Bereich ist dieselbe Grenze, gegen die ein max_num_results je Aufruf geprüft wird, und OpenAIs eigene Grenze für das Feld. hybrid.candidates bleibt die harte Obergrenze dessen, was eine Suche liefern kann.
schema.capabilities.hosted_tools.label=Gehostete Tools
schema.capabilities.hosted_tools.description=Grenzen für den Replay-Cache der Ergebnisse gehosteter Tools: wie lange ein Ergebnis wiederabspielbar bleibt und wie viele gleichzeitig gehalten werden.
schema.capabilities.hosted_tools.result_cache_ttl_seconds.label=TTL des Ergebnis-Caches in Sekunden
schema.capabilities.hosted_tools.result_cache_ttl_seconds.description=Optional. Wie lange die Ergebnisse eines gehosteten Tools für einen Client, der das Aufrufelement erneut sendet, wiederabspielbar bleiben. Ein nicht ganzzahliger Wert oder ein Wert außerhalb des Bereichs fällt auf den Standard von 3600 Sekunden zurück, wie wenn dies nicht gesetzt ist. Ein Cache-Fehltreffer führt die erfasste Abfrage erneut aus, statt die Antwort zu verschlechtern.
schema.capabilities.hosted_tools.result_cache_max_entries.label=Max. Einträge im Ergebnis-Cache
schema.capabilities.hosted_tools.result_cache_max_entries.description=Optional. Wie viele Ergebnisse gehosteter Tools gleichzeitig im Replay-Cache gehalten werden. Ein nicht ganzzahliger Wert oder ein Wert außerhalb des Bereichs fällt auf den Standard von 500 Einträgen zurück, wie wenn dies nicht gesetzt ist. Ein Cache-Fehltreffer führt die erfasste Abfrage erneut aus, statt die Antwort zu verschlechtern.
schema.capabilities.namespace_tools.label=Namespace-Tools
schema.capabilities.namespace_tools.description=Wie mit dem Sub-Agent-Wrapper-Tool `namespace` von Codex umgegangen wird, das SAP AI Core rundweg mit 400 ablehnt.
schema.capabilities.namespace_tools.mode.label=Modus
schema.capabilities.namespace_tools.mode.description=`flatten` (Standard) hebt die verschachtelten Funktions-Tools eines namespace-Tools auf die oberste Ebene, damit die Anfrage akzeptiert wird, und stellt den namespace bei wiederholten Aufrufen wieder her, damit Codex sie weiterhin routen kann. `strip` entfernt das namespace-Tool und seine verschachtelten Tools vollständig. Jeder andere Wert als diese beiden fällt auf flatten zurück - die Alternative ist ein hartes 400, das den Durchgang beendet.
schema.capabilities.custom_tools.label=Benutzerdefinierte Tools
schema.capabilities.custom_tools.description=Freiform-Tools `custom` von Codex (apply_patch). `translate` schreibt sie in Funktions-Tools um, die sowohl die Deployment- als auch die Orchestrierungsrouten akzeptieren; `strip` entfernt sie, sodass das Modell Dateien über Shell-Befehle bearbeiten muss.
schema.capabilities.custom_tools.mode.label=Modus
schema.capabilities.custom_tools.mode.description=`translate` (Standard) schreibt das Freiform-Tool custom in ein gewöhnliches Funktions-Tool um, das beide Routen akzeptieren, und hängt Grammatik-/Formathinweise an seine Beschreibung an, da ein Funktions-Tool eine Lark-Grammatik nicht so ausdrücken kann wie ein custom-Tool. `strip` entfernt custom-Tools vollständig, sodass das Modell Dateien stattdessen über Shell-Befehle bearbeiten muss. Jeder andere Wert als diese beiden fällt auf translate zurück - die Alternative ist ein hartes 400, das den Durchgang beendet.
schema.capabilities.tool_search.label=Tool-Suche
schema.capabilities.tool_search.description=Das Tool `tool_search` von Codex zum Auffinden zurückgestellter Tools. `translate` schreibt es in ein Funktions-Tool um, das sowohl die Deployment- als auch die Orchestrierungsrouten akzeptieren; `strip` entfernt es, sodass das Modell zurückgestellte Tools wie MCP-Server nicht finden kann.
schema.capabilities.tool_search.mode.label=Modus
schema.capabilities.tool_search.mode.description=`translate` (Standard) schreibt das Tool tool_search in ein gewöhnliches Funktions-Tool um, das beide Routen akzeptieren. `strip` entfernt es vollständig. Jeder andere Wert als diese beiden fällt auf translate zurück - die Alternative ist ein hartes 400, das den Durchgang beendet.
schema.capabilities.tool_search.hoist_discovered_tools.label=Gefundene Tools anheben
schema.capabilities.tool_search.hoist_discovered_tools.description=Hebt von tool_search gefundene Tools in die Anfrage, damit das Modell sie aufrufen kann. Umgeht, dass codex zurückgestellte MCP-Tools nur anbietet, wenn die base_url des Anbieters api.openai.com ist; setzen Sie false, sobald das upstream behoben ist. Kann in jedem Fall bedenkenlos aktiviert bleiben - Namen, die der Client bereits deklariert, werden übersprungen.
schema.hooks.label=Hooks
schema.hooks.definitions.label=Definitionen
schema.hooks.definitions.description=Die benannten Match-Regeln, die request.match eines Hooks nennen kann, mit der Regel-ID als Schlüssel - der Schlüssel IST die ID. Jede Regel, die ein Hook aufführt, muss zutreffen, damit der Hook auslöst, und eine hier nirgends definierte Regel-ID protokolliert eine Warnung und lässt den Hook auf nichts zutreffen. Regeln werden bei der ersten Verwendung je ID gecacht, daher wirkt eine Änderung beim nächsten Neuladen der Konfiguration, nicht mitten im Prozess.
schema.hooks.definitions._entry.type.label=Typ
schema.hooks.definitions._entry.type.description=Welchen Teil der Anfrage die Regel prüft und damit, welche der Felder unten gelten. Tragend statt beschreibend: Nur diese vier Werte werden verstanden, und alles andere wird als unbekannter Hook-Typ protokolliert und trifft auf NICHTS zu - womit jeder Hook, der die Regel nennt, stillschweigend deaktiviert wird.
schema.hooks.definitions._entry.name.label=Name
schema.hooks.definitions._entry.name.description=Der Anfrage-Header, den eine 'header'-Regel liest. Ohne Beachtung der Groß-/Kleinschreibung: Der Name wird vor dem Nachschlagen kleingeschrieben, entsprechend der Normalisierung von Header-Namen in der Anfrage-Pipeline. Eine Anfrage ohne den Header trifft nie zu. Leer bedeutet nicht 'beliebiger Header' - eine solche Regel könnte nie auslösen -, daher wird es hier abgelehnt statt akzeptiert.
schema.hooks.definitions._entry.path.label=Pfad
schema.hooks.definitions._entry.path.description=Pfad in Punktnotation in den geparsten JSON-Anfrage-Body für eine Regel 'json-path' oder 'json-path-regex'. Ein führendes '$.' wird entfernt, sodass '$.max_tokens' und 'max_tokens' denselben Wert adressieren; weitere JSONPath-Unterstützung gibt es nicht - keine Platzhalter, Filter oder Klammersyntax, und ein Segment, das einen Punkt enthält, kann nicht adressiert werden. 'json-path' folgt jedem Segment wörtlich, sodass ein numerisches Segment ein Array indiziert. 'json-path-regex' lässt zusätzlich ein nicht numerisches Segment das erste Array-Element nehmen, das es enthält. Eine Anfrage ohne geparsten Body oder ein Pfad, der zu nichts aufgelöst wird, trifft nicht zu.
schema.hooks.definitions._entry.equals.label=Ist gleich
schema.hooks.definitions._entry.equals.description=Der Wert, dem das adressierte Element entsprechen muss - je nach Typ UNTERSCHIEDLICH verglichen. Bei einer `header`-Regel ist es KEINE strikte Gleichheit: Medientypen werden verglichen (der Teil vor dem ersten `;`, kleingeschrieben), sodass `application/json` auch `application/json; charset=utf-8` entspricht. Das gibt es, weil der strikte Vergleich, den es ersetzt hat, Clients, die einen charset anhängen, die Pseudonymisierung umgehen ließ. Ein equals-Wert, der selbst ein `;` enthält, wird exakt verglichen, sodass eine Regel weiterhin einen charset festlegen kann. Bei einer `json-path`-Regel IST es strikte Gleichheit. Matcher-Semantik: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.from.label=Von
schema.hooks.definitions._entry.from.description=Inklusive Untergrenze für eine 'header'-Regel, die einen numerischen Header abgleicht - content-length in jeder ausgelieferten Regel. Der Header-Wert wird als ganze Zahl zur Basis 10 gelesen und muss in [from, to] liegen; ein nicht parsbarer Wert trifft nie zu. Nur gelesen, wenn equals fehlt UND beide Grenzen vorhanden sind: Eine einzelne Grenze wird ignoriert, und die Regel wird zu einer bloßen Anwesenheitsprüfung des Headers.
schema.hooks.definitions._entry.to.label=Nach
schema.hooks.definitions._entry.to.description=Inklusive Obergrenze für eine 'header'-Regel, die einen numerischen Header abgleicht. Es gibt keine offene Form: Um 'mindestens 10 KB' auszudrücken, kombinieren die ausgelieferten Regeln from mit einem bewusst riesigen to (size:min10kb verwendet 999999999), weil das Weglassen einer der Grenzen die Regel in eine Anwesenheitsprüfung verwandelt. Siehe from.
schema.hooks.definitions._entry.regex.label=Regex
schema.hooks.definitions._entry.regex.description=Ein Quelltext eines regulären JavaScript-Ausdrucks. Eine `json-path-regex`-Regel prüft ihn gegen das, wozu der Pfad aufgelöst wurde (eine Zeichenkette direkt, ein Array Element für Element, jedes andere Objekt gegen seine JSON-Form). Eine `url-regex`-Regel prüft ihn gegen den Anfragepfad und die Query-Zeichenkette, die das Gateway sieht, NICHT gegen eine absolute URL, daher kann `^https?://` nie zutreffen. Einmal kompiliert und je Regel gecacht; ein Ausdruck, den die Engine ablehnt, gilt als kein Treffer. Matcher-Semantik: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.flags.label=Flags
schema.hooks.definitions._entry.flags.description=Flags für reguläre Ausdrücke, die auf regex angewendet werden, z. B. 'i' für ohne Beachtung der Groß-/Kleinschreibung. Auf die Buchstaben beschränkt, die die Engine tatsächlich akzeptiert, denn jeder andere Wert lässt die Kompilierung scheitern, und dieses Scheitern wird als kein Treffer gemeldet - die Regel würde dann stillschweigend nie auslösen. Flags sind Teil des Cache-Schlüssels kompilierter Ausdrücke, sodass zwei Regeln, die sich nur in den Flags unterscheiden, keinen kompilierten Ausdruck teilen. Vermeiden Sie 'g': Ein kompilierter globaler Ausdruck wird anfrageübergreifend wiederverwendet und rückt seine eigene Position vor, sodass eine solche Regel nur jedes zweite Mal zutrifft.
schema.hooks.definitions._entry.desc.label=Beschr.
schema.hooks.definitions._entry.desc.description=Freitextnotiz dazu, wofür diese Regel gedacht ist. Derzeit vom Gateway ignoriert; sie dokumentiert die Regel für alle, die diese Datei bearbeiten, und hat keine Wirkung auf den Abgleich.
schema.hooks.defaults.label=Standards
schema.hooks.defaults.description=Standard-Hooks je Endpunkt, mit der Endpunktkennung der Route als Schlüssel - heute 'anthropic', 'openai' und 'aws-bedrock' sowie 'google' (Subpfade generateContent, streamGenerateContent, embedContent). Nur herangezogen, wenn das angefragte Modell für den Subpfad keinen Eintrag models.overrides.<model>.hooks hat: Ein Eintrag je Modell ERSETZT den Endpunkt-Standard für diesen Subpfad, statt sich mit ihm zu vereinen.
schema.hooks.defaults._entry.description=Die Standards eines Endpunkts: der optionale Block zur erzwungenen Aktivierung der Pseudonymisierung plus eine Hook-Liste je Anfrage-Subpfad (invoke, invoke-with-response-stream, responses, responses-stream). Unbekannte Schlüssel werden abgelehnt, weil jeder andere Schlüssel hier als Subpfad gelesen wird und keine Route nach einem Subpfad fragt, den dieser Endpunkt nicht bedient - ein unbekannter Schlüssel ist also ein Tippfehler, der nie laufen würde, keine Einstellung. Das Subpfad-Muster schließt 'pseudonymization' bewusst aus, damit dieser Schlüssel nicht zugleich eine Hook-Liste sein muss.
schema.hooks.defaults._entry.pseudonymization.label=Pseudonymisierung
schema.hooks.defaults._entry.pseudonymization.description=Einstellungen des Pseudonymisierungs-Plug-ins. Aktivierung (enabled) und die Kategorieschalter (entities) gelten nur für dieses Plug-in; maskiert wird nur, wenn das Plug-in für eine Anfrage tatsächlich läuft - es muss in der Hook-Kette registriert sein, und eine Aktivierungsquelle muss auslösen.
schema.hooks.defaults._entry.pseudonymization.enabled.label=Aktiviert
schema.hooks.defaults._entry.pseudonymization.enabled.description=Erzwingt die Maskierung für eine Anfrage. Nur gelesen, wo dieser Block unter models.overrides.<model>.pseudonymization oder hooks.defaults.<endpoint>.pseudonymization steht: true maskiert dort diese Anfrage, wobei der Block je Modell den Block je Endpunkt übertrifft. False oder fehlend erzwingt nichts - die Maskierung kann trotzdem laufen, wenn eine andere Aktivierungsquelle auslöst, etwa ein Triggerwort oder ein Maskierungsfeld im Anfrage-Body. Unter observability.pseudonymization wird dieser Schlüssel derzeit ignoriert; diese Ebene trägt jede andere Einstellung hier bei, außer method und allow_user_bypass. In jedem Fall muss das Plug-in in die Hook-Kette eingebunden sein, sonst wird gar nichts maskiert.
schema.hooks.defaults._entry.pseudonymization.method.label=Methode
schema.hooks.defaults._entry.pseudonymization.method.description=Maskierungsmodus: `pseudonymization` maskiert die Anfrage und demaskiert die Antwort; `anonymization` maskiert und demaskiert nie. Nur gelesen, wo dieser Block die Maskierung erzwingt (ein aktivierter Hook oder eine Modellüberschreibung), nicht unter `observability.pseudonymization`. Er steuert auch SIEM: Nur `pseudonymization` behält die maskierte Antwort, sodass eine Content-Sink unter `anonymization` den Prompt erhält, aber nicht die Antwort. Fehlt der Wert, gilt `pseudonymization`. Modi: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.label=Umgehung durch Benutzer zulassen
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.description=Nur innerhalb eines Blocks wirksam, der die Maskierung erzwingt (ein aktivierter Hook oder eine Modellüberschreibung); unter `observability.pseudonymization` nicht gelesen. Standard false. Bei true kann ein Aufrufer die Maskierung über den Header `x-sail-proxy-pseudonymization: off` (ohne Beachtung der Groß-/Kleinschreibung) oder das Body-Feld `pseudonymization_off: true` überspringen: Der Inhalt erreicht das LLM unmaskiert und, wo eine aktivierte SIEM-Sink sowohl `include_content` als auch `allow_unmasked_content` setzt, auch diese Sink. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.hooks.defaults._entry.pseudonymization.entities.label=Entitäten
schema.hooks.defaults._entry.pseudonymization.entities.description=Maskierungsschalter je Kategorie: `true` maskiert die Kategorie auf dieser Ebene, `false` nicht, und eine nicht aufgeführte Kategorie erbt die darunterliegende Ebene (spätere Ebenen gewinnen). Schlüssel sind die Menge der bekannten Kategorien: die standardmäßig aktiven Kategorien; drei Opt-in-Kategorien, die deaktiviert ausgeliefert werden (`profile-org`, `profile-location`, `profile-ip-address`); und `profile-sensitive-data`, ein Pauschalschalter, der alle außer diesen dreien aktiviert. Ein Schlüssel außerhalb der Menge wird hier abgelehnt. Kategorien und Ebenen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.hooks.defaults._entry.pseudonymization.org_suffixes.label=Rechtsform-Suffixe
schema.hooks.defaults._entry.pseudonymization.org_suffixes.description=Rechtsform-Suffixe, die eine Wortfolge als Organisationsnamen kennzeichnen, z. B. Inc, LLC, GmbH. Der Abgleich beachtet bewusst die Groß-/Kleinschreibung, sodass ein kleingeschriebenes 'limited' im Fließtext absichtlich nicht als Rechtsform gilt; jeder Eintrag trifft zusätzlich vollständig großgeschrieben zu, sodass eine Rechnung, die ACME GMBH schreit, als dieselbe Organisation wie Acme GmbH erkannt wird. Wirksam nur, solange profile-org in entities aktiviert ist; wird profile-org bei leerer Liste aktiviert, wird NICHTS als Organisation maskiert und eine Warnung protokolliert. Jeder Eintrag wird vor dem Abgleich getrimmt, und ein leerer oder nur aus Leerzeichen bestehender Eintrag wird stillschweigend verworfen statt abgelehnt.
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.label=Ortsverzeichnis
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.description=Wörtliche Ortsbegriffe, die der strukturelle Detektor maskiert - ohne Beachtung der Groß-/Kleinschreibung und nur als ganzes Wort oder ganze Wendung; aus Großschreibung oder Kontext wird nichts abgeleitet. Wirksam nur, solange profile-location in entities aktiviert ist; wird profile-location bei leerer Liste aktiviert, wird NICHTS als Ort maskiert und eine Warnung protokolliert. Jeder Eintrag wird getrimmt, und ein leerer oder nur aus Leerzeichen bestehender Eintrag wird stillschweigend verworfen. Wird leer ausgeliefert: Ortsnamen sind deploymentspezifisch und dieses Repository ist öffentlich, daher befüllen Sie sie über diese Admin-Konfigurations-App, nie in versioniertem Code.
schema.hooks.defaults._entry.pseudonymization.min_confidence.label=Min. Konfidenz
schema.hooks.defaults._entry.pseudonymization.min_confidence.description=Wie viel Evidenz ein erkannter Wert vor der Maskierung braucht, von 0 bis 1 (Standard 0.5). Ein Wert wird maskiert, sobald seine Bewertung die Schwelle erreicht; ein einfacher großgeschriebener Name erzielt etwa 0.5, ein per Prüfsumme validiertes Muster 0.95, eine benutzerdefinierte Regel 1.0. Eine höhere Schwelle lässt zuerst einfache Namen fallen; verschärfen Sie eine störende Kategorie daher besser mit `thresholds`. Benutzerdefinierte Regeln, validierte Kennungen und Zugangsdaten werden durch ihr Umfeld nie herabgestuft. Details zur Bewertung: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.hooks.defaults._entry.pseudonymization.thresholds.label=Schwellenwerte
schema.hooks.defaults._entry.pseudonymization.thresholds.description=Konfidenzschwellen je Kategorie, jeweils 0 bis 1, die `min_confidence` für die genannten Kategorien überschreiben; eine nicht aufgeführte behält `min_confidence`. Der Ort, um bei einer einzelnen störenden Kategorie streng zu sein - `profile-person` mit 0.65 verlangt mehr Evidenz für Namen, während validierte Kennungen bei der globalen Schwelle bleiben. Schlüssel sind dieselbe Menge bekannter Kategorien, die `entities` annimmt; `profile-sensitive-data` wird akzeptiert, bewirkt aber nichts. Feinabstimmung je Kategorie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.hooks.defaults._entry.pseudonymization.allowlist.label=Positivliste
schema.hooks.defaults._entry.pseudonymization.allowlist.description=Werte, die dieses Deployment nie maskiert - ein AUS-Schalter je Wert. Vor der Konfidenzbewertung herangezogen, sodass ein aufgeführter Wert ausgenommen ist, egal wie viel Evidenz es gibt. Verwenden Sie es für ein wiederkehrendes falsch positives Ergebnis mit eigenem Namen - einen Produkt- oder Berichtstitel, der wie eine Person klingt. Die Listen der Ebenen werden VERKETTET, nicht ersetzt, sodass eine untere Ebene nur eine Ausnahme hinzufügt, nie eine entfernt. `terms` gegenüber `patterns` und die Gefahr zu breiter Einträge: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.label=Begriffe
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.description=Wörtliche Werte, verglichen mit dem gesamten erkannten Wert und UNTER BEACHTUNG DER GROSS-/KLEINSCHREIBUNG. Bewusst so: 'Watson Studio' ist das Produkt, das ein Betreiber ausnehmen wollte, 'watson studio' in einem Satz nicht, und eine Liste ohne Beachtung der Schreibweise würde auch eine Person ausnehmen, deren Nachname zufällig gleich geschrieben wird. Ein Begriff trifft nur auf einen Wert zu, den die Detektoren als Ganzes erzeugt haben - 'Studio' aufzuführen nimmt 'Watson Studio' nicht aus. Jeder Eintrag hier ist ein AUS-Schalter der Maskierung für genau diesen Wert; beschränken Sie die Liste daher auf Werte, die wirklich nie personenbezogene Daten sind: Ein Begriff, der zufällig der Name einer Person ist, nimmt diese Person überall in diesem Deployment von der Maskierung aus, stillschweigend und ohne einen Hinweis im Protokoll.
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.label=Muster
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.description=Reguläre Ausdrücke (JavaScript), jeweils mit dem GESAMTEN erkannten Wert abgeglichen: Das Gateway umschließt jeden Eintrag selbst mit `^(?: )$`, schreiben Sie also `Z[A-Z0-9_]+`, nicht `^Z[A-Z0-9_]+$`. Der Abgleich beachtet die Groß-/Kleinschreibung. Jeder Eintrag ist ein AUS-Schalter der Maskierung, und ein breiter deaktiviert die Maskierung, ohne zu scheitern - `[A-Z].*` schaltet fast jeden erkannten Personennamen ab. Ein Treffer auf ein eingebautes PII-Beispiel warnt, wird aber TROTZDEM angewendet. Halten Sie jeden Eintrag eng. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.saturation_warn.label=Sättigungswarnung
schema.hooks.defaults._entry.pseudonymization.saturation_warn.description=Wie viele VERSCHIEDENE maskierte Werte eine Anfrage enthalten darf, bevor sie als gesättigt gemeldet wird (Standard 40). Nur Berichterstattung - es ändert nie, was maskiert wird. Oberhalb der Zahl protokolliert das Gateway je Anfrage eine Warnung mit Zählungen je Kategorie und den häufigsten Wert-FORMEN (Buchstaben als X, Ziffern als 9); nie erscheint ein maskierter Wert. Das Nutzungs-SIEM-Ereignis der Anfrage trägt dieselben Zählungen mit einem Flag `saturated` - Zählungen, kein Text. Den Bericht lesen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.label=Erfundene Platzhalter
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.description=Was geschieht, wenn eine Antwort einen maskierten Platzhalter enthält, der dem Modell nie gesendet wurde. Modelle erfinden einen in etwa 1 von 125 pseudonymisierten Antworten, und umso häufiger, je mehr Werte eine Anfrage maskiert; ein solcher Platzhalter bezeichnet niemanden und kann nie aufgelöst werden. withhold (Standard): Er wird durch eine einfache Markierung wie [name withheld] ersetzt und als Sicherheitsereignis gemeldet. report: Er wird nur gemeldet und erreicht den Client unverändert, für ein Deployment, dessen eigene Entwickler über das Gateway neue Platzhalter in Test-Fixtures schreiben. off: keines von beiden. Ein Platzhalter, den der Client selbst in derselben Anfrage gesendet hat, gilt nie als erfunden.
schema.hooks.defaults._entry._entry.description=Die Hook-Liste eines Subpfads, der Reihe nach probiert. Dieselbe Form dient hooks.defaults.<endpoint>.<subpath> und models.overrides.<model>.hooks.<subpath>, sodass das Gateway eine Form sieht, gleich welche der beiden sie geliefert hat. Ein Hook löst nur aus, wenn JEDE Regel, die sein request.match nennt, auf die Anfrage zutrifft; request.callback.id nennt dann das Plug-in, das für die laufende Phase ausgeführt wird. Ein Hook, dessen match nicht zutrifft oder dessen callback kein für diese Phase registriertes Plug-in nennt, wird übersprungen und der nächste probiert - keines von beiden ist zur Laufzeit ein Fehler.
schema.hooks.defaults._entry._entry.items.request.label=Anfrage
schema.hooks.defaults._entry._entry.items.request.description=Was zutreffen muss und was dann ausgeführt wird. Nach der Anfrage benannt, weil der Matcher nur die eingehende Anfrage prüft; es gibt kein Gegenstück für die Antwort, und sonst wird an einem Hook nichts gelesen.
schema.hooks.defaults._entry._entry.items.request.callback.label=Callback
schema.hooks.defaults._entry._entry.items.request.callback.description=Das Plug-in, das ausgeführt wird, sobald jede Regel in match zugetroffen hat.
schema.hooks.defaults._entry._entry.items.request.callback.id.label=ID
schema.hooks.defaults._entry._entry.items.request.callback.id.description=Die ID, unter der sich ein Plug-in registriert hat, nachgeschlagen in der Plug-in-Registry des Gateways für die laufende Phase. Dieses Schema kann den Querverweis nicht prüfen: Eine ID, die kein Plug-in für diese Phase registriert hat, wird als nicht gefunden protokolliert und der Hook übersprungen, sodass die Anfrage unverändert durchgeht, statt fehlzuschlagen.
schema.hooks.defaults._entry._entry.items.request.match.label=Abgleich
schema.hooks.defaults._entry._entry.items.request.match.description=Die Regel-IDs, die ALLE zutreffen müssen, der Reihe nach ausgewertet und bei der ersten nicht zutreffenden abgebrochen. Jede ID ist ein Schlüssel in hooks.definitions - ein Querverweis, den dieses Schema nicht prüfen kann: Eine dort nirgends definierte ID protokolliert eine Warnung und lässt den ganzen Hook nicht zutreffen, sodass ein Tippfehler das Plug-in stillschweigend deaktiviert, statt es bedingungslos auszulösen. Eine leere Liste wird abgelehnt, denn ein Hook, der bei fast allem laufen soll, wird stattdessen mit einer bewusst breiten Regel geschrieben - das ausgelieferte payload:any trifft auf jede Anfrage zu, deren geparster Body ein nicht leeres String-model enthält; das ist so nah an bedingungslos, wie eine Regel kommt, und sagt es trotzdem offen.
schema.platform.label=Plattform
schema.platform.billing.label=Abrechnung
schema.platform.billing.description=SAP-AI-Core-Abrechnungsklassifizierung für diesen Subaccount. Nur von der SAP-nativen Kostenrechnung in Capacity Units der Admin-App gelesen, nie vom Gateway-Anfragepfad.
schema.platform.billing.productive.label=Produktiv
schema.platform.billing.productive.description=Ob SAP diesen Subaccount/Tenant für die SAP-AI-Core-Abrechnung als PRODUKTIV einstuft. isProductive() in sapCapacityService liest dies, um die Zeile SapCapacityUnitPrice zu wählen - produktiver oder nicht produktiver $/CU -, mit der Capacity Units bepreist werden. Die Einstufung von SAP entspricht nicht immer dem Namen der Umgebung (ein Sandbox-Subaccount kann als produktiv eingestuft sein); setzen Sie dies daher auf das, was Ihre SAP-Rechnung bzw. Ihr Subaccount tatsächlich ist. Standard false = nicht produktiv.
schema.platform.billing.cuFactor.label=CU-Faktor
schema.platform.billing.cuFactor.description=Umrechnungsfaktor von SAP-GenAI-Token in Capacity Units (SAP-Hinweis 3437766; einheitlich über alle Rechnungen, nicht je Modell veröffentlicht). cuFactor() in sapCapacityService liest ihn - capacityUnits = genAiTokens x dieser Faktor, global auf jedes Nutzungsereignis angewendet (nicht je Nutzungsart), sowohl bei der Live-Erfassung als auch bei der rückwirkenden Neuberechnung. Nur ändern, wenn SAP die CU-Umrechnung neu veröffentlicht. Standard 1.90385. Der Wert 0 gilt als nicht gesetzt und fällt auf den Standard zurück.
schema.platform.timeouts.label=Timeouts
schema.platform.timeouts.description=Timeout-Obergrenzen je Anfrage, die das Gateway auf ausgehende LLM-Aufrufe anwendet.
schema.platform.timeouts.default.label=Standard
schema.platform.timeouts.default.description=Timeout in Millisekunden für Anfragen ohne Streaming, von 1000 bis 3600000. Nicht gesetzt oder null fällt auf 120000 ms (120 Sekunden) zurück.
schema.platform.timeouts.streaming.label=Streaming
schema.platform.timeouts.streaming.description=Timeout in Millisekunden für Streaming-Anfragen, von 1000 bis 3600000. Nicht gesetzt oder null fällt auf 240000 ms (240 Sekunden) zurück.
schema.platform.logging.label=Protokollierung
schema.platform.logging.description=Log-Level und Ziel des Gateways. Vom gemeinsamen Logger beim Start gelesen und erneut, wann immer das Gateway ihn nach einer Konfigurationsänderung neu initialisiert.
schema.platform.logging.components.label=Komponenten
schema.platform.logging.components.description=Überschreibung des Log-Levels je Komponente, mit dem Komponentennamen als Schlüssel, genau so, wie das Gateway ihn protokolliert - zum Beispiel 'ConfigService' oder 'AwsBedrockService'. Eine Komponente ohne Eintrag hier verwendet LOG_LEVEL, sofern gesetzt, andernfalls defaultLevel. Ein Eintrag hat für seine eigene Komponente Vorrang vor LOG_LEVEL, sodass eine festgelegte Komponente die Umgebungsvariable ignoriert; die mitgelieferte Konfiguration enthält keine Einträge.
schema.platform.logging.components._entry.description=Log-Level für diese Komponente, das defaultLevel überschreibt, solange es vorhanden ist. Es wird ohne Beachtung der Groß-/Kleinschreibung mit den Levels abgeglichen, die der Logger implementiert (trace, debug, info, warn, error); ein nicht erkannter Wert wird stillschweigend ignoriert, sodass das bisher wirksame Level bestehen bleibt, statt einen Fehler auszulösen.
schema.platform.logging.defaultLevel.label=Standard-Level
schema.platform.logging.defaultLevel.description=Log-Level für jede Komponente ohne Eintrag in `components`. Ist `LOG_LEVEL` auf ein erkanntes Level gesetzt, hat es Vorrang und dieses Feld wird ignoriert - und `LOG_LEVEL` ist in beiden .env-Beispielen und den Kyma-Manifesten gesetzt, sodass in einem Standard-Deployment die Umgebung gewinnt. Andernfalls wird es ohne Beachtung der Groß-/Kleinschreibung mit den Levels des Loggers abgeglichen (trace, debug, info, warn, error); ein nicht erkannter Wert wird stillschweigend ignoriert. Vorrang: https://st-gr.github.io/sail-proxy/developer/debugging#log-level-resolution
schema.platform.logging.log_folder_path.label=Pfad des Log-Ordners
schema.platform.logging.log_folder_path.description=Verzeichnis, in das das Gateway seine eigenen Log-Dateien schreibt und - wenn payload_logging_enabled true ist - Payload-Dumps von Anfragen und Antworten, in einem Unterverzeichnis payloads/. Fällt auf ./logs zurück, wenn nicht gesetzt.
schema.platform.logging.payload_logging_enabled.label=Payload-Protokollierung aktiviert
schema.platform.logging.payload_logging_enabled.description=Bei true werden vollständige Anfrage- und Antwort-Bodys zur Fehlersuche nach log_folder_path/payloads geschrieben. Bekannt sensible Header werden geschwärzt, der Body-Inhalt wird jedoch unverändert geschrieben; lassen Sie dies daher außerhalb aktiver Fehlersuche ausgeschaltet. Standardmäßig aus. Die Umgebungsvariable PAYLOAD_LOGGING_ENABLED überschreibt diesen Wert, wenn sie auf true oder false gesetzt ist.
schema.platform.rate_limit_handling.label=Behandlung von Ratenlimits
schema.platform.rate_limit_handling.description=Automatischer Backoff, den das Gateway anwendet, nachdem ein Anbieter ein Ratenlimit signalisiert hat - ein HTTP 429 oder eine Fehlermeldung, die ein Ratenlimit-Schlüsselwort enthält. Rein reaktiv: Es verzögert Wiederholungen, sobald für ein Modell und einen Subpfad ein Ratenlimit aufgetreten ist; es drosselt den Verkehr nicht vorab.
schema.platform.rate_limit_handling.enabled.label=Aktiviert
schema.platform.rate_limit_handling.enabled.description=Hauptschalter für den Ratenlimit-Backoff. Bei false oder fehlendem Wert beträgt die Verzögerung immer 0 Sekunden, und der Rest dieses Abschnitts hat keine Wirkung.
schema.platform.rate_limit_handling.default_delay_seconds.label=Standardverzögerung in Sekunden
schema.platform.rate_limit_handling.default_delay_seconds.description=Verzögerung in Sekunden, die angewendet wird, wenn ein Ratenlimit erkannt wird und weder subpath_specific_delays noch model_specific_delays einen Eintrag für den Endpunkt hat. Fällt auf 30 zurück, wenn nicht gesetzt oder null.
schema.platform.rate_limit_handling.backoff_multiplier.label=Backoff-Multiplikator
schema.platform.rate_limit_handling.backoff_multiplier.description=Multiplikator, der bei jedem aufeinanderfolgenden Ratenlimit für dasselbe Modell und denselben Subpfad auf die vorherige Verzögerung angewendet wird: Die neue Verzögerung ist die vorherige mal diesem Wert, begrenzt auf max_delay_seconds. Fällt auf 1.5 zurück, wenn nicht gesetzt oder null; halten Sie ihn bei 1 oder darüber, sonst würde jedes aufeinanderfolgende Ratenlimit kürzer statt länger warten.
schema.platform.rate_limit_handling.max_delay_seconds.label=Max. Verzögerung in Sekunden
schema.platform.rate_limit_handling.max_delay_seconds.description=Obergrenze in Sekunden, die der Backoff bei aufeinanderfolgenden Ratenlimits oben nicht überschreiten kann. Fällt auf 300 zurück, wenn nicht gesetzt oder null.
schema.platform.rate_limit_handling.model_specific_delays.label=Modellspezifische Verzögerungen
schema.platform.rate_limit_handling.model_specific_delays.description=Überschreibung der Verzögerung je Modell in Sekunden, mit der Modell-ID als Schlüssel, genau so, wie sie unter providers und models konfiguriert ist - zum Beispiel 'anthropic--claude-4-opus--deployed'. Nach subpath_specific_delays und vor default_delay_seconds geprüft; eine Verzögerung von 0 gilt hier als keine Überschreibung, weil nur ein Eintrag ungleich null verwendet wird.
schema.platform.rate_limit_handling.model_specific_delays._entry.description=Verzögerung in Sekunden, die für dieses Modell angewendet wird, wenn es ein Ratenlimit erreicht.
schema.platform.rate_limit_handling.subpath_specific_delays.label=Subpfadspezifische Verzögerungen
schema.platform.rate_limit_handling.subpath_specific_delays.description=Überschreibung der Verzögerung je Subpfad in Sekunden, mit dem API-Subpfad des Gateways als Schlüssel - zum Beispiel 'converse-stream' oder 'invoke-with-response-stream'. Zuerst geprüft, vor model_specific_delays und default_delay_seconds; eine Verzögerung von 0 gilt hier als keine Überschreibung, weil nur ein Eintrag ungleich null verwendet wird.
schema.platform.rate_limit_handling.subpath_specific_delays._entry.description=Verzögerung in Sekunden, die für diesen Subpfad angewendet wird, wenn er ein Ratenlimit erreicht.
schema.platform.security.label=Sicherheit
schema.platform.security.description=Belange des eingehenden Verkehrs.
schema.platform.security.trust_forwarded_for.label=Forwarded-For vertrauen
schema.platform.security.trust_forwarded_for.description=Vertraut den vom Client gelieferten Headern X-Forwarded-For und X-Real-IP - und der Client-IP, die das Web-Framework daraus ableitet -, wenn die Client-IP bei Sicherheitsereignissen erfasst wird, statt die rohe Peer-Adresse des Sockets zu verwenden. Aktivieren Sie dies nur hinter einem Proxy, der diese Header überschreibt, statt durchzureichen, was der Client gesendet hat; andernfalls kann ein Client seine eigene erfasste IP fälschen.
schema.platform.security.credentialExpirationDays.label=Ablauf der Zugangsdaten (Tage)
schema.platform.security.credentialExpirationDays.description=Tage, die Zugangsdaten gültig bleiben: Ein API-Schlüssel oder AWS-Zugangsdaten werden mit expiresAt = jetzt + so viele Tage angelegt, und jede Aktualisierung (Rotation) setzt expiresAt erneut auf jetzt + so viele Tage. Fehlende oder ungültige Werte fallen auf 90 zurück. Zugangsdaten, die vor Einführung des Ablaufs angelegt wurden, haben kein Datum und laufen nie ab, bis ein Administrator eines setzt.
schema.platform.quotas.label=Kontingente
schema.platform.quotas.description=Plattformweite Standardkontingente je Benutzer, vom Gateway bei jeder LLM-Anfrage durchgesetzt. Die eigene Beschränkung eines Benutzers (App Benutzer und Kontingente) überschreibt jedes Feld; null = unbegrenzt. Zeitfenster sind der UTC-Kalendertag, die ISO-Woche (Montag 00:00 UTC) und der Kalendermonat; Ausgaben sind die SAP-Kosten plus die Connections-Kosten in der Währung des SAP-Capacity-Unit-Preises.
schema.platform.quotas.requestsPerMinute.label=Anfragen pro Minute
schema.platform.quotas.requestsPerMinute.description=Anfragen je Benutzer pro gleitender Minute. Limits je Zugangsdaten (RateLimits) gelten zusätzlich; eine Anfrage muss beide bestehen.
schema.platform.quotas.spendPerDay.label=Ausgaben pro Tag
schema.platform.quotas.spendPerDay.description=SAP-Kosten plus Connections-Kosten je Benutzer pro UTC-Tag.
schema.platform.quotas.spendPerWeek.label=Ausgaben pro Woche
schema.platform.quotas.spendPerWeek.description=SAP-Kosten plus Connections-Kosten je Benutzer pro ISO-Woche.
schema.platform.quotas.spendPerMonth.label=Ausgaben pro Monat
schema.platform.quotas.spendPerMonth.description=SAP-Kosten plus Connections-Kosten je Benutzer pro Kalendermonat.
schema.platform.quotas.tokensPerDay.label=Token pro Tag
schema.platform.quotas.tokensPerDay.description=Eingabe-, Ausgabe- und Cache-Write-Token je Benutzer pro UTC-Tag; Cache-Lesezugriffe werden nicht gezählt.
schema.platform.quotas.tokensPerWeek.label=Token pro Woche
schema.platform.quotas.tokensPerWeek.description=Eingabe-, Ausgabe- und Cache-Write-Token je Benutzer pro ISO-Woche; Cache-Lesezugriffe werden nicht gezählt.
schema.platform.quotas.tokensPerMonth.label=Token pro Monat
schema.platform.quotas.tokensPerMonth.description=Eingabe-, Ausgabe- und Cache-Write-Token je Benutzer pro Kalendermonat; Cache-Lesezugriffe werden nicht gezählt.
schema.platform.toolGovernance.label=Tool-Nutzung
schema.platform.toolGovernance.description=Tool-Nutzung: wie lange die Tool-Nutzungszeilen je Anfrage und ihre täglichen Aggregate aufbewahrt werden und wie jedes Client-Programm die MCP-Tools schreibt, die es selbst hostet.
schema.platform.toolGovernance.mcpNaming.label=MCP-Benennung
schema.platform.toolGovernance.mcpNaming.description=Ein Client, der seine eigenen MCP-Server betreibt, sendet keinen MCP-Tool-Typ: Claude Code deklariert jedes Tool als mcp__server__tool, während codex sie innerhalb seines eigenen exec-Tools erreicht. Diese Konventionen machen aus einem solchen Namen die Identität mcp:server/tool, die ein Richtlinienmuster abgleichen kann; ein Client, den noch niemand vermessen hat, ist damit eine Konfigurationsänderung statt eines Releases.
schema.platform.toolGovernance.mcpNaming.namePattern.label=Muster für Tool-Namen
schema.platform.toolGovernance.mcpNaming.namePattern.description=Regulärer Ausdruck, der mit einem deklarierten Tool-Namen abgeglichen wird; die erste Gruppe ist der MCP-Server, die zweite das Tool. Der Standard liest mcp__codex_apps__sites_create_site als Server codex_apps und Tool sites_create_site.
schema.platform.toolGovernance.mcpNaming.clients.label=Client-Programme
schema.platform.toolGovernance.mcpNaming.clients.description=Ein Eintrag je Client-Programm. Es gilt der erste, dessen User-Agent-Text im User Agent der Anfrage vorkommt; eine Anfrage, die keinem entspricht, wird weiterhin nach dem gesteuert, was sie deklariert. Eine hier angegebene Liste ersetzt die eingebauten Voreinstellungen vollständig; ein Eintrag ohne name, userAgent oder containerTools wird übersprungen.
schema.platform.toolGovernance.mcpNaming.clients.items.name.label=Name
schema.platform.toolGovernance.mcpNaming.clients.items.name.description=Wie dieser Client im Cockpit und in den Protokollen bezeichnet wird, zum Beispiel claude-code.
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.label=User Agent
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.description=Text, der den Client im User-Agent-Header der Anfrage identifiziert, zum Beispiel claude-cli. Ohne Beachtung der Groß-/Kleinschreibung an beliebiger Stelle im Header abgeglichen.
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.label=Container-Tools
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.description=Tools, deren Aufruf-Body verschachtelte MCP-Tools erreichen kann, etwa exec von codex. Leer für einen Client, der seine MCP-Tools direkt deklariert, was der übliche Fall ist.
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.label=Muster für verschachtelte Aufrufe
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.description=Regulärer Ausdruck, der den Namen eines verschachtelten Tools im Aufruf-Body eines Container-Tools findet; die erste Gruppe ist der Name. Nur die Namen werden gelesen, nie die Argumente.
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.label=Muster für Tool-Namen
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.description=Regulärer Ausdruck, der das gemeinsame Muster für Tool-Namen nur für diesen Client ersetzt; die erste Gruppe ist der MCP-Server, die zweite das Tool, und ein Name zählt nur, wenn beide Gruppen nicht leer sind. Der Abgleich unterscheidet Groß- und Kleinschreibung und findet das Muster an beliebiger Stelle im Namen, sofern es nicht mit ^ und $ verankert ist. Weglassen, um das gemeinsame Muster zu verwenden. Ein leerer oder ungültiger Ausdruck trifft für diesen Client per Muster auf nichts zu (es wird nicht auf das gemeinsame Muster zurückgegriffen), die Servernamen gelten aber weiterhin.
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.label=Servernamen
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.description=Die MCP-Server, die diese Installation betreibt, für einen Client, dessen Tool-Namen keine Kennzeichnung tragen, etwa opencode, das das Tool ping_probe des Servers probe als probe_ping_probe deklariert. Ein deklariertes Tool mit dem Namen <server>_<tool> wird dann zur Identität mcp:server/tool; zuerst wird das Namensmuster versucht, dann die Server in der Reihenfolge der Liste, und der erste passende Server gewinnt. Servernamen unterscheiden Groß- und Kleinschreibung. Leere Einträge werden ignoriert. Bleibt die Liste leer, bleiben solche Tools gewöhnliche Funktions-Tools.
schema.platform.toolGovernance.retention.label=Aufbewahrung
schema.platform.toolGovernance.retention.rawDays.label=Aufbewahrung der Tool-Nutzung (Tage)
schema.platform.toolGovernance.retention.rawDays.description=Tage, die eine Tool-Nutzungszeile je Anfrage aufbewahrt wird, bevor die nächtliche Bereinigung sie entfernt. Die täglichen Aggregate behalten die Summen.
schema.platform.toolGovernance.retention.dailyDays.label=Aufbewahrung der Tool-Nutzungsaggregate (Tage)
schema.platform.toolGovernance.retention.dailyDays.description=Tage, die ein tägliches Tool-Nutzungsaggregat (je Benutzer, Tool und Tag) aufbewahrt wird. Das Inventar und die Benutzerseite lesen diese.
schema.platform.maintenance.label=Wartung
schema.platform.maintenance.description=Wann der Admin-Service seine tägliche Wartung ausführt: die Neuberechnung der Kosten, den Neuaufbau der Nutzungs-Buckets und die Neuveröffentlichung des Kontingentdokuments jedes Benutzers.
schema.platform.maintenance.dailyRunAtUtc.label=Tägliche Ausführung um (UTC)
schema.platform.maintenance.dailyRunAtUtc.description=Tageszeit in UTC als HH:MM (24-Stunden-Format), zu der der tägliche Wartungslauf beginnt. Nicht gesetzt: Der Lauf beginnt 5 Minuten nach dem Start des Admin-Service und danach alle 24 Stunden, sodass ein Redeploy zur Mittagszeit ihn auf Mittag festlegt. Gesetzt: Der erste Lauf beginnt weiterhin 5 Minuten nach dem Start; jeder spätere Lauf beginnt täglich zu dieser Zeit. Beispiel: Um Mitternacht pazifischer Zeit auszuführen, geben Sie 08:00 ein, solange die Pacific Standard Time gilt (UTC-8), oder 07:00 während der Pacific Daylight Time (UTC-7) - der Wert wird nicht an die Sommerzeit angepasst.
schema.observability.label=Überwachung
schema.observability.pseudonymization.label=Pseudonymisierung
schema.observability.pseudonymization.description=Einstellungen des Pseudonymisierungs-Plug-ins. Aktivierung (enabled) und die Kategorieschalter (entities) gelten nur für dieses Plug-in; maskiert wird nur, wenn das Plug-in für eine Anfrage tatsächlich läuft - es muss in der Hook-Kette registriert sein, und eine Aktivierungsquelle muss auslösen.
schema.observability.pseudonymization.enabled.label=Aktiviert
schema.observability.pseudonymization.enabled.description=Erzwingt die Maskierung für eine Anfrage. Nur gelesen, wo dieser Block unter models.overrides.<model>.pseudonymization oder hooks.defaults.<endpoint>.pseudonymization steht: true maskiert dort diese Anfrage, wobei der Block je Modell den Block je Endpunkt übertrifft. False oder fehlend erzwingt nichts - die Maskierung kann trotzdem laufen, wenn eine andere Aktivierungsquelle auslöst, etwa ein Triggerwort oder ein Maskierungsfeld im Anfrage-Body. Unter observability.pseudonymization wird dieser Schlüssel derzeit ignoriert; diese Ebene trägt jede andere Einstellung hier bei, außer method und allow_user_bypass. In jedem Fall muss das Plug-in in die Hook-Kette eingebunden sein, sonst wird gar nichts maskiert.
schema.observability.pseudonymization.method.label=Methode
schema.observability.pseudonymization.method.description=Maskierungsmodus: `pseudonymization` maskiert die Anfrage und demaskiert die Antwort; `anonymization` maskiert und demaskiert nie. Nur gelesen, wo dieser Block die Maskierung erzwingt (ein aktivierter Hook oder eine Modellüberschreibung), nicht unter `observability.pseudonymization`. Er steuert auch SIEM: Nur `pseudonymization` behält die maskierte Antwort, sodass eine Content-Sink unter `anonymization` den Prompt erhält, aber nicht die Antwort. Fehlt der Wert, gilt `pseudonymization`. Modi: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.observability.pseudonymization.allow_user_bypass.label=Umgehung durch Benutzer zulassen
schema.observability.pseudonymization.allow_user_bypass.description=Nur innerhalb eines Blocks wirksam, der die Maskierung erzwingt (ein aktivierter Hook oder eine Modellüberschreibung); unter `observability.pseudonymization` nicht gelesen. Standard false. Bei true kann ein Aufrufer die Maskierung über den Header `x-sail-proxy-pseudonymization: off` (ohne Beachtung der Groß-/Kleinschreibung) oder das Body-Feld `pseudonymization_off: true` überspringen: Der Inhalt erreicht das LLM unmaskiert und, wo eine aktivierte SIEM-Sink sowohl `include_content` als auch `allow_unmasked_content` setzt, auch diese Sink. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.observability.pseudonymization.entities.label=Entitäten
schema.observability.pseudonymization.entities.description=Maskierungsschalter je Kategorie: `true` maskiert die Kategorie auf dieser Ebene, `false` nicht, und eine nicht aufgeführte Kategorie erbt die darunterliegende Ebene (spätere Ebenen gewinnen). Schlüssel sind die Menge der bekannten Kategorien: die standardmäßig aktiven Kategorien; drei Opt-in-Kategorien, die deaktiviert ausgeliefert werden (`profile-org`, `profile-location`, `profile-ip-address`); und `profile-sensitive-data`, ein Pauschalschalter, der alle außer diesen dreien aktiviert. Ein Schlüssel außerhalb der Menge wird hier abgelehnt. Kategorien und Ebenen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.observability.pseudonymization.org_suffixes.label=Rechtsform-Suffixe
schema.observability.pseudonymization.org_suffixes.description=Rechtsform-Suffixe, die eine Wortfolge als Organisationsnamen kennzeichnen, z. B. Inc, LLC, GmbH. Der Abgleich beachtet bewusst die Groß-/Kleinschreibung, sodass ein kleingeschriebenes 'limited' im Fließtext absichtlich nicht als Rechtsform gilt; jeder Eintrag trifft zusätzlich vollständig großgeschrieben zu, sodass eine Rechnung, die ACME GMBH schreit, als dieselbe Organisation wie Acme GmbH erkannt wird. Wirksam nur, solange profile-org in entities aktiviert ist; wird profile-org bei leerer Liste aktiviert, wird NICHTS als Organisation maskiert und eine Warnung protokolliert. Jeder Eintrag wird vor dem Abgleich getrimmt, und ein leerer oder nur aus Leerzeichen bestehender Eintrag wird stillschweigend verworfen statt abgelehnt.
schema.observability.pseudonymization.location_gazetteer.label=Ortsverzeichnis
schema.observability.pseudonymization.location_gazetteer.description=Wörtliche Ortsbegriffe, die der strukturelle Detektor maskiert - ohne Beachtung der Groß-/Kleinschreibung und nur als ganzes Wort oder ganze Wendung; aus Großschreibung oder Kontext wird nichts abgeleitet. Wirksam nur, solange profile-location in entities aktiviert ist; wird profile-location bei leerer Liste aktiviert, wird NICHTS als Ort maskiert und eine Warnung protokolliert. Jeder Eintrag wird getrimmt, und ein leerer oder nur aus Leerzeichen bestehender Eintrag wird stillschweigend verworfen. Wird leer ausgeliefert: Ortsnamen sind deploymentspezifisch und dieses Repository ist öffentlich, daher befüllen Sie sie über diese Admin-Konfigurations-App, nie in versioniertem Code.
schema.observability.pseudonymization.min_confidence.label=Min. Konfidenz
schema.observability.pseudonymization.min_confidence.description=Wie viel Evidenz ein erkannter Wert vor der Maskierung braucht, von 0 bis 1 (Standard 0.5). Ein Wert wird maskiert, sobald seine Bewertung die Schwelle erreicht; ein einfacher großgeschriebener Name erzielt etwa 0.5, ein per Prüfsumme validiertes Muster 0.95, eine benutzerdefinierte Regel 1.0. Eine höhere Schwelle lässt zuerst einfache Namen fallen; verschärfen Sie eine störende Kategorie daher besser mit `thresholds`. Benutzerdefinierte Regeln, validierte Kennungen und Zugangsdaten werden durch ihr Umfeld nie herabgestuft. Details zur Bewertung: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.observability.pseudonymization.thresholds.label=Schwellenwerte
schema.observability.pseudonymization.thresholds.description=Konfidenzschwellen je Kategorie, jeweils 0 bis 1, die `min_confidence` für die genannten Kategorien überschreiben; eine nicht aufgeführte behält `min_confidence`. Der Ort, um bei einer einzelnen störenden Kategorie streng zu sein - `profile-person` mit 0.65 verlangt mehr Evidenz für Namen, während validierte Kennungen bei der globalen Schwelle bleiben. Schlüssel sind dieselbe Menge bekannter Kategorien, die `entities` annimmt; `profile-sensitive-data` wird akzeptiert, bewirkt aber nichts. Feinabstimmung je Kategorie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.observability.pseudonymization.allowlist.label=Positivliste
schema.observability.pseudonymization.allowlist.description=Werte, die dieses Deployment nie maskiert - ein AUS-Schalter je Wert. Vor der Konfidenzbewertung herangezogen, sodass ein aufgeführter Wert ausgenommen ist, egal wie viel Evidenz es gibt. Verwenden Sie es für ein wiederkehrendes falsch positives Ergebnis mit eigenem Namen - einen Produkt- oder Berichtstitel, der wie eine Person klingt. Die Listen der Ebenen werden VERKETTET, nicht ersetzt, sodass eine untere Ebene nur eine Ausnahme hinzufügt, nie eine entfernt. `terms` gegenüber `patterns` und die Gefahr zu breiter Einträge: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.allowlist.terms.label=Begriffe
schema.observability.pseudonymization.allowlist.terms.description=Wörtliche Werte, verglichen mit dem gesamten erkannten Wert und UNTER BEACHTUNG DER GROSS-/KLEINSCHREIBUNG. Bewusst so: 'Watson Studio' ist das Produkt, das ein Betreiber ausnehmen wollte, 'watson studio' in einem Satz nicht, und eine Liste ohne Beachtung der Schreibweise würde auch eine Person ausnehmen, deren Nachname zufällig gleich geschrieben wird. Ein Begriff trifft nur auf einen Wert zu, den die Detektoren als Ganzes erzeugt haben - 'Studio' aufzuführen nimmt 'Watson Studio' nicht aus. Jeder Eintrag hier ist ein AUS-Schalter der Maskierung für genau diesen Wert; beschränken Sie die Liste daher auf Werte, die wirklich nie personenbezogene Daten sind: Ein Begriff, der zufällig der Name einer Person ist, nimmt diese Person überall in diesem Deployment von der Maskierung aus, stillschweigend und ohne einen Hinweis im Protokoll.
schema.observability.pseudonymization.allowlist.patterns.label=Muster
schema.observability.pseudonymization.allowlist.patterns.description=Reguläre Ausdrücke (JavaScript), jeweils mit dem GESAMTEN erkannten Wert abgeglichen: Das Gateway umschließt jeden Eintrag selbst mit `^(?: )$`, schreiben Sie also `Z[A-Z0-9_]+`, nicht `^Z[A-Z0-9_]+$`. Der Abgleich beachtet die Groß-/Kleinschreibung. Jeder Eintrag ist ein AUS-Schalter der Maskierung, und ein breiter deaktiviert die Maskierung, ohne zu scheitern - `[A-Z].*` schaltet fast jeden erkannten Personennamen ab. Ein Treffer auf ein eingebautes PII-Beispiel warnt, wird aber TROTZDEM angewendet. Halten Sie jeden Eintrag eng. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.saturation_warn.label=Sättigungswarnung
schema.observability.pseudonymization.saturation_warn.description=Wie viele VERSCHIEDENE maskierte Werte eine Anfrage enthalten darf, bevor sie als gesättigt gemeldet wird (Standard 40). Nur Berichterstattung - es ändert nie, was maskiert wird. Oberhalb der Zahl protokolliert das Gateway je Anfrage eine Warnung mit Zählungen je Kategorie und den häufigsten Wert-FORMEN (Buchstaben als X, Ziffern als 9); nie erscheint ein maskierter Wert. Das Nutzungs-SIEM-Ereignis der Anfrage trägt dieselben Zählungen mit einem Flag `saturated` - Zählungen, kein Text. Den Bericht lesen: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.observability.pseudonymization.unknown_placeholders.label=Erfundene Platzhalter
schema.observability.pseudonymization.unknown_placeholders.description=Was geschieht, wenn eine Antwort einen maskierten Platzhalter enthält, der dem Modell nie gesendet wurde. Modelle erfinden einen in etwa 1 von 125 pseudonymisierten Antworten, und umso häufiger, je mehr Werte eine Anfrage maskiert; ein solcher Platzhalter bezeichnet niemanden und kann nie aufgelöst werden. withhold (Standard): Er wird durch eine einfache Markierung wie [name withheld] ersetzt und als Sicherheitsereignis gemeldet. report: Er wird nur gemeldet und erreicht den Client unverändert, für ein Deployment, dessen eigene Entwickler über das Gateway neue Platzhalter in Test-Fixtures schreiben. off: keines von beiden. Ein Platzhalter, den der Client selbst in derselben Anfrage gesendet hat, gilt nie als erfunden.
schema.observability.siem.label=SIEM
schema.observability.siem.description=SIEM-Export. Audit- und Sicherheitsereignisse werden in eine Outbox geschrieben und an jede aktivierte Sink mindestens einmal zugestellt.
schema.observability.siem.enabled.label=Aktiviert
schema.observability.siem.enabled.description=Hauptschalter. Bei false startet der Dispatcher nicht, unabhängig von den Einstellungen je Sink.
schema.observability.siem.batch_size.label=Batch-Größe
schema.observability.siem.batch_size.description=Standardanzahl der je Sink pro Takt gelesenen Zeilen; eine Sink kann sie überschreiben.
schema.observability.siem.interval_ms.label=Intervall (ms)
schema.observability.siem.interval_ms.description=Standard-Zustellintervall in Millisekunden; eine Sink kann es überschreiben. Die Timer-Periode ist das kürzeste aller beteiligten Intervalle.
schema.observability.siem.reconcile_lookback_ms.label=Rückblick für den Abgleich (ms)
schema.observability.siem.reconcile_lookback_ms.description=Wie weit in Millisekunden der Reparaturdurchlauf nach Outbox-Ereignissen zurückblickt, die nie an eine Sink übergeben wurden. Er begrenzt diesen Scan und verhindert, dass eine neu aktivierte Sink den gesamten aufbewahrten Verlauf erneut abspielt; ältere Ereignisse werden nie nachgeliefert.
schema.observability.siem.content_max_bytes.label=Max. Inhaltsgröße in Byte
schema.observability.siem.content_max_bytes.description=Obergrenze in UTF-8-Byte, die vor der Veröffentlichung eines Nutzungsereignisses unabhängig auf den Prompt und auf die Antwort angewendet wird. Ein gekürztes Ereignis trägt content.truncated: true, sodass eine Teil-Payload nie mit einer ganzen Konversation verwechselt wird. 0 wird akzeptiert und leert den Inhalt, als gekürzt markiert. Standard 8192, worauf auch ein negativer oder nicht numerischer Wert fällt.
schema.observability.siem.categories.label=Kategorien
schema.observability.siem.categories.description=Zu exportierende Ereigniskategorien. 'usage' ist ein Abschlussereignis je Anfrage und die einzige Kategorie, die Konversationsinhalte enthalten kann; die ausgelieferte Liste lässt sie aus, ihr Export ist also eine ausdrückliche Opt-in-Entscheidung; eine fehlende oder leere Liste exportiert alle drei, usage eingeschlossen.
schema.observability.siem.sinks.label=Sinks
schema.observability.siem.sinks.description=Konfigurierte Sinks. Eine Sink, deren Einstellungen die Prüfung nicht bestehen, wird mit einer Warnung übersprungen, statt die anderen anzuhalten.
schema.observability.siem.sinks.items.name.label=Name
schema.observability.siem.sinks.items.name.description=Eindeutiger Sink-Name; der Schlüssel für die Zustellzeilen und den Backoff-Zustand je Sink.
schema.observability.siem.sinks.items.type.label=Typ
schema.observability.siem.sinks.items.type.description=Sink-Implementierung. Bestimmt, welche der typspezifischen Eigenschaften unten gelten.
schema.observability.siem.sinks.items.enabled.label=Aktiviert
schema.observability.siem.sinks.items.enabled.description=Wird mit false ausgeliefert. Eine Sink wird nur bedient, wenn sowohl siem.enabled als auch dieser Wert true sind.
schema.observability.siem.sinks.items.include_content.label=Inhalt einschließen
schema.observability.siem.sinks.items.include_content.description=Opt-in: Sendet den Prompt und die Antwort jeder Anfrage als Teil eines Nutzungsereignisses an diese Sink. Standard false, und false bei jeder ausgelieferten Sink. Gesendet wird die pseudonymisierte Form - Platzhalter, keine rohen PII -, sofern nicht auch allow_unmasked_content gesetzt ist. Erfordert 'usage' in siem.categories; der Dispatcher entfernt den Inhalt vollständig für eine Sink, bei der dieser Wert false ist.
schema.observability.siem.sinks.items.allow_unmasked_content.label=Unmaskierte Inhalte zulassen
schema.observability.siem.sinks.items.allow_unmasked_content.description=RISIKO - liest rohe Konversationen. Opt-in für den Empfang von Inhalten, die die Pseudonymisierung nie maskiert hat, weil die Maskierung für diese Anfrage deaktiviert oder umgangen wurde: echte Namen, Adressen und alles, was ein Benutzer eingefügt hat, vollständig, verlassen dieses System. Standard false und nur wirksam, wo include_content ebenfalls true ist. Bleibt es false, sendet eine solche Anfrage nur Metadaten und erfasst content.omitted: 'not-masked'.
schema.observability.siem.sinks.items.include_credential_material.label=Zugangsdatenmaterial einschließen
schema.observability.siem.sinks.items.include_credential_material.description=Opt-in: Sendet zur Forensik den Rohwert nicht aufgelöster Zugangsdaten. Standard false; bei false entfernt der Dispatcher das Feld.
schema.observability.siem.sinks.items.batch_size.label=Batch-Größe
schema.observability.siem.sinks.items.batch_size.description=Überschreibung von siem.batch_size je Sink.
schema.observability.siem.sinks.items.interval_ms.label=Intervall (ms)
schema.observability.siem.sinks.items.interval_ms.description=Überschreibung von siem.interval_ms je Sink. Muss das Sende-Timeout der Sink übersteigen, sonst stauen sich Zustellungen hintereinander.
schema.observability.siem.sinks.items.url.label=URL
schema.observability.siem.sinks.items.url.description=webhook: vollständige Ingest-URL.
schema.observability.siem.sinks.items.token_env.label=Token
schema.observability.siem.sinks.items.token_env.description=Name des Zugangsdaten-Slots. Nie ein Zugangsdatenwert - api_config.json wird in drei synchronisierten Kopien in einem öffentlichen Repository versioniert.
schema.observability.siem.sinks.items.endpoint.label=Endpunkt
schema.observability.siem.sinks.items.endpoint.description=otel: OTLP/HTTP-Logs-Endpunkt.
schema.observability.siem.sinks.items.headers_env.label=Header
schema.observability.siem.sinks.items.headers_env.description=Name des Zugangsdaten-Slots. Nie ein Zugangsdatenwert - api_config.json wird in drei synchronisierten Kopien in einem öffentlichen Repository versioniert.
schema.observability.siem.sinks.items.site.label=Site
schema.observability.siem.sinks.items.site.description=datadog: Site-Host, z. B. datadoghq.com oder datadoghq.eu.
schema.observability.siem.sinks.items.api_key_env.label=API-Schlüssel
schema.observability.siem.sinks.items.api_key_env.description=Name des Zugangsdaten-Slots. Nie ein Zugangsdatenwert - api_config.json wird in drei synchronisierten Kopien in einem öffentlichen Repository versioniert.
schema.observability.siem.sinks.items.dcr_endpoint.label=DCR-Endpunkt
schema.observability.siem.sinks.items.dcr_endpoint.description=azure_sentinel: URL des Data Collection Endpoint.
schema.observability.siem.sinks.items.dcr_immutable_id.label=Unveränderliche DCR-ID
schema.observability.siem.sinks.items.dcr_immutable_id.description=azure_sentinel: unveränderliche ID der Data Collection Rule.
schema.observability.siem.sinks.items.stream_name.label=Stream-Name
schema.observability.siem.sinks.items.stream_name.description=azure_sentinel: Name des benutzerdefinierten Streams, z. B. Custom-SailProxy_CL.
schema.observability.siem.sinks.items.tenant_id.label=Tenant-ID
schema.observability.siem.sinks.items.tenant_id.description=azure_sentinel: Entra-Tenant-ID.
schema.observability.siem.sinks.items.client_id.label=Client-ID
schema.observability.siem.sinks.items.client_id.description=azure_sentinel: Entra-Anwendungs-ID (Client-ID).
