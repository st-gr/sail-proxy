schema.providers.google.description=Il provider google, servito dal percorso di richiesta Gemini del gateway. Oggi viene rispettato solo substitute_models; le altre impostazioni comuni dei provider non sono ancora collegate per questo provider, quindi - a differenza di ogni altro provider con nome qui - vengono rifiutate anziché restare semplicemente inattive.
