schema.providers.perplexity.substitute_models.items.description.description=Nota a testo libero su questa ridenominazione, per chi leggerà la configurazione in seguito. Attualmente ignorata dal gateway; non cambia nulla nel comportamento della ridenominazione.
schema.providers.perplexity.unsupported_params.label=Parametri non supportati
schema.providers.perplexity.unsupported_params.description=Parametri di richiesta che questo provider o modello non accetta. Il gateway li rimuove prima dell’inoltro a SAP AI Core, che altrimenti rifiuterebbe la richiesta con 400 "does not support parameters: [...]". Un elenco per modello sostituisce l’elenco a livello di provider anziché aggiungersi a esso.
schema.providers.perplexity.param_renames.label=Ridenominazioni dei parametri
schema.providers.perplexity.param_renames.description=Ridenominazioni dei parametri applicate sul percorso di deployment diretto, ad esempio da max_tokens a max_completion_tokens per i modelli di ragionamento OpenAI che rifiutano max_tokens. Una mappa per modello sostituisce la mappa a livello di provider anziché aggiungersi a essa.
schema.providers.perplexity.supports_responses_api.label=Supporta la Responses API
schema.providers.perplexity.supports_responses_api.description=Indica se questo provider o modello può essere servito su /openai/v1/responses. Se assente, resta valida la regola integrata per famiglia, che ammette GPT-5 distribuito e successivi e la serie o.
schema.providers.perplexity.supports_prompt_caching.label=Supporta la cache dei prompt
schema.providers.perplexity.supports_prompt_caching.description=Indica se i modelli di questo provider ricevono i breakpoint della cache dei prompt di Anthropic. Ordine di risoluzione: il flag per modello models.overrides.<model>.supports_prompt_caching, poi questo flag a livello di provider, poi un valore predefinito true per il provider anthropic e false per tutti gli altri. Impostare false dove la cache funziona costa il prezzo pieno dell’input non in cache a ogni turno, mentre un true superfluo è risultato senza effetto - quindi disattivarlo solo per un modello noto per rifiutarlo.
schema.providers._entry.description=Le impostazioni dei provider raggiungibili dal percorso di richiesta di ogni provider, quindi cinque dei sei provider con nome - tutti tranne google - contengono la struttura completa. Ogni campo è facoltativo, e un campo assente indica il comportamento integrato del gateway. Questa struttura da sola è anche quella con cui viene convalidata una chiave di provider che il gateway non legge: lì una chiave sconosciuta viene comunque accettata anziché rifiutata, e resta nel file senza effetto. Quei cinque provider con nome aggiungono le proprie impostazioni a queste e non accettano altro; google, il sesto, fa riferimento solo al campo substitute_models di questa struttura e non accetta nient’altro - la route /google non legge ancora alcun’altra impostazione dei provider.
schema.providers._entry.emulate_streaming_for_models.label=Emula lo streaming per i modelli
schema.providers._entry.emulate_streaming_for_models.description=Modelli la cui risposta il gateway raccoglie per intero e poi riproduce come stream, perché il deployment non può trasmetterla da sé. Confrontati con il nome del modello inviato upstream, esattamente o senza il prefisso 'provider--'. Oggi usato solo per i provider anthropic e openai; una voce sotto qualsiasi altro provider non ha effetto.
schema.providers._entry.substitute_models.label=Modelli sostitutivi
schema.providers._entry.substitute_models.description=Ridenominazioni di modelli per questo provider: una richiesta che nomina 'from' (corrispondenza esatta, maiuscole e minuscole comprese) viene inoltrata come 'to'; prevale la prima voce corrispondente e le ridenominazioni non si concatenano. La risposta e l’utilizzo registrato per il costo riportano quindi il modello inoltrato, non il nome inviato dal client. Letto sulle route anthropic, aws-bedrock e google, sulla route chat completions di openrouter e sulle route di previsione SAP RPT (/sap/v1/rpt, dalla lista sap-rpt), ciascuna per il proprio provider; su /openai/v1/chat/completions e /openai/v1/responses viene consultato prima l’elenco openai, poi l’elenco perplexity.
schema.providers._entry.substitute_models.items.from.label=Da
schema.providers._entry.substitute_models.items.from.description=Il nome del modello inviato dal client.
schema.providers._entry.substitute_models.items.to.label=A
schema.providers._entry.substitute_models.items.to.description=Il nome del modello inoltrato a SAP AI Core, di solito un id di modello distribuito come anthropic--claude-4.5-sonnet--deployed.
schema.providers._entry.substitute_models.items.description.label=Descrizione
schema.providers._entry.substitute_models.items.description.description=Nota a testo libero su questa ridenominazione, per chi leggerà la configurazione in seguito. Attualmente ignorata dal gateway; non cambia nulla nel comportamento della ridenominazione.
schema.providers._entry.unsupported_params.label=Parametri non supportati
schema.providers._entry.unsupported_params.description=Parametri di richiesta che questo provider o modello non accetta. Il gateway li rimuove prima dell’inoltro a SAP AI Core, che altrimenti rifiuterebbe la richiesta con 400 "does not support parameters: [...]". Un elenco per modello sostituisce l’elenco a livello di provider anziché aggiungersi a esso.
schema.providers._entry.param_renames.label=Ridenominazioni dei parametri
schema.providers._entry.param_renames.description=Ridenominazioni dei parametri applicate sul percorso di deployment diretto, ad esempio da max_tokens a max_completion_tokens per i modelli di ragionamento OpenAI che rifiutano max_tokens. Una mappa per modello sostituisce la mappa a livello di provider anziché aggiungersi a essa.
schema.providers._entry.supports_responses_api.label=Supporta la Responses API
schema.providers._entry.supports_responses_api.description=Indica se questo provider o modello può essere servito su /openai/v1/responses. Se assente, resta valida la regola integrata per famiglia, che ammette GPT-5 distribuito e successivi e la serie o.
schema.providers._entry.supports_prompt_caching.label=Supporta la cache dei prompt
schema.providers._entry.supports_prompt_caching.description=Indica se i modelli di questo provider ricevono i breakpoint della cache dei prompt di Anthropic. Ordine di risoluzione: il flag per modello models.overrides.<model>.supports_prompt_caching, poi questo flag a livello di provider, poi un valore predefinito true per il provider anthropic e false per tutti gli altri. Impostare false dove la cache funziona costa il prezzo pieno dell’input non in cache a ogni turno, mentre un true superfluo è risultato senza effetto - quindi disattivarlo solo per un modello noto per rifiutarlo.
schema.models.label=Modelli
schema.models.overrides.label=Sostituzioni
schema.models.overrides.description=Correzioni per modello unite all’elenco dei modelli che il gateway recupera da SAP AI Core. Ogni chiave è l’id interno di un modello, scritto esattamente come appare nella trasmissione.
schema.models.overrides._entry.description=Correzioni per un modello, unite a quanto SAP AI Core riporta per esso e con l’id interno del modello come chiave sopra. L’unione è volutamente aperta: qualsiasi chiave non elencata sotto viene copiata così com’è nel modello e ripubblicata nell’elenco dei modelli, senza convalida né tipo, anziché essere ignorata. I campi sotto sono quelli su cui agisce il gateway stesso.
schema.models.overrides._entry.hooks.label=Hook
schema.models.overrides._entry.hooks.description=Hook per questo modello, con il sottopercorso di richiesta che attivano come chiave (invoke, invoke-with-response-stream, converse, ...). Un sottopercorso elencato qui SOSTITUISCE il valore predefinito dell’endpoint in hooks.defaults per quel sottopercorso anziché unirsi a esso; un sottopercorso non elencato ricade su quel valore predefinito. Un hook scatta solo quando ogni regola del suo request.match è soddisfatta, e request.callback.id indica il plug-in da eseguire.
schema.models.overrides._entry.hooks._entry.description=L’elenco degli hook di un sottopercorso, provati in ordine. La stessa struttura serve hooks.defaults.<endpoint>.<subpath> e models.overrides.<model>.hooks.<subpath>, quindi il gateway vede un’unica struttura, chiunque dei due la fornisca. Un hook scatta solo quando OGNI regola indicata dal suo request.match corrisponde alla richiesta; request.callback.id indica quindi il plug-in da eseguire per la fase in corso. Un hook il cui match non è soddisfatto, o il cui callback non indica alcun plug-in registrato per quella fase, viene saltato e si prova il successivo - nessuno dei due casi è un errore in fase di esecuzione.
schema.models.overrides._entry.hooks._entry.items.request.label=Richiesta
schema.models.overrides._entry.hooks._entry.items.request.description=Ciò che deve corrispondere e ciò che va eseguito quando corrisponde. Prende il nome dalla richiesta perché il confronto esamina sempre e solo la richiesta in ingresso; non esiste una controparte per la risposta, e nient’altro di un hook viene letto.
schema.models.overrides._entry.hooks._entry.items.request.callback.label=Callback
schema.models.overrides._entry.hooks._entry.items.request.callback.description=Il plug-in da eseguire dopo che ogni regola in match ha trovato corrispondenza.
schema.models.overrides._entry.hooks._entry.items.request.callback.id.label=ID
schema.models.overrides._entry.hooks._entry.items.request.callback.id.description=L’id con cui un plug-in si è registrato, cercato nel registro dei plug-in del gateway per la fase in esecuzione. Questo schema non può verificare il riferimento incrociato: un id che nessun plug-in ha registrato per quella fase viene registrato nel log come non trovato e l’hook viene saltato, quindi la richiesta passa senza modifiche anziché fallire.
schema.models.overrides._entry.hooks._entry.items.request.match.label=Corrispondenza
schema.models.overrides._entry.hooks._entry.items.request.match.description=Gli id delle regole che devono corrispondere TUTTI, valutati in ordine e abbandonati al primo che non corrisponde. Ogni id è una chiave in hooks.definitions - un riferimento incrociato che questo schema non può verificare: un id non definito lì registra un avviso e fa sì che l’intero hook non corrisponda, quindi un errore di battitura disattiva il plug-in silenziosamente anziché farlo scattare incondizionatamente. Un elenco vuoto viene rifiutato, perché un hook destinato a essere eseguito su quasi tutto si scrive indicando invece una regola volutamente ampia - la regola fornita payload:any corrisponde a qualsiasi richiesta il cui corpo analizzato contenga un model stringa non vuoto, il che è quanto di più vicino all’incondizionato possa essere una regola, pur dichiarandolo apertamente.
schema.models.overrides._entry.subpaths_native.label=Sottopercorsi nativi
schema.models.overrides._entry.subpaths_native.description=I sottopercorsi che questo modello serve in modo nativo, con la grafia propria del gateway (invoke, invoke-with-response-stream, converse, converse-stream). Letto come elenco completo: finché è presente, ogni sottopercorso che vi manca conta come emulato. Se assente, si ricade su invoke più invoke-with-response-stream. Sostituisce il valore proprio dell’elenco dei modelli, viene ripubblicato nella voce del modello, e una voce che termina in -stream alimenta anche la regola streamingSupported sotto.
schema.models.overrides._entry.subpaths_emulated.label=Sottopercorsi emulati
schema.models.overrides._entry.subpaths_emulated.description=I sottopercorsi che questo modello raggiunge tramite emulazione del gateway anziché in modo nativo. Nulla viene instradato in base a questo - un sottopercorso conta come emulato semplicemente perché manca in subpaths_native -, quindi l’elenco è solo dichiarativo: sostituisce il valore proprio dell’elenco dei modelli e viene ripubblicato nella voce del modello per i client che lo esaminano, e nient’altro.
schema.models.overrides._entry.streamingSupported.label=Streaming supportato
schema.models.overrides._entry.streamingSupported.description=Indica se questo modello supporta le risposte in streaming; in camelCase perché è la grafia propria di SAP AI Core nell’elenco dei modelli. Per un modello che abbia una voce in overrides: un true o false esplicito qui prevale; altrimenti una voce di subpaths_native che termina in -stream significa true, a meno che l’elenco dei modelli non indicasse già false; altrimenti un modello con accesso tramite deployment che ha una voce ma nessun valore esplicito viene forzato a FALSE - quindi aggiungere una voce per un deployment con streaming omettendo questo flag disattiva lo streaming. Un modello di base conserva il suo valore di AI Core. Il risultato si applica a ogni versione del modello.
schema.models.overrides._entry.supports_prompt_caching.label=Supporta la cache dei prompt
schema.models.overrides._entry.supports_prompt_caching.description=Indica se questo modello riceve i breakpoint della cache dei prompt di Anthropic. Ordine di risoluzione: questo flag per modello, poi il flag a livello di provider api_config.providers.<provider>.supports_prompt_caching, poi un valore predefinito true per i modelli del provider Anthropic e false per tutti gli altri. Impostarlo su false per escludere un modello; un true su un modello Anthropic senza sostituzione a livello di provider non cambia nulla.
schema.models.overrides._entry.anthropic_version.label=Versione di Anthropic
schema.models.overrides._entry.anthropic_version.description=La anthropic_version che il gateway inserisce nel corpo della richiesta invoke di Bedrock di questo modello quando il chiamante non ne fornisce alcuna. Un corpo che contiene già il campo resta invariato, e i sottopercorsi diversi da invoke non vengono toccati. Il valore fornito è bedrock-2023-05-31.
schema.models.overrides._entry.pseudonymization.label=Pseudonimizzazione
schema.models.overrides._entry.pseudonymization.description=Impostazioni del plug-in di pseudonimizzazione. L’attivazione (enabled) e gli interruttori per categoria (entities) valgono solo per questo plug-in; il mascheramento avviene solo quando il plug-in viene effettivamente eseguito per una richiesta - deve essere registrato nella catena degli hook e deve scattare una fonte di attivazione.
schema.models.overrides._entry.pseudonymization.enabled.label=Abilitato
schema.models.overrides._entry.pseudonymization.enabled.description=Forza l’attivazione del mascheramento per una richiesta. Letto solo dove questo blocco si trova sotto models.overrides.<model>.pseudonymization o hooks.defaults.<endpoint>.pseudonymization: true lì maschera quella richiesta, e il blocco per modello prevale su quello per endpoint. False o assente non forza nulla - il mascheramento può comunque essere eseguito quando scatta un’altra fonte di attivazione, come una parola chiave di attivazione o un campo di mascheramento nel corpo della richiesta. Sotto observability.pseudonymization questa chiave è attualmente ignorata; quel livello fornisce tutte le altre impostazioni qui presenti tranne method e allow_user_bypass. In ogni caso il plug-in deve essere collegato alla catena degli hook, altrimenti non viene mascherato nulla.
schema.models.overrides._entry.pseudonymization.method.label=Metodo
schema.models.overrides._entry.pseudonymization.method.description=Modalità di mascheramento: `pseudonymization` maschera la richiesta e smaschera la risposta; `anonymization` maschera e non smaschera mai. Letto solo dove questo blocco forza l’attivazione del mascheramento (un hook abilitato o una sostituzione di modello), non sotto `observability.pseudonymization`. Condiziona anche il SIEM: solo `pseudonymization` conserva la risposta mascherata, quindi con `anonymization` un sink di contenuti riceve il prompt ma non la risposta. Se omesso, si ricade su `pseudonymization`. Modalità: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.models.overrides._entry.pseudonymization.allow_user_bypass.label=Consenti l’esclusione da parte dell’utente
schema.models.overrides._entry.pseudonymization.allow_user_bypass.description=Ha effetto solo all’interno di un blocco di attivazione forzata (un hook abilitato o una sostituzione di modello); non viene letto sotto `observability.pseudonymization`. Valore predefinito false. Se true, un chiamante può saltare il mascheramento tramite l’header `x-sail-proxy-pseudonymization: off` (senza distinzione tra maiuscole e minuscole) o il campo del corpo `pseudonymization_off: true`: il contenuto raggiunge il LLM non mascherato e, dove un sink SIEM abilitato imposta sia `include_content` sia `allow_unmasked_content`, anche quel sink. Dettagli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.models.overrides._entry.pseudonymization.entities.label=Entità
schema.models.overrides._entry.pseudonymization.entities.description=Interruttori di mascheramento per categoria: `true` maschera la categoria a questo livello, `false` no, e una categoria non elencata eredita il livello inferiore (i livelli successivi prevalgono). Le chiavi sono l’insieme delle categorie note: le categorie attive per impostazione predefinita; tre facoltative fornite disattivate (`profile-org`, `profile-location`, `profile-ip-address`); e `profile-sensitive-data`, un interruttore generale che le attiva tutte tranne quelle tre. Una chiave fuori dall’insieme viene rifiutata qui. Categorie e livelli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.models.overrides._entry.pseudonymization.org_suffixes.label=Suffissi di organizzazione
schema.models.overrides._entry.pseudonymization.org_suffixes.description=Suffissi di forma giuridica che contrassegnano una sequenza di parole come nome di organizzazione, ad es. Inc, LLC, GmbH. Il confronto distingue volutamente tra maiuscole e minuscole, quindi un 'limited' minuscolo in un testo non viene deliberatamente trattato come forma giuridica; ogni voce corrisponde inoltre scritta tutta in maiuscolo, quindi una fattura che riporta ACME GMBH viene riconosciuta come la stessa organizzazione di Acme GmbH. Ha effetto solo finché profile-org è abilitato in entities; abilitare profile-org con questo elenco vuoto NON maschera nulla come organizzazione e registra un avviso. Ogni voce viene ripulita dagli spazi prima del confronto, e una voce vuota o composta solo da spazi viene scartata silenziosamente anziché rifiutata.
schema.models.overrides._entry.pseudonymization.location_gazetteer.label=Gazetteer delle località
schema.models.overrides._entry.pseudonymization.location_gazetteer.description=Termini di località letterali che il rilevatore strutturale maschera - senza distinzione tra maiuscole e minuscole, e solo come parola o frase intera; nulla viene dedotto dalle maiuscole o dal contesto. Ha effetto solo finché profile-location è abilitato in entities; abilitare profile-location con questo elenco vuoto NON maschera nulla come località e registra un avviso. Ogni voce viene ripulita dagli spazi, e una voce vuota o composta solo da spazi viene scartata silenziosamente. Fornito vuoto: i nomi di luogo dipendono dall’installazione e questo repository è pubblico, quindi popolarlo tramite questa app di configurazione di amministrazione, mai nel codice versionato.
schema.models.overrides._entry.pseudonymization.min_confidence.label=Confidenza min.
schema.models.overrides._entry.pseudonymization.min_confidence.description=Quante prove richiede un valore rilevato prima di essere mascherato, da 0 a 1 (predefinito 0.5). Un valore viene mascherato quando il suo punteggio raggiunge la soglia; un semplice nome con iniziale maiuscola ottiene circa 0.5, un pattern convalidato da checksum 0.95, una regola personalizzata 1.0. Alzare la soglia esclude prima i nomi semplici, quindi per rendere più severa una sola categoria rumorosa usare invece `thresholds`. Le regole personalizzate, gli identificatori convalidati e le credenziali non vengono mai abbassati dal contesto. Dettagli sul punteggio: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.models.overrides._entry.pseudonymization.thresholds.label=Soglie
schema.models.overrides._entry.pseudonymization.thresholds.description=Soglie di confidenza per categoria, ciascuna da 0 a 1, che sostituiscono `min_confidence` per le categorie indicate; una non elencata mantiene `min_confidence`. Il punto in cui essere severi su una sola categoria rumorosa - `profile-person` a 0.65 richiede più prove per i nomi mentre gli identificatori convalidati restano alla soglia globale. Le chiavi sono lo stesso insieme di categorie note accettato da `entities`; `profile-sensitive-data` è accettato ma non fa nulla. Regolazione per categoria: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.models.overrides._entry.pseudonymization.allowlist.label=Lista consentiti
schema.models.overrides._entry.pseudonymization.allowlist.description=Valori che questa installazione non maschera mai - un interruttore di SPEGNIMENTO, per valore. Consultata prima del punteggio di confidenza, quindi un valore elencato è esente per quante prove ci siano. Usarla per un falso positivo ricorrente con un nome proprio - un titolo di prodotto o di report che sembra una persona. Gli elenchi dei livelli vengono CONCATENATI, non sostituiti, quindi un livello inferiore aggiunge solo un’esenzione, non ne rimuove mai una. `terms` rispetto a `patterns`, e il rischio delle voci troppo ampie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.allowlist.terms.label=Termini
schema.models.overrides._entry.pseudonymization.allowlist.terms.description=Valori letterali, confrontati con l’intero valore rilevato e DISTINGUENDO tra maiuscole e minuscole. La distinzione è voluta: 'Watson Studio' è il prodotto che un operatore intendeva esentare e 'watson studio' in una frase no, e un elenco senza distinzione esenterebbe anche una persona il cui cognome si scrive per caso allo stesso modo. Un termine corrisponde solo a un valore che i rilevatori hanno prodotto per intero - elencare 'Studio' non esenta 'Watson Studio'. Ogni voce qui è un interruttore di SPEGNIMENTO del mascheramento per quel valore esatto, quindi limitare l’elenco a valori che non sono mai davvero dati personali: un termine che per caso è il nome di qualcuno esenta quella persona dal mascheramento ovunque in questa installazione, silenziosamente e senza nulla nel log che lo segnali.
schema.models.overrides._entry.pseudonymization.allowlist.patterns.label=Pattern
schema.models.overrides._entry.pseudonymization.allowlist.patterns.description=Espressioni regolari (JavaScript), ciascuna confrontata con l’INTERO valore rilevato: il gateway racchiude da sé ogni voce in `^(?: )$`, quindi scrivere `Z[A-Z0-9_]+`, non `^Z[A-Z0-9_]+$`. Il confronto distingue tra maiuscole e minuscole. Ogni voce è un interruttore di SPEGNIMENTO del mascheramento, e una voce ampia disattiva il mascheramento senza errori - `[A-Z].*` disattiva quasi tutti i nomi di persona rilevati. Una corrispondenza con un campione PII integrato genera un avviso ma viene COMUNQUE applicata. Mantenere ogni voce ristretta. Dettagli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.saturation_warn.label=Avviso di saturazione
schema.models.overrides._entry.pseudonymization.saturation_warn.description=Quanti valori mascherati DISTINTI può contenere una richiesta prima di essere segnalata come satura (predefinito 40). Solo segnalazione - non cambia mai ciò che viene mascherato. Oltre questo numero il gateway registra un avviso per richiesta con i conteggi per categoria e le FORME di valore più comuni (lettere come X, cifre come 9); nessun valore mascherato compare mai. L’evento SIEM di utilizzo della richiesta contiene gli stessi conteggi con un flag `saturated` - conteggi, non testo. Come leggere il report: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.models.overrides._entry.pseudonymization.unknown_placeholders.label=Segnaposto inventati
schema.models.overrides._entry.pseudonymization.unknown_placeholders.description=Che cosa succede quando una risposta contiene un segnaposto mascherato mai inviato al modello. I modelli ne inventano uno in circa 1 risposta pseudonimizzata su 125, e più spesso quanti più valori una richiesta maschera; un tale segnaposto non indica nessuno e non può mai essere risolto. withhold (predefinito): viene sostituito con un semplice contrassegno come [name withheld] e segnalato come evento di sicurezza. report: viene solo segnalato e raggiunge il client invariato, per un’installazione i cui sviluppatori scrivono nuovi segnaposto nei dati di test tramite il gateway. off: nessuna delle due cose. Un segnaposto che il client stesso ha inviato nella stessa richiesta non viene mai considerato inventato.
schema.models.overrides._entry.unsupported_params.label=Parametri non supportati
schema.models.overrides._entry.unsupported_params.description=Parametri di richiesta che questo provider o modello non accetta. Il gateway li rimuove prima dell’inoltro a SAP AI Core, che altrimenti rifiuterebbe la richiesta con 400 "does not support parameters: [...]". Un elenco per modello sostituisce l’elenco a livello di provider anziché aggiungersi a esso.
schema.models.overrides._entry.param_renames.label=Ridenominazioni dei parametri
schema.models.overrides._entry.param_renames.description=Ridenominazioni dei parametri applicate sul percorso di deployment diretto, ad esempio da max_tokens a max_completion_tokens per i modelli di ragionamento OpenAI che rifiutano max_tokens. Una mappa per modello sostituisce la mappa a livello di provider anziché aggiungersi a essa.
schema.models.overrides._entry.supports_responses_api.label=Supporta la Responses API
schema.models.overrides._entry.supports_responses_api.description=Indica se questo provider o modello può essere servito su /openai/v1/responses. Se assente, resta valida la regola integrata per famiglia, che ammette GPT-5 distribuito e successivi e la serie o.
schema.models.overrides._entry.cachePricing.label=Prezzi della cache
schema.models.overrides._entry.cachePricing.description=Prezzi della cache dei prompt per questo modello; in camelCase di proposito, la grafia cache_pricing non viene letta. Entrambi i valori sono STRINGHE di costo decimale per 1K token, mai numeri: vengono riportati invariati nell’elenco dei costi di ogni versione e consegnati a chiunque chieda i prezzi della cache di questo modello. Se assente, questo modello non riporta alcun prezzo della cache.
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.label=Costo dell’input in lettura dalla cache per 1K
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.description=Costo della lettura di 1K token di input in cache, come stringa decimale - ad es. 0.00020, non 0.0002e0 e non un numero.
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.label=Costo dell’input di creazione della cache per 1K
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.description=Costo della scrittura di 1K token di input nella cache, come stringa decimale - ad es. 0.00254, non un numero.
schema.models.overrides._entry.inject_beta_features.label=Inserisci funzionalità beta
schema.models.overrides._entry.inject_beta_features.description=Flag delle funzionalità beta di Anthropic che il gateway aggiunge alle richieste invoke di Bedrock di questo modello. Vengono uniti all’header anthropic-beta e a qualsiasi anthropic_beta presente nel corpo della richiesta, poi filtrati tramite supported_beta_headers, excluded_beta_headers e la quarantena dei flag beta in fase di esecuzione - quindi un flag elencato qui viene comunque scartato se non è ammesso. Un elenco vuoto non inserisce nulla.
schema.models.overrides._entry.contextLength.label=Lunghezza del contesto
schema.models.overrides._entry.contextLength.description=La finestra di contesto di questo modello in token, usata solo come riserva: il gateway preferisce la lunghezza del contesto propria dell’ultima versione indicata da SAP AI Core e legge questo valore solo quando l’elenco dei modelli non ne riporta alcuna, prima di ricadere su un valore predefinito per famiglia. Viene riportata come context_length, e la sua metà come max_completion_tokens, negli elenchi dei modelli in formato OpenRouter e OpenAI. 0 non è un valore utilizzabile.
schema.capabilities.label=Funzionalità
schema.capabilities.web_search.label=Ricerca web
schema.capabilities.web_search.description=Strumento di ricerca web ospitato (basato su Perplexity). L’unica impostazione qui limita quante ricerche può eseguire una singola richiesta.
schema.capabilities.web_search.max_searches_per_request.label=Ricerche max. per richiesta
schema.capabilities.web_search.max_searches_per_request.description=Limite di ricerche web ospitate che una richiesta può eseguire prima che il gateway smetta di proseguire il turno. Ogni ricerca costa una chiamata a Perplexity più un intero ciclo di andata e ritorno con il deployment, quindi è un controllo dei costi oltre che la garanzia di terminazione del ciclo di continuazione. Un valore non intero, zero, negativo o superiore a 10 ricade sul valore predefinito 3 anziché essere rispettato - il limite non deve mai poter essere eliminato tramite configurazione.
schema.capabilities.file_search.label=Ricerca nei file
schema.capabilities.file_search.description=Recupero di documenti compatibile con OpenAI: acquisizione tramite /v1/files, /v1/vector_stores, ricerca ibrida e lo strumento ospitato file_search. Nulla qui è obbligatorio - ogni campo ricade sul proprio valore predefinito fornito quando è assente, quindi eliminare un campo è una modifica valida, non un errore.
schema.capabilities.file_search.enabled.label=Abilitato
schema.capabilities.file_search.enabled.description=Interruttore principale dell’intera funzionalità, predefinito true. Si combina con "è configurato un database" e "la migrazione è stata eseguita": false fa rispondere ogni route /v1/files e /v1/vector_stores con 503 file_search_unavailable. Il worker di acquisizione (che esegue anche il reincorporamento) e le due pulizie periodiche lo controllano solo all’avvio, quindi dopo una modifica riavviare il gateway. File e store già memorizzati restano invariati.
schema.capabilities.file_search.embedding_model.label=Modello di embedding
schema.capabilities.file_search.embedding_model.description=Modello di embedding richiesto al deployment di orchestrazione di SAP AI Core e registrato in ogni evento del teacher log. Predefinito text-embedding-3-large. Ogni vector store mantiene il modello con cui è stato creato: le sue ricerche e i suoi nuovi file usano quel modello, quindi modificare questa impostazione lascia invariati gli store esistenti. Compaiono come obsoleti nel cockpit Grounding, dove il proprietario o un amministratore può reincorporarli con il nuovo modello; fino ad allora continuano a rispondere con i vecchi vettori. Un modello con un’altra larghezza del vettore richiede anche di modificare embedding_dimensions, e la reincorporazione non può cambiare la larghezza di uno store.
schema.capabilities.file_search.embedding_dimensions.label=Dimensioni dell’embedding
schema.capabilities.file_search.embedding_dimensions.description=Larghezza del vettore, inviata come parametro dimensions del modello di embedding e usata per creare la colonna dei vettori. Predefinito 1536, e fisso una volta che esiste uno store: un vettore di risposta di qualsiasi altra lunghezza viene rifiutato, e ogni store vincolato alla vecchia larghezza risponde 409 - sia a una RICERCA sia a un collegamento, quindi smette di rispondere alle query e non può più accettare altri file. Resta elencabile, recuperabile ed eliminabile. Modificare questo valore su un’installazione popolata lascia quindi i suoi store bloccati anziché migrarli: la reincorporazione dal cockpit Grounding mantiene la larghezza di uno store, quindi uno store del genere richiede una migrazione da parte di un operatore.
schema.capabilities.file_search.rewrite_query.label=Riscrivi la query
schema.capabilities.file_search.rewrite_query.description=Indica se POST /v1/vector_stores/{id}/search riscrive la query del chiamante tramite il deployment di orchestrazione prima di calcolarne l’embedding. Predefinito false. Costa circa 1.3s per ricerca ed è best-effort - una riscrittura non riuscita ricade sulla query originale e non fa mai fallire la ricerca. Solo quel percorso REST legge questo valore, un rewrite_query per richiesta lo sostituisce, e lo STRUMENTO ospitato file_search passa sempre false perché il modello ha già trasformato il turno dell’utente in una query.
schema.capabilities.file_search.rewrite_query_model.label=Modello di riscrittura della query
schema.capabilities.file_search.rewrite_query_model.description=Modello usato per la chiamata di riscrittura, predefinito gpt-5-mini. Configurabile anziché fisso perché un nome di modello valido su un tenant di SAP AI Core può essere rifiutato da un altro. Consultato solo quando rewrite_query è attivo.
schema.capabilities.file_search.hybrid.label=Ibrido
schema.capabilities.file_search.hybrid.description=Recupero della fase 1 e riordinamento facoltativo della fase 2. La fase 1 esegue una classifica per similarità vettoriale e - quando lexical_enabled - una classifica full-text, fonde le due con la reciprocal rank fusion e passa i primi `candidates` chunk al reranker.
schema.capabilities.file_search.hybrid.rrf_k.label=k di RRF
schema.capabilities.file_search.hybrid.rrf_k.description=Costante della reciprocal rank fusion: ogni classifica contribuisce 1/(k + rank) al punteggio fuso di un chunk. Predefinito 60. Una k più grande appiattisce la differenza tra posizioni vicine, quindi l’accordo tra le due classifiche conta più del primo risultato di ciascuna; una più piccola lascia dominare la testa di ogni classifica. Registrata in ogni evento del teacher log, quindi una modifica è visibile nelle etichette.
schema.capabilities.file_search.hybrid.lexical_enabled.label=Lessicale abilitato
schema.capabilities.file_search.hybrid.lexical_enabled.description=Indica se la classifica full-text viene eseguita accanto a quella vettoriale. Predefinito true. False fonde solo la classifica vettoriale, quindi le corrispondenze esatte di parole chiave e identificatori che gli embedding non colgono non vengono più recuperate affatto.
schema.capabilities.file_search.hybrid.lexical_query.label=Query lessicale
schema.capabilities.file_search.hybrid.lexical_query.description=Come la classifica full-text confronta la query. "any" (predefinito) mantiene le parole della query che non sono stop word comuni inglesi o tedesche né un singolo carattere (una lettera o una cifra isolata) e trova un chunk che ne contiene almeno una, quindi una domanda scritta come frase trova comunque i chunk con i suoi termini chiave; i chunk con più termini si classificano più in alto. "all" trova solo i chunk che contengono ogni parola della query, stop word incluse - il comportamento delle versioni precedenti, che una domanda in linguaggio naturale soddisfa di rado. Si applica solo finché lexical_enabled è true.
schema.capabilities.file_search.hybrid.candidates.label=Candidati
schema.capabilities.file_search.hybrid.candidates.description=Quanti chunk fusi recupera la fase 1, predefinito 50. È la dimensione dell’input del reranker e quindi il suo costo per ricerca, ed è anche un limite massimo rigido della risposta: il max_num_results del chiamante viene applicato dopo, quindi nessuna ricerca può restituire più chunk di questo.
schema.capabilities.file_search.hybrid.rerank.label=Riordinamento
schema.capabilities.file_search.hybrid.rerank.description=Fase 2: un cross-encoder Cohere ospitato su SAP AI Core assegna un punteggio ai candidati della fase 1 rispetto alla query e restituisce un punteggio di pertinenza calibrato tra 0 e 1 - il punteggio su cui filtra ranking_options.score_threshold.
schema.capabilities.file_search.hybrid.rerank.enabled.label=Abilitato
schema.capabilities.file_search.hybrid.rerank.enabled.description=Tre stati, e i tre valori non sono gradi della stessa cosa. false non riordina mai: nessuna ricerca del deployment, nessuna chiamata, e i risultati mantengono l’ordine fuso. "auto" (il predefinito) è best-effort - nessun deployment di reranker in esecuzione, oppure una chiamata non riuscita, scaduta o malformata, ricade sull’ordine fuso anziché far fallire la ricerca. true RICHIEDE la fase 2: sia "nessun deployment trovato" sia "la chiamata non è riuscita" fanno invece fallire la ricerca, quindi a un operatore che ha chiesto il riordinamento non vengono mai serviti silenziosamente risultati non riordinati.
schema.capabilities.file_search.hybrid.rerank.model.label=Modello
schema.capabilities.file_search.hybrid.rerank.model.description=Il nome del modello usato sia per trovare il deployment del reranker - il primo deployment in stato RUNNING dello scenario foundation-models che serve un modello con esattamente questo nome - sia per la chiamata di riordinamento. Predefinito "cohere-reranker" - verificato dal vivo sul tenant, e NON il "cohere-reranker-35" pubblicato da SAP. Non è una scelta di provider: il gateway parla esattamente un protocollo di riordinamento e varia solo il nome del modello, per questo il teacher log registra sempre il provider come "cohere".
schema.capabilities.file_search.hybrid.rerank.input.label=Ingresso
schema.capabilities.file_search.hybrid.rerank.input.description=Che cosa legge il reranker per ogni chunk candidato. "context_and_text" (il predefinito): il contesto del chunk, se ne ha uno, seguito dal suo testo; i chunk senza contesto (suddivisione statica) vengono letti come il loro testo. "text": solo il testo del chunk. Il contesto non compare mai nei risultati di ricerca.
schema.capabilities.file_search.ann.label=Ricerca approssimata
schema.capabilities.file_search.ann.description=Ricerca vettoriale approssimata per vector store di grandi dimensioni, tramite l’indice HNSW. Disattivata per impostazione predefinita: la classifica vettoriale confronta allora la query con ogni chunk degli store cercati, il che è esatto ma richiede più tempo quanto più grandi sono gli store. Se attivata, una ricerca usa l’indice solo dove conviene e resta esatta negli altri casi: con un filtro sugli attributi, quando cerca al massimo exact_max_chunks chunk o meno di min_fraction di tutti i chunk memorizzati, finché l’indice non è ancora del tipo costruito dal comando rebuild-index, e con pgvector precedente alla 0.8. Per alcune domande la ricerca approssimata può restituire un elenco completo di passaggi che manca la maggior parte dei chunk più pertinenti, quindi misurane il recall sui tuoi dati con la sonda di recall prima di attivarla.
schema.capabilities.file_search.ann.enabled.label=Abilitato
schema.capabilities.file_search.ann.enabled.description=Se le ricerche su store di grandi dimensioni usano l’indice HNSW. Predefinito false: ogni ricerca è esatta. Quando l’indice restituisce meno chunk di quelli richiesti, la ricerca viene eseguita in modo esatto.
schema.capabilities.file_search.ann.exact_max_chunks.label=Chunk max. per ricerca esatta
schema.capabilities.file_search.ann.exact_max_chunks.description=Una ricerca su al massimo questo numero di chunk resta esatta, contati sugli store che cerca con uno stesso modello di embedding. Predefinito 20000. Lo stesso numero decide, che la ricerca approssimata sia attivata o no, quando la parte full-text di una ricerca viene limitata: una ricerca su più chunk esclude dalla sua query «una qualsiasi parola» le parole contenute in più del 5 per cento di tutti i chunk memorizzati, e classifica i passaggi con tutte le parole più al massimo altre 5000 corrispondenze full-text. Su una tabella analizzata, 0 limita la parte full-text di ogni ricerca.
schema.capabilities.file_search.ann.min_fraction.label=Frazione minima
schema.capabilities.file_search.ann.min_fraction.description=Una ricerca su meno di questa quota di tutti i chunk memorizzati resta esatta: lì la ricerca esatta è più veloce dell’indice. Predefinito 0.05 (5 per cento).
schema.capabilities.file_search.chunking.label=Suddivisione in chunk
schema.capabilities.file_search.chunking.description=Come i documenti di un NUOVO vector store vengono suddivisi in chunk. Uno store assume questi valori alla creazione e li mantiene: modificarli qui non risuddivide né altera mai uno store esistente. La configurazione fornita imposta "structure" a 800 token senza sovrapposizione, con contesti. Una chiave non impostata significa ciò che questo modulo mostra per essa: suddivisione statica senza contesti, quindi una configurazione di una versione precedente, o una senza questo blocco, mantiene la suddivisione statica. Gli store creati prima che esistesse questa impostazione usano la suddivisione statica 800/400. Un file collegato con una chunking_strategy statica esplicita viene invece suddiviso con quella strategia; "auto" o nessuna usa l’impostazione dello store. I valori vengono verificati alla creazione di uno store: chunk_overlap_tokens non deve superare la metà di max_chunk_size_tokens, e contextual richiede la strategia "structure". Se l’impostazione non è valida, i nuovi store ricevono invece la suddivisione statica 800/400 e il gateway registra un avviso.
schema.capabilities.file_search.chunking.strategy.label=Strategia
schema.capabilities.file_search.chunking.strategy.description="static" (il predefinito se non impostato) suddivide il testo in finestre sovrapposte di dimensione fissa, come la strategia statica di OpenAI e le versioni precedenti. "structure" (impostata nella configurazione fornita) segue le sezioni e i titoli del documento, così un chunk non supera il confine di una sezione; i file suddivisi in questo modo riportano il tipo di strategia di suddivisione "other" tramite l’API OpenAI. Attivare contextual richiede "structure".
schema.capabilities.file_search.chunking.max_chunk_size_tokens.label=Dimensione max. del chunk in token
schema.capabilities.file_search.chunking.max_chunk_size_tokens.description=Chunk più grande, in token, tra 100 e 4096. Predefinito 800. Con "static" la dimensione è una stima (numero di parole per 1.3); con "structure" è contata con un vero tokenizer.
schema.capabilities.file_search.chunking.chunk_overlap_tokens.label=Token di sovrapposizione dei chunk
schema.capabilities.file_search.chunking.chunk_overlap_tokens.description=Quanti token ogni chunk ripete dal precedente, così un passaggio diviso da un confine viene comunque recuperato per intero. Se non impostato: 0 con "structure", 400 con "static". Non deve superare la metà di max_chunk_size_tokens. Con "structure" la sovrapposizione vale solo all’interno di una sezione che richiede più di un chunk.
schema.capabilities.file_search.chunking.contextual.label=Contestuale
schema.capabilities.file_search.chunking.contextual.description=Se ogni chunk riceve anche un breve contesto, scritto da un modello linguistico, che lo colloca nel suo documento e viene cercato insieme a esso. Disattivato se non impostato. Richiede la strategia "structure"; aggiunge una chiamata al modello per chunk durante l’acquisizione, registrata come utilizzo del proprietario dello store.
schema.capabilities.file_search.contextual.label=Contesti dei chunk
schema.capabilities.file_search.contextual.description=Come vengono scritti i contesti dei chunk per i vector store la cui impostazione di suddivisione è contestuale: durante l’acquisizione un modello linguistico scrive un breve contesto per ogni chunk, che viene cercato insieme al chunk. Questi valori non attivano la suddivisione contestuale; lo fa l’impostazione di suddivisione dello store. Una chiamata non riuscita o scaduta lascia quel chunk senza contesto e non fa mai fallire il file.
schema.capabilities.file_search.contextual.model.label=Modello
schema.capabilities.file_search.contextual.model.description=Il modello di orchestrazione SAP AI Core che scrive i contesti. Predefinito "gemini-3.5-flash-lite". Se il modello non è disponibile, i file vengono acquisiti senza contesti. Il documento viene inviato con ogni chunk di un file; i modelli Claude lo memorizzano nella cache tra queste chiamate, gli altri modelli dove lo fanno da sé.
schema.capabilities.file_search.contextual.max_document_tokens.label=Dimensione max. del documento in token
schema.capabilities.file_search.contextual.max_document_tokens.description=Documento più grande, in token, inviato per intero con ogni chunk, tra 8192 e 200000. Predefinito 32000. Un documento più lungo viene inviato come estratto di questa dimensione attorno al chunk. Valori maggiori danno a ogni contesto più parte del documento, ma costano più token di input per chunk.
schema.capabilities.file_search.contextual.concurrency.label=Concorrenza
schema.capabilities.file_search.contextual.concurrency.description=Quante chiamate di contesto per un file vengono eseguite contemporaneamente, tra 1 e 16. Predefinito 4. Il primo chunk di un file viene sempre eseguito da solo.
schema.capabilities.file_search.contextual.request_timeout_ms.label=Timeout della richiesta (ms)
schema.capabilities.file_search.contextual.request_timeout_ms.description=Limite di tempo di una chiamata di contesto, in millisecondi. Predefinito 30000. Una chiamata che dura di più lascia il suo chunk senza contesto.
schema.capabilities.file_search.contextual.file_deadline_ms.label=Scadenza per file (ms)
schema.capabilities.file_search.contextual.file_deadline_ms.description=Tempo, in millisecondi, dopo il quale non parte più alcuna chiamata di contesto per un file. Predefinito 360000 (6 minuti). I chunk rimanenti vengono salvati senza contesto; il file viene comunque acquisito.
schema.capabilities.file_search.contextual.max_input_tokens_per_file.label=Token di input max. per file
schema.capabilities.file_search.contextual.max_input_tokens_per_file.description=Token di input che le chiamate di contesto di un file possono usare, token in cache inclusi, tra 10000 e 1000000000. Predefinito 20000000. Una volta che un file li ha usati, non parte più alcuna chiamata di contesto per esso; i chunk rimanenti vengono salvati senza contesto e il file viene comunque acquisito.
schema.capabilities.file_search.parent_sections.label=Sezioni padre
schema.capabilities.file_search.parent_sections.description=Come i risultati di ricerca dei vector store con suddivisione per struttura vengono estesi alla sezione da cui provengono, così che il modello legga una corrispondenza nel suo contesto. Più corrispondenze in una stessa sezione vengono restituite una sola volta, come quella sezione. I risultati degli store con suddivisione statica vengono restituiti così come sono.
schema.capabilities.file_search.parent_sections.max_tokens.label=Token max.
schema.capabilities.file_search.parent_sections.max_tokens.description=Sezione padre più grande restituita, in token, tra 200 e 8000. Predefinito 1500. Una sezione più lunga viene restituita come estratto di questa dimensione attorno alla corrispondenza; una corrispondenza già più lunga da sola viene restituita da sola.
schema.capabilities.file_search.parent_sections.scope.label=Ambito
schema.capabilities.file_search.parent_sections.scope.description=Dove i risultati vengono restituiti come sezioni padre: "tool" (il predefinito) solo nello strumento file_search dell’API Responses; "all" anche nell’endpoint di ricerca dei vector store, che altrimenti restituisce i chunk corrispondenti; "off" da nessuna parte.
schema.capabilities.file_search.limits.label=Limiti
schema.capabilities.file_search.limits.description=Limiti massimi rigidi su ciò che può essere caricato, estratto e collegato. Ciascuno viene applicato dove serve anziché da questo schema, quindi questi valori vengono letti dal vivo e hanno effetto senza riavvio.
schema.capabilities.file_search.limits.max_file_bytes.label=Byte max. per file
schema.capabilities.file_search.limits.max_file_bytes.description=Il caricamento più grande accettato da POST /v1/files, predefinito 33554432 byte (32 MiB). Applicato MENTRE il caricamento viene letto anziché dopo, quindi un corpo troppo grande viene troncato invece di essere bufferizzato in memoria, e il chiamante riceve un 4xx pulito che indica il limite.
schema.capabilities.file_search.limits.max_tokens_per_file.label=Token max. per file
schema.capabilities.file_search.limits.max_tokens_per_file.description=Il documento estratto più grande, in token stimati; predefinito 5000000. Un file oltre il limite fallisce in modo PERMANENTE anziché essere riprovato. Abbassare questo valore non ricontrolla i file già acquisiti.
schema.capabilities.file_search.limits.max_files_per_store.label=File max. per archivio vettoriale
schema.capabilities.file_search.limits.max_files_per_store.description=Limite massimo di file collegati a un vector store, predefinito 10000. Limita i file_ids accettati alla creazione di uno store - accanto a un limite rigido di 500 id di file per chiamata di creazione o di batch di file - e rifiuta un collegamento o un batch di file che porterebbe lo store oltre questo limite.
schema.capabilities.file_search.ingestion.label=Acquisizione
schema.capabilities.file_search.ingestion.description=Il worker in background che estrae, suddivide in chunk, calcola gli embedding e memorizza un file collegato, e reincorpora i file di uno store il cui modello di embedding è in fase di modifica - prima i caricamenti. Preleva il lavoro dallo stesso pool di database di file_search usato dal percorso di ricerca, quindi queste impostazioni bilanciano il throughput di acquisizione con la latenza di ricerca.
schema.capabilities.file_search.ingestion.concurrency.label=Concorrenza
schema.capabilities.file_search.ingestion.concurrency.description=Quanti cicli di prelievo ed elaborazione avvia il worker, predefinito 4; gli stessi cicli eseguono anche il reincorporamento. Ciascuno prende connessioni dal pool di file_search da 10 connessioni per i propri passaggi sul database. Letto una volta all’avvio, quindi una modifica richiede un riavvio.
schema.capabilities.file_search.ingestion.extract_timeout_ms.label=Timeout di estrazione (ms)
schema.capabilities.file_search.ingestion.extract_timeout_ms.description=Limite di tempo per convertire un documento in testo con un convertitore esterno - PDF, docx, odt, epub e rst - predefinito 60000 ms. I formati di testo semplice vengono decodificati direttamente e non hanno limite. Un timeout fa fallire quel tentativo, non il batch; il file viene ritentato fino a max_retries volte.
schema.capabilities.file_search.ingestion.max_retries.label=Tentativi max.
schema.capabilities.file_search.ingestion.max_retries.description=Tentativi per file prima che venga dichiarato non riuscito, predefinito 3; lo stesso budget si applica a ogni file di un reincorporamento. Un intero pari o superiore a 1 viene usato così com’è. 0 viene letto come 1, con un avviso - preso alla lettera farebbe fallire ogni file collegato prima del suo primo tentativo. Qualsiasi altro valore - negativo, frazionario, non numerico - conta come non impostato e ricade su 3, anche in questo caso con un avviso.
schema.capabilities.file_search.parsing.label=Analisi dei documenti
schema.capabilities.file_search.parsing.description=Come vengono letti i documenti caricati prima di essere suddivisi in blocchi.
schema.capabilities.file_search.parsing.ocr.label=Riconoscimento del testo (OCR)
schema.capabilities.file_search.parsing.ocr.description=Riconoscimento del testo per le pagine PDF senza livello di testo, come le scansioni. Viene eseguito dove è installato il programma tesseract (le immagini Docker e Kyma lo includono con l'inglese); la CLI npm autonoma non lo esegue mai.
schema.capabilities.file_search.parsing.ocr.languages.label=Lingue OCR
schema.capabilities.file_search.parsing.ocr.languages.description=Codici lingua di Tesseract riconosciuti su una pagina, come eng, deu o chi_sim; predefinito eng. Un codice richiede che i suoi dati linguistici siano installati dove viene eseguito il gateway; un codice non installato viene saltato con un avviso nel log del gateway. Ogni lingua aggiunta rende l'OCR più lento.
schema.capabilities.file_search.parsing.vision.label=Trascrizione con visione
schema.capabilities.file_search.parsing.vision.description=Trascrizione delle pagine PDF difficili da parte di un modello di visione di SAP AI Core: una pagina viene inviata come immagine e il modello ne scrive il testo, tabelle comprese. Viene eseguita solo per i vector store la cui impostazione di suddivisione ha una modalità di visione (disattivata per impostazione predefinita; cambiare la modalità di uno store lo suddivide di nuovo). Ogni pagina è una chiamata al modello, registrata come utilizzo del proprietario dello store; una pagina la cui chiamata non riesce mantiene il suo testo o passa al riconoscimento del testo (OCR). Le immagini delle pagine non vengono mascherate: dove la pseudonimizzazione è forzata per il contenuto di file_search (per l’endpoint openai o per un modello), raggiungono il modello senza mascheramento, e il cockpit e il log del gateway lo segnalano. Il mascheramento richiesto da una singola richiesta (una parola chiave o un campo di mascheramento) non è prevedibile e non viene segnalato. La CLI npm autonoma non la esegue mai.
schema.capabilities.file_search.parsing.vision.model.label=Modello
schema.capabilities.file_search.parsing.vision.model.description=Il modello di orchestrazione SAP AI Core che trascrive le pagine; deve leggere le immagini. Predefinito "gemini-3.5-flash-lite". Se il modello non è disponibile, nessun vector store può passare a una modalità di visione.
schema.capabilities.file_search.parsing.vision.default_mode.label=Modalità predefinita
schema.capabilities.file_search.parsing.vision.default_mode.description=La modalità di visione che ricevono i nuovi vector store: off (predefinita, nessuna chiamata di visione), no_text (pagine senza livello di testo, come le scansioni), auto (queste, le pagine con poco testo come le figure e le pagine ricche di tabelle) o all (ogni pagina). Gli store esistenti mantengono la propria modalità. Dove la pseudonimizzazione è forzata per il contenuto di file_search, le immagini delle pagine raggiungono il modello senza mascheramento (viene mostrato un avviso); lo stesso vale, senza avviso, per il mascheramento richiesto da una singola richiesta.
schema.capabilities.file_search.parsing.vision.max_pages_per_file.label=Pagine max. per file
schema.capabilities.file_search.parsing.vision.max_pages_per_file.description=Numero massimo di pagine di un file inviate al modello, tra 1 e 1000. Predefinito 50. Le pagine rimanenti mantengono il loro testo o passano al riconoscimento del testo (OCR).
schema.capabilities.file_search.parsing.vision.concurrency.label=Concorrenza
schema.capabilities.file_search.parsing.vision.concurrency.description=Quante pagine di un file vengono trascritte contemporaneamente, tra 1 e 8. Predefinito 2.
schema.capabilities.file_search.parsing.vision.request_timeout_ms.label=Timeout della richiesta (ms)
schema.capabilities.file_search.parsing.vision.request_timeout_ms.description=Limite di tempo della chiamata di una pagina, in millisecondi. Predefinito 90000. Una pagina la cui chiamata dura di più mantiene il suo testo o passa al riconoscimento del testo (OCR).
schema.capabilities.file_search.parsing.vision.file_deadline_ms.label=Scadenza per file (ms)
schema.capabilities.file_search.parsing.vision.file_deadline_ms.description=Tempo massimo, in millisecondi, che la visione può dedicare a un file, e al massimo il 40 % del tempo rimanente per l’acquisizione del file. Predefinito 240000 (4 minuti). Dopo non parte nessun’altra pagina; il file viene comunque acquisito.
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.label=Token di input max. per file
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.description=Token di input che le chiamate di un file possono usare, tra 10000 e 100000000. Predefinito 150000 (una pagina ne usa circa 1250). Una volta che un file li ha usati, non parte più alcuna pagina per esso.
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.label=Token di output max. per file
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.description=Token di output che le chiamate di un file possono usare, tra 10000 e 100000000. Predefinito 120000. Una volta che un file li ha usati, non parte più alcuna pagina per esso.
schema.capabilities.file_search.blob_storage.label=Archiviazione blob
schema.capabilities.file_search.blob_storage.description=Dove risiedono i byte caricati grezzi. Il contenuto è indirizzato tramite il suo hash sha256 e conteggiato per riferimenti, quindi due caricamenti di contenuto identico memorizzano una sola copia. L’impostazione viene riletta a ogni accesso, quindi una modifica ha effetto senza riavvio.
schema.capabilities.file_search.blob_storage.backend.label=Backend
schema.capabilities.file_search.blob_storage.backend.description=Dove vengono archiviati i NUOVI caricamenti. "db", il predefinito, conserva i byte nel database Postgres di file_search. "s3" li scrive come oggetti nel bucket configurato sotto (AWS o un endpoint compatibile con S3) e nel database conserva solo la loro chiave. Il cambio non sposta nulla: ogni blob viene letto dall’archiviazione in cui è stato scritto, quindi i blob esistenti restano leggibili finché quell’archiviazione è raggiungibile, e una migrazione dal pannello Archiviazione dei blob di Amministrazione di Grounding li sposta. "local" non è supportato: ogni caricamento risponde allora 503 file_search_unavailable.
schema.capabilities.file_search.blob_storage.local_path.label=Percorso locale
schema.capabilities.file_search.blob_storage.local_path.description=Radice del filesystem riservata a un backend "local", predefinita /var/lib/sail-proxy/blobs. Il gateway non supporta "local" (vedi backend), quindi questo valore non viene letto.
schema.capabilities.file_search.blob_storage.s3.label=S3
schema.capabilities.file_search.blob_storage.s3.description=Coordinate del bucket per il backend "s3". Le credenziali non si configurano qui: provengono dalle variabili d’ambiente FILE_SEARCH_S3_ACCESS_KEY_ID e FILE_SEARCH_S3_SECRET_ACCESS_KEY del gateway. Letto a ogni accesso a un blob archiviato in S3 - anche quando backend è "db" e restano blob in S3 - e da una migrazione verso o da S3. Cambiare bucket, endpoint o prefisso non sposta alcun oggetto: i blob scritti con i valori precedenti non sono leggibili finché quei valori non vengono ripristinati.
schema.capabilities.file_search.blob_storage.s3.bucket.label=Bucket
schema.capabilities.file_search.blob_storage.s3.bucket.description=Nome del bucket. Forma l’host <bucket>.s3.<region>.amazonaws.com, o il percorso /<bucket>/<key> quando endpoint è impostato. Viene fornito vuoto: finché non è impostato, un caricamento con backend "s3" risponde 503 e una migrazione verso S3 viene rifiutata.
schema.capabilities.file_search.blob_storage.s3.prefix.label=Prefisso
schema.capabilities.file_search.blob_storage.s3.prefix.description=Prefisso di chiave sotto cui viene archiviato ogni blob, predefinito sail-proxy/blobs, così un bucket può contenere blob accanto a oggetti non correlati. Segmenti di percorso di lettere, cifre, ".", "_" e "-", separati da "/". Il gateway legge, scrive ed elimina solo chiavi sotto questo prefisso e non elenca mai il bucket. Ogni database di file_search deve avere un proprio prefisso (o bucket): le chiavi derivano dal contenuto dei file, quindi due installazioni che condividono un prefisso condividono oggetti, e una elimina oggetti che l’altra usa ancora.
schema.capabilities.file_search.blob_storage.s3.endpoint.label=Endpoint
schema.capabilities.file_search.blob_storage.s3.endpoint.description=Endpoint S3 non AWS - MinIO, Ceph o un altro gateway compatibile con S3. Se impostato, le richieste vanno a <endpoint>/<bucket>/<key> anziché alla forma di host AWS. Vuoto, il predefinito, significa AWS.
schema.capabilities.file_search.blob_storage.s3.region.label=Regione
schema.capabilities.file_search.blob_storage.s3.region.description=Regione di firma SigV4, e parte del nome host quando non è impostato alcun endpoint. Fornita vuota, ed è comunque obbligatoria per firmare verso un endpoint compatibile con S3.
schema.capabilities.file_search.teacher_logging.label=Logging del modello insegnante
schema.capabilities.file_search.teacher_logging.description=Registra i candidati di ogni ricerca e i punteggi del reranker come etichette teacher, per la valutazione e la distillazione del reranker. Fire-and-forget per costruzione: nulla attende la scrittura, e ogni errore emerge solo come avviso. Tutti e cinque i campi vengono letti dal vivo sul percorso di ricerca, quindi possono essere modificati da questo cockpit senza riavvio.
schema.capabilities.file_search.teacher_logging.enabled.label=Abilitato
schema.capabilities.file_search.teacher_logging.enabled.description=Indica se gli eventi di ricerca vengono scritti. Disattivato per impostazione predefinita, quindi un’installazione precedente a questa chiave non inizia mai a scrivere righe. Volutamente indipendente da store_chunk_text: attivare il logging non deve mai da solo iniziare a rendere persistenti i contenuti dei documenti.
schema.capabilities.file_search.teacher_logging.store_chunk_text.label=Memorizza il testo dei chunk
schema.capabilities.file_search.teacher_logging.store_chunk_text.description=Indica se il TESTO del chunk di ogni candidato viene memorizzato accanto al suo hash; disattivato per impostazione predefinita, e altrimenti il testo resta vuoto. Quel testo è contenuto dei documenti degli utenti, quindi questo trasforma le tabelle delle etichette in una seconda copia del corpus - l’hash da solo basta per ricollegare le etichette ai chunk ancora esistenti.
schema.capabilities.file_search.teacher_logging.sample_rate.label=Frequenza di campionamento
schema.capabilities.file_search.teacher_logging.sample_rate.description=Probabilità che una ricerca venga registrata, da 0 a 1; predefinito 1.0. 1 registra ogni ricerca, 0 nessuna, 0.1 circa una su dieci. È l’impostazione da abbassare quando il volume delle etichette è un problema - non max_concurrent_writes, che scarta le scritture anziché diradarle.
schema.capabilities.file_search.teacher_logging.source.label=Origine
schema.capabilities.file_search.teacher_logging.source.description=Etichetta a testo libero scritta su ogni evento di ricerca, usata ogni volta che il chiamante non ne passa alcuna. Predefinito "production", in modo che un’esecuzione di valutazione o di backfill possa essere distinta dal traffico di produzione quando le etichette vengono rilette.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.label=Scritture concorrenti max.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.description=Limite massimo di scritture di etichette teacher in corso, predefinito 2; le scritture in eccesso vengono scartate, non accodate. Limitato alla dimensione del pool di database di file_search pari a 10: oltre quel valore il limite smette di limitare alcunché, perché le scritture in più attendono semplicemente nella coda propria del pool - trasformando "scartate, non accodate" in "accodate", il problema che il limite esiste per evitare. Un valore più grande viene ridotto con un avviso, quindi nemmeno un api_config.json modificato a mano può aumentarlo.
schema.capabilities.file_search.tool.label=Strumento
schema.capabilities.file_search.tool.description=Il blocco dello STRUMENTO ospitato file_search - lo strumento che il modello stesso chiama - in contrapposizione al percorso REST grezzo POST /v1/vector_stores/{id}/search governato dalle impostazioni sopra. Ogni campo viene verificato in lettura e ricade sul suo valore predefinito anziché essere convertito, perché un api_config.json modificato a mano raggiunge il gateway senza convalida.
schema.capabilities.file_search.tool.enabled.label=Abilitato
schema.capabilities.file_search.tool.enabled.description=Letto come booleano rigoroso, predefinito true - un "true" o 1 modificato a mano non viene letto come true e ricade sul valore predefinito. Attualmente ignorato dal gateway: nulla dipende dal valore risolto e lo strumento viene offerto comunque, quindi impostarlo su false non nasconde lo strumento. Usare file_search.enabled per disattivare la funzionalità.
schema.capabilities.file_search.tool.max_searches_per_request.label=Ricerche max. per richiesta
schema.capabilities.file_search.tool.max_searches_per_request.description=Quante chiamate a file_search può effettuare una richiesta prima che il gateway smetta di proseguire il turno. Un intero da 1 a 10 viene rispettato; qualsiasi altro valore - fuori intervallo, frazionario, non numerico - conta come non impostato e ricade su 3 con un avviso, quindi un valore fuori intervallo qui non è, silenziosamente, il valore effettivamente usato.
schema.capabilities.file_search.tool.max_num_results_default.label=Risultati max. predefiniti
schema.capabilities.file_search.tool.max_num_results_default.description=Chunk restituiti quando una chiamata dello strumento non indica un proprio max_num_results. Un intero da 1 a 50 viene rispettato, qualsiasi altro valore ricade su 10. Quell’intervallo è lo stesso limite con cui viene verificato un max_num_results per chiamata, e il limite proprio di OpenAI per il campo. hybrid.candidates resta il limite massimo rigido di ciò che una ricerca può restituire.
schema.capabilities.hosted_tools.label=Strumenti ospitati
schema.capabilities.hosted_tools.description=Limiti della cache di riproduzione dei risultati degli strumenti ospitati: per quanto tempo un risultato resta riproducibile e quanti ne vengono conservati contemporaneamente.
schema.capabilities.hosted_tools.result_cache_ttl_seconds.label=TTL della cache dei risultati (secondi)
schema.capabilities.hosted_tools.result_cache_ttl_seconds.description=Facoltativo. Per quanto tempo i risultati di uno strumento ospitato restano riproducibili da un client che riproduce l’elemento di chiamata. Un valore non intero o fuori intervallo ricade sul predefinito di 3600 secondi, come lasciarlo non impostato. Un mancato riscontro riesegue la query registrata anziché degradare la risposta.
schema.capabilities.hosted_tools.result_cache_max_entries.label=Voci max. della cache dei risultati
schema.capabilities.hosted_tools.result_cache_max_entries.description=Facoltativo. Quanti risultati di strumenti ospitati vengono conservati contemporaneamente nella cache di riproduzione. Un valore non intero o fuori intervallo ricade sul predefinito di 500 voci, come lasciarlo non impostato. Un mancato riscontro riesegue la query registrata anziché degradare la risposta.
schema.capabilities.namespace_tools.label=Strumenti namespace
schema.capabilities.namespace_tools.description=Come gestire lo strumento wrapper di sottoagenti `namespace` di Codex, che SAP AI Core rifiuta direttamente con un 400.
schema.capabilities.namespace_tools.mode.label=Modalità
schema.capabilities.namespace_tools.mode.description=`flatten` (predefinito) porta al livello superiore gli strumenti funzione annidati di uno strumento namespace in modo che la richiesta venga accettata, poi ripristina il namespace sulle chiamate riprodotte affinché Codex possa ancora instradarle. `strip` rimuove completamente lo strumento namespace e i suoi strumenti annidati. Qualsiasi valore diverso da questi due ricade su flatten - l’alternativa è un 400 secco che interrompe il turno.
schema.capabilities.custom_tools.label=Strumenti personalizzati
schema.capabilities.custom_tools.description=Strumenti `custom` a formato libero di Codex (apply_patch). `translate` li riscrive come strumenti funzione, accettati sia dalla route di deployment sia da quella di orchestrazione; `strip` li rimuove, lasciando che il modello modifichi i file tramite comandi shell.
schema.capabilities.custom_tools.mode.label=Modalità
schema.capabilities.custom_tools.mode.description=`translate` (predefinito) riscrive lo strumento personalizzato a formato libero come un normale strumento funzione accettato da entrambe le route, aggiungendo alla sua descrizione indicazioni di grammatica/formato, poiché uno strumento funzione non può esprimere una grammatica Lark come può farlo uno strumento personalizzato. `strip` rimuove completamente gli strumenti personalizzati, lasciando che il modello modifichi invece i file tramite comandi shell. Qualsiasi valore diverso da questi due ricade su translate - l’alternativa è un 400 secco che interrompe il turno.
schema.capabilities.tool_search.label=Ricerca di strumenti
schema.capabilities.tool_search.description=Lo strumento di individuazione degli strumenti differiti `tool_search` di Codex. `translate` lo riscrive come strumento funzione, accettato sia dalla route di deployment sia da quella di orchestrazione; `strip` lo rimuove, lasciando il modello incapace di individuare strumenti differiti come i server MCP.
schema.capabilities.tool_search.mode.label=Modalità
schema.capabilities.tool_search.mode.description=`translate` (predefinito) riscrive lo strumento tool_search come un normale strumento funzione accettato da entrambe le route. `strip` lo rimuove completamente. Qualsiasi valore diverso da questi due ricade su translate - l’alternativa è un 400 secco che interrompe il turno.
schema.capabilities.tool_search.hoist_discovered_tools.label=Porta in primo piano gli strumenti individuati
schema.capabilities.tool_search.hoist_discovered_tools.description=Porta nella richiesta gli strumenti individuati da tool_search affinché il modello possa chiamarli. Aggira il fatto che codex espone gli strumenti MCP differiti solo quando il base_url del provider è api.openai.com; impostarlo su false una volta corretto upstream. Si può lasciare attivo in ogni caso - i nomi che il client dichiara già vengono saltati.
schema.hooks.label=Hook
schema.hooks.definitions.label=Definizioni
schema.hooks.definitions.description=Le regole di corrispondenza con nome che il request.match di un hook può indicare, con l’id della regola come chiave - la chiave È l’id. Ogni regola elencata da un hook deve corrispondere perché quell’hook scatti, e un id di regola non definito qui registra un avviso e fa sì che l’hook non corrisponda a nulla. Le regole vengono memorizzate nella cache per id al primo utilizzo, quindi una modifica ha effetto al successivo ricaricamento della configurazione anziché a processo in corso.
schema.hooks.definitions._entry.type.label=Tipo
schema.hooks.definitions._entry.type.description=Quale parte della richiesta verifica la regola, e quindi quali dei campi sotto si applicano. Determinante anziché descrittivo: vengono compresi solo questi quattro valori, e qualsiasi altro viene registrato come tipo di hook sconosciuto e non corrisponde a NULLA - disattivando silenziosamente ogni hook che indica la regola.
schema.hooks.definitions._entry.name.label=Nome
schema.hooks.definitions._entry.name.description=L’header di richiesta letto da una regola 'header'. Senza distinzione tra maiuscole e minuscole: il nome viene convertito in minuscolo prima della ricerca, come la pipeline delle richieste normalizza i nomi degli header. Una richiesta che non contiene l’header non corrisponde mai. Vuoto non significa 'qualsiasi header' - una regola del genere non potrebbe mai scattare - quindi qui viene rifiutato anziché accettato.
schema.hooks.definitions._entry.path.label=Percorso
schema.hooks.definitions._entry.path.description=Percorso in notazione puntata nel corpo JSON analizzato della richiesta per una regola 'json-path' o 'json-path-regex'. Un '$.' iniziale viene rimosso, quindi '$.max_tokens' e 'max_tokens' indirizzano lo stesso valore; non c’è altro supporto JSONPath - niente caratteri jolly, filtri o sintassi con parentesi quadre, e un segmento che contiene un punto non può essere indirizzato. 'json-path' segue ogni segmento alla lettera, quindi un segmento numerico indicizza un array. 'json-path-regex' consente inoltre a un segmento non numerico di prendere il primo elemento dell’array che lo contiene. Una richiesta senza corpo analizzato, o un percorso che non si risolve in nulla, non corrisponde.
schema.hooks.definitions._entry.equals.label=Uguale a
schema.hooks.definitions._entry.equals.description=Il valore a cui deve essere uguale l’elemento indirizzato - confrontato in modo DIVERSO a seconda del tipo. In una regola `header` NON è uguaglianza stretta: vengono confrontati i media type (la parte prima del primo `;`, in minuscolo), quindi `application/json` corrisponde anche a `application/json; charset=utf-8`. Esiste perché il confronto stretto che ha sostituito permetteva ai client che aggiungono il charset di aggirare la pseudonimizzazione. Un valore equals che contiene a sua volta un `;` viene confrontato esattamente, quindi una regola può ancora fissare un charset. In una regola `json-path` È uguaglianza stretta. Semantica del confronto: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.from.label=Da
schema.hooks.definitions._entry.from.description=Limite inferiore incluso per una regola 'header' che confronta un header numerico - content-length in ogni regola fornita. Il valore dell’header viene letto come intero in base 10 e deve rientrare in [from, to]; un valore non analizzabile non corrisponde mai. Letto solo quando equals è assente E sono presenti entrambi i limiti: un limite da solo viene ignorato e la regola si riduce a un semplice controllo di presenza dell’header.
schema.hooks.definitions._entry.to.label=A
schema.hooks.definitions._entry.to.description=Limite superiore incluso per una regola 'header' che confronta un header numerico. Non esiste una forma aperta: per esprimere 'almeno 10 KB' le regole fornite abbinano from a un to volutamente enorme (size:min10kb usa 999999999), perché omettere uno dei due limiti trasforma la regola in un controllo di presenza. Vedere from.
schema.hooks.definitions._entry.regex.label=Regex
schema.hooks.definitions._entry.regex.description=Il sorgente di un’espressione regolare JavaScript. Una regola `json-path-regex` la verifica rispetto a ciò in cui si è risolto il percorso (una stringa direttamente, un array elemento per elemento, qualsiasi altro oggetto rispetto alla sua forma JSON). Una regola `url-regex` la verifica rispetto al percorso e alla query string della richiesta visti dal gateway, NON un URL assoluto, quindi `^https?://` non può mai corrispondere. Compilata una volta e memorizzata nella cache per regola; un’espressione rifiutata dal motore conta come nessuna corrispondenza. Semantica del confronto: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.flags.label=Flag
schema.hooks.definitions._entry.flags.description=Flag dell’espressione regolare applicati a regex, ad es. 'i' per non distinguere tra maiuscole e minuscole. Limitati alle lettere che il motore accetta effettivamente, perché qualsiasi altro valore fa fallire la compilazione e quel fallimento viene segnalato come nessuna corrispondenza - la regola non scatterebbe mai, silenziosamente. I flag fanno parte della chiave di cache dell’espressione compilata, quindi due regole che differiscono solo nei flag non condividono un’espressione compilata. Evitare 'g': un’espressione globale compilata viene riutilizzata tra le richieste e fa avanzare la propria posizione, quindi una regola del genere corrisponde una volta sì e una no.
schema.hooks.definitions._entry.desc.label=Descr.
schema.hooks.definitions._entry.desc.description=Nota a testo libero sullo scopo di questa regola. Attualmente ignorata dal gateway; documenta la regola per chi modifica questo file e non ha effetto sulla corrispondenza.
schema.hooks.defaults.label=Valori predefiniti
schema.hooks.defaults.description=Hook predefiniti per endpoint, con l’identificatore dell’endpoint usato dalla route come chiave - 'anthropic', 'openai' e 'aws-bedrock' oggi, e 'google' (sottopercorsi generateContent, streamGenerateContent, embedContent). Consultati solo quando il modello richiesto non ha una voce models.overrides.<model>.hooks per il sottopercorso: una voce per modello SOSTITUISCE il valore predefinito dell’endpoint per quel sottopercorso anziché unirsi a esso.
schema.hooks.defaults._entry.description=I valori predefiniti di un endpoint: il blocco facoltativo di attivazione forzata della pseudonimizzazione, più un elenco di hook per ogni sottopercorso di richiesta (invoke, invoke-with-response-stream, responses, responses-stream). Le chiavi sconosciute vengono rifiutate, perché ogni altra chiave qui viene letta come sottopercorso e nessuna route chiede un sottopercorso che questo endpoint non serve - quindi una chiave non riconosciuta è un errore di battitura che non verrebbe mai eseguito, non un’impostazione. Il pattern dei sottopercorsi esclude volutamente 'pseudonymization', così quella chiave non deve essere anche un elenco di hook.
schema.hooks.defaults._entry.pseudonymization.label=Pseudonimizzazione
schema.hooks.defaults._entry.pseudonymization.description=Impostazioni del plug-in di pseudonimizzazione. L’attivazione (enabled) e gli interruttori per categoria (entities) valgono solo per questo plug-in; il mascheramento avviene solo quando il plug-in viene effettivamente eseguito per una richiesta - deve essere registrato nella catena degli hook e deve scattare una fonte di attivazione.
schema.hooks.defaults._entry.pseudonymization.enabled.label=Abilitato
schema.hooks.defaults._entry.pseudonymization.enabled.description=Forza l’attivazione del mascheramento per una richiesta. Letto solo dove questo blocco si trova sotto models.overrides.<model>.pseudonymization o hooks.defaults.<endpoint>.pseudonymization: true lì maschera quella richiesta, e il blocco per modello prevale su quello per endpoint. False o assente non forza nulla - il mascheramento può comunque essere eseguito quando scatta un’altra fonte di attivazione, come una parola chiave di attivazione o un campo di mascheramento nel corpo della richiesta. Sotto observability.pseudonymization questa chiave è attualmente ignorata; quel livello fornisce tutte le altre impostazioni qui presenti tranne method e allow_user_bypass. In ogni caso il plug-in deve essere collegato alla catena degli hook, altrimenti non viene mascherato nulla.
schema.hooks.defaults._entry.pseudonymization.method.label=Metodo
schema.hooks.defaults._entry.pseudonymization.method.description=Modalità di mascheramento: `pseudonymization` maschera la richiesta e smaschera la risposta; `anonymization` maschera e non smaschera mai. Letto solo dove questo blocco forza l’attivazione del mascheramento (un hook abilitato o una sostituzione di modello), non sotto `observability.pseudonymization`. Condiziona anche il SIEM: solo `pseudonymization` conserva la risposta mascherata, quindi con `anonymization` un sink di contenuti riceve il prompt ma non la risposta. Se omesso, si ricade su `pseudonymization`. Modalità: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.label=Consenti l’esclusione da parte dell’utente
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.description=Ha effetto solo all’interno di un blocco di attivazione forzata (un hook abilitato o una sostituzione di modello); non viene letto sotto `observability.pseudonymization`. Valore predefinito false. Se true, un chiamante può saltare il mascheramento tramite l’header `x-sail-proxy-pseudonymization: off` (senza distinzione tra maiuscole e minuscole) o il campo del corpo `pseudonymization_off: true`: il contenuto raggiunge il LLM non mascherato e, dove un sink SIEM abilitato imposta sia `include_content` sia `allow_unmasked_content`, anche quel sink. Dettagli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.hooks.defaults._entry.pseudonymization.entities.label=Entità
schema.hooks.defaults._entry.pseudonymization.entities.description=Interruttori di mascheramento per categoria: `true` maschera la categoria a questo livello, `false` no, e una categoria non elencata eredita il livello inferiore (i livelli successivi prevalgono). Le chiavi sono l’insieme delle categorie note: le categorie attive per impostazione predefinita; tre facoltative fornite disattivate (`profile-org`, `profile-location`, `profile-ip-address`); e `profile-sensitive-data`, un interruttore generale che le attiva tutte tranne quelle tre. Una chiave fuori dall’insieme viene rifiutata qui. Categorie e livelli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.hooks.defaults._entry.pseudonymization.org_suffixes.label=Suffissi di organizzazione
schema.hooks.defaults._entry.pseudonymization.org_suffixes.description=Suffissi di forma giuridica che contrassegnano una sequenza di parole come nome di organizzazione, ad es. Inc, LLC, GmbH. Il confronto distingue volutamente tra maiuscole e minuscole, quindi un 'limited' minuscolo in un testo non viene deliberatamente trattato come forma giuridica; ogni voce corrisponde inoltre scritta tutta in maiuscolo, quindi una fattura che riporta ACME GMBH viene riconosciuta come la stessa organizzazione di Acme GmbH. Ha effetto solo finché profile-org è abilitato in entities; abilitare profile-org con questo elenco vuoto NON maschera nulla come organizzazione e registra un avviso. Ogni voce viene ripulita dagli spazi prima del confronto, e una voce vuota o composta solo da spazi viene scartata silenziosamente anziché rifiutata.
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.label=Gazetteer delle località
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.description=Termini di località letterali che il rilevatore strutturale maschera - senza distinzione tra maiuscole e minuscole, e solo come parola o frase intera; nulla viene dedotto dalle maiuscole o dal contesto. Ha effetto solo finché profile-location è abilitato in entities; abilitare profile-location con questo elenco vuoto NON maschera nulla come località e registra un avviso. Ogni voce viene ripulita dagli spazi, e una voce vuota o composta solo da spazi viene scartata silenziosamente. Fornito vuoto: i nomi di luogo dipendono dall’installazione e questo repository è pubblico, quindi popolarlo tramite questa app di configurazione di amministrazione, mai nel codice versionato.
schema.hooks.defaults._entry.pseudonymization.min_confidence.label=Confidenza min.
schema.hooks.defaults._entry.pseudonymization.min_confidence.description=Quante prove richiede un valore rilevato prima di essere mascherato, da 0 a 1 (predefinito 0.5). Un valore viene mascherato quando il suo punteggio raggiunge la soglia; un semplice nome con iniziale maiuscola ottiene circa 0.5, un pattern convalidato da checksum 0.95, una regola personalizzata 1.0. Alzare la soglia esclude prima i nomi semplici, quindi per rendere più severa una sola categoria rumorosa usare invece `thresholds`. Le regole personalizzate, gli identificatori convalidati e le credenziali non vengono mai abbassati dal contesto. Dettagli sul punteggio: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.hooks.defaults._entry.pseudonymization.thresholds.label=Soglie
schema.hooks.defaults._entry.pseudonymization.thresholds.description=Soglie di confidenza per categoria, ciascuna da 0 a 1, che sostituiscono `min_confidence` per le categorie indicate; una non elencata mantiene `min_confidence`. Il punto in cui essere severi su una sola categoria rumorosa - `profile-person` a 0.65 richiede più prove per i nomi mentre gli identificatori convalidati restano alla soglia globale. Le chiavi sono lo stesso insieme di categorie note accettato da `entities`; `profile-sensitive-data` è accettato ma non fa nulla. Regolazione per categoria: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.hooks.defaults._entry.pseudonymization.allowlist.label=Lista consentiti
schema.hooks.defaults._entry.pseudonymization.allowlist.description=Valori che questa installazione non maschera mai - un interruttore di SPEGNIMENTO, per valore. Consultata prima del punteggio di confidenza, quindi un valore elencato è esente per quante prove ci siano. Usarla per un falso positivo ricorrente con un nome proprio - un titolo di prodotto o di report che sembra una persona. Gli elenchi dei livelli vengono CONCATENATI, non sostituiti, quindi un livello inferiore aggiunge solo un’esenzione, non ne rimuove mai una. `terms` rispetto a `patterns`, e il rischio delle voci troppo ampie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.label=Termini
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.description=Valori letterali, confrontati con l’intero valore rilevato e DISTINGUENDO tra maiuscole e minuscole. La distinzione è voluta: 'Watson Studio' è il prodotto che un operatore intendeva esentare e 'watson studio' in una frase no, e un elenco senza distinzione esenterebbe anche una persona il cui cognome si scrive per caso allo stesso modo. Un termine corrisponde solo a un valore che i rilevatori hanno prodotto per intero - elencare 'Studio' non esenta 'Watson Studio'. Ogni voce qui è un interruttore di SPEGNIMENTO del mascheramento per quel valore esatto, quindi limitare l’elenco a valori che non sono mai davvero dati personali: un termine che per caso è il nome di qualcuno esenta quella persona dal mascheramento ovunque in questa installazione, silenziosamente e senza nulla nel log che lo segnali.
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.label=Pattern
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.description=Espressioni regolari (JavaScript), ciascuna confrontata con l’INTERO valore rilevato: il gateway racchiude da sé ogni voce in `^(?: )$`, quindi scrivere `Z[A-Z0-9_]+`, non `^Z[A-Z0-9_]+$`. Il confronto distingue tra maiuscole e minuscole. Ogni voce è un interruttore di SPEGNIMENTO del mascheramento, e una voce ampia disattiva il mascheramento senza errori - `[A-Z].*` disattiva quasi tutti i nomi di persona rilevati. Una corrispondenza con un campione PII integrato genera un avviso ma viene COMUNQUE applicata. Mantenere ogni voce ristretta. Dettagli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.saturation_warn.label=Avviso di saturazione
schema.hooks.defaults._entry.pseudonymization.saturation_warn.description=Quanti valori mascherati DISTINTI può contenere una richiesta prima di essere segnalata come satura (predefinito 40). Solo segnalazione - non cambia mai ciò che viene mascherato. Oltre questo numero il gateway registra un avviso per richiesta con i conteggi per categoria e le FORME di valore più comuni (lettere come X, cifre come 9); nessun valore mascherato compare mai. L’evento SIEM di utilizzo della richiesta contiene gli stessi conteggi con un flag `saturated` - conteggi, non testo. Come leggere il report: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.label=Segnaposto inventati
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.description=Che cosa succede quando una risposta contiene un segnaposto mascherato mai inviato al modello. I modelli ne inventano uno in circa 1 risposta pseudonimizzata su 125, e più spesso quanti più valori una richiesta maschera; un tale segnaposto non indica nessuno e non può mai essere risolto. withhold (predefinito): viene sostituito con un semplice contrassegno come [name withheld] e segnalato come evento di sicurezza. report: viene solo segnalato e raggiunge il client invariato, per un’installazione i cui sviluppatori scrivono nuovi segnaposto nei dati di test tramite il gateway. off: nessuna delle due cose. Un segnaposto che il client stesso ha inviato nella stessa richiesta non viene mai considerato inventato.
schema.hooks.defaults._entry._entry.description=L’elenco degli hook di un sottopercorso, provati in ordine. La stessa struttura serve hooks.defaults.<endpoint>.<subpath> e models.overrides.<model>.hooks.<subpath>, quindi il gateway vede un’unica struttura, chiunque dei due la fornisca. Un hook scatta solo quando OGNI regola indicata dal suo request.match corrisponde alla richiesta; request.callback.id indica quindi il plug-in da eseguire per la fase in corso. Un hook il cui match non è soddisfatto, o il cui callback non indica alcun plug-in registrato per quella fase, viene saltato e si prova il successivo - nessuno dei due casi è un errore in fase di esecuzione.
schema.hooks.defaults._entry._entry.items.request.label=Richiesta
schema.hooks.defaults._entry._entry.items.request.description=Ciò che deve corrispondere e ciò che va eseguito quando corrisponde. Prende il nome dalla richiesta perché il confronto esamina sempre e solo la richiesta in ingresso; non esiste una controparte per la risposta, e nient’altro di un hook viene letto.
schema.hooks.defaults._entry._entry.items.request.callback.label=Callback
schema.hooks.defaults._entry._entry.items.request.callback.description=Il plug-in da eseguire dopo che ogni regola in match ha trovato corrispondenza.
schema.hooks.defaults._entry._entry.items.request.callback.id.label=ID
schema.hooks.defaults._entry._entry.items.request.callback.id.description=L’id con cui un plug-in si è registrato, cercato nel registro dei plug-in del gateway per la fase in esecuzione. Questo schema non può verificare il riferimento incrociato: un id che nessun plug-in ha registrato per quella fase viene registrato nel log come non trovato e l’hook viene saltato, quindi la richiesta passa senza modifiche anziché fallire.
schema.hooks.defaults._entry._entry.items.request.match.label=Corrispondenza
schema.hooks.defaults._entry._entry.items.request.match.description=Gli id delle regole che devono corrispondere TUTTI, valutati in ordine e abbandonati al primo che non corrisponde. Ogni id è una chiave in hooks.definitions - un riferimento incrociato che questo schema non può verificare: un id non definito lì registra un avviso e fa sì che l’intero hook non corrisponda, quindi un errore di battitura disattiva il plug-in silenziosamente anziché farlo scattare incondizionatamente. Un elenco vuoto viene rifiutato, perché un hook destinato a essere eseguito su quasi tutto si scrive indicando invece una regola volutamente ampia - la regola fornita payload:any corrisponde a qualsiasi richiesta il cui corpo analizzato contenga un model stringa non vuoto, il che è quanto di più vicino all’incondizionato possa essere una regola, pur dichiarandolo apertamente.
schema.platform.label=Piattaforma
schema.platform.billing.label=Fatturazione
schema.platform.billing.description=Classificazione di fatturazione di SAP AI Core per questo subaccount. Letta solo dalla contabilità dei costi nativa SAP in Capacity Units dell’app di amministrazione, mai dal percorso di richiesta del gateway.
schema.platform.billing.productive.label=Produttivo
schema.platform.billing.productive.description=Indica se SAP classifica questo subaccount/tenant come PRODUTTIVO per la fatturazione di SAP AI Core. isProductive() in sapCapacityService lo legge per scegliere la riga SapCapacityUnitPrice - $/CU produttivo o non produttivo - usata per valorizzare le Capacity Units. La classificazione di SAP non sempre corrisponde al nome dell’ambiente (un subaccount Sandbox può essere classificato produttivo), quindi impostare qui ciò che la fattura/il subaccount SAP è effettivamente. Predefinito false = non produttivo.
schema.platform.billing.cuFactor.label=Fattore CU
schema.platform.billing.cuFactor.description=Fattore di conversione dai token GenAI di SAP alle Capacity Units (SAP Note 3437766; uniforme in tutte le fatture, non pubblicato per modello). cuFactor() in sapCapacityService lo legge - capacityUnits = genAiTokens x questo fattore, applicato globalmente a ogni evento di utilizzo (non per tipo di utilizzo), sia per l’acquisizione dal vivo sia per il ricalcolo retroattivo. Modificarlo solo se SAP ripubblica la conversione in CU. Predefinito 1.90385. Un valore 0 viene trattato come non impostato e ricade sul predefinito.
schema.platform.timeouts.label=Timeout
schema.platform.timeouts.description=Limiti massimi di timeout per richiesta che il gateway applica alle chiamate LLM in uscita.
schema.platform.timeouts.default.label=Predefinito
schema.platform.timeouts.default.description=Timeout in millisecondi per le richieste non in streaming, da 1000 a 3600000. Non impostato o zero ricade su 120000 ms (120 secondi).
schema.platform.timeouts.streaming.label=Streaming
schema.platform.timeouts.streaming.description=Timeout in millisecondi per le richieste in streaming, da 1000 a 3600000. Non impostato o zero ricade su 240000 ms (240 secondi).
schema.platform.logging.label=Logging
schema.platform.logging.description=Livello e destinazione del log del gateway. Letti dal logger condiviso all’avvio, e di nuovo ogni volta che il gateway lo reinizializza dopo una modifica della configurazione.
schema.platform.logging.components.label=Componenti
schema.platform.logging.components.description=Sostituzione del livello di log per componente, con il nome del componente esattamente come lo registra il gateway come chiave - ad esempio 'ConfigService' o 'AwsBedrockService'. Un componente senza voce qui usa LOG_LEVEL se impostata, altrimenti defaultLevel. Una voce prevale su LOG_LEVEL per il proprio componente, quindi un componente fissato ignora la variabile d’ambiente; la configurazione fornita non contiene alcuna voce.
schema.platform.logging.components._entry.description=Livello di log per questo componente, che sostituisce defaultLevel finché è presente. Viene confrontato senza distinzione tra maiuscole e minuscole con i livelli implementati dal logger (trace, debug, info, warn, error); un valore non riconosciuto viene ignorato silenziosamente, lasciando in vigore il livello precedente anziché generare un errore.
schema.platform.logging.defaultLevel.label=Livello predefinito
schema.platform.logging.defaultLevel.description=Livello di log per qualsiasi componente senza voce in `components`. Se `LOG_LEVEL` è impostato su un livello riconosciuto ha la precedenza e questo campo viene ignorato - e `LOG_LEVEL` è impostato in entrambi gli esempi .env e nei manifest di Kyma, quindi in un’installazione standard prevale l’ambiente. Altrimenti viene confrontato senza distinzione tra maiuscole e minuscole con i livelli del logger (trace, debug, info, warn, error); un valore non riconosciuto viene ignorato silenziosamente. Precedenza: https://st-gr.github.io/sail-proxy/developer/debugging#log-level-resolution
schema.platform.logging.log_folder_path.label=Percorso della cartella dei log
schema.platform.logging.log_folder_path.description=Directory in cui il gateway scrive i propri file di log e - quando payload_logging_enabled è true - i dump dei payload di richiesta e risposta, in una sottodirectory payloads/. Se non impostato, ricade su ./logs.
schema.platform.logging.payload_logging_enabled.label=Logging dei payload abilitato
schema.platform.logging.payload_logging_enabled.description=Se true, scrive i corpi completi di richiesta e risposta in log_folder_path/payloads per il debug. Gli header noti come sensibili vengono oscurati, ma il contenuto del corpo viene scritto così com’è, quindi lasciarlo disattivato al di fuori di un debug attivo. Disattivato per impostazione predefinita. La variabile d’ambiente PAYLOAD_LOGGING_ENABLED, se impostata su true o false, prevale su questo valore.
schema.platform.rate_limit_handling.label=Gestione dei limiti di frequenza
schema.platform.rate_limit_handling.description=Backoff automatico che il gateway applica dopo che un provider segnala un limite di frequenza - un HTTP 429, o un messaggio di errore che corrisponde a una parola chiave di limite di frequenza. Puramente reattivo: ritarda i nuovi tentativi una volta rilevato un limite di frequenza per un modello e un sottopercorso, non limita il traffico in anticipo.
schema.platform.rate_limit_handling.enabled.label=Abilitato
schema.platform.rate_limit_handling.enabled.description=Interruttore principale del backoff per limite di frequenza. Se false o assente, il ritardo è sempre 0 secondi e il resto di questa sezione non ha effetto.
schema.platform.rate_limit_handling.default_delay_seconds.label=Ritardo predefinito (secondi)
schema.platform.rate_limit_handling.default_delay_seconds.description=Ritardo in secondi applicato quando viene rilevato un limite di frequenza e né subpath_specific_delays né model_specific_delays hanno una voce per l’endpoint. Ricade su 30 se non impostato o zero.
schema.platform.rate_limit_handling.backoff_multiplier.label=Moltiplicatore di backoff
schema.platform.rate_limit_handling.backoff_multiplier.description=Moltiplicatore applicato al ritardo precedente a ogni limite di frequenza consecutivo per lo stesso modello e sottopercorso: il nuovo ritardo è il precedente moltiplicato per questo valore, con un massimo di max_delay_seconds. Ricade su 1.5 se non impostato o zero; mantenerlo a 1 o più, altrimenti ogni limite di frequenza consecutivo attenderebbe meno anziché di più.
schema.platform.rate_limit_handling.max_delay_seconds.label=Ritardo max. (secondi)
schema.platform.rate_limit_handling.max_delay_seconds.description=Limite massimo in secondi che il backoff per limiti di frequenza consecutivi sopra non può superare. Ricade su 300 se non impostato o zero.
schema.platform.rate_limit_handling.model_specific_delays.label=Ritardi per modello
schema.platform.rate_limit_handling.model_specific_delays.description=Sostituzione del ritardo per modello in secondi, con l’id del modello esattamente come configurato in providers e models come chiave - ad esempio 'anthropic--claude-4-opus--deployed'. Verificato dopo subpath_specific_delays e prima di default_delay_seconds; un ritardo di 0 qui conta come nessuna sostituzione, perché viene usata solo una voce diversa da zero.
schema.platform.rate_limit_handling.model_specific_delays._entry.description=Ritardo in secondi applicato a questo modello quando raggiunge un limite di frequenza.
schema.platform.rate_limit_handling.subpath_specific_delays.label=Ritardi per sottopercorso
schema.platform.rate_limit_handling.subpath_specific_delays.description=Sostituzione del ritardo per sottopercorso in secondi, con il sottopercorso dell’API del gateway come chiave - ad esempio 'converse-stream' o 'invoke-with-response-stream'. Verificato per primo, prima di model_specific_delays e default_delay_seconds; un ritardo di 0 qui conta come nessuna sostituzione, perché viene usata solo una voce diversa da zero.
schema.platform.rate_limit_handling.subpath_specific_delays._entry.description=Ritardo in secondi applicato a questo sottopercorso quando raggiunge un limite di frequenza.
schema.platform.security.label=Sicurezza
schema.platform.security.description=Aspetti dell’ingresso (ingress).
schema.platform.security.trust_forwarded_for.label=Considera attendibile Forwarded-For
schema.platform.security.trust_forwarded_for.description=Considerare attendibili gli header X-Forwarded-For e X-Real-IP forniti dal client - e l’IP del client che il framework web ne deriva - quando si registra l’IP del client negli eventi di sicurezza, anziché usare l’indirizzo grezzo del peer del socket. Abilitarlo solo dietro un proxy che sovrascrive quegli header anziché lasciar passare ciò che il client ha inviato; altrimenti un client può falsificare il proprio IP registrato.
schema.platform.security.credentialExpirationDays.label=Scadenza delle credenziali (giorni)
schema.platform.security.credentialExpirationDays.description=Giorni di validità di una credenziale: una chiave API o una credenziale AWS viene creata con expiresAt = adesso + questo numero di giorni, e ogni rinnovo (rotazione) sposta di nuovo expiresAt ad adesso + questo numero di giorni. Valori assenti o non validi ricadono su 90. Le credenziali create prima che esistesse la scadenza non hanno una data e non scadono mai finché un amministratore non ne imposta una.
schema.platform.quotas.label=Quote
schema.platform.quotas.description=Quote predefinite per utente valide per l’intera piattaforma, applicate dal gateway a ogni richiesta LLM. Il vincolo proprio di un utente (app Utenti e quote) sostituisce ogni campo; null = illimitato. Le finestre sono il giorno di calendario UTC, la settimana ISO (lunedì 00:00 UTC) e il mese di calendario; la spesa è il costo SAP più il costo Connections nella valuta del prezzo della Capacity Unit di SAP.
schema.platform.quotas.requestsPerMinute.label=Richieste al minuto
schema.platform.quotas.requestsPerMinute.description=Richieste per utente per minuto scorrevole. Si applicano anche i limiti per credenziale (RateLimits); una richiesta deve superarli entrambi.
schema.platform.quotas.spendPerDay.label=Spesa al giorno
schema.platform.quotas.spendPerDay.description=Costo SAP più costo Connections per utente per giorno UTC.
schema.platform.quotas.spendPerWeek.label=Spesa a settimana
schema.platform.quotas.spendPerWeek.description=Costo SAP più costo Connections per utente per settimana ISO.
schema.platform.quotas.spendPerMonth.label=Spesa al mese
schema.platform.quotas.spendPerMonth.description=Costo SAP più costo Connections per utente per mese di calendario.
schema.platform.quotas.tokensPerDay.label=Token al giorno
schema.platform.quotas.tokensPerDay.description=Token di input, di output e di scrittura nella cache per utente per giorno UTC; le letture dalla cache non vengono conteggiate.
schema.platform.quotas.tokensPerWeek.label=Token a settimana
schema.platform.quotas.tokensPerWeek.description=Token di input, di output e di scrittura nella cache per utente per settimana ISO; le letture dalla cache non vengono conteggiate.
schema.platform.quotas.tokensPerMonth.label=Token al mese
schema.platform.quotas.tokensPerMonth.description=Token di input, di output e di scrittura nella cache per utente per mese di calendario; le letture dalla cache non vengono conteggiate.
schema.platform.toolGovernance.label=Governance degli strumenti
schema.platform.toolGovernance.description=Governance degli strumenti: per quanto tempo vengono conservate le righe di utilizzo degli strumenti per richiesta e i loro aggregati giornalieri, e come ogni programma client scrive gli strumenti MCP che ospita da sé.
schema.platform.toolGovernance.mcpNaming.label=Denominazione MCP
schema.platform.toolGovernance.mcpNaming.description=Un client che esegue i propri server MCP non invia alcun tipo di strumento MCP: Claude Code dichiara ogni strumento come mcp__server__tool, mentre codex li raggiunge all’interno del proprio strumento exec. Queste convenzioni trasformano un nome del genere nell’identità mcp:server/tool a cui può corrispondere un pattern di policy, quindi un client che nessuno ha ancora misurato è una modifica della configurazione anziché un rilascio.
schema.platform.toolGovernance.mcpNaming.namePattern.label=Pattern del nome dello strumento
schema.platform.toolGovernance.mcpNaming.namePattern.description=Espressione regolare confrontata con un nome di strumento dichiarato; il primo gruppo è il server MCP, il secondo lo strumento. Il valore predefinito legge mcp__codex_apps__sites_create_site come server codex_apps e strumento sites_create_site.
schema.platform.toolGovernance.mcpNaming.clients.label=Programmi client
schema.platform.toolGovernance.mcpNaming.clients.description=Una voce per programma client. Si applica la prima il cui testo User Agent compare in quello della richiesta; una richiesta che non corrisponde a nessuna è comunque governata da ciò che dichiara. Un elenco indicato qui sostituisce interamente le preimpostazioni integrate; una voce senza name, userAgent o containerTools viene ignorata.
schema.platform.toolGovernance.mcpNaming.clients.items.name.label=Nome
schema.platform.toolGovernance.mcpNaming.clients.items.name.description=Come viene indicato questo client nel cockpit e nei log, ad esempio claude-code.
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.label=User Agent
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.description=Testo che identifica il client nell’header User Agent della richiesta, ad esempio claude-cli. Confrontato senza distinzione tra maiuscole e minuscole in qualsiasi punto dell’header.
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.label=Strumenti contenitore
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.description=Strumenti il cui corpo di chiamata può raggiungere strumenti MCP annidati, come exec di codex. Vuoto per un client che dichiara direttamente i propri strumenti MCP, che è il caso comune.
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.label=Pattern di chiamata annidata
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.description=Espressione regolare che trova il nome di uno strumento annidato nel corpo di chiamata di uno strumento contenitore; il primo gruppo è il nome. Vengono letti solo i nomi, mai gli argomenti.
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.label=Pattern del nome dello strumento
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.description=Espressione regolare che sostituisce il pattern condiviso del nome dello strumento solo per questo client; il primo gruppo è il server MCP, il secondo lo strumento, e un nome conta solo quando entrambi i gruppi non sono vuoti. La corrispondenza distingue tra maiuscole e minuscole e trova il pattern in qualsiasi punto del nome, salvo che sia ancorato con ^ e $. Omettetela per usare il pattern condiviso. Un’espressione vuota o non valida non corrisponde a nulla per pattern per questo client (non ricade sul pattern condiviso), ma i nomi dei server continuano ad applicarsi.
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.label=Nomi dei server
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.description=I server MCP eseguiti da questa installazione, per un client i cui nomi di strumento non portano alcun marcatore, come opencode, che dichiara lo strumento ping_probe del server probe come probe_ping_probe. Uno strumento dichiarato con il nome <server>_<tool> diventa allora l’identità mcp:server/tool; il pattern del nome viene provato per primo, poi i server nell’ordine dell’elenco, e vince il primo server corrispondente. I nomi dei server distinguono tra maiuscole e minuscole. Le voci vuote vengono ignorate. Se l’elenco resta vuoto, tali strumenti restano normali strumenti di funzione.
schema.platform.toolGovernance.retention.label=Conservazione
schema.platform.toolGovernance.retention.rawDays.label=Conservazione dell’utilizzo degli strumenti (giorni)
schema.platform.toolGovernance.retention.rawDays.description=Giorni di conservazione di una riga di utilizzo degli strumenti per richiesta prima che la pulizia notturna la rimuova. Gli aggregati giornalieri conservano i totali.
schema.platform.toolGovernance.retention.dailyDays.label=Conservazione degli aggregati di utilizzo degli strumenti (giorni)
schema.platform.toolGovernance.retention.dailyDays.description=Giorni di conservazione di un aggregato giornaliero di utilizzo degli strumenti (per utente, strumento e giorno). L’inventario e la pagina dell’utente li leggono.
schema.platform.maintenance.label=Manutenzione
schema.platform.maintenance.description=Quando il servizio di amministrazione esegue la manutenzione giornaliera: il ricalcolo dei costi, la ricostruzione dei bucket di utilizzo e la ripubblicazione del documento di quota di ogni utente.
schema.platform.maintenance.dailyRunAtUtc.label=Esecuzione giornaliera alle (UTC)
schema.platform.maintenance.dailyRunAtUtc.description=Ora del giorno, in UTC, nel formato HH:MM (24 ore), a cui inizia l’esecuzione giornaliera della manutenzione. Non impostata: l’esecuzione inizia 5 minuti dopo l’avvio del servizio di amministrazione e poi ogni 24 ore, quindi un nuovo deployment a mezzogiorno la fissa a mezzogiorno. Impostata: la prima esecuzione inizia comunque 5 minuti dopo l’avvio; ogni esecuzione successiva inizia ogni giorno a quest’ora. Esempio: per eseguirla a mezzanotte ora del Pacifico inserire 08:00 mentre è in vigore l’ora solare del Pacifico (UTC-8) o 07:00 durante l’ora legale del Pacifico (UTC-7) - il valore non viene adeguato all’ora legale.
schema.observability.label=Osservabilità
schema.observability.pseudonymization.label=Pseudonimizzazione
schema.observability.pseudonymization.description=Impostazioni del plug-in di pseudonimizzazione. L’attivazione (enabled) e gli interruttori per categoria (entities) valgono solo per questo plug-in; il mascheramento avviene solo quando il plug-in viene effettivamente eseguito per una richiesta - deve essere registrato nella catena degli hook e deve scattare una fonte di attivazione.
schema.observability.pseudonymization.enabled.label=Abilitato
schema.observability.pseudonymization.enabled.description=Forza l’attivazione del mascheramento per una richiesta. Letto solo dove questo blocco si trova sotto models.overrides.<model>.pseudonymization o hooks.defaults.<endpoint>.pseudonymization: true lì maschera quella richiesta, e il blocco per modello prevale su quello per endpoint. False o assente non forza nulla - il mascheramento può comunque essere eseguito quando scatta un’altra fonte di attivazione, come una parola chiave di attivazione o un campo di mascheramento nel corpo della richiesta. Sotto observability.pseudonymization questa chiave è attualmente ignorata; quel livello fornisce tutte le altre impostazioni qui presenti tranne method e allow_user_bypass. In ogni caso il plug-in deve essere collegato alla catena degli hook, altrimenti non viene mascherato nulla.
schema.observability.pseudonymization.method.label=Metodo
schema.observability.pseudonymization.method.description=Modalità di mascheramento: `pseudonymization` maschera la richiesta e smaschera la risposta; `anonymization` maschera e non smaschera mai. Letto solo dove questo blocco forza l’attivazione del mascheramento (un hook abilitato o una sostituzione di modello), non sotto `observability.pseudonymization`. Condiziona anche il SIEM: solo `pseudonymization` conserva la risposta mascherata, quindi con `anonymization` un sink di contenuti riceve il prompt ma non la risposta. Se omesso, si ricade su `pseudonymization`. Modalità: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.observability.pseudonymization.allow_user_bypass.label=Consenti l’esclusione da parte dell’utente
schema.observability.pseudonymization.allow_user_bypass.description=Ha effetto solo all’interno di un blocco di attivazione forzata (un hook abilitato o una sostituzione di modello); non viene letto sotto `observability.pseudonymization`. Valore predefinito false. Se true, un chiamante può saltare il mascheramento tramite l’header `x-sail-proxy-pseudonymization: off` (senza distinzione tra maiuscole e minuscole) o il campo del corpo `pseudonymization_off: true`: il contenuto raggiunge il LLM non mascherato e, dove un sink SIEM abilitato imposta sia `include_content` sia `allow_unmasked_content`, anche quel sink. Dettagli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.observability.pseudonymization.entities.label=Entità
schema.observability.pseudonymization.entities.description=Interruttori di mascheramento per categoria: `true` maschera la categoria a questo livello, `false` no, e una categoria non elencata eredita il livello inferiore (i livelli successivi prevalgono). Le chiavi sono l’insieme delle categorie note: le categorie attive per impostazione predefinita; tre facoltative fornite disattivate (`profile-org`, `profile-location`, `profile-ip-address`); e `profile-sensitive-data`, un interruttore generale che le attiva tutte tranne quelle tre. Una chiave fuori dall’insieme viene rifiutata qui. Categorie e livelli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.observability.pseudonymization.org_suffixes.label=Suffissi di organizzazione
schema.observability.pseudonymization.org_suffixes.description=Suffissi di forma giuridica che contrassegnano una sequenza di parole come nome di organizzazione, ad es. Inc, LLC, GmbH. Il confronto distingue volutamente tra maiuscole e minuscole, quindi un 'limited' minuscolo in un testo non viene deliberatamente trattato come forma giuridica; ogni voce corrisponde inoltre scritta tutta in maiuscolo, quindi una fattura che riporta ACME GMBH viene riconosciuta come la stessa organizzazione di Acme GmbH. Ha effetto solo finché profile-org è abilitato in entities; abilitare profile-org con questo elenco vuoto NON maschera nulla come organizzazione e registra un avviso. Ogni voce viene ripulita dagli spazi prima del confronto, e una voce vuota o composta solo da spazi viene scartata silenziosamente anziché rifiutata.
schema.observability.pseudonymization.location_gazetteer.label=Gazetteer delle località
schema.observability.pseudonymization.location_gazetteer.description=Termini di località letterali che il rilevatore strutturale maschera - senza distinzione tra maiuscole e minuscole, e solo come parola o frase intera; nulla viene dedotto dalle maiuscole o dal contesto. Ha effetto solo finché profile-location è abilitato in entities; abilitare profile-location con questo elenco vuoto NON maschera nulla come località e registra un avviso. Ogni voce viene ripulita dagli spazi, e una voce vuota o composta solo da spazi viene scartata silenziosamente. Fornito vuoto: i nomi di luogo dipendono dall’installazione e questo repository è pubblico, quindi popolarlo tramite questa app di configurazione di amministrazione, mai nel codice versionato.
schema.observability.pseudonymization.min_confidence.label=Confidenza min.
schema.observability.pseudonymization.min_confidence.description=Quante prove richiede un valore rilevato prima di essere mascherato, da 0 a 1 (predefinito 0.5). Un valore viene mascherato quando il suo punteggio raggiunge la soglia; un semplice nome con iniziale maiuscola ottiene circa 0.5, un pattern convalidato da checksum 0.95, una regola personalizzata 1.0. Alzare la soglia esclude prima i nomi semplici, quindi per rendere più severa una sola categoria rumorosa usare invece `thresholds`. Le regole personalizzate, gli identificatori convalidati e le credenziali non vengono mai abbassati dal contesto. Dettagli sul punteggio: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.observability.pseudonymization.thresholds.label=Soglie
schema.observability.pseudonymization.thresholds.description=Soglie di confidenza per categoria, ciascuna da 0 a 1, che sostituiscono `min_confidence` per le categorie indicate; una non elencata mantiene `min_confidence`. Il punto in cui essere severi su una sola categoria rumorosa - `profile-person` a 0.65 richiede più prove per i nomi mentre gli identificatori convalidati restano alla soglia globale. Le chiavi sono lo stesso insieme di categorie note accettato da `entities`; `profile-sensitive-data` è accettato ma non fa nulla. Regolazione per categoria: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.observability.pseudonymization.allowlist.label=Lista consentiti
schema.observability.pseudonymization.allowlist.description=Valori che questa installazione non maschera mai - un interruttore di SPEGNIMENTO, per valore. Consultata prima del punteggio di confidenza, quindi un valore elencato è esente per quante prove ci siano. Usarla per un falso positivo ricorrente con un nome proprio - un titolo di prodotto o di report che sembra una persona. Gli elenchi dei livelli vengono CONCATENATI, non sostituiti, quindi un livello inferiore aggiunge solo un’esenzione, non ne rimuove mai una. `terms` rispetto a `patterns`, e il rischio delle voci troppo ampie: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.allowlist.terms.label=Termini
schema.observability.pseudonymization.allowlist.terms.description=Valori letterali, confrontati con l’intero valore rilevato e DISTINGUENDO tra maiuscole e minuscole. La distinzione è voluta: 'Watson Studio' è il prodotto che un operatore intendeva esentare e 'watson studio' in una frase no, e un elenco senza distinzione esenterebbe anche una persona il cui cognome si scrive per caso allo stesso modo. Un termine corrisponde solo a un valore che i rilevatori hanno prodotto per intero - elencare 'Studio' non esenta 'Watson Studio'. Ogni voce qui è un interruttore di SPEGNIMENTO del mascheramento per quel valore esatto, quindi limitare l’elenco a valori che non sono mai davvero dati personali: un termine che per caso è il nome di qualcuno esenta quella persona dal mascheramento ovunque in questa installazione, silenziosamente e senza nulla nel log che lo segnali.
schema.observability.pseudonymization.allowlist.patterns.label=Pattern
schema.observability.pseudonymization.allowlist.patterns.description=Espressioni regolari (JavaScript), ciascuna confrontata con l’INTERO valore rilevato: il gateway racchiude da sé ogni voce in `^(?: )$`, quindi scrivere `Z[A-Z0-9_]+`, non `^Z[A-Z0-9_]+$`. Il confronto distingue tra maiuscole e minuscole. Ogni voce è un interruttore di SPEGNIMENTO del mascheramento, e una voce ampia disattiva il mascheramento senza errori - `[A-Z].*` disattiva quasi tutti i nomi di persona rilevati. Una corrispondenza con un campione PII integrato genera un avviso ma viene COMUNQUE applicata. Mantenere ogni voce ristretta. Dettagli: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.saturation_warn.label=Avviso di saturazione
schema.observability.pseudonymization.saturation_warn.description=Quanti valori mascherati DISTINTI può contenere una richiesta prima di essere segnalata come satura (predefinito 40). Solo segnalazione - non cambia mai ciò che viene mascherato. Oltre questo numero il gateway registra un avviso per richiesta con i conteggi per categoria e le FORME di valore più comuni (lettere come X, cifre come 9); nessun valore mascherato compare mai. L’evento SIEM di utilizzo della richiesta contiene gli stessi conteggi con un flag `saturated` - conteggi, non testo. Come leggere il report: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.observability.pseudonymization.unknown_placeholders.label=Segnaposto inventati
schema.observability.pseudonymization.unknown_placeholders.description=Che cosa succede quando una risposta contiene un segnaposto mascherato mai inviato al modello. I modelli ne inventano uno in circa 1 risposta pseudonimizzata su 125, e più spesso quanti più valori una richiesta maschera; un tale segnaposto non indica nessuno e non può mai essere risolto. withhold (predefinito): viene sostituito con un semplice contrassegno come [name withheld] e segnalato come evento di sicurezza. report: viene solo segnalato e raggiunge il client invariato, per un’installazione i cui sviluppatori scrivono nuovi segnaposto nei dati di test tramite il gateway. off: nessuna delle due cose. Un segnaposto che il client stesso ha inviato nella stessa richiesta non viene mai considerato inventato.
schema.observability.siem.label=SIEM
schema.observability.siem.description=Esportazione SIEM. Gli eventi di audit e di sicurezza vengono scritti in una outbox e consegnati almeno una volta a ogni sink abilitato.
schema.observability.siem.enabled.label=Abilitato
schema.observability.siem.enabled.description=Interruttore principale. Se false, il dispatcher non si avvia, indipendentemente dalle impostazioni dei singoli sink.
schema.observability.siem.batch_size.label=Dimensione del batch
schema.observability.siem.batch_size.description=Righe predefinite lette per sink a ogni ciclo; un sink può sostituire il valore.
schema.observability.siem.interval_ms.label=Intervallo (ms)
schema.observability.siem.interval_ms.description=Intervallo di invio predefinito in millisecondi; un sink può sostituirlo. Il periodo del timer è il più breve di tutti gli intervalli in gioco.
schema.observability.siem.reconcile_lookback_ms.label=Finestra di riconciliazione (ms)
schema.observability.siem.reconcile_lookback_ms.description=Quanto indietro, in millisecondi, il passaggio di riparazione cerca eventi della outbox mai consegnati a un sink. Delimita quella scansione e impedisce che un sink appena abilitato riproduca l’intera cronologia conservata; gli eventi più vecchi non vengono mai recuperati a posteriori.
schema.observability.siem.content_max_bytes.label=Byte max. del contenuto
schema.observability.siem.content_max_bytes.description=Limite, in byte UTF-8, applicato in modo indipendente al prompt e alla risposta prima che un evento di utilizzo venga pubblicato. Un evento troncato contiene content.truncated: true, quindi un payload parziale non viene mai scambiato per una conversazione completa. 0 è accettato e svuota il contenuto, contrassegnato come troncato. Predefinito 8192, che è anche il valore in cui ricade un valore negativo o non numerico.
schema.observability.siem.categories.label=Categorie
schema.observability.siem.categories.description=Categorie di eventi da esportare. 'usage' è un evento di completamento per richiesta ed è l’unica categoria che può contenere contenuti delle conversazioni; l’elenco fornito la omette, quindi esportarla è una scelta esplicita; un elenco assente o vuoto esporta tutte e tre, usage inclusa.
schema.observability.siem.sinks.label=Sink
schema.observability.siem.sinks.description=Sink configurati. Un sink le cui impostazioni non superano la convalida viene saltato con un avviso anziché bloccare gli altri.
schema.observability.siem.sinks.items.name.label=Nome
schema.observability.siem.sinks.items.name.description=Nome univoco del sink; la chiave usata per le righe di consegna per sink e lo stato di backoff.
schema.observability.siem.sinks.items.type.label=Tipo
schema.observability.siem.sinks.items.type.description=Implementazione del sink. Determina quali delle proprietà specifiche del tipo sotto si applicano.
schema.observability.siem.sinks.items.enabled.label=Abilitato
schema.observability.siem.sinks.items.enabled.description=Fornito a false. Un sink viene servito solo quando sia siem.enabled sia questo sono true.
schema.observability.siem.sinks.items.include_content.label=Includi il contenuto
schema.observability.siem.sinks.items.include_content.description=Scelta esplicita: invia a questo sink il prompt e la risposta di ogni richiesta, come parte di un evento di utilizzo. Predefinito false, e false su ogni sink fornito. Ciò che invia è la forma pseudonimizzata - segnaposto, non PII grezzi - a meno che non sia impostato anche allow_unmasked_content. Richiede 'usage' in siem.categories; il dispatcher rimuove completamente il contenuto per un sink in cui questo è false.
schema.observability.siem.sinks.items.allow_unmasked_content.label=Consenti contenuto non mascherato
schema.observability.siem.sinks.items.allow_unmasked_content.description=RISCHIO - legge conversazioni grezze. Scelta esplicita per ricevere contenuti che la pseudonimizzazione non ha mai mascherato, perché il mascheramento era disattivato o aggirato per quella richiesta: nomi reali, indirizzi e qualsiasi cosa un utente abbia incollato, per intero, che lascia questo sistema. Predefinito false, e ha effetto solo dove anche include_content è true. Se lasciato a false, una tale richiesta invia solo metadati e registra content.omitted: 'not-masked'.
schema.observability.siem.sinks.items.include_credential_material.label=Includi materiale delle credenziali
schema.observability.siem.sinks.items.include_credential_material.description=Scelta esplicita: invia il valore grezzo di una credenziale non risolta a fini forensi. Predefinito false; il dispatcher rimuove il campo quando è false.
schema.observability.siem.sinks.items.batch_size.label=Dimensione del batch
schema.observability.siem.sinks.items.batch_size.description=Sostituzione per sink di siem.batch_size.
schema.observability.siem.sinks.items.interval_ms.label=Intervallo (ms)
schema.observability.siem.sinks.items.interval_ms.description=Sostituzione per sink di siem.interval_ms. Deve superare il timeout di invio del sink, altrimenti gli invii si accodano uno dietro l’altro.
schema.observability.siem.sinks.items.url.label=URL
schema.observability.siem.sinks.items.url.description=webhook: URL di acquisizione completo.
schema.observability.siem.sinks.items.token_env.label=Token
schema.observability.siem.sinks.items.token_env.description=Nome dello slot di credenziali. Mai il valore di una credenziale - api_config.json è versionato in tre copie sincronizzate in un repository pubblico.
schema.observability.siem.sinks.items.endpoint.label=Endpoint
schema.observability.siem.sinks.items.endpoint.description=otel: endpoint dei log OTLP/HTTP.
schema.observability.siem.sinks.items.headers_env.label=Header
schema.observability.siem.sinks.items.headers_env.description=Nome dello slot di credenziali. Mai il valore di una credenziale - api_config.json è versionato in tre copie sincronizzate in un repository pubblico.
schema.observability.siem.sinks.items.site.label=Sito
schema.observability.siem.sinks.items.site.description=datadog: host del sito, ad es. datadoghq.com o datadoghq.eu.
schema.observability.siem.sinks.items.api_key_env.label=Chiave API
schema.observability.siem.sinks.items.api_key_env.description=Nome dello slot di credenziali. Mai il valore di una credenziale - api_config.json è versionato in tre copie sincronizzate in un repository pubblico.
schema.observability.siem.sinks.items.dcr_endpoint.label=Endpoint DCR
schema.observability.siem.sinks.items.dcr_endpoint.description=azure_sentinel: URL del Data Collection Endpoint.
schema.observability.siem.sinks.items.dcr_immutable_id.label=ID immutabile DCR
schema.observability.siem.sinks.items.dcr_immutable_id.description=azure_sentinel: id immutabile della Data Collection Rule.
schema.observability.siem.sinks.items.stream_name.label=Nome dello stream
schema.observability.siem.sinks.items.stream_name.description=azure_sentinel: nome dello stream personalizzato, ad es. Custom-SailProxy_CL.
schema.observability.siem.sinks.items.tenant_id.label=ID tenant
schema.observability.siem.sinks.items.tenant_id.description=azure_sentinel: id del tenant Entra.
schema.observability.siem.sinks.items.client_id.label=ID client
schema.observability.siem.sinks.items.client_id.description=azure_sentinel: id dell’applicazione (client) Entra.
schema.observability.siem.sinks.items.client_secret_env.label=Segreto client
schema.observability.siem.sinks.items.client_secret_env.description=Nome dello slot di credenziali. Mai il valore di una credenziale - api_config.json è versionato in tre copie sincronizzate in un repository pubblico.
schema.observability.siem.sinks.items.project_id.label=ID progetto
schema.observability.siem.sinks.items.project_id.description=gcs_pubsub: id del progetto Google Cloud.
schema.observability.siem.sinks.items.topic_id.label=ID topic
schema.observability.siem.sinks.items.topic_id.description=gcs_pubsub: id del topic Pub/Sub.
