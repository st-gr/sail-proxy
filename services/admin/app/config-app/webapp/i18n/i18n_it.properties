schema.providers.openrouter.default_pricing.image.description=Prezzo dell’input di immagini, scritto come stringa decimale. Attualmente ignorato dal gateway, come il resto di default_pricing: l’elenco dei modelli in formato OpenRouter riporta invece prezzi fissi propri.
