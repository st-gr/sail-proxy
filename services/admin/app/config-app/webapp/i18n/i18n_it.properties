schema.providers.openrouter.model_mappings.label=Mappature dei modelli
schema.providers.openrouter.model_mappings.description=Valori predefiniti per provider upstream per le richieste OpenRouter, i cui id di modello sono scritti 'provider/model'. La prima voce il cui provider corrisponde al prefisso dell’id, senza distinzione tra maiuscole e minuscole, fornisce max_tokens quando il client lo omette. È l’unico campo usato: default_context_length e id_prefix sono obbligatori secondo questo schema, ma attualmente ignorati dal gateway.
