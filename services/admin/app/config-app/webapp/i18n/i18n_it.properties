schema.providers.aws-bedrock.supports_prompt_caching.description=Indica se i modelli di questo provider ricevono i breakpoint della cache dei prompt di Anthropic. Ordine di risoluzione: il flag per modello models.overrides.<model>.supports_prompt_caching, poi questo flag a livello di provider, poi un valore predefinito true per il provider anthropic e false per tutti gli altri. Impostare false dove la cache funziona costa il prezzo pieno dell’input non in cache a ogni turno, mentre un true superfluo è risultato senza effetto - quindi disattivarlo solo per un modello noto per rifiutarlo.
