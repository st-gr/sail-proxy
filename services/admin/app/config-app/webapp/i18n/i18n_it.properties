# Configuration form field texts by schema path - generated by ci/scripts/schema-texts.js.
# English is regenerated from the schema; other languages are translated in place and kept.
schema.providers.label=Provider
schema.providers.description=Impostazioni di ciascun provider upstream, con il suo nome di trasmissione nella route come chiave (per questo `aws-bedrock` conserva il trattino). Oggi vengono letti sei provider - anthropic, aws-bedrock, google, openai, openrouter e perplexity; qualsiasi altra chiave viene accettata e convalidata, ma resta inattiva finché il gateway non la conosce. Ogni provider con nome accetta solo il proprio elenco di impostazioni, anche se alcune impostazioni accettate restano inattive sotto un determinato provider - la descrizione di ciascun campo indica dove viene letto; google è il più ristretto dei sei e contiene solo substitute_models, letto dalla route /google; ogni altra impostazione comune dei provider viene rifiutata sotto di esso anziché restare semplicemente inattiva. Chiavi per provider: https://st-gr.github.io/sail-proxy/developer/gateway#provider-configuration-keys
schema.providers.anthropic.label=Anthropic
schema.providers.anthropic.description=Il provider anthropic, servito dal percorso di richiesta Anthropic del gateway: le impostazioni comuni a ogni provider, più la versione di trasmissione di quel percorso e i suoi due filtri dei flag beta.
schema.providers.anthropic.emulate_streaming_for_models.label=Emula lo streaming per i modelli
schema.providers.anthropic.emulate_streaming_for_models.description=Modelli la cui risposta il gateway raccoglie per intero e poi riproduce come stream, perché il deployment non può trasmetterla da sé. Confrontati con il nome del modello inviato upstream, esattamente o senza il prefisso 'provider--'. Oggi usato solo per i provider anthropic e openai; una voce sotto qualsiasi altro provider non ha effetto.
schema.providers.anthropic.substitute_models.label=Modelli sostitutivi
schema.providers.anthropic.substitute_models.description=Ridenominazioni di modelli per questo provider: una richiesta che nomina 'from' (corrispondenza esatta, maiuscole e minuscole comprese) viene inoltrata come 'to'; prevale la prima voce corrispondente e le ridenominazioni non si concatenano. La risposta e l’utilizzo registrato per il costo riportano quindi il modello inoltrato, non il nome inviato dal client. Letto sulle route anthropic, aws-bedrock e google, sulla route chat completions di openrouter e sulle route di previsione SAP RPT (/sap/v1/rpt, dalla lista sap-rpt), ciascuna per il proprio provider; su /openai/v1/chat/completions e /openai/v1/responses viene consultato prima l’elenco openai, poi l’elenco perplexity.
schema.providers.anthropic.substitute_models.items.from.label=Da
schema.providers.anthropic.substitute_models.items.from.description=Il nome del modello inviato dal client.
schema.providers.anthropic.substitute_models.items.to.label=A
schema.providers.anthropic.substitute_models.items.to.description=Il nome del modello inoltrato a SAP AI Core, di solito un id di modello distribuito come anthropic--claude-4.5-sonnet--deployed.
schema.providers.anthropic.substitute_models.items.description.label=Descrizione
schema.providers.anthropic.substitute_models.items.description.description=Nota a testo libero su questa ridenominazione, per chi leggerà la configurazione in seguito. Attualmente ignorata dal gateway; non cambia nulla nel comportamento della ridenominazione.
schema.providers.anthropic.unsupported_params.label=Parametri non supportati
schema.providers.anthropic.unsupported_params.description=Parametri di richiesta che questo provider o modello non accetta. Il gateway li rimuove prima dell’inoltro a SAP AI Core, che altrimenti rifiuterebbe la richiesta con 400 "does not support parameters: [...]". Un elenco per modello sostituisce l’elenco a livello di provider anziché aggiungersi a esso.
schema.providers.anthropic.param_renames.label=Ridenominazioni dei parametri
schema.providers.anthropic.param_renames.description=Ridenominazioni dei parametri applicate sul percorso di deployment diretto, ad esempio da max_tokens a max_completion_tokens per i modelli di ragionamento OpenAI che rifiutano max_tokens. Una mappa per modello sostituisce la mappa a livello di provider anziché aggiungersi a essa.
schema.providers.anthropic.supports_responses_api.label=Supporta la Responses API
schema.providers.anthropic.supports_responses_api.description=Indica se questo provider o modello può essere servito su /openai/v1/responses. Se assente, resta valida la regola integrata per famiglia, che ammette GPT-5 distribuito e successivi e la serie o.
schema.providers.anthropic.supports_prompt_caching.label=Supporta la cache dei prompt
schema.providers.anthropic.supports_prompt_caching.description=Indica se i modelli di questo provider ricevono i breakpoint della cache dei prompt di Anthropic. Ordine di risoluzione: il flag per modello models.overrides.<model>.supports_prompt_caching, poi questo flag a livello di provider, poi un valore predefinito true per il provider anthropic e false per tutti gli altri. Impostare false dove la cache funziona costa il prezzo pieno dell’input non in cache a ogni turno, mentre un true superfluo è risultato senza effetto - quindi disattivarlo solo per un modello noto per rifiutarlo.
schema.providers.anthropic.anthropic_bedrock_version.label=Versione di Anthropic Bedrock
schema.providers.anthropic.anthropic_bedrock_version.description=La anthropic-version che il gateway invia a SAP AI Core quando il client omette l’header anthropic-version. Letta solo da providers.anthropic, quindi una copia sotto qualsiasi altro provider - aws-bedrock compreso - non ha effetto. Se assente, si ricade su bedrock-2023-05-31.
schema.providers.anthropic.excluded_beta_headers.label=Header beta esclusi
schema.providers.anthropic.excluded_beta_headers.description=Flag beta di Anthropic rimossi da una richiesta prima dell’inoltro, per funzionalità che il deployment di SAP AI Core non accetta. Applicati insieme ai flag che il gateway mette in quarantena da sé dopo un 400 'invalid beta flag' upstream. Letto solo da providers.anthropic; un elenco sotto qualsiasi altro provider non ha effetto.
schema.providers.anthropic.supported_beta_headers.label=Header beta supportati
schema.providers.anthropic.supported_beta_headers.description=Lista consentiti dei flag beta di Anthropic: finché non è vuota vengono inoltrati solo questi, e excluded_beta_headers si applica comunque in aggiunta. Vuota o assente significa nessuna lista consentiti, quindi passa ogni flag inviato dal client - il che rende l’aggiunta di una prima voce qui uno scarto silenzioso di ogni flag non elencato accanto a essa. Letta solo da providers.anthropic.
schema.providers.anthropic.sap_cache_read_token_billing_factor.label=Fattore di fatturazione SAP dei token di lettura dalla cache
schema.providers.anthropic.sap_cache_read_token_billing_factor.description=Fattore di calibrazione che scala il NUMERO di token di input di LETTURA dalla cache riportato dall’API del modello fino al numero che SAP AI Core misura in fattura, per la contabilità dei costi nativa SAP in Capacity Units. Letto dall’app di amministrazione (non dal percorso di richiesta del gateway). La riconciliazione delle fatture da marzo a giugno 2026 ha rilevato che la voce 'Cache Read Input Tokens' di SAP è ~2x i cache_read_input_tokens restituiti dall’API e registrati fedelmente da sail-proxy; il meccanismo non è documentato ed è oggetto di una richiesta a SAP. Si noti che Anthropic e AWS Bedrock moltiplicano il PREZZO della cache (lettura 0.1x, scrittura 1.25x/2x in base al TTL), mai il NUMERO di token, quindi si tratta di una calibrazione della misurazione SAP, non del modello di prezzo di Anthropic. Il valore predefinito 1.0 non applica alcuna correzione - impostarlo (ad es. 2.0) solo quando la richiesta a SAP conferma il rapporto.
schema.providers.anthropic.sap_cache_write_token_billing_factor.label=Fattore di fatturazione SAP dei token di scrittura nella cache
schema.providers.anthropic.sap_cache_write_token_billing_factor.description=Fattore di calibrazione che scala il NUMERO di token di input di SCRITTURA (creazione) nella cache riportato dall’API del modello fino al numero che SAP AI Core misura in fattura, per la contabilità dei costi nativa SAP in Capacity Units. Letto dall’app di amministrazione (non dal percorso di richiesta del gateway). La riconciliazione da marzo a giugno 2026 della voce 'Cache Write Input Tokens' di SAP con i cache_creation_input_tokens riportati dall’API è risultata incoerente da un mese all’altro (probabilmente un effetto del limite del periodo di fatturazione, poiché le scritture si concentrano all’inizio della sessione), quindi, a differenza del fattore di lettura, non è stato stabilito un rapporto unico. Il valore predefinito 1.0 non applica alcuna correzione; lasciarlo a 1.0 a meno che la richiesta a SAP non stabilisca un rapporto di scrittura certo.
schema.providers.aws-bedrock.label=Aws-bedrock
schema.providers.aws-bedrock.description=Il provider aws-bedrock, servito dallo stesso percorso di richiesta in formato Anthropic: le impostazioni comuni a ogni provider, più la versione di trasmissione di quel percorso e i suoi due filtri dei flag beta - ciascuno dei quali il gateway in realtà legge da providers.anthropic, quindi un valore qui viene accettato e resta inattivo.
schema.providers.aws-bedrock.emulate_streaming_for_models.label=Emula lo streaming per i modelli
schema.providers.aws-bedrock.emulate_streaming_for_models.description=Modelli la cui risposta il gateway raccoglie per intero e poi riproduce come stream, perché il deployment non può trasmetterla da sé. Confrontati con il nome del modello inviato upstream, esattamente o senza il prefisso 'provider--'. Oggi usato solo per i provider anthropic e openai; una voce sotto qualsiasi altro provider non ha effetto.
schema.providers.aws-bedrock.substitute_models.label=Modelli sostitutivi
schema.providers.aws-bedrock.substitute_models.description=Ridenominazioni di modelli per questo provider: una richiesta che nomina 'from' (corrispondenza esatta, maiuscole e minuscole comprese) viene inoltrata come 'to'; prevale la prima voce corrispondente e le ridenominazioni non si concatenano. La risposta e l’utilizzo registrato per il costo riportano quindi il modello inoltrato, non il nome inviato dal client. Letto sulle route anthropic, aws-bedrock e google, sulla route chat completions di openrouter e sulle route di previsione SAP RPT (/sap/v1/rpt, dalla lista sap-rpt), ciascuna per il proprio provider; su /openai/v1/chat/completions e /openai/v1/responses viene consultato prima l’elenco openai, poi l’elenco perplexity.
schema.providers.aws-bedrock.substitute_models.items.from.label=Da
schema.providers.aws-bedrock.substitute_models.items.from.description=Il nome del modello inviato dal client.
schema.providers.aws-bedrock.substitute_models.items.to.label=A
schema.providers.aws-bedrock.substitute_models.items.to.description=Il nome del modello inoltrato a SAP AI Core, di solito un id di modello distribuito come anthropic--claude-4.5-sonnet--deployed.
schema.providers.aws-bedrock.substitute_models.items.description.label=Descrizione
schema.providers.aws-bedrock.substitute_models.items.description.description=Nota a testo libero su questa ridenominazione, per chi leggerà la configurazione in seguito. Attualmente ignorata dal gateway; non cambia nulla nel comportamento della ridenominazione.
schema.providers.aws-bedrock.unsupported_params.label=Parametri non supportati
schema.providers.aws-bedrock.unsupported_params.description=Parametri di richiesta che questo provider o modello non accetta. Il gateway li rimuove prima dell’inoltro a SAP AI Core, che altrimenti rifiuterebbe la richiesta con 400 "does not support parameters: [...]". Un elenco per modello sostituisce l’elenco a livello di provider anziché aggiungersi a esso.
schema.providers.aws-bedrock.param_renames.label=Ridenominazioni dei parametri
schema.providers.aws-bedrock.param_renames.description=Ridenominazioni dei parametri applicate sul percorso di deployment diretto, ad esempio da max_tokens a max_completion_tokens per i modelli di ragionamento OpenAI che rifiutano max_tokens. Una mappa per modello sostituisce la mappa a livello di provider anziché aggiungersi a essa.
schema.providers.aws-bedrock.supports_responses_api.label=Supporta la Responses API
schema.providers.aws-bedrock.supports_responses_api.description=Indica se questo provider o modello può essere servito su /openai/v1/responses. Se assente, resta valida la regola integrata per famiglia, che ammette GPT-5 distribuito e successivi e la serie o.
