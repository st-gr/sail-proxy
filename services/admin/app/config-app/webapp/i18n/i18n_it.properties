schema.providers.openrouter.default_pricing.label=Prezzi predefiniti
schema.providers.openrouter.default_pricing.description=Prezzi di riserva di OpenRouter - completion, image e prompt, ciascuno una stringa decimale. Attualmente ignorati dal gateway; mantenuti affinché il valore fornito venga convalidato e resti visibile per qualunque consumatore venga aggiunto in seguito. Modificarlo oggi non cambia alcun comportamento.
schema.providers.openrouter.default_pricing.completion.label=Completamento
schema.providers.openrouter.default_pricing.completion.description=Prezzo dei token di completamento, scritto come stringa decimale. Attualmente ignorato dal gateway, come il resto di default_pricing: l’elenco dei modelli in formato OpenRouter riporta invece prezzi fissi propri.
