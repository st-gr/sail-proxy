schema.providers.openrouter.model_mappings.items.default_context_length.description=Obbligatorio in ogni voce, ma attualmente ignorato dal gateway; mantenuto per compatibilità.
schema.providers.openrouter.model_mappings.items.id_prefix.label=Prefisso ID
schema.providers.openrouter.model_mappings.items.id_prefix.description=Obbligatorio in ogni voce, ma attualmente ignorato dal gateway; la corrispondenza si basa sul provider, non su questo campo.
schema.providers.openrouter.model_mappings.items.provider.label=Provider
schema.providers.openrouter.model_mappings.items.provider.description=Confrontato, senza distinzione tra maiuscole e minuscole, con la parte dell’id di modello del client prima della barra.
schema.providers.openrouter.model_mappings.items.max_tokens.label=Token max.
schema.providers.openrouter.model_mappings.items.max_tokens.description=Applicato come max_tokens della richiesta quando il client non ne invia alcuno. Se assente, la richiesta resta senza.
