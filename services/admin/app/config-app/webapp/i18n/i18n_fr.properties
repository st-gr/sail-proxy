schema.providers.aws-bedrock.supported_beta_headers.description=Liste d’autorisation des indicateurs bêta Anthropic : tant qu’elle n’est pas vide, seuls ceux-ci sont transmis, et excluded_beta_headers s’applique en plus. Vide ou absente signifie aucune liste d’autorisation, donc chaque indicateur envoyé par le client passe - ajouter une première entrée ici supprime donc silencieusement tout indicateur qui n’y figure pas. Lu uniquement depuis providers.anthropic.
schema.providers.google.label=Google
schema.providers.google.description=Le fournisseur google, servi par le chemin de requête Gemini de la passerelle. Seul substitute_models est pris en compte aujourd’hui ; les autres paramètres communs de fournisseur ne sont pas encore câblés pour ce fournisseur et sont donc - contrairement à tous les autres fournisseurs nommés ici - rejetés plutôt que simplement inactifs.
