schema.providers.openrouter.default_pricing.label=Tarification par défaut
schema.providers.openrouter.default_pricing.description=Prix de repli OpenRouter - completion, image et prompt, chacun sous forme de chaîne décimale. Actuellement ignoré par la passerelle ; conservé pour que la valeur livrée reste valide et visible pour tout consommateur ajouté ultérieurement. Le modifier ne change aucun comportement aujourd’hui.
schema.providers.openrouter.default_pricing.completion.label=Complétion
schema.providers.openrouter.default_pricing.completion.description=Prix des jetons de complétion, écrit sous forme de chaîne décimale. Actuellement ignoré par la passerelle, comme le reste de default_pricing : la liste de modèles au format OpenRouter indique à la place ses propres prix fixes.
schema.providers.openrouter.default_pricing.image.label=Image
schema.providers.openrouter.default_pricing.image.description=Prix des entrées d’image, écrit sous forme de chaîne décimale. Actuellement ignoré par la passerelle, comme le reste de default_pricing : la liste de modèles au format OpenRouter indique à la place ses propres prix fixes.
schema.providers.openrouter.default_pricing.prompt.label=Prompt
schema.providers.openrouter.default_pricing.prompt.description=Prix des jetons de prompt, écrit sous forme de chaîne décimale. Actuellement ignoré par la passerelle, comme le reste de default_pricing : la liste de modèles au format OpenRouter indique à la place ses propres prix fixes.
schema.providers.openrouter.model_mappings.label=Correspondances de modèles
schema.providers.openrouter.model_mappings.description=Valeurs par défaut par fournisseur en amont pour les requêtes OpenRouter, dont les ID de modèle s’écrivent 'provider/model'. La première entrée dont le provider correspond au préfixe de l’ID, sans tenir compte de la casse, fournit max_tokens lorsque le client l’omet. C’est le seul champ utilisé : default_context_length et id_prefix sont exigés par ce schéma mais actuellement ignorés par la passerelle.
schema.providers.openrouter.model_mappings.items.default_context_length.label=Longueur de contexte par défaut
schema.providers.openrouter.model_mappings.items.default_context_length.description=Obligatoire dans chaque entrée, mais actuellement ignoré par la passerelle ; conservé pour la compatibilité.
schema.providers.openrouter.model_mappings.items.id_prefix.label=Préfixe d’ID
schema.providers.openrouter.model_mappings.items.id_prefix.description=Obligatoire dans chaque entrée, mais actuellement ignoré par la passerelle ; la correspondance se fait sur provider, pas sur ce champ.
schema.providers.openrouter.model_mappings.items.provider.label=Fournisseur
schema.providers.openrouter.model_mappings.items.provider.description=Comparé, sans tenir compte de la casse, à la partie de l’ID de modèle du client située avant la barre oblique.
schema.providers.openrouter.model_mappings.items.max_tokens.label=Jetons max.
schema.providers.openrouter.model_mappings.items.max_tokens.description=Appliqué comme max_tokens de la requête lorsque le client n’en envoie pas. En son absence, la requête reste sans.
schema.providers.perplexity.label=Perplexity
schema.providers.perplexity.description=Le fournisseur perplexity : les paramètres que porte chaque fournisseur, et rien de plus - le chemin Perplexity ne lit aucun paramètre propre.
