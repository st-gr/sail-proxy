schema.providers.openai.openai_deployment_api_version.label=Version d’API de déploiement Openai
schema.providers.openai.openai_deployment_api_version.description=Paramètre api-version d’Azure OpenAI ajouté à l’URL /chat/completions d’un modèle OpenAI déployé. Lu uniquement depuis providers.openai et envoyé uniquement pour ce fournisseur, car les déploiements Perplexity rejettent ce paramètre. Écrit sous la forme YYYY-MM-DD, éventuellement avec -preview. En son absence, aucune api-version n’est ajoutée.
schema.providers.openrouter.label=Openrouter
schema.providers.openrouter.description=Le fournisseur openrouter : les paramètres que porte chaque fournisseur, plus ses prix de repli et ses valeurs par défaut de requête par fournisseur en amont.
