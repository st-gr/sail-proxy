schema.providers.perplexity.substitute_models.items.description.label=Description
schema.providers.perplexity.substitute_models.items.description.description=Note libre sur ce renommage, pour quiconque lira la configuration plus tard. Actuellement ignorée par la passerelle ; elle ne change rien au comportement du renommage.
schema.providers.perplexity.unsupported_params.label=Paramètres non pris en charge
schema.providers.perplexity.unsupported_params.description=Paramètres de requête que ce fournisseur ou ce modèle n’accepte pas. La passerelle les supprime avant la transmission à SAP AI Core, qui sinon rejetterait la requête avec 400 "does not support parameters: [...]". Une liste par modèle remplace la liste au niveau du fournisseur au lieu de la compléter.
schema.providers.perplexity.param_renames.label=Renommages de paramètres
schema.providers.perplexity.param_renames.description=Renommages de paramètres appliqués sur le chemin de déploiement direct, par exemple max_tokens en max_completion_tokens pour les modèles de raisonnement OpenAI qui rejettent max_tokens. Une table par modèle remplace la table au niveau du fournisseur au lieu de la compléter.
schema.providers.perplexity.supports_responses_api.label=Prend en charge la Responses API
schema.providers.perplexity.supports_responses_api.description=Indique si ce fournisseur ou ce modèle peut être servi sur /openai/v1/responses. En son absence, la règle de famille intégrée s’applique ; elle admet les modèles déployés GPT-5 et ultérieurs ainsi que la série o.
schema.providers.perplexity.supports_prompt_caching.label=Prend en charge la mise en cache des prompts
schema.providers.perplexity.supports_prompt_caching.description=Indique si les modèles de ce fournisseur reçoivent des points d’arrêt de cache de prompt Anthropic. Ordre de résolution : l’indicateur models.overrides.<model>.supports_prompt_caching par modèle, puis cet indicateur au niveau du fournisseur, puis une valeur par défaut de true pour le fournisseur anthropic et false pour tous les autres. Définir false là où la mise en cache fonctionne coûte le prix d’entrée plein non mis en cache à chaque tour, alors qu’un true superflu s’est révélé sans effet à la mesure - ne le désactivez donc que pour un modèle connu pour le rejeter.
schema.providers._entry.description=Les paramètres de fournisseur que le chemin de requête de chaque fournisseur peut atteindre ; cinq des six fournisseurs nommés - tous sauf google - portent donc la forme complète. Chaque champ est facultatif, et un champ absent signifie le comportement intégré de la passerelle. C’est aussi par rapport à cette seule forme qu’est validée une clé de fournisseur que la passerelle ne lit pas : une clé inconnue y est toujours acceptée plutôt que rejetée et reste sans effet dans le fichier. Ces cinq fournisseurs nommés ajoutent leurs propres paramètres à ceux-ci et n’acceptent rien d’autre ; google, le sixième, ne référence que le champ substitute_models de cette forme et n’accepte rien d’autre - la route /google ne lit encore aucun autre paramètre de fournisseur.
schema.providers._entry.emulate_streaming_for_models.label=Émuler le streaming pour les modèles
schema.providers._entry.emulate_streaming_for_models.description=Modèles dont la passerelle collecte la réponse en entier puis la rejoue sous forme de flux, car le déploiement ne peut pas la diffuser lui-même. Comparé au nom de modèle envoyé en amont, soit exactement, soit sans le préfixe 'provider--'. Utilisé aujourd’hui uniquement pour les fournisseurs anthropic et openai ; une entrée sous tout autre fournisseur est sans effet.
schema.providers._entry.substitute_models.label=Modèles de substitution
schema.providers._entry.substitute_models.description=Renommages de modèles pour ce fournisseur : une requête qui nomme 'from' (correspondance exacte, casse comprise) est transmise sous 'to' ; la première entrée correspondante l’emporte et les renommages ne s’enchaînent pas. La réponse, ainsi que l’utilisation enregistrée pour le coût, indiquent alors le modèle transmis, et non le nom envoyé par le client. Lu sur les routes anthropic, aws-bedrock et google, sur la route chat completions d’openrouter ainsi que sur les routes de prédiction SAP RPT (/sap/v1/rpt, depuis la liste sap-rpt), chacune pour son propre fournisseur ; sur /openai/v1/chat/completions et /openai/v1/responses, la liste openai est consultée en premier, puis la liste perplexity.
schema.providers._entry.substitute_models.items.from.label=De
schema.providers._entry.substitute_models.items.from.description=Le nom de modèle envoyé par le client.
schema.providers._entry.substitute_models.items.to.label=Vers
schema.providers._entry.substitute_models.items.to.description=Le nom de modèle transmis à SAP AI Core, généralement un ID de modèle déployé tel que anthropic--claude-4.5-sonnet--deployed.
schema.providers._entry.substitute_models.items.description.label=Description
schema.providers._entry.substitute_models.items.description.description=Note libre sur ce renommage, pour quiconque lira la configuration plus tard. Actuellement ignorée par la passerelle ; elle ne change rien au comportement du renommage.
schema.providers._entry.unsupported_params.label=Paramètres non pris en charge
schema.providers._entry.unsupported_params.description=Paramètres de requête que ce fournisseur ou ce modèle n’accepte pas. La passerelle les supprime avant la transmission à SAP AI Core, qui sinon rejetterait la requête avec 400 "does not support parameters: [...]". Une liste par modèle remplace la liste au niveau du fournisseur au lieu de la compléter.
schema.providers._entry.param_renames.label=Renommages de paramètres
schema.providers._entry.param_renames.description=Renommages de paramètres appliqués sur le chemin de déploiement direct, par exemple max_tokens en max_completion_tokens pour les modèles de raisonnement OpenAI qui rejettent max_tokens. Une table par modèle remplace la table au niveau du fournisseur au lieu de la compléter.
schema.providers._entry.supports_responses_api.label=Prend en charge la Responses API
schema.providers._entry.supports_responses_api.description=Indique si ce fournisseur ou ce modèle peut être servi sur /openai/v1/responses. En son absence, la règle de famille intégrée s’applique ; elle admet les modèles déployés GPT-5 et ultérieurs ainsi que la série o.
schema.providers._entry.supports_prompt_caching.label=Prend en charge la mise en cache des prompts
schema.providers._entry.supports_prompt_caching.description=Indique si les modèles de ce fournisseur reçoivent des points d’arrêt de cache de prompt Anthropic. Ordre de résolution : l’indicateur models.overrides.<model>.supports_prompt_caching par modèle, puis cet indicateur au niveau du fournisseur, puis une valeur par défaut de true pour le fournisseur anthropic et false pour tous les autres. Définir false là où la mise en cache fonctionne coûte le prix d’entrée plein non mis en cache à chaque tour, alors qu’un true superflu s’est révélé sans effet à la mesure - ne le désactivez donc que pour un modèle connu pour le rejeter.
schema.models.label=Modèles
schema.models.overrides.label=Surcharges
schema.models.overrides.description=Ajustements par modèle fusionnés dans la liste de modèles que la passerelle récupère auprès de SAP AI Core. Chaque clé est l’ID interne d’un modèle, écrit exactement tel qu’il apparaît en transport.
schema.models.overrides._entry.description=Ajustements pour un modèle, fusionnés avec ce que SAP AI Core indique pour lui, et ayant pour clé ci-dessus l’ID interne du modèle. La fusion est délibérément ouverte : toute clé non listée ci-dessous est copiée telle quelle sur le modèle et republiée dans la liste de modèles, sans validation ni typage, au lieu d’être ignorée. Les champs ci-dessous sont ceux sur lesquels la passerelle agit elle-même.
schema.models.overrides._entry.hooks.label=Hooks
schema.models.overrides._entry.hooks.description=Hooks de ce modèle, ayant pour clé le sous-chemin de requête qu’ils arment (invoke, invoke-with-response-stream, converse, ...). Un sous-chemin listé ici REMPLACE la valeur par défaut du point de terminaison dans hooks.defaults pour ce sous-chemin au lieu d’être fusionné avec elle ; un sous-chemin non listé se rabat sur cette valeur par défaut. Un hook ne se déclenche que si chaque règle de son request.match est satisfaite, et request.callback.id nomme le plug-in à exécuter.
schema.models.overrides._entry.hooks._entry.description=La liste de hooks d’un sous-chemin, essayés dans l’ordre. La même forme sert hooks.defaults.<endpoint>.<subpath> et models.overrides.<model>.hooks.<subpath> ; la passerelle voit donc une seule forme, quelle que soit celle des deux qui l’a fournie. Un hook ne se déclenche que si CHAQUE règle nommée par son request.match correspond à la requête ; request.callback.id nomme alors le plug-in à exécuter pour la phase en cours. Un hook dont le match n’est pas satisfait, ou dont le callback ne nomme aucun plug-in enregistré pour cette phase, est ignoré et le suivant est essayé - ni l’un ni l’autre n’est une erreur à l’exécution.
schema.models.overrides._entry.hooks._entry.items.request.label=Requête
schema.models.overrides._entry.hooks._entry.items.request.description=Ce qui doit correspondre et ce qu’il faut exécuter dans ce cas. Nommé d’après la requête, car le comparateur n’inspecte jamais que la requête entrante ; il n’existe pas d’équivalent pour la réponse, et rien d’autre n’est lu sur un hook.
schema.models.overrides._entry.hooks._entry.items.request.callback.label=Callback
schema.models.overrides._entry.hooks._entry.items.request.callback.description=Le plug-in à exécuter une fois que chaque règle de match a correspondu.
schema.models.overrides._entry.hooks._entry.items.request.callback.id.label=ID
schema.models.overrides._entry.hooks._entry.items.request.callback.id.description=L’ID sous lequel un plug-in s’est enregistré, recherché dans le registre de plug-ins de la passerelle pour la phase en cours. Ce schéma ne peut pas vérifier la référence croisée : un ID qu’aucun plug-in n’a enregistré pour cette phase est journalisé comme introuvable et le hook est ignoré ; la requête passe donc sans modification au lieu d’échouer.
schema.models.overrides._entry.hooks._entry.items.request.match.label=Correspondance
schema.models.overrides._entry.hooks._entry.items.request.match.description=Les ID de règles qui doivent TOUTES correspondre, évaluées dans l’ordre et abandonnées à la première qui ne correspond pas. Chaque ID est une clé de hooks.definitions - une référence croisée que ce schéma ne peut pas vérifier : un ID défini nulle part là-bas journalise un avertissement et fait que le hook entier ne correspond pas ; une faute de frappe désactive donc silencieusement le plug-in au lieu de le déclencher sans condition. Une liste vide est rejetée, car un hook destiné à s’exécuter sur presque tout s’écrit plutôt en nommant une règle délibérément large - le payload:any livré correspond à toute requête dont le corps analysé porte un model de type chaîne non vide, ce qui est aussi proche de l’inconditionnel qu’une règle peut l’être tout en le disant explicitement.
schema.models.overrides._entry.subpaths_native.label=Sous-chemins natifs
schema.models.overrides._entry.subpaths_native.description=Les sous-chemins que ce modèle sert nativement, dans l’orthographe propre à la passerelle (invoke, invoke-with-response-stream, converse, converse-stream). Lue comme liste complète : tant qu’elle est présente, tout sous-chemin qui y manque compte comme émulé. En son absence, invoke et invoke-with-response-stream s’appliquent. Elle remplace la valeur propre de la liste de modèles, est republiée sur l’entrée du modèle, et une entrée se terminant par -stream alimente aussi la règle streamingSupported ci-dessous.
schema.models.overrides._entry.subpaths_emulated.label=Sous-chemins émulés
schema.models.overrides._entry.subpaths_emulated.description=Les sous-chemins que ce modèle atteint par l’émulation de la passerelle plutôt que nativement. Aucun routage n’en dépend - un sous-chemin compte comme émulé du simple fait de son absence de subpaths_native - ; la liste est donc purement déclarative : elle remplace la valeur propre de la liste de modèles et est republiée sur l’entrée du modèle pour les clients qui l’inspectent, rien de plus.
schema.models.overrides._entry.streamingSupported.label=Streaming pris en charge
schema.models.overrides._entry.streamingSupported.description=Indique si ce modèle prend en charge les réponses en streaming ; en camelCase car c’est l’orthographe propre de SAP AI Core dans la liste de modèles. Pour un modèle qui a une entrée overrides : un true ou false explicite ici l’emporte ; sinon, une entrée subpaths_native se terminant par -stream signifie true, sauf si la liste de modèles indiquait déjà false ; sinon, un modèle à accès par déploiement qui a une entrée mais pas de valeur explicite est forcé à FALSE - ajouter une entrée pour un déploiement en streaming en omettant cet indicateur désactive donc le streaming. Un modèle de fondation conserve sa valeur AI Core. Le résultat s’applique à chaque version du modèle.
schema.models.overrides._entry.supports_prompt_caching.label=Prend en charge la mise en cache des prompts
schema.models.overrides._entry.supports_prompt_caching.description=Indique si ce modèle reçoit des points d’arrêt de cache de prompt Anthropic. Ordre de résolution : cet indicateur par modèle, puis l’indicateur au niveau du fournisseur api_config.providers.<provider>.supports_prompt_caching, puis une valeur par défaut de true pour les modèles du fournisseur Anthropic et false pour tous les autres. Définissez false pour exclure un modèle ; un true sur un modèle Anthropic sans surcharge au niveau du fournisseur ne change rien.
schema.models.overrides._entry.anthropic_version.label=Version Anthropic
schema.models.overrides._entry.anthropic_version.description=L’anthropic_version que la passerelle insère dans le corps de la requête Bedrock invoke de ce modèle lorsque l’appelant n’en a fourni aucune. Un corps qui porte déjà le champ est laissé tel quel, et les sous-chemins autres qu’invoke ne sont pas touchés. La valeur livrée est bedrock-2023-05-31.
schema.models.overrides._entry.pseudonymization.label=Pseudonymisation
schema.models.overrides._entry.pseudonymization.description=Paramètres du plug-in de pseudonymisation. L’activation (enabled) et les commutateurs de catégorie (entities) ne s’appliquent qu’à ce plug-in ; le masquage n’a lieu que lorsque le plug-in s’exécute réellement pour une requête - il doit être enregistré dans la chaîne de hooks et une source d’activation doit se déclencher.
schema.models.overrides._entry.pseudonymization.enabled.label=Activé
schema.models.overrides._entry.pseudonymization.enabled.description=Force l’activation du masquage pour une requête. Lu uniquement là où ce bloc se trouve sous models.overrides.<model>.pseudonymization ou hooks.defaults.<endpoint>.pseudonymization : true y masque cette requête, le bloc par modèle l’emportant sur celui par point de terminaison. False ou absent ne force rien - le masquage peut tout de même s’exécuter lorsqu’une autre source d’activation se déclenche, comme un mot déclencheur ou un champ de masquage dans le corps de la requête. Sous observability.pseudonymization, cette clé est actuellement ignorée ; ce niveau fournit tous les autres paramètres d’ici, sauf method et allow_user_bypass. Dans tous les cas, le plug-in doit être raccordé à la chaîne de hooks, sinon rien n’est masqué.
schema.models.overrides._entry.pseudonymization.method.label=Méthode
schema.models.overrides._entry.pseudonymization.method.description=Mode de masquage : `pseudonymization` masque la requête et démasque la réponse ; `anonymization` masque et ne démasque jamais. Lu uniquement là où ce bloc force le masquage (un hook activé ou une surcharge de modèle), pas sous `observability.pseudonymization`. Il conditionne aussi le SIEM : seul `pseudonymization` conserve la réponse masquée ; sous `anonymization`, un sink de contenu reçoit donc le prompt mais pas la réponse. En son absence, `pseudonymization` s’applique. Modes : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.models.overrides._entry.pseudonymization.allow_user_bypass.label=Autoriser le contournement par l’utilisateur
schema.models.overrides._entry.pseudonymization.allow_user_bypass.description=N’a d’effet qu’à l’intérieur d’un bloc qui force l’activation (un hook activé ou une surcharge de modèle) ; non lu sous `observability.pseudonymization`. Valeur par défaut false. Si true, un appelant peut ignorer le masquage via l’en-tête `x-sail-proxy-pseudonymization: off` (insensible à la casse) ou le champ de corps `pseudonymization_off: true` : le contenu atteint le LLM sans masquage et, lorsqu’un sink SIEM activé définit à la fois `include_content` et `allow_unmasked_content`, ce sink également. Détails : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.models.overrides._entry.pseudonymization.entities.label=Entités
schema.models.overrides._entry.pseudonymization.entities.description=Commutateurs de masquage par catégorie : `true` masque la catégorie à ce niveau, `false` non, et une catégorie non listée hérite du niveau inférieur (les niveaux ultérieurs l’emportent). Les clés sont l’ensemble des catégories connues : les catégories actives par défaut ; trois catégories optionnelles livrées désactivées (`profile-org`, `profile-location`, `profile-ip-address`) ; et `profile-sensitive-data`, un commutateur global qui les active toutes sauf ces trois. Une clé hors de cet ensemble est rejetée ici. Catégories et niveaux : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.models.overrides._entry.pseudonymization.org_suffixes.label=Suffixes d’organisation
schema.models.overrides._entry.pseudonymization.org_suffixes.description=Suffixes de forme juridique qui marquent une suite de mots comme nom d’organisation, p. ex. Inc, LLC, GmbH. La correspondance est sensible à la casse par conception ; un 'limited' en minuscules dans un texte n’est donc délibérément pas traité comme forme juridique ; chaque entrée correspond en outre en majuscules intégrales, de sorte qu’une facture qui écrit ACME GMBH est reconnue comme la même organisation qu’Acme GmbH. N’a d’effet que tant que profile-org est activé dans entities ; activer profile-org avec cette liste vide ne masque RIEN comme organisation et journalise un avertissement. Chaque entrée est rognée avant la comparaison, et une entrée vide ou ne contenant que des espaces est silencieusement supprimée plutôt que rejetée.
schema.models.overrides._entry.pseudonymization.location_gazetteer.label=Répertoire de lieux
schema.models.overrides._entry.pseudonymization.location_gazetteer.description=Termes de lieu littéraux que le détecteur structurel masque - sans tenir compte de la casse, et uniquement en mot entier ou en expression entière ; rien n’est déduit des majuscules ou du contexte. N’a d’effet que tant que profile-location est activé dans entities ; activer profile-location avec cette liste vide ne masque RIEN comme lieu et journalise un avertissement. Chaque entrée est rognée, et une entrée vide ou ne contenant que des espaces est silencieusement supprimée. Livrée vide : les noms de lieux sont propres au déploiement et ce dépôt est public ; renseignez-la donc via cette application d’administration de la configuration, jamais dans du code versionné.
schema.models.overrides._entry.pseudonymization.min_confidence.label=Confiance min.
schema.models.overrides._entry.pseudonymization.min_confidence.description=Quantité de preuves qu’une valeur détectée doit réunir avant d’être masquée, de 0 à 1 (par défaut 0.5). Une valeur est masquée dès que son score atteint le seuil ; un simple nom avec majuscule obtient environ 0.5, un motif validé par somme de contrôle 0.95, une règle personnalisée 1.0. Relever le seuil écarte d’abord les noms simples ; resserrez donc plutôt une catégorie bruyante avec `thresholds`. Les règles personnalisées, les identifiants validés et les données d’authentification ne sont jamais rabaissés par leur contexte. Détails du score : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.models.overrides._entry.pseudonymization.thresholds.label=Seuils
schema.models.overrides._entry.pseudonymization.thresholds.description=Seuils de confiance par catégorie, chacun de 0 à 1, qui remplacent `min_confidence` pour les catégories nommées ; une catégorie non listée conserve `min_confidence`. C’est l’endroit où se montrer strict sur une seule catégorie bruyante - `profile-person` à 0.65 exige plus de preuves pour les noms tandis que les identifiants validés restent au seuil global. Les clés sont le même ensemble de catégories connues que celui accepté par `entities` ; `profile-sensitive-data` est accepté mais sans effet. Réglage par catégorie : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.models.overrides._entry.pseudonymization.allowlist.label=Liste d’autorisation
schema.models.overrides._entry.pseudonymization.allowlist.description=Valeurs que ce déploiement ne masque jamais - un interrupteur d’ARRÊT, par valeur. Consultée avant le score de confiance ; une valeur listée est donc exemptée quelle que soit la quantité de preuves. Utilisez-la pour un faux positif récurrent portant un nom propre - un titre de produit ou de rapport qui ressemble à une personne. Les listes des niveaux sont CONCATÉNÉES, pas remplacées ; un niveau inférieur ne fait donc qu’ajouter une exemption, sans jamais en retirer. `terms` ou `patterns`, et le risque d’une entrée trop large : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.allowlist.terms.label=Termes
schema.models.overrides._entry.pseudonymization.allowlist.terms.description=Valeurs littérales, comparées à la valeur détectée entière et EN TENANT COMPTE DE LA CASSE. Sensible à la casse par conception : 'Watson Studio' est le produit qu’un opérateur voulait exempter, 'watson studio' dans une phrase ne l’est pas, et une liste insensible à la casse exempterait aussi une personne dont le nom de famille s’écrit de la même façon. Un terme ne correspond qu’à une valeur que les détecteurs ont produite en entier - lister 'Studio' n’exempte pas 'Watson Studio'. Chaque entrée ici est un interrupteur d’ARRÊT du masquage pour cette valeur exacte ; limitez donc la liste aux valeurs qui ne sont réellement jamais des données personnelles : un terme qui se trouve être le nom de quelqu’un exempte cette personne du masquage partout dans ce déploiement, silencieusement et sans rien dans le journal pour le signaler.
schema.models.overrides._entry.pseudonymization.allowlist.patterns.label=Motifs
schema.models.overrides._entry.pseudonymization.allowlist.patterns.description=Expressions régulières (JavaScript), chacune comparée à la valeur détectée ENTIÈRE : la passerelle encadre elle-même chaque entrée par `^(?: )$` ; écrivez donc `Z[A-Z0-9_]+`, pas `^Z[A-Z0-9_]+$`. La correspondance est sensible à la casse. Chaque entrée est un interrupteur d’ARRÊT du masquage, et une entrée large désactive le masquage sans échouer - `[A-Z].*` désactive presque tous les noms de personnes détectés. Une correspondance avec un exemple de PII intégré émet un avertissement mais est TOUT DE MÊME appliquée. Gardez chaque entrée étroite. Détails : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.saturation_warn.label=Avertissement de saturation
schema.models.overrides._entry.pseudonymization.saturation_warn.description=Nombre de valeurs masquées DISTINCTES qu’une requête peut porter avant d’être signalée comme saturée (par défaut 40). Signalement uniquement - cela ne change jamais ce qui est masqué. Au-delà de ce nombre, la passerelle journalise un avertissement par requête avec des décomptes par catégorie et les FORMES de valeur les plus fréquentes (lettres en X, chiffres en 9) ; aucune valeur masquée n’apparaît jamais. L’événement SIEM d’utilisation de la requête porte les mêmes décomptes avec un indicateur `saturated` - des décomptes, pas du texte. Lire le rapport : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.models.overrides._entry.pseudonymization.unknown_placeholders.label=Espaces réservés inventés
schema.models.overrides._entry.pseudonymization.unknown_placeholders.description=Ce qui se passe lorsqu’une réponse contient un espace réservé masqué qui n’a jamais été envoyé au modèle. Les modèles en inventent un dans environ 1 réponse pseudonymisée sur 125, et d’autant plus souvent que la requête masque de valeurs ; un tel espace réservé ne désigne personne et ne peut jamais être résolu. withhold (par défaut) : il est remplacé par un simple marqueur tel que [name withheld] et signalé comme événement de sécurité. report : il est seulement signalé et parvient inchangé au client, pour un déploiement dont les propres développeurs écrivent de nouveaux espaces réservés dans des fixtures de test via la passerelle. off : ni l’un ni l’autre. Un espace réservé que le client a lui-même envoyé dans la même requête n’est jamais considéré comme inventé.
schema.models.overrides._entry.unsupported_params.label=Paramètres non pris en charge
schema.models.overrides._entry.unsupported_params.description=Paramètres de requête que ce fournisseur ou ce modèle n’accepte pas. La passerelle les supprime avant la transmission à SAP AI Core, qui sinon rejetterait la requête avec 400 "does not support parameters: [...]". Une liste par modèle remplace la liste au niveau du fournisseur au lieu de la compléter.
schema.models.overrides._entry.param_renames.label=Renommages de paramètres
schema.models.overrides._entry.param_renames.description=Renommages de paramètres appliqués sur le chemin de déploiement direct, par exemple max_tokens en max_completion_tokens pour les modèles de raisonnement OpenAI qui rejettent max_tokens. Une table par modèle remplace la table au niveau du fournisseur au lieu de la compléter.
schema.models.overrides._entry.supports_responses_api.label=Prend en charge la Responses API
schema.models.overrides._entry.supports_responses_api.description=Indique si ce fournisseur ou ce modèle peut être servi sur /openai/v1/responses. En son absence, la règle de famille intégrée s’applique ; elle admet les modèles déployés GPT-5 et ultérieurs ainsi que la série o.
schema.models.overrides._entry.cachePricing.label=Tarification du cache
schema.models.overrides._entry.cachePricing.description=Prix du cache de prompt pour ce modèle ; en camelCase délibérément, une orthographe cache_pricing n’est pas lue. Les deux valeurs sont des CHAÎNES de coût décimales pour 1K jetons, jamais des nombres : elles sont reportées telles quelles dans la liste des coûts de chaque version et transmises à tout ce qui demande la tarification du cache de ce modèle. En son absence, ce modèle n’indique aucune tarification de cache.
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.label=Coût de lecture du cache pour 1K jetons d’entrée
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.description=Coût de lecture de 1K jetons d’entrée mis en cache, sous forme de chaîne décimale - p. ex. 0.00020, pas 0.0002e0 et pas un nombre.
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.label=Coût de création du cache pour 1K jetons d’entrée
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.description=Coût d’écriture de 1K jetons d’entrée dans le cache, sous forme de chaîne décimale - p. ex. 0.00254, pas un nombre.
schema.models.overrides._entry.inject_beta_features.label=Injecter des fonctionnalités bêta
schema.models.overrides._entry.inject_beta_features.description=Indicateurs de fonctionnalités bêta Anthropic que la passerelle ajoute aux requêtes Bedrock invoke de ce modèle. Ils sont fusionnés avec l’en-tête anthropic-beta et tout anthropic_beta présent dans le corps de la requête, puis filtrés par supported_beta_headers, excluded_beta_headers et la quarantaine d’indicateurs bêta à l’exécution - un indicateur listé ici est donc tout de même supprimé s’il n’est pas autorisé. Une liste vide n’injecte rien.
schema.models.overrides._entry.contextLength.label=Longueur de contexte
schema.models.overrides._entry.contextLength.description=La fenêtre de contexte de ce modèle en jetons, utilisée uniquement comme valeur de repli : la passerelle préfère la longueur de contexte de la dernière version fournie par SAP AI Core et ne lit cette valeur que lorsque la liste de modèles n’en porte aucune, avant de se rabattre sur une valeur par défaut par famille. Elle est indiquée comme context_length, et sa moitié comme max_completion_tokens, dans les listes de modèles aux formats OpenRouter et OpenAI. 0 n’est pas une valeur utilisable.
schema.capabilities.label=Capacités
schema.capabilities.web_search.label=Recherche web
schema.capabilities.web_search.description=Outil de recherche web hébergé (basé sur Perplexity). L’unique réglage ici limite le nombre de recherches qu’une seule requête peut lancer.
schema.capabilities.web_search.max_searches_per_request.label=Recherches max. par requête
schema.capabilities.web_search.max_searches_per_request.description=Plafond des recherches web hébergées qu’une requête peut effectuer avant que la passerelle cesse de poursuivre le tour. Chaque recherche coûte un appel Perplexity plus un aller-retour complet vers le déploiement ; c’est donc un contrôle des coûts en plus de la garantie d’arrêt de la boucle de poursuite. Une valeur non entière, nulle, négative ou supérieure à 10 se rabat sur la valeur par défaut de 3 au lieu d’être prise en compte - la limite ne doit jamais pouvoir être supprimée par configuration.
schema.capabilities.file_search.label=Recherche de fichiers
schema.capabilities.file_search.description=Récupération de documents compatible OpenAI : ingestion /v1/files, /v1/vector_stores, recherche hybride et l’outil hébergé file_search. Rien n’est obligatoire ici - chaque champ se rabat sur sa propre valeur par défaut livrée lorsqu’il est absent ; supprimer un champ est donc une modification valide et non une erreur.
schema.capabilities.file_search.enabled.label=Activé
schema.capabilities.file_search.enabled.description=Interrupteur principal de toute la fonctionnalité, par défaut true. Il est combiné avec "une base de données est configurée" et "la migration a été exécutée" : false fait répondre chaque route /v1/files et /v1/vector_stores par 503 file_search_unavailable. Le worker d’ingestion (qui exécute aussi la réincorporation) et les deux balayeurs ne le vérifient qu’au démarrage ; après une modification, redémarrez donc la passerelle. Les fichiers et les stores déjà enregistrés ne sont pas touchés.
schema.capabilities.file_search.embedding_model.label=Modèle d’embedding
schema.capabilities.file_search.embedding_model.description=Modèle d’embedding demandé au déploiement d’orchestration SAP AI Core et enregistré dans chaque événement du journal teacher. Par défaut text-embedding-3-large. Chaque vector store conserve le modèle avec lequel il a été construit : ses recherches et ses nouveaux fichiers utilisent ce modèle ; modifier ce paramètre laisse donc les stores existants intacts. Ils apparaissent comme obsolètes dans le cockpit Grounding, où leur propriétaire ou un administrateur peut les réincorporer avec le nouveau modèle ; d’ici là, ils continuent de répondre avec leurs anciens vecteurs. Un modèle d’une autre largeur de vecteur exige aussi de modifier embedding_dimensions, et la réincorporation ne peut pas changer la largeur d’un store.
schema.capabilities.file_search.embedding_dimensions.label=Dimensions de l’embedding
schema.capabilities.file_search.embedding_dimensions.description=Largeur des vecteurs, envoyée comme paramètre dimensions du modèle d’embedding et utilisée pour créer la colonne de vecteurs. Par défaut 1536, et figée dès qu’un store existe : un vecteur de réponse de toute autre longueur est refusé, et chaque store lié à l’ancienne largeur répond 409 - à une RECHERCHE comme à un rattachement ; il cesse donc de répondre aux requêtes et ne peut plus jamais recevoir de fichier. Il reste listable, récupérable et supprimable. Modifier cette valeur sur un déploiement alimenté laisse donc ses stores en plan au lieu de les migrer : la réincorporation depuis le cockpit Grounding conserve la largeur d’un store ; un tel store doit donc être migré par un opérateur.
schema.capabilities.file_search.rewrite_query.label=Réécrire la requête
schema.capabilities.file_search.rewrite_query.description=Indique si POST /v1/vector_stores/{id}/search réécrit la requête de l’appelant via le déploiement d’orchestration avant de calculer son embedding. Par défaut false. Cela coûte environ 1.3s par recherche et se fait au mieux - une réécriture échouée se rabat sur la requête d’origine et ne fait jamais échouer la recherche. Seul ce chemin REST lit cette valeur, un rewrite_query par requête la remplace, et l’OUTIL hébergé file_search transmet toujours false car le modèle a déjà transformé le tour de l’utilisateur en requête.
schema.capabilities.file_search.rewrite_query_model.label=Modèle de réécriture de la requête
schema.capabilities.file_search.rewrite_query_model.description=Modèle utilisé pour l’appel de réécriture, par défaut gpt-5-mini. Configurable plutôt que fixe, car un nom de modèle valide sur un tenant SAP AI Core peut être rejeté par un autre. Consulté uniquement lorsque rewrite_query est activé.
schema.capabilities.file_search.hybrid.label=Hybride
schema.capabilities.file_search.hybrid.description=Rappel à l’étape 1 et reclassement facultatif à l’étape 2. L’étape 1 exécute un classement par similarité vectorielle et - si lexical_enabled - un classement plein texte, fusionne les deux par reciprocal rank fusion et transmet les `candidates` meilleurs chunks au reclasseur.
schema.capabilities.file_search.hybrid.rrf_k.label=k RRF
schema.capabilities.file_search.hybrid.rrf_k.description=Constante de la reciprocal rank fusion : chaque classement apporte 1/(k + rank) au score fusionné d’un chunk. Par défaut 60. Un k plus grand aplatit l’écart entre rangs voisins ; l’accord entre les deux classements compte alors davantage que le meilleur résultat propre à chacun ; un k plus petit laisse dominer la tête de chaque classement. Enregistré dans chaque événement du journal teacher ; une modification est donc visible dans les labels.
schema.capabilities.file_search.hybrid.lexical_enabled.label=Lexical activé
schema.capabilities.file_search.hybrid.lexical_enabled.description=Indique si le classement plein texte s’exécute à côté du classement vectoriel. Par défaut true. False ne fusionne que le classement vectoriel ; les correspondances exactes de mots-clés et d’identifiants que les embeddings manquent ne sont alors plus du tout rappelées.
schema.capabilities.file_search.hybrid.lexical_query.label=Requête lexicale
schema.capabilities.file_search.hybrid.lexical_query.description=Comment le classement plein texte fait correspondre la requête. "any" (par défaut) garde les mots de la requête qui ne sont ni des mots vides courants de l’anglais ou de l’allemand ni un seul caractère (une lettre ou un chiffre isolé) et retient un chunk qui en contient au moins un ; une question rédigée sous forme de phrase trouve donc toujours les chunks contenant ses termes clés, et les chunks qui en contiennent davantage sont mieux classés. "all" ne retient que les chunks qui contiennent chaque mot de la requête, mots vides compris - le comportement des versions précédentes, qu’une question en langage naturel remplit rarement. Ne s’applique que tant que lexical_enabled vaut true.
schema.capabilities.file_search.hybrid.candidates.label=Candidats
schema.capabilities.file_search.hybrid.candidates.description=Nombre de chunks fusionnés que l’étape 1 rappelle, par défaut 50. C’est la taille d’entrée du reclasseur et donc son coût par recherche, et c’est aussi un plafond strict pour la réponse : le max_num_results de l’appelant est appliqué ensuite ; aucune recherche ne peut donc renvoyer plus de chunks que cela.
schema.capabilities.file_search.hybrid.rerank.label=Reclassement
schema.capabilities.file_search.hybrid.rerank.description=Étape 2 : un cross-encoder Cohere hébergé par SAP AI Core note les candidats de l’étape 1 par rapport à la requête et renvoie un score de pertinence calibré entre 0 et 1 - le score sur lequel filtre ranking_options.score_threshold.
schema.capabilities.file_search.hybrid.rerank.enabled.label=Activé
schema.capabilities.file_search.hybrid.rerank.enabled.description=À trois états, et les trois valeurs ne sont pas des degrés d’une même chose. false ne reclasse jamais : aucune recherche de déploiement, aucun appel, et les résultats conservent leur ordre fusionné. "auto" (la valeur par défaut) se fait au mieux - l’absence de déploiement de reclasseur en cours d’exécution, ou un appel échoué, expiré ou mal formé, se rabat sur l’ordre fusionné au lieu de faire échouer la recherche. true EXIGE l’étape 2 : "no deployment found" comme "the call failed" font alors échouer la recherche ; un opérateur qui a demandé le reclassement ne reçoit donc jamais en silence des résultats non reclassés.
schema.capabilities.file_search.hybrid.rerank.model.label=Modèle
schema.capabilities.file_search.hybrid.rerank.model.description=Le nom de modèle qui sert à la fois à trouver le déploiement du reclasseur - le premier déploiement à l’état RUNNING du scénario foundation-models qui sert un modèle portant exactement ce nom - et à l’appel de reclassement. Par défaut "cohere-reranker" - vérifié en direct sur le tenant, et NON le "cohere-reranker-35" publié par SAP. Ce n’est pas un choix de fournisseur : la passerelle parle exactement un protocole de reclassement et seul le nom de modèle varie ; c’est pourquoi le journal teacher enregistre toujours le fournisseur comme "cohere".
schema.capabilities.file_search.hybrid.rerank.input.label=Entrée
schema.capabilities.file_search.hybrid.rerank.input.description=Ce que le reranker lit pour chaque chunk candidat. "context_and_text" (par défaut) : le contexte du chunk, s’il en a un, suivi de son texte ; les chunks sans contexte (découpage statique) sont lus comme leur texte. "text" : uniquement le texte du chunk. Le contexte n’apparaît jamais dans les résultats de recherche.
schema.capabilities.file_search.ann.label=Recherche approximative
schema.capabilities.file_search.ann.description=Recherche vectorielle approximative pour les grands vector stores, via l’index HNSW. Désactivée par défaut : le classement vectoriel compare alors la requête à chaque chunk des stores interrogés, ce qui est exact mais prend d’autant plus de temps que les stores sont grands. Activée, une recherche n’utilise l’index que là où il est rentable et reste exacte sinon : avec un filtre d’attributs, lorsqu’elle porte sur au plus exact_max_chunks chunks ou sur moins de min_fraction de tous les chunks stockés, tant que l’index n’est pas encore du type que construit la commande rebuild-index, et avec un pgvector antérieur à 0.8. Pour certaines questions, la recherche approximative peut renvoyer une liste complète de passages qui manque la plupart des chunks les plus pertinents ; mesurez donc son rappel sur vos propres données avec la sonde de rappel avant de l’activer.
schema.capabilities.file_search.ann.enabled.label=Activé
schema.capabilities.file_search.ann.enabled.description=Indique si les recherches sur de grands stores utilisent l’index HNSW. Par défaut false : toute recherche est exacte. Lorsque l’index renvoie moins de chunks que demandé, la recherche s’exécute de manière exacte à la place.
schema.capabilities.file_search.ann.exact_max_chunks.label=Chunks max. en recherche exacte
schema.capabilities.file_search.ann.exact_max_chunks.description=Une recherche portant sur au plus ce nombre de chunks reste exacte, comptés sur les stores qu’elle interroge avec un même modèle d’embedding. Par défaut 20000. Le même nombre décide, que la recherche approximative soit activée ou non, quand la partie plein texte d’une recherche est limitée : une recherche portant sur plus de chunks retire de sa requête « n’importe quel mot » les mots que contiennent plus de 5 pour cent de tous les chunks stockés, et classe les passages contenant tous les mots plus au plus 5000 autres correspondances plein texte. Sur une table analysée, 0 limite la partie plein texte de chaque recherche.
schema.capabilities.file_search.ann.min_fraction.label=Fraction minimale
schema.capabilities.file_search.ann.min_fraction.description=Une recherche portant sur moins de cette part de tous les chunks stockés reste exacte : la recherche exacte y est plus rapide que l’index. Par défaut 0.05 (5 pour cent).
schema.capabilities.file_search.chunking.label=Découpage
schema.capabilities.file_search.chunking.description=Comment les documents d’un NOUVEAU vector store sont découpés en chunks. Un store reprend ces valeurs à sa création et les conserve : les modifier ici ne redécoupe ni ne modifie jamais un store existant. La configuration livrée définit "structure" à 800 jetons sans chevauchement, avec contextes. Une clé non définie signifie ce que ce formulaire affiche pour elle : découpage statique sans contextes ; une configuration d’une version précédente, ou sans ce bloc, conserve donc le découpage statique. Les stores créés avant l’existence de ce paramètre utilisent le découpage statique 800/400. Un fichier rattaché avec une chunking_strategy statique explicite est découpé avec cette stratégie ; "auto" ou aucune utilise le paramètre du store. Les valeurs sont vérifiées à la création d’un store : chunk_overlap_tokens ne doit pas dépasser la moitié de max_chunk_size_tokens, et contextual exige la stratégie "structure". Si le paramètre est invalide, les nouveaux stores reçoivent à la place un découpage statique 800/400 et le gateway journalise un avertissement.
schema.capabilities.file_search.chunking.strategy.label=Stratégie
schema.capabilities.file_search.chunking.strategy.description="static" (par défaut sans valeur) découpe le texte en fenêtres de taille fixe qui se chevauchent, comme la stratégie statique d’OpenAI et les versions précédentes. "structure" (définie dans la configuration livrée) suit les sections et les titres du document, de sorte qu’un chunk ne franchit pas la limite d’une section ; les fichiers découpés ainsi indiquent le type de stratégie de découpage "other" via l’API OpenAI. Activer contextual exige "structure".
schema.capabilities.file_search.chunking.max_chunk_size_tokens.label=Taille max. des chunks en jetons
schema.capabilities.file_search.chunking.max_chunk_size_tokens.description=Plus grand chunk, en jetons, entre 100 et 4096. Par défaut 800. Avec "static" la taille est une estimation (nombre de mots fois 1.3) ; avec "structure" elle est comptée avec un vrai tokenizer.
schema.capabilities.file_search.chunking.chunk_overlap_tokens.label=Chevauchement des chunks en jetons
schema.capabilities.file_search.chunking.chunk_overlap_tokens.description=Combien de jetons chaque chunk répète de son prédécesseur, afin qu’un passage coupé par une limite soit tout de même retrouvé en entier. Sans valeur : 0 avec "structure", 400 avec "static". Ne doit pas dépasser la moitié de max_chunk_size_tokens. Avec "structure" le chevauchement ne s’applique qu’à l’intérieur d’une section qui nécessite plus d’un chunk.
schema.capabilities.file_search.chunking.contextual.label=Contextuel
schema.capabilities.file_search.chunking.contextual.description=Indique si chaque chunk reçoit en plus un court contexte, rédigé par un modèle de langage, qui le situe dans son document et est recherché avec lui. Désactivé sans valeur. Exige la stratégie "structure" ; ajoute un appel de modèle par chunk lors de l’ingestion, enregistré comme utilisation du propriétaire du store.
schema.capabilities.file_search.contextual.label=Contextes des chunks
schema.capabilities.file_search.contextual.description=Comment les contextes des chunks sont rédigés pour les vector stores dont le paramètre de découpage est contextuel : lors de l’ingestion, un modèle de langage rédige un court contexte pour chaque chunk, qui est recherché avec le chunk. Ces valeurs n’activent pas le découpage contextuel ; c’est le paramètre de découpage du store qui le fait. Un appel en échec ou expiré laisse ce chunk sans contexte et ne fait jamais échouer le fichier.
schema.capabilities.file_search.contextual.model.label=Modèle
schema.capabilities.file_search.contextual.model.description=Le modèle d’orchestration SAP AI Core qui rédige les contextes. Par défaut "gemini-3.5-flash-lite". Si le modèle n’est pas disponible, les fichiers sont ingérés sans contextes. Le document est envoyé avec chaque chunk d’un fichier ; les modèles Claude le mettent en cache entre ces appels, les autres modèles le font là où ils le font d’eux-mêmes.
schema.capabilities.file_search.contextual.max_document_tokens.label=Taille max. du document en jetons
schema.capabilities.file_search.contextual.max_document_tokens.description=Plus grand document, en jetons, envoyé en entier avec chaque chunk, entre 8192 et 200000. Par défaut 32000. Un document plus long est envoyé sous forme d’extrait de cette taille autour du chunk. Des valeurs plus grandes donnent à chaque contexte davantage du document, mais coûtent plus de jetons d’entrée par chunk.
schema.capabilities.file_search.contextual.concurrency.label=Concurrence
schema.capabilities.file_search.contextual.concurrency.description=Combien d’appels de contexte pour un fichier s’exécutent en même temps, entre 1 et 16. Par défaut 4. Le premier chunk d’un fichier s’exécute toujours seul.
schema.capabilities.file_search.contextual.request_timeout_ms.label=Délai de la requête (ms)
schema.capabilities.file_search.contextual.request_timeout_ms.description=Durée maximale d’un appel de contexte, en millisecondes. Par défaut 30000. Un appel qui dure plus longtemps laisse son chunk sans contexte.
schema.capabilities.file_search.contextual.file_deadline_ms.label=Échéance par fichier (ms)
schema.capabilities.file_search.contextual.file_deadline_ms.description=Durée, en millisecondes, après laquelle plus aucun appel de contexte ne démarre pour un fichier. Par défaut 360000 (6 minutes). Les chunks restants sont enregistrés sans contexte ; le fichier est tout de même ingéré.
schema.capabilities.file_search.contextual.max_input_tokens_per_file.label=Jetons d’entrée max. par fichier
schema.capabilities.file_search.contextual.max_input_tokens_per_file.description=Jetons d’entrée que les appels de contexte d’un fichier peuvent utiliser, jetons en cache compris, entre 10000 et 1000000000. Par défaut 20000000. Une fois qu’un fichier les a utilisés, plus aucun appel de contexte ne démarre pour lui ; les chunks restants sont enregistrés sans contexte et le fichier est tout de même ingéré.
schema.capabilities.file_search.parent_sections.label=Sections parentes
schema.capabilities.file_search.parent_sections.description=Comment les résultats de recherche des vector stores découpés par structure sont élargis à la section dont ils proviennent, afin que le modèle lise une correspondance dans son contexte. Plusieurs correspondances dans une même section sont renvoyées une seule fois, sous forme de cette section. Les résultats des stores à découpage statique sont renvoyés tels quels.
schema.capabilities.file_search.parent_sections.max_tokens.label=Jetons max.
schema.capabilities.file_search.parent_sections.max_tokens.description=Plus grande section parente renvoyée, en jetons, entre 200 et 8000. Par défaut 1500. Une section plus longue est renvoyée sous forme d’extrait de cette taille autour de la correspondance ; une correspondance qui est à elle seule plus longue est renvoyée seule.
schema.capabilities.file_search.parent_sections.scope.label=Portée
schema.capabilities.file_search.parent_sections.scope.description=Où les résultats sont renvoyés sous forme de sections parentes : "tool" (par défaut) uniquement dans l’outil file_search de l’API Responses ; "all" également dans le point de terminaison de recherche des vector stores, qui renvoie sinon les chunks correspondants ; "off" nulle part.
schema.capabilities.file_search.limits.label=Limites
schema.capabilities.file_search.limits.description=Plafonds stricts de ce qui peut être téléversé, extrait et rattaché. Chacun est appliqué là où il s’applique plutôt que par ce schéma ; ces valeurs sont donc lues en direct et prennent effet sans redémarrage.
schema.capabilities.file_search.limits.max_file_bytes.label=Taille max. de fichier en octets
schema.capabilities.file_search.limits.max_file_bytes.description=Plus grand téléversement accepté par POST /v1/files, par défaut 33554432 octets (32 MiB). Appliqué PENDANT la lecture du téléversement plutôt qu’après ; un corps trop volumineux est donc coupé au lieu d’être mis en mémoire tampon, et l’appelant reçoit un 4xx propre qui nomme la limite.
schema.capabilities.file_search.limits.max_tokens_per_file.label=Jetons max. par fichier
schema.capabilities.file_search.limits.max_tokens_per_file.description=Plus grand document extrait, en jetons estimés ; par défaut 5000000. Un fichier qui dépasse la limite échoue DÉFINITIVEMENT au lieu d’être réessayé. Abaisser cette valeur ne revérifie pas les fichiers déjà ingérés.
schema.capabilities.file_search.limits.max_files_per_store.label=Fichiers max. par magasin vectoriel
schema.capabilities.file_search.limits.max_files_per_store.description=Plafond de fichiers rattachés à un vector store, par défaut 10000. Il limite les file_ids acceptés lors de la création d’un store - en plus d’une limite stricte de 500 ID de fichier par appel de création ou de lot de fichiers - et refuse un rattachement ou un lot de fichiers qui ferait dépasser ce plafond au store.
schema.capabilities.file_search.ingestion.label=Ingestion
schema.capabilities.file_search.ingestion.description=Le worker d’arrière-plan qui extrait, découpe, calcule l’embedding et stocke un fichier rattaché, et réincorpore les fichiers d’un store dont le modèle d’embedding est en cours de changement - les téléversements d’abord. Il prend son travail dans le même pool de base de données file_search que le chemin de recherche ; ces réglages arbitrent donc entre débit d’ingestion et latence de recherche.
schema.capabilities.file_search.ingestion.concurrency.label=Concurrence
schema.capabilities.file_search.ingestion.concurrency.description=Nombre de boucles de prise en charge et de traitement que le worker démarre, par défaut 4 ; les mêmes boucles exécutent aussi la réincorporation. Chacune prend des connexions du pool file_search de 10 connexions pour ses étapes de base de données. Lu une fois au démarrage ; une modification nécessite donc un redémarrage.
schema.capabilities.file_search.ingestion.extract_timeout_ms.label=Délai d’extraction (ms)
schema.capabilities.file_search.ingestion.extract_timeout_ms.description=Délai de conversion d’un document en texte par un convertisseur externe - PDF, docx, odt, epub et rst -, par défaut 60000 ms. Les formats de texte brut sont décodés directement et n’ont aucun délai. Un dépassement fait échouer cette tentative, pas le lot ; le fichier est retenté jusqu’à max_retries fois.
schema.capabilities.file_search.ingestion.max_retries.label=Tentatives max.
schema.capabilities.file_search.ingestion.max_retries.description=Tentatives par fichier avant son échec, par défaut 3 ; le même budget s’applique à chaque fichier d’une réincorporation. Un entier supérieur ou égal à 1 est utilisé tel quel. 0 est lu comme 1, avec un avertissement - pris au pied de la lettre, il ferait échouer chaque fichier rattaché avant sa première tentative. Toute autre valeur - négative, fractionnaire, non numérique - compte comme non définie et se rabat sur 3, également avec un avertissement.
schema.capabilities.file_search.parsing.label=Analyse des documents
schema.capabilities.file_search.parsing.description=Comment les documents téléversés sont lus avant d'être découpés en segments.
schema.capabilities.file_search.parsing.ocr.label=Reconnaissance de texte (OCR)
schema.capabilities.file_search.parsing.ocr.description=Reconnaissance de texte pour les pages PDF sans couche de texte, comme les numérisations. Elle s'exécute là où le programme tesseract est installé (les images Docker et Kyma le fournissent avec l'anglais) ; la CLI npm autonome ne l'exécute jamais.
schema.capabilities.file_search.parsing.ocr.languages.label=Langues OCR
schema.capabilities.file_search.parsing.ocr.languages.description=Codes de langue Tesseract reconnus sur une page, comme eng, deu ou chi_sim ; par défaut eng. Un code exige que ses données de langue soient installées là où s'exécute la passerelle ; un code non installé est ignoré avec un avertissement dans le journal de la passerelle. Chaque langue ajoutée ralentit l'OCR.
schema.capabilities.file_search.parsing.vision.label=Transcription par vision
schema.capabilities.file_search.parsing.vision.description=Transcription des pages PDF difficiles par un modèle de vision de SAP AI Core : une page est envoyée sous forme d’image et le modèle en écrit le texte, tableaux compris. Elle ne s’exécute que pour les vector stores dont le paramètre de découpage a un mode de vision (désactivé par défaut ; changer le mode d’un store le découpe à nouveau). Chaque page est un appel au modèle, enregistré comme utilisation du propriétaire du store ; une page dont l’appel échoue garde son texte ou passe à la reconnaissance de texte (OCR). Les images des pages ne sont pas masquées : là où la pseudonymisation est imposée pour le contenu de file_search (pour le point de terminaison openai ou pour un modèle), elles parviennent au modèle sans masquage, et le cockpit et le journal du gateway le signalent. Le masquage demandé par une seule requête (un mot déclencheur ou un champ de masquage) ne peut pas être prévu et n’est pas signalé. La CLI npm autonome ne l’exécute jamais.
schema.capabilities.file_search.parsing.vision.model.label=Modèle
schema.capabilities.file_search.parsing.vision.model.description=Le modèle d’orchestration SAP AI Core qui transcrit les pages ; il doit lire les images. Par défaut "gemini-3.5-flash-lite". Si le modèle n’est pas disponible, aucun vector store ne peut passer à un mode de vision.
schema.capabilities.file_search.parsing.vision.default_mode.label=Mode par défaut
schema.capabilities.file_search.parsing.vision.default_mode.description=Le mode de vision que reçoivent les nouveaux vector stores : off (par défaut, aucun appel de vision), no_text (pages sans couche de texte, comme les numérisations), auto (celles-ci, les pages avec peu de texte comme les figures, et les pages riches en tableaux) ou all (toutes les pages). Les stores existants gardent leur propre mode. Là où la pseudonymisation est imposée pour le contenu de file_search, les images des pages parviennent au modèle sans masquage (un avertissement s’affiche) ; il en va de même, sans avertissement, pour le masquage demandé par une seule requête.
schema.capabilities.file_search.parsing.vision.max_pages_per_file.label=Pages max. par fichier
schema.capabilities.file_search.parsing.vision.max_pages_per_file.description=Nombre maximal de pages d’un fichier envoyées au modèle, entre 1 et 1000. Par défaut 50. Les pages restantes gardent leur texte ou passent à la reconnaissance de texte (OCR).
schema.capabilities.file_search.parsing.vision.concurrency.label=Concurrence
schema.capabilities.file_search.parsing.vision.concurrency.description=Combien de pages d’un fichier sont transcrites en même temps, entre 1 et 8. Par défaut 2.
schema.capabilities.file_search.parsing.vision.request_timeout_ms.label=Délai de la requête (ms)
schema.capabilities.file_search.parsing.vision.request_timeout_ms.description=Délai de l’appel d’une page, en millisecondes. Par défaut 90000. Une page dont l’appel dure plus longtemps garde son texte ou passe à la reconnaissance de texte (OCR).
schema.capabilities.file_search.parsing.vision.file_deadline_ms.label=Échéance par fichier (ms)
schema.capabilities.file_search.parsing.vision.file_deadline_ms.description=Durée maximale, en millisecondes, que la vision peut consacrer à un fichier, et au plus 40 % du temps restant pour l’ingestion du fichier. Par défaut 240000 (4 minutes). Aucune autre page ne démarre ensuite ; le fichier est tout de même ingéré.
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.label=Jetons d’entrée max. par fichier
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.description=Jetons d’entrée que les appels d’un fichier peuvent utiliser, entre 10000 et 100000000. Par défaut 150000 (une page en prend environ 1250). Une fois qu’un fichier les a utilisés, plus aucune page ne démarre pour lui.
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.label=Jetons de sortie max. par fichier
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.description=Jetons de sortie que les appels d’un fichier peuvent utiliser, entre 10000 et 100000000. Par défaut 120000. Une fois qu’un fichier les a utilisés, plus aucune page ne démarre pour lui.
schema.capabilities.file_search.blob_storage.label=Stockage des blobs
schema.capabilities.file_search.blob_storage.description=Où résident les octets bruts téléversés. Le contenu est adressé par son hachage sha256 et compté par références ; deux téléversements de contenu identique stockent donc une seule copie. Le paramètre est relu à chaque accès ; une modification prend donc effet sans redémarrage.
schema.capabilities.file_search.blob_storage.backend.label=Backend
schema.capabilities.file_search.blob_storage.backend.description=Où les NOUVEAUX téléversements sont stockés. "db", la valeur par défaut, conserve les octets dans la base Postgres de file_search. "s3" les écrit comme objets dans le bucket configuré ci-dessous (AWS ou un point de terminaison compatible S3) et ne garde que leur clé dans la base. Un changement ne déplace rien : chaque blob est lu depuis le stockage où il a été écrit, donc les blobs existants restent lisibles tant que ce stockage est joignable, et une migration depuis le panneau Stockage des blobs de l’Administration de Grounding les déplace. "local" n’est pas pris en charge : tout téléversement répond alors 503 file_search_unavailable.
schema.capabilities.file_search.blob_storage.local_path.label=Chemin local
schema.capabilities.file_search.blob_storage.local_path.description=Racine du système de fichiers réservée à un backend "local", par défaut /var/lib/sail-proxy/blobs. La passerelle ne prend pas en charge "local" (voir backend), cette valeur n’est donc pas lue.
schema.capabilities.file_search.blob_storage.s3.label=S3
schema.capabilities.file_search.blob_storage.s3.description=Coordonnées du bucket pour le backend "s3". Les identifiants ne sont pas configurés ici : ils proviennent des variables d’environnement FILE_SEARCH_S3_ACCESS_KEY_ID et FILE_SEARCH_S3_SECRET_ACCESS_KEY de la passerelle. Lu à chaque accès à un blob stocké dans S3 - y compris lorsque backend vaut "db" et que des blobs restent dans S3 - et par une migration vers ou depuis S3. Modifier le bucket, le point de terminaison ou le préfixe ne déplace aucun objet : les blobs écrits sous les valeurs précédentes ne sont pas lisibles tant que ces valeurs ne sont pas rétablies.
schema.capabilities.file_search.blob_storage.s3.bucket.label=Bucket
schema.capabilities.file_search.blob_storage.s3.bucket.description=Nom du bucket. Il forme l’hôte <bucket>.s3.<region>.amazonaws.com, ou le chemin /<bucket>/<key> lorsque endpoint est défini. Livré vide : tant qu’il n’est pas défini, un téléversement avec backend "s3" répond 503 et une migration vers S3 est refusée.
schema.capabilities.file_search.blob_storage.s3.prefix.label=Préfixe
schema.capabilities.file_search.blob_storage.s3.prefix.description=Préfixe de clé sous lequel chaque blob est stocké, par défaut sail-proxy/blobs, afin qu’un bucket puisse contenir des blobs à côté d’objets sans rapport. Segments de chemin composés de lettres, chiffres, ".", "_" et "-", séparés par "/". La passerelle lit, écrit et supprime uniquement des clés sous ce préfixe et ne liste jamais le bucket. Chaque base de données file_search doit avoir son propre préfixe (ou bucket) : les clés sont dérivées du contenu des fichiers, donc deux installations partageant un préfixe partagent des objets, et l’une supprime des objets que l’autre utilise encore.
schema.capabilities.file_search.blob_storage.s3.endpoint.label=Point de terminaison
schema.capabilities.file_search.blob_storage.s3.endpoint.description=Point de terminaison S3 hors AWS - MinIO, Ceph ou une autre passerelle compatible S3. S’il est défini, les requêtes vont vers <endpoint>/<bucket>/<key> au lieu de la forme d’hôte AWS. Vide, la valeur par défaut, signifie AWS.
schema.capabilities.file_search.blob_storage.s3.region.label=Région
schema.capabilities.file_search.blob_storage.s3.region.description=Région de signature SigV4, et partie du nom d’hôte lorsqu’aucun endpoint n’est défini. Livrée vide, et tout de même requise pour signer auprès d’un point de terminaison compatible S3.
schema.capabilities.file_search.teacher_logging.label=Journalisation pour le modèle enseignant
schema.capabilities.file_search.teacher_logging.description=Enregistre les candidats de chaque recherche et les scores du reclasseur comme labels teacher, pour l’évaluation et la distillation du reclasseur. Fire-and-forget par construction : rien n’attend l’écriture, et chaque échec ne se manifeste que sous forme d’avertissement. Les cinq champs sont lus en direct sur le chemin de recherche ; ils peuvent donc être modifiés depuis ce cockpit sans redémarrage.
schema.capabilities.file_search.teacher_logging.enabled.label=Activé
schema.capabilities.file_search.teacher_logging.enabled.description=Indique si les événements de recherche sont écrits. Désactivé par défaut, de sorte qu’une installation antérieure à cette clé ne commence jamais à écrire des lignes. Délibérément indépendant de store_chunk_text : activer la journalisation ne doit jamais, à lui seul, commencer à conserver le contenu des documents.
schema.capabilities.file_search.teacher_logging.store_chunk_text.label=Stocker le texte des chunks
schema.capabilities.file_search.teacher_logging.store_chunk_text.description=Indique si le TEXTE du chunk de chaque candidat est stocké à côté de son hachage ; désactivé par défaut, le texte restant vide sinon. Ce texte est du contenu de documents d’utilisateurs ; cette option fait donc des tables de labels une seconde copie du corpus - le hachage seul suffit pour relier les labels aux chunks qui existent encore.
schema.capabilities.file_search.teacher_logging.sample_rate.label=Taux d’échantillonnage
schema.capabilities.file_search.teacher_logging.sample_rate.description=Probabilité qu’une recherche soit journalisée, de 0 à 1 ; par défaut 1.0. 1 journalise chaque recherche, 0 aucune, 0.1 environ une sur dix. C’est le réglage à abaisser lorsque le volume de labels pose problème - pas max_concurrent_writes, qui abandonne des écritures au lieu de les éclaircir.
schema.capabilities.file_search.teacher_logging.source.label=Source
schema.capabilities.file_search.teacher_logging.source.description=Label libre écrit dans chaque événement de recherche, utilisé chaque fois que l’appelant n’en transmet aucun. Par défaut "production", afin qu’une exécution d’évaluation ou de remplissage rétroactif puisse être distinguée du trafic de production lors de la relecture des labels.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.label=Écritures simultanées max.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.description=Plafond des écritures de labels teacher en cours, par défaut 2 ; les écritures excédentaires sont abandonnées, pas mises en file d’attente. Limité à la taille du pool de base de données file_search, soit 10 : au-delà, le plafond ne limite plus rien, car les écritures supplémentaires attendent simplement dans la propre file d’attente du pool - transformant "abandonnées, pas mises en file d’attente" en "mises en file d’attente", précisément l’échec que la limite doit empêcher. Une valeur plus grande est ramenée à la limite avec un avertissement ; un api_config.json modifié à la main ne peut donc pas non plus l’augmenter.
schema.capabilities.file_search.tool.label=Outil
schema.capabilities.file_search.tool.description=Le bloc de l’OUTIL hébergé file_search - l’outil que le modèle appelle lui-même - par opposition au chemin REST brut POST /v1/vector_stores/{id}/search que régissent les paramètres ci-dessus. Chaque champ est vérifié à la lecture et se rabat sur sa valeur par défaut au lieu d’être converti, car un api_config.json modifié à la main atteint la passerelle sans validation.
schema.capabilities.file_search.tool.enabled.label=Activé
schema.capabilities.file_search.tool.enabled.description=Lu comme un booléen strict, par défaut true - un "true" ou un 1 saisi à la main n’est pas lu comme true et se rabat sur la valeur par défaut. Actuellement ignoré par la passerelle : rien ne dépend de la valeur résolue et l’outil est proposé dans tous les cas ; le définir à false ne masque donc pas l’outil. Utilisez file_search.enabled pour désactiver la fonctionnalité.
schema.capabilities.file_search.tool.max_searches_per_request.label=Recherches max. par requête
schema.capabilities.file_search.tool.max_searches_per_request.description=Nombre d’appels file_search qu’une requête peut effectuer avant que la passerelle cesse de poursuivre le tour. Un entier de 1 à 10 est pris en compte ; toute autre valeur - hors plage, fractionnaire, non numérique - compte comme non définie et se rabat sur 3 avec un avertissement ; une valeur hors plage ici n’est donc silencieusement pas celle qui s’applique.
schema.capabilities.file_search.tool.max_num_results_default.label=Nombre max. de résultats par défaut
schema.capabilities.file_search.tool.max_num_results_default.description=Chunks renvoyés lorsqu’un appel d’outil ne nomme pas son propre max_num_results. Un entier de 1 à 50 est pris en compte, toute autre valeur se rabat sur 10. Cette plage est la même limite que celle par rapport à laquelle est vérifié un max_num_results par appel, et la propre limite d’OpenAI pour ce champ. hybrid.candidates reste le plafond strict de ce qu’une recherche peut renvoyer.
schema.capabilities.hosted_tools.label=Outils hébergés
schema.capabilities.hosted_tools.description=Limites du cache de rejeu des résultats d’outils hébergés : combien de temps un résultat reste rejouable et combien sont conservés à la fois.
schema.capabilities.hosted_tools.result_cache_ttl_seconds.label=TTL du cache de résultats en secondes
schema.capabilities.hosted_tools.result_cache_ttl_seconds.description=Facultatif. Durée pendant laquelle les résultats d’un outil hébergé restent rejouables par un client qui rejoue l’élément d’appel. Une valeur non entière ou hors plage se rabat sur la valeur par défaut de 3600 secondes, comme si ce champ n’était pas défini. Un échec de cache réexécute la requête enregistrée au lieu de dégrader la réponse.
schema.capabilities.hosted_tools.result_cache_max_entries.label=Entrées max. du cache de résultats
schema.capabilities.hosted_tools.result_cache_max_entries.description=Facultatif. Nombre de résultats d’outils hébergés conservés à la fois dans le cache de rejeu. Une valeur non entière ou hors plage se rabat sur la valeur par défaut de 500 entrées, comme si ce champ n’était pas défini. Un échec de cache réexécute la requête enregistrée au lieu de dégrader la réponse.
schema.capabilities.namespace_tools.label=Outils de namespace
schema.capabilities.namespace_tools.description=Comment traiter l’outil d’encapsulation de sous-agent `namespace` de Codex, que SAP AI Core rejette d’emblée avec une erreur 400.
schema.capabilities.namespace_tools.mode.label=Mode
schema.capabilities.namespace_tools.mode.description=`flatten` (par défaut) remonte au niveau supérieur les outils de fonction imbriqués d’un outil namespace afin que la requête soit acceptée, puis restaure le namespace sur les appels rejoués pour que Codex puisse toujours les router. `strip` supprime entièrement l’outil namespace et ses outils imbriqués. Toute valeur autre que ces deux-là se rabat sur flatten - l’alternative est une erreur 400 bloquante qui met fin au tour.
schema.capabilities.custom_tools.label=Outils personnalisés
schema.capabilities.custom_tools.description=Outils `custom` en forme libre de Codex (apply_patch). `translate` les réécrit en outils de fonction, que les routes de déploiement et d’orchestration acceptent toutes deux ; `strip` les supprime, laissant le modèle modifier les fichiers via des commandes shell.
schema.capabilities.custom_tools.mode.label=Mode
schema.capabilities.custom_tools.mode.description=`translate` (par défaut) réécrit l’outil custom en forme libre en un outil de fonction ordinaire que les deux routes acceptent, en ajoutant à sa description des indications de grammaire/format, car un outil de fonction ne peut pas exprimer une grammaire Lark comme le peut un outil custom. `strip` supprime entièrement les outils custom, laissant le modèle modifier les fichiers via des commandes shell. Toute valeur autre que ces deux-là se rabat sur translate - l’alternative est une erreur 400 bloquante qui met fin au tour.
schema.capabilities.tool_search.label=Recherche d’outils
schema.capabilities.tool_search.description=L’outil `tool_search` de Codex pour la découverte d’outils différés. `translate` le réécrit en outil de fonction, que les routes de déploiement et d’orchestration acceptent toutes deux ; `strip` le supprime, laissant le modèle incapable de découvrir des outils différés tels que les serveurs MCP.
schema.capabilities.tool_search.mode.label=Mode
schema.capabilities.tool_search.mode.description=`translate` (par défaut) réécrit l’outil tool_search en un outil de fonction ordinaire que les deux routes acceptent. `strip` le supprime entièrement. Toute valeur autre que ces deux-là se rabat sur translate - l’alternative est une erreur 400 bloquante qui met fin au tour.
schema.capabilities.tool_search.hoist_discovered_tools.label=Remonter les outils découverts
schema.capabilities.tool_search.hoist_discovered_tools.description=Remonte dans la requête les outils découverts par tool_search afin que le modèle puisse les appeler. Contourne le fait que codex n’expose les outils MCP différés que lorsque la base_url du fournisseur est api.openai.com ; définissez false une fois ce problème corrigé en amont. Peut sans risque rester activé dans tous les cas - les noms que le client déclare déjà sont ignorés.
schema.hooks.label=Hooks
schema.hooks.definitions.label=Définitions
schema.hooks.definitions.description=Les règles de correspondance nommées que le request.match d’un hook peut nommer, avec pour clé l’ID de règle - la clé EST l’ID. Chaque règle listée par un hook doit correspondre pour que ce hook se déclenche, et un ID de règle défini nulle part ici journalise un avertissement et fait que le hook ne correspond à rien. Les règles sont mises en cache par ID à la première utilisation ; une modification prend donc effet au prochain rechargement de la configuration, pas en cours de processus.
schema.hooks.definitions._entry.type.label=Type
schema.hooks.definitions._entry.type.description=Quelle partie de la requête la règle teste, et donc lesquels des champs ci-dessous s’appliquent. Déterminant et non descriptif : seules ces quatre valeurs sont comprises, et toute autre valeur est journalisée comme type de hook inconnu et ne correspond à RIEN - désactivant silencieusement chaque hook qui nomme la règle.
schema.hooks.definitions._entry.name.label=Nom
schema.hooks.definitions._entry.name.description=L’en-tête de requête que lit une règle 'header'. Insensible à la casse : le nom est mis en minuscules avant la recherche, conformément à la normalisation des noms d’en-têtes par le pipeline de requêtes. Une requête qui ne porte pas l’en-tête ne correspond jamais. Vide ne signifie pas 'n’importe quel en-tête' - une telle règle ne pourrait jamais se déclencher - ; il est donc rejeté ici plutôt qu’accepté.
schema.hooks.definitions._entry.path.label=Chemin
schema.hooks.definitions._entry.path.description=Chemin en notation pointée dans le corps JSON analysé de la requête, pour une règle 'json-path' ou 'json-path-regex'. Un '$.' initial est retiré ; '$.max_tokens' et 'max_tokens' désignent donc la même valeur ; il n’y a pas d’autre prise en charge de JSONPath - ni caractères génériques, ni filtres, ni syntaxe à crochets, et un segment contenant un point ne peut pas être désigné. 'json-path' suit chaque segment à la lettre ; un segment numérique indexe donc un tableau. 'json-path-regex' permet en outre à un segment non numérique de prendre le premier élément du tableau qui le porte. Une requête sans corps analysé, ou un chemin qui ne se résout en rien, ne correspond pas.
schema.hooks.definitions._entry.equals.label=Égal à
schema.hooks.definitions._entry.equals.description=La valeur à laquelle l’élément désigné doit être égal - comparée DIFFÉREMMENT selon le type. Sur une règle `header`, ce n’est PAS une égalité stricte : ce sont les types de médias qui sont comparés (la partie avant le premier `;`, en minuscules) ; `application/json` correspond donc aussi à `application/json; charset=utf-8`. Cela existe parce que la comparaison stricte qu’il a remplacée permettait aux clients ajoutant un charset de contourner la pseudonymisation. Une valeur equals qui contient elle-même un `;` est comparée exactement ; une règle peut donc toujours imposer un charset. Sur une règle `json-path`, c’EST une égalité stricte. Sémantique du comparateur : https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.from.label=De
schema.hooks.definitions._entry.from.description=Borne inférieure incluse pour une règle 'header' portant sur un en-tête numérique - content-length dans chaque règle livrée. La valeur de l’en-tête est lue comme un entier en base 10 et doit se situer dans [from, to] ; une valeur non analysable ne correspond jamais. Lu uniquement lorsque equals est absent ET que les deux bornes sont présentes : une borne seule est ignorée et la règle se réduit à une simple vérification de présence de l’en-tête.
schema.hooks.definitions._entry.to.label=Vers
schema.hooks.definitions._entry.to.description=Borne supérieure incluse pour une règle 'header' portant sur un en-tête numérique. Il n’existe pas de forme ouverte : pour exprimer 'au moins 10 KB', les règles livrées associent from à un to délibérément énorme (size:min10kb utilise 999999999), car omettre l’une des bornes transforme la règle en vérification de présence. Voir from.
schema.hooks.definitions._entry.regex.label=Regex
schema.hooks.definitions._entry.regex.description=Une source d’expression régulière JavaScript. Une règle `json-path-regex` la teste sur ce en quoi le chemin s’est résolu (une chaîne directement, un tableau élément par élément, tout autre objet sur sa forme JSON). Une règle `url-regex` la teste sur le chemin de la requête et la chaîne de requête que voit la passerelle, PAS sur une URL absolue ; `^https?://` ne peut donc jamais correspondre. Compilée une fois et mise en cache par règle ; une expression que le moteur rejette compte comme aucune correspondance. Sémantique du comparateur : https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.flags.label=Indicateurs
schema.hooks.definitions._entry.flags.description=Indicateurs d’expression régulière appliqués à regex, p. ex. 'i' pour l’insensibilité à la casse. Limités aux lettres que le moteur accepte réellement, car toute autre valeur fait échouer la compilation et cet échec est signalé comme aucune correspondance - la règle ne se déclencherait alors silencieusement jamais. Les indicateurs font partie de la clé de cache des expressions compilées ; deux règles qui ne diffèrent que par leurs indicateurs ne partagent donc pas une même expression compilée. Évitez 'g' : une expression globale compilée est réutilisée d’une requête à l’autre et fait avancer sa propre position ; une telle règle ne correspond donc qu’une fois sur deux.
schema.hooks.definitions._entry.desc.label=Desc.
schema.hooks.definitions._entry.desc.description=Note libre sur l’objet de cette règle. Actuellement ignorée par la passerelle ; elle documente la règle pour quiconque modifie ce fichier et n’a aucun effet sur la correspondance.
schema.hooks.defaults.label=Valeurs par défaut
schema.hooks.defaults.description=Hooks par défaut par point de terminaison, ayant pour clé l’identifiant de point de terminaison qu’utilise la route - 'anthropic', 'openai' et 'aws-bedrock' aujourd’hui, ainsi que 'google' (sous-chemins generateContent, streamGenerateContent, embedContent). Consultés uniquement lorsque le modèle demandé n’a pas d’entrée models.overrides.<model>.hooks pour le sous-chemin : une entrée par modèle REMPLACE la valeur par défaut du point de terminaison pour ce sous-chemin au lieu d’être fusionnée avec elle.
schema.hooks.defaults._entry.description=Les valeurs par défaut d’un point de terminaison : le bloc facultatif d’activation forcée de la pseudonymisation, plus une liste de hooks par sous-chemin de requête (invoke, invoke-with-response-stream, responses, responses-stream). Les clés inconnues sont rejetées, car toute autre clé ici est lue comme un sous-chemin et aucune route ne demande un sous-chemin que ce point de terminaison ne sert pas - une clé non reconnue est donc une faute de frappe qui ne s’exécuterait jamais plutôt qu’un paramètre. Le motif de sous-chemin exclut délibérément 'pseudonymization', afin que cette clé ne soit pas aussi tenue d’être une liste de hooks.
schema.hooks.defaults._entry.pseudonymization.label=Pseudonymisation
schema.hooks.defaults._entry.pseudonymization.description=Paramètres du plug-in de pseudonymisation. L’activation (enabled) et les commutateurs de catégorie (entities) ne s’appliquent qu’à ce plug-in ; le masquage n’a lieu que lorsque le plug-in s’exécute réellement pour une requête - il doit être enregistré dans la chaîne de hooks et une source d’activation doit se déclencher.
schema.hooks.defaults._entry.pseudonymization.enabled.label=Activé
schema.hooks.defaults._entry.pseudonymization.enabled.description=Force l’activation du masquage pour une requête. Lu uniquement là où ce bloc se trouve sous models.overrides.<model>.pseudonymization ou hooks.defaults.<endpoint>.pseudonymization : true y masque cette requête, le bloc par modèle l’emportant sur celui par point de terminaison. False ou absent ne force rien - le masquage peut tout de même s’exécuter lorsqu’une autre source d’activation se déclenche, comme un mot déclencheur ou un champ de masquage dans le corps de la requête. Sous observability.pseudonymization, cette clé est actuellement ignorée ; ce niveau fournit tous les autres paramètres d’ici, sauf method et allow_user_bypass. Dans tous les cas, le plug-in doit être raccordé à la chaîne de hooks, sinon rien n’est masqué.
schema.hooks.defaults._entry.pseudonymization.method.label=Méthode
schema.hooks.defaults._entry.pseudonymization.method.description=Mode de masquage : `pseudonymization` masque la requête et démasque la réponse ; `anonymization` masque et ne démasque jamais. Lu uniquement là où ce bloc force le masquage (un hook activé ou une surcharge de modèle), pas sous `observability.pseudonymization`. Il conditionne aussi le SIEM : seul `pseudonymization` conserve la réponse masquée ; sous `anonymization`, un sink de contenu reçoit donc le prompt mais pas la réponse. En son absence, `pseudonymization` s’applique. Modes : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.label=Autoriser le contournement par l’utilisateur
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.description=N’a d’effet qu’à l’intérieur d’un bloc qui force l’activation (un hook activé ou une surcharge de modèle) ; non lu sous `observability.pseudonymization`. Valeur par défaut false. Si true, un appelant peut ignorer le masquage via l’en-tête `x-sail-proxy-pseudonymization: off` (insensible à la casse) ou le champ de corps `pseudonymization_off: true` : le contenu atteint le LLM sans masquage et, lorsqu’un sink SIEM activé définit à la fois `include_content` et `allow_unmasked_content`, ce sink également. Détails : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.hooks.defaults._entry.pseudonymization.entities.label=Entités
schema.hooks.defaults._entry.pseudonymization.entities.description=Commutateurs de masquage par catégorie : `true` masque la catégorie à ce niveau, `false` non, et une catégorie non listée hérite du niveau inférieur (les niveaux ultérieurs l’emportent). Les clés sont l’ensemble des catégories connues : les catégories actives par défaut ; trois catégories optionnelles livrées désactivées (`profile-org`, `profile-location`, `profile-ip-address`) ; et `profile-sensitive-data`, un commutateur global qui les active toutes sauf ces trois. Une clé hors de cet ensemble est rejetée ici. Catégories et niveaux : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.hooks.defaults._entry.pseudonymization.org_suffixes.label=Suffixes d’organisation
schema.hooks.defaults._entry.pseudonymization.org_suffixes.description=Suffixes de forme juridique qui marquent une suite de mots comme nom d’organisation, p. ex. Inc, LLC, GmbH. La correspondance est sensible à la casse par conception ; un 'limited' en minuscules dans un texte n’est donc délibérément pas traité comme forme juridique ; chaque entrée correspond en outre en majuscules intégrales, de sorte qu’une facture qui écrit ACME GMBH est reconnue comme la même organisation qu’Acme GmbH. N’a d’effet que tant que profile-org est activé dans entities ; activer profile-org avec cette liste vide ne masque RIEN comme organisation et journalise un avertissement. Chaque entrée est rognée avant la comparaison, et une entrée vide ou ne contenant que des espaces est silencieusement supprimée plutôt que rejetée.
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.label=Répertoire de lieux
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.description=Termes de lieu littéraux que le détecteur structurel masque - sans tenir compte de la casse, et uniquement en mot entier ou en expression entière ; rien n’est déduit des majuscules ou du contexte. N’a d’effet que tant que profile-location est activé dans entities ; activer profile-location avec cette liste vide ne masque RIEN comme lieu et journalise un avertissement. Chaque entrée est rognée, et une entrée vide ou ne contenant que des espaces est silencieusement supprimée. Livrée vide : les noms de lieux sont propres au déploiement et ce dépôt est public ; renseignez-la donc via cette application d’administration de la configuration, jamais dans du code versionné.
schema.hooks.defaults._entry.pseudonymization.min_confidence.label=Confiance min.
schema.hooks.defaults._entry.pseudonymization.min_confidence.description=Quantité de preuves qu’une valeur détectée doit réunir avant d’être masquée, de 0 à 1 (par défaut 0.5). Une valeur est masquée dès que son score atteint le seuil ; un simple nom avec majuscule obtient environ 0.5, un motif validé par somme de contrôle 0.95, une règle personnalisée 1.0. Relever le seuil écarte d’abord les noms simples ; resserrez donc plutôt une catégorie bruyante avec `thresholds`. Les règles personnalisées, les identifiants validés et les données d’authentification ne sont jamais rabaissés par leur contexte. Détails du score : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.hooks.defaults._entry.pseudonymization.thresholds.label=Seuils
schema.hooks.defaults._entry.pseudonymization.thresholds.description=Seuils de confiance par catégorie, chacun de 0 à 1, qui remplacent `min_confidence` pour les catégories nommées ; une catégorie non listée conserve `min_confidence`. C’est l’endroit où se montrer strict sur une seule catégorie bruyante - `profile-person` à 0.65 exige plus de preuves pour les noms tandis que les identifiants validés restent au seuil global. Les clés sont le même ensemble de catégories connues que celui accepté par `entities` ; `profile-sensitive-data` est accepté mais sans effet. Réglage par catégorie : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.hooks.defaults._entry.pseudonymization.allowlist.label=Liste d’autorisation
schema.hooks.defaults._entry.pseudonymization.allowlist.description=Valeurs que ce déploiement ne masque jamais - un interrupteur d’ARRÊT, par valeur. Consultée avant le score de confiance ; une valeur listée est donc exemptée quelle que soit la quantité de preuves. Utilisez-la pour un faux positif récurrent portant un nom propre - un titre de produit ou de rapport qui ressemble à une personne. Les listes des niveaux sont CONCATÉNÉES, pas remplacées ; un niveau inférieur ne fait donc qu’ajouter une exemption, sans jamais en retirer. `terms` ou `patterns`, et le risque d’une entrée trop large : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.label=Termes
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.description=Valeurs littérales, comparées à la valeur détectée entière et EN TENANT COMPTE DE LA CASSE. Sensible à la casse par conception : 'Watson Studio' est le produit qu’un opérateur voulait exempter, 'watson studio' dans une phrase ne l’est pas, et une liste insensible à la casse exempterait aussi une personne dont le nom de famille s’écrit de la même façon. Un terme ne correspond qu’à une valeur que les détecteurs ont produite en entier - lister 'Studio' n’exempte pas 'Watson Studio'. Chaque entrée ici est un interrupteur d’ARRÊT du masquage pour cette valeur exacte ; limitez donc la liste aux valeurs qui ne sont réellement jamais des données personnelles : un terme qui se trouve être le nom de quelqu’un exempte cette personne du masquage partout dans ce déploiement, silencieusement et sans rien dans le journal pour le signaler.
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.label=Motifs
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.description=Expressions régulières (JavaScript), chacune comparée à la valeur détectée ENTIÈRE : la passerelle encadre elle-même chaque entrée par `^(?: )$` ; écrivez donc `Z[A-Z0-9_]+`, pas `^Z[A-Z0-9_]+$`. La correspondance est sensible à la casse. Chaque entrée est un interrupteur d’ARRÊT du masquage, et une entrée large désactive le masquage sans échouer - `[A-Z].*` désactive presque tous les noms de personnes détectés. Une correspondance avec un exemple de PII intégré émet un avertissement mais est TOUT DE MÊME appliquée. Gardez chaque entrée étroite. Détails : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.saturation_warn.label=Avertissement de saturation
schema.hooks.defaults._entry.pseudonymization.saturation_warn.description=Nombre de valeurs masquées DISTINCTES qu’une requête peut porter avant d’être signalée comme saturée (par défaut 40). Signalement uniquement - cela ne change jamais ce qui est masqué. Au-delà de ce nombre, la passerelle journalise un avertissement par requête avec des décomptes par catégorie et les FORMES de valeur les plus fréquentes (lettres en X, chiffres en 9) ; aucune valeur masquée n’apparaît jamais. L’événement SIEM d’utilisation de la requête porte les mêmes décomptes avec un indicateur `saturated` - des décomptes, pas du texte. Lire le rapport : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.label=Espaces réservés inventés
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.description=Ce qui se passe lorsqu’une réponse contient un espace réservé masqué qui n’a jamais été envoyé au modèle. Les modèles en inventent un dans environ 1 réponse pseudonymisée sur 125, et d’autant plus souvent que la requête masque de valeurs ; un tel espace réservé ne désigne personne et ne peut jamais être résolu. withhold (par défaut) : il est remplacé par un simple marqueur tel que [name withheld] et signalé comme événement de sécurité. report : il est seulement signalé et parvient inchangé au client, pour un déploiement dont les propres développeurs écrivent de nouveaux espaces réservés dans des fixtures de test via la passerelle. off : ni l’un ni l’autre. Un espace réservé que le client a lui-même envoyé dans la même requête n’est jamais considéré comme inventé.
schema.hooks.defaults._entry._entry.description=La liste de hooks d’un sous-chemin, essayés dans l’ordre. La même forme sert hooks.defaults.<endpoint>.<subpath> et models.overrides.<model>.hooks.<subpath> ; la passerelle voit donc une seule forme, quelle que soit celle des deux qui l’a fournie. Un hook ne se déclenche que si CHAQUE règle nommée par son request.match correspond à la requête ; request.callback.id nomme alors le plug-in à exécuter pour la phase en cours. Un hook dont le match n’est pas satisfait, ou dont le callback ne nomme aucun plug-in enregistré pour cette phase, est ignoré et le suivant est essayé - ni l’un ni l’autre n’est une erreur à l’exécution.
schema.hooks.defaults._entry._entry.items.request.label=Requête
schema.hooks.defaults._entry._entry.items.request.description=Ce qui doit correspondre et ce qu’il faut exécuter dans ce cas. Nommé d’après la requête, car le comparateur n’inspecte jamais que la requête entrante ; il n’existe pas d’équivalent pour la réponse, et rien d’autre n’est lu sur un hook.
schema.hooks.defaults._entry._entry.items.request.callback.label=Callback
schema.hooks.defaults._entry._entry.items.request.callback.description=Le plug-in à exécuter une fois que chaque règle de match a correspondu.
schema.hooks.defaults._entry._entry.items.request.callback.id.label=ID
schema.hooks.defaults._entry._entry.items.request.callback.id.description=L’ID sous lequel un plug-in s’est enregistré, recherché dans le registre de plug-ins de la passerelle pour la phase en cours. Ce schéma ne peut pas vérifier la référence croisée : un ID qu’aucun plug-in n’a enregistré pour cette phase est journalisé comme introuvable et le hook est ignoré ; la requête passe donc sans modification au lieu d’échouer.
schema.hooks.defaults._entry._entry.items.request.match.label=Correspondance
schema.hooks.defaults._entry._entry.items.request.match.description=Les ID de règles qui doivent TOUTES correspondre, évaluées dans l’ordre et abandonnées à la première qui ne correspond pas. Chaque ID est une clé de hooks.definitions - une référence croisée que ce schéma ne peut pas vérifier : un ID défini nulle part là-bas journalise un avertissement et fait que le hook entier ne correspond pas ; une faute de frappe désactive donc silencieusement le plug-in au lieu de le déclencher sans condition. Une liste vide est rejetée, car un hook destiné à s’exécuter sur presque tout s’écrit plutôt en nommant une règle délibérément large - le payload:any livré correspond à toute requête dont le corps analysé porte un model de type chaîne non vide, ce qui est aussi proche de l’inconditionnel qu’une règle peut l’être tout en le disant explicitement.
schema.platform.label=Plateforme
schema.platform.billing.label=Facturation
schema.platform.billing.description=Classification de facturation SAP AI Core de ce sous-compte. Lue uniquement par la comptabilité des coûts native SAP en Capacity Units de l’application d’administration, jamais par le chemin de requête de la passerelle.
schema.platform.billing.productive.label=Productif
schema.platform.billing.productive.description=Indique si SAP classe ce sous-compte/tenant comme PRODUCTIF pour la facturation SAP AI Core. isProductive() dans sapCapacityService le lit pour choisir la ligne SapCapacityUnitPrice - $/CU productif ou non productif - utilisée pour tarifer les Capacity Units. La classification de SAP ne correspond pas toujours au nom de l’environnement (un sous-compte Sandbox peut être classé productif) ; définissez donc cette valeur selon ce qu’est réellement votre facture/sous-compte SAP. Par défaut false = non productif.
schema.platform.billing.cuFactor.label=Facteur CU
schema.platform.billing.cuFactor.description=Facteur de conversion des jetons SAP GenAI en Capacity Units (note SAP 3437766 ; uniforme sur toutes les factures, non publié par modèle). cuFactor() dans sapCapacityService le lit - capacityUnits = genAiTokens x ce facteur, appliqué globalement à chaque événement d’utilisation (pas par type d’utilisation), aussi bien pour la capture en direct que pour le recalcul rétroactif. Ne le modifiez que si SAP republie la conversion en CU. Par défaut 1.90385. Une valeur de 0 est traitée comme non définie et se rabat sur la valeur par défaut.
schema.platform.timeouts.label=Délais d’expiration
schema.platform.timeouts.description=Plafonds de délai d’expiration par requête que la passerelle applique aux appels LLM sortants.
schema.platform.timeouts.default.label=Par défaut
schema.platform.timeouts.default.description=Délai d’expiration en millisecondes pour les requêtes sans streaming, de 1000 à 3600000. Non défini ou zéro se rabat sur 120000 ms (120 secondes).
schema.platform.timeouts.streaming.label=Streaming
schema.platform.timeouts.streaming.description=Délai d’expiration en millisecondes pour les requêtes en streaming, de 1000 à 3600000. Non défini ou zéro se rabat sur 240000 ms (240 secondes).
schema.platform.logging.label=Journalisation
schema.platform.logging.description=Niveau et destination des journaux de la passerelle. Lu par le logger partagé au démarrage, puis à nouveau chaque fois que la passerelle le réinitialise après une modification de la configuration.
schema.platform.logging.components.label=Composants
schema.platform.logging.components.description=Remplacement du niveau de journalisation par composant, avec pour clé le nom du composant exactement tel que la passerelle le journalise - par exemple 'ConfigService' ou 'AwsBedrockService'. Un composant sans entrée ici utilise LOG_LEVEL lorsqu’elle est définie, sinon defaultLevel. Une entrée l’emporte sur LOG_LEVEL pour son propre composant : un composant épinglé ignore donc la variable d’environnement ; la configuration livrée ne contient aucune entrée.
schema.platform.logging.components._entry.description=Niveau de journalisation de ce composant, qui remplace defaultLevel tant qu’il est présent. Il est comparé, sans tenir compte de la casse, aux niveaux que le logger implémente (trace, debug, info, warn, error) ; une valeur qu’il ne reconnaît pas est silencieusement ignorée, le niveau précédemment en vigueur restant en place plutôt qu’une erreur ne soit levée.
schema.platform.logging.defaultLevel.label=Niveau par défaut
schema.platform.logging.defaultLevel.description=Niveau de journalisation de tout composant sans entrée dans `components`. Si `LOG_LEVEL` est défini sur un niveau reconnu, il est prioritaire et ce champ est ignoré - et `LOG_LEVEL` est défini dans les deux exemples .env et dans les manifestes Kyma ; dans un déploiement standard, c’est donc l’environnement qui l’emporte. Sinon, il est comparé, sans tenir compte de la casse, aux niveaux du logger (trace, debug, info, warn, error) ; une valeur non reconnue est silencieusement ignorée. Priorité : https://st-gr.github.io/sail-proxy/developer/debugging#log-level-resolution
schema.platform.logging.log_folder_path.label=Chemin du dossier des journaux
schema.platform.logging.log_folder_path.description=Répertoire dans lequel la passerelle écrit ses propres fichiers journaux et - lorsque payload_logging_enabled vaut true - les vidages de payloads des requêtes et des réponses, dans un sous-répertoire payloads/. Se rabat sur ./logs s’il n’est pas défini.
schema.platform.logging.payload_logging_enabled.label=Journalisation des payloads activée
schema.platform.logging.payload_logging_enabled.description=Si true, écrit les corps complets des requêtes et des réponses dans log_folder_path/payloads pour le débogage. Les en-têtes connus comme sensibles sont masqués, mais le contenu des corps est écrit tel quel ; laissez donc cette option désactivée en dehors d’un débogage actif. Désactivé par défaut. La variable d’environnement PAYLOAD_LOGGING_ENABLED, lorsqu’elle vaut true ou false, prévaut sur cette valeur.
schema.platform.rate_limit_handling.label=Gestion des limites de débit
schema.platform.rate_limit_handling.description=Temporisation automatique que la passerelle applique après qu’un fournisseur a signalé une limite de débit - un HTTP 429, ou un message d’erreur contenant un mot-clé de limite de débit. Purement réactive : elle retarde les nouvelles tentatives une fois qu’une limite de débit a été constatée pour un modèle et un sous-chemin ; elle ne bride pas le trafic à l’avance.
schema.platform.rate_limit_handling.enabled.label=Activé
schema.platform.rate_limit_handling.enabled.description=Interrupteur principal de la temporisation en cas de limite de débit. Si false ou absent, le délai est toujours de 0 seconde et le reste de cette section est sans effet.
schema.platform.rate_limit_handling.default_delay_seconds.label=Délai par défaut en secondes
schema.platform.rate_limit_handling.default_delay_seconds.description=Délai en secondes appliqué lorsqu’une limite de débit est détectée et que ni subpath_specific_delays ni model_specific_delays n’a d’entrée pour le point de terminaison. Se rabat sur 30 s’il n’est pas défini ou vaut zéro.
schema.platform.rate_limit_handling.backoff_multiplier.label=Multiplicateur de temporisation
schema.platform.rate_limit_handling.backoff_multiplier.description=Multiplicateur appliqué au délai précédent à chaque limite de débit consécutive pour le même modèle et le même sous-chemin : le nouveau délai est le précédent multiplié par cette valeur, plafonné à max_delay_seconds. Se rabat sur 1.5 s’il n’est pas défini ou vaut zéro ; gardez-le à 1 ou plus, sinon chaque limite de débit consécutive attendrait moins au lieu de plus.
schema.platform.rate_limit_handling.max_delay_seconds.label=Délai max. en secondes
schema.platform.rate_limit_handling.max_delay_seconds.description=Plafond en secondes que la temporisation sur limites de débit consécutives ci-dessus ne peut pas dépasser. Se rabat sur 300 s’il n’est pas défini ou vaut zéro.
schema.platform.rate_limit_handling.model_specific_delays.label=Délais spécifiques aux modèles
schema.platform.rate_limit_handling.model_specific_delays.description=Remplacement du délai par modèle en secondes, avec pour clé l’ID du modèle exactement tel qu’il est configuré sous providers et models - par exemple 'anthropic--claude-4-opus--deployed'. Vérifié après subpath_specific_delays et avant default_delay_seconds ; un délai de 0 ici compte comme absence de remplacement, car seule une entrée non nulle est utilisée.
schema.platform.rate_limit_handling.model_specific_delays._entry.description=Délai en secondes appliqué à ce modèle lorsqu’il atteint une limite de débit.
schema.platform.rate_limit_handling.subpath_specific_delays.label=Délais spécifiques aux sous-chemins
schema.platform.rate_limit_handling.subpath_specific_delays.description=Remplacement du délai par sous-chemin en secondes, avec pour clé le sous-chemin d’API de la passerelle - par exemple 'converse-stream' ou 'invoke-with-response-stream'. Vérifié en premier, avant model_specific_delays et default_delay_seconds ; un délai de 0 ici compte comme absence de remplacement, car seule une entrée non nulle est utilisée.
schema.platform.rate_limit_handling.subpath_specific_delays._entry.description=Délai en secondes appliqué à ce sous-chemin lorsqu’il atteint une limite de débit.
schema.platform.security.label=Sécurité
schema.platform.security.description=Questions relatives au trafic entrant.
schema.platform.security.trust_forwarded_for.label=Faire confiance à Forwarded-For
schema.platform.security.trust_forwarded_for.description=Fait confiance aux en-têtes X-Forwarded-For et X-Real-IP fournis par le client - et à l’IP client que le framework web en déduit - lors de l’enregistrement de l’IP client dans les événements de sécurité, au lieu d’utiliser l’adresse brute du pair du socket. Ne l’activez que derrière un proxy qui écrase ces en-têtes au lieu de transmettre ce que le client a envoyé ; sinon, un client peut usurper sa propre IP enregistrée.
schema.platform.security.credentialExpirationDays.label=Expiration des identifiants (jours)
schema.platform.security.credentialExpirationDays.description=Nombre de jours pendant lesquels un identifiant reste valide : une clé API ou un identifiant AWS est créé avec expiresAt = maintenant + ce nombre de jours, et chaque actualisation (rotation) repousse à nouveau expiresAt à maintenant + ce nombre de jours. Les valeurs absentes ou non valides se rabattent sur 90. Les identifiants créés avant l’existence de l’expiration n’ont pas de date et n’expirent jamais tant qu’un administrateur n’en définit pas.
schema.platform.quotas.label=Quotas
schema.platform.quotas.description=Quotas par défaut par utilisateur à l’échelle de la plateforme, appliqués par la passerelle à chaque requête LLM. La contrainte propre d’un utilisateur (application Utilisateurs et quotas) remplace chaque champ ; null = illimité. Les fenêtres sont le jour calendaire UTC, la semaine ISO (lundi 00:00 UTC) et le mois calendaire ; les dépenses sont le coût SAP plus le coût Connections dans la devise du prix de la Capacity Unit SAP.
schema.platform.quotas.requestsPerMinute.label=Requêtes par minute
schema.platform.quotas.requestsPerMinute.description=Requêtes par utilisateur par minute glissante. Les limites par identifiant (RateLimits) s’appliquent également ; une requête doit respecter les deux.
schema.platform.quotas.spendPerDay.label=Dépenses par jour
schema.platform.quotas.spendPerDay.description=Coût SAP plus coût Connections par utilisateur par jour UTC.
schema.platform.quotas.spendPerWeek.label=Dépenses par semaine
schema.platform.quotas.spendPerWeek.description=Coût SAP plus coût Connections par utilisateur par semaine ISO.
schema.platform.quotas.spendPerMonth.label=Dépenses par mois
schema.platform.quotas.spendPerMonth.description=Coût SAP plus coût Connections par utilisateur par mois calendaire.
schema.platform.quotas.tokensPerDay.label=Jetons par jour
schema.platform.quotas.tokensPerDay.description=Jetons d’entrée, de sortie et d’écriture en cache par utilisateur par jour UTC ; les lectures du cache ne sont pas comptées.
schema.platform.quotas.tokensPerWeek.label=Jetons par semaine
schema.platform.quotas.tokensPerWeek.description=Jetons d’entrée, de sortie et d’écriture en cache par utilisateur par semaine ISO ; les lectures du cache ne sont pas comptées.
schema.platform.quotas.tokensPerMonth.label=Jetons par mois
schema.platform.quotas.tokensPerMonth.description=Jetons d’entrée, de sortie et d’écriture en cache par utilisateur par mois calendaire ; les lectures du cache ne sont pas comptées.
schema.platform.toolGovernance.label=Gouvernance des outils
schema.platform.toolGovernance.description=Gouvernance des outils : durée de conservation des lignes d’utilisation d’outils par requête et de leurs agrégats quotidiens, et façon dont chaque programme client écrit les outils MCP qu’il héberge lui-même.
schema.platform.toolGovernance.mcpNaming.label=Nommage MCP
schema.platform.toolGovernance.mcpNaming.description=Un client qui exécute ses propres serveurs MCP n’envoie aucun type d’outil MCP : Claude Code déclare chaque outil sous la forme mcp__server__tool, tandis que codex les atteint à l’intérieur de son propre outil exec. Ces conventions transforment un tel nom en l’identité mcp:server/tool qu’un motif de politique peut faire correspondre ; un client que personne n’a encore mesuré relève donc d’une modification de configuration plutôt que d’une nouvelle version.
schema.platform.toolGovernance.mcpNaming.namePattern.label=Motif de nom d’outil
schema.platform.toolGovernance.mcpNaming.namePattern.description=Expression régulière comparée à un nom d’outil déclaré ; le premier groupe est le serveur MCP, le second l’outil. La valeur par défaut lit mcp__codex_apps__sites_create_site comme serveur codex_apps et outil sites_create_site.
schema.platform.toolGovernance.mcpNaming.clients.label=Programmes clients
schema.platform.toolGovernance.mcpNaming.clients.description=Une entrée par programme client. La première dont le texte User Agent figure dans celui de la requête s’applique ; une requête qui ne correspond à aucune reste régie par ce qu’elle déclare. Une liste indiquée ici remplace entièrement les préréglages intégrés ; une entrée sans name, userAgent ou containerTools est ignorée.
schema.platform.toolGovernance.mcpNaming.clients.items.name.label=Nom
schema.platform.toolGovernance.mcpNaming.clients.items.name.description=Nom sous lequel ce client est désigné dans le cockpit et les journaux, par exemple claude-code.
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.label=User Agent
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.description=Texte qui identifie le client dans l’en-tête User Agent de la requête, par exemple claude-cli. Comparé sans tenir compte de la casse, n’importe où dans l’en-tête.
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.label=Outils conteneurs
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.description=Outils dont le corps d’appel peut atteindre des outils MCP imbriqués, comme l’exec de codex. Vide pour un client qui déclare directement ses outils MCP, ce qui est le cas courant.
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.label=Motif d’appel imbriqué
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.description=Expression régulière qui trouve le nom d’un outil imbriqué dans le corps d’appel d’un outil conteneur ; le premier groupe est le nom. Seuls les noms sont lus, jamais les arguments.
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.label=Motif de nom d’outil
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.description=Expression régulière qui remplace le motif de nom d’outil partagé pour ce client uniquement ; le premier groupe est le serveur MCP, le second l’outil, et un nom ne compte que si les deux groupes ne sont pas vides. La correspondance respecte la casse et trouve le motif n’importe où dans le nom, sauf s’il est ancré par ^ et $. Omettez-la pour utiliser le motif partagé. Une expression vide ou non valide ne correspond à rien par motif pour ce client (elle ne retombe pas sur le motif partagé), mais les noms de serveur s’appliquent toujours.
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.label=Noms de serveur
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.description=Les serveurs MCP que cette installation exécute, pour un client dont les noms d’outil ne portent aucun marqueur, tel qu’opencode, qui déclare l’outil ping_probe du serveur probe sous le nom probe_ping_probe. Un outil déclaré sous le nom <server>_<tool> devient alors l’identité mcp:server/tool ; le motif de nom est essayé en premier, puis les serveurs dans l’ordre de la liste, et le premier serveur correspondant l’emporte. Les noms de serveur respectent la casse. Les entrées vides sont ignorées. Si la liste reste vide, ces outils restent des outils de fonction ordinaires.
schema.platform.toolGovernance.retention.label=Conservation
schema.platform.toolGovernance.retention.rawDays.label=Conservation de l’utilisation des outils (jours)
schema.platform.toolGovernance.retention.rawDays.description=Nombre de jours pendant lesquels une ligne d’utilisation d’outil par requête est conservée avant que la purge nocturne la supprime. Les agrégats quotidiens conservent les totaux.
schema.platform.toolGovernance.retention.dailyDays.label=Conservation des agrégats d’utilisation des outils (jours)
schema.platform.toolGovernance.retention.dailyDays.description=Nombre de jours pendant lesquels un agrégat quotidien d’utilisation d’outil (par utilisateur, outil et jour) est conservé. L’inventaire et la page utilisateur les lisent.
schema.platform.maintenance.label=Maintenance
schema.platform.maintenance.description=Moment où le service d’administration exécute sa maintenance quotidienne : le recalcul des coûts, la reconstruction des compartiments d’utilisation et la republication du document de quota de chaque utilisateur.
schema.platform.maintenance.dailyRunAtUtc.label=Exécution quotidienne à (UTC)
schema.platform.maintenance.dailyRunAtUtc.description=Heure de la journée, en UTC, au format HH:MM (24 heures), à laquelle commence l’exécution quotidienne de maintenance. Non défini : l’exécution commence 5 minutes après le démarrage du service d’administration, puis toutes les 24 heures ; un redéploiement à midi la fixe donc à midi. Défini : la première exécution commence toujours 5 minutes après le démarrage ; chaque exécution suivante commence chaque jour à cette heure. Exemple : pour une exécution à minuit heure du Pacifique, saisissez 08:00 pendant l’heure normale du Pacifique (UTC-8) ou 07:00 pendant l’heure d’été du Pacifique (UTC-7) - la valeur n’est pas ajustée à l’heure d’été.
schema.observability.label=Observabilité
schema.observability.pseudonymization.label=Pseudonymisation
schema.observability.pseudonymization.description=Paramètres du plug-in de pseudonymisation. L’activation (enabled) et les commutateurs de catégorie (entities) ne s’appliquent qu’à ce plug-in ; le masquage n’a lieu que lorsque le plug-in s’exécute réellement pour une requête - il doit être enregistré dans la chaîne de hooks et une source d’activation doit se déclencher.
schema.observability.pseudonymization.enabled.label=Activé
schema.observability.pseudonymization.enabled.description=Force l’activation du masquage pour une requête. Lu uniquement là où ce bloc se trouve sous models.overrides.<model>.pseudonymization ou hooks.defaults.<endpoint>.pseudonymization : true y masque cette requête, le bloc par modèle l’emportant sur celui par point de terminaison. False ou absent ne force rien - le masquage peut tout de même s’exécuter lorsqu’une autre source d’activation se déclenche, comme un mot déclencheur ou un champ de masquage dans le corps de la requête. Sous observability.pseudonymization, cette clé est actuellement ignorée ; ce niveau fournit tous les autres paramètres d’ici, sauf method et allow_user_bypass. Dans tous les cas, le plug-in doit être raccordé à la chaîne de hooks, sinon rien n’est masqué.
schema.observability.pseudonymization.method.label=Méthode
schema.observability.pseudonymization.method.description=Mode de masquage : `pseudonymization` masque la requête et démasque la réponse ; `anonymization` masque et ne démasque jamais. Lu uniquement là où ce bloc force le masquage (un hook activé ou une surcharge de modèle), pas sous `observability.pseudonymization`. Il conditionne aussi le SIEM : seul `pseudonymization` conserve la réponse masquée ; sous `anonymization`, un sink de contenu reçoit donc le prompt mais pas la réponse. En son absence, `pseudonymization` s’applique. Modes : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.observability.pseudonymization.allow_user_bypass.label=Autoriser le contournement par l’utilisateur
schema.observability.pseudonymization.allow_user_bypass.description=N’a d’effet qu’à l’intérieur d’un bloc qui force l’activation (un hook activé ou une surcharge de modèle) ; non lu sous `observability.pseudonymization`. Valeur par défaut false. Si true, un appelant peut ignorer le masquage via l’en-tête `x-sail-proxy-pseudonymization: off` (insensible à la casse) ou le champ de corps `pseudonymization_off: true` : le contenu atteint le LLM sans masquage et, lorsqu’un sink SIEM activé définit à la fois `include_content` et `allow_unmasked_content`, ce sink également. Détails : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.observability.pseudonymization.entities.label=Entités
schema.observability.pseudonymization.entities.description=Commutateurs de masquage par catégorie : `true` masque la catégorie à ce niveau, `false` non, et une catégorie non listée hérite du niveau inférieur (les niveaux ultérieurs l’emportent). Les clés sont l’ensemble des catégories connues : les catégories actives par défaut ; trois catégories optionnelles livrées désactivées (`profile-org`, `profile-location`, `profile-ip-address`) ; et `profile-sensitive-data`, un commutateur global qui les active toutes sauf ces trois. Une clé hors de cet ensemble est rejetée ici. Catégories et niveaux : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.observability.pseudonymization.org_suffixes.label=Suffixes d’organisation
schema.observability.pseudonymization.org_suffixes.description=Suffixes de forme juridique qui marquent une suite de mots comme nom d’organisation, p. ex. Inc, LLC, GmbH. La correspondance est sensible à la casse par conception ; un 'limited' en minuscules dans un texte n’est donc délibérément pas traité comme forme juridique ; chaque entrée correspond en outre en majuscules intégrales, de sorte qu’une facture qui écrit ACME GMBH est reconnue comme la même organisation qu’Acme GmbH. N’a d’effet que tant que profile-org est activé dans entities ; activer profile-org avec cette liste vide ne masque RIEN comme organisation et journalise un avertissement. Chaque entrée est rognée avant la comparaison, et une entrée vide ou ne contenant que des espaces est silencieusement supprimée plutôt que rejetée.
schema.observability.pseudonymization.location_gazetteer.label=Répertoire de lieux
schema.observability.pseudonymization.location_gazetteer.description=Termes de lieu littéraux que le détecteur structurel masque - sans tenir compte de la casse, et uniquement en mot entier ou en expression entière ; rien n’est déduit des majuscules ou du contexte. N’a d’effet que tant que profile-location est activé dans entities ; activer profile-location avec cette liste vide ne masque RIEN comme lieu et journalise un avertissement. Chaque entrée est rognée, et une entrée vide ou ne contenant que des espaces est silencieusement supprimée. Livrée vide : les noms de lieux sont propres au déploiement et ce dépôt est public ; renseignez-la donc via cette application d’administration de la configuration, jamais dans du code versionné.
schema.observability.pseudonymization.min_confidence.label=Confiance min.
schema.observability.pseudonymization.min_confidence.description=Quantité de preuves qu’une valeur détectée doit réunir avant d’être masquée, de 0 à 1 (par défaut 0.5). Une valeur est masquée dès que son score atteint le seuil ; un simple nom avec majuscule obtient environ 0.5, un motif validé par somme de contrôle 0.95, une règle personnalisée 1.0. Relever le seuil écarte d’abord les noms simples ; resserrez donc plutôt une catégorie bruyante avec `thresholds`. Les règles personnalisées, les identifiants validés et les données d’authentification ne sont jamais rabaissés par leur contexte. Détails du score : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.observability.pseudonymization.thresholds.label=Seuils
schema.observability.pseudonymization.thresholds.description=Seuils de confiance par catégorie, chacun de 0 à 1, qui remplacent `min_confidence` pour les catégories nommées ; une catégorie non listée conserve `min_confidence`. C’est l’endroit où se montrer strict sur une seule catégorie bruyante - `profile-person` à 0.65 exige plus de preuves pour les noms tandis que les identifiants validés restent au seuil global. Les clés sont le même ensemble de catégories connues que celui accepté par `entities` ; `profile-sensitive-data` est accepté mais sans effet. Réglage par catégorie : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.observability.pseudonymization.allowlist.label=Liste d’autorisation
schema.observability.pseudonymization.allowlist.description=Valeurs que ce déploiement ne masque jamais - un interrupteur d’ARRÊT, par valeur. Consultée avant le score de confiance ; une valeur listée est donc exemptée quelle que soit la quantité de preuves. Utilisez-la pour un faux positif récurrent portant un nom propre - un titre de produit ou de rapport qui ressemble à une personne. Les listes des niveaux sont CONCATÉNÉES, pas remplacées ; un niveau inférieur ne fait donc qu’ajouter une exemption, sans jamais en retirer. `terms` ou `patterns`, et le risque d’une entrée trop large : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.allowlist.terms.label=Termes
schema.observability.pseudonymization.allowlist.terms.description=Valeurs littérales, comparées à la valeur détectée entière et EN TENANT COMPTE DE LA CASSE. Sensible à la casse par conception : 'Watson Studio' est le produit qu’un opérateur voulait exempter, 'watson studio' dans une phrase ne l’est pas, et une liste insensible à la casse exempterait aussi une personne dont le nom de famille s’écrit de la même façon. Un terme ne correspond qu’à une valeur que les détecteurs ont produite en entier - lister 'Studio' n’exempte pas 'Watson Studio'. Chaque entrée ici est un interrupteur d’ARRÊT du masquage pour cette valeur exacte ; limitez donc la liste aux valeurs qui ne sont réellement jamais des données personnelles : un terme qui se trouve être le nom de quelqu’un exempte cette personne du masquage partout dans ce déploiement, silencieusement et sans rien dans le journal pour le signaler.
schema.observability.pseudonymization.allowlist.patterns.label=Motifs
schema.observability.pseudonymization.allowlist.patterns.description=Expressions régulières (JavaScript), chacune comparée à la valeur détectée ENTIÈRE : la passerelle encadre elle-même chaque entrée par `^(?: )$` ; écrivez donc `Z[A-Z0-9_]+`, pas `^Z[A-Z0-9_]+$`. La correspondance est sensible à la casse. Chaque entrée est un interrupteur d’ARRÊT du masquage, et une entrée large désactive le masquage sans échouer - `[A-Z].*` désactive presque tous les noms de personnes détectés. Une correspondance avec un exemple de PII intégré émet un avertissement mais est TOUT DE MÊME appliquée. Gardez chaque entrée étroite. Détails : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.saturation_warn.label=Avertissement de saturation
schema.observability.pseudonymization.saturation_warn.description=Nombre de valeurs masquées DISTINCTES qu’une requête peut porter avant d’être signalée comme saturée (par défaut 40). Signalement uniquement - cela ne change jamais ce qui est masqué. Au-delà de ce nombre, la passerelle journalise un avertissement par requête avec des décomptes par catégorie et les FORMES de valeur les plus fréquentes (lettres en X, chiffres en 9) ; aucune valeur masquée n’apparaît jamais. L’événement SIEM d’utilisation de la requête porte les mêmes décomptes avec un indicateur `saturated` - des décomptes, pas du texte. Lire le rapport : https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.observability.pseudonymization.unknown_placeholders.label=Espaces réservés inventés
schema.observability.pseudonymization.unknown_placeholders.description=Ce qui se passe lorsqu’une réponse contient un espace réservé masqué qui n’a jamais été envoyé au modèle. Les modèles en inventent un dans environ 1 réponse pseudonymisée sur 125, et d’autant plus souvent que la requête masque de valeurs ; un tel espace réservé ne désigne personne et ne peut jamais être résolu. withhold (par défaut) : il est remplacé par un simple marqueur tel que [name withheld] et signalé comme événement de sécurité. report : il est seulement signalé et parvient inchangé au client, pour un déploiement dont les propres développeurs écrivent de nouveaux espaces réservés dans des fixtures de test via la passerelle. off : ni l’un ni l’autre. Un espace réservé que le client a lui-même envoyé dans la même requête n’est jamais considéré comme inventé.
schema.observability.siem.label=SIEM
schema.observability.siem.description=Export SIEM. Les événements d’audit et de sécurité sont écrits dans une outbox et livrés au moins une fois à chaque sink activé.
schema.observability.siem.enabled.label=Activé
schema.observability.siem.enabled.description=Interrupteur principal. Si false, le dispatcher ne démarre pas, quels que soient les paramètres de chaque sink.
schema.observability.siem.batch_size.label=Taille de lot
schema.observability.siem.batch_size.description=Nombre de lignes lues par défaut par sink à chaque cycle ; un sink peut le remplacer.
schema.observability.siem.interval_ms.label=Intervalle (ms)
schema.observability.siem.interval_ms.description=Intervalle de distribution par défaut en millisecondes ; un sink peut le remplacer. La période du minuteur est le plus court de tous les intervalles en jeu.
schema.observability.siem.reconcile_lookback_ms.label=Rétrospective de rapprochement (ms)
schema.observability.siem.reconcile_lookback_ms.description=Jusqu’où, en millisecondes, la passe de réparation remonte pour rechercher les événements de l’outbox qui n’ont jamais été remis à un sink. Elle borne cette analyse et empêche un sink nouvellement activé de rejouer tout l’historique conservé ; les événements plus anciens ne sont jamais rattrapés.
schema.observability.siem.content_max_bytes.label=Taille max. du contenu en octets
schema.observability.siem.content_max_bytes.description=Plafond, en octets UTF-8, appliqué indépendamment au prompt et à la réponse avant la publication d’un événement d’utilisation. Un événement tronqué porte content.truncated: true ; un payload partiel n’est donc jamais pris pour une conversation complète. 0 est accepté et vide le contenu, marqué comme tronqué. Par défaut 8192, valeur sur laquelle tombe aussi une valeur négative ou non numérique.
schema.observability.siem.categories.label=Catégories
schema.observability.siem.categories.description=Catégories d’événements à exporter. 'usage' est un événement de fin de requête par requête et la seule catégorie qui peut porter du contenu de conversation ; la liste livrée l’omet, son export est donc un choix explicite ; une liste absente ou vide exporte les trois, usage comprise.
schema.observability.siem.sinks.label=Sinks
schema.observability.siem.sinks.description=Sinks configurés. Un sink dont les paramètres échouent à la validation est ignoré avec un avertissement au lieu d’arrêter les autres.
schema.observability.siem.sinks.items.name.label=Nom
schema.observability.siem.sinks.items.name.description=Nom de sink unique ; la clé utilisée pour les lignes de livraison et l’état de temporisation de chaque sink.
schema.observability.siem.sinks.items.type.label=Type
schema.observability.siem.sinks.items.type.description=Implémentation du sink. Détermine lesquelles des propriétés propres au type ci-dessous s’appliquent.
schema.observability.siem.sinks.items.enabled.label=Activé
schema.observability.siem.sinks.items.enabled.description=Livré à false. Un sink n’est alimenté que si siem.enabled et cette valeur sont tous deux true.
schema.observability.siem.sinks.items.include_content.label=Inclure le contenu
schema.observability.siem.sinks.items.include_content.description=Option explicite : envoie à ce sink le prompt et la réponse de chaque requête, dans le cadre d’un événement d’utilisation. Par défaut false, et false sur chaque sink livré. Ce qui est envoyé est la forme pseudonymisée - des espaces réservés, pas de PII brutes - sauf si allow_unmasked_content est aussi défini. Nécessite 'usage' dans siem.categories ; le dispatcher supprime entièrement le contenu pour un sink où cette valeur est false.
schema.observability.siem.sinks.items.allow_unmasked_content.label=Autoriser le contenu non masqué
schema.observability.siem.sinks.items.allow_unmasked_content.description=RISQUE - lit les conversations brutes. Option explicite pour recevoir du contenu que la pseudonymisation n’a jamais masqué, parce que le masquage était désactivé ou contourné pour cette requête : des noms réels, des adresses et tout ce qu’un utilisateur a collé, en intégralité, quittent ce système. Par défaut false, et n’a d’effet que là où include_content vaut aussi true. Laissée à false, une telle requête n’envoie que des métadonnées et enregistre content.omitted: 'not-masked'.
schema.observability.siem.sinks.items.include_credential_material.label=Inclure les données d’identification
schema.observability.siem.sinks.items.include_credential_material.description=Option explicite : envoie la valeur brute d’un identifiant non résolu à des fins d’analyse forensique. Par défaut false ; le dispatcher supprime le champ lorsque la valeur est false.
schema.observability.siem.sinks.items.batch_size.label=Taille de lot
schema.observability.siem.sinks.items.batch_size.description=Remplacement de siem.batch_size par sink.
schema.observability.siem.sinks.items.interval_ms.label=Intervalle (ms)
schema.observability.siem.sinks.items.interval_ms.description=Remplacement de siem.interval_ms par sink. Doit dépasser le délai d’envoi du sink, sinon les distributions s’accumulent les unes derrière les autres.
schema.observability.siem.sinks.items.url.label=URL
schema.observability.siem.sinks.items.url.description=webhook : URL d’ingestion complète.
schema.observability.siem.sinks.items.token_env.label=Jeton
schema.observability.siem.sinks.items.token_env.description=Nom de l’emplacement d’identifiant. Jamais une valeur d’identifiant - api_config.json est versionné en trois copies synchronisées dans un dépôt public.
schema.observability.siem.sinks.items.endpoint.label=Point de terminaison
schema.observability.siem.sinks.items.endpoint.description=otel : point de terminaison des journaux OTLP/HTTP.
schema.observability.siem.sinks.items.headers_env.label=En-têtes
schema.observability.siem.sinks.items.headers_env.description=Nom de l’emplacement d’identifiant. Jamais une valeur d’identifiant - api_config.json est versionné en trois copies synchronisées dans un dépôt public.
schema.observability.siem.sinks.items.site.label=Site
schema.observability.siem.sinks.items.site.description=datadog : hôte du site, p. ex. datadoghq.com ou datadoghq.eu.
schema.observability.siem.sinks.items.api_key_env.label=Clé API
schema.observability.siem.sinks.items.api_key_env.description=Nom de l’emplacement d’identifiant. Jamais une valeur d’identifiant - api_config.json est versionné en trois copies synchronisées dans un dépôt public.
schema.observability.siem.sinks.items.dcr_endpoint.label=Point de terminaison DCR
schema.observability.siem.sinks.items.dcr_endpoint.description=azure_sentinel : URL du Data Collection Endpoint.
schema.observability.siem.sinks.items.dcr_immutable_id.label=ID immuable DCR
schema.observability.siem.sinks.items.dcr_immutable_id.description=azure_sentinel : ID immuable de la Data Collection Rule.
schema.observability.siem.sinks.items.stream_name.label=Nom du flux
schema.observability.siem.sinks.items.stream_name.description=azure_sentinel : nom du flux personnalisé, p. ex. Custom-SailProxy_CL.
schema.observability.siem.sinks.items.tenant_id.label=ID du tenant
schema.observability.siem.sinks.items.tenant_id.description=azure_sentinel : ID du tenant Entra.
schema.observability.siem.sinks.items.client_id.label=ID client
schema.observability.siem.sinks.items.client_id.description=azure_sentinel : ID d’application (client) Entra.
schema.observability.siem.sinks.items.client_secret_env.label=Secret client
schema.observability.siem.sinks.items.client_secret_env.description=Nom de l’emplacement d’identifiant. Jamais une valeur d’identifiant - api_config.json est versionné en trois copies synchronisées dans un dépôt public.
schema.observability.siem.sinks.items.project_id.label=ID du projet
