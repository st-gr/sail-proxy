# Configuration form field texts by schema path - generated by ci/scripts/schema-texts.js.
# English is regenerated from the schema; other languages are translated in place and kept.
schema.providers.label=Fournisseurs
schema.providers.description=Paramètres de chaque fournisseur en amont, avec pour clé son nom de transport dans la route (ainsi `aws-bedrock` garde son trait d’union). Six fournisseurs sont lus aujourd’hui - anthropic, aws-bedrock, google, openai, openrouter et perplexity ; toute autre clé est acceptée et validée mais reste inactive tant que la passerelle ne la connaît pas. Chaque fournisseur nommé n’accepte que sa propre liste de paramètres, même si certains paramètres acceptés restent inactifs sous un fournisseur donné - la description de chaque champ indique où il est lu ; google est le plus restreint des six et ne porte que substitute_models, lu par la route /google ; tout autre paramètre commun de fournisseur y est rejeté plutôt que simplement inactif. Clés par fournisseur : https://st-gr.github.io/sail-proxy/developer/gateway#provider-configuration-keys
schema.providers.anthropic.label=Anthropic
schema.providers.anthropic.description=Le fournisseur anthropic, servi par le chemin de requête Anthropic de la passerelle : les paramètres que porte chaque fournisseur, plus la version de transport de ce chemin et ses deux filtres d’indicateurs bêta.
schema.providers.anthropic.emulate_streaming_for_models.label=Émuler le streaming pour les modèles
schema.providers.anthropic.emulate_streaming_for_models.description=Modèles dont la passerelle collecte la réponse en entier puis la rejoue sous forme de flux, car le déploiement ne peut pas la diffuser lui-même. Comparé au nom de modèle envoyé en amont, soit exactement, soit sans le préfixe 'provider--'. Utilisé aujourd’hui uniquement pour les fournisseurs anthropic et openai ; une entrée sous tout autre fournisseur est sans effet.
schema.providers.anthropic.substitute_models.label=Modèles de substitution
schema.providers.anthropic.substitute_models.description=Renommages de modèles pour ce fournisseur : une requête qui nomme 'from' (correspondance exacte, casse comprise) est transmise sous 'to' ; la première entrée correspondante l’emporte et les renommages ne s’enchaînent pas. La réponse, ainsi que l’utilisation enregistrée pour le coût, indiquent alors le modèle transmis, et non le nom envoyé par le client. Lu sur les routes anthropic, aws-bedrock et google, sur la route chat completions d’openrouter ainsi que sur les routes de prédiction SAP RPT (/sap/v1/rpt, depuis la liste sap-rpt), chacune pour son propre fournisseur ; sur /openai/v1/chat/completions et /openai/v1/responses, la liste openai est consultée en premier, puis la liste perplexity.
schema.providers.anthropic.substitute_models.items.from.label=De
schema.providers.anthropic.substitute_models.items.from.description=Le nom de modèle envoyé par le client.
schema.providers.anthropic.substitute_models.items.to.label=Vers
schema.providers.anthropic.substitute_models.items.to.description=Le nom de modèle transmis à SAP AI Core, généralement un ID de modèle déployé tel que anthropic--claude-4.5-sonnet--deployed.
schema.providers.anthropic.substitute_models.items.description.label=Description
schema.providers.anthropic.substitute_models.items.description.description=Note libre sur ce renommage, pour quiconque lira la configuration plus tard. Actuellement ignorée par la passerelle ; elle ne change rien au comportement du renommage.
schema.providers.anthropic.unsupported_params.label=Paramètres non pris en charge
schema.providers.anthropic.unsupported_params.description=Paramètres de requête que ce fournisseur ou ce modèle n’accepte pas. La passerelle les supprime avant la transmission à SAP AI Core, qui sinon rejetterait la requête avec 400 "does not support parameters: [...]". Une liste par modèle remplace la liste au niveau du fournisseur au lieu de la compléter.
schema.providers.anthropic.param_renames.label=Renommages de paramètres
schema.providers.anthropic.param_renames.description=Renommages de paramètres appliqués sur le chemin de déploiement direct, par exemple max_tokens en max_completion_tokens pour les modèles de raisonnement OpenAI qui rejettent max_tokens. Une table par modèle remplace la table au niveau du fournisseur au lieu de la compléter.
schema.providers.anthropic.supports_responses_api.label=Prend en charge la Responses API
schema.providers.anthropic.supports_responses_api.description=Indique si ce fournisseur ou ce modèle peut être servi sur /openai/v1/responses. En son absence, la règle de famille intégrée s’applique ; elle admet les modèles déployés GPT-5 et ultérieurs ainsi que la série o.
schema.providers.anthropic.supports_prompt_caching.label=Prend en charge la mise en cache des prompts
schema.providers.anthropic.supports_prompt_caching.description=Indique si les modèles de ce fournisseur reçoivent des points d’arrêt de cache de prompt Anthropic. Ordre de résolution : l’indicateur models.overrides.<model>.supports_prompt_caching par modèle, puis cet indicateur au niveau du fournisseur, puis une valeur par défaut de true pour le fournisseur anthropic et false pour tous les autres. Définir false là où la mise en cache fonctionne coûte le prix d’entrée plein non mis en cache à chaque tour, alors qu’un true superflu s’est révélé sans effet à la mesure - ne le désactivez donc que pour un modèle connu pour le rejeter.
schema.providers.anthropic.anthropic_bedrock_version.label=Version Anthropic Bedrock
schema.providers.anthropic.anthropic_bedrock_version.description=L’anthropic-version que la passerelle envoie à SAP AI Core lorsque le client omet l’en-tête anthropic-version. Lu uniquement depuis providers.anthropic ; une copie sous tout autre fournisseur - aws-bedrock compris - est donc sans effet. En son absence, bedrock-2023-05-31 est utilisé.
schema.providers.anthropic.excluded_beta_headers.label=En-têtes bêta exclus
schema.providers.anthropic.excluded_beta_headers.description=Indicateurs bêta Anthropic retirés d’une requête avant sa transmission, pour les fonctionnalités que le déploiement SAP AI Core n’accepte pas. Appliqués avec les indicateurs que la passerelle met elle-même en quarantaine après une erreur 400 'invalid beta flag' en amont. Lu uniquement depuis providers.anthropic ; une liste sous tout autre fournisseur est sans effet.
schema.providers.anthropic.supported_beta_headers.label=En-têtes bêta pris en charge
schema.providers.anthropic.supported_beta_headers.description=Liste d’autorisation des indicateurs bêta Anthropic : tant qu’elle n’est pas vide, seuls ceux-ci sont transmis, et excluded_beta_headers s’applique en plus. Vide ou absente signifie aucune liste d’autorisation, donc chaque indicateur envoyé par le client passe - ajouter une première entrée ici supprime donc silencieusement tout indicateur qui n’y figure pas. Lu uniquement depuis providers.anthropic.
schema.providers.anthropic.sap_cache_read_token_billing_factor.label=Facteur de facturation SAP des jetons de lecture du cache
schema.providers.anthropic.sap_cache_read_token_billing_factor.description=Facteur d’étalonnage qui ajuste le NOMBRE de jetons d’entrée en LECTURE de cache signalé par l’API du modèle au nombre que SAP AI Core mesure sur sa facture, pour la comptabilité des coûts native SAP en Capacity Units. Lu par l’application d’administration (pas par le chemin de requête de la passerelle). Le rapprochement des factures de mars à juin 2026 a montré que la ligne SAP 'Cache Read Input Tokens' vaut environ 2x les cache_read_input_tokens que l’API renvoie et que sail-proxy capture fidèlement ; le mécanisme n’est pas documenté et fait l’objet d’une demande auprès de SAP. Notez qu’Anthropic et AWS Bedrock multiplient le PRIX du cache (lecture 0.1x, écriture 1.25x/2x selon le TTL), jamais le NOMBRE de jetons ; il s’agit donc d’un étalonnage du comptage SAP, pas du modèle de prix Anthropic. La valeur par défaut 1.0 n’applique aucun ajustement - ne la définissez (p. ex. 2.0) qu’une fois que la demande auprès de SAP aura confirmé le ratio.
schema.providers.anthropic.sap_cache_write_token_billing_factor.label=Facteur de facturation SAP des jetons d’écriture du cache
schema.providers.anthropic.sap_cache_write_token_billing_factor.description=Facteur d’étalonnage qui ajuste le NOMBRE de jetons d’entrée en ÉCRITURE de cache (création) signalé par l’API du modèle au nombre que SAP AI Core mesure sur sa facture, pour la comptabilité des coûts native SAP en Capacity Units. Lu par l’application d’administration (pas par le chemin de requête de la passerelle). Le rapprochement de mars à juin 2026 entre la ligne SAP 'Cache Write Input Tokens' et les cache_creation_input_tokens signalés par l’API a varié d’un mois à l’autre (probablement un effet de limite de période de facturation, les écritures se concentrant en début de session) ; contrairement au facteur de lecture, aucun ratio unique n’est donc établi. La valeur par défaut 1.0 n’applique aucun ajustement ; laissez-la à 1.0 tant que la demande auprès de SAP n’a pas établi un ratio d’écriture ferme.
schema.providers.aws-bedrock.label=Aws-bedrock
schema.providers.aws-bedrock.description=Le fournisseur aws-bedrock, servi par le même chemin de requête au format Anthropic : les paramètres que porte chaque fournisseur, plus la version de transport de ce chemin et ses deux filtres d’indicateurs bêta - que la passerelle lit en réalité chacun depuis providers.anthropic ; une valeur ici est donc acceptée mais reste inactive.
schema.providers.aws-bedrock.emulate_streaming_for_models.label=Émuler le streaming pour les modèles
schema.providers.aws-bedrock.emulate_streaming_for_models.description=Modèles dont la passerelle collecte la réponse en entier puis la rejoue sous forme de flux, car le déploiement ne peut pas la diffuser lui-même. Comparé au nom de modèle envoyé en amont, soit exactement, soit sans le préfixe 'provider--'. Utilisé aujourd’hui uniquement pour les fournisseurs anthropic et openai ; une entrée sous tout autre fournisseur est sans effet.
schema.providers.aws-bedrock.substitute_models.label=Modèles de substitution
schema.providers.aws-bedrock.substitute_models.description=Renommages de modèles pour ce fournisseur : une requête qui nomme 'from' (correspondance exacte, casse comprise) est transmise sous 'to' ; la première entrée correspondante l’emporte et les renommages ne s’enchaînent pas. La réponse, ainsi que l’utilisation enregistrée pour le coût, indiquent alors le modèle transmis, et non le nom envoyé par le client. Lu sur les routes anthropic, aws-bedrock et google, sur la route chat completions d’openrouter ainsi que sur les routes de prédiction SAP RPT (/sap/v1/rpt, depuis la liste sap-rpt), chacune pour son propre fournisseur ; sur /openai/v1/chat/completions et /openai/v1/responses, la liste openai est consultée en premier, puis la liste perplexity.
schema.providers.aws-bedrock.substitute_models.items.from.label=De
schema.providers.aws-bedrock.substitute_models.items.from.description=Le nom de modèle envoyé par le client.
schema.providers.aws-bedrock.substitute_models.items.to.label=Vers
schema.providers.aws-bedrock.substitute_models.items.to.description=Le nom de modèle transmis à SAP AI Core, généralement un ID de modèle déployé tel que anthropic--claude-4.5-sonnet--deployed.
schema.providers.aws-bedrock.substitute_models.items.description.label=Description
schema.providers.aws-bedrock.substitute_models.items.description.description=Note libre sur ce renommage, pour quiconque lira la configuration plus tard. Actuellement ignorée par la passerelle ; elle ne change rien au comportement du renommage.
schema.providers.aws-bedrock.unsupported_params.label=Paramètres non pris en charge
schema.providers.aws-bedrock.unsupported_params.description=Paramètres de requête que ce fournisseur ou ce modèle n’accepte pas. La passerelle les supprime avant la transmission à SAP AI Core, qui sinon rejetterait la requête avec 400 "does not support parameters: [...]". Une liste par modèle remplace la liste au niveau du fournisseur au lieu de la compléter.
schema.providers.aws-bedrock.param_renames.label=Renommages de paramètres
schema.providers.aws-bedrock.param_renames.description=Renommages de paramètres appliqués sur le chemin de déploiement direct, par exemple max_tokens en max_completion_tokens pour les modèles de raisonnement OpenAI qui rejettent max_tokens. Une table par modèle remplace la table au niveau du fournisseur au lieu de la compléter.
schema.providers.aws-bedrock.supports_responses_api.label=Prend en charge la Responses API
schema.providers.aws-bedrock.supports_responses_api.description=Indique si ce fournisseur ou ce modèle peut être servi sur /openai/v1/responses. En son absence, la règle de famille intégrée s’applique ; elle admet les modèles déployés GPT-5 et ultérieurs ainsi que la série o.
schema.providers.aws-bedrock.supports_prompt_caching.label=Prend en charge la mise en cache des prompts
schema.providers.aws-bedrock.supports_prompt_caching.description=Indique si les modèles de ce fournisseur reçoivent des points d’arrêt de cache de prompt Anthropic. Ordre de résolution : l’indicateur models.overrides.<model>.supports_prompt_caching par modèle, puis cet indicateur au niveau du fournisseur, puis une valeur par défaut de true pour le fournisseur anthropic et false pour tous les autres. Définir false là où la mise en cache fonctionne coûte le prix d’entrée plein non mis en cache à chaque tour, alors qu’un true superflu s’est révélé sans effet à la mesure - ne le désactivez donc que pour un modèle connu pour le rejeter.
schema.providers.aws-bedrock.anthropic_bedrock_version.label=Version Anthropic Bedrock
schema.providers.aws-bedrock.anthropic_bedrock_version.description=L’anthropic-version que la passerelle envoie à SAP AI Core lorsque le client omet l’en-tête anthropic-version. Lu uniquement depuis providers.anthropic ; une copie sous tout autre fournisseur - aws-bedrock compris - est donc sans effet. En son absence, bedrock-2023-05-31 est utilisé.
