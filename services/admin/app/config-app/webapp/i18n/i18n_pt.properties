schema.providers.openrouter.default_pricing.label=Preços predefinidos
schema.providers.openrouter.default_pricing.description=Preços de recurso do OpenRouter - completion, image e prompt, cada um como cadeia decimal. Atualmente ignorado pelo gateway; mantido para que o valor fornecido seja válido e continue visível para qualquer consumidor que venha a ser adicionado. Alterá-lo não muda hoje qualquer comportamento.
schema.providers.openrouter.default_pricing.completion.label=Conclusão
schema.providers.openrouter.default_pricing.completion.description=Preço dos tokens de conclusão, escrito como cadeia decimal. Atualmente ignorado pelo gateway, tal como o resto de default_pricing: a lista de modelos no formato OpenRouter indica, em vez disso, preços fixos próprios.
schema.providers.openrouter.default_pricing.image.label=Imagem
schema.providers.openrouter.default_pricing.image.description=Preço da entrada de imagens, escrito como cadeia decimal. Atualmente ignorado pelo gateway, tal como o resto de default_pricing: a lista de modelos no formato OpenRouter indica, em vez disso, preços fixos próprios.
schema.providers.openrouter.default_pricing.prompt.label=Prompt
schema.providers.openrouter.default_pricing.prompt.description=Preço dos tokens de prompt, escrito como cadeia decimal. Atualmente ignorado pelo gateway, tal como o resto de default_pricing: a lista de modelos no formato OpenRouter indica, em vez disso, preços fixos próprios.
schema.providers.openrouter.model_mappings.label=Mapeamentos de modelos
schema.providers.openrouter.model_mappings.description=Predefinições por fornecedor a montante para pedidos OpenRouter, cujos IDs de modelo são escritos 'provider/model'. A primeira entrada cujo provider corresponde ao prefixo do ID, sem distinguir maiúsculas de minúsculas, fornece max_tokens quando o cliente o omite. É o único campo usado: default_context_length e id_prefix são exigidos por este esquema, mas atualmente ignorados pelo gateway.
schema.providers.openrouter.model_mappings.items.default_context_length.label=Comprimento de contexto predefinido
schema.providers.openrouter.model_mappings.items.default_context_length.description=Obrigatório em todas as entradas, mas atualmente ignorado pelo gateway; mantido por compatibilidade.
schema.providers.openrouter.model_mappings.items.id_prefix.label=Prefixo do ID
schema.providers.openrouter.model_mappings.items.id_prefix.description=Obrigatório em todas as entradas, mas atualmente ignorado pelo gateway; a correspondência é feita por provider, não por este campo.
schema.providers.openrouter.model_mappings.items.provider.label=Fornecedor
schema.providers.openrouter.model_mappings.items.provider.description=Comparado, sem distinguir maiúsculas de minúsculas, com a parte do ID de modelo do cliente antes da barra.
schema.providers.openrouter.model_mappings.items.max_tokens.label=Máx. de tokens
schema.providers.openrouter.model_mappings.items.max_tokens.description=Aplicado como max_tokens do pedido quando o cliente não envia nenhum. Se estiver ausente, o pedido fica sem ele.
schema.providers.perplexity.label=Perplexity
schema.providers.perplexity.description=O fornecedor perplexity: as definições que todos os fornecedores têm, e nada além delas - o caminho Perplexity não lê nenhuma definição própria.
