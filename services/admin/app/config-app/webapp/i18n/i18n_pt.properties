schema.providers.aws-bedrock.supported_beta_headers.description=Lista de permissões das flags beta da Anthropic: enquanto não estiver vazia, apenas estas são reencaminhadas, e excluded_beta_headers continua a aplicar-se por cima. Vazia ou ausente significa nenhuma lista de permissões, pelo que todas as flags enviadas pelo cliente passam - o que faz com que adicionar aqui uma primeira entrada descarte silenciosamente todas as flags não listadas ao lado dela. Lido apenas de providers.anthropic.
schema.providers.google.label=Google
schema.providers.google.description=O fornecedor google, servido pelo caminho de pedido Gemini do gateway. Hoje apenas substitute_models é respeitado; as restantes definições comuns de fornecedor ainda não estão ligadas para este fornecedor, pelo que - ao contrário de todos os outros fornecedores nomeados aqui - são rejeitadas em vez de ficarem apenas inativas.
