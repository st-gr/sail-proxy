schema.providers.perplexity.param_renames.label=Mudanças de nome de parâmetros
schema.providers.perplexity.param_renames.description=Mudanças de nome de parâmetros aplicadas no caminho de implementação direta, por exemplo max_tokens para max_completion_tokens nos modelos de raciocínio OpenAI que rejeitam max_tokens. Um mapa por modelo substitui o mapa ao nível do fornecedor, em vez de o complementar.
schema.providers.perplexity.supports_responses_api.label=Suporta a Responses API
schema.providers.perplexity.supports_responses_api.description=Indica se este fornecedor ou modelo pode ser servido em /openai/v1/responses. Se estiver ausente, mantém-se a regra de família integrada, que admite os modelos implementados GPT-5 e posteriores e a série o.
schema.providers.perplexity.supports_prompt_caching.label=Suporta a colocação de prompts em cache
schema.providers.perplexity.supports_prompt_caching.description=Indica se os modelos deste fornecedor recebem breakpoints de cache de prompt da Anthropic. Ordem de resolução: a flag models.overrides.<model>.supports_prompt_caching por modelo, depois esta flag ao nível do fornecedor, depois uma predefinição de true para o fornecedor anthropic e false para todos os outros. Definir false onde a cache funciona custa o preço total de entrada sem cache em cada turno, enquanto um true desnecessário foi medido como sem efeito - por isso, desative apenas para um modelo que se saiba que o rejeita.
schema.providers._entry.description=As definições de fornecedor que o caminho de pedido de cada fornecedor pode alcançar, pelo que cinco dos seis fornecedores nomeados - todos exceto google - têm a forma completa. Todos os campos são opcionais, e um campo ausente significa o comportamento integrado do gateway. É também apenas contra esta forma que é validada uma chave de fornecedor que o gateway não lê: aí uma chave desconhecida continua a ser aceite em vez de rejeitada e fica no ficheiro sem efeito. Esses cinco fornecedores nomeados acrescentam as suas próprias definições a estas e não aceitam mais nada; google, o sexto, referencia apenas o campo substitute_models desta forma e não aceita nada além dele - a rota /google ainda não lê nenhuma outra definição de fornecedor.
schema.providers._entry.emulate_streaming_for_models.label=Emular streaming para modelos
schema.providers._entry.emulate_streaming_for_models.description=Modelos cuja resposta o gateway recolhe na íntegra e depois reproduz como stream, porque a implementação não a consegue transmitir em stream por si própria. Comparado com o nome do modelo enviado a montante, exatamente ou sem o prefixo 'provider--'. Hoje usado apenas para os fornecedores anthropic e openai; uma entrada em qualquer outro fornecedor não tem efeito.
schema.providers._entry.substitute_models.label=Modelos de substituição
schema.providers._entry.substitute_models.description=Mudanças de nome de modelos para este fornecedor: um pedido que indique 'from' (correspondência exata, incluindo maiúsculas e minúsculas) é reencaminhado como 'to'; prevalece a primeira entrada correspondente e as mudanças de nome não se encadeiam. A resposta e a utilização registada para o custo indicam então o modelo reencaminhado, e não o nome que o cliente enviou. Lido nas rotas anthropic, aws-bedrock e google, na rota de chat completions do openrouter e nas rotas de previsão do SAP RPT (/sap/v1/rpt, a partir da lista sap-rpt), cada uma para o seu próprio fornecedor; em /openai/v1/chat/completions e /openai/v1/responses é consultada primeiro a lista openai e depois a lista perplexity.
schema.providers._entry.substitute_models.items.from.label=De
schema.providers._entry.substitute_models.items.from.description=O nome do modelo que o cliente envia.
schema.providers._entry.substitute_models.items.to.label=Para
schema.providers._entry.substitute_models.items.to.description=O nome do modelo reencaminhado para o SAP AI Core, normalmente um ID de modelo implementado como anthropic--claude-4.5-sonnet--deployed.
schema.providers._entry.substitute_models.items.description.label=Descrição
schema.providers._entry.substitute_models.items.description.description=Nota de texto livre sobre esta mudança de nome, para quem ler a configuração mais tarde. Atualmente ignorada pelo gateway; não altera em nada o comportamento da mudança de nome.
schema.providers._entry.unsupported_params.label=Parâmetros não suportados
schema.providers._entry.unsupported_params.description=Parâmetros de pedido que este fornecedor ou modelo não aceita. O gateway remove-os antes de reencaminhar para o SAP AI Core, que de outro modo rejeitaria o pedido com 400 "does not support parameters: [...]". Uma lista por modelo substitui a lista ao nível do fornecedor, em vez de a complementar.
schema.providers._entry.param_renames.label=Mudanças de nome de parâmetros
schema.providers._entry.param_renames.description=Mudanças de nome de parâmetros aplicadas no caminho de implementação direta, por exemplo max_tokens para max_completion_tokens nos modelos de raciocínio OpenAI que rejeitam max_tokens. Um mapa por modelo substitui o mapa ao nível do fornecedor, em vez de o complementar.
schema.providers._entry.supports_responses_api.label=Suporta a Responses API
schema.providers._entry.supports_responses_api.description=Indica se este fornecedor ou modelo pode ser servido em /openai/v1/responses. Se estiver ausente, mantém-se a regra de família integrada, que admite os modelos implementados GPT-5 e posteriores e a série o.
schema.providers._entry.supports_prompt_caching.label=Suporta a colocação de prompts em cache
schema.providers._entry.supports_prompt_caching.description=Indica se os modelos deste fornecedor recebem breakpoints de cache de prompt da Anthropic. Ordem de resolução: a flag models.overrides.<model>.supports_prompt_caching por modelo, depois esta flag ao nível do fornecedor, depois uma predefinição de true para o fornecedor anthropic e false para todos os outros. Definir false onde a cache funciona custa o preço total de entrada sem cache em cada turno, enquanto um true desnecessário foi medido como sem efeito - por isso, desative apenas para um modelo que se saiba que o rejeita.
schema.models.label=Modelos
schema.models.overrides.label=Substituições
schema.models.overrides.description=Ajustes por modelo aplicados à lista de modelos que o gateway obtém do SAP AI Core. Cada chave é o ID interno de um modelo, escrito exatamente como aparece na transmissão.
schema.models.overrides._entry.description=Ajustes para um modelo, aplicados ao que o SAP AI Core indica para ele e com o ID interno do modelo como chave acima. A aplicação é deliberadamente aberta: qualquer chave não listada abaixo é copiada tal como está para o modelo e republicada na lista de modelos, sem validação nem tipo, em vez de ser ignorada. Os campos abaixo são aqueles sobre os quais o próprio gateway atua.
schema.models.overrides._entry.hooks.label=Hooks
schema.models.overrides._entry.hooks.description=Hooks deste modelo, tendo como chave o subcaminho de pedido que armam (invoke, invoke-with-response-stream, converse, ...). Um subcaminho listado aqui SUBSTITUI a predefinição do endpoint em hooks.defaults para esse subcaminho, em vez de se fundir com ela; um subcaminho não listado recorre a essa predefinição. Um hook só é acionado quando todas as regras no seu request.match se verificam, e request.callback.id indica o plug-in a executar.
schema.models.overrides._entry.hooks._entry.description=A lista de hooks de um subcaminho, experimentados por ordem. A mesma forma serve hooks.defaults.<endpoint>.<subpath> e models.overrides.<model>.hooks.<subpath>, pelo que o gateway vê uma única forma, qualquer que seja a das duas que a forneceu. Um hook só é acionado quando TODAS as regras indicadas no seu request.match correspondem ao pedido; request.callback.id indica então o plug-in a executar para a fase em curso. Um hook cujo match não se verifica, ou cujo callback não indica nenhum plug-in registado para essa fase, é ignorado e é experimentado o seguinte - nenhum dos casos é um erro em tempo de execução.
schema.models.overrides._entry.hooks._entry.items.request.label=Pedido
schema.models.overrides._entry.hooks._entry.items.request.description=O que tem de corresponder e o que executar quando corresponde. Tem o nome do pedido porque o comparador só inspeciona o pedido de entrada; não há equivalente para a resposta, e nada mais é lido num hook.
schema.models.overrides._entry.hooks._entry.items.request.callback.label=Callback
schema.models.overrides._entry.hooks._entry.items.request.callback.description=O plug-in a executar quando todas as regras em match tiverem correspondido.
schema.models.overrides._entry.hooks._entry.items.request.callback.id.label=ID
schema.models.overrides._entry.hooks._entry.items.request.callback.id.description=O ID com que um plug-in se registou, procurado no registo de plug-ins do gateway para a fase em execução. Este esquema não consegue verificar a referência cruzada: um ID que nenhum plug-in registou para essa fase é registado como não encontrado e o hook é ignorado, pelo que o pedido passa sem alterações em vez de falhar.
schema.models.overrides._entry.hooks._entry.items.request.match.label=Correspondência
schema.models.overrides._entry.hooks._entry.items.request.match.description=Os IDs de regras que têm TODAS de corresponder, avaliados por ordem e abandonados no primeiro que não corresponde. Cada ID é uma chave em hooks.definitions - uma referência cruzada que este esquema não consegue verificar: um ID não definido em lado nenhum regista um aviso e faz com que todo o hook não corresponda, pelo que um erro de escrita desativa silenciosamente o plug-in em vez de o acionar incondicionalmente. Uma lista vazia é rejeitada, porque um hook que deve correr em quase tudo escreve-se, em vez disso, indicando uma regra deliberadamente ampla - o payload:any fornecido corresponde a qualquer pedido cujo corpo analisado contenha um model de cadeia não vazia, o que é o mais próximo de incondicional que uma regra pode ser e ainda o diz explicitamente.
schema.models.overrides._entry.subpaths_native.label=Subcaminhos nativos
schema.models.overrides._entry.subpaths_native.description=Os subcaminhos que este modelo serve nativamente, na grafia do próprio gateway (invoke, invoke-with-response-stream, converse, converse-stream). Lida como lista completa: enquanto estiver presente, qualquer subcaminho que nela falte conta como emulado. Se estiver ausente, aplica-se invoke mais invoke-with-response-stream. Substitui o valor próprio da lista de modelos, é republicada na entrada do modelo, e uma entrada terminada em -stream também alimenta a regra streamingSupported abaixo.
schema.models.overrides._entry.subpaths_emulated.label=Subcaminhos emulados
schema.models.overrides._entry.subpaths_emulated.description=Os subcaminhos que este modelo alcança através da emulação do gateway em vez de nativamente. Nada é encaminhado com base nisto - um subcaminho conta como emulado simplesmente por estar ausente de subpaths_native -, pelo que a lista é apenas declarativa: substitui o valor próprio da lista de modelos e é republicada na entrada do modelo para os clientes que a inspecionam, e nada mais.
schema.models.overrides._entry.streamingSupported.label=Streaming suportado
schema.models.overrides._entry.streamingSupported.description=Indica se este modelo suporta respostas em streaming; em camelCase porque é essa a grafia do próprio SAP AI Core na lista de modelos. Para um modelo que tenha de todo uma entrada em overrides: um true ou false explícito aqui prevalece; caso contrário, uma entrada de subpaths_native terminada em -stream significa true, a menos que a lista de modelos já indicasse false; caso contrário, um modelo de acesso por implementação que tenha uma entrada mas nenhum valor explícito é forçado a FALSE - pelo que adicionar uma entrada para uma implementação com streaming e omitir esta flag desliga o streaming. Um modelo de base mantém o seu valor do AI Core. O resultado aplica-se a todas as versões do modelo.
schema.models.overrides._entry.supports_prompt_caching.label=Suporta a colocação de prompts em cache
schema.models.overrides._entry.supports_prompt_caching.description=Indica se este modelo recebe breakpoints de cache de prompt da Anthropic. Ordem de resolução: esta flag por modelo, depois a flag ao nível do fornecedor api_config.providers.<provider>.supports_prompt_caching, depois uma predefinição de true para modelos do fornecedor Anthropic e false para todos os outros. Defina false para excluir um modelo; um true num modelo Anthropic sem substituição ao nível do fornecedor não altera nada.
schema.models.overrides._entry.anthropic_version.label=Versão Anthropic
schema.models.overrides._entry.anthropic_version.description=A anthropic_version que o gateway coloca no corpo do pedido Bedrock invoke deste modelo quando o chamador não forneceu nenhuma. Um corpo que já contenha o campo não é alterado, e os subcaminhos que não sejam invoke não são tocados. O valor fornecido é bedrock-2023-05-31.
schema.models.overrides._entry.pseudonymization.label=Pseudonimização
schema.models.overrides._entry.pseudonymization.description=Definições do plug-in de pseudonimização. A ativação (enabled) e os interruptores de categoria (entities) aplicam-se apenas a este plug-in; o mascaramento só ocorre quando o plug-in é efetivamente executado para um pedido - tem de estar registado na cadeia de hooks e uma fonte de ativação tem de ser acionada.
schema.models.overrides._entry.pseudonymization.enabled.label=Ativado
schema.models.overrides._entry.pseudonymization.enabled.description=Força a ativação do mascaramento para um pedido. Lido apenas onde este bloco se encontra em models.overrides.<model>.pseudonymization ou hooks.defaults.<endpoint>.pseudonymization: true mascara aí esse pedido, prevalecendo o bloco por modelo sobre o bloco por endpoint. False ou ausente não força nada - o mascaramento pode ainda assim ser executado quando outra fonte de ativação for acionada, como uma palavra-gatilho ou um campo de mascaramento no corpo do pedido. Em observability.pseudonymization esta chave é atualmente ignorada; essa camada contribui com todas as outras definições daqui, exceto method e allow_user_bypass. Em qualquer caso, o plug-in tem de estar ligado à cadeia de hooks, caso contrário nada é mascarado.
schema.models.overrides._entry.pseudonymization.method.label=Método
schema.models.overrides._entry.pseudonymization.method.description=Modo de mascaramento: `pseudonymization` mascara o pedido e desmascara a resposta; `anonymization` mascara e nunca desmascara. Lido apenas onde este bloco força o mascaramento (um hook ativado ou uma substituição de modelo), não em `observability.pseudonymization`. Também condiciona o SIEM: só `pseudonymization` mantém a resposta mascarada, pelo que, em `anonymization`, um sink de conteúdo recebe o prompt mas não a resposta. Se for omitido, aplica-se `pseudonymization`. Modos: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.models.overrides._entry.pseudonymization.allow_user_bypass.label=Permitir que o utilizador contorne
schema.models.overrides._entry.pseudonymization.allow_user_bypass.description=Só tem efeito dentro de um bloco que força a ativação (um hook ativado ou uma substituição de modelo); não é lido em `observability.pseudonymization`. Predefinição false. Quando true, um chamador pode ignorar o mascaramento através do cabeçalho `x-sail-proxy-pseudonymization: off` (sem distinguir maiúsculas de minúsculas) ou do campo de corpo `pseudonymization_off: true`: o conteúdo chega ao LLM sem máscara e, quando um sink SIEM ativado define `include_content` e `allow_unmasked_content`, também a esse sink. Detalhes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.models.overrides._entry.pseudonymization.entities.label=Entidades
schema.models.overrides._entry.pseudonymization.entities.description=Interruptores de mascaramento por categoria: `true` mascara a categoria nesta camada, `false` não, e uma categoria não listada herda a camada inferior (as camadas posteriores prevalecem). As chaves são o conjunto de categorias conhecidas: as categorias ativas por predefinição; três opcionais que são fornecidas desativadas (`profile-org`, `profile-location`, `profile-ip-address`); e `profile-sensitive-data`, um interruptor global que ativa todas exceto essas três. Uma chave fora do conjunto é rejeitada aqui. Categorias e camadas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.models.overrides._entry.pseudonymization.org_suffixes.label=Sufixos de organização
schema.models.overrides._entry.pseudonymization.org_suffixes.description=Sufixos de forma jurídica que marcam uma sequência de palavras como nome de organização, p. ex. Inc, LLC, GmbH. A correspondência distingue maiúsculas de minúsculas por conceção, pelo que um 'limited' em minúsculas no texto não é deliberadamente tratado como forma jurídica; cada entrada corresponde também totalmente em maiúsculas, pelo que uma fatura que escreva ACME GMBH é reconhecida como a mesma organização que Acme GmbH. Só tem efeito enquanto profile-org estiver ativado em entities; ativar profile-org com esta lista vazia não mascara NADA como organização e regista um aviso. Cada entrada é aparada antes da correspondência, e uma entrada vazia ou só com espaços é descartada silenciosamente em vez de rejeitada.
schema.models.overrides._entry.pseudonymization.location_gazetteer.label=Diretório de localizações
schema.models.overrides._entry.pseudonymization.location_gazetteer.description=Termos literais de localização que o detetor estrutural mascara - sem distinguir maiúsculas de minúsculas, e apenas como palavra inteira ou expressão inteira; nada é inferido de maiúsculas ou do contexto. Só tem efeito enquanto profile-location estiver ativado em entities; ativar profile-location com esta lista vazia não mascara NADA como localização e regista um aviso. Cada entrada é aparada, e uma entrada vazia ou só com espaços é descartada silenciosamente. É fornecida vazia: os nomes de lugares são específicos da implementação e este repositório é público, por isso preencha-a através desta aplicação de administração da configuração, nunca em código versionado.
schema.models.overrides._entry.pseudonymization.min_confidence.label=Confiança mín.
schema.models.overrides._entry.pseudonymization.min_confidence.description=Quanta evidência um valor detetado precisa antes de ser mascarado, de 0 a 1 (predefinição 0.5). Um valor é mascarado assim que a sua pontuação atinge o limiar; um nome simples com maiúscula pontua cerca de 0.5, um padrão validado por soma de verificação 0.95, uma regra personalizada 1.0. Subir o limiar elimina primeiro os nomes simples, por isso aperte antes uma categoria com ruído através de `thresholds`. Regras personalizadas, identificadores validados e credenciais nunca são rebaixados pelo contexto envolvente. Detalhes da pontuação: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.models.overrides._entry.pseudonymization.thresholds.label=Limiares
schema.models.overrides._entry.pseudonymization.thresholds.description=Limiares de confiança por categoria, cada um de 0 a 1, que substituem `min_confidence` para as categorias indicadas; uma não listada mantém `min_confidence`. É aqui que se pode ser rigoroso com uma única categoria com ruído - `profile-person` a 0.65 exige mais evidência para nomes, enquanto os identificadores validados ficam no limiar global. As chaves são o mesmo conjunto de categorias conhecidas que `entities` aceita; `profile-sensitive-data` é aceite mas não faz nada. Ajuste por categoria: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.models.overrides._entry.pseudonymization.allowlist.label=Lista de permissões
schema.models.overrides._entry.pseudonymization.allowlist.description=Valores que esta implementação nunca mascara - um interruptor de DESLIGAR, por valor. Consultada antes da pontuação de confiança, pelo que um valor listado fica isento, por muita evidência que exista. Use-a para um falso positivo recorrente com nome próprio - um título de produto ou de relatório que parece uma pessoa. As listas das camadas são CONCATENADAS, não substituídas, pelo que uma camada inferior só acrescenta uma isenção, nunca retira uma. `terms` versus `patterns`, e o risco de entradas demasiado amplas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.allowlist.terms.label=Termos
schema.models.overrides._entry.pseudonymization.allowlist.terms.description=Valores literais, comparados com o valor detetado inteiro e DISTINGUINDO MAIÚSCULAS DE MINÚSCULAS. Por conceção: 'Watson Studio' é o produto que um operador quis isentar e 'watson studio' numa frase não é, e uma lista que não distinguisse maiúsculas isentaria também uma pessoa cujo apelido por acaso se escreve da mesma forma. Um termo só corresponde a um valor que os detetores produziram inteiro - listar 'Studio' não isenta 'Watson Studio'. Cada entrada aqui é um interruptor de DESLIGAR do mascaramento para esse valor exato, por isso limite a lista a valores que nunca sejam realmente dados pessoais: um termo que por acaso seja o nome de alguém isenta essa pessoa do mascaramento em toda esta implementação, silenciosamente e sem nada no registo que o indique.
schema.models.overrides._entry.pseudonymization.allowlist.patterns.label=Padrões
schema.models.overrides._entry.pseudonymization.allowlist.patterns.description=Expressões regulares (JavaScript), cada uma comparada com o valor detetado INTEIRO: o próprio gateway envolve cada entrada em `^(?: )$`, por isso escreva `Z[A-Z0-9_]+`, não `^Z[A-Z0-9_]+$`. A correspondência distingue maiúsculas de minúsculas. Cada entrada é um interruptor de DESLIGAR do mascaramento, e uma entrada ampla desativa o mascaramento sem falhar - `[A-Z].*` desliga quase todos os nomes de pessoas detetados. Uma correspondência com uma amostra de PII integrada gera um aviso, mas é AINDA ASSIM aplicada. Mantenha cada entrada restrita. Detalhes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.saturation_warn.label=Aviso de saturação
schema.models.overrides._entry.pseudonymization.saturation_warn.description=Quantos valores mascarados DISTINTOS um pedido pode conter antes de ser comunicado como saturado (predefinição 40). Apenas para relatório - nunca altera o que é mascarado. Acima desse número, o gateway regista um aviso por pedido com contagens por categoria e as FORMAS de valor mais comuns (letras como X, dígitos como 9); nenhum valor mascarado aparece alguma vez. O evento SIEM de utilização do pedido contém as mesmas contagens com uma flag `saturated` - contagens, não texto. Ler o relatório: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.models.overrides._entry.pseudonymization.unknown_placeholders.label=Marcadores de posição inventados
schema.models.overrides._entry.pseudonymization.unknown_placeholders.description=O que acontece quando uma resposta contém um marcador de posição mascarado que nunca foi enviado ao modelo. Os modelos inventam um em cerca de 1 em cada 125 respostas pseudonimizadas, e com mais frequência quanto mais valores um pedido mascara; um marcador assim não designa ninguém e nunca pode ser resolvido. withhold (predefinição): é substituído por um marcador simples como [name withheld] e comunicado como evento de segurança. report: é apenas comunicado e chega inalterado ao cliente, para uma implementação cujos próprios programadores escrevem novos marcadores em fixtures de teste através do gateway. off: nenhum dos dois. Um marcador que o próprio cliente enviou no mesmo pedido nunca é tratado como inventado.
schema.models.overrides._entry.unsupported_params.label=Parâmetros não suportados
schema.models.overrides._entry.unsupported_params.description=Parâmetros de pedido que este fornecedor ou modelo não aceita. O gateway remove-os antes de reencaminhar para o SAP AI Core, que de outro modo rejeitaria o pedido com 400 "does not support parameters: [...]". Uma lista por modelo substitui a lista ao nível do fornecedor, em vez de a complementar.
schema.models.overrides._entry.param_renames.label=Mudanças de nome de parâmetros
schema.models.overrides._entry.param_renames.description=Mudanças de nome de parâmetros aplicadas no caminho de implementação direta, por exemplo max_tokens para max_completion_tokens nos modelos de raciocínio OpenAI que rejeitam max_tokens. Um mapa por modelo substitui o mapa ao nível do fornecedor, em vez de o complementar.
schema.models.overrides._entry.supports_responses_api.label=Suporta a Responses API
schema.models.overrides._entry.supports_responses_api.description=Indica se este fornecedor ou modelo pode ser servido em /openai/v1/responses. Se estiver ausente, mantém-se a regra de família integrada, que admite os modelos implementados GPT-5 e posteriores e a série o.
schema.models.overrides._entry.cachePricing.label=Preços de cache
schema.models.overrides._entry.cachePricing.description=Preços de cache de prompt para este modelo; em camelCase deliberadamente, uma grafia cache_pricing não é lida. Ambos os valores são CADEIAS de custo decimais por 1K tokens, nunca números: são transportados sem alteração para a lista de custos de cada versão e entregues a tudo o que pedir os preços de cache deste modelo. Se estiver ausente, este modelo não indica quaisquer preços de cache.
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.label=Custo de leitura de cache por 1K tokens de entrada
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.description=Custo de leitura de 1K tokens de entrada em cache, como cadeia decimal - p. ex. 0.00020, não 0.0002e0 e não um número.
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.label=Custo de criação de cache por 1K tokens de entrada
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.description=Custo de escrita de 1K tokens de entrada na cache, como cadeia decimal - p. ex. 0.00254, não um número.
schema.models.overrides._entry.inject_beta_features.label=Injetar funcionalidades beta
schema.models.overrides._entry.inject_beta_features.description=Flags de funcionalidades beta da Anthropic que o gateway acrescenta aos pedidos Bedrock invoke deste modelo. São fundidas com o cabeçalho anthropic-beta e com qualquer anthropic_beta que o corpo do pedido contenha, e depois filtradas por supported_beta_headers, excluded_beta_headers e pela quarentena de flags beta em tempo de execução - pelo que uma flag listada aqui é ainda assim descartada se não for permitida. Uma lista vazia não injeta nada.
schema.models.overrides._entry.contextLength.label=Comprimento de contexto
schema.models.overrides._entry.contextLength.description=A janela de contexto deste modelo em tokens, usada apenas como recurso: o gateway prefere o comprimento de contexto da versão mais recente fornecido pelo SAP AI Core e só lê este valor quando a lista de modelos não contém nenhum, antes de recorrer a uma predefinição por família. É indicado como context_length, e metade dele como max_completion_tokens, nas listas de modelos nos formatos OpenRouter e OpenAI. 0 não é um valor utilizável.
schema.capabilities.label=Capacidades
schema.capabilities.web_search.label=Pesquisa na web
schema.capabilities.web_search.description=Ferramenta de pesquisa na web alojada (baseada no Perplexity). O único parâmetro aqui limita quantas pesquisas um único pedido pode executar.
schema.capabilities.web_search.max_searches_per_request.label=Máx. de pesquisas por pedido
schema.capabilities.web_search.max_searches_per_request.description=Limite de pesquisas na web alojadas que um pedido pode efetuar antes de o gateway deixar de continuar o turno. Cada pesquisa custa uma chamada ao Perplexity mais uma ida e volta completa à implementação, pelo que isto é um controlo de custos e também a garantia de terminação do ciclo de continuação. Um valor não inteiro, zero, negativo ou superior a 10 recorre à predefinição de 3 em vez de ser respeitado - o limite nunca pode ser eliminado por configuração.
schema.capabilities.file_search.label=Pesquisa de ficheiros
schema.capabilities.file_search.description=Recuperação de documentos compatível com OpenAI: ingestão /v1/files, /v1/vector_stores, pesquisa híbrida e a ferramenta alojada file_search. Nada aqui é obrigatório - cada campo recorre à sua própria predefinição fornecida quando está ausente, pelo que eliminar um campo é uma edição válida e não um erro.
schema.capabilities.file_search.enabled.label=Ativado
schema.capabilities.file_search.enabled.description=Interruptor principal de toda a funcionalidade, predefinição true. É combinado com "está configurada uma base de dados" e "a migração foi executada": false faz com que todas as rotas /v1/files e /v1/vector_stores respondam 503 file_search_unavailable. O worker de ingestão (que também executa a reincorporação) e os dois varredores só o verificam no arranque, pelo que, depois de o alterar, deve reiniciar o gateway. Os ficheiros e stores já armazenados não são tocados.
schema.capabilities.file_search.embedding_model.label=Modelo de embedding
schema.capabilities.file_search.embedding_model.description=Modelo de embedding pedido à implementação de orquestração do SAP AI Core e registado em cada evento do registo teacher. Predefinição text-embedding-3-large. Cada vector store mantém o modelo com que foi criado: as suas pesquisas e os seus novos ficheiros usam esse modelo, pelo que alterar esta definição não afeta os stores existentes. Aparecem como desatualizados no cockpit de Grounding, onde o proprietário ou um administrador os pode voltar a incorporar com o novo modelo; até lá, continuam a responder com os vetores antigos. Um modelo com outra largura de vetor exige também alterar embedding_dimensions, e voltar a incorporar não pode alterar a largura de um store.
schema.capabilities.file_search.embedding_dimensions.label=Dimensões do embedding
schema.capabilities.file_search.embedding_dimensions.description=Largura dos vetores, enviada como parâmetro dimensions do modelo de embedding e usada para criar a coluna de vetores. Predefinição 1536, e fixa assim que existe um store: um vetor de resposta com qualquer outro comprimento é recusado, e todos os stores fixados na largura antiga respondem 409 - tanto a uma PESQUISA como a uma anexação, pelo que deixam de responder a consultas e nunca mais podem receber outro ficheiro. Continuam a poder ser listados, obtidos e eliminados. Alterar isto numa implementação com dados deixa, portanto, os seus stores abandonados em vez de os migrar: voltar a incorporar a partir do cockpit de Grounding mantém a largura de um store, pelo que um store assim tem de ser migrado por um operador.
schema.capabilities.file_search.rewrite_query.label=Reescrever consulta
schema.capabilities.file_search.rewrite_query.description=Indica se POST /v1/vector_stores/{id}/search reescreve a consulta do chamador através da implementação de orquestração antes de gerar o embedding. Predefinição false. Custa cerca de 1.3s por pesquisa e é feito na medida do possível - uma reescrita falhada recorre à consulta original e nunca faz falhar a pesquisa. Só esse caminho REST lê este valor, um rewrite_query por pedido substitui-o, e a FERRAMENTA alojada file_search passa sempre false, porque o modelo já transformou o turno do utilizador numa consulta.
schema.capabilities.file_search.rewrite_query_model.label=Modelo de reescrita da consulta
schema.capabilities.file_search.rewrite_query_model.description=Modelo usado na chamada de reescrita, predefinição gpt-5-mini. Configurável em vez de fixo, porque um nome de modelo válido num tenant do SAP AI Core pode ser rejeitado por outro. Só é consultado quando rewrite_query está ativo.
schema.capabilities.file_search.hybrid.label=Híbrido
schema.capabilities.file_search.hybrid.description=Recall da fase 1 e a reclassificação opcional da fase 2. A fase 1 executa uma classificação por semelhança vetorial e - quando lexical_enabled - uma classificação de texto integral, funde as duas com reciprocal rank fusion e entrega os `candidates` melhores chunks ao reclassificador.
schema.capabilities.file_search.hybrid.rrf_k.label=k RRF
schema.capabilities.file_search.hybrid.rrf_k.description=Constante da reciprocal rank fusion: cada classificação contribui com 1/(k + rank) para a pontuação fundida de um chunk. Predefinição 60. Um k maior atenua a diferença entre posições vizinhas, pelo que a concordância entre as duas classificações conta mais do que o melhor resultado próprio de cada uma; um menor deixa o topo de cada classificação dominar. Registado em cada evento do registo teacher, pelo que uma alteração é visível nas etiquetas.
schema.capabilities.file_search.hybrid.lexical_enabled.label=Lexical ativado
schema.capabilities.file_search.hybrid.lexical_enabled.description=Indica se a classificação de texto integral é executada ao lado da classificação vetorial. Predefinição true. False funde apenas a classificação vetorial, pelo que as correspondências exatas de palavras-chave e identificadores que os embeddings falham deixam de ser recuperadas.
schema.capabilities.file_search.hybrid.lexical_query.label=Consulta lexical
schema.capabilities.file_search.hybrid.lexical_query.description=Como a classificação de texto integral compara a consulta. "any" (predefinição) mantém as palavras da consulta que não são palavras vazias comuns em inglês ou alemão nem um único carácter (uma letra ou um dígito isolados) e encontra um chunk que contenha pelo menos uma delas, pelo que uma pergunta escrita como frase continua a encontrar chunks com os seus termos-chave; os chunks com mais desses termos ficam mais acima. "all" só encontra chunks que contêm todas as palavras da consulta, palavras vazias incluídas - o comportamento das versões anteriores, que uma pergunta em linguagem natural raramente cumpre. Só se aplica enquanto lexical_enabled for true.
schema.capabilities.file_search.hybrid.candidates.label=Candidatos
schema.capabilities.file_search.hybrid.candidates.description=Quantos chunks fundidos a fase 1 recupera, predefinição 50. É o tamanho de entrada do reclassificador e, portanto, o seu custo por pesquisa, e é também um limite rígido para a resposta: o max_num_results do chamador é aplicado depois, pelo que nenhuma pesquisa pode devolver mais chunks do que este número.
schema.capabilities.file_search.hybrid.rerank.label=Reclassificação
schema.capabilities.file_search.hybrid.rerank.description=Fase 2: um cross-encoder Cohere alojado no SAP AI Core pontua os candidatos da fase 1 face à consulta e devolve uma pontuação de relevância calibrada entre 0 e 1 - a pontuação que ranking_options.score_threshold filtra.
schema.capabilities.file_search.hybrid.rerank.enabled.label=Ativado
schema.capabilities.file_search.hybrid.rerank.enabled.description=Tem três estados, e os três valores não são graus da mesma coisa. false nunca reclassifica: nenhuma procura de implementação, nenhuma chamada, e os resultados mantêm a ordem fundida. "auto" (a predefinição) é feito na medida do possível - a falta de uma implementação de reclassificador em execução, ou uma chamada falhada, expirada ou malformada, recorre à ordem fundida em vez de fazer falhar a pesquisa. true EXIGE a fase 2: tanto "no deployment found" como "the call failed" fazem, em vez disso, falhar a pesquisa, pelo que um operador que pediu reclassificação nunca recebe silenciosamente resultados não reclassificados.
schema.capabilities.file_search.hybrid.rerank.model.label=Modelo
schema.capabilities.file_search.hybrid.rerank.model.description=O nome de modelo usado tanto para encontrar a implementação do reclassificador - a primeira implementação no estado RUNNING do cenário foundation-models que serve um modelo com exatamente este nome - como na chamada de reclassificação. Predefinição "cohere-reranker" - verificado em direto contra o tenant, e NÃO o "cohere-reranker-35" publicado pela SAP. Não é uma escolha de fornecedor: o gateway fala exatamente um protocolo de reclassificação e só o nome do modelo varia, razão pela qual o registo teacher regista sempre o fornecedor como "cohere".
schema.capabilities.file_search.hybrid.rerank.input.label=Entrada
schema.capabilities.file_search.hybrid.rerank.input.description=O que o reclassificador lê para cada chunk candidato. "context_and_text" (a predefinição): o contexto do chunk, quando o tem, seguido do seu texto; os chunks sem contexto (segmentação estática) são lidos como o seu texto. "text": apenas o texto do chunk. O contexto nunca aparece nos resultados de pesquisa.
schema.capabilities.file_search.ann.label=Pesquisa aproximada
schema.capabilities.file_search.ann.description=Pesquisa vetorial aproximada para vector stores grandes, através do índice HNSW. Desativada por predefinição: a classificação vetorial compara então a consulta com cada chunk dos stores pesquisados, o que é exato mas demora mais quanto maiores forem os stores. Quando ativada, uma pesquisa usa o índice apenas onde compensa e mantém-se exata nos restantes casos: com um filtro de atributos, quando pesquisa no máximo exact_max_chunks chunks ou menos de min_fraction de todos os chunks armazenados, enquanto o índice ainda não for do tipo que o comando rebuild-index constrói, e com pgvector anterior a 0.8. Em algumas perguntas, a pesquisa aproximada pode devolver uma lista completa de passagens que falha a maioria dos chunks mais relevantes, por isso meça o seu recall com os seus próprios dados com a sonda de recall antes de a ativar.
schema.capabilities.file_search.ann.enabled.label=Ativado
schema.capabilities.file_search.ann.enabled.description=Se as pesquisas sobre stores grandes usam o índice HNSW. Predefinição false: todas as pesquisas são exatas. Quando o índice devolve menos chunks do que os pedidos, a pesquisa é executada de forma exata.
schema.capabilities.file_search.ann.exact_max_chunks.label=Máx. de chunks para pesquisa exata
schema.capabilities.file_search.ann.exact_max_chunks.description=Uma pesquisa sobre no máximo este número de chunks mantém-se exata, contados nos stores que pesquisa com um mesmo modelo de embedding. Predefinição 20000. O mesmo número decide, esteja ou não ativada a pesquisa aproximada, quando a parte de texto integral de uma pesquisa é limitada: uma pesquisa sobre mais chunks deixa de fora da sua consulta de qualquer palavra as palavras que mais de 5 por cento de todos os chunks armazenados contêm, e classifica as passagens com todas as palavras mais, no máximo, outras 5000 correspondências de texto integral. Numa tabela analisada, 0 limita a parte de texto integral de todas as pesquisas.
schema.capabilities.file_search.ann.min_fraction.label=Fração mínima
schema.capabilities.file_search.ann.min_fraction.description=Uma pesquisa sobre menos desta proporção de todos os chunks armazenados mantém-se exata: aí a pesquisa exata é mais rápida do que o índice. Predefinição 0.05 (5 por cento).
schema.capabilities.file_search.chunking.label=Segmentação
schema.capabilities.file_search.chunking.description=Como os documentos de um vector store NOVO são divididos em chunks. Um store assume estes valores quando é criado e mantém-nos: alterá-los aqui nunca volta a dividir nem altera um store existente. A configuração fornecida define "structure" com 800 tokens sem sobreposição, com contextos. Uma chave não definida significa o que este formulário mostra para ela: segmentação estática sem contextos, pelo que uma configuração de uma versão anterior, ou uma sem este bloco, mantém a segmentação estática. Os stores criados antes de esta definição existir usam segmentação estática de 800/400. Um ficheiro anexado com uma chunking_strategy estática explícita é dividido com essa estratégia; "auto" ou nenhuma usa a definição do store. Os valores são verificados quando um store é criado: chunk_overlap_tokens não pode exceder metade de max_chunk_size_tokens, e contextual requer a estratégia "structure". Se a definição for inválida, os novos stores recebem em vez disso segmentação estática de 800/400 e o gateway regista um aviso.
schema.capabilities.file_search.chunking.strategy.label=Estratégia
schema.capabilities.file_search.chunking.strategy.description="static" (a predefinição se não for definido) divide o texto em janelas sobrepostas de tamanho fixo, como a estratégia estática da OpenAI e as versões anteriores. "structure" (definido na configuração fornecida) segue as secções e os títulos do documento, para que um chunk não atravesse o limite de uma secção; os ficheiros divididos assim indicam o tipo de estratégia de segmentação "other" através da API da OpenAI. Ativar contextual requer "structure".
schema.capabilities.file_search.chunking.max_chunk_size_tokens.label=Tamanho máx. de chunk em tokens
schema.capabilities.file_search.chunking.max_chunk_size_tokens.description=Maior chunk, em tokens, entre 100 e 4096. Predefinição 800. Com "static" o tamanho é uma estimativa (número de palavras vezes 1.3); com "structure" é contado com um tokenizador real.
schema.capabilities.file_search.chunking.chunk_overlap_tokens.label=Sobreposição de chunks em tokens
schema.capabilities.file_search.chunking.chunk_overlap_tokens.description=Quantos tokens cada chunk repete do seu antecessor, para que uma passagem dividida por um limite seja ainda recuperada por inteiro. Se não for definido: 0 com "structure", 400 com "static". Não pode exceder metade de max_chunk_size_tokens. Com "structure" a sobreposição só se aplica dentro de uma secção que precisa de mais de um chunk.
schema.capabilities.file_search.chunking.contextual.label=Contextual
schema.capabilities.file_search.chunking.contextual.description=Se cada chunk recebe também um contexto curto, escrito por um modelo de linguagem, que o situa no seu documento e é pesquisado com ele. Desativado se não for definido. Requer a estratégia "structure"; acrescenta uma chamada ao modelo por chunk durante a ingestão, registada como utilização do proprietário do store.
schema.capabilities.file_search.contextual.label=Contextos dos chunks
schema.capabilities.file_search.contextual.description=Como são escritos os contextos dos chunks para os vector stores cuja definição de segmentação é contextual: durante a ingestão, um modelo de linguagem escreve um contexto curto para cada chunk, que é pesquisado juntamente com o chunk. Estes valores não ativam a segmentação contextual; quem o faz é a definição de segmentação do store. Uma chamada falhada ou expirada deixa esse chunk sem contexto e nunca faz falhar o ficheiro.
schema.capabilities.file_search.contextual.model.label=Modelo
schema.capabilities.file_search.contextual.model.description=O modelo de orquestração do SAP AI Core que escreve os contextos. Predefinição "gemini-3.5-flash-lite". Se o modelo não estiver disponível, os ficheiros são ingeridos sem contextos. O documento é enviado com cada chunk de um ficheiro; os modelos Claude guardam-no em cache entre estas chamadas, os outros modelos fazem-no onde o fazem por si.
schema.capabilities.file_search.contextual.max_document_tokens.label=Tamanho máx. de documento em tokens
schema.capabilities.file_search.contextual.max_document_tokens.description=Maior documento, em tokens, enviado por inteiro com cada chunk, entre 8192 e 200000. Predefinição 32000. Um documento mais longo é enviado como um excerto deste tamanho em torno do chunk. Valores maiores dão a cada contexto mais do documento, mas custam mais tokens de entrada por chunk.
schema.capabilities.file_search.contextual.concurrency.label=Concorrência
schema.capabilities.file_search.contextual.concurrency.description=Quantas chamadas de contexto de um ficheiro são executadas ao mesmo tempo, entre 1 e 16. Predefinição 4. O primeiro chunk de um ficheiro é sempre executado sozinho.
schema.capabilities.file_search.contextual.request_timeout_ms.label=Tempo limite do pedido (ms)
schema.capabilities.file_search.contextual.request_timeout_ms.description=Limite de tempo de uma chamada de contexto, em milissegundos. Predefinição 30000. Uma chamada que demore mais deixa o seu chunk sem contexto.
schema.capabilities.file_search.contextual.file_deadline_ms.label=Prazo por ficheiro (ms)
schema.capabilities.file_search.contextual.file_deadline_ms.description=Tempo, em milissegundos, após o qual não começa mais nenhuma chamada de contexto para um ficheiro. Predefinição 360000 (6 minutos). Os chunks restantes são guardados sem contexto; o ficheiro é ingerido na mesma.
schema.capabilities.file_search.contextual.max_input_tokens_per_file.label=Máx. de tokens de entrada por ficheiro
schema.capabilities.file_search.contextual.max_input_tokens_per_file.description=Tokens de entrada que as chamadas de contexto de um ficheiro podem usar, incluindo tokens em cache, entre 10000 e 1000000000. Predefinição 20000000. Quando um ficheiro os tiver usado, não começa mais nenhuma chamada de contexto para ele; os chunks restantes são guardados sem contexto e o ficheiro é ingerido na mesma.
schema.capabilities.file_search.parent_sections.label=Secções superiores
schema.capabilities.file_search.parent_sections.description=Como os resultados de pesquisa dos vector stores com segmentação por estrutura são alargados à secção de onde provêm, para que o modelo leia uma correspondência no seu contexto. Várias correspondências numa secção são devolvidas uma só vez, como essa secção. Os resultados de stores com segmentação estática são devolvidos tal como estão.
schema.capabilities.file_search.parent_sections.max_tokens.label=Máx. de tokens
schema.capabilities.file_search.parent_sections.max_tokens.description=Maior secção superior devolvida, em tokens, entre 200 e 8000. Predefinição 1500. Uma secção mais longa é devolvida como um excerto deste tamanho em torno da correspondência; uma correspondência que, por si só, é mais longa é devolvida sozinha.
schema.capabilities.file_search.parent_sections.scope.label=Âmbito
schema.capabilities.file_search.parent_sections.scope.description=Onde os resultados são devolvidos como secções superiores: "tool" (a predefinição) apenas na ferramenta file_search da API Responses; "all" também no endpoint de pesquisa dos vector stores, que de outro modo devolve os chunks correspondentes; "off" em lado nenhum.
schema.capabilities.file_search.limits.label=Limites
schema.capabilities.file_search.limits.description=Limites rígidos para o que pode ser carregado, extraído e anexado. Cada um é imposto onde se aplica e não por este esquema, pelo que estes valores são lidos em direto e entram em vigor sem reinício.
schema.capabilities.file_search.limits.max_file_bytes.label=Tamanho máx. de ficheiro em bytes
schema.capabilities.file_search.limits.max_file_bytes.description=Maior carregamento que POST /v1/files aceita, predefinição 33554432 bytes (32 MiB). Imposto ENQUANTO o carregamento é lido e não depois, pelo que um corpo demasiado grande é cortado em vez de ser colocado em memória, e o chamador recebe um 4xx limpo que indica o limite.
schema.capabilities.file_search.limits.max_tokens_per_file.label=Máx. de tokens por ficheiro
schema.capabilities.file_search.limits.max_tokens_per_file.description=Maior documento extraído, em tokens estimados; predefinição 5000000. Um ficheiro acima do limite falha DEFINITIVAMENTE em vez de ser repetido. Baixar este valor não volta a verificar ficheiros já ingeridos.
schema.capabilities.file_search.limits.max_files_per_store.label=Máx. de ficheiros por repositório vetorial
schema.capabilities.file_search.limits.max_files_per_store.description=Limite de ficheiros anexados a um vector store, predefinição 10000. Limita os file_ids aceites quando um store é criado - a par de um limite rígido de 500 IDs de ficheiro por chamada de criação ou de lote de ficheiros - e recusa uma anexação ou um lote de ficheiros que levaria o store a ultrapassá-lo.
schema.capabilities.file_search.ingestion.label=Ingestão
schema.capabilities.file_search.ingestion.description=O worker em segundo plano que extrai, divide em chunks, gera embeddings e armazena um ficheiro anexado, e reincorpora os ficheiros de um store cujo modelo de embedding está a ser alterado - primeiro os carregamentos. Obtém trabalho do mesmo pool de base de dados file_search que o caminho de pesquisa usa, pelo que estes parâmetros equilibram o débito de ingestão com a latência da pesquisa.
schema.capabilities.file_search.ingestion.concurrency.label=Concorrência
schema.capabilities.file_search.ingestion.concurrency.description=Quantos ciclos de reclamar-e-processar o worker inicia, predefinição 4; os mesmos ciclos executam também a reincorporação. Cada um obtém ligações do pool file_search de 10 ligações para os seus passos de base de dados. Lido uma vez no arranque, pelo que uma alteração exige reinício.
schema.capabilities.file_search.ingestion.extract_timeout_ms.label=Tempo limite de extração (ms)
schema.capabilities.file_search.ingestion.extract_timeout_ms.description=Limite de tempo para converter um documento em texto com um conversor externo - PDF, docx, odt, epub e rst -, predefinição 60000 ms. Os formatos de texto simples são descodificados diretamente e não têm limite. Um tempo esgotado faz falhar essa tentativa e não o lote; o ficheiro é repetido até max_retries vezes.
schema.capabilities.file_search.ingestion.max_retries.label=Máx. de tentativas
schema.capabilities.file_search.ingestion.max_retries.description=Tentativas por ficheiro antes de ser dado como falhado, predefinição 3; o mesmo orçamento aplica-se a cada ficheiro de uma reincorporação. Um inteiro igual ou superior a 1 é usado tal como está escrito. 0 é lido como 1, com um aviso - tomado à letra, faria falhar cada ficheiro anexado antes da sua primeira tentativa. Qualquer outro valor - negativo, fracionário, não numérico - conta como não definido e recorre a 3, também com um aviso.
schema.capabilities.file_search.parsing.label=Análise de documentos
schema.capabilities.file_search.parsing.description=Como os documentos enviados são lidos antes de serem divididos em blocos.
schema.capabilities.file_search.parsing.ocr.label=Reconhecimento de texto (OCR)
schema.capabilities.file_search.parsing.ocr.description=Reconhecimento de texto para páginas PDF sem camada de texto, como digitalizações. É executado onde o programa tesseract está instalado (as imagens Docker e Kyma o incluem com inglês); a CLI npm independente nunca o executa.
schema.capabilities.file_search.parsing.ocr.languages.label=Idiomas de OCR
schema.capabilities.file_search.parsing.ocr.languages.description=Códigos de idioma do Tesseract reconhecidos em uma página, como eng, deu ou chi_sim; padrão eng. Um código precisa que seus dados de idioma estejam instalados onde o gateway é executado; um código não instalado é ignorado com um aviso no log do gateway. Cada idioma adicionado torna o OCR mais lento.
schema.capabilities.file_search.parsing.vision.label=Transcrição por visão
schema.capabilities.file_search.parsing.vision.description=Transcrição de páginas PDF difíceis por um modelo de visão do SAP AI Core: uma página é enviada como imagem e o modelo escreve o seu texto, tabelas incluídas. Só é executada para os vector stores cuja definição de segmentação tem um modo de visão (desativado por predefinição; alterar o modo de um store volta a segmentá-lo). Cada página é uma chamada ao modelo, registada como utilização do proprietário do store; uma página cuja chamada falha mantém o seu texto ou passa para o reconhecimento de texto (OCR). As imagens das páginas não são mascaradas: onde a pseudonimização é imposta para o conteúdo de file_search (para o endpoint openai ou para um modelo), chegam ao modelo sem mascaramento, e o cockpit e o registo do gateway avisam disso. O mascaramento que um único pedido solicita (uma palavra-chave ou um campo de mascaramento) não é previsível e não é avisado. A CLI npm independente nunca a executa.
schema.capabilities.file_search.parsing.vision.model.label=Modelo
schema.capabilities.file_search.parsing.vision.model.description=O modelo de orquestração do SAP AI Core que transcreve as páginas; tem de ler imagens. Predefinição "gemini-3.5-flash-lite". Se o modelo não estiver disponível, nenhum vector store pode passar para um modo de visão.
schema.capabilities.file_search.parsing.vision.default_mode.label=Modo predefinido
schema.capabilities.file_search.parsing.vision.default_mode.description=O modo de visão que os novos vector stores recebem: off (a predefinição, sem chamadas de visão), no_text (páginas sem camada de texto, como digitalizações), auto (essas, páginas com pouco texto como figuras e páginas com muitas tabelas) ou all (todas as páginas). Os stores existentes mantêm o seu próprio modo. Onde a pseudonimização é imposta para o conteúdo de file_search, as imagens das páginas chegam ao modelo sem mascaramento (é mostrado um aviso); o mesmo acontece, sem aviso, com o mascaramento que um único pedido solicita.
schema.capabilities.file_search.parsing.vision.max_pages_per_file.label=Máx. de páginas por ficheiro
schema.capabilities.file_search.parsing.vision.max_pages_per_file.description=Número máximo de páginas de um ficheiro enviadas ao modelo, entre 1 e 1000. Predefinição 50. As páginas restantes mantêm o seu texto ou passam para o reconhecimento de texto (OCR).
schema.capabilities.file_search.parsing.vision.concurrency.label=Concorrência
schema.capabilities.file_search.parsing.vision.concurrency.description=Quantas páginas de um ficheiro são transcritas ao mesmo tempo, entre 1 e 8. Predefinição 2.
schema.capabilities.file_search.parsing.vision.request_timeout_ms.label=Tempo limite do pedido (ms)
schema.capabilities.file_search.parsing.vision.request_timeout_ms.description=Tempo limite da chamada de uma página, em milissegundos. Predefinição 90000. Uma página cuja chamada demora mais mantém o seu texto ou passa para o reconhecimento de texto (OCR).
schema.capabilities.file_search.parsing.vision.file_deadline_ms.label=Prazo por ficheiro (ms)
schema.capabilities.file_search.parsing.vision.file_deadline_ms.description=Tempo máximo, em milissegundos, que a visão pode gastar num ficheiro, e no máximo 40 % do tempo restante para a ingestão do ficheiro. Predefinição 240000 (4 minutos). Depois disso não começa mais nenhuma página; o ficheiro é ingerido na mesma.
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.label=Máx. de tokens de entrada por ficheiro
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.description=Tokens de entrada que as chamadas de um ficheiro podem usar, entre 10000 e 100000000. Predefinição 150000 (uma página usa cerca de 1250). Quando um ficheiro os tiver usado, não começa mais nenhuma página para ele.
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.label=Máx. de tokens de saída por ficheiro
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.description=Tokens de saída que as chamadas de um ficheiro podem usar, entre 10000 e 100000000. Predefinição 120000. Quando um ficheiro os tiver usado, não começa mais nenhuma página para ele.
schema.capabilities.file_search.blob_storage.label=Armazenamento de blobs
schema.capabilities.file_search.blob_storage.description=Onde ficam os bytes brutos carregados. O conteúdo é endereçado pelo seu hash sha256 e tem contagem de referências, pelo que dois carregamentos de conteúdo idêntico armazenam uma única cópia. A definição é lida de novo em cada acesso, pelo que uma alteração entra em vigor sem reinício.
schema.capabilities.file_search.blob_storage.backend.label=Back-end
schema.capabilities.file_search.blob_storage.backend.description=Onde os NOVOS carregamentos são armazenados. "db", a predefinição, mantém os bytes na base de dados Postgres do file_search. "s3" escreve-os como objetos no bucket configurado abaixo (AWS ou um endpoint compatível com S3) e guarda na base de dados apenas a sua chave. Mudar não move nada: cada blob é lido do armazenamento onde foi escrito, pelo que os blobs existentes continuam legíveis enquanto esse armazenamento estiver acessível, e uma migração a partir do painel Armazenamento de blobs da Administração do Grounding move-os. "local" não é suportado: todo carregamento responde então 503 file_search_unavailable.
schema.capabilities.file_search.blob_storage.local_path.label=Caminho local
schema.capabilities.file_search.blob_storage.local_path.description=Raiz do sistema de ficheiros reservada a um back-end "local", predefinição /var/lib/sail-proxy/blobs. O gateway não suporta "local" (ver backend), pelo que este valor não é lido.
schema.capabilities.file_search.blob_storage.s3.label=S3
schema.capabilities.file_search.blob_storage.s3.description=Coordenadas do bucket para o back-end "s3". As credenciais não são configuradas aqui: provêm das variáveis de ambiente FILE_SEARCH_S3_ACCESS_KEY_ID e FILE_SEARCH_S3_SECRET_ACCESS_KEY do gateway. Lido em cada acesso a um blob armazenado no S3 - também quando backend é "db" e ainda há blobs no S3 - e por uma migração para ou a partir do S3. Alterar o bucket, o endpoint ou o prefixo não move nenhum objeto: os blobs escritos com os valores anteriores não podem ser lidos até esses valores serem repostos.
schema.capabilities.file_search.blob_storage.s3.bucket.label=Bucket
schema.capabilities.file_search.blob_storage.s3.bucket.description=Nome do bucket. Forma o anfitrião <bucket>.s3.<region>.amazonaws.com, ou o caminho /<bucket>/<key> quando endpoint está definido. É fornecido vazio: até ser definido, um carregamento com backend "s3" responde 503 e uma migração para o S3 é recusada.
schema.capabilities.file_search.blob_storage.s3.prefix.label=Prefixo
schema.capabilities.file_search.blob_storage.s3.prefix.description=Prefixo de chave sob o qual cada blob é armazenado, predefinição sail-proxy/blobs, para que um bucket possa conter blobs ao lado de objetos não relacionados. Segmentos de caminho de letras, dígitos, ".", "_" e "-", separados por "/". O gateway só lê, escreve e elimina chaves sob este prefixo e nunca lista o bucket. Cada base de dados do file_search precisa do seu próprio prefixo (ou bucket): as chaves derivam do conteúdo dos ficheiros, por isso duas instalações que partilham um prefixo partilham objetos, e uma elimina objetos que a outra ainda usa.
schema.capabilities.file_search.blob_storage.s3.endpoint.label=Ponto de extremidade
schema.capabilities.file_search.blob_storage.s3.endpoint.description=Ponto de extremidade S3 fora da AWS - MinIO, Ceph ou outro gateway compatível com S3. Quando definido, os pedidos vão para <endpoint>/<bucket>/<key> em vez da forma de anfitrião da AWS. Vazio, a predefinição, significa AWS.
schema.capabilities.file_search.blob_storage.s3.region.label=Região
schema.capabilities.file_search.blob_storage.s3.region.description=Região de assinatura SigV4 e parte do nome do anfitrião quando não está definido nenhum endpoint. É fornecida vazia e continua a ser obrigatória para assinar perante um endpoint compatível com S3.
schema.capabilities.file_search.teacher_logging.label=Registo do modelo professor
schema.capabilities.file_search.teacher_logging.description=Regista os candidatos de cada pesquisa e as pontuações do reclassificador como etiquetas teacher, para avaliação e destilação do reclassificador. Fire-and-forget por construção: nada espera pela escrita, e cada falha surge apenas como aviso. Os cinco campos são lidos em direto no caminho de pesquisa, pelo que podem ser alterados a partir deste cockpit sem reinício.
schema.capabilities.file_search.teacher_logging.enabled.label=Ativado
schema.capabilities.file_search.teacher_logging.enabled.description=Indica se os eventos de pesquisa são de todo escritos. Desativado por predefinição, para que uma instalação anterior a esta chave nunca comece a escrever linhas. Deliberadamente independente de store_chunk_text: ativar o registo nunca pode, por si só, começar a guardar o conteúdo dos documentos.
schema.capabilities.file_search.teacher_logging.store_chunk_text.label=Guardar o texto dos chunks
schema.capabilities.file_search.teacher_logging.store_chunk_text.description=Indica se o TEXTO do chunk de cada candidato é armazenado ao lado do seu hash; desativado por predefinição, ficando o texto vazio caso contrário. Esse texto é conteúdo de documentos de utilizadores, pelo que isto transforma as tabelas de etiquetas numa segunda cópia do corpus - o hash por si só basta para voltar a associar as etiquetas aos chunks que ainda existem.
schema.capabilities.file_search.teacher_logging.sample_rate.label=Taxa de amostragem
schema.capabilities.file_search.teacher_logging.sample_rate.description=Probabilidade de uma pesquisa ser registada, de 0 a 1; predefinição 1.0. 1 regista todas as pesquisas, 0 nenhuma, 0.1 cerca de uma em cada dez. É este o parâmetro a baixar quando o volume de etiquetas é um problema - não max_concurrent_writes, que descarta escritas em vez de as reduzir.
schema.capabilities.file_search.teacher_logging.source.label=Origem
schema.capabilities.file_search.teacher_logging.source.description=Etiqueta de texto livre escrita em cada evento de pesquisa, usada sempre que o chamador não indica nenhuma. Predefinição "production", para que uma execução de avaliação ou de preenchimento retroativo possa ser distinguida do tráfego de produção quando as etiquetas forem lidas.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.label=Máx. de escritas simultâneas
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.description=Limite de escritas de etiquetas teacher em curso, predefinição 2; as escritas em excesso são descartadas, não colocadas em fila. Limitado ao tamanho do pool de base de dados file_search, 10: acima disso o limite deixa de limitar o que quer que seja, porque as escritas adicionais ficam simplesmente à espera na própria fila do pool - transformando "descartadas, não colocadas em fila" em "colocadas em fila", exatamente a falha que o limite existe para evitar. Um valor maior é reduzido ao limite com um aviso, pelo que um api_config.json editado à mão também não o pode aumentar.
schema.capabilities.file_search.tool.label=Ferramenta
schema.capabilities.file_search.tool.description=O bloco da FERRAMENTA alojada file_search - a ferramenta que o próprio modelo chama - por oposição ao caminho REST em bruto POST /v1/vector_stores/{id}/search que as definições acima regem. Cada campo é verificado na leitura e recorre à sua predefinição em vez de ser convertido, porque um api_config.json editado à mão chega ao gateway sem validação.
schema.capabilities.file_search.tool.enabled.label=Ativado
schema.capabilities.file_search.tool.enabled.description=Lido como booleano estrito, predefinição true - um "true" ou 1 escrito à mão não é lido como true e recorre à predefinição. Atualmente ignorado pelo gateway: nada depende do valor resolvido e a ferramenta é oferecida de qualquer forma, pelo que defini-lo como false não oculta a ferramenta. Use file_search.enabled para desligar a funcionalidade.
schema.capabilities.file_search.tool.max_searches_per_request.label=Máx. de pesquisas por pedido
schema.capabilities.file_search.tool.max_searches_per_request.description=Quantas chamadas file_search um pedido pode fazer antes de o gateway deixar de continuar o turno. Um inteiro de 1 a 10 é respeitado; qualquer outro valor - fora do intervalo, fracionário, não numérico - conta como não definido e recorre a 3 com um aviso, pelo que um valor fora do intervalo aqui não é, silenciosamente, o valor que se aplica.
schema.capabilities.file_search.tool.max_num_results_default.label=Número máx. de resultados predefinido
schema.capabilities.file_search.tool.max_num_results_default.description=Chunks devolvidos quando uma chamada de ferramenta não indica um max_num_results próprio. Um inteiro de 1 a 50 é respeitado, qualquer outro valor recorre a 10. Esse intervalo é o mesmo limite com que é verificado um max_num_results por chamada, e o próprio limite da OpenAI para o campo. hybrid.candidates continua a ser o limite rígido do que uma pesquisa pode devolver.
schema.capabilities.hosted_tools.label=Ferramentas alojadas
schema.capabilities.hosted_tools.description=Limites da cache de repetição de resultados de ferramentas alojadas: durante quanto tempo um resultado continua repetível e quantos são mantidos em simultâneo.
schema.capabilities.hosted_tools.result_cache_ttl_seconds.label=TTL da cache de resultados em segundos
schema.capabilities.hosted_tools.result_cache_ttl_seconds.description=Opcional. Durante quanto tempo os resultados de uma ferramenta alojada continuam repetíveis por um cliente que repete o item de chamada. Um valor não inteiro ou fora do intervalo recorre à predefinição de 3600 segundos, tal como se não estivesse definido. Uma falha de cache volta a executar a consulta registada em vez de degradar a resposta.
schema.capabilities.hosted_tools.result_cache_max_entries.label=Máx. de entradas da cache de resultados
schema.capabilities.hosted_tools.result_cache_max_entries.description=Opcional. Quantos resultados de ferramentas alojadas são mantidos em simultâneo na cache de repetição. Um valor não inteiro ou fora do intervalo recorre à predefinição de 500 entradas, tal como se não estivesse definido. Uma falha de cache volta a executar a consulta registada em vez de degradar a resposta.
schema.capabilities.namespace_tools.label=Ferramentas de namespace
schema.capabilities.namespace_tools.description=Como tratar a ferramenta de encapsulamento de subagente `namespace` do Codex, que o SAP AI Core rejeita liminarmente com um 400.
schema.capabilities.namespace_tools.mode.label=Modo
schema.capabilities.namespace_tools.mode.description=`flatten` (predefinição) eleva as ferramentas de função aninhadas de uma ferramenta namespace para o nível superior, para que o pedido seja aceite, e depois repõe o namespace nas chamadas repetidas para que o Codex as possa continuar a encaminhar. `strip` remove totalmente a ferramenta namespace e as suas ferramentas aninhadas. Qualquer valor diferente destes dois recorre a flatten - a alternativa é um 400 definitivo que termina o turno.
schema.capabilities.custom_tools.label=Ferramentas personalizadas
schema.capabilities.custom_tools.description=Ferramentas `custom` de forma livre do Codex (apply_patch). `translate` reescreve-as como ferramentas de função, que as rotas de implementação e de orquestração aceitam; `strip` remove-as, deixando o modelo editar ficheiros através de comandos de shell.
schema.capabilities.custom_tools.mode.label=Modo
schema.capabilities.custom_tools.mode.description=`translate` (predefinição) reescreve a ferramenta custom de forma livre como uma ferramenta de função comum que ambas as rotas aceitam, acrescentando à sua descrição orientações de gramática/formato, uma vez que uma ferramenta de função não consegue exprimir uma gramática Lark como uma ferramenta custom consegue. `strip` remove totalmente as ferramentas custom, deixando o modelo editar ficheiros através de comandos de shell. Qualquer valor diferente destes dois recorre a translate - a alternativa é um 400 definitivo que termina o turno.
schema.capabilities.tool_search.label=Pesquisa de ferramentas
schema.capabilities.tool_search.description=A ferramenta `tool_search` do Codex para descoberta de ferramentas diferidas. `translate` reescreve-a como ferramenta de função, que as rotas de implementação e de orquestração aceitam; `strip` remove-a, deixando o modelo incapaz de descobrir ferramentas diferidas, como servidores MCP.
schema.capabilities.tool_search.mode.label=Modo
schema.capabilities.tool_search.mode.description=`translate` (predefinição) reescreve a ferramenta tool_search como uma ferramenta de função comum que ambas as rotas aceitam. `strip` remove-a totalmente. Qualquer valor diferente destes dois recorre a translate - a alternativa é um 400 definitivo que termina o turno.
schema.capabilities.tool_search.hoist_discovered_tools.label=Elevar ferramentas descobertas
schema.capabilities.tool_search.hoist_discovered_tools.description=Eleva para o pedido as ferramentas descobertas por tool_search, para que o modelo as possa chamar. Contorna o facto de o codex só expor ferramentas MCP diferidas quando a base_url do fornecedor é api.openai.com; defina false quando isso for corrigido a montante. Pode ficar ativado sem problemas em qualquer caso - os nomes que o cliente já declara são ignorados.
schema.hooks.label=Hooks
schema.hooks.definitions.label=Definições
schema.hooks.definitions.description=As regras de correspondência nomeadas que o request.match de um hook pode indicar, tendo como chave o ID da regra - a chave É o ID. Todas as regras que um hook lista têm de corresponder para que esse hook seja acionado, e um ID de regra não definido aqui regista um aviso e faz com que o hook não corresponda a nada. As regras são colocadas em cache por ID na primeira utilização, pelo que uma edição entra em vigor no próximo recarregamento da configuração e não a meio do processo.
schema.hooks.definitions._entry.type.label=Tipo
schema.hooks.definitions._entry.type.description=Que parte do pedido a regra testa e, portanto, quais dos campos abaixo se aplicam. Determinante e não descritivo: apenas estes quatro valores são compreendidos, e qualquer outro é registado como tipo de hook desconhecido e não corresponde a NADA - desativando silenciosamente todos os hooks que indicam a regra.
schema.hooks.definitions._entry.name.label=Nome
schema.hooks.definitions._entry.name.description=O cabeçalho do pedido que uma regra 'header' lê. Sem distinguir maiúsculas de minúsculas: o nome é convertido em minúsculas antes da procura, tal como o pipeline de pedidos normaliza os nomes dos cabeçalhos. Um pedido que não contenha o cabeçalho nunca corresponde. Vazio não significa 'qualquer cabeçalho' - tal regra nunca poderia ser acionada -, pelo que é rejeitado aqui em vez de aceite.
schema.hooks.definitions._entry.path.label=Caminho
schema.hooks.definitions._entry.path.description=Caminho em notação de pontos no corpo JSON analisado do pedido, para uma regra 'json-path' ou 'json-path-regex'. Um '$.' inicial é removido, pelo que '$.max_tokens' e 'max_tokens' endereçam o mesmo valor; não há mais suporte de JSONPath - sem carateres universais, filtros nem sintaxe de parênteses retos, e um segmento que contenha um ponto não pode ser endereçado. 'json-path' segue cada segmento literalmente, pelo que um segmento numérico indexa um array. 'json-path-regex' permite ainda que um segmento não numérico tome o primeiro elemento do array que o contenha. Um pedido sem corpo analisado, ou um caminho que não se resolve em nada, não corresponde.
schema.hooks.definitions._entry.equals.label=Igual a
schema.hooks.definitions._entry.equals.description=O valor a que o elemento endereçado tem de ser igual - comparado de forma DIFERENTE consoante o tipo. Numa regra `header` NÃO é igualdade estrita: comparam-se tipos de media (a parte antes do primeiro `;`, em minúsculas), pelo que `application/json` também corresponde a `application/json; charset=utf-8`. Isto existe porque a comparação estrita que substituiu permitia que clientes que acrescentam um charset contornassem a pseudonimização. Um valor equals que contenha ele próprio um `;` é comparado exatamente, pelo que uma regra pode continuar a fixar um charset. Numa regra `json-path` É igualdade estrita. Semântica do comparador: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.from.label=De
schema.hooks.definitions._entry.from.description=Limite inferior inclusivo para uma regra 'header' que compara um cabeçalho numérico - content-length em todas as regras fornecidas. O valor do cabeçalho é lido como inteiro de base 10 e tem de ficar dentro de [from, to]; um valor que não seja analisável nunca corresponde. Só é lido quando equals está ausente E ambos os limites estão presentes: um limite isolado é ignorado e a regra degrada-se numa simples verificação de presença do cabeçalho.
schema.hooks.definitions._entry.to.label=Para
schema.hooks.definitions._entry.to.description=Limite superior inclusivo para uma regra 'header' que compara um cabeçalho numérico. Não existe forma aberta: para exprimir 'pelo menos 10 KB', as regras fornecidas combinam from com um to deliberadamente enorme (size:min10kb usa 999999999), porque omitir qualquer um dos limites transforma a regra numa verificação de presença. Ver from.
schema.hooks.definitions._entry.regex.label=Regex
schema.hooks.definitions._entry.regex.description=Uma fonte de expressão regular JavaScript. Uma regra `json-path-regex` testa-a contra aquilo em que o caminho se resolveu (uma cadeia diretamente, um array elemento a elemento, qualquer outro objeto contra a sua forma JSON). Uma regra `url-regex` testa-a contra o caminho do pedido e a query string que o gateway vê, NÃO contra um URL absoluto, pelo que `^https?://` nunca pode corresponder. Compilada uma vez e colocada em cache por regra; uma expressão que o motor rejeite conta como ausência de correspondência. Semântica do comparador: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.flags.label=Flags
schema.hooks.definitions._entry.flags.description=Flags de expressão regular aplicadas a regex, p. ex. 'i' para não distinguir maiúsculas de minúsculas. Limitadas às letras que o motor realmente aceita, porque qualquer outro valor faz falhar a compilação e essa falha é comunicada como ausência de correspondência - a regra nunca seria então acionada, silenciosamente. As flags fazem parte da chave de cache das expressões compiladas, pelo que duas regras que diferem apenas nas flags não partilham uma expressão compilada. Evite 'g': uma expressão global compilada é reutilizada entre pedidos e avança a sua própria posição, pelo que tal regra só corresponde uma vez em cada duas.
schema.hooks.definitions._entry.desc.label=Desc.
schema.hooks.definitions._entry.desc.description=Nota de texto livre sobre a finalidade desta regra. Atualmente ignorada pelo gateway; documenta a regra para quem edita este ficheiro e não tem efeito na correspondência.
schema.hooks.defaults.label=Predefinições
schema.hooks.defaults.description=Hooks predefinidos por endpoint, tendo como chave o identificador de endpoint que a rota usa - 'anthropic', 'openai' e 'aws-bedrock' hoje, e 'google' (subcaminhos generateContent, streamGenerateContent, embedContent). Só são consultados quando o modelo pedido não tem uma entrada models.overrides.<model>.hooks para o subcaminho: uma entrada por modelo SUBSTITUI a predefinição do endpoint para esse subcaminho, em vez de se fundir com ela.
schema.hooks.defaults._entry.description=As predefinições de um endpoint: o bloco opcional de ativação forçada da pseudonimização, mais uma lista de hooks por subcaminho de pedido (invoke, invoke-with-response-stream, responses, responses-stream). As chaves desconhecidas são rejeitadas, porque qualquer outra chave aqui é lida como subcaminho e nenhuma rota pede um subcaminho que este endpoint não sirva - pelo que uma chave não reconhecida é um erro de escrita que nunca seria executado, e não uma definição. O padrão de subcaminho exclui deliberadamente 'pseudonymization', para que essa chave não tenha também de ser uma lista de hooks.
schema.hooks.defaults._entry.pseudonymization.label=Pseudonimização
schema.hooks.defaults._entry.pseudonymization.description=Definições do plug-in de pseudonimização. A ativação (enabled) e os interruptores de categoria (entities) aplicam-se apenas a este plug-in; o mascaramento só ocorre quando o plug-in é efetivamente executado para um pedido - tem de estar registado na cadeia de hooks e uma fonte de ativação tem de ser acionada.
schema.hooks.defaults._entry.pseudonymization.enabled.label=Ativado
schema.hooks.defaults._entry.pseudonymization.enabled.description=Força a ativação do mascaramento para um pedido. Lido apenas onde este bloco se encontra em models.overrides.<model>.pseudonymization ou hooks.defaults.<endpoint>.pseudonymization: true mascara aí esse pedido, prevalecendo o bloco por modelo sobre o bloco por endpoint. False ou ausente não força nada - o mascaramento pode ainda assim ser executado quando outra fonte de ativação for acionada, como uma palavra-gatilho ou um campo de mascaramento no corpo do pedido. Em observability.pseudonymization esta chave é atualmente ignorada; essa camada contribui com todas as outras definições daqui, exceto method e allow_user_bypass. Em qualquer caso, o plug-in tem de estar ligado à cadeia de hooks, caso contrário nada é mascarado.
schema.hooks.defaults._entry.pseudonymization.method.label=Método
schema.hooks.defaults._entry.pseudonymization.method.description=Modo de mascaramento: `pseudonymization` mascara o pedido e desmascara a resposta; `anonymization` mascara e nunca desmascara. Lido apenas onde este bloco força o mascaramento (um hook ativado ou uma substituição de modelo), não em `observability.pseudonymization`. Também condiciona o SIEM: só `pseudonymization` mantém a resposta mascarada, pelo que, em `anonymization`, um sink de conteúdo recebe o prompt mas não a resposta. Se for omitido, aplica-se `pseudonymization`. Modos: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.label=Permitir que o utilizador contorne
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.description=Só tem efeito dentro de um bloco que força a ativação (um hook ativado ou uma substituição de modelo); não é lido em `observability.pseudonymization`. Predefinição false. Quando true, um chamador pode ignorar o mascaramento através do cabeçalho `x-sail-proxy-pseudonymization: off` (sem distinguir maiúsculas de minúsculas) ou do campo de corpo `pseudonymization_off: true`: o conteúdo chega ao LLM sem máscara e, quando um sink SIEM ativado define `include_content` e `allow_unmasked_content`, também a esse sink. Detalhes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.hooks.defaults._entry.pseudonymization.entities.label=Entidades
schema.hooks.defaults._entry.pseudonymization.entities.description=Interruptores de mascaramento por categoria: `true` mascara a categoria nesta camada, `false` não, e uma categoria não listada herda a camada inferior (as camadas posteriores prevalecem). As chaves são o conjunto de categorias conhecidas: as categorias ativas por predefinição; três opcionais que são fornecidas desativadas (`profile-org`, `profile-location`, `profile-ip-address`); e `profile-sensitive-data`, um interruptor global que ativa todas exceto essas três. Uma chave fora do conjunto é rejeitada aqui. Categorias e camadas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.hooks.defaults._entry.pseudonymization.org_suffixes.label=Sufixos de organização
schema.hooks.defaults._entry.pseudonymization.org_suffixes.description=Sufixos de forma jurídica que marcam uma sequência de palavras como nome de organização, p. ex. Inc, LLC, GmbH. A correspondência distingue maiúsculas de minúsculas por conceção, pelo que um 'limited' em minúsculas no texto não é deliberadamente tratado como forma jurídica; cada entrada corresponde também totalmente em maiúsculas, pelo que uma fatura que escreva ACME GMBH é reconhecida como a mesma organização que Acme GmbH. Só tem efeito enquanto profile-org estiver ativado em entities; ativar profile-org com esta lista vazia não mascara NADA como organização e regista um aviso. Cada entrada é aparada antes da correspondência, e uma entrada vazia ou só com espaços é descartada silenciosamente em vez de rejeitada.
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.label=Diretório de localizações
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.description=Termos literais de localização que o detetor estrutural mascara - sem distinguir maiúsculas de minúsculas, e apenas como palavra inteira ou expressão inteira; nada é inferido de maiúsculas ou do contexto. Só tem efeito enquanto profile-location estiver ativado em entities; ativar profile-location com esta lista vazia não mascara NADA como localização e regista um aviso. Cada entrada é aparada, e uma entrada vazia ou só com espaços é descartada silenciosamente. É fornecida vazia: os nomes de lugares são específicos da implementação e este repositório é público, por isso preencha-a através desta aplicação de administração da configuração, nunca em código versionado.
schema.hooks.defaults._entry.pseudonymization.min_confidence.label=Confiança mín.
schema.hooks.defaults._entry.pseudonymization.min_confidence.description=Quanta evidência um valor detetado precisa antes de ser mascarado, de 0 a 1 (predefinição 0.5). Um valor é mascarado assim que a sua pontuação atinge o limiar; um nome simples com maiúscula pontua cerca de 0.5, um padrão validado por soma de verificação 0.95, uma regra personalizada 1.0. Subir o limiar elimina primeiro os nomes simples, por isso aperte antes uma categoria com ruído através de `thresholds`. Regras personalizadas, identificadores validados e credenciais nunca são rebaixados pelo contexto envolvente. Detalhes da pontuação: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.hooks.defaults._entry.pseudonymization.thresholds.label=Limiares
schema.hooks.defaults._entry.pseudonymization.thresholds.description=Limiares de confiança por categoria, cada um de 0 a 1, que substituem `min_confidence` para as categorias indicadas; uma não listada mantém `min_confidence`. É aqui que se pode ser rigoroso com uma única categoria com ruído - `profile-person` a 0.65 exige mais evidência para nomes, enquanto os identificadores validados ficam no limiar global. As chaves são o mesmo conjunto de categorias conhecidas que `entities` aceita; `profile-sensitive-data` é aceite mas não faz nada. Ajuste por categoria: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.hooks.defaults._entry.pseudonymization.allowlist.label=Lista de permissões
schema.hooks.defaults._entry.pseudonymization.allowlist.description=Valores que esta implementação nunca mascara - um interruptor de DESLIGAR, por valor. Consultada antes da pontuação de confiança, pelo que um valor listado fica isento, por muita evidência que exista. Use-a para um falso positivo recorrente com nome próprio - um título de produto ou de relatório que parece uma pessoa. As listas das camadas são CONCATENADAS, não substituídas, pelo que uma camada inferior só acrescenta uma isenção, nunca retira uma. `terms` versus `patterns`, e o risco de entradas demasiado amplas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.label=Termos
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.description=Valores literais, comparados com o valor detetado inteiro e DISTINGUINDO MAIÚSCULAS DE MINÚSCULAS. Por conceção: 'Watson Studio' é o produto que um operador quis isentar e 'watson studio' numa frase não é, e uma lista que não distinguisse maiúsculas isentaria também uma pessoa cujo apelido por acaso se escreve da mesma forma. Um termo só corresponde a um valor que os detetores produziram inteiro - listar 'Studio' não isenta 'Watson Studio'. Cada entrada aqui é um interruptor de DESLIGAR do mascaramento para esse valor exato, por isso limite a lista a valores que nunca sejam realmente dados pessoais: um termo que por acaso seja o nome de alguém isenta essa pessoa do mascaramento em toda esta implementação, silenciosamente e sem nada no registo que o indique.
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.label=Padrões
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.description=Expressões regulares (JavaScript), cada uma comparada com o valor detetado INTEIRO: o próprio gateway envolve cada entrada em `^(?: )$`, por isso escreva `Z[A-Z0-9_]+`, não `^Z[A-Z0-9_]+$`. A correspondência distingue maiúsculas de minúsculas. Cada entrada é um interruptor de DESLIGAR do mascaramento, e uma entrada ampla desativa o mascaramento sem falhar - `[A-Z].*` desliga quase todos os nomes de pessoas detetados. Uma correspondência com uma amostra de PII integrada gera um aviso, mas é AINDA ASSIM aplicada. Mantenha cada entrada restrita. Detalhes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.saturation_warn.label=Aviso de saturação
schema.hooks.defaults._entry.pseudonymization.saturation_warn.description=Quantos valores mascarados DISTINTOS um pedido pode conter antes de ser comunicado como saturado (predefinição 40). Apenas para relatório - nunca altera o que é mascarado. Acima desse número, o gateway regista um aviso por pedido com contagens por categoria e as FORMAS de valor mais comuns (letras como X, dígitos como 9); nenhum valor mascarado aparece alguma vez. O evento SIEM de utilização do pedido contém as mesmas contagens com uma flag `saturated` - contagens, não texto. Ler o relatório: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.label=Marcadores de posição inventados
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.description=O que acontece quando uma resposta contém um marcador de posição mascarado que nunca foi enviado ao modelo. Os modelos inventam um em cerca de 1 em cada 125 respostas pseudonimizadas, e com mais frequência quanto mais valores um pedido mascara; um marcador assim não designa ninguém e nunca pode ser resolvido. withhold (predefinição): é substituído por um marcador simples como [name withheld] e comunicado como evento de segurança. report: é apenas comunicado e chega inalterado ao cliente, para uma implementação cujos próprios programadores escrevem novos marcadores em fixtures de teste através do gateway. off: nenhum dos dois. Um marcador que o próprio cliente enviou no mesmo pedido nunca é tratado como inventado.
schema.hooks.defaults._entry._entry.description=A lista de hooks de um subcaminho, experimentados por ordem. A mesma forma serve hooks.defaults.<endpoint>.<subpath> e models.overrides.<model>.hooks.<subpath>, pelo que o gateway vê uma única forma, qualquer que seja a das duas que a forneceu. Um hook só é acionado quando TODAS as regras indicadas no seu request.match correspondem ao pedido; request.callback.id indica então o plug-in a executar para a fase em curso. Um hook cujo match não se verifica, ou cujo callback não indica nenhum plug-in registado para essa fase, é ignorado e é experimentado o seguinte - nenhum dos casos é um erro em tempo de execução.
schema.hooks.defaults._entry._entry.items.request.label=Pedido
schema.hooks.defaults._entry._entry.items.request.description=O que tem de corresponder e o que executar quando corresponde. Tem o nome do pedido porque o comparador só inspeciona o pedido de entrada; não há equivalente para a resposta, e nada mais é lido num hook.
schema.hooks.defaults._entry._entry.items.request.callback.label=Callback
schema.hooks.defaults._entry._entry.items.request.callback.description=O plug-in a executar quando todas as regras em match tiverem correspondido.
schema.hooks.defaults._entry._entry.items.request.callback.id.label=ID
schema.hooks.defaults._entry._entry.items.request.callback.id.description=O ID com que um plug-in se registou, procurado no registo de plug-ins do gateway para a fase em execução. Este esquema não consegue verificar a referência cruzada: um ID que nenhum plug-in registou para essa fase é registado como não encontrado e o hook é ignorado, pelo que o pedido passa sem alterações em vez de falhar.
schema.hooks.defaults._entry._entry.items.request.match.label=Correspondência
schema.hooks.defaults._entry._entry.items.request.match.description=Os IDs de regras que têm TODAS de corresponder, avaliados por ordem e abandonados no primeiro que não corresponde. Cada ID é uma chave em hooks.definitions - uma referência cruzada que este esquema não consegue verificar: um ID não definido em lado nenhum regista um aviso e faz com que todo o hook não corresponda, pelo que um erro de escrita desativa silenciosamente o plug-in em vez de o acionar incondicionalmente. Uma lista vazia é rejeitada, porque um hook que deve correr em quase tudo escreve-se, em vez disso, indicando uma regra deliberadamente ampla - o payload:any fornecido corresponde a qualquer pedido cujo corpo analisado contenha um model de cadeia não vazia, o que é o mais próximo de incondicional que uma regra pode ser e ainda o diz explicitamente.
schema.platform.label=Plataforma
schema.platform.billing.label=Faturação
schema.platform.billing.description=Classificação de faturação do SAP AI Core para esta subconta. Lida apenas pela contabilização de custos nativa SAP em Capacity Units da aplicação de administração, nunca pelo caminho de pedido do gateway.
schema.platform.billing.productive.label=Produtivo
schema.platform.billing.productive.description=Indica se a SAP classifica esta subconta/tenant como PRODUTIVA para a faturação do SAP AI Core. isProductive() em sapCapacityService lê-o para escolher a linha SapCapacityUnitPrice - $/CU produtivo ou não produtivo - usada para atribuir preço às Capacity Units. A classificação da SAP nem sempre corresponde ao nome do ambiente (uma subconta Sandbox pode estar classificada como produtiva), por isso defina-o de acordo com o que a sua fatura/subconta SAP realmente é. Predefinição false = não produtivo.
schema.platform.billing.cuFactor.label=Fator CU
schema.platform.billing.cuFactor.description=Fator de conversão de tokens SAP GenAI em Capacity Units (Nota SAP 3437766; uniforme em todas as faturas, não publicado por modelo). cuFactor() em sapCapacityService lê-o - capacityUnits = genAiTokens x este fator, aplicado globalmente a cada evento de utilização (não por tipo de utilização), tanto na captura em direto como no recálculo retroativo. Altere-o apenas se a SAP voltar a publicar a conversão em CU. Predefinição 1.90385. Um valor 0 é tratado como não definido e recorre à predefinição.
schema.platform.timeouts.label=Tempos limite
schema.platform.timeouts.description=Limites de tempo por pedido que o gateway aplica às chamadas LLM de saída.
schema.platform.timeouts.default.label=Predefinido
schema.platform.timeouts.default.description=Tempo limite em milissegundos para pedidos sem streaming, de 1000 a 3600000. Não definido ou zero recorre a 120000 ms (120 segundos).
schema.platform.timeouts.streaming.label=Streaming
schema.platform.timeouts.streaming.description=Tempo limite em milissegundos para pedidos com streaming, de 1000 a 3600000. Não definido ou zero recorre a 240000 ms (240 segundos).
schema.platform.logging.label=Registo
schema.platform.logging.description=Nível e destino dos registos do gateway. Lido pelo logger partilhado no arranque e de novo sempre que o gateway o reinicializa após uma alteração da configuração.
schema.platform.logging.components.label=Componentes
schema.platform.logging.components.description=Substituição do nível de registo por componente, tendo como chave o nome do componente exatamente como o gateway o regista - por exemplo 'ConfigService' ou 'AwsBedrockService'. Um componente sem entrada aqui usa LOG_LEVEL, quando definido, e caso contrário defaultLevel. Uma entrada prevalece sobre LOG_LEVEL para o seu próprio componente, pelo que um componente fixado ignora a variável de ambiente; a configuração fornecida não inclui nenhuma entrada.
schema.platform.logging.components._entry.description=Nível de registo para este componente, que substitui defaultLevel enquanto estiver presente. É comparado, sem distinguir maiúsculas de minúsculas, com os níveis que o logger implementa (trace, debug, info, warn, error); um valor que não reconheça é ignorado silenciosamente, mantendo-se o nível anteriormente em vigor em vez de ser gerado um erro.
schema.platform.logging.defaultLevel.label=Nível predefinido
schema.platform.logging.defaultLevel.description=Nível de registo para qualquer componente sem entrada em `components`. Se `LOG_LEVEL` estiver definido com um nível reconhecido, tem precedência e este campo é ignorado - e `LOG_LEVEL` vem definido em ambos os exemplos .env e nos manifestos Kyma, pelo que numa implementação padrão prevalece o ambiente. Caso contrário, é comparado, sem distinguir maiúsculas de minúsculas, com os níveis do logger (trace, debug, info, warn, error); um valor não reconhecido é ignorado silenciosamente. Precedência: https://st-gr.github.io/sail-proxy/developer/debugging#log-level-resolution
schema.platform.logging.log_folder_path.label=Caminho da pasta de registos
schema.platform.logging.log_folder_path.description=Diretório para onde o gateway escreve os seus próprios ficheiros de registo e - quando payload_logging_enabled é true - os dumps de payloads de pedidos e respostas, num subdiretório payloads/. Recorre a ./logs quando não está definido.
schema.platform.logging.payload_logging_enabled.label=Registo de payloads ativado
schema.platform.logging.payload_logging_enabled.description=Quando true, escreve os corpos completos dos pedidos e das respostas em log_folder_path/payloads para depuração. Os cabeçalhos reconhecidamente sensíveis são ocultados, mas o conteúdo dos corpos é escrito tal como está, por isso mantenha esta opção desligada fora de uma depuração ativa. Desativado por predefinição. A variável de ambiente PAYLOAD_LOGGING_ENABLED, quando definida como true ou false, prevalece sobre este valor.
schema.platform.rate_limit_handling.label=Tratamento de limites de taxa
schema.platform.rate_limit_handling.description=Recuo automático que o gateway aplica depois de um fornecedor sinalizar um limite de taxa - um HTTP 429, ou uma mensagem de erro que contenha uma palavra-chave de limite de taxa. Puramente reativo: atrasa as novas tentativas depois de ter sido detetado um limite de taxa para um modelo e subcaminho; não limita o tráfego antecipadamente.
schema.platform.rate_limit_handling.enabled.label=Ativado
schema.platform.rate_limit_handling.enabled.description=Interruptor principal do recuo por limite de taxa. Quando false ou ausente, o atraso é sempre de 0 segundos e o resto desta secção não tem efeito.
schema.platform.rate_limit_handling.default_delay_seconds.label=Atraso predefinido em segundos
schema.platform.rate_limit_handling.default_delay_seconds.description=Atraso em segundos aplicado quando é detetado um limite de taxa e nem subpath_specific_delays nem model_specific_delays têm uma entrada para o endpoint. Recorre a 30 quando não está definido ou é zero.
schema.platform.rate_limit_handling.backoff_multiplier.label=Multiplicador de recuo
schema.platform.rate_limit_handling.backoff_multiplier.description=Multiplicador aplicado ao atraso anterior em cada limite de taxa consecutivo para o mesmo modelo e subcaminho: o novo atraso é o anterior vezes este valor, limitado a max_delay_seconds. Recorre a 1.5 quando não está definido ou é zero; mantenha-o em 1 ou acima, caso contrário cada limite de taxa consecutivo esperaria menos em vez de mais.
schema.platform.rate_limit_handling.max_delay_seconds.label=Atraso máx. em segundos
schema.platform.rate_limit_handling.max_delay_seconds.description=Limite em segundos que o recuo por limites de taxa consecutivos acima não pode exceder. Recorre a 300 quando não está definido ou é zero.
schema.platform.rate_limit_handling.model_specific_delays.label=Atrasos específicos de modelos
schema.platform.rate_limit_handling.model_specific_delays.description=Substituição do atraso por modelo em segundos, tendo como chave o ID do modelo exatamente como está configurado em providers e models - por exemplo 'anthropic--claude-4-opus--deployed'. Verificado depois de subpath_specific_delays e antes de default_delay_seconds; um atraso de 0 aqui conta como ausência de substituição, porque só é usada uma entrada diferente de zero.
schema.platform.rate_limit_handling.model_specific_delays._entry.description=Atraso em segundos aplicado a este modelo quando atinge um limite de taxa.
schema.platform.rate_limit_handling.subpath_specific_delays.label=Atrasos específicos de subcaminhos
schema.platform.rate_limit_handling.subpath_specific_delays.description=Substituição do atraso por subcaminho em segundos, tendo como chave o subcaminho da API do gateway - por exemplo 'converse-stream' ou 'invoke-with-response-stream'. Verificado primeiro, antes de model_specific_delays e default_delay_seconds; um atraso de 0 aqui conta como ausência de substituição, porque só é usada uma entrada diferente de zero.
schema.platform.rate_limit_handling.subpath_specific_delays._entry.description=Atraso em segundos aplicado a este subcaminho quando atinge um limite de taxa.
schema.platform.security.label=Segurança
schema.platform.security.description=Questões de tráfego de entrada.
schema.platform.security.trust_forwarded_for.label=Confiar em Forwarded-For
schema.platform.security.trust_forwarded_for.description=Confia nos cabeçalhos X-Forwarded-For e X-Real-IP fornecidos pelo cliente - e no IP do cliente que a framework web deles deriva - ao registar o IP do cliente nos eventos de segurança, em vez de usar o endereço bruto do par do socket. Ative-o apenas atrás de um proxy que substitua esses cabeçalhos em vez de deixar passar o que o cliente enviou; caso contrário, um cliente pode falsificar o seu próprio IP registado.
schema.platform.security.credentialExpirationDays.label=Expiração das credenciais (dias)
schema.platform.security.credentialExpirationDays.description=Dias durante os quais uma credencial permanece válida: uma chave de API ou credencial AWS é criada com expiresAt = agora + este número de dias, e cada renovação (rotação) volta a definir expiresAt para agora + este número de dias. Valores ausentes ou inválidos recorrem a 90. As credenciais criadas antes de a expiração existir não têm data e nunca expiram até um administrador definir uma.
schema.platform.quotas.label=Quotas
schema.platform.quotas.description=Quotas predefinidas por utilizador para toda a plataforma, impostas pelo gateway em cada pedido LLM. A restrição própria de um utilizador (aplicação Utilizadores e quotas) substitui cada campo; null = ilimitado. As janelas são o dia de calendário UTC, a semana ISO (segunda-feira 00:00 UTC) e o mês de calendário; a despesa é o custo SAP mais o custo Connections na moeda do preço da Capacity Unit da SAP.
schema.platform.quotas.requestsPerMinute.label=Pedidos por minuto
schema.platform.quotas.requestsPerMinute.description=Pedidos por utilizador por minuto deslizante. Os limites por credencial (RateLimits) aplicam-se também; um pedido tem de passar ambos.
schema.platform.quotas.spendPerDay.label=Despesa por dia
schema.platform.quotas.spendPerDay.description=Custo SAP mais custo Connections por utilizador por dia UTC.
schema.platform.quotas.spendPerWeek.label=Despesa por semana
schema.platform.quotas.spendPerWeek.description=Custo SAP mais custo Connections por utilizador por semana ISO.
schema.platform.quotas.spendPerMonth.label=Despesa por mês
schema.platform.quotas.spendPerMonth.description=Custo SAP mais custo Connections por utilizador por mês de calendário.
schema.platform.quotas.tokensPerDay.label=Tokens por dia
schema.platform.quotas.tokensPerDay.description=Tokens de entrada, de saída e de escrita em cache por utilizador por dia UTC; as leituras de cache não são contabilizadas.
schema.platform.quotas.tokensPerWeek.label=Tokens por semana
schema.platform.quotas.tokensPerWeek.description=Tokens de entrada, de saída e de escrita em cache por utilizador por semana ISO; as leituras de cache não são contabilizadas.
schema.platform.quotas.tokensPerMonth.label=Tokens por mês
schema.platform.quotas.tokensPerMonth.description=Tokens de entrada, de saída e de escrita em cache por utilizador por mês de calendário; as leituras de cache não são contabilizadas.
schema.platform.toolGovernance.label=Governação de ferramentas
schema.platform.toolGovernance.description=Governação de ferramentas: durante quanto tempo são mantidas as linhas de utilização de ferramentas por pedido e os respetivos agregados diários, e como cada programa cliente escreve as ferramentas MCP que aloja por si próprio.
schema.platform.toolGovernance.mcpNaming.label=Nomenclatura MCP
schema.platform.toolGovernance.mcpNaming.description=Um cliente que executa os seus próprios servidores MCP não envia nenhum tipo de ferramenta MCP: o Claude Code declara cada ferramenta como mcp__server__tool, enquanto o codex as alcança dentro da sua própria ferramenta exec. Estas convenções transformam um nome desses na identidade mcp:server/tool que um padrão de política pode comparar, pelo que um cliente que ninguém mediu ainda é uma alteração de configuração e não uma nova versão.
schema.platform.toolGovernance.mcpNaming.namePattern.label=Padrão de nome de ferramenta
schema.platform.toolGovernance.mcpNaming.namePattern.description=Expressão regular comparada com um nome de ferramenta declarado; o primeiro grupo é o servidor MCP, o segundo a ferramenta. A predefinição lê mcp__codex_apps__sites_create_site como servidor codex_apps e ferramenta sites_create_site.
schema.platform.toolGovernance.mcpNaming.clients.label=Programas cliente
schema.platform.toolGovernance.mcpNaming.clients.description=Uma entrada por programa cliente. Aplica-se a primeira cujo texto de User Agent aparece no do próprio pedido; um pedido que não corresponda a nenhuma continua a ser regido pelo que declara. Uma lista indicada aqui substitui por completo as predefinições incorporadas; uma entrada sem name, userAgent ou containerTools é ignorada.
schema.platform.toolGovernance.mcpNaming.clients.items.name.label=Nome
schema.platform.toolGovernance.mcpNaming.clients.items.name.description=Como este cliente é designado no cockpit e nos registos, por exemplo claude-code.
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.label=User Agent
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.description=Texto que identifica o cliente no cabeçalho User Agent do pedido, por exemplo claude-cli. Comparado sem distinguir maiúsculas de minúsculas, em qualquer ponto do cabeçalho.
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.label=Ferramentas contentor
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.description=Ferramentas cujo corpo de chamada pode alcançar ferramentas MCP aninhadas, como o exec do codex. Vazio para um cliente que declara diretamente as suas ferramentas MCP, que é o caso comum.
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.label=Padrão de chamada aninhada
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.description=Expressão regular que encontra o nome de uma ferramenta aninhada no corpo de chamada de uma ferramenta contentor; o primeiro grupo é o nome. Só os nomes são lidos, nunca os argumentos.
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.label=Padrão de nome de ferramenta
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.description=Expressão regular que substitui o padrão partilhado de nome de ferramenta apenas para este cliente; o primeiro grupo é o servidor MCP, o segundo a ferramenta, e um nome só conta quando ambos os grupos não estão vazios. A correspondência distingue maiúsculas de minúsculas e encontra o padrão em qualquer ponto do nome, salvo se estiver ancorado com ^ e $. Omita-a para usar o padrão partilhado. Uma expressão vazia ou inválida não corresponde a nada por padrão para este cliente (não recorre ao padrão partilhado), mas os nomes de servidor continuam a aplicar-se.
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.label=Nomes de servidor
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.description=Os servidores MCP que esta instalação executa, para um cliente cujos nomes de ferramenta não têm qualquer marca, como o opencode, que declara a ferramenta ping_probe do servidor probe como probe_ping_probe. Uma ferramenta declarada com o nome <server>_<tool> passa então a ser a identidade mcp:server/tool; o padrão de nome é tentado primeiro, depois os servidores pela ordem da lista, e ganha o primeiro servidor correspondente. Os nomes de servidor distinguem maiúsculas de minúsculas. As entradas vazias são ignoradas. Se a lista ficar vazia, essas ferramentas continuam a ser ferramentas de função comuns.
schema.platform.toolGovernance.retention.label=Retenção
schema.platform.toolGovernance.retention.rawDays.label=Retenção da utilização de ferramentas (dias)
schema.platform.toolGovernance.retention.rawDays.description=Dias durante os quais uma linha de utilização de ferramenta por pedido é mantida antes de a limpeza noturna a remover. Os agregados diários mantêm os totais.
schema.platform.toolGovernance.retention.dailyDays.label=Retenção dos agregados de utilização de ferramentas (dias)
schema.platform.toolGovernance.retention.dailyDays.description=Dias durante os quais um agregado diário de utilização de ferramentas (por utilizador, ferramenta e dia) é mantido. O inventário e a página do utilizador leem-nos.
schema.platform.maintenance.label=Manutenção
schema.platform.maintenance.description=Quando o serviço de administração executa a sua manutenção diária: o recálculo dos custos, a reconstrução dos buckets de utilização e a republicação do documento de quota de cada utilizador.
schema.platform.maintenance.dailyRunAtUtc.label=Execução diária às (UTC)
schema.platform.maintenance.dailyRunAtUtc.description=Hora do dia, em UTC, no formato HH:MM (24 horas), a que começa a execução diária de manutenção. Não definido: a execução começa 5 minutos depois de o serviço de administração arrancar e a cada 24 horas a partir daí, pelo que uma nova implementação ao meio-dia a fixa ao meio-dia. Definido: a primeira execução continua a começar 5 minutos após o arranque; cada execução posterior começa todos os dias a esta hora. Exemplo: para executar à meia-noite da hora do Pacífico, introduza 08:00 enquanto vigorar a hora padrão do Pacífico (UTC-8) ou 07:00 durante a hora de verão do Pacífico (UTC-7) - o valor não é ajustado à hora de verão.
schema.observability.label=Observabilidade
schema.observability.pseudonymization.label=Pseudonimização
schema.observability.pseudonymization.description=Definições do plug-in de pseudonimização. A ativação (enabled) e os interruptores de categoria (entities) aplicam-se apenas a este plug-in; o mascaramento só ocorre quando o plug-in é efetivamente executado para um pedido - tem de estar registado na cadeia de hooks e uma fonte de ativação tem de ser acionada.
schema.observability.pseudonymization.enabled.label=Ativado
schema.observability.pseudonymization.enabled.description=Força a ativação do mascaramento para um pedido. Lido apenas onde este bloco se encontra em models.overrides.<model>.pseudonymization ou hooks.defaults.<endpoint>.pseudonymization: true mascara aí esse pedido, prevalecendo o bloco por modelo sobre o bloco por endpoint. False ou ausente não força nada - o mascaramento pode ainda assim ser executado quando outra fonte de ativação for acionada, como uma palavra-gatilho ou um campo de mascaramento no corpo do pedido. Em observability.pseudonymization esta chave é atualmente ignorada; essa camada contribui com todas as outras definições daqui, exceto method e allow_user_bypass. Em qualquer caso, o plug-in tem de estar ligado à cadeia de hooks, caso contrário nada é mascarado.
schema.observability.pseudonymization.method.label=Método
schema.observability.pseudonymization.method.description=Modo de mascaramento: `pseudonymization` mascara o pedido e desmascara a resposta; `anonymization` mascara e nunca desmascara. Lido apenas onde este bloco força o mascaramento (um hook ativado ou uma substituição de modelo), não em `observability.pseudonymization`. Também condiciona o SIEM: só `pseudonymization` mantém a resposta mascarada, pelo que, em `anonymization`, um sink de conteúdo recebe o prompt mas não a resposta. Se for omitido, aplica-se `pseudonymization`. Modos: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#modes
schema.observability.pseudonymization.allow_user_bypass.label=Permitir que o utilizador contorne
schema.observability.pseudonymization.allow_user_bypass.description=Só tem efeito dentro de um bloco que força a ativação (um hook ativado ou uma substituição de modelo); não é lido em `observability.pseudonymization`. Predefinição false. Quando true, um chamador pode ignorar o mascaramento através do cabeçalho `x-sail-proxy-pseudonymization: off` (sem distinguir maiúsculas de minúsculas) ou do campo de corpo `pseudonymization_off: true`: o conteúdo chega ao LLM sem máscara e, quando um sink SIEM ativado define `include_content` e `allow_unmasked_content`, também a esse sink. Detalhes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#bypassing-forced-pseudonymization
schema.observability.pseudonymization.entities.label=Entidades
schema.observability.pseudonymization.entities.description=Interruptores de mascaramento por categoria: `true` mascara a categoria nesta camada, `false` não, e uma categoria não listada herda a camada inferior (as camadas posteriores prevalecem). As chaves são o conjunto de categorias conhecidas: as categorias ativas por predefinição; três opcionais que são fornecidas desativadas (`profile-org`, `profile-location`, `profile-ip-address`); e `profile-sensitive-data`, um interruptor global que ativa todas exceto essas três. Uma chave fora do conjunto é rejeitada aqui. Categorias e camadas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#configuring-which-categories-are-masked
schema.observability.pseudonymization.org_suffixes.label=Sufixos de organização
schema.observability.pseudonymization.org_suffixes.description=Sufixos de forma jurídica que marcam uma sequência de palavras como nome de organização, p. ex. Inc, LLC, GmbH. A correspondência distingue maiúsculas de minúsculas por conceção, pelo que um 'limited' em minúsculas no texto não é deliberadamente tratado como forma jurídica; cada entrada corresponde também totalmente em maiúsculas, pelo que uma fatura que escreva ACME GMBH é reconhecida como a mesma organização que Acme GmbH. Só tem efeito enquanto profile-org estiver ativado em entities; ativar profile-org com esta lista vazia não mascara NADA como organização e regista um aviso. Cada entrada é aparada antes da correspondência, e uma entrada vazia ou só com espaços é descartada silenciosamente em vez de rejeitada.
schema.observability.pseudonymization.location_gazetteer.label=Diretório de localizações
schema.observability.pseudonymization.location_gazetteer.description=Termos literais de localização que o detetor estrutural mascara - sem distinguir maiúsculas de minúsculas, e apenas como palavra inteira ou expressão inteira; nada é inferido de maiúsculas ou do contexto. Só tem efeito enquanto profile-location estiver ativado em entities; ativar profile-location com esta lista vazia não mascara NADA como localização e regista um aviso. Cada entrada é aparada, e uma entrada vazia ou só com espaços é descartada silenciosamente. É fornecida vazia: os nomes de lugares são específicos da implementação e este repositório é público, por isso preencha-a através desta aplicação de administração da configuração, nunca em código versionado.
schema.observability.pseudonymization.min_confidence.label=Confiança mín.
schema.observability.pseudonymization.min_confidence.description=Quanta evidência um valor detetado precisa antes de ser mascarado, de 0 a 1 (predefinição 0.5). Um valor é mascarado assim que a sua pontuação atinge o limiar; um nome simples com maiúscula pontua cerca de 0.5, um padrão validado por soma de verificação 0.95, uma regra personalizada 1.0. Subir o limiar elimina primeiro os nomes simples, por isso aperte antes uma categoria com ruído através de `thresholds`. Regras personalizadas, identificadores validados e credenciais nunca são rebaixados pelo contexto envolvente. Detalhes da pontuação: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#how-a-candidates-score-is-built
schema.observability.pseudonymization.thresholds.label=Limiares
schema.observability.pseudonymization.thresholds.description=Limiares de confiança por categoria, cada um de 0 a 1, que substituem `min_confidence` para as categorias indicadas; uma não listada mantém `min_confidence`. É aqui que se pode ser rigoroso com uma única categoria com ruído - `profile-person` a 0.65 exige mais evidência para nomes, enquanto os identificadores validados ficam no limiar global. As chaves são o mesmo conjunto de categorias conhecidas que `entities` aceita; `profile-sensitive-data` é aceite mas não faz nada. Ajuste por categoria: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.observability.pseudonymization.allowlist.label=Lista de permissões
schema.observability.pseudonymization.allowlist.description=Valores que esta implementação nunca mascara - um interruptor de DESLIGAR, por valor. Consultada antes da pontuação de confiança, pelo que um valor listado fica isento, por muita evidência que exista. Use-a para um falso positivo recorrente com nome próprio - um título de produto ou de relatório que parece uma pessoa. As listas das camadas são CONCATENADAS, não substituídas, pelo que uma camada inferior só acrescenta uma isenção, nunca retira uma. `terms` versus `patterns`, e o risco de entradas demasiado amplas: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.allowlist.terms.label=Termos
schema.observability.pseudonymization.allowlist.terms.description=Valores literais, comparados com o valor detetado inteiro e DISTINGUINDO MAIÚSCULAS DE MINÚSCULAS. Por conceção: 'Watson Studio' é o produto que um operador quis isentar e 'watson studio' numa frase não é, e uma lista que não distinguisse maiúsculas isentaria também uma pessoa cujo apelido por acaso se escreve da mesma forma. Um termo só corresponde a um valor que os detetores produziram inteiro - listar 'Studio' não isenta 'Watson Studio'. Cada entrada aqui é um interruptor de DESLIGAR do mascaramento para esse valor exato, por isso limite a lista a valores que nunca sejam realmente dados pessoais: um termo que por acaso seja o nome de alguém isenta essa pessoa do mascaramento em toda esta implementação, silenciosamente e sem nada no registo que o indique.
schema.observability.pseudonymization.allowlist.patterns.label=Padrões
schema.observability.pseudonymization.allowlist.patterns.description=Expressões regulares (JavaScript), cada uma comparada com o valor detetado INTEIRO: o próprio gateway envolve cada entrada em `^(?: )$`, por isso escreva `Z[A-Z0-9_]+`, não `^Z[A-Z0-9_]+$`. A correspondência distingue maiúsculas de minúsculas. Cada entrada é um interruptor de DESLIGAR do mascaramento, e uma entrada ampla desativa o mascaramento sem falhar - `[A-Z].*` desliga quase todos os nomes de pessoas detetados. Uma correspondência com uma amostra de PII integrada gera um aviso, mas é AINDA ASSIM aplicada. Mantenha cada entrada restrita. Detalhes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.saturation_warn.label=Aviso de saturação
schema.observability.pseudonymization.saturation_warn.description=Quantos valores mascarados DISTINTOS um pedido pode conter antes de ser comunicado como saturado (predefinição 40). Apenas para relatório - nunca altera o que é mascarado. Acima desse número, o gateway regista um aviso por pedido com contagens por categoria e as FORMAS de valor mais comuns (letras como X, dígitos como 9); nenhum valor mascarado aparece alguma vez. O evento SIEM de utilização do pedido contém as mesmas contagens com uma flag `saturated` - contagens, não texto. Ler o relatório: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization.md#reading-the-saturation-report
schema.observability.pseudonymization.unknown_placeholders.label=Marcadores de posição inventados
schema.observability.pseudonymization.unknown_placeholders.description=O que acontece quando uma resposta contém um marcador de posição mascarado que nunca foi enviado ao modelo. Os modelos inventam um em cerca de 1 em cada 125 respostas pseudonimizadas, e com mais frequência quanto mais valores um pedido mascara; um marcador assim não designa ninguém e nunca pode ser resolvido. withhold (predefinição): é substituído por um marcador simples como [name withheld] e comunicado como evento de segurança. report: é apenas comunicado e chega inalterado ao cliente, para uma implementação cujos próprios programadores escrevem novos marcadores em fixtures de teste através do gateway. off: nenhum dos dois. Um marcador que o próprio cliente enviou no mesmo pedido nunca é tratado como inventado.
schema.observability.siem.label=SIEM
schema.observability.siem.description=Exportação SIEM. Os eventos de auditoria e de segurança são escritos numa outbox e entregues pelo menos uma vez a cada sink ativado.
schema.observability.siem.enabled.label=Ativado
schema.observability.siem.enabled.description=Interruptor principal. Quando false, o dispatcher não arranca, independentemente das definições de cada sink.
schema.observability.siem.batch_size.label=Tamanho do lote
schema.observability.siem.batch_size.description=Número predefinido de linhas lidas por sink em cada ciclo; um sink pode substituí-lo.
schema.observability.siem.interval_ms.label=Intervalo (ms)
schema.observability.siem.interval_ms.description=Intervalo de despacho predefinido em milissegundos; um sink pode substituí-lo. O período do temporizador é o mais curto de todos os intervalos em jogo.
schema.observability.siem.reconcile_lookback_ms.label=Retrospetiva de reconciliação (ms)
schema.observability.siem.reconcile_lookback_ms.description=Até onde, em milissegundos, a passagem de reparação recua à procura de eventos da outbox que nunca foram entregues a um sink. Delimita essa análise e impede que um sink recém-ativado reproduza todo o histórico retido; os eventos mais antigos nunca são preenchidos retroativamente.
schema.observability.siem.content_max_bytes.label=Tamanho máx. do conteúdo em bytes
schema.observability.siem.content_max_bytes.description=Limite, em bytes UTF-8, aplicado de forma independente ao prompt e à resposta antes de um evento de utilização ser publicado. Um evento cortado contém content.truncated: true, pelo que um payload parcial nunca é confundido com uma conversa completa. 0 é aceite e esvazia o conteúdo, marcado como truncado. Predefinição 8192, que é também onde vai parar um valor negativo ou não numérico.
schema.observability.siem.categories.label=Categorias
schema.observability.siem.categories.description=Categorias de eventos a exportar. 'usage' é um evento de conclusão por pedido e é a única categoria que pode conter conteúdo de conversas; a lista fornecida omite-a, pelo que exportá-la é uma adesão explícita; uma lista ausente ou vazia exporta as três, incluindo usage.
schema.observability.siem.sinks.label=Sinks
schema.observability.siem.sinks.description=Sinks configurados. Um sink cujas definições falham a validação é ignorado com um aviso, em vez de parar os outros.
schema.observability.siem.sinks.items.name.label=Nome
schema.observability.siem.sinks.items.name.description=Nome único do sink; a chave usada para as linhas de entrega e o estado de recuo de cada sink.
schema.observability.siem.sinks.items.type.label=Tipo
schema.observability.siem.sinks.items.type.description=Implementação do sink. Determina quais das propriedades específicas do tipo abaixo se aplicam.
schema.observability.siem.sinks.items.enabled.label=Ativado
schema.observability.siem.sinks.items.enabled.description=Fornecido como false. Um sink só é despachado quando siem.enabled e este valor são ambos true.
schema.observability.siem.sinks.items.include_content.label=Incluir conteúdo
schema.observability.siem.sinks.items.include_content.description=Adesão explícita: envia para este sink o prompt e a resposta de cada pedido, como parte de um evento de utilização. Predefinição false, e false em todos os sinks fornecidos. O que é enviado é a forma pseudonimizada - marcadores de posição, não PII em bruto -, a menos que allow_unmasked_content também esteja definido. Requer 'usage' em siem.categories; o dispatcher remove totalmente o conteúdo para um sink em que este valor é false.
schema.observability.siem.sinks.items.allow_unmasked_content.label=Permitir conteúdo não mascarado
schema.observability.siem.sinks.items.allow_unmasked_content.description=RISCO - lê conversas em bruto. Adesão explícita para receber conteúdo que a pseudonimização nunca mascarou, porque o mascaramento foi desativado ou contornado para esse pedido: nomes reais, moradas e tudo o que um utilizador colou, na íntegra, a sair deste sistema. Predefinição false, e só tem efeito onde include_content também é true. Se ficar false, um pedido desses envia apenas metadados e regista content.omitted: 'not-masked'.
schema.observability.siem.sinks.items.include_credential_material.label=Incluir material de credenciais
schema.observability.siem.sinks.items.include_credential_material.description=Adesão explícita: envia o valor em bruto de uma credencial não resolvida para análise forense. Predefinição false; o dispatcher remove o campo quando é false.
schema.observability.siem.sinks.items.batch_size.label=Tamanho do lote
schema.observability.siem.sinks.items.batch_size.description=Substituição de siem.batch_size por sink.
schema.observability.siem.sinks.items.interval_ms.label=Intervalo (ms)
schema.observability.siem.sinks.items.interval_ms.description=Substituição de siem.interval_ms por sink. Tem de exceder o tempo limite de envio do sink, caso contrário os despachos ficam em fila uns atrás dos outros.
schema.observability.siem.sinks.items.url.label=URL
schema.observability.siem.sinks.items.url.description=webhook: URL de ingestão completo.
schema.observability.siem.sinks.items.token_env.label=Token
schema.observability.siem.sinks.items.token_env.description=Nome do slot de credencial. Nunca um valor de credencial - o api_config.json é versionado em três cópias sincronizadas num repositório público.
schema.observability.siem.sinks.items.endpoint.label=Ponto de extremidade
schema.observability.siem.sinks.items.endpoint.description=otel: endpoint de registos OTLP/HTTP.
schema.observability.siem.sinks.items.headers_env.label=Cabeçalhos
schema.observability.siem.sinks.items.headers_env.description=Nome do slot de credencial. Nunca um valor de credencial - o api_config.json é versionado em três cópias sincronizadas num repositório público.
schema.observability.siem.sinks.items.site.label=Site
schema.observability.siem.sinks.items.site.description=datadog: anfitrião do site, p. ex. datadoghq.com ou datadoghq.eu.
schema.observability.siem.sinks.items.api_key_env.label=Chave de API
schema.observability.siem.sinks.items.api_key_env.description=Nome do slot de credencial. Nunca um valor de credencial - o api_config.json é versionado em três cópias sincronizadas num repositório público.
schema.observability.siem.sinks.items.dcr_endpoint.label=Ponto de extremidade DCR
schema.observability.siem.sinks.items.dcr_endpoint.description=azure_sentinel: URL do Data Collection Endpoint.
schema.observability.siem.sinks.items.dcr_immutable_id.label=ID imutável da DCR
schema.observability.siem.sinks.items.dcr_immutable_id.description=azure_sentinel: ID imutável da Data Collection Rule.
schema.observability.siem.sinks.items.stream_name.label=Nome do stream
schema.observability.siem.sinks.items.stream_name.description=azure_sentinel: nome do stream personalizado, p. ex. Custom-SailProxy_CL.
schema.observability.siem.sinks.items.tenant_id.label=ID do tenant
schema.observability.siem.sinks.items.tenant_id.description=azure_sentinel: ID do tenant Entra.
schema.observability.siem.sinks.items.client_id.label=ID de cliente
schema.observability.siem.sinks.items.client_id.description=azure_sentinel: ID da aplicação (cliente) Entra.
schema.observability.siem.sinks.items.client_secret_env.label=Segredo de cliente
schema.observability.siem.sinks.items.client_secret_env.description=Nome do slot de credencial. Nunca um valor de credencial - o api_config.json é versionado em três cópias sincronizadas num repositório público.
schema.observability.siem.sinks.items.project_id.label=ID do projeto
schema.observability.siem.sinks.items.project_id.description=gcs_pubsub: ID do projeto Google Cloud.
schema.observability.siem.sinks.items.topic_id.label=ID do tópico
schema.observability.siem.sinks.items.topic_id.description=gcs_pubsub: ID do tópico Pub/Sub.
schema.observability.siem.sinks.items.service_account_json_env.label=JSON da conta de serviço
schema.observability.siem.sinks.items.service_account_json_env.description=Nome do slot de credencial. Nunca um valor de credencial - o api_config.json é versionado em três cópias sincronizadas num repositório público.
schema.observability.siem.sinks.items.bucket.label=Bucket
schema.observability.siem.sinks.items.bucket.description=s3: bucket de destino.
schema.observability.siem.sinks.items.region.label=Região
schema.observability.siem.sinks.items.region.description=s3: região AWS.
schema.observability.siem.sinks.items.prefix.label=Prefixo
schema.observability.siem.sinks.items.prefix.description=s3: prefixo de chave; os objetos ficam em <prefix>/YYYY/MM/DD/HH/<uuid>.ndjson em UTC.
schema.observability.siem.sinks.items.access_key_id_env.label=ID da chave de acesso
schema.observability.siem.sinks.items.access_key_id_env.description=Nome do slot de credencial. Nunca um valor de credencial - o api_config.json é versionado em três cópias sincronizadas num repositório público.
schema.observability.siem.sinks.items.secret_access_key_env.label=Chave de acesso secreta
schema.observability.siem.sinks.items.secret_access_key_env.description=Nome do slot de credencial. Nunca um valor de credencial - o api_config.json é versionado em três cópias sincronizadas num repositório público.
