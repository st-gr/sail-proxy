# Configuration form field texts by schema path - generated by ci/scripts/schema-texts.js.
# English is regenerated from the schema; other languages are translated in place and kept.
schema.providers.label=Fornecedores
schema.providers.description=Definições de cada fornecedor a montante, com o seu nome de transmissão na rota como chave (por isso `aws-bedrock` mantém o hífen). Hoje são lidos seis fornecedores - anthropic, aws-bedrock, google, openai, openrouter e perplexity; qualquer outra chave é aceite e validada, mas permanece inativa até o gateway a conhecer. Cada fornecedor nomeado aceita apenas a sua própria lista de definições, embora algumas definições aceites fiquem inativas num determinado fornecedor - a descrição de cada campo indica onde é lido; google é o mais restrito dos seis e contém apenas substitute_models, lido pela rota /google; qualquer outra definição comum de fornecedor é rejeitada nele, em vez de ficar apenas inativa. Chaves por fornecedor: https://st-gr.github.io/sail-proxy/developer/gateway#provider-configuration-keys
schema.providers.anthropic.label=Anthropic
schema.providers.anthropic.description=O fornecedor anthropic, servido pelo caminho de pedido Anthropic do gateway: as definições que todos os fornecedores têm, mais a versão de transmissão desse caminho e os seus dois filtros de flags beta.
schema.providers.anthropic.emulate_streaming_for_models.label=Emular streaming para modelos
schema.providers.anthropic.emulate_streaming_for_models.description=Modelos cuja resposta o gateway recolhe na íntegra e depois reproduz como stream, porque a implementação não a consegue transmitir em stream por si própria. Comparado com o nome do modelo enviado a montante, exatamente ou sem o prefixo 'provider--'. Hoje usado apenas para os fornecedores anthropic e openai; uma entrada em qualquer outro fornecedor não tem efeito.
schema.providers.anthropic.substitute_models.label=Modelos de substituição
schema.providers.anthropic.substitute_models.description=Mudanças de nome de modelos para este fornecedor: um pedido que indique 'from' (correspondência exata, incluindo maiúsculas e minúsculas) é reencaminhado como 'to'; prevalece a primeira entrada correspondente e as mudanças de nome não se encadeiam. A resposta e a utilização registada para o custo indicam então o modelo reencaminhado, e não o nome que o cliente enviou. Lido nas rotas anthropic, aws-bedrock e google, na rota de chat completions do openrouter e nas rotas de previsão do SAP RPT (/sap/v1/rpt, a partir da lista sap-rpt), cada uma para o seu próprio fornecedor; em /openai/v1/chat/completions e /openai/v1/responses é consultada primeiro a lista openai e depois a lista perplexity.
schema.providers.anthropic.substitute_models.items.from.label=De
schema.providers.anthropic.substitute_models.items.from.description=O nome do modelo que o cliente envia.
schema.providers.anthropic.substitute_models.items.to.label=Para
schema.providers.anthropic.substitute_models.items.to.description=O nome do modelo reencaminhado para o SAP AI Core, normalmente um ID de modelo implementado como anthropic--claude-4.5-sonnet--deployed.
schema.providers.anthropic.substitute_models.items.description.label=Descrição
schema.providers.anthropic.substitute_models.items.description.description=Nota de texto livre sobre esta mudança de nome, para quem ler a configuração mais tarde. Atualmente ignorada pelo gateway; não altera em nada o comportamento da mudança de nome.
schema.providers.anthropic.unsupported_params.label=Parâmetros não suportados
schema.providers.anthropic.unsupported_params.description=Parâmetros de pedido que este fornecedor ou modelo não aceita. O gateway remove-os antes de reencaminhar para o SAP AI Core, que de outro modo rejeitaria o pedido com 400 "does not support parameters: [...]". Uma lista por modelo substitui a lista ao nível do fornecedor, em vez de a complementar.
schema.providers.anthropic.param_renames.label=Mudanças de nome de parâmetros
schema.providers.anthropic.param_renames.description=Mudanças de nome de parâmetros aplicadas no caminho de implementação direta, por exemplo max_tokens para max_completion_tokens nos modelos de raciocínio OpenAI que rejeitam max_tokens. Um mapa por modelo substitui o mapa ao nível do fornecedor, em vez de o complementar.
schema.providers.anthropic.supports_responses_api.label=Suporta a Responses API
schema.providers.anthropic.supports_responses_api.description=Indica se este fornecedor ou modelo pode ser servido em /openai/v1/responses. Se estiver ausente, mantém-se a regra de família integrada, que admite os modelos implementados GPT-5 e posteriores e a série o.
schema.providers.anthropic.supports_prompt_caching.label=Suporta a colocação de prompts em cache
schema.providers.anthropic.supports_prompt_caching.description=Indica se os modelos deste fornecedor recebem breakpoints de cache de prompt da Anthropic. Ordem de resolução: a flag models.overrides.<model>.supports_prompt_caching por modelo, depois esta flag ao nível do fornecedor, depois uma predefinição de true para o fornecedor anthropic e false para todos os outros. Definir false onde a cache funciona custa o preço total de entrada sem cache em cada turno, enquanto um true desnecessário foi medido como sem efeito - por isso, desative apenas para um modelo que se saiba que o rejeita.
schema.providers.anthropic.anthropic_bedrock_version.label=Versão Anthropic Bedrock
schema.providers.anthropic.anthropic_bedrock_version.description=A anthropic-version que o gateway envia para o SAP AI Core quando o cliente omite o cabeçalho anthropic-version. Lido apenas de providers.anthropic, pelo que uma cópia em qualquer outro fornecedor - incluindo aws-bedrock - não tem efeito. Se estiver ausente, é usado bedrock-2023-05-31.
schema.providers.anthropic.excluded_beta_headers.label=Cabeçalhos beta excluídos
schema.providers.anthropic.excluded_beta_headers.description=Flags beta da Anthropic removidas de um pedido antes de este ser reencaminhado, para funcionalidades que a implementação do SAP AI Core não aceita. Aplicadas em conjunto com as flags que o próprio gateway coloca em quarentena após um erro 400 'invalid beta flag' a montante. Lido apenas de providers.anthropic; uma lista em qualquer outro fornecedor não tem efeito.
schema.providers.anthropic.supported_beta_headers.label=Cabeçalhos beta suportados
schema.providers.anthropic.supported_beta_headers.description=Lista de permissões das flags beta da Anthropic: enquanto não estiver vazia, apenas estas são reencaminhadas, e excluded_beta_headers continua a aplicar-se por cima. Vazia ou ausente significa nenhuma lista de permissões, pelo que todas as flags enviadas pelo cliente passam - o que faz com que adicionar aqui uma primeira entrada descarte silenciosamente todas as flags não listadas ao lado dela. Lido apenas de providers.anthropic.
schema.providers.anthropic.sap_cache_read_token_billing_factor.label=Fator de faturação SAP de tokens de leitura de cache
schema.providers.anthropic.sap_cache_read_token_billing_factor.description=Fator de calibração que ajusta a CONTAGEM de tokens de entrada de LEITURA de cache comunicada pela API do modelo para a contagem que o SAP AI Core mede na sua fatura, para a contabilização de custos nativa SAP em Capacity Units. Lido pela aplicação de administração (não pelo caminho de pedido do gateway). A reconciliação de faturas de mar-jun 2026 revelou que a linha SAP 'Cache Read Input Tokens' é ~2x os cache_read_input_tokens que a API devolve e que o sail-proxy regista fielmente; o mecanismo não está documentado e está em averiguação junto da SAP. Note que a Anthropic e o AWS Bedrock multiplicam o PREÇO da cache (leitura 0.1x, escrita 1.25x/2x consoante o TTL), nunca a CONTAGEM de tokens, pelo que se trata de uma calibração da medição SAP e não do modelo de preços da Anthropic. A predefinição 1.0 não aplica qualquer ajuste - defina-o (p. ex. 2.0) apenas quando a averiguação junto da SAP confirmar o rácio.
schema.providers.anthropic.sap_cache_write_token_billing_factor.label=Fator de faturação SAP de tokens de escrita de cache
schema.providers.anthropic.sap_cache_write_token_billing_factor.description=Fator de calibração que ajusta a CONTAGEM de tokens de entrada de ESCRITA de cache (criação) comunicada pela API do modelo para a contagem que o SAP AI Core mede na sua fatura, para a contabilização de custos nativa SAP em Capacity Units. Lido pela aplicação de administração (não pelo caminho de pedido do gateway). A reconciliação de mar-jun 2026 da linha SAP 'Cache Write Input Tokens' com os cache_creation_input_tokens comunicados pela API foi inconsistente de mês para mês (provavelmente um efeito do limite do período de faturação, já que as escritas se concentram no início da sessão), pelo que, ao contrário do fator de leitura, não está estabelecido um rácio único. A predefinição 1.0 não aplica qualquer ajuste; mantenha-a em 1.0, a menos que a averiguação junto da SAP estabeleça um rácio de escrita firme.
schema.providers.aws-bedrock.label=Aws-bedrock
schema.providers.aws-bedrock.description=O fornecedor aws-bedrock, servido pelo mesmo caminho de pedido com formato Anthropic: as definições que todos os fornecedores têm, mais a versão de transmissão desse caminho e os seus dois filtros de flags beta - cada um dos quais o gateway, na verdade, lê de providers.anthropic, pelo que um valor aqui é aceite, mas fica inativo.
schema.providers.aws-bedrock.emulate_streaming_for_models.label=Emular streaming para modelos
schema.providers.aws-bedrock.emulate_streaming_for_models.description=Modelos cuja resposta o gateway recolhe na íntegra e depois reproduz como stream, porque a implementação não a consegue transmitir em stream por si própria. Comparado com o nome do modelo enviado a montante, exatamente ou sem o prefixo 'provider--'. Hoje usado apenas para os fornecedores anthropic e openai; uma entrada em qualquer outro fornecedor não tem efeito.
schema.providers.aws-bedrock.substitute_models.label=Modelos de substituição
schema.providers.aws-bedrock.substitute_models.description=Mudanças de nome de modelos para este fornecedor: um pedido que indique 'from' (correspondência exata, incluindo maiúsculas e minúsculas) é reencaminhado como 'to'; prevalece a primeira entrada correspondente e as mudanças de nome não se encadeiam. A resposta e a utilização registada para o custo indicam então o modelo reencaminhado, e não o nome que o cliente enviou. Lido nas rotas anthropic, aws-bedrock e google, na rota de chat completions do openrouter e nas rotas de previsão do SAP RPT (/sap/v1/rpt, a partir da lista sap-rpt), cada uma para o seu próprio fornecedor; em /openai/v1/chat/completions e /openai/v1/responses é consultada primeiro a lista openai e depois a lista perplexity.
schema.providers.aws-bedrock.substitute_models.items.from.label=De
schema.providers.aws-bedrock.substitute_models.items.from.description=O nome do modelo que o cliente envia.
schema.providers.aws-bedrock.substitute_models.items.to.label=Para
schema.providers.aws-bedrock.substitute_models.items.to.description=O nome do modelo reencaminhado para o SAP AI Core, normalmente um ID de modelo implementado como anthropic--claude-4.5-sonnet--deployed.
schema.providers.aws-bedrock.substitute_models.items.description.label=Descrição
schema.providers.aws-bedrock.substitute_models.items.description.description=Nota de texto livre sobre esta mudança de nome, para quem ler a configuração mais tarde. Atualmente ignorada pelo gateway; não altera em nada o comportamento da mudança de nome.
schema.providers.aws-bedrock.unsupported_params.label=Parâmetros não suportados
schema.providers.aws-bedrock.unsupported_params.description=Parâmetros de pedido que este fornecedor ou modelo não aceita. O gateway remove-os antes de reencaminhar para o SAP AI Core, que de outro modo rejeitaria o pedido com 400 "does not support parameters: [...]". Uma lista por modelo substitui a lista ao nível do fornecedor, em vez de a complementar.
schema.providers.aws-bedrock.param_renames.label=Mudanças de nome de parâmetros
schema.providers.aws-bedrock.param_renames.description=Mudanças de nome de parâmetros aplicadas no caminho de implementação direta, por exemplo max_tokens para max_completion_tokens nos modelos de raciocínio OpenAI que rejeitam max_tokens. Um mapa por modelo substitui o mapa ao nível do fornecedor, em vez de o complementar.
schema.providers.aws-bedrock.supports_responses_api.label=Suporta a Responses API
schema.providers.aws-bedrock.supports_responses_api.description=Indica se este fornecedor ou modelo pode ser servido em /openai/v1/responses. Se estiver ausente, mantém-se a regra de família integrada, que admite os modelos implementados GPT-5 e posteriores e a série o.
schema.providers.aws-bedrock.supports_prompt_caching.label=Suporta a colocação de prompts em cache
schema.providers.aws-bedrock.supports_prompt_caching.description=Indica se os modelos deste fornecedor recebem breakpoints de cache de prompt da Anthropic. Ordem de resolução: a flag models.overrides.<model>.supports_prompt_caching por modelo, depois esta flag ao nível do fornecedor, depois uma predefinição de true para o fornecedor anthropic e false para todos os outros. Definir false onde a cache funciona custa o preço total de entrada sem cache em cada turno, enquanto um true desnecessário foi medido como sem efeito - por isso, desative apenas para um modelo que se saiba que o rejeita.
schema.providers.aws-bedrock.anthropic_bedrock_version.label=Versão Anthropic Bedrock
schema.providers.aws-bedrock.anthropic_bedrock_version.description=A anthropic-version que o gateway envia para o SAP AI Core quando o cliente omite o cabeçalho anthropic-version. Lido apenas de providers.anthropic, pelo que uma cópia em qualquer outro fornecedor - incluindo aws-bedrock - não tem efeito. Se estiver ausente, é usado bedrock-2023-05-31.
schema.providers.aws-bedrock.excluded_beta_headers.label=Cabeçalhos beta excluídos
schema.providers.aws-bedrock.excluded_beta_headers.description=Flags beta da Anthropic removidas de um pedido antes de este ser reencaminhado, para funcionalidades que a implementação do SAP AI Core não aceita. Aplicadas em conjunto com as flags que o próprio gateway coloca em quarentena após um erro 400 'invalid beta flag' a montante. Lido apenas de providers.anthropic; uma lista em qualquer outro fornecedor não tem efeito.
