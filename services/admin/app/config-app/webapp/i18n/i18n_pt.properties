schema.providers.openai.openai_deployment_api_version.label=Versão da API de implementação Openai
schema.providers.openai.openai_deployment_api_version.description=Parâmetro api-version do Azure OpenAI acrescentado ao URL /chat/completions de um modelo OpenAI implementado. Lido apenas de providers.openai e enviado apenas para esse fornecedor, porque as implementações Perplexity rejeitam o parâmetro. Escrito como YYYY-MM-DD, opcionalmente com -preview. Se estiver ausente, não é acrescentada nenhuma api-version.
schema.providers.openrouter.label=Openrouter
schema.providers.openrouter.description=O fornecedor openrouter: as definições que todos os fornecedores têm, mais os seus preços de recurso e as suas predefinições de pedido por fornecedor a montante.
