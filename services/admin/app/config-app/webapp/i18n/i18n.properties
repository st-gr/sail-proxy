schema.providers.google.label=Google
schema.providers.google.description=The google provider, served by the gateway's Gemini request path. Only substitute_models is honoured today; the other common provider settings are not yet wired for this provider, so - unlike every other named provider here - they are rejected rather than merely inert.
schema.providers.google.substitute_models.label=Substitute Models
schema.providers.google.substitute_models.description=Model renames for this provider: a request naming 'from' (matched exactly, case included) is forwarded as 'to'; the first matching entry wins and renames do not chain. The response, and the usage recorded for cost, then name the forwarded model, not the name the client sent. Read on the anthropic, aws-bedrock and google routes, on the openrouter chat completions route and on the SAP RPT predict routes (/sap/v1/rpt, from the sap-rpt list), each for its own provider; on /openai/v1/chat/completions and /openai/v1/responses the openai list is consulted first, then the perplexity list.
schema.providers.google.substitute_models.items.from.label=From
schema.providers.google.substitute_models.items.from.description=The model name the client sends.
schema.providers.google.substitute_models.items.to.label=To
schema.providers.google.substitute_models.items.to.description=The model name forwarded to SAP AI Core, typically a deployed model id such as anthropic--claude-4.5-sonnet--deployed.
schema.providers.google.substitute_models.items.description.label=Description
schema.providers.google.substitute_models.items.description.description=Free-text note about this rename, for whoever reads the configuration later. Currently ignored by the gateway; it changes nothing about how the rename behaves.
schema.providers.openai.label=Openai
schema.providers.openai.description=The openai provider: the settings every provider carries, plus the Azure api-version appended to a deployed OpenAI model's URL.
schema.providers.openai.emulate_streaming_for_models.label=Emulate Streaming For Models
schema.providers.openai.emulate_streaming_for_models.description=Models whose answer the gateway collects in full and then replays as a stream, because the deployment cannot stream it itself. Matched against the model name sent upstream, either exactly or with the 'provider--' prefix removed. Used today for the anthropic and openai providers only; an entry under any other provider has no effect.
schema.providers.openai.substitute_models.label=Substitute Models
