schema.providers._entry.supports_prompt_caching.description=Whether this provider's models receive Anthropic prompt-cache breakpoints. Resolution order: the per-model models.overrides.<model>.supports_prompt_caching flag, then this provider-level flag, then a default of true for the anthropic provider and false for every other. Setting false where caching does work costs the full uncached input price on every turn, while a needless true was measured as a no-op - so opt out only for a model known to reject it.
schema.models.label=Models
schema.models.overrides.label=Overrides
schema.models.overrides.description=Per-model adjustments merged onto the model list the gateway fetches from SAP AI Core. Each key is a model's internal id, spelled exactly as it appears on the wire.
schema.models.overrides._entry.description=Adjustments for one model, merged onto what SAP AI Core reports for it and keyed above by the model's internal id. The merge is deliberately open: any key not listed below is copied onto the model verbatim and republished in the model list, unvalidated and untyped, rather than ignored. The fields below are the ones the gateway itself acts on.
schema.models.overrides._entry.hooks.label=Hooks
schema.models.overrides._entry.hooks.description=Hooks for this model, keyed by the request subpath they arm (invoke, invoke-with-response-stream, converse, ...). A subpath listed here REPLACES the endpoint default in hooks.defaults for that subpath rather than merging with it; a subpath not listed falls back to that default. A hook fires only when every rule in its request.match holds, and request.callback.id names the plugin to run.
schema.models.overrides._entry.hooks._entry.description=One subpath's hook list, tried in order. The same shape serves hooks.defaults.<endpoint>.<subpath> and models.overrides.<model>.hooks.<subpath>, so the gateway sees one shape whichever of the two supplied it. A hook fires only when EVERY rule its request.match names matches the request; request.callback.id then names the plugin to run for the phase in progress. A hook whose match does not hold, or whose callback names no plugin registered for that phase, is skipped and the next one is tried - neither is an error at runtime.
schema.models.overrides._entry.hooks._entry.items.request.label=Request
schema.models.overrides._entry.hooks._entry.items.request.description=What must match, and what to run when it does. Named for the request because the matcher only ever inspects the inbound request; there is no response counterpart, and nothing else on a hook is read.
schema.models.overrides._entry.hooks._entry.items.request.callback.label=Callback
schema.models.overrides._entry.hooks._entry.items.request.callback.description=The plugin to run once every rule in match has matched.
schema.models.overrides._entry.hooks._entry.items.request.callback.id.label=ID
schema.models.overrides._entry.hooks._entry.items.request.callback.id.description=The id a plugin registered itself under, looked up in the gateway's plugin registry for the phase being run. This schema cannot check the cross-reference: an id no plugin registered for that phase is logged as not found and the hook is skipped, so the request passes through unmodified rather than failing.
schema.models.overrides._entry.hooks._entry.items.request.match.label=Match
schema.models.overrides._entry.hooks._entry.items.request.match.description=The rule ids that must ALL match, evaluated in order and abandoned at the first that does not. Each id is a key in hooks.definitions - a cross-reference this schema cannot check: an id defined nowhere there logs a warning and makes the whole hook not match, so a typo silently disables the plugin rather than firing it unconditionally. An empty list is rejected, because a hook meant to run on almost everything is written by naming a deliberately broad rule instead - the shipped payload:any matches any request whose parsed body carries a non-empty string model, which is as close to unconditional as a rule gets and still says so out loud.
schema.models.overrides._entry.subpaths_native.label=Subpaths Native
schema.models.overrides._entry.subpaths_native.description=The subpaths this model serves natively, in the gateway's own spelling (invoke, invoke-with-response-stream, converse, converse-stream). Read as the complete list: while it is present, any subpath missing from it counts as emulated. Absent falls back to invoke plus invoke-with-response-stream. It replaces the model list's own value, is republished on the model entry, and an entry ending in -stream also feeds the streamingSupported rule below.
schema.models.overrides._entry.subpaths_emulated.label=Subpaths Emulated
schema.models.overrides._entry.subpaths_emulated.description=The subpaths this model reaches through gateway emulation rather than natively. Nothing routes on it - a subpath counts as emulated simply by being absent from subpaths_native - so the list is declarative only: it replaces the model list's own value and is republished on the model entry for clients that inspect it, and nothing more.
schema.models.overrides._entry.streamingSupported.label=StreamingSupported
schema.models.overrides._entry.streamingSupported.description=Whether this model supports streaming responses; camelCase because that is SAP AI Core's own spelling on the model list. For a model that has an overrides entry at all: an explicit true or false here wins; otherwise a subpaths_native entry ending in -stream means true, unless the model list already said false; otherwise a deployment-access model that has an entry but no explicit value is forced to FALSE - so adding an entry for a streaming deployment and omitting this flag switches streaming off. A foundation model keeps its AI-Core value. The result is applied to every version of the model.
schema.models.overrides._entry.supports_prompt_caching.label=Supports Prompt Caching
schema.models.overrides._entry.supports_prompt_caching.description=Whether this model receives Anthropic prompt-cache breakpoints. Resolution order: this per-model flag, then the provider-level api_config.providers.<provider>.supports_prompt_caching flag, then a default of true for Anthropic-provider models and false for all others. Set false to opt a model out; a true on an Anthropic model with no provider-level override changes nothing.
schema.models.overrides._entry.anthropic_version.label=Anthropic Version
schema.models.overrides._entry.anthropic_version.description=The anthropic_version the gateway puts into this model's Bedrock invoke request body when the caller supplied none. A body that already carries the field is left alone, and subpaths other than invoke are untouched. The shipped value is bedrock-2023-05-31.
schema.models.overrides._entry.pseudonymization.label=Pseudonymization
schema.models.overrides._entry.pseudonymization.description=Pseudonymization plugin settings. Activation (enabled) and the category toggles (entities) apply to this plugin only; masking happens just when the plugin actually runs for a request - it must be registered in the hook chain and an activation source must fire.
schema.models.overrides._entry.pseudonymization.enabled.label=Enabled
schema.models.overrides._entry.pseudonymization.enabled.description=Force-activates masking for a request. Read only where this block sits under models.overrides.<model>.pseudonymization or hooks.defaults.<endpoint>.pseudonymization: true there masks that request, with the per-model block winning over the per-endpoint one. False or absent forces nothing - masking can still run when another activation source fires, such as a trigger word or a masking field in the request body. Under observability.pseudonymization this key is currently ignored; that layer contributes every other setting here except method and allow_user_bypass. Either way the plugin must be wired into the hook chain, or nothing is masked at all.
schema.models.overrides._entry.pseudonymization.method.label=Method
schema.models.overrides._entry.pseudonymization.method.description=Masking mode: `pseudonymization` masks the request and unmasks the response; `anonymization` masks and never unmasks. Read only where this block force-activates masking (an enabled hook or model override), not under `observability.pseudonymization`. It also gates SIEM: only `pseudonymization` keeps the masked response, so under `anonymization` a content sink gets the prompt but not the response. Omitted, falls back to `pseudonymization`. Modes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.models.overrides._entry.pseudonymization.allow_user_bypass.label=Allow User Bypass
schema.models.overrides._entry.pseudonymization.allow_user_bypass.description=Consequential only inside a force-activation block (an enabled hook or model override); not read under `observability.pseudonymization`. Default false. When true, a caller may skip masking via header `x-sail-proxy-pseudonymization: off` (case-insensitive) or body field `pseudonymization_off: true`: the content reaches the LLM unmasked, and, where an enabled SIEM sink sets both `include_content` and `allow_unmasked_content`, that sink too. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.models.overrides._entry.pseudonymization.entities.label=Entities
schema.models.overrides._entry.pseudonymization.entities.description=Per-category masking toggles: `true` masks the category at this layer, `false` does not, and a category not listed inherits the layer below (later layers win). Keys are the known-category set: the on-by-default categories; three opt-in ones that ship off (`profile-org`, `profile-location`, `profile-ip-address`); and `profile-sensitive-data`, a blanket turning all on except those three. A key outside the set is rejected here. Categories and layers: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.models.overrides._entry.pseudonymization.org_suffixes.label=Org Suffixes
schema.models.overrides._entry.pseudonymization.org_suffixes.description=Legal-form suffixes that mark a run of words as an organisation name, e.g. Inc, LLC, GmbH. Matching is case-sensitive by design, so a lower-case 'limited' in prose is deliberately not treated as a legal form; each entry additionally matches fully upper-cased, so an invoice shouting ACME GMBH is recognised as the same organisation as Acme GmbH. It takes effect only while profile-org is enabled in entities; enabling profile-org with this list empty masks NOTHING as an organisation and logs one warning. Each entry is trimmed before matching, and an empty or whitespace-only entry is silently dropped rather than rejected.
schema.models.overrides._entry.pseudonymization.location_gazetteer.label=Location Gazetteer
schema.models.overrides._entry.pseudonymization.location_gazetteer.description=Literal location terms the structural detector masks - case-insensitive, and whole word or whole phrase only; nothing is inferred from capitalisation or context. It takes effect only while profile-location is enabled in entities; enabling profile-location with this list empty masks NOTHING as a location and logs one warning. Each entry is trimmed, and an empty or whitespace-only entry is silently dropped. Ships empty: place names are deployment-specific and this repository is public, so populate it through this admin config app, never in tracked code.
schema.models.overrides._entry.pseudonymization.min_confidence.label=Min Confidence
schema.models.overrides._entry.pseudonymization.min_confidence.description=How much evidence a detected value needs before masking, from 0 to 1 (default 0.5). A value is masked once its score reaches the bar; a plain capitalised name scores about 0.5, a checksum-validated pattern 0.95, a custom rule 1.0. Raising the bar drops plain names first, so tighten one noisy category with `thresholds` instead. Custom rules, validated identifiers and credentials are never lowered by their surroundings. Scoring detail: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.models.overrides._entry.pseudonymization.thresholds.label=Thresholds
schema.models.overrides._entry.pseudonymization.thresholds.description=Per-category confidence bars, each 0 to 1, overriding `min_confidence` for the categories named; one not listed keeps `min_confidence`. The place to be strict on a single noisy category - `profile-person` at 0.65 demands more evidence for names while validated identifiers stay at the global bar. Keys are the same known-category set `entities` takes; `profile-sensitive-data` is accepted but does nothing. Per-category tuning: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.models.overrides._entry.pseudonymization.allowlist.label=Allowlist
schema.models.overrides._entry.pseudonymization.allowlist.description=Values this deployment never masks - an OFF switch, per value. Consulted before the confidence score, so a listed value is exempt however much evidence there is. Use it for a recurring false positive with a name of its own - a product or report title that reads like a person. The layers' lists are CONCATENATED, not replaced, so a lower layer only adds an exemption, never drops one. `terms` vs `patterns`, and the over-broad-entry hazard: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.allowlist.terms.label=Terms
schema.models.overrides._entry.pseudonymization.allowlist.terms.description=Literal values, compared against the whole detected value and CASE-SENSITIVELY. Case-sensitive by design: 'Watson Studio' is the product an operator meant to exempt and 'watson studio' in a sentence is not, and a case-insensitive list would also exempt a person whose surname happens to share the spelling. A term only matches a value the detectors produced whole - listing 'Studio' does not exempt 'Watson Studio'. Every entry here is a masking OFF switch for that exact value, so keep the list to values that are genuinely never personal data: a term that happens to be someone's name exempts that person from masking everywhere in this deployment, silently and with nothing in the log to say so.
schema.models.overrides._entry.pseudonymization.allowlist.patterns.label=Patterns
schema.models.overrides._entry.pseudonymization.allowlist.patterns.description=Regular expressions (JavaScript), each matched against the WHOLE detected value: the gateway wraps every entry in `^(?: )$` itself, so write `Z[A-Z0-9_]+`, not `^Z[A-Z0-9_]+$`. Matching is case-sensitive. Every entry is a masking OFF switch, and a broad one disables masking without failing - `[A-Z].*` switches off almost every personal name detected. A match against a built-in PII sample warns but is STILL applied. Keep each entry narrow. Detail: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.models.overrides._entry.pseudonymization.saturation_warn.label=Saturation Warn
schema.models.overrides._entry.pseudonymization.saturation_warn.description=How many DISTINCT masked values one request may carry before it is reported as saturated (default 40). Reporting only - it never changes what is masked. Above the number the gateway logs one warning per request with per-category counts and the most common value SHAPES (letters as X, digits as 9); no masked value ever appears. The request's usage SIEM event carries the same counts with a `saturated` flag - counts, not text. Reading the report: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.models.overrides._entry.pseudonymization.unknown_placeholders.label=Invented placeholders
schema.models.overrides._entry.pseudonymization.unknown_placeholders.description=What happens when a response contains a masked placeholder the model was never sent. Models invent one in roughly 1 of 125 pseudonymized responses, and more often the more values a request masks; such a placeholder names nobody and can never be resolved. withhold (default): it is replaced with a plain marker such as [name withheld] and reported as a security event. report: it is only reported and reaches the client unchanged, for a deployment whose own developers write new placeholders into test fixtures through the gateway. off: neither. A placeholder the client itself sent in the same request is never treated as invented.
schema.models.overrides._entry.unsupported_params.label=Unsupported Params
schema.models.overrides._entry.unsupported_params.description=Request parameters this provider or model does not accept. The gateway removes them before forwarding to SAP AI Core, which would otherwise reject the request with 400 "does not support parameters: [...]". A per-model list replaces the provider-level list rather than adding to it.
schema.models.overrides._entry.param_renames.label=Param Renames
schema.models.overrides._entry.param_renames.description=Parameter renames applied on the direct-deployment path, for example max_tokens to max_completion_tokens for OpenAI reasoning models that reject max_tokens. A per-model map replaces the provider-level map rather than adding to it.
schema.models.overrides._entry.supports_responses_api.label=Supports Responses API
schema.models.overrides._entry.supports_responses_api.description=Whether this provider or model may be served on /openai/v1/responses. Absent leaves the built-in family rule in place, which admits deployed GPT-5 and later and the o-series.
schema.models.overrides._entry.cachePricing.label=CachePricing
schema.models.overrides._entry.cachePricing.description=Prompt-cache prices for this model; camelCase deliberately, a cache_pricing spelling is not read. Both values are decimal cost STRINGS per 1K tokens, never numbers: they are carried through unchanged onto every version's cost list and handed to whatever asks for this model's cache pricing. Absent means this model reports no cache pricing at all.
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.label=CacheReadInputCostPer1K
schema.models.overrides._entry.cachePricing.cacheReadInputCostPer1K.description=Cost of reading 1K cached input tokens, as a decimal string - e.g. 0.00020, not 0.0002e0 and not a number.
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.label=CacheCreationInputCostPer1K
schema.models.overrides._entry.cachePricing.cacheCreationInputCostPer1K.description=Cost of writing 1K input tokens into the cache, as a decimal string - e.g. 0.00254, not a number.
schema.models.overrides._entry.inject_beta_features.label=Inject Beta Features
schema.models.overrides._entry.inject_beta_features.description=Anthropic beta feature flags the gateway adds to this model's Bedrock invoke requests. They are merged with the anthropic-beta header and any anthropic_beta the request body carries, then filtered through supported_beta_headers, excluded_beta_headers and the runtime beta-flag quarantine - so a flag listed here is still dropped if it is not allowed through. An empty list injects nothing.
schema.models.overrides._entry.contextLength.label=ContextLength
schema.models.overrides._entry.contextLength.description=This model's context window in tokens, used only as a fallback: the gateway prefers the latest version's own context length from SAP AI Core and reads this value only when the model list carries none, before falling back to a per-family default. It is reported as context_length, and half of it as max_completion_tokens, in the OpenRouter- and OpenAI-format model lists. 0 is not a usable value.
schema.capabilities.label=Capabilities
schema.capabilities.web_search.label=Web Search
schema.capabilities.web_search.description=Hosted web search tool (Perplexity-backed). The one knob here bounds how many searches a single request may run.
schema.capabilities.web_search.max_searches_per_request.label=Max Searches Per Request
schema.capabilities.web_search.max_searches_per_request.description=Cap on hosted web searches one request may perform before the gateway stops continuing the turn. Each search costs a Perplexity call plus a full deployment round trip, so this is a cost control as well as the continuation loop's termination guarantee. A non-integer, zero, negative, or above-10 value falls back to the default of 3 rather than being honoured - the bound must never be configurable away.
schema.capabilities.file_search.label=File Search
schema.capabilities.file_search.description=OpenAI-compatible document retrieval: /v1/files ingestion, /v1/vector_stores, hybrid search and the hosted file_search tool. Nothing here is required - every field falls back to its own shipped default when absent, so deleting a field is a valid edit rather than an error.
schema.capabilities.file_search.enabled.label=Enabled
schema.capabilities.file_search.enabled.description=Master switch for the whole feature, default true. It is combined with "a database is configured" and "the migration has run": false makes every /v1/files and /v1/vector_stores route answer 503 file_search_unavailable. The ingestion worker (which also runs re-embedding) and the two sweepers check it only at startup, so after changing it restart the gateway. Files and stores already stored are left untouched.
schema.capabilities.file_search.embedding_model.label=Embedding Model
schema.capabilities.file_search.embedding_model.description=Embedding model requested from the SAP AI Core orchestration deployment, and recorded on every teacher-log event. Default text-embedding-3-large. Each vector store keeps the model it was built with: its searches and new files use that model, so changing this setting leaves existing stores untouched. They show as outdated in the Grounding cockpit, where their owner or an admin can re-embed them with the new model; until then they keep answering with their old vectors. A model with another vector width also needs embedding_dimensions changed, and re-embedding cannot change a store's width.
schema.capabilities.file_search.embedding_dimensions.label=Embedding Dimensions
schema.capabilities.file_search.embedding_dimensions.description=Vector width, sent as the embedding model's dimensions parameter and used to create the vector column. Default 1536, and fixed once a store exists: a response vector of any other length is refused, and every store pinned to the old width answers 409 - to a SEARCH as well as to an attach, so it stops answering queries and can never take another file. It stays listable, retrievable and deletable. Changing this on a populated deployment therefore strands its stores rather than migrating them: re-embedding from the Grounding cockpit keeps a store's width, so such a store needs an operator migration.
schema.capabilities.file_search.rewrite_query.label=Rewrite Query
schema.capabilities.file_search.rewrite_query.description=Whether POST /v1/vector_stores/{id}/search rewrites the caller's query through the orchestration deployment before embedding it. Default false. It costs about 1.3s per search and is best-effort - a failed rewrite falls back to the original query and never fails the search. Only that REST path reads this value, a per-request rewrite_query overrides it, and the hosted file_search TOOL always passes false because the model has already turned the user's turn into a query.
schema.capabilities.file_search.rewrite_query_model.label=Rewrite Query Model
schema.capabilities.file_search.rewrite_query_model.description=Model used for the rewrite call, default gpt-5-mini. Configurable rather than fixed because a model name valid on one SAP AI Core tenant may be rejected by another. Only consulted when rewrite_query is on.
schema.capabilities.file_search.hybrid.label=Hybrid
schema.capabilities.file_search.hybrid.description=Stage 1 recall and the optional stage 2 rerank. Stage 1 runs a vector-similarity ranking and - when lexical_enabled - a full-text ranking, fuses the two with reciprocal rank fusion, and hands the top `candidates` chunks to the reranker.
schema.capabilities.file_search.hybrid.rrf_k.label=RRF k
schema.capabilities.file_search.hybrid.rrf_k.description=Reciprocal-rank-fusion constant: each ranking contributes 1/(k + rank) to a chunk's fused score. Default 60. A larger k flattens the gap between neighbouring ranks, so agreement between the two rankings matters more than either one's own top hit; a smaller one lets each ranking's head dominate. Recorded on every teacher-log event, so a change is visible in the labels.
schema.capabilities.file_search.hybrid.lexical_enabled.label=Lexical Enabled
schema.capabilities.file_search.hybrid.lexical_enabled.description=Whether the full-text ranking runs beside the vector ranking. Default true. False fuses the vector ranking alone, so exact keyword and identifier matches that embeddings miss stop being recalled at all.
schema.capabilities.file_search.hybrid.lexical_query.label=Lexical Query
schema.capabilities.file_search.hybrid.lexical_query.description=How the full-text ranking matches the query. "any" (the default) keeps the query's words that are not common English or German stop words or a single character (a lone letter or digit) and matches a chunk that contains at least one of them, so a question written as a sentence still finds chunks with its key terms; chunks with more of the terms rank higher. "all" matches only chunks that contain every word of the query, stop words included - the behaviour of earlier versions, which a natural-language question rarely meets. Only applies while lexical_enabled is true.
schema.capabilities.file_search.hybrid.candidates.label=Candidates
schema.capabilities.file_search.hybrid.candidates.description=How many fused chunks stage 1 recalls, default 50. This is the reranker's input size and therefore its per-search cost, and it is also a hard ceiling on the answer: the caller's max_num_results is applied afterwards, so no search can return more chunks than this.
schema.capabilities.file_search.hybrid.rerank.label=Rerank
schema.capabilities.file_search.hybrid.rerank.description=Stage 2: a SAP AI Core-hosted Cohere cross-encoder scores the stage-1 candidates against the query and returns a calibrated relevance score between 0 and 1 - the score that ranking_options.score_threshold filters against.
schema.capabilities.file_search.hybrid.rerank.enabled.label=Enabled
schema.capabilities.file_search.hybrid.rerank.enabled.description=Tri-state, and the three values are not degrees of the same thing. false never reranks: no deployment lookup, no call, and results keep their fused order. "auto" (the default) is best-effort - no running reranker deployment, or a failed, timed-out or malformed call, falls back to the fused order rather than failing the search. true DEMANDS stage 2: both "no deployment found" and "the call failed" fail the search instead, so an operator who asked for reranking is never quietly served unreranked results.
schema.capabilities.file_search.hybrid.rerank.model.label=Model
schema.capabilities.file_search.hybrid.rerank.model.description=The model name both used to find the reranker deployment - the first RUNNING foundation-models deployment serving a model of exactly this name - and sent on the rerank call. Default "cohere-reranker" - verified live against the tenant, and NOT SAP's published "cohere-reranker-35". This is not a provider choice: the gateway speaks exactly one rerank protocol and only the model name varies, which is why the teacher log always records the provider as "cohere".
schema.capabilities.file_search.hybrid.rerank.input.label=Input
schema.capabilities.file_search.hybrid.rerank.input.description=What the reranker reads for each candidate chunk. "context_and_text" (the default): the chunk's context, where it has one, followed by its text; chunks without a context (static chunking) are read as their text. "text": the chunk text only. The context never appears in search results.
schema.capabilities.file_search.ann.label=Approximate Search
schema.capabilities.file_search.ann.description=Approximate vector search for large vector stores, through the HNSW index. Off by default: the vector ranking then compares the query with every chunk of the searched stores, which is exact but takes longer the larger the stores are. When enabled, a search uses the index only where it pays off and stays exact otherwise: with an attribute filter, when it searches at most exact_max_chunks chunks or less than min_fraction of all stored chunks, while the index is not yet the kind the rebuild-index command builds, and on pgvector older than 0.8. Approximate search can return a full list of passages that misses most of the best-matching chunks for some questions, so measure its recall on your own data with the recall probe before enabling it.
schema.capabilities.file_search.ann.enabled.label=Enabled
schema.capabilities.file_search.ann.enabled.description=Whether searches over large stores use the HNSW index. Default false: every search is exact. When the index returns fewer chunks than requested, the search runs exactly instead.
schema.capabilities.file_search.ann.exact_max_chunks.label=Exact Max Chunks
schema.capabilities.file_search.ann.exact_max_chunks.description=A search over at most this many chunks stays exact, counted over the stores it searches with one embedding model. Default 20000. The same number decides, whether or not approximate search is enabled, when the full-text part of a search is limited: a search over more chunks leaves out of its any-word query the words that more than 5 percent of all stored chunks contain, and ranks the passages with every word plus at most 5000 other full-text matches. On an analyzed table, 0 limits the full-text part of every search.
schema.capabilities.file_search.ann.min_fraction.label=Min Fraction
schema.capabilities.file_search.ann.min_fraction.description=A search over less than this share of all stored chunks stays exact: there, exact search is faster than the index. Default 0.05 (5 percent).
schema.capabilities.file_search.chunking.label=Chunking
schema.capabilities.file_search.chunking.description=How the documents of a NEW vector store are cut into chunks. A store takes these values when it is created and keeps them: changing them here never re-chunks or alters an existing store. The shipped configuration sets "structure" at 800 tokens without overlap, with contexts. A key that is not set means what this form shows for it: static chunking without contexts, so a configuration of an earlier release, or one without this block, keeps static chunking. Stores created before this setting existed use static chunking at 800/400. A file attached with an explicit static chunking_strategy is cut with that strategy instead; "auto" or none uses the store's setting. The values are checked when a store is created: chunk_overlap_tokens must not exceed half of max_chunk_size_tokens, and contextual requires the "structure" strategy. If the setting is invalid, new stores get static chunking at 800/400 instead and the gateway logs a warning.
schema.capabilities.file_search.chunking.strategy.label=Strategy
schema.capabilities.file_search.chunking.strategy.description="static" (the default when not set) cuts the text into overlapping windows of a fixed size, as OpenAI's static strategy and earlier releases do. "structure" (set in the shipped configuration) follows the document's sections and headings, so a chunk does not run across a section boundary; files cut this way report the chunking strategy type "other" through the OpenAI API. Turning contextual on requires "structure".
schema.capabilities.file_search.chunking.max_chunk_size_tokens.label=Max Chunk Size Tokens
schema.capabilities.file_search.chunking.max_chunk_size_tokens.description=Largest chunk, in tokens, between 100 and 4096. Default 800. With "static" the size is an estimate (word count times 1.3); with "structure" it is counted with a real tokenizer.
schema.capabilities.file_search.chunking.chunk_overlap_tokens.label=Chunk Overlap Tokens
schema.capabilities.file_search.chunking.chunk_overlap_tokens.description=How many tokens each chunk repeats from its predecessor, so a passage split across a boundary is still recalled whole. If not set: 0 with "structure", 400 with "static". Must not exceed half of max_chunk_size_tokens. With "structure" the overlap applies only inside a section that needs more than one chunk.
schema.capabilities.file_search.chunking.contextual.label=Contextual
schema.capabilities.file_search.chunking.contextual.description=Whether each chunk also gets a short context, written by a language model, that places it in its document and is searched with it. Off when not set. Requires the strategy "structure"; adds a model call per chunk at ingestion, recorded as usage of the store's owner.
schema.capabilities.file_search.contextual.label=Chunk contexts
schema.capabilities.file_search.contextual.description=How chunk contexts are written for vector stores whose chunking setting is contextual: at ingestion a language model writes a short context for each chunk, which is searched together with the chunk. These values do not turn contextual chunking on; the store's chunking setting does. A failed or timed-out call leaves that chunk without a context and never fails the file.
schema.capabilities.file_search.contextual.model.label=Model
schema.capabilities.file_search.contextual.model.description=The SAP AI Core orchestration model that writes the contexts. Default "gemini-3.5-flash-lite". If the model is not available, files are ingested without contexts. The document is sent with every chunk of a file; Claude models cache it between these calls, other models cache it where they do so on their own.
schema.capabilities.file_search.contextual.max_document_tokens.label=Max Document Tokens
schema.capabilities.file_search.contextual.max_document_tokens.description=Largest document, in tokens, that is sent whole with each chunk, between 8192 and 200000. Default 32000. A longer document is sent as an excerpt of this size around the chunk. Larger values give each context more of the document but cost more input tokens per chunk.
schema.capabilities.file_search.contextual.concurrency.label=Concurrency
schema.capabilities.file_search.contextual.concurrency.description=How many context calls for one file run at the same time, between 1 and 16. Default 4. The first chunk of a file always runs alone.
schema.capabilities.file_search.contextual.request_timeout_ms.label=Request Timeout Ms
schema.capabilities.file_search.contextual.request_timeout_ms.description=Time limit of one context call, in milliseconds. Default 30000. A call that takes longer leaves its chunk without a context.
schema.capabilities.file_search.contextual.file_deadline_ms.label=File Deadline Ms
schema.capabilities.file_search.contextual.file_deadline_ms.description=Time, in milliseconds, after which no further context call starts for a file. Default 360000 (6 minutes). The remaining chunks are stored without a context; the file is still ingested.
schema.capabilities.file_search.contextual.max_input_tokens_per_file.label=Max Input Tokens Per File
schema.capabilities.file_search.contextual.max_input_tokens_per_file.description=Input tokens the context calls of one file may use, cached tokens included, between 10000 and 1000000000. Default 20000000. Once a file has used them, no further context call starts for it; the remaining chunks are stored without a context and the file is still ingested.
schema.capabilities.file_search.parent_sections.label=Parent sections
schema.capabilities.file_search.parent_sections.description=How search results from vector stores with structure chunking are widened to the section they come from, so the model reads a match in its context. Several matches in one section are returned once, as that section. Results from stores with static chunking are returned as they are.
schema.capabilities.file_search.parent_sections.max_tokens.label=Max Tokens
schema.capabilities.file_search.parent_sections.max_tokens.description=Largest parent section returned, in tokens, between 200 and 8000. Default 1500. A longer section is returned as an excerpt of this size around the match; a match that is longer on its own is returned alone.
schema.capabilities.file_search.parent_sections.scope.label=Scope
schema.capabilities.file_search.parent_sections.scope.description=Where results are returned as parent sections: "tool" (the default) in the file_search tool of the Responses API only; "all" also in the vector store search endpoint, which otherwise returns the matching chunks; "off" nowhere.
schema.capabilities.file_search.limits.label=Limits
schema.capabilities.file_search.limits.description=Hard ceilings on what may be uploaded, extracted and attached. Each is enforced where it applies rather than by this schema, so these values are read live and take effect without a restart.
schema.capabilities.file_search.limits.max_file_bytes.label=Max File Bytes
schema.capabilities.file_search.limits.max_file_bytes.description=Largest upload POST /v1/files accepts, default 33554432 bytes (32 MiB). Enforced WHILE the upload is read rather than after it, so an oversized body is cut off instead of being buffered into memory, and the caller gets a clean 4xx naming the limit.
schema.capabilities.file_search.limits.max_tokens_per_file.label=Max Tokens Per File
schema.capabilities.file_search.limits.max_tokens_per_file.description=Largest extracted document, in estimated tokens; default 5000000. A file over the limit fails PERMANENTLY rather than being retried. Lowering this does not re-check files that are already ingested.
schema.capabilities.file_search.limits.max_files_per_store.label=Max Files Per Store
schema.capabilities.file_search.limits.max_files_per_store.description=Ceiling on files attached to one vector store, default 10000. It caps the file_ids accepted when a store is created - alongside a hard limit of 500 file ids per create or file batch call - and refuses an attach or a file batch that would take the store past it.
schema.capabilities.file_search.ingestion.label=Ingestion
schema.capabilities.file_search.ingestion.description=The background worker that extracts, chunks, embeds and stores an attached file, and re-embeds the files of a store whose embedding model is being changed - uploads first. It claims work from the same file_search database pool the search path uses, so these knobs trade ingestion throughput against search latency.
schema.capabilities.file_search.ingestion.concurrency.label=Concurrency
schema.capabilities.file_search.ingestion.concurrency.description=How many claim-and-process loops the worker starts, default 4; the same loops also run re-embedding. Each draws connections from the 10-connection file_search pool for its database steps. Read once at startup, so a change needs a restart.
schema.capabilities.file_search.ingestion.extract_timeout_ms.label=Extract Timeout Ms
schema.capabilities.file_search.ingestion.extract_timeout_ms.description=Time limit for converting one document to text with an external converter - PDF, docx, odt, epub and rst - default 60000 ms. Plain-text formats are decoded directly and have no limit. A timeout fails that attempt, not the batch; the file is retried up to max_retries.
schema.capabilities.file_search.ingestion.max_retries.label=Max Retries
schema.capabilities.file_search.ingestion.max_retries.description=Attempts per file before it is failed, default 3; the same budget applies to each file of a re-embed. An integer of 1 or more is used as written. 0 is read as 1, with a warning - taken literally it would fail every attached file before its first attempt. Anything else - negative, fractional, non-numeric - counts as unset and falls back to 3, also with a warning.
schema.capabilities.file_search.parsing.label=Document parsing
schema.capabilities.file_search.parsing.description=How uploaded documents are read before they are chunked.
schema.capabilities.file_search.parsing.ocr.label=Text recognition (OCR)
schema.capabilities.file_search.parsing.ocr.description=Text recognition for PDF pages without a text layer, such as scans. It runs where the tesseract program is installed (the Docker and Kyma images ship it with English); the npm standalone CLI never runs it.
schema.capabilities.file_search.parsing.ocr.languages.label=OCR languages
schema.capabilities.file_search.parsing.ocr.languages.description=Tesseract language codes recognised on a page, such as eng, deu or chi_sim; default eng. A code needs its language data installed where the gateway runs; one that is not installed is skipped with a warning in the gateway log. Each added language makes OCR slower.
schema.capabilities.file_search.parsing.vision.label=Vision transcription
schema.capabilities.file_search.parsing.vision.description=Transcription of hard PDF pages by a vision model of SAP AI Core: a page is sent as an image and the model writes out its text, tables included. It runs only for vector stores whose chunking setting has a vision mode (off by default; changing a store's mode chunks the store again). Each page is one model call, recorded as usage of the store's owner; a page whose call fails keeps its text or goes to OCR. Page images are not masked: where pseudonymization is force-enabled for file_search content (for the openai endpoint or for a model), they reach the model unmasked, and the cockpit and the gateway log warn about it. Masking that a single request asks for (a trigger word or a masking field) cannot be foreseen and is not warned about. The npm standalone CLI never runs it.
schema.capabilities.file_search.parsing.vision.model.label=Model
schema.capabilities.file_search.parsing.vision.model.description=The SAP AI Core orchestration model that transcribes the pages; it must read images. Default "gemini-3.5-flash-lite". If the model is not available, a vector store cannot be switched to a vision mode.
schema.capabilities.file_search.parsing.vision.default_mode.label=Default Mode
schema.capabilities.file_search.parsing.vision.default_mode.description=The vision mode new vector stores get: off (the default, no vision calls), no_text (pages without a text layer, such as scans), auto (those, pages with little text such as figures, and table-heavy pages) or all (every page). Existing stores keep their own mode. Where pseudonymization is force-enabled for file_search content, the page images reach the model unmasked (a warning is shown); the same holds, without a warning, for masking that a single request asks for.
schema.capabilities.file_search.parsing.vision.max_pages_per_file.label=Max Pages Per File
schema.capabilities.file_search.parsing.vision.max_pages_per_file.description=Most pages of one file sent to the model, between 1 and 1000. Default 50. The remaining pages keep their text or go to OCR.
schema.capabilities.file_search.parsing.vision.concurrency.label=Concurrency
schema.capabilities.file_search.parsing.vision.concurrency.description=How many pages of one file are transcribed at the same time, between 1 and 8. Default 2.
schema.capabilities.file_search.parsing.vision.request_timeout_ms.label=Request Timeout Ms
schema.capabilities.file_search.parsing.vision.request_timeout_ms.description=Time limit of one page's call, in milliseconds. Default 90000. A page whose call takes longer keeps its text or goes to OCR.
schema.capabilities.file_search.parsing.vision.file_deadline_ms.label=File Deadline Ms
schema.capabilities.file_search.parsing.vision.file_deadline_ms.description=Longest time, in milliseconds, that vision may spend on one file, and at most 40 % of the time left for the file's ingestion. Default 240000 (4 minutes). No further page starts after it; the file is still ingested.
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.label=Max Input Tokens Per File
schema.capabilities.file_search.parsing.vision.max_input_tokens_per_file.description=Input tokens the calls of one file may use, between 10000 and 100000000. Default 150000 (a page takes about 1250). Once a file has used them, no further page starts for it.
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.label=Max Output Tokens Per File
schema.capabilities.file_search.parsing.vision.max_output_tokens_per_file.description=Output tokens the calls of one file may use, between 10000 and 100000000. Default 120000. Once a file has used them, no further page starts for it.
schema.capabilities.file_search.blob_storage.label=Blob Storage
schema.capabilities.file_search.blob_storage.description=Where the raw uploaded bytes live. Content is addressed by its sha256 hash and reference-counted, so two uploads of identical content store one copy. The setting is read fresh on every access, so a change takes effect without a restart.
schema.capabilities.file_search.blob_storage.backend.label=Backend
schema.capabilities.file_search.blob_storage.backend.description=Where NEW uploads are stored. "db", the default, keeps the bytes inside the file_search Postgres database. "s3" writes them as objects to the bucket configured below (AWS or an S3-compatible endpoint) and keeps only their key in the database. Switching moves nothing: every blob is read from the storage it was written to, so existing blobs stay readable as long as that storage is reachable, and a migration from the Blob Storage panel of Grounding Administration moves them. "local" is not supported: every upload then answers 503 file_search_unavailable.
schema.capabilities.file_search.blob_storage.local_path.label=Local Path
schema.capabilities.file_search.blob_storage.local_path.description=Filesystem root reserved for a "local" backend, default /var/lib/sail-proxy/blobs. The gateway does not support "local" (see backend), so this value is not read.
schema.capabilities.file_search.blob_storage.s3.label=S3
schema.capabilities.file_search.blob_storage.s3.description=Bucket coordinates for the "s3" backend. Credentials are not configured here: they come from the gateway's FILE_SEARCH_S3_ACCESS_KEY_ID and FILE_SEARCH_S3_SECRET_ACCESS_KEY environment variables. Read whenever a blob stored in S3 is accessed - also while backend is "db" and blobs remain in S3 - and by a migration to or from S3. Changing the bucket, endpoint or prefix moves no objects: blobs written under the previous values cannot be read until those values are restored.
schema.capabilities.file_search.blob_storage.s3.bucket.label=Bucket
schema.capabilities.file_search.blob_storage.s3.bucket.description=Bucket name. It forms the host <bucket>.s3.<region>.amazonaws.com, or the path /<bucket>/<key> when endpoint is set. Ships empty: until it is set, an upload with backend "s3" answers 503 and a migration to S3 is refused.
schema.capabilities.file_search.blob_storage.s3.prefix.label=Prefix
schema.capabilities.file_search.blob_storage.s3.prefix.description=Key prefix every blob is stored under, default sail-proxy/blobs, so one bucket can hold blobs beside unrelated objects. Path segments of letters, digits, ".", "_" and "-", separated by "/". The gateway reads, writes and deletes only keys under this prefix and never lists the bucket. Give every file_search database its own prefix (or bucket): keys are derived from the file content, so two installations sharing a prefix share objects, and one deletes objects the other still uses.
schema.capabilities.file_search.blob_storage.s3.endpoint.label=Endpoint
schema.capabilities.file_search.blob_storage.s3.endpoint.description=Non-AWS S3 endpoint - MinIO, Ceph, or another S3-compatible gateway. When set, requests go to <endpoint>/<bucket>/<key> instead of the AWS host form. Empty, the default, means AWS.
schema.capabilities.file_search.blob_storage.s3.region.label=Region
schema.capabilities.file_search.blob_storage.s3.region.description=SigV4 signing region, and part of the hostname when no endpoint is set. Ships empty, and is still required for signing against an S3-compatible endpoint.
schema.capabilities.file_search.teacher_logging.label=Teacher Logging
schema.capabilities.file_search.teacher_logging.description=Records each search's candidates and the reranker's scores as teacher labels, for reranker evaluation and distillation. Fire-and-forget by construction: nothing waits for the write, and every failure surfaces only as a warning. All five fields are read live on the search path, so they can be changed from this cockpit without a restart.
schema.capabilities.file_search.teacher_logging.enabled.label=Enabled
schema.capabilities.file_search.teacher_logging.enabled.description=Whether search events are written at all. Off by default, so an install that predates this key never starts writing rows. Deliberately independent of store_chunk_text: turning logging on must never by itself start persisting document contents.
schema.capabilities.file_search.teacher_logging.store_chunk_text.label=Store Chunk Text
schema.capabilities.file_search.teacher_logging.store_chunk_text.description=Whether each candidate's chunk TEXT is stored beside its hash; off by default, and the text is left empty otherwise. That text is user document content, so this turns the label tables into a second copy of the corpus - the hash alone is enough to join labels back to chunks that still exist.
schema.capabilities.file_search.teacher_logging.sample_rate.label=Sample Rate
schema.capabilities.file_search.teacher_logging.sample_rate.description=Probability that a search is logged, from 0 to 1; default 1.0. 1 logs every search, 0 logs none, 0.1 logs about one in ten. This is the knob to lower when label volume is a problem - not max_concurrent_writes, which drops writes rather than thinning them.
schema.capabilities.file_search.teacher_logging.source.label=Source
schema.capabilities.file_search.teacher_logging.source.description=Free-text label written onto each search event, used whenever the caller passes none. Default "production", so an evaluation or backfill run can be told apart from production traffic when the labels are read back.
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.label=Max Concurrent Writes
schema.capabilities.file_search.teacher_logging.max_concurrent_writes.description=Ceiling on teacher-label writes in flight, default 2; surplus writes are dropped, not queued. Capped at the file_search database pool size of 10: above that the ceiling stops bounding anything, because the extra writes simply wait in the pool's own queue - turning "dropped, not queued" into "queued", the failure the bound exists to prevent. A larger value is clamped with a warning, so a hand-edited api_config.json cannot raise it either.
schema.capabilities.file_search.tool.label=Tool
schema.capabilities.file_search.tool.description=The hosted file_search TOOL block - the tool the model itself calls - as opposed to the raw POST /v1/vector_stores/{id}/search REST path the settings above govern. Each field is checked on read and falls back to its default rather than being coerced, because a hand-edited api_config.json reaches the gateway unvalidated.
schema.capabilities.file_search.tool.enabled.label=Enabled
schema.capabilities.file_search.tool.enabled.description=Read as a strict boolean, default true - a hand-edited "true" or 1 is not read as true and falls back to the default. Currently ignored by the gateway: nothing gates on the resolved value and the tool is offered either way, so setting this false does not hide the tool. Use file_search.enabled to turn the feature off.
schema.capabilities.file_search.tool.max_searches_per_request.label=Max Searches Per Request
schema.capabilities.file_search.tool.max_searches_per_request.description=How many file_search calls one request may make before the gateway stops continuing the turn. An integer from 1 to 10 is honoured; anything else - out of range, fractional, non-numeric - counts as unset and falls back to 3 with a warning, so an out-of-range value here is silently not the value that runs.
schema.capabilities.file_search.tool.max_num_results_default.label=Max Num Results Default
schema.capabilities.file_search.tool.max_num_results_default.description=Chunks returned when a tool call names no max_num_results of its own. An integer from 1 to 50 is honoured, anything else falls back to 10. That range is the same bound a per-call max_num_results is checked against, and OpenAI's own bound for the field. hybrid.candidates is still the hard ceiling on what a search can return.
schema.capabilities.hosted_tools.label=Hosted Tools
schema.capabilities.hosted_tools.description=Bounds for the hosted-tool result replay cache: how long a result stays replayable, and how many are held at once.
schema.capabilities.hosted_tools.result_cache_ttl_seconds.label=Result Cache Ttl Seconds
schema.capabilities.hosted_tools.result_cache_ttl_seconds.description=Optional. How long a hosted tool's results remain replayable by a client that replays the call item. A non-integer or out-of-range value falls back to the default of 3600 seconds, same as leaving this unset. A miss re-executes the recorded query rather than degrading the answer.
schema.capabilities.hosted_tools.result_cache_max_entries.label=Result Cache Max Entries
schema.capabilities.hosted_tools.result_cache_max_entries.description=Optional. How many hosted tool results are held in the replay cache at once. A non-integer or out-of-range value falls back to the default of 500 entries, same as leaving this unset. A miss re-executes the recorded query rather than degrading the answer.
schema.capabilities.namespace_tools.label=Namespace Tools
schema.capabilities.namespace_tools.description=How to handle Codex's `namespace` sub-agent wrapper tool, which SAP AI Core rejects outright with a 400.
schema.capabilities.namespace_tools.mode.label=Mode
schema.capabilities.namespace_tools.mode.description=`flatten` (default) lifts a namespace tool's nested function tools to the top level so the request is accepted, then restores the namespace on replayed calls so Codex can still route them. `strip` removes the namespace tool and its nested tools entirely. Any value other than these two falls back to flatten - the alternative is a hard 400 that kills the turn.
schema.capabilities.custom_tools.label=Custom Tools
schema.capabilities.custom_tools.description=Codex freeform `custom` tools (apply_patch). `translate` rewrites them into function tools, which both the deployed and orchestration routes accept; `strip` removes them, leaving the model to edit files through shell commands.
schema.capabilities.custom_tools.mode.label=Mode
schema.capabilities.custom_tools.mode.description=`translate` (default) rewrites the freeform custom tool into an ordinary function tool that both routes accept, appending grammar/format guidance to its description since a function tool cannot express a Lark grammar the way a custom tool can. `strip` removes custom tools entirely, leaving the model to edit files through shell commands instead. Any value other than these two falls back to translate - the alternative is a hard 400 that kills the turn.
schema.capabilities.tool_search.label=Tool Search
schema.capabilities.tool_search.description=Codex's `tool_search` deferred-tool discovery tool. `translate` rewrites it into a function tool, which both the deployed and orchestration routes accept; `strip` removes it, leaving the model unable to discover deferred tools such as MCP servers.
schema.capabilities.tool_search.mode.label=Mode
schema.capabilities.tool_search.mode.description=`translate` (default) rewrites the tool_search tool into an ordinary function tool that both routes accept. `strip` removes it entirely. Any value other than these two falls back to translate - the alternative is a hard 400 that kills the turn.
schema.capabilities.tool_search.hoist_discovered_tools.label=Hoist Discovered Tools
schema.capabilities.tool_search.hoist_discovered_tools.description=Lift tools discovered by tool_search into the request so the model can call them. Works around codex exposing deferred MCP tools only when the provider base_url is api.openai.com; set false once that is fixed upstream. Safe to leave on either way - names the client already declares are skipped.
schema.hooks.label=Hooks
schema.hooks.definitions.label=Definitions
schema.hooks.definitions.description=The named match rules a hook's request.match can name, keyed by rule id - the key IS the id. Every rule a hook lists must match for that hook to fire, and a rule id defined nowhere here logs a warning and makes the hook match nothing. Rules are cached per id at first use, so an edit takes effect on the next configuration reload rather than mid-process.
schema.hooks.definitions._entry.type.label=Type
schema.hooks.definitions._entry.type.description=Which part of the request the rule tests, and therefore which of the fields below apply. Load-bearing rather than descriptive: only these four values are understood, and anything else is logged as an unknown hook type and matches NOTHING - silently disabling every hook that names the rule.
schema.hooks.definitions._entry.name.label=Name
schema.hooks.definitions._entry.name.description=The request header a 'header' rule reads. Case-insensitive: the name is lowercased before the lookup, matching how the request pipeline normalises header names. A request that does not carry the header never matches. Empty is not 'any header' - such a rule could never fire - so it is rejected here rather than accepted.
schema.hooks.definitions._entry.path.label=Path
schema.hooks.definitions._entry.path.description=Dot-notation path into the parsed JSON request body for a 'json-path' or 'json-path-regex' rule. A leading '$.' is stripped, so '$.max_tokens' and 'max_tokens' address the same value; there is no further JSONPath support - no wildcards, filters or bracket syntax, and a segment containing a dot cannot be addressed. 'json-path' follows each segment literally, so a numeric segment indexes an array. 'json-path-regex' additionally lets a non-numeric segment take the first array element that carries it. A request with no parsed body, or a path resolving to nothing, does not match.
schema.hooks.definitions._entry.equals.label=Equals
schema.hooks.definitions._entry.equals.description=The value the addressed thing must equal - compared DIFFERENTLY per type. On a `header` rule it is NOT strict equality: media types are compared (the part before the first `;`, lowercased), so `application/json` also matches `application/json; charset=utf-8`. That exists because the strict compare it replaced let charset-appending clients bypass pseudonymization. An equals value that itself contains a `;` is compared exactly, so a rule can still pin a charset. On a `json-path` rule it IS strict equality. Matcher semantics: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.from.label=From
schema.hooks.definitions._entry.from.description=Inclusive lower bound for a 'header' rule matching a numeric header - content-length in every shipped rule. The header value is read as a base-10 integer and must land within [from, to]; a value that does not parse never matches. Read only when equals is absent AND both bounds are present: one bound alone is ignored and the rule degrades to a bare presence check on the header.
schema.hooks.definitions._entry.to.label=To
schema.hooks.definitions._entry.to.description=Inclusive upper bound for a 'header' rule matching a numeric header. There is no open-ended form: to express 'at least 10 KB' the shipped rules pair from with a deliberately huge to (size:min10kb uses 999999999), because omitting either bound turns the rule into a presence check. See from.
schema.hooks.definitions._entry.regex.label=Regex
schema.hooks.definitions._entry.regex.description=A JavaScript regular-expression source. A `json-path-regex` rule tests it against whatever the path resolved to (a string directly, an array element by element, any other object against its JSON form). A `url-regex` rule tests it against the request path and query string the gateway sees, NOT an absolute URL, so `^https?://` can never match. Compiled once and cached per rule; an expression the engine rejects counts as no match. Matcher semantics: https://st-gr.github.io/sail-proxy/developer/plugins#matcher-semantics-equals-and-regex
schema.hooks.definitions._entry.flags.label=Flags
schema.hooks.definitions._entry.flags.description=Regular-expression flags applied to regex, e.g. 'i' for case-insensitive. Restricted to the letters the engine actually accepts, because any other value makes compilation fail and that failure is reported as no match - the rule would then silently never fire. Flags are part of the compiled-expression cache key, so two rules differing only in flags do not share one compiled expression. Avoid 'g': a compiled global expression is reused across requests and advances its own position, so such a rule matches every other time.
schema.hooks.definitions._entry.desc.label=Desc
schema.hooks.definitions._entry.desc.description=Free-text note about what this rule is for. Currently ignored by the gateway; it documents the rule for whoever edits this file and has no effect on matching.
schema.hooks.defaults.label=Defaults
schema.hooks.defaults.description=Per-endpoint default hooks, keyed by the endpoint identifier the route uses - 'anthropic', 'openai' and 'aws-bedrock' today, and 'google' (subpaths generateContent, streamGenerateContent, embedContent). Consulted only when the requested model has no models.overrides.<model>.hooks entry for the subpath: a per-model entry REPLACES the endpoint default for that subpath rather than merging with it.
schema.hooks.defaults._entry.description=One endpoint's defaults: the optional pseudonymization force-activation block, plus one hook list per request subpath (invoke, invoke-with-response-stream, responses, responses-stream). Unknown keys are rejected, because every other key here is read as a subpath and no route asks for a subpath this endpoint does not serve - so an unrecognised key is a typo that would never run rather than a setting. The subpath pattern deliberately excludes 'pseudonymization', so that key is not also required to be a hook list.
schema.hooks.defaults._entry.pseudonymization.label=Pseudonymization
schema.hooks.defaults._entry.pseudonymization.description=Pseudonymization plugin settings. Activation (enabled) and the category toggles (entities) apply to this plugin only; masking happens just when the plugin actually runs for a request - it must be registered in the hook chain and an activation source must fire.
schema.hooks.defaults._entry.pseudonymization.enabled.label=Enabled
schema.hooks.defaults._entry.pseudonymization.enabled.description=Force-activates masking for a request. Read only where this block sits under models.overrides.<model>.pseudonymization or hooks.defaults.<endpoint>.pseudonymization: true there masks that request, with the per-model block winning over the per-endpoint one. False or absent forces nothing - masking can still run when another activation source fires, such as a trigger word or a masking field in the request body. Under observability.pseudonymization this key is currently ignored; that layer contributes every other setting here except method and allow_user_bypass. Either way the plugin must be wired into the hook chain, or nothing is masked at all.
schema.hooks.defaults._entry.pseudonymization.method.label=Method
schema.hooks.defaults._entry.pseudonymization.method.description=Masking mode: `pseudonymization` masks the request and unmasks the response; `anonymization` masks and never unmasks. Read only where this block force-activates masking (an enabled hook or model override), not under `observability.pseudonymization`. It also gates SIEM: only `pseudonymization` keeps the masked response, so under `anonymization` a content sink gets the prompt but not the response. Omitted, falls back to `pseudonymization`. Modes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.label=Allow User Bypass
schema.hooks.defaults._entry.pseudonymization.allow_user_bypass.description=Consequential only inside a force-activation block (an enabled hook or model override); not read under `observability.pseudonymization`. Default false. When true, a caller may skip masking via header `x-sail-proxy-pseudonymization: off` (case-insensitive) or body field `pseudonymization_off: true`: the content reaches the LLM unmasked, and, where an enabled SIEM sink sets both `include_content` and `allow_unmasked_content`, that sink too. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.hooks.defaults._entry.pseudonymization.entities.label=Entities
schema.hooks.defaults._entry.pseudonymization.entities.description=Per-category masking toggles: `true` masks the category at this layer, `false` does not, and a category not listed inherits the layer below (later layers win). Keys are the known-category set: the on-by-default categories; three opt-in ones that ship off (`profile-org`, `profile-location`, `profile-ip-address`); and `profile-sensitive-data`, a blanket turning all on except those three. A key outside the set is rejected here. Categories and layers: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.hooks.defaults._entry.pseudonymization.org_suffixes.label=Org Suffixes
schema.hooks.defaults._entry.pseudonymization.org_suffixes.description=Legal-form suffixes that mark a run of words as an organisation name, e.g. Inc, LLC, GmbH. Matching is case-sensitive by design, so a lower-case 'limited' in prose is deliberately not treated as a legal form; each entry additionally matches fully upper-cased, so an invoice shouting ACME GMBH is recognised as the same organisation as Acme GmbH. It takes effect only while profile-org is enabled in entities; enabling profile-org with this list empty masks NOTHING as an organisation and logs one warning. Each entry is trimmed before matching, and an empty or whitespace-only entry is silently dropped rather than rejected.
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.label=Location Gazetteer
schema.hooks.defaults._entry.pseudonymization.location_gazetteer.description=Literal location terms the structural detector masks - case-insensitive, and whole word or whole phrase only; nothing is inferred from capitalisation or context. It takes effect only while profile-location is enabled in entities; enabling profile-location with this list empty masks NOTHING as a location and logs one warning. Each entry is trimmed, and an empty or whitespace-only entry is silently dropped. Ships empty: place names are deployment-specific and this repository is public, so populate it through this admin config app, never in tracked code.
schema.hooks.defaults._entry.pseudonymization.min_confidence.label=Min Confidence
schema.hooks.defaults._entry.pseudonymization.min_confidence.description=How much evidence a detected value needs before masking, from 0 to 1 (default 0.5). A value is masked once its score reaches the bar; a plain capitalised name scores about 0.5, a checksum-validated pattern 0.95, a custom rule 1.0. Raising the bar drops plain names first, so tighten one noisy category with `thresholds` instead. Custom rules, validated identifiers and credentials are never lowered by their surroundings. Scoring detail: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.hooks.defaults._entry.pseudonymization.thresholds.label=Thresholds
schema.hooks.defaults._entry.pseudonymization.thresholds.description=Per-category confidence bars, each 0 to 1, overriding `min_confidence` for the categories named; one not listed keeps `min_confidence`. The place to be strict on a single noisy category - `profile-person` at 0.65 demands more evidence for names while validated identifiers stay at the global bar. Keys are the same known-category set `entities` takes; `profile-sensitive-data` is accepted but does nothing. Per-category tuning: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.hooks.defaults._entry.pseudonymization.allowlist.label=Allowlist
schema.hooks.defaults._entry.pseudonymization.allowlist.description=Values this deployment never masks - an OFF switch, per value. Consulted before the confidence score, so a listed value is exempt however much evidence there is. Use it for a recurring false positive with a name of its own - a product or report title that reads like a person. The layers' lists are CONCATENATED, not replaced, so a lower layer only adds an exemption, never drops one. `terms` vs `patterns`, and the over-broad-entry hazard: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.label=Terms
schema.hooks.defaults._entry.pseudonymization.allowlist.terms.description=Literal values, compared against the whole detected value and CASE-SENSITIVELY. Case-sensitive by design: 'Watson Studio' is the product an operator meant to exempt and 'watson studio' in a sentence is not, and a case-insensitive list would also exempt a person whose surname happens to share the spelling. A term only matches a value the detectors produced whole - listing 'Studio' does not exempt 'Watson Studio'. Every entry here is a masking OFF switch for that exact value, so keep the list to values that are genuinely never personal data: a term that happens to be someone's name exempts that person from masking everywhere in this deployment, silently and with nothing in the log to say so.
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.label=Patterns
schema.hooks.defaults._entry.pseudonymization.allowlist.patterns.description=Regular expressions (JavaScript), each matched against the WHOLE detected value: the gateway wraps every entry in `^(?: )$` itself, so write `Z[A-Z0-9_]+`, not `^Z[A-Z0-9_]+$`. Matching is case-sensitive. Every entry is a masking OFF switch, and a broad one disables masking without failing - `[A-Z].*` switches off almost every personal name detected. A match against a built-in PII sample warns but is STILL applied. Keep each entry narrow. Detail: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.hooks.defaults._entry.pseudonymization.saturation_warn.label=Saturation Warn
schema.hooks.defaults._entry.pseudonymization.saturation_warn.description=How many DISTINCT masked values one request may carry before it is reported as saturated (default 40). Reporting only - it never changes what is masked. Above the number the gateway logs one warning per request with per-category counts and the most common value SHAPES (letters as X, digits as 9); no masked value ever appears. The request's usage SIEM event carries the same counts with a `saturated` flag - counts, not text. Reading the report: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.label=Invented placeholders
schema.hooks.defaults._entry.pseudonymization.unknown_placeholders.description=What happens when a response contains a masked placeholder the model was never sent. Models invent one in roughly 1 of 125 pseudonymized responses, and more often the more values a request masks; such a placeholder names nobody and can never be resolved. withhold (default): it is replaced with a plain marker such as [name withheld] and reported as a security event. report: it is only reported and reaches the client unchanged, for a deployment whose own developers write new placeholders into test fixtures through the gateway. off: neither. A placeholder the client itself sent in the same request is never treated as invented.
schema.hooks.defaults._entry._entry.description=One subpath's hook list, tried in order. The same shape serves hooks.defaults.<endpoint>.<subpath> and models.overrides.<model>.hooks.<subpath>, so the gateway sees one shape whichever of the two supplied it. A hook fires only when EVERY rule its request.match names matches the request; request.callback.id then names the plugin to run for the phase in progress. A hook whose match does not hold, or whose callback names no plugin registered for that phase, is skipped and the next one is tried - neither is an error at runtime.
schema.hooks.defaults._entry._entry.items.request.label=Request
schema.hooks.defaults._entry._entry.items.request.description=What must match, and what to run when it does. Named for the request because the matcher only ever inspects the inbound request; there is no response counterpart, and nothing else on a hook is read.
schema.hooks.defaults._entry._entry.items.request.callback.label=Callback
schema.hooks.defaults._entry._entry.items.request.callback.description=The plugin to run once every rule in match has matched.
schema.hooks.defaults._entry._entry.items.request.callback.id.label=ID
schema.hooks.defaults._entry._entry.items.request.callback.id.description=The id a plugin registered itself under, looked up in the gateway's plugin registry for the phase being run. This schema cannot check the cross-reference: an id no plugin registered for that phase is logged as not found and the hook is skipped, so the request passes through unmodified rather than failing.
schema.hooks.defaults._entry._entry.items.request.match.label=Match
schema.hooks.defaults._entry._entry.items.request.match.description=The rule ids that must ALL match, evaluated in order and abandoned at the first that does not. Each id is a key in hooks.definitions - a cross-reference this schema cannot check: an id defined nowhere there logs a warning and makes the whole hook not match, so a typo silently disables the plugin rather than firing it unconditionally. An empty list is rejected, because a hook meant to run on almost everything is written by naming a deliberately broad rule instead - the shipped payload:any matches any request whose parsed body carries a non-empty string model, which is as close to unconditional as a rule gets and still says so out loud.
schema.platform.label=Platform
schema.platform.billing.label=Billing
schema.platform.billing.description=SAP AI Core billing classification for this subaccount. Read only by the admin app's SAP-native Capacity-Unit cost accounting, never by the gateway request path.
schema.platform.billing.productive.label=Productive
schema.platform.billing.productive.description=Whether SAP classifies this subaccount/tenant as PRODUCTIVE for SAP AI Core billing. isProductive() in sapCapacityService reads it to pick the SapCapacityUnitPrice row - productive vs non-productive $/CU - used to price Capacity Units. SAP's classification does not always match the environment's name (a Sandbox subaccount can be classified productive), so set this to what your SAP invoice/subaccount actually is. Default false = non-productive.
schema.platform.billing.cuFactor.label=CU Factor
schema.platform.billing.cuFactor.description=SAP GenAI-token to Capacity-Unit conversion factor (SAP Note 3437766; uniform across bills, not published per model). cuFactor() in sapCapacityService reads it - capacityUnits = genAiTokens x this factor, applied to every usage event globally (not per usage type), for both live capture and the retroactive recalc. Change only if SAP republishes the CU conversion. Default 1.90385. A value of 0 is treated as unset and falls back to the default.
schema.platform.timeouts.label=Timeouts
schema.platform.timeouts.description=Per-request timeout ceilings the gateway applies to outbound LLM calls.
schema.platform.timeouts.default.label=Default
schema.platform.timeouts.default.description=Timeout in milliseconds for non-streaming requests, from 1000 to 3600000. Unset or zero falls back to 120000 ms (120 seconds).
schema.platform.timeouts.streaming.label=Streaming
schema.platform.timeouts.streaming.description=Timeout in milliseconds for streaming requests, from 1000 to 3600000. Unset or zero falls back to 240000 ms (240 seconds).
schema.platform.logging.label=Logging
schema.platform.logging.description=Gateway log level and destination. Read by the shared logger at startup, and again whenever the gateway re-initializes it after a configuration change.
schema.platform.logging.components.label=Components
schema.platform.logging.components.description=Per-component log level override, keyed by the component name exactly as the gateway logs it - for example 'ConfigService' or 'AwsBedrockService'. A component with no entry here uses LOG_LEVEL when it is set, otherwise defaultLevel. An entry outranks LOG_LEVEL for its own component, so a pinned component ignores the environment; the shipped configuration carries no entries.
schema.platform.logging.components._entry.description=Log level for this component, overriding defaultLevel while it is present. It is matched case-insensitively against the levels the logger implements (trace, debug, info, warn, error); a value it does not recognize is silently ignored, leaving the previously effective level in place rather than raising an error.
schema.platform.logging.defaultLevel.label=DefaultLevel
schema.platform.logging.defaultLevel.description=Log level for any component with no entry in `components`. If `LOG_LEVEL` is set to a recognized level it takes precedence and this field is ignored - and `LOG_LEVEL` ships set in both .env samples and the Kyma manifests, so in a stock deployment the environment wins. Otherwise it is matched case-insensitively against the logger's levels (trace, debug, info, warn, error); an unrecognized value is silently ignored. Precedence: https://st-gr.github.io/sail-proxy/developer/debugging#log-level-resolution
schema.platform.logging.log_folder_path.label=Log Folder Path
schema.platform.logging.log_folder_path.description=Directory the gateway writes its own log files to and - when payload_logging_enabled is true - request and response payload dumps, under a payloads/ subdirectory. Falls back to ./logs when unset.
schema.platform.logging.payload_logging_enabled.label=Payload Logging Enabled
schema.platform.logging.payload_logging_enabled.description=When true, writes full request and response bodies to log_folder_path/payloads for debugging. Known-sensitive headers are redacted, but body content is written as-is, so leave this off outside active debugging. Off by default. The PAYLOAD_LOGGING_ENABLED environment variable, when set to true or false, overrides this value.
schema.platform.rate_limit_handling.label=Rate Limit Handling
schema.platform.rate_limit_handling.description=Automatic backoff the gateway applies after a provider signals a rate limit - an HTTP 429, or an error message matching a rate-limit keyword. Purely reactive: it delays retries once a rate limit has been seen for a model and subpath, it does not throttle traffic beforehand.
schema.platform.rate_limit_handling.enabled.label=Enabled
schema.platform.rate_limit_handling.enabled.description=Master switch for rate-limit backoff. When false or absent, the delay is always 0 seconds and the rest of this section has no effect.
schema.platform.rate_limit_handling.default_delay_seconds.label=Default Delay Seconds
schema.platform.rate_limit_handling.default_delay_seconds.description=Delay in seconds applied when a rate limit is detected and neither subpath_specific_delays nor model_specific_delays has an entry for the endpoint. Falls back to 30 when unset or zero.
schema.platform.rate_limit_handling.backoff_multiplier.label=Backoff Multiplier
schema.platform.rate_limit_handling.backoff_multiplier.description=Multiplier applied to the previous delay on each consecutive rate limit for the same model and subpath: the new delay is the previous one times this, capped at max_delay_seconds. Falls back to 1.5 when unset or zero; keep it at 1 or above, or each consecutive rate limit would wait less rather than more.
schema.platform.rate_limit_handling.max_delay_seconds.label=Max Delay Seconds
schema.platform.rate_limit_handling.max_delay_seconds.description=Ceiling in seconds that the consecutive-rate-limit backoff above cannot exceed. Falls back to 300 when unset or zero.
schema.platform.rate_limit_handling.model_specific_delays.label=Model Specific Delays
schema.platform.rate_limit_handling.model_specific_delays.description=Per-model delay override in seconds, keyed by the model id exactly as configured under providers and models - for example 'anthropic--claude-4-opus--deployed'. Checked after subpath_specific_delays and before default_delay_seconds; a delay of 0 here counts as no override, because only a non-zero entry is used.
schema.platform.rate_limit_handling.model_specific_delays._entry.description=Delay in seconds applied for this model when it is rate limited.
schema.platform.rate_limit_handling.subpath_specific_delays.label=Subpath Specific Delays
schema.platform.rate_limit_handling.subpath_specific_delays.description=Per-subpath delay override in seconds, keyed by the gateway API subpath - for example 'converse-stream' or 'invoke-with-response-stream'. Checked first, before model_specific_delays and default_delay_seconds; a delay of 0 here counts as no override, because only a non-zero entry is used.
schema.platform.rate_limit_handling.subpath_specific_delays._entry.description=Delay in seconds applied for this subpath when it is rate limited.
schema.platform.security.label=Security
schema.platform.security.description=Ingress concerns.
schema.platform.security.trust_forwarded_for.label=Trust Forwarded For
schema.platform.security.trust_forwarded_for.description=Trust client-supplied X-Forwarded-For and X-Real-IP headers - and the client IP the web framework derives from them - when recording the client IP on security events, instead of using the raw socket peer address. Enable it only behind a proxy that overwrites those headers rather than passing through whatever the client sent; otherwise a client can spoof its own recorded IP.
schema.platform.security.credentialExpirationDays.label=Credential Expiration (days)
schema.platform.security.credentialExpirationDays.description=Days a credential stays valid: an API key or AWS credential is created with expiresAt = now + this many days, and every refresh (rotation) moves expiresAt to now + this many days again. Absent or invalid values fall back to 90. Credentials created before expiration existed have no date and never expire until an administrator sets one.
schema.platform.quotas.label=Quotas
schema.platform.quotas.description=Platform-wide default quotas per user, enforced by the gateway on every LLM request. A user's own constraint (Users & Quotas app) overrides each field; null = unlimited. Windows are UTC calendar day, ISO week (Monday 00:00 UTC) and calendar month; spend is the SAP cost plus the Connections cost in the currency of the SAP capacity unit price.
schema.platform.quotas.requestsPerMinute.label=Requests per Minute
schema.platform.quotas.requestsPerMinute.description=Requests per user per sliding minute. Per-credential limits (RateLimits) apply as well; a request must pass both.
schema.platform.quotas.spendPerDay.label=Spend per Day
schema.platform.quotas.spendPerDay.description=SAP cost plus Connections cost per user per UTC day.
schema.platform.quotas.spendPerWeek.label=Spend per Week
schema.platform.quotas.spendPerWeek.description=SAP cost plus Connections cost per user per ISO week.
schema.platform.quotas.spendPerMonth.label=Spend per Month
schema.platform.quotas.spendPerMonth.description=SAP cost plus Connections cost per user per calendar month.
schema.platform.quotas.tokensPerDay.label=Tokens per Day
schema.platform.quotas.tokensPerDay.description=Input, output and cache-write tokens per user per UTC day; cache reads are not counted.
schema.platform.quotas.tokensPerWeek.label=Tokens per Week
schema.platform.quotas.tokensPerWeek.description=Input, output and cache-write tokens per user per ISO week; cache reads are not counted.
schema.platform.quotas.tokensPerMonth.label=Tokens per Month
schema.platform.quotas.tokensPerMonth.description=Input, output and cache-write tokens per user per calendar month; cache reads are not counted.
schema.platform.toolGovernance.label=Tool Governance
schema.platform.toolGovernance.description=Tool governance: how long the per-request tool usage rows and their daily aggregates are kept, and how each client program spells the MCP tools it hosts itself.
schema.platform.toolGovernance.mcpNaming.label=MCP naming
schema.platform.toolGovernance.mcpNaming.description=A client that runs its own MCP servers sends no MCP tool type: Claude Code declares each tool as mcp__server__tool, while codex reaches them inside its own exec tool. These conventions turn such a name into the mcp:server/tool identity a policy pattern can match, so a client nobody has measured yet is a configuration change rather than a release.
schema.platform.toolGovernance.mcpNaming.namePattern.label=Tool name pattern
schema.platform.toolGovernance.mcpNaming.namePattern.description=Regular expression matched against a declared tool name; the first group is the MCP server, the second the tool. The default reads mcp__codex_apps__sites_create_site as server codex_apps and tool sites_create_site.
schema.platform.toolGovernance.mcpNaming.clients.label=Client programs
schema.platform.toolGovernance.mcpNaming.clients.description=One entry per client program. The first whose User Agent text appears in the request's own applies; a request that matches none is still governed by what it declares. A list given here replaces the built-in presets entirely; an entry missing name, userAgent or containerTools is skipped.
schema.platform.toolGovernance.mcpNaming.clients.items.name.label=Name
schema.platform.toolGovernance.mcpNaming.clients.items.name.description=How this client is referred to in the cockpit and the logs, for example claude-code.
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.label=User Agent
schema.platform.toolGovernance.mcpNaming.clients.items.userAgent.description=Text that identifies the client in the request's User Agent header, for example claude-cli. Matched case-insensitively anywhere in the header.
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.label=Container tools
schema.platform.toolGovernance.mcpNaming.clients.items.containerTools.description=Tools whose call body may reach nested MCP tools, such as codex's exec. Empty for a client that declares its MCP tools directly, which is the common case.
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.label=Nested call pattern
schema.platform.toolGovernance.mcpNaming.clients.items.nestedCallPattern.description=Regular expression finding a nested tool's name inside a container tool's call body; the first group is the name. Only the names are read, never the arguments.
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.label=Tool name pattern
schema.platform.toolGovernance.mcpNaming.clients.items.namePattern.description=Regular expression that replaces the shared tool name pattern for this client only; the first group is the MCP server, the second the tool, and a name counts only when both groups are non-empty. Matching is case-sensitive and finds the pattern anywhere in the name unless it is anchored with ^ and $. Leave it out to use the shared pattern. An empty or invalid expression matches nothing by pattern for this client (it does not fall back to the shared one), though Server names still apply.
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.label=Server names
schema.platform.toolGovernance.mcpNaming.clients.items.serverNames.description=The MCP servers this installation runs, for a client whose tool names carry no marker, such as opencode, which declares tool ping_probe of server probe as probe_ping_probe. A declared tool named <server>_<tool> then becomes the mcp:server/tool identity; the name pattern is tried first, then the servers in list order, and the first matching server wins. Server names are case-sensitive. Empty entries are ignored. Leave the list empty and such tools stay ordinary function tools.
schema.platform.toolGovernance.retention.label=Retention
schema.platform.toolGovernance.retention.rawDays.label=Tool usage retention (days)
schema.platform.toolGovernance.retention.rawDays.description=Days a per-request tool usage row is kept before the nightly purge removes it. The daily aggregates keep the totals.
schema.platform.toolGovernance.retention.dailyDays.label=Tool usage aggregate retention (days)
schema.platform.toolGovernance.retention.dailyDays.description=Days a daily tool usage aggregate (per user, tool and day) is kept. The inventory and the user page read these.
schema.platform.maintenance.label=Maintenance
schema.platform.maintenance.description=When the admin service runs its daily maintenance: the cost recalculation, the usage-bucket rebuild and the republish of every user's quota document.
schema.platform.maintenance.dailyRunAtUtc.label=Daily Run At (UTC)
schema.platform.maintenance.dailyRunAtUtc.description=Time of day, in UTC, as HH:MM (24-hour), at which the daily maintenance run starts. Unset: the run starts 5 minutes after the admin service starts and every 24 hours from then, so a midday redeploy pins it to midday. Set: the first run still starts 5 minutes after startup; every later run starts at this time each day. Example: to run at midnight Pacific Time enter 08:00 while Pacific Standard Time is in effect (UTC-8) or 07:00 during Pacific Daylight Time (UTC-7) - the value is not adjusted for daylight saving.
schema.observability.label=Observability
schema.observability.pseudonymization.label=Pseudonymization
schema.observability.pseudonymization.description=Pseudonymization plugin settings. Activation (enabled) and the category toggles (entities) apply to this plugin only; masking happens just when the plugin actually runs for a request - it must be registered in the hook chain and an activation source must fire.
schema.observability.pseudonymization.enabled.label=Enabled
schema.observability.pseudonymization.enabled.description=Force-activates masking for a request. Read only where this block sits under models.overrides.<model>.pseudonymization or hooks.defaults.<endpoint>.pseudonymization: true there masks that request, with the per-model block winning over the per-endpoint one. False or absent forces nothing - masking can still run when another activation source fires, such as a trigger word or a masking field in the request body. Under observability.pseudonymization this key is currently ignored; that layer contributes every other setting here except method and allow_user_bypass. Either way the plugin must be wired into the hook chain, or nothing is masked at all.
schema.observability.pseudonymization.method.label=Method
schema.observability.pseudonymization.method.description=Masking mode: `pseudonymization` masks the request and unmasks the response; `anonymization` masks and never unmasks. Read only where this block force-activates masking (an enabled hook or model override), not under `observability.pseudonymization`. It also gates SIEM: only `pseudonymization` keeps the masked response, so under `anonymization` a content sink gets the prompt but not the response. Omitted, falls back to `pseudonymization`. Modes: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#modes
schema.observability.pseudonymization.allow_user_bypass.label=Allow User Bypass
schema.observability.pseudonymization.allow_user_bypass.description=Consequential only inside a force-activation block (an enabled hook or model override); not read under `observability.pseudonymization`. Default false. When true, a caller may skip masking via header `x-sail-proxy-pseudonymization: off` (case-insensitive) or body field `pseudonymization_off: true`: the content reaches the LLM unmasked, and, where an enabled SIEM sink sets both `include_content` and `allow_unmasked_content`, that sink too. Details: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#bypassing-forced-pseudonymization
schema.observability.pseudonymization.entities.label=Entities
schema.observability.pseudonymization.entities.description=Per-category masking toggles: `true` masks the category at this layer, `false` does not, and a category not listed inherits the layer below (later layers win). Keys are the known-category set: the on-by-default categories; three opt-in ones that ship off (`profile-org`, `profile-location`, `profile-ip-address`); and `profile-sensitive-data`, a blanket turning all on except those three. A key outside the set is rejected here. Categories and layers: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#configuring-which-categories-are-masked
schema.observability.pseudonymization.org_suffixes.label=Org Suffixes
schema.observability.pseudonymization.org_suffixes.description=Legal-form suffixes that mark a run of words as an organisation name, e.g. Inc, LLC, GmbH. Matching is case-sensitive by design, so a lower-case 'limited' in prose is deliberately not treated as a legal form; each entry additionally matches fully upper-cased, so an invoice shouting ACME GMBH is recognised as the same organisation as Acme GmbH. It takes effect only while profile-org is enabled in entities; enabling profile-org with this list empty masks NOTHING as an organisation and logs one warning. Each entry is trimmed before matching, and an empty or whitespace-only entry is silently dropped rather than rejected.
schema.observability.pseudonymization.location_gazetteer.label=Location Gazetteer
schema.observability.pseudonymization.location_gazetteer.description=Literal location terms the structural detector masks - case-insensitive, and whole word or whole phrase only; nothing is inferred from capitalisation or context. It takes effect only while profile-location is enabled in entities; enabling profile-location with this list empty masks NOTHING as a location and logs one warning. Each entry is trimmed, and an empty or whitespace-only entry is silently dropped. Ships empty: place names are deployment-specific and this repository is public, so populate it through this admin config app, never in tracked code.
schema.observability.pseudonymization.min_confidence.label=Min Confidence
schema.observability.pseudonymization.min_confidence.description=How much evidence a detected value needs before masking, from 0 to 1 (default 0.5). A value is masked once its score reaches the bar; a plain capitalised name scores about 0.5, a checksum-validated pattern 0.95, a custom rule 1.0. Raising the bar drops plain names first, so tighten one noisy category with `thresholds` instead. Custom rules, validated identifiers and credentials are never lowered by their surroundings. Scoring detail: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#how-a-candidates-score-is-built
schema.observability.pseudonymization.thresholds.label=Thresholds
schema.observability.pseudonymization.thresholds.description=Per-category confidence bars, each 0 to 1, overriding `min_confidence` for the categories named; one not listed keeps `min_confidence`. The place to be strict on a single noisy category - `profile-person` at 0.65 demands more evidence for names while validated identifiers stay at the global bar. Keys are the same known-category set `entities` takes; `profile-sensitive-data` is accepted but does nothing. Per-category tuning: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#thresholds--per-category-same-cliff-for-names
schema.observability.pseudonymization.allowlist.label=Allowlist
schema.observability.pseudonymization.allowlist.description=Values this deployment never masks - an OFF switch, per value. Consulted before the confidence score, so a listed value is exempt however much evidence there is. Use it for a recurring false positive with a name of its own - a product or report title that reads like a person. The layers' lists are CONCATENATED, not replaced, so a lower layer only adds an exemption, never drops one. `terms` vs `patterns`, and the over-broad-entry hazard: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.allowlist.terms.label=Terms
schema.observability.pseudonymization.allowlist.terms.description=Literal values, compared against the whole detected value and CASE-SENSITIVELY. Case-sensitive by design: 'Watson Studio' is the product an operator meant to exempt and 'watson studio' in a sentence is not, and a case-insensitive list would also exempt a person whose surname happens to share the spelling. A term only matches a value the detectors produced whole - listing 'Studio' does not exempt 'Watson Studio'. Every entry here is a masking OFF switch for that exact value, so keep the list to values that are genuinely never personal data: a term that happens to be someone's name exempts that person from masking everywhere in this deployment, silently and with nothing in the log to say so.
schema.observability.pseudonymization.allowlist.patterns.label=Patterns
schema.observability.pseudonymization.allowlist.patterns.description=Regular expressions (JavaScript), each matched against the WHOLE detected value: the gateway wraps every entry in `^(?: )$` itself, so write `Z[A-Z0-9_]+`, not `^Z[A-Z0-9_]+$`. Matching is case-sensitive. Every entry is a masking OFF switch, and a broad one disables masking without failing - `[A-Z].*` switches off almost every personal name detected. A match against a built-in PII sample warns but is STILL applied. Keep each entry narrow. Detail: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#allowlist--the-off-switch-per-value
schema.observability.pseudonymization.saturation_warn.label=Saturation Warn
schema.observability.pseudonymization.saturation_warn.description=How many DISTINCT masked values one request may carry before it is reported as saturated (default 40). Reporting only - it never changes what is masked. Above the number the gateway logs one warning per request with per-category counts and the most common value SHAPES (letters as X, digits as 9); no masked value ever appears. The request's usage SIEM event carries the same counts with a `saturated` flag - counts, not text. Reading the report: https://github.com/st-gr/sail-proxy/blob/main/services/gateway/src/plugins/pseudonymization/pseudonymization.md#reading-the-saturation-report
schema.observability.pseudonymization.unknown_placeholders.label=Invented placeholders
schema.observability.pseudonymization.unknown_placeholders.description=What happens when a response contains a masked placeholder the model was never sent. Models invent one in roughly 1 of 125 pseudonymized responses, and more often the more values a request masks; such a placeholder names nobody and can never be resolved. withhold (default): it is replaced with a plain marker such as [name withheld] and reported as a security event. report: it is only reported and reaches the client unchanged, for a deployment whose own developers write new placeholders into test fixtures through the gateway. off: neither. A placeholder the client itself sent in the same request is never treated as invented.
schema.observability.siem.label=SIEM
schema.observability.siem.description=SIEM export. Audit and security events are written to an outbox and delivered to each enabled sink at least once.
schema.observability.siem.enabled.label=Enabled
schema.observability.siem.enabled.description=Master switch. When false the dispatcher does not start, regardless of per-sink settings.
schema.observability.siem.batch_size.label=Batch Size
schema.observability.siem.batch_size.description=Default rows read per sink per tick; a sink may override it.
schema.observability.siem.interval_ms.label=Interval Ms
schema.observability.siem.interval_ms.description=Default dispatch interval in milliseconds; a sink may override it. The timer period is the shortest of all intervals in play.
schema.observability.siem.reconcile_lookback_ms.label=Reconcile Lookback Ms
schema.observability.siem.reconcile_lookback_ms.description=How far back, in milliseconds, the repair pass looks for outbox events that were never handed to a sink. It bounds that scan and stops a newly enabled sink replaying the full retained history; events older than this are never backfilled.
schema.observability.siem.content_max_bytes.label=Content Max Bytes
schema.observability.siem.content_max_bytes.description=Cap, in UTF-8 bytes, applied to the prompt and to the response independently before a usage event is published. A cut event carries content.truncated: true, so a partial payload is never mistaken for a whole conversation. 0 is accepted and empties the content, marked as truncated. Defaults to 8192, which is also where a negative or non-numeric value lands.
schema.observability.siem.categories.label=Categories
schema.observability.siem.categories.description=Event categories to export. 'usage' is one request-completion event per request and is the only category that can carry conversation content; the shipped list omits it, so exporting it is an explicit opt-in; a missing or empty list exports all three, usage included.
schema.observability.siem.sinks.label=Sinks
schema.observability.siem.sinks.description=Configured sinks. A sink whose settings fail validation is skipped with a warning rather than stopping the others.
schema.observability.siem.sinks.items.name.label=Name
schema.observability.siem.sinks.items.name.description=Unique sink name; the key used for per-sink delivery rows and backoff state.
schema.observability.siem.sinks.items.type.label=Type
schema.observability.siem.sinks.items.type.description=Sink implementation. Determines which of the type-specific properties below apply.
schema.observability.siem.sinks.items.enabled.label=Enabled
schema.observability.siem.sinks.items.enabled.description=Ships false. A sink is dispatched only when both siem.enabled and this are true.
schema.observability.siem.sinks.items.include_content.label=Include Content
schema.observability.siem.sinks.items.include_content.description=Opt-in: ships the prompt and response of each request to this sink, as part of a usage event. Defaults false, and false on every shipped sink. What it ships is the pseudonymized form - placeholders, not raw PII - unless allow_unmasked_content is also set. Requires 'usage' in siem.categories; the dispatcher removes content entirely for a sink where this is false.
schema.observability.siem.sinks.items.allow_unmasked_content.label=Allow Unmasked Content
schema.observability.siem.sinks.items.allow_unmasked_content.description=RISK - reads raw conversations. Opt-in to receive content that pseudonymization never masked, because masking was disabled or bypassed for that request: real names, addresses and anything a user pasted, in full, leaving this system. Defaults false, and only has any effect where include_content is also true. Left false, such a request ships metadata only and records content.omitted: 'not-masked'.
schema.observability.siem.sinks.items.include_credential_material.label=Include Credential Material
schema.observability.siem.sinks.items.include_credential_material.description=Opt-in: ships the raw value of an unresolved credential for forensics. Defaults false; the dispatcher strips the field when false.
schema.observability.siem.sinks.items.batch_size.label=Batch Size
schema.observability.siem.sinks.items.batch_size.description=Per-sink override of siem.batch_size.
schema.observability.siem.sinks.items.interval_ms.label=Interval Ms
schema.observability.siem.sinks.items.interval_ms.description=Per-sink override of siem.interval_ms. Must exceed the sink's send timeout or dispatches queue behind each other.
schema.observability.siem.sinks.items.url.label=URL
schema.observability.siem.sinks.items.url.description=webhook: full ingest URL.
schema.observability.siem.sinks.items.token_env.label=Token
schema.observability.siem.sinks.items.token_env.description=Name of the credential slot. Never a credential value - api_config.json is tracked in three synced copies in a public repo.
schema.observability.siem.sinks.items.endpoint.label=Endpoint
schema.observability.siem.sinks.items.endpoint.description=otel: OTLP/HTTP logs endpoint.
schema.observability.siem.sinks.items.headers_env.label=Headers
schema.observability.siem.sinks.items.headers_env.description=Name of the credential slot. Never a credential value - api_config.json is tracked in three synced copies in a public repo.
schema.observability.siem.sinks.items.site.label=Site
schema.observability.siem.sinks.items.site.description=datadog: site host, e.g. datadoghq.com or datadoghq.eu.
schema.observability.siem.sinks.items.api_key_env.label=API Key
schema.observability.siem.sinks.items.api_key_env.description=Name of the credential slot. Never a credential value - api_config.json is tracked in three synced copies in a public repo.
schema.observability.siem.sinks.items.dcr_endpoint.label=DCR Endpoint
schema.observability.siem.sinks.items.dcr_endpoint.description=azure_sentinel: Data Collection Endpoint URL.
schema.observability.siem.sinks.items.dcr_immutable_id.label=DCR Immutable ID
schema.observability.siem.sinks.items.dcr_immutable_id.description=azure_sentinel: Data Collection Rule immutable id.
schema.observability.siem.sinks.items.stream_name.label=Stream Name
schema.observability.siem.sinks.items.stream_name.description=azure_sentinel: custom stream name, e.g. Custom-SailProxy_CL.
