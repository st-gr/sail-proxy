schema.providers.openai.unsupported_params.label=Unsupported Params
schema.providers.openai.unsupported_params.description=Request parameters this provider or model does not accept. The gateway removes them before forwarding to SAP AI Core, which would otherwise reject the request with 400 "does not support parameters: [...]". A per-model list replaces the provider-level list rather than adding to it.
schema.providers.openai.param_renames.label=Param Renames
schema.providers.openai.param_renames.description=Parameter renames applied on the direct-deployment path, for example max_tokens to max_completion_tokens for OpenAI reasoning models that reject max_tokens. A per-model map replaces the provider-level map rather than adding to it.
schema.providers.openai.supports_responses_api.label=Supports Responses API
schema.providers.openai.supports_responses_api.description=Whether this provider or model may be served on /openai/v1/responses. Absent leaves the built-in family rule in place, which admits deployed GPT-5 and later and the o-series.
schema.providers.openai.supports_prompt_caching.label=Supports Prompt Caching
schema.providers.openai.supports_prompt_caching.description=Whether this provider's models receive Anthropic prompt-cache breakpoints. Resolution order: the per-model models.overrides.<model>.supports_prompt_caching flag, then this provider-level flag, then a default of true for the anthropic provider and false for every other. Setting false where caching does work costs the full uncached input price on every turn, while a needless true was measured as a no-op - so opt out only for a model known to reject it.
schema.providers.openai.openai_deployment_api_version.label=Openai Deployment API Version
schema.providers.openai.openai_deployment_api_version.description=Azure-OpenAI api-version parameter appended to a deployed OpenAI model's /chat/completions URL. Read only from providers.openai and sent only for that provider, because Perplexity deployments reject the parameter. Written as YYYY-MM-DD, optionally with -preview. Absent means no api-version is appended.
