# Configuration form field texts by schema path - generated by ci/scripts/schema-texts.js.
# English is regenerated from the schema; other languages are translated in place and kept.
schema.providers.label=Providers
schema.providers.description=Settings for each upstream provider, keyed by its wire name in the route (so `aws-bedrock` keeps its hyphen). Six providers are read today - anthropic, aws-bedrock, google, openai, openrouter and perplexity; any other key is accepted and validated but stays inert until the gateway learns it. Each named provider accepts only its own list of settings, though some accepted settings are inert under a given provider - each field's description says where it is read; google is the narrowest of the six, carrying only substitute_models, read by the /google route; every other common provider setting is rejected under it rather than merely inert. Per-provider keys: https://st-gr.github.io/sail-proxy/developer/gateway#provider-configuration-keys
schema.providers.anthropic.label=Anthropic
schema.providers.anthropic.description=The anthropic provider, served by the gateway's Anthropic request path: the settings every provider carries, plus that path's wire version and its two beta-flag filters.
schema.providers.anthropic.emulate_streaming_for_models.label=Emulate Streaming For Models
schema.providers.anthropic.emulate_streaming_for_models.description=Models whose answer the gateway collects in full and then replays as a stream, because the deployment cannot stream it itself. Matched against the model name sent upstream, either exactly or with the 'provider--' prefix removed. Used today for the anthropic and openai providers only; an entry under any other provider has no effect.
schema.providers.anthropic.substitute_models.label=Substitute Models
schema.providers.anthropic.substitute_models.description=Model renames for this provider: a request naming 'from' (matched exactly, case included) is forwarded as 'to'; the first matching entry wins and renames do not chain. The response, and the usage recorded for cost, then name the forwarded model, not the name the client sent. Read on the anthropic, aws-bedrock and google routes, on the openrouter chat completions route and on the SAP RPT predict routes (/sap/v1/rpt, from the sap-rpt list), each for its own provider; on /openai/v1/chat/completions and /openai/v1/responses the openai list is consulted first, then the perplexity list.
schema.providers.anthropic.substitute_models.items.from.label=From
schema.providers.anthropic.substitute_models.items.from.description=The model name the client sends.
schema.providers.anthropic.substitute_models.items.to.label=To
schema.providers.anthropic.substitute_models.items.to.description=The model name forwarded to SAP AI Core, typically a deployed model id such as anthropic--claude-4.5-sonnet--deployed.
schema.providers.anthropic.substitute_models.items.description.label=Description
schema.providers.anthropic.substitute_models.items.description.description=Free-text note about this rename, for whoever reads the configuration later. Currently ignored by the gateway; it changes nothing about how the rename behaves.
schema.providers.anthropic.unsupported_params.label=Unsupported Params
schema.providers.anthropic.unsupported_params.description=Request parameters this provider or model does not accept. The gateway removes them before forwarding to SAP AI Core, which would otherwise reject the request with 400 "does not support parameters: [...]". A per-model list replaces the provider-level list rather than adding to it.
schema.providers.anthropic.param_renames.label=Param Renames
schema.providers.anthropic.param_renames.description=Parameter renames applied on the direct-deployment path, for example max_tokens to max_completion_tokens for OpenAI reasoning models that reject max_tokens. A per-model map replaces the provider-level map rather than adding to it.
schema.providers.anthropic.supports_responses_api.label=Supports Responses API
schema.providers.anthropic.supports_responses_api.description=Whether this provider or model may be served on /openai/v1/responses. Absent leaves the built-in family rule in place, which admits deployed GPT-5 and later and the o-series.
schema.providers.anthropic.supports_prompt_caching.label=Supports Prompt Caching
schema.providers.anthropic.supports_prompt_caching.description=Whether this provider's models receive Anthropic prompt-cache breakpoints. Resolution order: the per-model models.overrides.<model>.supports_prompt_caching flag, then this provider-level flag, then a default of true for the anthropic provider and false for every other. Setting false where caching does work costs the full uncached input price on every turn, while a needless true was measured as a no-op - so opt out only for a model known to reject it.
schema.providers.anthropic.anthropic_bedrock_version.label=Anthropic Bedrock Version
schema.providers.anthropic.anthropic_bedrock_version.description=The anthropic-version the gateway sends to SAP AI Core when the client omits the anthropic-version header. Read only from providers.anthropic, so a copy under any other provider - aws-bedrock included - has no effect. Absent falls back to bedrock-2023-05-31.
schema.providers.anthropic.excluded_beta_headers.label=Excluded Beta Headers
schema.providers.anthropic.excluded_beta_headers.description=Anthropic beta flags stripped from a request before it is forwarded, for features the SAP AI Core deployment does not accept. Applied together with the flags the gateway quarantines itself after an upstream 'invalid beta flag' 400. Read only from providers.anthropic; a list under any other provider has no effect.
schema.providers.anthropic.supported_beta_headers.label=Supported Beta Headers
schema.providers.anthropic.supported_beta_headers.description=Allowlist of Anthropic beta flags: while it is non-empty only these are forwarded, and excluded_beta_headers still applies on top. Empty or absent means no allowlist at all, so every flag the client sent goes through - which makes adding a first entry here a silent drop of every flag not listed beside it. Read only from providers.anthropic.
schema.providers.anthropic.sap_cache_read_token_billing_factor.label=Sap Cache Read Token Billing Factor
schema.providers.anthropic.sap_cache_read_token_billing_factor.description=Calibration factor that scales the cache-READ input token COUNT the model API reports up to the count SAP AI Core meters on its invoice, for SAP-native Capacity-Unit cost accounting. Read by the admin app (not the gateway request path). Invoice reconciliation over Mar-Jun 2026 found SAP's 'Cache Read Input Tokens' line item is ~2x the cache_read_input_tokens the API returns and sail-proxy captures faithfully; the mechanism is undocumented and under inquiry with SAP. Note that Anthropic and AWS Bedrock multiply cache PRICE (read 0.1x, write 1.25x/2x by TTL), never token COUNTS, so this is a SAP-metering calibration, not the Anthropic price model. Default 1.0 applies no adjustment - set it (e.g. 2.0) only once the SAP inquiry confirms the ratio.
schema.providers.anthropic.sap_cache_write_token_billing_factor.label=Sap Cache Write Token Billing Factor
schema.providers.anthropic.sap_cache_write_token_billing_factor.description=Calibration factor that scales the cache-WRITE (creation) input token COUNT the model API reports up to the count SAP AI Core meters on its invoice, for SAP-native Capacity-Unit cost accounting. Read by the admin app (not the gateway request path). The Mar-Jun 2026 reconciliation of SAP's 'Cache Write Input Tokens' line against the API-reported cache_creation_input_tokens was inconsistent month to month (likely a billing-period-boundary effect, since writes concentrate at session start), so unlike the read factor no single ratio is established. Default 1.0 applies no adjustment; leave it at 1.0 unless the SAP inquiry establishes a firm write ratio.
schema.providers.aws-bedrock.label=Aws-bedrock
schema.providers.aws-bedrock.description=The aws-bedrock provider, served by the same Anthropic-shaped request path: the settings every provider carries, plus that path's wire version and its two beta-flag filters - each of which the gateway in fact reads from providers.anthropic, so a value here is accepted and inert.
schema.providers.aws-bedrock.emulate_streaming_for_models.label=Emulate Streaming For Models
