schema.providers._entry.description=The provider settings every provider's request path can reach, so five of the six named providers - every one but google - carry the whole shape. Every field is optional, and an absent field means the gateway's built-in behaviour. This shape on its own is also what a provider key the gateway does not read is validated against: there an unknown key is still accepted rather than rejected, and sits in the file without effect. Those five named providers add their own settings on top of these and accept nothing else; google, the sixth, references only this shape's substitute_models field and accepts nothing beyond it - the /google route reads no other provider setting yet.
