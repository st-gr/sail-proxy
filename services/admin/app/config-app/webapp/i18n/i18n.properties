schema.plugins.label=Plugins
schema.plugins.description=Settings of installed gateway plugins, keyed by plugin id. Each plugin documents its own settings; the gateway hands a plugin its entry unchanged, so a plugin has to tolerate a value it did not expect. Entries are created by installing a plugin, not typed in here.
