schema.providers.openrouter.default_pricing.label=Default Pricing
schema.providers.openrouter.default_pricing.description=Fallback OpenRouter prices - completion, image and prompt, each a decimal string. Currently ignored by the gateway; kept so the shipped value validates and stays visible for whatever consumer is added later. Editing it changes no behaviour today.
schema.providers.openrouter.default_pricing.completion.label=Completion
schema.providers.openrouter.default_pricing.completion.description=Price for completion tokens, written as a decimal string. Currently ignored by the gateway, like the rest of default_pricing: the OpenRouter-format model list reports fixed prices of its own instead.
schema.providers.openrouter.default_pricing.image.label=Image
schema.providers.openrouter.default_pricing.image.description=Price for image input, written as a decimal string. Currently ignored by the gateway, like the rest of default_pricing: the OpenRouter-format model list reports fixed prices of its own instead.
schema.providers.openrouter.default_pricing.prompt.label=Prompt
schema.providers.openrouter.default_pricing.prompt.description=Price for prompt tokens, written as a decimal string. Currently ignored by the gateway, like the rest of default_pricing: the OpenRouter-format model list reports fixed prices of its own instead.
schema.providers.openrouter.model_mappings.label=Model Mappings
schema.providers.openrouter.model_mappings.description=Per-upstream-provider defaults for OpenRouter requests, whose model ids are written 'provider/model'. The first entry whose provider matches the id's prefix, case-insensitively, supplies max_tokens when the client omits it. That is the only field used: default_context_length and id_prefix are required by this schema but currently ignored by the gateway.
schema.providers.openrouter.model_mappings.items.default_context_length.label=Default Context Length
schema.providers.openrouter.model_mappings.items.default_context_length.description=Required on every entry, but currently ignored by the gateway; kept for compatibility.
schema.providers.openrouter.model_mappings.items.id_prefix.label=ID Prefix
schema.providers.openrouter.model_mappings.items.id_prefix.description=Required on every entry, but currently ignored by the gateway; the match is made on provider, not on this.
schema.providers.openrouter.model_mappings.items.provider.label=Provider
schema.providers.openrouter.model_mappings.items.provider.description=Matched case-insensitively against the part of the client's model id before the slash.
schema.providers.openrouter.model_mappings.items.max_tokens.label=Max Tokens
schema.providers.openrouter.model_mappings.items.max_tokens.description=Applied as the request's max_tokens when the client sends none. Absent leaves the request without one.
