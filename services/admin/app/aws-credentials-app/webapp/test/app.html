<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AWS Credentials - UI journey launch page</title>
	<!-- Bootstraps the framework the admin serves for this app; webapp/index.html cannot start
	     the component standalone (data-name mismatch), so the journeys launch the app from here. -->
	<script id="sap-ui-bootstrap"
		src="../resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resourceroots='{"admin.awscredentials": "../"}'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-frameOptions="trusted">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div data-sap-ui-component data-name="admin.awscredentials" data-id="container" data-settings='{"id": "admin.awscredentials"}'></div>
</body>
</html>
