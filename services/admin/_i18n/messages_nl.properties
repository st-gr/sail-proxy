# Server messages (CAP runtime bundle, req.reject keys) - Dutch

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=De configuratie is niet opgeslagen: het document is geen geldige JSON.
CONFIG_SAVE_INVALID=De configuratie is niet opgeslagen omdat ze ongeldig is: {0}
CONFIG_SAVE_ACTIVE=Een actieve configuratie kan niet worden opgeslagen. Activeer eerst een andere configuratie, of dupliceer deze en bewerk de kopie.
CONFIG_SAVE_ACTIVATION_COLUMNS=Welke configuratie actief is, en wanneer en door wie ze is geïmplementeerd, verandert alleen via Activeren of Terugdraaien.
CONFIG_SAVE_NO_KEY=De configuratie is niet opgeslagen: ze kon niet worden geïdentificeerd.
CONFIG_CREATE_USE_ACTION=Configuraties worden alleen met de actie createConfiguration aangemaakt, niet met een POST op de entiteit.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Een team heeft een naam nodig.
TEAM_NAME_TAKEN=Er bestaat al een team met de naam '{0}'.
TEAM_HAS_MEMBERS=Het team heeft nog {0} lid/leden: {1}. Verwijder ze voordat u het team verwijdert.
TEAM_NOT_A_MEMBER={0} is geen lid van dit team.
TEAM_ALREADY_MEMBER={0} is al lid van dit team.
TEAM_CREDENTIAL_NOT_MEMBER=De eigenaar van de referentie is geen lid van dat team.
TEAM_FORBIDDEN=Alleen een platformbeheerder of een beheerder van dit team mag dat doen.
TEAM_OPERATION_FAILED=De teambewerking is mislukt. Zie het beheerlogboek.
TEAM_SHARE_TARGET_NOT_FOUND=Het team waarmee gedeeld wordt, bestaat niet.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=De resourcegroep van de actieve SAP AI Core-verbinding kan niet worden gewijzigd. Deactiveer eerst de verbinding, of maak een andere verbinding met deze resourcegroep aan, test deze en activeer deze.

# Logging settings outside the configuration versions (admin-service-logging-settings.ts, services/loggingSettings.ts)
LOGGING_LEVEL_INVALID=Het logniveau "{0}" is onbekend. Gebruik ERROR, WARN, INFO, DEBUG of TRACE.
LOGGING_MINUTES_INVALID={0} is geen geldig aantal minuten. Gebruik een geheel getal van 1 tot 1440.
LOGGING_MINUTES_WITHOUT_LEVEL=Er is een duur van {0} minuten opgegeven zonder standaardniveau. Kies een standaardniveau of laat de duur weg.
LOGGING_COMPONENTS_NOT_OBJECT=De componentniveaus moeten een JSON-object zijn dat elke component met zijn niveau noemt.
LOGGING_COMPONENT_NAME_INVALID=De componentnaam {0} is ongeldig: die moet 1 tot 80 tekens hebben en geen besturingstekens.
LOGGING_COMPONENT_ENTRY_INVALID=De vermelding voor component {0} moet een object zijn met een niveau en, indien gewenst, minuten.
LOGGING_TOO_MANY_COMPONENTS=Hoogstens 50 componenten kunnen een eigen niveau hebben; er zijn er {0} opgegeven.
LOGGING_FIXED_LOG_LEVEL=Het standaardniveau kan hier niet worden ingesteld: de omgevingsvariabele LOG_LEVEL van de gateway legt het vast op {0}. Componentniveaus blijven gelden.
LOGGING_FIXED_LOG_SHIPPING=Het opslaan van het gatewaylogboek kan hier niet worden ingeschakeld: de omgevingsvariabele GATEWAY_LOG_SHIPPING van de gateway staat op {0}.
LOGGING_SETTINGS_NOT_DELIVERED=De instellingen zijn opgeslagen, maar de gateway kon nu niet worden ingelicht. Hij krijgt ze de volgende keer dat hij zijn configuratie laadt.
LOGGING_SETTINGS_TIMED_NEEDS_VALKEY=De instellingen zijn opgeslagen. Een niveau met een einde wordt niet aan de gateway doorgegeven, omdat de gateway zonder Valkey niet kan worden ingelicht wanneer het eindigt. Instellingen zonder einde krijgt hij de volgende keer dat hij zijn configuratie laadt.
LOGGING_DELETE_UNKNOWN=De waarde "{0}" kan hier niet worden verwijderd. Gebruik "log" voor het opgeslagen log van de gateway, "traces" voor de payload-traces en ruwe traces, of "all" voor beide.
PAYLOAD_TRACE_NOT_FOUND=Er is geen payload-trace met de ID "{0}". Mogelijk is deze aan het einde van de bewaartermijn verwijderd.
RAW_TRACE_NOT_FOUND=Er is geen ruwe trace met de ID "{0}". Mogelijk is deze aan het einde van de bewaartermijn verwijderd.
RAW_STAGE_NOT_FOUND=De ruwe trace "{1}" heeft geen fase "{0}".

# Raw capture sessions (admin-service-raw-capture.ts, services/rawCaptureSessions.ts)
RAW_CAPTURE_NOTHING_SELECTED=Kies ten minste één API-sleutel of e-mailadres waarvan de verzoeken ruw moeten worden opgenomen.
RAW_CAPTURE_DURATION_INVALID=Een ruwe opname duurt 15, 60 of 240 minuten; "{0}" hoort daar niet bij.
RAW_CAPTURE_DURATION_MISSING=Kies hoe lang de ruwe opname duurt: 15, 60 of 240 minuten.
RAW_CAPTURE_DURATION_TOO_LONG=De configuratie staat een ruwe opname van ten hoogste {0} minuten toe (payload_capture.raw.max_duration_minutes). Kies een kortere duur.
RAW_CAPTURE_REASON_REQUIRED=Geef de reden voor de ruwe opname op. Deze wordt in het auditlogboek vastgelegd.
RAW_CAPTURE_REASON_TOO_LONG=De reden mag ten hoogste {0} tekens bevatten.
RAW_CAPTURE_UNKNOWN_KEY=Deze API-sleutels of AWS-referenties bestaan niet of zijn verwijderd: {0}
RAW_CAPTURE_ADDRESS_WITHOUT_CREDENTIALS=Deze e-mailadressen hebben geen API-sleutel en geen AWS-referentie: {0}
RAW_CAPTURE_NO_VALKEY=De ruwe opname kan nu niet worden gestart of gestopt: de beheerservice kan Valkey niet bereiken, waarlangs de gateway van ruwe opnamesessies hoort. Probeer het opnieuw zodra Valkey bereikbaar is.
RAW_CAPTURE_NOT_FOUND=Er is geen ruwe opnamesessie met de ID "{0}".
RAW_CAPTURE_ALREADY_ENDED=De ruwe opnamesessie "{0}" is al beëindigd.
RAW_CAPTURE_KEY_MISSING=De ruwe opname loopt, maar METADATA_ENCRYPTION_KEY is niet ingesteld in de beheerservice: ruwe traces worden dan verzegeld met een openbaar bekende ontwikkelsleutel, zodat iedereen met toegang tot de opgeslagen gegevens ze kan lezen. Stel in de gateway en de beheerservice een willekeurige waarde van ten minste 32 tekens in.
RAW_CAPTURE_KEY_TOO_SHORT=De ruwe opname loopt, maar METADATA_ENCRYPTION_KEY heeft minder dan 32 tekens, waardoor de verzegeling van de ruwe traces zwak is. Stel in de gateway en de beheerservice een willekeurige waarde van ten minste 32 tekens in.
RAW_CAPTURE_KEY_PUBLICLY_KNOWN=De ruwe opname loopt, maar METADATA_ENCRYPTION_KEY heeft een waarde die met het product wordt gepubliceerd, zodat iedereen met toegang tot de opgeslagen gegevens de ruwe traces kan lezen. Stel in de gateway en de beheerservice een willekeurige waarde van ten minste 32 tekens in.
