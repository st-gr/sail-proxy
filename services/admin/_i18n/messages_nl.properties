# Server messages (CAP runtime bundle, req.reject keys) - Dutch

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=De configuratie is niet opgeslagen: het document is geen geldige JSON.
CONFIG_SAVE_INVALID=De configuratie is niet opgeslagen omdat ze ongeldig is: {0}
CONFIG_SAVE_ACTIVE=Een actieve configuratie kan niet worden opgeslagen. Activeer eerst een andere configuratie, of dupliceer deze en bewerk de kopie.
CONFIG_SAVE_ACTIVATION_COLUMNS=Welke configuratie actief is, en wanneer en door wie ze is geïmplementeerd, verandert alleen via Activeren of Terugdraaien.
CONFIG_SAVE_NO_KEY=De configuratie is niet opgeslagen: ze kon niet worden geïdentificeerd.
CONFIG_CREATE_USE_ACTION=Configuraties worden alleen met de actie createConfiguration aangemaakt, niet met een POST op de entiteit.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Een team heeft een naam nodig.
TEAM_NAME_TAKEN=Er bestaat al een team met de naam '{0}'.
TEAM_HAS_MEMBERS=Het team heeft nog {0} lid/leden: {1}. Verwijder ze voordat u het team verwijdert.
TEAM_NOT_A_MEMBER={0} is geen lid van dit team.
TEAM_ALREADY_MEMBER={0} is al lid van dit team.
TEAM_CREDENTIAL_NOT_MEMBER=De eigenaar van de referentie is geen lid van dat team.
TEAM_FORBIDDEN=Alleen een platformbeheerder of een beheerder van dit team mag dat doen.
TEAM_OPERATION_FAILED=De teambewerking is mislukt. Zie het beheerlogboek.
TEAM_SHARE_TARGET_NOT_FOUND=Het team waarmee gedeeld wordt, bestaat niet.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=De resourcegroep van de actieve SAP AI Core-verbinding kan niet worden gewijzigd. Deactiveer eerst de verbinding, of maak een andere verbinding met deze resourcegroep aan, test deze en activeer deze.
