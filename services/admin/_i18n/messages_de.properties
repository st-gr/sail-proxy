# Server messages (CAP runtime bundle, req.reject keys) - German

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=Die Konfiguration wurde nicht gespeichert: Ihr Dokument ist kein gültiges JSON.
CONFIG_SAVE_INVALID=Die Konfiguration wurde nicht gespeichert, weil sie ungültig ist: {0}
CONFIG_SAVE_ACTIVE=Eine aktive Konfiguration kann nicht gespeichert werden. Aktivieren Sie zuerst eine andere Konfiguration, oder duplizieren Sie diese und bearbeiten Sie die Kopie.
CONFIG_SAVE_ACTIVATION_COLUMNS=Welche Konfiguration aktiv ist und wann und von wem sie bereitgestellt wurde, ändert sich nur über „Aktivieren“ oder „Rollback“.
CONFIG_SAVE_NO_KEY=Die Konfiguration wurde nicht gespeichert: Sie konnte nicht ermittelt werden.
CONFIG_CREATE_USE_ACTION=Konfigurationen werden nur mit der Aktion „createConfiguration“ erstellt, nicht per POST auf die Entität.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Ein Team braucht einen Namen.
TEAM_NAME_TAKEN=Ein Team mit dem Namen '{0}' existiert bereits.
TEAM_HAS_MEMBERS=Das Team hat noch {0} Mitglied(er): {1}. Entfernen Sie sie, bevor Sie das Team löschen.
TEAM_NOT_A_MEMBER={0} ist kein Mitglied dieses Teams.
TEAM_ALREADY_MEMBER={0} ist bereits Mitglied dieses Teams.
TEAM_CREDENTIAL_NOT_MEMBER=Der Inhaber der Zugangsdaten ist kein Mitglied dieses Teams.
TEAM_FORBIDDEN=Nur ein Plattformadministrator oder ein Administrator dieses Teams darf das tun.
TEAM_OPERATION_FAILED=Der Team-Vorgang ist fehlgeschlagen. Details stehen im Admin-Protokoll.
TEAM_SHARE_TARGET_NOT_FOUND=Das Team, für das die Freigabe gelten soll, existiert nicht.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Die Ressourcengruppe der aktiven SAP-AI-Core-Verbindung kann nicht geändert werden. Deaktivieren Sie die Verbindung zuerst, oder legen Sie eine weitere Verbindung mit dieser Ressourcengruppe an, testen Sie sie und aktivieren Sie sie.

# Logging settings outside the configuration versions (admin-service-logging-settings.ts, services/loggingSettings.ts)
LOGGING_LEVEL_INVALID=Die Protokollstufe "{0}" ist unbekannt. Verwenden Sie ERROR, WARN, INFO, DEBUG oder TRACE.
LOGGING_MINUTES_INVALID={0} ist keine gültige Anzahl Minuten. Verwenden Sie eine ganze Zahl von 1 bis 1440.
LOGGING_MINUTES_WITHOUT_LEVEL=Eine Dauer von {0} Minuten wurde ohne Standardstufe angegeben. Wählen Sie eine Standardstufe oder lassen Sie die Dauer weg.
LOGGING_COMPONENTS_NOT_OBJECT=Die Komponentenstufen müssen ein JSON-Objekt sein, das jede Komponente mit ihrer Stufe nennt.
LOGGING_COMPONENT_NAME_INVALID=Der Komponentenname {0} ist ungültig: Er braucht 1 bis 80 Zeichen und keine Steuerzeichen.
LOGGING_COMPONENT_ENTRY_INVALID=Der Eintrag für die Komponente {0} muss ein Objekt mit einer Stufe und, falls gewünscht, Minuten sein.
LOGGING_TOO_MANY_COMPONENTS=Höchstens 50 Komponenten können eine eigene Stufe haben; angegeben wurden {0}.
LOGGING_FIXED_LOG_LEVEL=Die Standardstufe kann hier nicht gesetzt werden: Die Umgebungsvariable LOG_LEVEL des Gateways legt sie auf {0} fest. Komponentenstufen gelten weiterhin.
LOGGING_FIXED_LOG_SHIPPING=Das Speichern des Gateway-Protokolls kann hier nicht eingeschaltet werden: Die Umgebungsvariable GATEWAY_LOG_SHIPPING des Gateways steht auf {0}.
LOGGING_SETTINGS_NOT_DELIVERED=Die Einstellungen sind gespeichert, aber das Gateway konnte jetzt nicht benachrichtigt werden. Es erhält sie, wenn es seine Konfiguration das nächste Mal lädt.
LOGGING_SETTINGS_TIMED_NEEDS_VALKEY=Die Einstellungen sind gespeichert. Eine Stufe mit Ende wird nicht an das Gateway übergeben, weil dem Gateway ohne Valkey nicht mitgeteilt werden kann, wann sie endet. Einstellungen ohne Ende erhält es, wenn es seine Konfiguration das nächste Mal lädt.
LOGGING_DELETE_UNKNOWN=Der Wert "{0}" kann hier nicht gelöscht werden. Verwenden Sie "log" für das gespeicherte Gateway-Protokoll, "traces" für die Payload-Traces und Roh-Traces oder "all" für beides.
PAYLOAD_TRACE_NOT_FOUND=Es gibt keinen Payload-Trace mit der ID "{0}". Er wurde möglicherweise am Ende seiner Aufbewahrungszeit gelöscht.
RAW_TRACE_NOT_FOUND=Es gibt keinen Roh-Trace mit der ID "{0}". Er wurde möglicherweise am Ende seiner Aufbewahrungszeit gelöscht.
RAW_STAGE_NOT_FOUND=Der Roh-Trace "{1}" hat keine Phase "{0}".

# Raw capture sessions (admin-service-raw-capture.ts, services/rawCaptureSessions.ts)
RAW_CAPTURE_NOTHING_SELECTED=Wählen Sie mindestens einen API-Schlüssel oder eine E-Mail-Adresse, deren Anfragen roh aufgezeichnet werden sollen.
RAW_CAPTURE_DURATION_INVALID=Eine Rohaufzeichnung läuft 15, 60 oder 240 Minuten; "{0}" gehört nicht dazu.
RAW_CAPTURE_DURATION_MISSING=Wählen Sie, wie lange die Rohaufzeichnung läuft: 15, 60 oder 240 Minuten.
RAW_CAPTURE_DURATION_TOO_LONG=Die Konfiguration erlaubt eine Rohaufzeichnung von höchstens {0} Minuten (payload_capture.raw.max_duration_minutes). Wählen Sie eine kürzere Dauer.
RAW_CAPTURE_REASON_REQUIRED=Geben Sie den Grund für die Rohaufzeichnung an. Er wird im Audit-Protokoll festgehalten.
RAW_CAPTURE_REASON_TOO_LONG=Der Grund darf höchstens {0} Zeichen lang sein.
RAW_CAPTURE_UNKNOWN_KEY=Diese API-Schlüssel oder AWS-Anmeldedaten gibt es nicht oder sie wurden gelöscht: {0}
RAW_CAPTURE_ADDRESS_WITHOUT_CREDENTIALS=Diese E-Mail-Adressen besitzen weder einen API-Schlüssel noch AWS-Anmeldedaten: {0}
RAW_CAPTURE_NO_VALKEY=Die Rohaufzeichnung kann jetzt nicht gestartet oder beendet werden: Der Admin-Service erreicht Valkey nicht, über das das Gateway von Rohaufzeichnungen erfährt. Versuchen Sie es erneut, sobald Valkey erreichbar ist.
RAW_CAPTURE_NOT_FOUND=Es gibt keine Rohaufzeichnung mit der ID "{0}".
RAW_CAPTURE_ALREADY_ENDED=Die Rohaufzeichnung "{0}" ist bereits beendet.
RAW_CAPTURE_KEY_MISSING=Die Rohaufzeichnung läuft, aber METADATA_ENCRYPTION_KEY ist im Admin-Service nicht gesetzt: Roh-Traces werden dann mit einem öffentlich bekannten Entwicklungsschlüssel versiegelt, sodass jeder mit Zugriff auf die gespeicherten Daten sie lesen kann. Setzen Sie im Gateway und im Admin-Service einen zufälligen Wert mit mindestens 32 Zeichen.
RAW_CAPTURE_KEY_TOO_SHORT=Die Rohaufzeichnung läuft, aber METADATA_ENCRYPTION_KEY hat weniger als 32 Zeichen, was die Versiegelung der Roh-Traces schwach macht. Setzen Sie im Gateway und im Admin-Service einen zufälligen Wert mit mindestens 32 Zeichen.
RAW_CAPTURE_KEY_PUBLICLY_KNOWN=Die Rohaufzeichnung läuft, aber METADATA_ENCRYPTION_KEY hat einen Wert, der mit dem Produkt veröffentlicht wird, sodass jeder mit Zugriff auf die gespeicherten Daten die Roh-Traces lesen kann. Setzen Sie im Gateway und im Admin-Service einen zufälligen Wert mit mindestens 32 Zeichen.
