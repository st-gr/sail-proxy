# Server messages (CAP runtime bundle, req.reject keys) - German

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=Die Konfiguration wurde nicht gespeichert: Ihr Dokument ist kein gültiges JSON.
CONFIG_SAVE_INVALID=Die Konfiguration wurde nicht gespeichert, weil sie ungültig ist: {0}
CONFIG_SAVE_ACTIVE=Eine aktive Konfiguration kann nicht gespeichert werden. Aktivieren Sie zuerst eine andere Konfiguration, oder duplizieren Sie diese und bearbeiten Sie die Kopie.
CONFIG_SAVE_ACTIVATION_COLUMNS=Welche Konfiguration aktiv ist und wann und von wem sie bereitgestellt wurde, ändert sich nur über „Aktivieren“ oder „Rollback“.
CONFIG_SAVE_NO_KEY=Die Konfiguration wurde nicht gespeichert: Sie konnte nicht ermittelt werden.
CONFIG_CREATE_USE_ACTION=Konfigurationen werden nur mit der Aktion „createConfiguration“ erstellt, nicht per POST auf die Entität.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Ein Team braucht einen Namen.
TEAM_NAME_TAKEN=Ein Team mit dem Namen '{0}' existiert bereits.
TEAM_HAS_MEMBERS=Das Team hat noch {0} Mitglied(er): {1}. Entfernen Sie sie, bevor Sie das Team löschen.
TEAM_NOT_A_MEMBER={0} ist kein Mitglied dieses Teams.
TEAM_ALREADY_MEMBER={0} ist bereits Mitglied dieses Teams.
TEAM_CREDENTIAL_NOT_MEMBER=Der Inhaber der Zugangsdaten ist kein Mitglied dieses Teams.
TEAM_FORBIDDEN=Nur ein Plattformadministrator oder ein Administrator dieses Teams darf das tun.
TEAM_OPERATION_FAILED=Der Team-Vorgang ist fehlgeschlagen. Details stehen im Admin-Protokoll.
TEAM_SHARE_TARGET_NOT_FOUND=Das Team, für das die Freigabe gelten soll, existiert nicht.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Die Ressourcengruppe der aktiven SAP-AI-Core-Verbindung kann nicht geändert werden. Deaktivieren Sie die Verbindung zuerst, oder legen Sie eine weitere Verbindung mit dieser Ressourcengruppe an, testen Sie sie und aktivieren Sie sie.
