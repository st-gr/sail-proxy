# Teams (teams-app annotations)
teams.team=Team
teams.teams=Teams
teams.general=General
teams.members=Members
teams.pool=Pool
teams.role=Role
teams.primary=Primary
teams.quotaProfile=Pool Profile
teams.quotaProfileInfo=Defaults for empty pool fields. The pool is one budget the whole team shares: per field, the team's own pool value applies, else this profile's value, else unlimited.
teams.memberQuotaProfile=Member Profile
teams.memberQuotaProfileInfo=Limit for each member. Works like a personal quota profile for every member, ranked below the member's own limits and own profile: it applies to a field those leave empty. A member of several teams gets the strictest value per field.
teams.entitlementCatalogInfo=The models the team may use. A member's own catalog is intersected with it. Empty = the default catalog.
teams.toolPolicyInfo=A tool must pass the team's policy, the member's policy and the key's policy; the strictest mode wins. Empty = the team adds nothing.
teams.poolRequestsPerMinuteInfo=Requests per minute for the whole team, counted across every member's credentials. Empty = the pool profile's value, else unlimited.
teams.poolSpendInfo=SAP cost plus Connections cost all members spend together per window (UTC), in the currency of the SAP capacity unit price. Empty = the pool profile's value, else unlimited.
teams.poolTokensInfo=Input, output and cache-write tokens all members use together per window (UTC). Empty = the pool profile's value, else unlimited.
teams.poolDefaultInfo=What the pool uses while the field above is empty: the pool profile's value, or unlimited.
teams.effectiveTeam=Team
teams.followsPrimaryTeam=Follows Primary Team
teams.effectiveTeamInfo=The team whose pool, model catalog and tool policy apply to requests with this credential.

