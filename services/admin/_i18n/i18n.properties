# SAP Rates app
sapRates.capacityUnitPrice=SAP Capacity Unit Price
sapRates.capacityUnitPrices=SAP Capacity Unit Prices
sapRates.currencyInfo=ISO currency code for Price per CU (e.g. USD). The price lookup matches on Usage Type only, so keep a single currency per usage type and period.
sapRates.pricePerCu=Price per CU
sapRates.pricePerCuInfo=Price, in the given currency, per Capacity Unit - from the SAP BTP price list (Extended plan). Cost = Capacity Units x this price.
sapRates.priceValidity=Price & Validity
sapRates.regionInfo=SAP region the price applies to. Descriptive; not part of the price-matching key.
sapRates.servicePlan=Service Plan
sapRates.servicePlanInfo=SAP service plan the price applies to (extended = the generative AI hub). Descriptive.
sapRates.sku=SKU
sapRates.skuInfo=SAP material / SKU for the price line. Descriptive.
sapRates.usageType=Usage Type
sapRates.usageTypeInfo=SAP subaccount classification that selects the price: productive or non-productive. SAP classifies each subaccount (a sandbox can be classified productive). Prices are matched by this value within the validity window.
sapRates.validFrom=Valid From
sapRates.validFromInfo=Start of the validity window (inclusive). Cost uses the price whose [Valid From, Valid To] window contains the event time.
sapRates.validTo=Valid To
sapRates.validToInfo=End of the validity window (inclusive). Use a far-future date for the currently-active price. Windows for the same usage type must not overlap.

# Tool Policies app
toolPolicies.allow=Allow
toolPolicies.apiKey=API key
toolPolicies.assignedApiKeys=Assigned API Keys
toolPolicies.assignedTeams=Assigned Teams
toolPolicies.assignedUsers=Assigned Users
toolPolicies.deny=Deny
toolPolicies.detected=Detected
toolPolicies.detectedInfo=Times the policy denied this tool and it was used anyway, inside the client's own tool runtime: recorded, not prevented.
toolPolicies.email=Email
toolPolicies.facetInfo=Declared: the tool was offered in the request. Invoked: the model called it.
toolPolicies.general=General
toolPolicies.isDefault=Default
toolPolicies.isDefaultInfo=The default policy applies to every user without an assignment. It cannot be deleted or unset.
toolPolicies.mode=Mode
toolPolicies.modeInfo=monitor: record only. strip: remove tools the policy does not permit. reject: refuse the request.
toolPolicies.note=Note
toolPolicies.owner=Owner
toolPolicies.pattern=Pattern
toolPolicies.patternInfoAllow=function:<name>, hosted:<type>, mcp:<server> or mcp:<server>/<tool>; a trailing * matches a prefix. An mcp:<server>/<tool> entry limits only that server: its other tools are denied, every other tool is unaffected.
toolPolicies.patternInfoDeny=function:<name>, hosted:<type>, mcp:<server> or mcp:<server>/<tool>; a trailing * matches a prefix.
toolPolicies.period=Period
toolPolicies.periodInfo=The days whose recorded tool use is counted. Defaults to the last 30 days including today.
toolPolicies.recordedClientPrograms=Recorded client programs
toolPolicies.recordedTools=Recorded tools
toolPolicies.requestedBy=Requested By
toolPolicies.requestedByInfo=The client programs that asked for this tool in the selected period. A filter matches any one of them.
toolPolicies.sensitiveInfo=Tools that act (shell, file write, sending mail). They are withheld while the conversation contains output from an untrusted source. Same pattern syntax as Allow and Deny.
toolPolicies.sensitiveTools=Sensitive Tools
toolPolicies.toolFilterInfo=Filters by tool identity; a partial name matches (contains).
toolPolicies.toolInventory=Tool Inventory
toolPolicies.toolPolicies=Tool Policies
toolPolicies.tools=Tools
toolPolicies.trustChain=Trust Chain
toolPolicies.untrustedInfo=Tools whose output may carry third-party content (web search, browsing). Their output in a conversation withholds the sensitive tools. Same pattern syntax as Allow and Deny.
toolPolicies.untrustedSources=Untrusted Sources
toolPolicies.userEmail=User email

