# SAP Rates app
sapRates.capacityUnitPrice=Preço da Capacity Unit SAP
sapRates.capacityUnitPrices=Preços da Capacity Unit SAP
sapRates.currencyInfo=Código de moeda ISO para Preço por CU (p. ex., USD). A pesquisa de preços só corresponde por Tipo de utilização, pelo que deve manter uma única moeda por tipo de utilização e período.
sapRates.pricePerCu=Preço por CU
sapRates.pricePerCuInfo=Preço, na moeda indicada, por Capacity Unit, da lista de preços SAP BTP (plano Extended). Custo = Capacity Units x este preço.
sapRates.priceValidity=Preço e validade
sapRates.regionInfo=Região SAP à qual o preço se aplica. Descritivo; não faz parte da chave de correspondência de preços.
sapRates.servicePlan=Plano de serviço
sapRates.servicePlanInfo=Plano de serviço SAP ao qual o preço se aplica (extended = o generative AI hub). Descritivo.
sapRates.sku=SKU
sapRates.skuInfo=Material SAP / SKU da linha de preço. Descritivo.
sapRates.usageType=Tipo de utilização
sapRates.usageTypeInfo=Classificação da subconta SAP que determina o preço: produtiva ou não produtiva. A SAP classifica cada subconta (uma sandbox pode ser classificada como produtiva). Os preços são associados por este valor dentro do período de validade.
sapRates.validFrom=Válido de
sapRates.validFromInfo=Início do período de validade (inclusive). O custo usa o preço cujo período [Válido de, Válido até] contém a hora do evento.
sapRates.validTo=Válido até
sapRates.validToInfo=Fim do período de validade (inclusive). Utilize uma data num futuro distante para o preço atualmente ativo. Os períodos para o mesmo tipo de utilização não devem sobrepor-se.

# Tool Policies app
toolPolicies.allow=Permitir
toolPolicies.apiKey=Chave de API
toolPolicies.assignedApiKeys=Chaves de API atribuídas
toolPolicies.assignedTeams=Equipas atribuídas
toolPolicies.assignedUsers=Utilizadores atribuídos
toolPolicies.deny=Negar
