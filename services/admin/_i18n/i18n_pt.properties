toolPolicies.detectedInfo=Número de vezes que a política negou esta ferramenta e esta foi, ainda assim, utilizada, no ambiente de execução de ferramentas do próprio cliente: registado, não impedido.
toolPolicies.email=E-mail
toolPolicies.facetInfo=Declarada: a ferramenta foi oferecida no pedido. Invocada: o modelo chamou-a.
toolPolicies.general=Geral
toolPolicies.isDefault=Predefinida
toolPolicies.isDefaultInfo=A política predefinida aplica-se a todos os utilizadores sem atribuição. Não pode ser eliminada nem removida.
toolPolicies.mode=Modo
toolPolicies.modeInfo=monitor: apenas registar. strip: remover as ferramentas que a política não permite. reject: recusar o pedido.
toolPolicies.note=Nota
toolPolicies.owner=Proprietário
toolPolicies.pattern=Padrão
toolPolicies.patternInfoAllow=function:<name>, hosted:<type>, mcp:<server> ou mcp:<server>/<tool>; um * final corresponde a um prefixo. Uma entrada mcp:<server>/<tool> limita apenas esse servidor: as suas outras ferramentas são negadas e todas as restantes ferramentas não são afetadas.
toolPolicies.patternInfoDeny=function:<name>, hosted:<type>, mcp:<server> ou mcp:<server>/<tool>; um * final corresponde a um prefixo.
toolPolicies.period=Período
toolPolicies.periodInfo=Os dias cuja utilização registada de ferramentas é contabilizada. Por predefinição, os últimos 30 dias, incluindo hoje.
toolPolicies.recordedClientPrograms=Programas cliente registados
toolPolicies.recordedTools=Ferramentas registadas
toolPolicies.requestedBy=Pedido por
toolPolicies.requestedByInfo=Os programas cliente que pediram esta ferramenta no período selecionado. Um filtro corresponde a qualquer um deles.
toolPolicies.sensitiveInfo=Ferramentas que executam ações (shell, escrita de ficheiros, envio de correio eletrónico). São retidas enquanto a conversa contiver saída de uma fonte não fiável. Mesma sintaxe de padrão que Permitir e Negar.
toolPolicies.sensitiveTools=Ferramentas sensíveis
toolPolicies.toolFilterInfo=Filtra por identidade da ferramenta; um nome parcial corresponde (contém).
toolPolicies.toolInventory=Inventário de ferramentas
toolPolicies.toolPolicies=Políticas de ferramentas
toolPolicies.tools=Ferramentas
toolPolicies.trustChain=Cadeia de confiança
toolPolicies.untrustedInfo=Ferramentas cuja saída pode conter conteúdo de terceiros (pesquisa na Web, navegação). A sua saída numa conversa retém as ferramentas sensíveis. Mesma sintaxe de padrão que Permitir e Negar.
toolPolicies.untrustedSources=Fontes não fiáveis
toolPolicies.userEmail=E-mail do utilizador

