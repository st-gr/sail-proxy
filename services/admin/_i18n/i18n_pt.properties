teams.quotaProfile=Perfil do pool
teams.quotaProfileInfo=Valores predefinidos para os campos vazios do pool. O pool é um orçamento que toda a equipa partilha: por campo aplica-se o valor próprio do pool da equipa, senão o valor deste perfil, senão ilimitado.
teams.memberQuotaProfile=Perfil de membro
teams.memberQuotaProfileInfo=Limite para cada membro. Funciona para cada membro como um perfil de quota pessoal, abaixo dos limites próprios e do perfil próprio do membro: aplica-se a um campo que estes deixam vazio. Um membro de várias equipas recebe o valor mais restritivo por campo.
teams.entitlementCatalogInfo=Os modelos que a equipa pode utilizar. O catálogo próprio de um membro é intersetado com este. Vazio = o catálogo predefinido.
teams.toolPolicyInfo=Uma ferramenta tem de cumprir a política da equipa, a do membro e a da chave; prevalece o modo mais restritivo. Vazio = a equipa não acrescenta nada.
teams.poolRequestsPerMinuteInfo=Pedidos por minuto de toda a equipa, contados nas credenciais de todos os membros. Vazio = o valor do perfil do pool; caso contrário, ilimitado.
teams.poolSpendInfo=Custo SAP mais custo Connections gastos em conjunto por todos os membros por janela (UTC), na moeda do preço da unidade de capacidade SAP. Vazio = o valor do perfil do pool; caso contrário, ilimitado.
teams.poolTokensInfo=Tokens de entrada, saída e escrita em cache usados em conjunto por todos os membros por janela (UTC). Vazio = o valor do perfil do pool; caso contrário, ilimitado.
teams.poolDefaultInfo=O que o pool utiliza enquanto o campo acima estiver vazio: o valor do perfil do pool ou ilimitado.
teams.effectiveTeam=Equipa
teams.followsPrimaryTeam=Segue a equipa principal
teams.effectiveTeamInfo=A equipa cuja quota, catálogo de modelos e política de ferramentas se aplicam aos pedidos com esta credencial.

