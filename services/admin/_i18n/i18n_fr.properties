# SAP Rates app
sapRates.capacityUnitPrice=Prix de la Capacity Unit SAP
sapRates.capacityUnitPrices=Prix de la Capacity Unit SAP
sapRates.currencyInfo=Code de devise ISO pour Prix par CU (p. ex. USD). La recherche de prix ne porte que sur le Type d’utilisation ; conservez donc une seule devise par type d’utilisation et par période.
sapRates.pricePerCu=Prix par CU
sapRates.pricePerCuInfo=Prix, dans la devise indiquée, par Capacity Unit, d’après la liste de prix SAP BTP (plan Extended). Coût = Capacity Units x ce prix.
sapRates.priceValidity=Prix et validité
sapRates.regionInfo=Région SAP à laquelle le prix s’applique. Descriptif ; ne fait pas partie de la clé d’association des prix.
sapRates.servicePlan=Plan de service
sapRates.servicePlanInfo=Plan de service SAP auquel le prix s’applique (extended = le generative AI hub). Descriptif.
sapRates.sku=SKU
sapRates.skuInfo=Article SAP / SKU de la ligne de prix. Descriptif.
sapRates.usageType=Type d’utilisation
sapRates.usageTypeInfo=Classification du sous-compte SAP qui détermine le prix : productif ou non productif. SAP classe chaque sous-compte (un sandbox peut être classé productif). Les prix sont associés selon cette valeur dans la période de validité.
sapRates.validFrom=Valide du
sapRates.validFromInfo=Début de la période de validité (inclus). Le coût utilise le prix dont la période [Valide du, Valide jusqu’au] contient l’heure de l’événement.
sapRates.validTo=Valide jusqu’au
sapRates.validToInfo=Fin de la période de validité (incluse). Utilisez une date très éloignée dans le futur pour le prix actuellement actif. Les périodes d’un même type d’utilisation ne doivent pas se chevaucher.

# Tool Policies app
toolPolicies.allow=Autoriser
toolPolicies.apiKey=Clé API
toolPolicies.assignedApiKeys=Clés API affectées
toolPolicies.assignedTeams=Équipes affectées
toolPolicies.assignedUsers=Utilisateurs affectés
toolPolicies.deny=Refuser
toolPolicies.detected=Détecté
toolPolicies.detectedInfo=Nombre de fois où la politique a refusé cet outil et où il a été utilisé malgré tout, dans l’environnement d’exécution d’outils propre au client : enregistré, non empêché.
toolPolicies.email=E-mail
toolPolicies.facetInfo=Déclaré : l’outil a été proposé dans la requête. Invoqué : le modèle l’a appelé.
toolPolicies.general=Général
toolPolicies.isDefault=Par défaut
toolPolicies.isDefaultInfo=La politique par défaut s’applique à tout utilisateur sans affectation. Elle ne peut être ni supprimée ni retirée.
toolPolicies.mode=Mode
toolPolicies.modeInfo=monitor : enregistrer uniquement. strip : retirer les outils que la politique n’autorise pas. reject : refuser la requête.
toolPolicies.note=Remarque
toolPolicies.owner=Propriétaire
toolPolicies.pattern=Motif
toolPolicies.patternInfoAllow=function:<name>, hosted:<type>, mcp:<server> ou mcp:<server>/<tool> ; un * final correspond à un préfixe. Une entrée mcp:<server>/<tool> limite uniquement ce serveur : ses autres outils sont refusés, tous les autres outils ne sont pas affectés.
toolPolicies.patternInfoDeny=function:<name>, hosted:<type>, mcp:<server> ou mcp:<server>/<tool> ; un * final correspond à un préfixe.
toolPolicies.period=Période
toolPolicies.periodInfo=Les jours dont l’utilisation enregistrée des outils est comptabilisée. Par défaut, les 30 derniers jours, aujourd’hui inclus.
toolPolicies.recordedClientPrograms=Programmes clients enregistrés
toolPolicies.recordedTools=Outils enregistrés
toolPolicies.requestedBy=Demandé par
toolPolicies.requestedByInfo=Les programmes clients qui ont demandé cet outil pendant la période sélectionnée. Un filtre correspond à l’un quelconque d’entre eux.
toolPolicies.sensitiveInfo=Outils qui agissent (shell, écriture de fichiers, envoi de courriels). Ils sont retenus tant que la conversation contient une sortie d’une source non fiable. Même syntaxe de motif que Autoriser et Refuser.
toolPolicies.sensitiveTools=Outils sensibles
toolPolicies.toolFilterInfo=Filtre par identité d’outil ; un nom partiel correspond (contient).
toolPolicies.toolInventory=Inventaire des outils
toolPolicies.toolPolicies=Politiques d’outils
toolPolicies.tools=Outils
toolPolicies.trustChain=Chaîne de confiance
toolPolicies.untrustedInfo=Outils dont la sortie peut contenir du contenu tiers (recherche web, navigation). Leur sortie dans une conversation retient les outils sensibles. Même syntaxe de motif que Autoriser et Refuser.
toolPolicies.untrustedSources=Sources non fiables
toolPolicies.userEmail=E-mail de l’utilisateur

