# Teams (teams-app annotations)
teams.team=Équipe
teams.teams=Équipes
teams.general=Général
teams.members=Membres
teams.pool=Pool
teams.role=Rôle
teams.primary=Principale
teams.quotaProfile=Profil du pool
teams.quotaProfileInfo=Valeurs par défaut des champs vides du pool. Le pool est un budget que toute l’équipe partage : par champ, la valeur propre du pool de l’équipe s’applique, sinon celle de ce profil, sinon illimité.
teams.memberQuotaProfile=Profil des membres
teams.memberQuotaProfileInfo=Limite pour chaque membre. Agit pour chaque membre comme un profil de quota personnel, après les limites propres et le profil propre du membre : il s’applique à un champ que ceux-ci laissent vide. Un membre de plusieurs équipes reçoit la valeur la plus stricte par champ.
teams.entitlementCatalogInfo=Les modèles que l’équipe peut utiliser. Le catalogue propre d’un membre est croisé avec celui-ci. Vide = le catalogue par défaut.
teams.toolPolicyInfo=Un outil doit respecter la politique de l’équipe, celle du membre et celle de la clé ; le mode le plus strict l’emporte. Vide = l’équipe n’ajoute rien.
teams.poolRequestsPerMinuteInfo=Requêtes par minute pour toute l’équipe, comptées sur les identifiants de tous les membres. Vide = la valeur du profil du pool, sinon illimité.
teams.poolSpendInfo=Coût SAP plus coût Connections dépensés conjointement par tous les membres par fenêtre (UTC), dans la devise du prix de l’unité de capacité SAP. Vide = la valeur du profil du pool, sinon illimité.
teams.poolTokensInfo=Jetons d’entrée, de sortie et d’écriture en cache utilisés conjointement par tous les membres par fenêtre (UTC). Vide = la valeur du profil du pool, sinon illimité.
teams.poolDefaultInfo=Ce que le pool utilise tant que le champ ci-dessus est vide : la valeur du profil du pool, ou illimité.
teams.effectiveTeam=Équipe
teams.followsPrimaryTeam=Suit l’équipe principale
teams.effectiveTeamInfo=L’équipe dont le quota, le catalogue de modèles et la politique d’outils s’appliquent aux requêtes avec cet identifiant.

