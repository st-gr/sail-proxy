# Server messages (CAP runtime bundle, req.reject keys) - Spanish

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=La configuración no se ha guardado: su documento no es un JSON válido.
CONFIG_SAVE_INVALID=La configuración no se ha guardado porque no es válida: {0}
CONFIG_SAVE_ACTIVE=No se puede guardar una configuración activa. Active primero otra configuración, o duplique esta y edite la copia.
CONFIG_SAVE_ACTIVATION_COLUMNS=Qué configuración está activa, y cuándo y quién la implementó, solo cambia mediante Activar o Revertir.
CONFIG_SAVE_NO_KEY=La configuración no se ha guardado: no se ha podido identificar.
CONFIG_CREATE_USE_ACTION=Las configuraciones se crean solo con la acción createConfiguration, no mediante un POST sobre la entidad.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Un equipo necesita un nombre.
TEAM_NAME_TAKEN=Ya existe un equipo llamado '{0}'.
TEAM_HAS_MEMBERS=El equipo todavía tiene {0} miembro(s): {1}. Elimínelos antes de borrar el equipo.
TEAM_NOT_A_MEMBER={0} no es miembro de este equipo.
TEAM_ALREADY_MEMBER={0} ya es miembro de este equipo.
TEAM_CREDENTIAL_NOT_MEMBER=El propietario de la credencial no es miembro de ese equipo.
TEAM_FORBIDDEN=Solo un administrador de la plataforma o un administrador de este equipo puede hacerlo.
TEAM_OPERATION_FAILED=La operación del equipo ha fallado. Consulte el registro del administrador.
TEAM_SHARE_TARGET_NOT_FOUND=El equipo con el que se quiere compartir no existe.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=No se puede cambiar el grupo de recursos de la conexión activa de SAP AI Core. Desactive primero la conexión, o cree otra conexión con este grupo de recursos, pruébela y actívela.
