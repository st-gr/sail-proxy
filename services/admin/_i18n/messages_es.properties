# Server messages (CAP runtime bundle, req.reject keys) - Spanish

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=La configuración no se ha guardado: su documento no es un JSON válido.
CONFIG_SAVE_INVALID=La configuración no se ha guardado porque no es válida: {0}
CONFIG_SAVE_ACTIVE=No se puede guardar una configuración activa. Active primero otra configuración, o duplique esta y edite la copia.
CONFIG_SAVE_ACTIVATION_COLUMNS=Qué configuración está activa, y cuándo y quién la implementó, solo cambia mediante Activar o Revertir.
CONFIG_SAVE_NO_KEY=La configuración no se ha guardado: no se ha podido identificar.
CONFIG_CREATE_USE_ACTION=Las configuraciones se crean solo con la acción createConfiguration, no mediante un POST sobre la entidad.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Un equipo necesita un nombre.
TEAM_NAME_TAKEN=Ya existe un equipo llamado '{0}'.
TEAM_HAS_MEMBERS=El equipo todavía tiene {0} miembro(s): {1}. Elimínelos antes de borrar el equipo.
TEAM_NOT_A_MEMBER={0} no es miembro de este equipo.
TEAM_ALREADY_MEMBER={0} ya es miembro de este equipo.
TEAM_CREDENTIAL_NOT_MEMBER=El propietario de la credencial no es miembro de ese equipo.
TEAM_FORBIDDEN=Solo un administrador de la plataforma o un administrador de este equipo puede hacerlo.
TEAM_OPERATION_FAILED=La operación del equipo ha fallado. Consulte el registro del administrador.
TEAM_SHARE_TARGET_NOT_FOUND=El equipo con el que se quiere compartir no existe.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=No se puede cambiar el grupo de recursos de la conexión activa de SAP AI Core. Desactive primero la conexión, o cree otra conexión con este grupo de recursos, pruébela y actívela.

# Logging settings outside the configuration versions (admin-service-logging-settings.ts, services/loggingSettings.ts)
LOGGING_LEVEL_INVALID=El nivel de registro "{0}" no es conocido. Use ERROR, WARN, INFO, DEBUG o TRACE.
LOGGING_MINUTES_INVALID={0} no es un número de minutos válido. Use un número entero de 1 a 1440.
LOGGING_MINUTES_WITHOUT_LEVEL=Se indicó una duración de {0} minutos sin nivel predeterminado. Elija un nivel predeterminado u omita la duración.
LOGGING_COMPONENTS_NOT_OBJECT=Los niveles de componente deben ser un objeto JSON que indique cada componente con su nivel.
LOGGING_COMPONENT_NAME_INVALID=El nombre de componente {0} no es válido: necesita de 1 a 80 caracteres y ningún carácter de control.
LOGGING_COMPONENT_ENTRY_INVALID=La entrada del componente {0} debe ser un objeto con un nivel y, si se desea, minutos.
LOGGING_TOO_MANY_COMPONENTS=Como máximo 50 componentes pueden tener su propio nivel; se indicaron {0}.
LOGGING_FIXED_LOG_LEVEL=El nivel predeterminado no se puede establecer aquí: la variable de entorno LOG_LEVEL del gateway lo fija en {0}. Los niveles de componente siguen aplicándose.
LOGGING_FIXED_LOG_SHIPPING=El almacenamiento del registro del gateway no se puede activar aquí: la variable de entorno GATEWAY_LOG_SHIPPING del gateway está en {0}.
LOGGING_SETTINGS_NOT_DELIVERED=Los ajustes se han guardado, pero no se ha podido avisar al gateway ahora. Los recibirá la próxima vez que cargue su configuración.
LOGGING_SETTINGS_TIMED_NEEDS_VALKEY=Los ajustes se han guardado. Un nivel con fin no se pasa al gateway, porque sin Valkey no se le puede avisar de cuándo termina. Los ajustes sin fin los recibirá la próxima vez que cargue su configuración.
LOGGING_DELETE_UNKNOWN=El valor "{0}" no se puede eliminar aquí. Use "log" para el registro guardado del gateway, "traces" para las trazas de payload y las trazas sin procesar, o "all" para ambos.
PAYLOAD_TRACE_NOT_FOUND=No hay ninguna traza de payload con el ID "{0}". Puede que se haya eliminado al terminar su tiempo de retención.
RAW_TRACE_NOT_FOUND=No hay ninguna traza sin procesar con el ID "{0}". Puede que se haya eliminado al terminar su tiempo de retención.
RAW_STAGE_NOT_FOUND=La traza sin procesar "{1}" no tiene la etapa "{0}".

# Raw capture sessions (admin-service-raw-capture.ts, services/rawCaptureSessions.ts)
RAW_CAPTURE_NOTHING_SELECTED=Elija al menos una clave de API o una dirección de correo electrónico cuyas solicitudes se deban capturar sin procesar.
RAW_CAPTURE_DURATION_INVALID=Una captura sin procesar dura 15, 60 o 240 minutos; "{0}" no es ninguna de esas duraciones.
RAW_CAPTURE_DURATION_MISSING=Elija cuánto dura la captura sin procesar: 15, 60 o 240 minutos.
RAW_CAPTURE_DURATION_TOO_LONG=La configuración permite una captura sin procesar de como máximo {0} minutos (payload_capture.raw.max_duration_minutes). Elija una duración más corta.
RAW_CAPTURE_REASON_REQUIRED=Indique el motivo de la captura sin procesar. Se anota en el registro de auditoría.
RAW_CAPTURE_REASON_TOO_LONG=El motivo puede tener como máximo {0} caracteres.
RAW_CAPTURE_UNKNOWN_KEY=Estas claves de API o credenciales de AWS no existen o se han eliminado: {0}
RAW_CAPTURE_ADDRESS_WITHOUT_CREDENTIALS=Estas direcciones de correo electrónico no tienen ninguna clave de API ni ninguna credencial de AWS: {0}
RAW_CAPTURE_NO_VALKEY=La captura sin procesar no se puede iniciar ni detener ahora: el servicio de administración no puede acceder a Valkey, a través del cual el gateway conoce las sesiones de captura sin procesar. Vuelva a intentarlo cuando Valkey esté accesible.
RAW_CAPTURE_NOT_FOUND=No hay ninguna sesión de captura sin procesar con el ID "{0}".
RAW_CAPTURE_ALREADY_ENDED=La sesión de captura sin procesar "{0}" ya ha terminado.
RAW_CAPTURE_KEY_MISSING=La captura sin procesar está en curso, pero METADATA_ENCRYPTION_KEY no está definida en el servicio de administración: las trazas sin procesar se sellan entonces con una clave de desarrollo conocida públicamente, de modo que cualquiera con acceso a los datos almacenados puede leerlas. Defina un valor aleatorio de al menos 32 caracteres en el gateway y en el servicio de administración.
RAW_CAPTURE_KEY_TOO_SHORT=La captura sin procesar está en curso, pero METADATA_ENCRYPTION_KEY tiene menos de 32 caracteres, lo que debilita el sellado de las trazas sin procesar. Defina un valor aleatorio de al menos 32 caracteres en el gateway y en el servicio de administración.
RAW_CAPTURE_KEY_PUBLICLY_KNOWN=La captura sin procesar está en curso, pero METADATA_ENCRYPTION_KEY tiene un valor que se publica con el producto, de modo que cualquiera con acceso a los datos almacenados puede leer las trazas sin procesar. Defina un valor aleatorio de al menos 32 caracteres en el gateway y en el servicio de administración.
