# Server messages (CAP runtime bundle, req.reject keys) - English (default)

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=The configuration was not saved: its document is not valid JSON.
CONFIG_SAVE_INVALID=The configuration was not saved because it is not valid: {0}
CONFIG_SAVE_ACTIVE=An active configuration cannot be saved. Activate another configuration first, or duplicate this one and edit the copy.
CONFIG_SAVE_ACTIVATION_COLUMNS=Which configuration is active, and when and by whom it was deployed, changes only through Activate or Rollback.
CONFIG_SAVE_NO_KEY=The configuration was not saved: it could not be identified.
CONFIG_CREATE_USE_ACTION=Configurations are created only with the createConfiguration action, not by a POST on the entity.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=A team needs a name.
TEAM_NAME_TAKEN=A team named '{0}' already exists.
TEAM_HAS_MEMBERS=The team still has {0} member(s): {1}. Remove them before deleting the team.
TEAM_NOT_A_MEMBER={0} is not a member of this team.
TEAM_ALREADY_MEMBER={0} is already a member of this team.
TEAM_CREDENTIAL_NOT_MEMBER=The credential's owner is not a member of that team.
TEAM_FORBIDDEN=Only a platform administrator or an administrator of this team may do that.
TEAM_OPERATION_FAILED=The team operation failed. See the admin log for details.
TEAM_SHARE_TARGET_NOT_FOUND=The team to share with does not exist.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=The resource group of the active SAP AI Core connection cannot be changed. Deactivate the connection first, or create another connection with this resource group, test it and activate it.
