# Server messages (CAP runtime bundle, req.reject keys) - English (default)

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=The configuration was not saved: its document is not valid JSON.
CONFIG_SAVE_INVALID=The configuration was not saved because it is not valid: {0}
CONFIG_SAVE_ACTIVE=An active configuration cannot be saved. Activate another configuration first, or duplicate this one and edit the copy.
CONFIG_SAVE_ACTIVATION_COLUMNS=Which configuration is active, and when and by whom it was deployed, changes only through Activate or Rollback.
CONFIG_SAVE_NO_KEY=The configuration was not saved: it could not be identified.
CONFIG_CREATE_USE_ACTION=Configurations are created only with the createConfiguration action, not by a POST on the entity.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=A team needs a name.
TEAM_NAME_TAKEN=A team named '{0}' already exists.
TEAM_HAS_MEMBERS=The team still has {0} member(s): {1}. Remove them before deleting the team.
TEAM_NOT_A_MEMBER={0} is not a member of this team.
TEAM_ALREADY_MEMBER={0} is already a member of this team.
TEAM_CREDENTIAL_NOT_MEMBER=The credential's owner is not a member of that team.
TEAM_FORBIDDEN=Only a platform administrator or an administrator of this team may do that.
TEAM_OPERATION_FAILED=The team operation failed. See the admin log for details.
TEAM_SHARE_TARGET_NOT_FOUND=The team to share with does not exist.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=The resource group of the active SAP AI Core connection cannot be changed. Deactivate the connection first, or create another connection with this resource group, test it and activate it.

# Logging settings outside the configuration versions (admin-service-logging-settings.ts, services/loggingSettings.ts)
LOGGING_LEVEL_INVALID=The log level "{0}" is not known. Use ERROR, WARN, INFO, DEBUG or TRACE.
LOGGING_MINUTES_INVALID={0} is not a valid number of minutes. Use a whole number from 1 to 1440.
LOGGING_MINUTES_WITHOUT_LEVEL=A duration of {0} minutes was given without a default level. Choose a default level, or leave out the duration.
LOGGING_COMPONENTS_NOT_OBJECT=The component levels must be a JSON object that names each component with its level.
LOGGING_COMPONENT_NAME_INVALID=The component name {0} is not valid: it needs 1 to 80 characters and no control characters.
LOGGING_COMPONENT_ENTRY_INVALID=The entry for the component {0} must be an object with a level and, if wanted, minutes.
LOGGING_TOO_MANY_COMPONENTS=At most 50 components can have their own level; {0} were given.
LOGGING_FIXED_LOG_LEVEL=The default level cannot be set here: the gateway's environment variable LOG_LEVEL fixes it to {0}. Component levels still apply.
LOGGING_FIXED_LOG_SHIPPING=Storing the gateway's log cannot be switched on here: the gateway's environment variable GATEWAY_LOG_SHIPPING is {0}.
LOGGING_SETTINGS_NOT_DELIVERED=The settings are saved, but the gateway could not be told now. It gets them the next time it loads its configuration.
LOGGING_SETTINGS_TIMED_NEEDS_VALKEY=The settings are saved. A level with an end is not passed to the gateway, because without Valkey the gateway cannot be told when it ends. Settings without an end reach it the next time it loads its configuration.
LOGGING_DELETE_UNKNOWN=The value "{0}" cannot be deleted here. Use "log" for the stored gateway log, "traces" for the payload traces and raw traces, or "all" for both.
PAYLOAD_TRACE_NOT_FOUND=There is no payload trace with the ID "{0}". It may have been deleted at the end of its retention time.
RAW_TRACE_NOT_FOUND=There is no raw trace with the ID "{0}". It may have been deleted at the end of its retention time.
RAW_STAGE_NOT_FOUND=The raw trace "{1}" has no stage "{0}".

# Raw capture sessions (admin-service-raw-capture.ts, services/rawCaptureSessions.ts)
RAW_CAPTURE_NOTHING_SELECTED=Choose at least one API key or e-mail address whose requests are to be captured raw.
RAW_CAPTURE_DURATION_INVALID=A raw capture runs for 15, 60 or 240 minutes; "{0}" is not one of them.
RAW_CAPTURE_DURATION_MISSING=Choose how long the raw capture runs: 15, 60 or 240 minutes.
RAW_CAPTURE_DURATION_TOO_LONG=The configuration allows a raw capture of at most {0} minutes (payload_capture.raw.max_duration_minutes). Choose a shorter duration.
RAW_CAPTURE_REASON_REQUIRED=Give the reason for the raw capture. It is recorded in the audit log.
RAW_CAPTURE_REASON_TOO_LONG=The reason can have at most {0} characters.
RAW_CAPTURE_UNKNOWN_KEY=These API keys or AWS credentials do not exist or were deleted: {0}
RAW_CAPTURE_ADDRESS_WITHOUT_CREDENTIALS=These e-mail addresses own no API key and no AWS credential: {0}
RAW_CAPTURE_NO_VALKEY=The raw capture cannot be started or stopped now: the admin service cannot reach Valkey, through which the gateway learns of raw capture sessions. Try again once Valkey can be reached.
RAW_CAPTURE_NOT_FOUND=There is no raw capture session with the ID "{0}".
RAW_CAPTURE_ALREADY_ENDED=The raw capture session "{0}" has already ended.
RAW_CAPTURE_KEY_MISSING=The raw capture is running, but METADATA_ENCRYPTION_KEY is not set in the admin service: raw traces are then sealed with a publicly known development key, so anyone with access to the stored data can read them. Set a random value of at least 32 characters in the gateway and the admin service.
RAW_CAPTURE_KEY_TOO_SHORT=The raw capture is running, but METADATA_ENCRYPTION_KEY has fewer than 32 characters, which makes the seal of the raw traces weak. Set a random value of at least 32 characters in the gateway and the admin service.
RAW_CAPTURE_KEY_PUBLICLY_KNOWN=The raw capture is running, but METADATA_ENCRYPTION_KEY has a value that is published with the product, so anyone with access to the stored data can read the raw traces. Set a random value of at least 32 characters in the gateway and the admin service.
