# Server messages (CAP runtime bundle, req.reject keys) - French

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=La configuration n’a pas été enregistrée : son document n’est pas un JSON valide.
CONFIG_SAVE_INVALID=La configuration n’a pas été enregistrée, car elle n’est pas valide : {0}
CONFIG_SAVE_ACTIVE=Impossible d’enregistrer une configuration active. Activez d’abord une autre configuration, ou dupliquez celle-ci et modifiez la copie.
CONFIG_SAVE_ACTIVATION_COLUMNS=La configuration active, ainsi que la date et l’auteur de son déploiement, ne changent que par Activer ou Restaurer.
CONFIG_SAVE_NO_KEY=La configuration n’a pas été enregistrée : elle n’a pas pu être identifiée.
CONFIG_CREATE_USE_ACTION=Les configurations se créent uniquement avec l’action createConfiguration, pas par un POST sur l’entité.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Une équipe doit avoir un nom.
TEAM_NAME_TAKEN=Une équipe nommée '{0}' existe déjà.
TEAM_HAS_MEMBERS=L'équipe compte encore {0} membre(s) : {1}. Retirez-les avant de supprimer l'équipe.
TEAM_NOT_A_MEMBER={0} n'est pas membre de cette équipe.
TEAM_ALREADY_MEMBER={0} est déjà membre de cette équipe.
TEAM_CREDENTIAL_NOT_MEMBER=Le propriétaire de l'identifiant n'est pas membre de cette équipe.
TEAM_FORBIDDEN=Seul un administrateur de la plateforme ou un administrateur de cette équipe peut faire cela.
TEAM_OPERATION_FAILED=L’opération sur l’équipe a échoué. Consultez le journal de l’administration.
TEAM_SHARE_TARGET_NOT_FOUND=L’équipe avec laquelle partager n’existe pas.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Impossible de modifier le groupe de ressources de la connexion SAP AI Core active. Désactivez d’abord la connexion, ou créez une autre connexion avec ce groupe de ressources, testez-la et activez-la.

# Logging settings outside the configuration versions (admin-service-logging-settings.ts, services/loggingSettings.ts)
LOGGING_LEVEL_INVALID=Le niveau de journalisation « {0} » est inconnu. Utilisez ERROR, WARN, INFO, DEBUG ou TRACE.
LOGGING_MINUTES_INVALID={0} n’est pas un nombre de minutes valide. Utilisez un nombre entier de 1 à 1440.
LOGGING_MINUTES_WITHOUT_LEVEL=Une durée de {0} minutes a été indiquée sans niveau par défaut. Choisissez un niveau par défaut ou omettez la durée.
LOGGING_COMPONENTS_NOT_OBJECT=Les niveaux des composants doivent être un objet JSON qui nomme chaque composant avec son niveau.
LOGGING_COMPONENT_NAME_INVALID=Le nom de composant {0} n’est pas valide : il doit compter de 1 à 80 caractères, sans caractère de contrôle.
LOGGING_COMPONENT_ENTRY_INVALID=L’entrée du composant {0} doit être un objet avec un niveau et, si souhaité, des minutes.
LOGGING_TOO_MANY_COMPONENTS=Au plus 50 composants peuvent avoir leur propre niveau ; {0} ont été indiqués.
LOGGING_FIXED_LOG_LEVEL=Le niveau par défaut ne peut pas être défini ici : la variable d’environnement LOG_LEVEL de la passerelle le fixe à {0}. Les niveaux des composants s’appliquent toujours.
LOGGING_FIXED_LOG_SHIPPING=L’enregistrement du journal de la passerelle ne peut pas être activé ici : la variable d’environnement GATEWAY_LOG_SHIPPING de la passerelle vaut {0}.
LOGGING_SETTINGS_NOT_DELIVERED=Les paramètres sont enregistrés, mais la passerelle n’a pas pu être prévenue maintenant. Elle les recevra au prochain chargement de sa configuration.
LOGGING_SETTINGS_TIMED_NEEDS_VALKEY=Les paramètres sont enregistrés. Un niveau avec une fin n’est pas transmis à la passerelle, car sans Valkey elle ne peut pas être prévenue de sa fin. Elle recevra les paramètres sans fin au prochain chargement de sa configuration.
LOGGING_DELETE_UNKNOWN=La valeur "{0}" ne peut pas être supprimée ici. Utilisez "log" pour le journal enregistré du gateway, "traces" pour les traces de payload et les traces brutes, ou "all" pour les deux.
PAYLOAD_TRACE_NOT_FOUND=Il n’existe aucune trace de payload avec l’ID "{0}". Elle a peut-être été supprimée à la fin de sa durée de conservation.
RAW_TRACE_NOT_FOUND=Il n’existe aucune trace brute avec l’ID "{0}". Elle a peut-être été supprimée à la fin de sa durée de conservation.
RAW_STAGE_NOT_FOUND=La trace brute "{1}" n’a pas d’étape "{0}".

# Raw capture sessions (admin-service-raw-capture.ts, services/rawCaptureSessions.ts)
RAW_CAPTURE_NOTHING_SELECTED=Choisissez au moins une clé d’API ou une adresse e-mail dont les requêtes doivent être capturées brutes.
RAW_CAPTURE_DURATION_INVALID=Une capture brute dure 15, 60 ou 240 minutes ; "{0}" n’en fait pas partie.
RAW_CAPTURE_DURATION_MISSING=Choisissez la durée de la capture brute : 15, 60 ou 240 minutes.
RAW_CAPTURE_DURATION_TOO_LONG=La configuration autorise une capture brute de {0} minutes au plus (payload_capture.raw.max_duration_minutes). Choisissez une durée plus courte.
RAW_CAPTURE_REASON_REQUIRED=Indiquez le motif de la capture brute. Il est consigné dans le journal d’audit.
RAW_CAPTURE_REASON_TOO_LONG=Le motif peut comporter au plus {0} caractères.
RAW_CAPTURE_UNKNOWN_KEY=Ces clés d’API ou identifiants AWS n’existent pas ou ont été supprimés : {0}
RAW_CAPTURE_ADDRESS_WITHOUT_CREDENTIALS=Ces adresses e-mail ne possèdent ni clé d’API ni identifiants AWS : {0}
RAW_CAPTURE_NO_VALKEY=La capture brute ne peut être ni démarrée ni arrêtée maintenant : le service d’administration ne peut pas joindre Valkey, par lequel la passerelle apprend l’existence des sessions de capture brute. Réessayez dès que Valkey est joignable.
RAW_CAPTURE_NOT_FOUND=Il n’existe aucune session de capture brute avec l’ID "{0}".
RAW_CAPTURE_ALREADY_ENDED=La session de capture brute "{0}" est déjà terminée.
RAW_CAPTURE_KEY_MISSING=La capture brute est en cours, mais METADATA_ENCRYPTION_KEY n’est pas définie dans le service d’administration : les traces brutes sont alors scellées avec une clé de développement connue publiquement, et toute personne ayant accès aux données stockées peut les lire. Définissez une valeur aléatoire d’au moins 32 caractères dans la passerelle et dans le service d’administration.
RAW_CAPTURE_KEY_TOO_SHORT=La capture brute est en cours, mais METADATA_ENCRYPTION_KEY compte moins de 32 caractères, ce qui affaiblit le scellement des traces brutes. Définissez une valeur aléatoire d’au moins 32 caractères dans la passerelle et dans le service d’administration.
RAW_CAPTURE_KEY_PUBLICLY_KNOWN=La capture brute est en cours, mais METADATA_ENCRYPTION_KEY a une valeur publiée avec le produit, et toute personne ayant accès aux données stockées peut lire les traces brutes. Définissez une valeur aléatoire d’au moins 32 caractères dans la passerelle et dans le service d’administration.
