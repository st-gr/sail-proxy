# Server messages (CAP runtime bundle, req.reject keys) - French

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=La configuration n’a pas été enregistrée : son document n’est pas un JSON valide.
CONFIG_SAVE_INVALID=La configuration n’a pas été enregistrée, car elle n’est pas valide : {0}
CONFIG_SAVE_ACTIVE=Impossible d’enregistrer une configuration active. Activez d’abord une autre configuration, ou dupliquez celle-ci et modifiez la copie.
CONFIG_SAVE_ACTIVATION_COLUMNS=La configuration active, ainsi que la date et l’auteur de son déploiement, ne changent que par Activer ou Restaurer.
CONFIG_SAVE_NO_KEY=La configuration n’a pas été enregistrée : elle n’a pas pu être identifiée.
CONFIG_CREATE_USE_ACTION=Les configurations se créent uniquement avec l’action createConfiguration, pas par un POST sur l’entité.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Une équipe doit avoir un nom.
TEAM_NAME_TAKEN=Une équipe nommée '{0}' existe déjà.
TEAM_HAS_MEMBERS=L'équipe compte encore {0} membre(s) : {1}. Retirez-les avant de supprimer l'équipe.
TEAM_NOT_A_MEMBER={0} n'est pas membre de cette équipe.
TEAM_ALREADY_MEMBER={0} est déjà membre de cette équipe.
TEAM_CREDENTIAL_NOT_MEMBER=Le propriétaire de l'identifiant n'est pas membre de cette équipe.
TEAM_FORBIDDEN=Seul un administrateur de la plateforme ou un administrateur de cette équipe peut faire cela.
TEAM_OPERATION_FAILED=L’opération sur l’équipe a échoué. Consultez le journal de l’administration.
TEAM_SHARE_TARGET_NOT_FOUND=L’équipe avec laquelle partager n’existe pas.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Impossible de modifier le groupe de ressources de la connexion SAP AI Core active. Désactivez d’abord la connexion, ou créez une autre connexion avec ce groupe de ressources, testez-la et activez-la.
