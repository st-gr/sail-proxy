# Server messages (CAP runtime bundle, req.reject keys) - Portuguese

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=A configuração não foi guardada: o documento não é um JSON válido.
CONFIG_SAVE_INVALID=A configuração não foi guardada porque não é válida: {0}
CONFIG_SAVE_ACTIVE=Não é possível guardar uma configuração ativa. Ative primeiro outra configuração, ou duplique esta e edite a cópia.
CONFIG_SAVE_ACTIVATION_COLUMNS=Qual configuração está ativa, e quando e por quem foi implementada, só muda através de Ativar ou Reverter.
CONFIG_SAVE_NO_KEY=A configuração não foi guardada: não foi possível identificá-la.
CONFIG_CREATE_USE_ACTION=As configurações são criadas apenas com a ação createConfiguration, não por um POST na entidade.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Uma equipe precisa de um nome.
TEAM_NAME_TAKEN=Já existe uma equipe chamada '{0}'.
TEAM_HAS_MEMBERS=A equipe ainda tem {0} membro(s): {1}. Remova-os antes de excluir a equipe.
TEAM_NOT_A_MEMBER={0} não é membro desta equipe.
TEAM_ALREADY_MEMBER={0} já é membro desta equipe.
TEAM_CREDENTIAL_NOT_MEMBER=O proprietário da credencial não é membro dessa equipe.
TEAM_FORBIDDEN=Somente um administrador da plataforma ou um administrador desta equipe pode fazer isso.
TEAM_OPERATION_FAILED=A operação da equipa falhou. Consulte o registo da administração.
TEAM_SHARE_TARGET_NOT_FOUND=A equipa com a qual partilhar não existe.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Não é possível alterar o grupo de recursos da ligação ativa do SAP AI Core. Desative primeiro a ligação, ou crie outra ligação com este grupo de recursos, teste-a e ative-a.

# Logging settings outside the configuration versions (admin-service-logging-settings.ts, services/loggingSettings.ts)
LOGGING_LEVEL_INVALID=O nível de registo "{0}" não é conhecido. Utilize ERROR, WARN, INFO, DEBUG ou TRACE.
LOGGING_MINUTES_INVALID={0} não é um número de minutos válido. Utilize um número inteiro de 1 a 1440.
LOGGING_MINUTES_WITHOUT_LEVEL=Foi indicada uma duração de {0} minutos sem nível predefinido. Escolha um nível predefinido ou omita a duração.
LOGGING_COMPONENTS_NOT_OBJECT=Os níveis dos componentes têm de ser um objeto JSON que indique cada componente com o seu nível.
LOGGING_COMPONENT_NAME_INVALID=O nome de componente {0} não é válido: precisa de 1 a 80 caracteres e nenhum carácter de controlo.
LOGGING_COMPONENT_ENTRY_INVALID=A entrada do componente {0} tem de ser um objeto com um nível e, se pretendido, minutos.
LOGGING_TOO_MANY_COMPONENTS=No máximo 50 componentes podem ter um nível próprio; foram indicados {0}.
LOGGING_FIXED_LOG_LEVEL=O nível predefinido não pode ser definido aqui: a variável de ambiente LOG_LEVEL do gateway fixa-o em {0}. Os níveis dos componentes continuam a aplicar-se.
LOGGING_FIXED_LOG_SHIPPING=Não é possível ativar aqui o armazenamento do registo do gateway: a variável de ambiente GATEWAY_LOG_SHIPPING do gateway está em {0}.
LOGGING_SETTINGS_NOT_DELIVERED=As definições foram guardadas, mas não foi possível avisar o gateway agora. Recebe-as da próxima vez que carregar a sua configuração.
LOGGING_SETTINGS_TIMED_NEEDS_VALKEY=As definições foram guardadas. Um nível com fim não é passado ao gateway, porque sem Valkey não é possível avisá-lo de quando termina. As definições sem fim recebe-as da próxima vez que carregar a sua configuração.
LOGGING_DELETE_UNKNOWN=O valor "{0}" não pode ser eliminado aqui. Use "log" para o registo guardado do gateway, "traces" para os rastreios de payload e os rastreios em bruto, ou "all" para ambos.
PAYLOAD_TRACE_NOT_FOUND=Não existe nenhum rastreio de payload com o ID "{0}". Pode ter sido eliminado no fim do seu tempo de retenção.
RAW_TRACE_NOT_FOUND=Não existe nenhum rastreio em bruto com o ID "{0}". Pode ter sido eliminado no fim do seu tempo de retenção.
RAW_STAGE_NOT_FOUND=O rastreio em bruto "{1}" não tem a fase "{0}".

# Raw capture sessions (admin-service-raw-capture.ts, services/rawCaptureSessions.ts)
RAW_CAPTURE_NOTHING_SELECTED=Escolha pelo menos uma chave de API ou um endereço de e-mail cujos pedidos devam ser capturados em bruto.
RAW_CAPTURE_DURATION_INVALID=Uma captura em bruto dura 15, 60 ou 240 minutos; "{0}" não é nenhuma dessas durações.
RAW_CAPTURE_DURATION_MISSING=Escolha quanto tempo dura a captura em bruto: 15, 60 ou 240 minutos.
RAW_CAPTURE_DURATION_TOO_LONG=A configuração permite uma captura em bruto de no máximo {0} minutos (payload_capture.raw.max_duration_minutes). Escolha uma duração mais curta.
RAW_CAPTURE_REASON_REQUIRED=Indique o motivo da captura em bruto. Fica registado no registo de auditoria.
RAW_CAPTURE_REASON_TOO_LONG=O motivo pode ter no máximo {0} caracteres.
RAW_CAPTURE_UNKNOWN_KEY=Estas chaves de API ou credenciais AWS não existem ou foram eliminadas: {0}
RAW_CAPTURE_ADDRESS_WITHOUT_CREDENTIALS=Estes endereços de e-mail não têm nenhuma chave de API nem nenhuma credencial AWS: {0}
RAW_CAPTURE_NO_VALKEY=A captura em bruto não pode ser iniciada nem parada agora: o serviço de administração não consegue aceder ao Valkey, através do qual o gateway fica a saber das sessões de captura em bruto. Tente novamente quando o Valkey estiver acessível.
RAW_CAPTURE_NOT_FOUND=Não existe nenhuma sessão de captura em bruto com o ID "{0}".
RAW_CAPTURE_ALREADY_ENDED=A sessão de captura em bruto "{0}" já terminou.
RAW_CAPTURE_KEY_MISSING=A captura em bruto está em curso, mas METADATA_ENCRYPTION_KEY não está definida no serviço de administração: os rastreios em bruto são então selados com uma chave de desenvolvimento publicamente conhecida, pelo que qualquer pessoa com acesso aos dados armazenados os pode ler. Defina um valor aleatório com pelo menos 32 caracteres no gateway e no serviço de administração.
RAW_CAPTURE_KEY_TOO_SHORT=A captura em bruto está em curso, mas METADATA_ENCRYPTION_KEY tem menos de 32 caracteres, o que torna fraco o selo dos rastreios em bruto. Defina um valor aleatório com pelo menos 32 caracteres no gateway e no serviço de administração.
RAW_CAPTURE_KEY_PUBLICLY_KNOWN=A captura em bruto está em curso, mas METADATA_ENCRYPTION_KEY tem um valor publicado com o produto, pelo que qualquer pessoa com acesso aos dados armazenados pode ler os rastreios em bruto. Defina um valor aleatório com pelo menos 32 caracteres no gateway e no serviço de administração.
