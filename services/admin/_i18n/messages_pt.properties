# Server messages (CAP runtime bundle, req.reject keys) - Portuguese

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=A configuração não foi guardada: o documento não é um JSON válido.
CONFIG_SAVE_INVALID=A configuração não foi guardada porque não é válida: {0}
CONFIG_SAVE_ACTIVE=Não é possível guardar uma configuração ativa. Ative primeiro outra configuração, ou duplique esta e edite a cópia.
CONFIG_SAVE_ACTIVATION_COLUMNS=Qual configuração está ativa, e quando e por quem foi implementada, só muda através de Ativar ou Reverter.
CONFIG_SAVE_NO_KEY=A configuração não foi guardada: não foi possível identificá-la.
CONFIG_CREATE_USE_ACTION=As configurações são criadas apenas com a ação createConfiguration, não por um POST na entidade.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Uma equipe precisa de um nome.
TEAM_NAME_TAKEN=Já existe uma equipe chamada '{0}'.
TEAM_HAS_MEMBERS=A equipe ainda tem {0} membro(s): {1}. Remova-os antes de excluir a equipe.
TEAM_NOT_A_MEMBER={0} não é membro desta equipe.
TEAM_ALREADY_MEMBER={0} já é membro desta equipe.
TEAM_CREDENTIAL_NOT_MEMBER=O proprietário da credencial não é membro dessa equipe.
TEAM_FORBIDDEN=Somente um administrador da plataforma ou um administrador desta equipe pode fazer isso.
TEAM_OPERATION_FAILED=A operação da equipa falhou. Consulte o registo da administração.
TEAM_SHARE_TARGET_NOT_FOUND=A equipa com a qual partilhar não existe.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Não é possível alterar o grupo de recursos da ligação ativa do SAP AI Core. Desative primeiro a ligação, ou crie outra ligação com este grupo de recursos, teste-a e ative-a.
