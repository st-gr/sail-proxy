sapRates.servicePlan=Plan de servicio
sapRates.servicePlanInfo=Plan de servicio de SAP al que se aplica el precio (extended = el generative AI hub). Descriptivo.
sapRates.sku=SKU
sapRates.skuInfo=Material de SAP / SKU de la línea de precio. Descriptivo.
sapRates.usageType=Tipo de uso
sapRates.usageTypeInfo=Clasificación de la subcuenta de SAP que determina el precio: productiva o no productiva. SAP clasifica cada subcuenta (una sandbox puede clasificarse como productiva). Los precios se asignan según este valor dentro del período de validez.
sapRates.validFrom=Válido desde
sapRates.validFromInfo=Inicio del período de validez (inclusive). El costo usa el precio cuyo período [Válido desde, Válido hasta] contiene la hora del evento.
sapRates.validTo=Válido hasta
sapRates.validToInfo=Fin del período de validez (inclusive). Use una fecha muy lejana en el futuro para el precio actualmente activo. Los períodos del mismo tipo de uso no deben solaparse.

