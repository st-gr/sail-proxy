# SAP Rates app
sapRates.capacityUnitPrice=Precio de la Capacity Unit de SAP
sapRates.capacityUnitPrices=Precios de la Capacity Unit de SAP
sapRates.currencyInfo=Código de moneda ISO para Precio por CU (p. ej., USD). La búsqueda de precios solo coincide por Tipo de uso, así que mantenga una única moneda por tipo de uso y período.
sapRates.pricePerCu=Precio por CU
sapRates.pricePerCuInfo=Precio, en la moneda indicada, por Capacity Unit, según la lista de precios de SAP BTP (plan Extended). Costo = Capacity Units x este precio.
sapRates.priceValidity=Precio y validez
