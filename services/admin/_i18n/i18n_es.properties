teams.quotaProfileInfo=Valores predeterminados para los campos vacíos del pool. El pool es un presupuesto que comparte todo el equipo: por campo se aplica el valor propio del pool del equipo, si no el valor de este perfil, si no sin límite.
teams.memberQuotaProfile=Perfil de miembro
teams.memberQuotaProfileInfo=Límite para cada miembro. Funciona para cada miembro como un perfil de cuota personal, por debajo de los límites propios y del perfil propio del miembro: se aplica a un campo que estos dejan vacío. Un miembro de varios equipos recibe el valor más estricto por campo.
teams.entitlementCatalogInfo=Los modelos que puede usar el equipo. El catálogo propio de un miembro se cruza con él. Vacío = el catálogo predeterminado.
teams.toolPolicyInfo=Una herramienta debe cumplir la política del equipo, la del miembro y la de la clave; prevalece el modo más estricto. Vacío = el equipo no añade nada.
teams.poolRequestsPerMinuteInfo=Solicitudes por minuto de todo el equipo, contadas entre las credenciales de todos los miembros. Vacío = el valor del perfil del pool; si no, sin límite.
teams.poolSpendInfo=Coste SAP más coste de Connections que todos los miembros gastan conjuntamente por ventana (UTC), en la moneda del precio de la unidad de capacidad de SAP. Vacío = el valor del perfil del pool; si no, sin límite.
teams.poolTokensInfo=Tokens de entrada, salida y escritura en caché que todos los miembros usan conjuntamente por ventana (UTC). Vacío = el valor del perfil del pool; si no, sin límite.
teams.poolDefaultInfo=Lo que usa el pool mientras el campo de arriba esté vacío: el valor del perfil del pool o sin límite.
teams.effectiveTeam=Equipo
teams.followsPrimaryTeam=Sigue el equipo principal
