# Server messages (CAP runtime bundle, req.reject keys) - Italian

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=La configurazione non è stata salvata: il suo documento non è un JSON valido.
CONFIG_SAVE_INVALID=La configurazione non è stata salvata perché non è valida: {0}
CONFIG_SAVE_ACTIVE=Impossibile salvare una configurazione attiva. Attivare prima un’altra configurazione, oppure duplicare questa e modificare la copia.
CONFIG_SAVE_ACTIVATION_COLUMNS=Quale configurazione è attiva, e quando e da chi è stata distribuita, cambia solo tramite Attiva o Ripristina.
CONFIG_SAVE_NO_KEY=La configurazione non è stata salvata: non è stato possibile identificarla.
CONFIG_CREATE_USE_ACTION=Le configurazioni si creano solo con l’azione createConfiguration, non con un POST sull’entità.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Un team deve avere un nome.
TEAM_NAME_TAKEN=Esiste già un team chiamato '{0}'.
TEAM_HAS_MEMBERS=Il team ha ancora {0} membro/i: {1}. Rimuovili prima di eliminare il team.
TEAM_NOT_A_MEMBER={0} non è membro di questo team.
TEAM_ALREADY_MEMBER={0} è già membro di questo team.
TEAM_CREDENTIAL_NOT_MEMBER=Il proprietario della credenziale non è membro di quel team.
TEAM_FORBIDDEN=Solo un amministratore della piattaforma o un amministratore di questo team può farlo.
TEAM_OPERATION_FAILED=L’operazione sul team non è riuscita. Consultare il log dell’amministrazione.
TEAM_SHARE_TARGET_NOT_FOUND=Il team con cui condividere non esiste.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Impossibile modificare il gruppo di risorse della connessione SAP AI Core attiva. Disattivare prima la connessione, oppure creare un’altra connessione con questo gruppo di risorse, testarla e attivarla.
