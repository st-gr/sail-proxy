# Server messages (CAP runtime bundle, req.reject keys) - Italian

# Saving an API configuration (config-service.ts onBeforeConfigurationUpdate, onBeforeConfigurationCreate)
CONFIG_SAVE_INVALID_JSON=La configurazione non è stata salvata: il suo documento non è un JSON valido.
CONFIG_SAVE_INVALID=La configurazione non è stata salvata perché non è valida: {0}
CONFIG_SAVE_ACTIVE=Impossibile salvare una configurazione attiva. Attivare prima un’altra configurazione, oppure duplicare questa e modificare la copia.
CONFIG_SAVE_ACTIVATION_COLUMNS=Quale configurazione è attiva, e quando e da chi è stata distribuita, cambia solo tramite Attiva o Ripristina.
CONFIG_SAVE_NO_KEY=La configurazione non è stata salvata: non è stato possibile identificarla.
CONFIG_CREATE_USE_ACTION=Le configurazioni si creano solo con l’azione createConfiguration, non con un POST sull’entità.

# Teams (admin-service-teams.ts)
TEAM_NAME_REQUIRED=Un team deve avere un nome.
TEAM_NAME_TAKEN=Esiste già un team chiamato '{0}'.
TEAM_HAS_MEMBERS=Il team ha ancora {0} membro/i: {1}. Rimuovili prima di eliminare il team.
TEAM_NOT_A_MEMBER={0} non è membro di questo team.
TEAM_ALREADY_MEMBER={0} è già membro di questo team.
TEAM_CREDENTIAL_NOT_MEMBER=Il proprietario della credenziale non è membro di quel team.
TEAM_FORBIDDEN=Solo un amministratore della piattaforma o un amministratore di questo team può farlo.
TEAM_OPERATION_FAILED=L’operazione sul team non è riuscita. Consultare il log dell’amministrazione.
TEAM_SHARE_TARGET_NOT_FOUND=Il team con cui condividere non esiste.

# SAP AI Core connections (admin-service-connections.ts)
CONNECTION_ACTIVE_RESOURCE_GROUP=Impossibile modificare il gruppo di risorse della connessione SAP AI Core attiva. Disattivare prima la connessione, oppure creare un’altra connessione con questo gruppo di risorse, testarla e attivarla.

# Logging settings outside the configuration versions (admin-service-logging-settings.ts, services/loggingSettings.ts)
LOGGING_LEVEL_INVALID=Il livello di log "{0}" non è noto. Usare ERROR, WARN, INFO, DEBUG o TRACE.
LOGGING_MINUTES_INVALID={0} non è un numero di minuti valido. Usare un numero intero da 1 a 1440.
LOGGING_MINUTES_WITHOUT_LEVEL=È stata indicata una durata di {0} minuti senza livello predefinito. Scegliere un livello predefinito oppure omettere la durata.
LOGGING_COMPONENTS_NOT_OBJECT=I livelli dei componenti devono essere un oggetto JSON che indica ogni componente con il suo livello.
LOGGING_COMPONENT_NAME_INVALID=Il nome di componente {0} non è valido: deve avere da 1 a 80 caratteri e nessun carattere di controllo.
LOGGING_COMPONENT_ENTRY_INVALID=La voce del componente {0} deve essere un oggetto con un livello e, se desiderato, i minuti.
LOGGING_TOO_MANY_COMPONENTS=Al massimo 50 componenti possono avere un proprio livello; ne sono stati indicati {0}.
LOGGING_FIXED_LOG_LEVEL=Il livello predefinito non può essere impostato qui: la variabile d’ambiente LOG_LEVEL del gateway lo fissa a {0}. I livelli dei componenti restano validi.
LOGGING_FIXED_LOG_SHIPPING=La memorizzazione del log del gateway non può essere attivata qui: la variabile d’ambiente GATEWAY_LOG_SHIPPING del gateway vale {0}.
LOGGING_SETTINGS_NOT_DELIVERED=Le impostazioni sono salvate, ma ora non è stato possibile avvisare il gateway. Le riceverà al prossimo caricamento della sua configurazione.
LOGGING_SETTINGS_TIMED_NEEDS_VALKEY=Le impostazioni sono salvate. Un livello con una fine non viene passato al gateway, perché senza Valkey non è possibile avvisarlo quando termina. Le impostazioni senza fine le riceverà al prossimo caricamento della sua configurazione.
LOGGING_DELETE_UNKNOWN=Il valore "{0}" non può essere eliminato qui. Usare "log" per il log memorizzato del gateway, "traces" per le tracce del payload e le tracce grezze, oppure "all" per entrambi.
PAYLOAD_TRACE_NOT_FOUND=Non esiste alcuna traccia del payload con l’ID "{0}". Potrebbe essere stata eliminata alla fine del suo periodo di conservazione.
RAW_TRACE_NOT_FOUND=Non esiste alcuna traccia grezza con l’ID "{0}". Potrebbe essere stata eliminata alla fine del suo periodo di conservazione.
RAW_STAGE_NOT_FOUND=La traccia grezza "{1}" non ha la fase "{0}".

# Raw capture sessions (admin-service-raw-capture.ts, services/rawCaptureSessions.ts)
RAW_CAPTURE_NOTHING_SELECTED=Scegliere almeno una chiave API o un indirizzo e-mail le cui richieste devono essere acquisite in forma grezza.
RAW_CAPTURE_DURATION_INVALID=Un’acquisizione grezza dura 15, 60 o 240 minuti; "{0}" non è tra queste durate.
RAW_CAPTURE_DURATION_MISSING=Scegliere per quanto tempo dura l’acquisizione grezza: 15, 60 o 240 minuti.
RAW_CAPTURE_DURATION_TOO_LONG=La configurazione consente un’acquisizione grezza di al massimo {0} minuti (payload_capture.raw.max_duration_minutes). Scegliere una durata più breve.
RAW_CAPTURE_REASON_REQUIRED=Indicare il motivo dell’acquisizione grezza. Viene registrato nel log di audit.
RAW_CAPTURE_REASON_TOO_LONG=Il motivo può contenere al massimo {0} caratteri.
RAW_CAPTURE_UNKNOWN_KEY=Queste chiavi API o credenziali AWS non esistono o sono state eliminate: {0}
RAW_CAPTURE_ADDRESS_WITHOUT_CREDENTIALS=Questi indirizzi e-mail non possiedono né una chiave API né credenziali AWS: {0}
RAW_CAPTURE_NO_VALKEY=L’acquisizione grezza non può essere avviata né arrestata ora: il servizio di amministrazione non riesce a raggiungere Valkey, tramite il quale il gateway viene a sapere delle sessioni di acquisizione grezza. Riprovare quando Valkey è raggiungibile.
RAW_CAPTURE_NOT_FOUND=Non esiste alcuna sessione di acquisizione grezza con l’ID "{0}".
RAW_CAPTURE_ALREADY_ENDED=La sessione di acquisizione grezza "{0}" è già terminata.
RAW_CAPTURE_KEY_MISSING=L’acquisizione grezza è in corso, ma METADATA_ENCRYPTION_KEY non è impostata nel servizio di amministrazione: le tracce grezze vengono quindi sigillate con una chiave di sviluppo pubblicamente nota, e chiunque abbia accesso ai dati memorizzati può leggerle. Impostare un valore casuale di almeno 32 caratteri nel gateway e nel servizio di amministrazione.
RAW_CAPTURE_KEY_TOO_SHORT=L’acquisizione grezza è in corso, ma METADATA_ENCRYPTION_KEY ha meno di 32 caratteri, il che rende debole il sigillo delle tracce grezze. Impostare un valore casuale di almeno 32 caratteri nel gateway e nel servizio di amministrazione.
RAW_CAPTURE_KEY_PUBLICLY_KNOWN=L’acquisizione grezza è in corso, ma METADATA_ENCRYPTION_KEY ha un valore pubblicato con il prodotto, e chiunque abbia accesso ai dati memorizzati può leggere le tracce grezze. Impostare un valore casuale di almeno 32 caratteri nel gateway e nel servizio di amministrazione.
