# SAP Rates app
sapRates.capacityUnitPrice=SAP-Capacity-Unit-Preis
sapRates.capacityUnitPrices=SAP-Capacity-Unit-Preise
sapRates.currencyInfo=ISO-Währungscode für Preis pro CU (z. B. USD). Die Preissuche erfolgt nur über die Nutzungsart; verwenden Sie daher pro Nutzungsart und Zeitraum nur eine Währung.
sapRates.pricePerCu=Preis pro CU
sapRates.pricePerCuInfo=Preis in der angegebenen Währung pro Capacity Unit – aus der SAP-BTP-Preisliste (Extended-Plan). Kosten = Capacity Units x dieser Preis.
sapRates.priceValidity=Preis und Gültigkeit
sapRates.regionInfo=SAP-Region, für die der Preis gilt. Beschreibend; nicht Teil des Schlüssels für die Preiszuordnung.
sapRates.servicePlan=Serviceplan
sapRates.servicePlanInfo=SAP-Serviceplan, für den der Preis gilt (extended = der Generative AI Hub). Beschreibend.
sapRates.sku=SKU
sapRates.skuInfo=SAP-Material / SKU für die Preiszeile. Beschreibend.
sapRates.usageType=Nutzungsart
sapRates.usageTypeInfo=Klassifizierung des SAP-Subaccounts, die den Preis bestimmt: produktiv oder nicht produktiv. SAP klassifiziert jeden Subaccount (eine Sandbox kann als produktiv klassifiziert sein). Preise werden innerhalb des Gültigkeitszeitraums anhand dieses Werts zugeordnet.
sapRates.validFrom=Gültig ab
sapRates.validFromInfo=Beginn des Gültigkeitszeitraums (einschließlich). Die Kosten verwenden den Preis, dessen Zeitraum [Gültig ab, Gültig bis] den Ereigniszeitpunkt enthält.
sapRates.validTo=Gültig bis
sapRates.validToInfo=Ende des Gültigkeitszeitraums (einschließlich). Verwenden Sie für den aktuell gültigen Preis ein Datum in ferner Zukunft. Zeiträume für dieselbe Nutzungsart dürfen sich nicht überschneiden.

# Tool Policies app
toolPolicies.allow=Zulassen
