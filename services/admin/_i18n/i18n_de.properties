toolPolicies.detectedInfo=Wie oft die Richtlinie dieses Tool verweigert hat und es trotzdem verwendet wurde, innerhalb der eigenen Tool-Laufzeit des Clients: erfasst, nicht verhindert.
toolPolicies.email=E-Mail
toolPolicies.facetInfo=Deklariert: Das Tool wurde in der Anfrage angeboten. Aufgerufen: Das Modell hat es aufgerufen.
toolPolicies.general=Allgemein
toolPolicies.isDefault=Standard
toolPolicies.isDefaultInfo=Die Standardrichtlinie gilt für jeden Benutzer ohne Zuordnung. Sie kann weder gelöscht noch aufgehoben werden.
toolPolicies.mode=Modus
toolPolicies.modeInfo=monitor: nur aufzeichnen. strip: Tools entfernen, die die Richtlinie nicht erlaubt. reject: die Anfrage ablehnen.
toolPolicies.note=Hinweis
toolPolicies.owner=Eigentümer
toolPolicies.pattern=Muster
toolPolicies.patternInfoAllow=function:<name>, hosted:<type>, mcp:<server> oder mcp:<server>/<tool>; ein abschließendes * entspricht einem Präfix. Ein Eintrag mcp:<server>/<tool> beschränkt nur diesen Server: seine anderen Tools werden verweigert, alle übrigen Tools sind nicht betroffen.
toolPolicies.patternInfoDeny=function:<name>, hosted:<type>, mcp:<server> oder mcp:<server>/<tool>; ein abschließendes * entspricht einem Präfix.
toolPolicies.period=Zeitraum
toolPolicies.periodInfo=Die Tage, deren erfasste Tool-Nutzung gezählt wird. Standardmäßig die letzten 30 Tage einschließlich heute.
toolPolicies.recordedClientPrograms=Erfasste Client-Programme
toolPolicies.recordedTools=Erfasste Tools
toolPolicies.requestedBy=Angefordert von
toolPolicies.requestedByInfo=Die Client-Programme, die dieses Tool im ausgewählten Zeitraum angefordert haben. Ein Filter stimmt mit jedem einzelnen davon überein.
toolPolicies.sensitiveInfo=Tools, die Aktionen ausführen (Shell, Dateischreibzugriff, E-Mail-Versand). Sie werden zurückgehalten, solange die Unterhaltung Ausgaben aus einer nicht vertrauenswürdigen Quelle enthält. Gleiche Mustersyntax wie bei Zulassen und Verweigern.
toolPolicies.sensitiveTools=Sensible Tools
toolPolicies.toolFilterInfo=Filtert nach Tool-Identität; ein Teilname stimmt überein (enthält).
toolPolicies.toolInventory=Tool-Inventar
toolPolicies.toolPolicies=Tool-Richtlinien
toolPolicies.tools=Tools
toolPolicies.trustChain=Vertrauenskette
toolPolicies.untrustedInfo=Tools, deren Ausgabe Inhalte Dritter enthalten kann (Websuche, Browsen). Ihre Ausgabe in einer Unterhaltung hält die sensiblen Tools zurück. Gleiche Mustersyntax wie bei Zulassen und Verweigern.
toolPolicies.untrustedSources=Nicht vertrauenswürdige Quellen
toolPolicies.userEmail=E-Mail des Benutzers

