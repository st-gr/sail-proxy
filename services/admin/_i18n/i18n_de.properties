teams.quotaProfileInfo=Vorgaben für leere Pool-Felder. Der Pool ist ein Budget, das sich das ganze Team teilt: pro Feld gilt der eigene Pool-Wert des Teams, sonst der Wert dieses Profils, sonst unbegrenzt.
teams.memberQuotaProfile=Mitgliedsprofil
teams.memberQuotaProfileInfo=Limit für jedes Mitglied. Wirkt für jedes Mitglied wie ein persönliches Kontingentprofil, nachrangig zu den eigenen Limits und dem eigenen Profil des Mitglieds: Es gilt für ein Feld, das diese leer lassen. Ein Mitglied in mehreren Teams erhält pro Feld den strengsten Wert.
teams.entitlementCatalogInfo=Die Modelle, die das Team nutzen darf. Der eigene Katalog eines Mitglieds wird damit geschnitten. Leer = der Standardkatalog.
teams.toolPolicyInfo=Ein Tool muss die Richtlinie des Teams, des Mitglieds und des Schlüssels erfüllen; der strengste Modus gilt. Leer = das Team fügt nichts hinzu.
teams.poolRequestsPerMinuteInfo=Anfragen pro Minute für das gesamte Team, gezählt über die Zugangsdaten aller Mitglieder. Leer = der Wert des Pool-Profils, sonst unbegrenzt.
teams.poolSpendInfo=SAP-Kosten plus Connections-Kosten, die alle Mitglieder gemeinsam pro Zeitfenster (UTC) verbrauchen, in der Währung des SAP-Kapazitätseinheitspreises. Leer = der Wert des Pool-Profils, sonst unbegrenzt.
teams.poolTokensInfo=Eingabe-, Ausgabe- und Cache-Schreib-Token, die alle Mitglieder gemeinsam pro Zeitfenster (UTC) verbrauchen. Leer = der Wert des Pool-Profils, sonst unbegrenzt.
teams.poolDefaultInfo=Was der Pool verwendet, solange das Feld oben leer ist: der Wert des Pool-Profils oder unbegrenzt.
teams.effectiveTeam=Team
teams.followsPrimaryTeam=Folgt primärem Team
teams.effectiveTeamInfo=Das Team, dessen Kontingent, Modellkatalog und Tool-Richtlinie für Anfragen mit diesem Zugang gelten.

