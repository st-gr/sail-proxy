# SAP Rates app
sapRates.capacityUnitPrice=Prezzo della Capacity Unit SAP
sapRates.capacityUnitPrices=Prezzi della Capacity Unit SAP
sapRates.currencyInfo=Codice valuta ISO per Prezzo per CU (ad es. USD). La ricerca del prezzo avviene solo per Tipo di utilizzo, quindi mantenere un’unica valuta per tipo di utilizzo e periodo.
sapRates.pricePerCu=Prezzo per CU
sapRates.pricePerCuInfo=Prezzo, nella valuta indicata, per Capacity Unit, dal listino prezzi SAP BTP (piano Extended). Costo = Capacity Unit x questo prezzo.
sapRates.priceValidity=Prezzo e validità
sapRates.regionInfo=Regione SAP a cui si applica il prezzo. Descrittivo; non fa parte della chiave di associazione dei prezzi.
sapRates.servicePlan=Piano di servizio
sapRates.servicePlanInfo=Piano di servizio SAP a cui si applica il prezzo (extended = il generative AI hub). Descrittivo.
sapRates.sku=SKU
sapRates.skuInfo=Materiale SAP / SKU della riga di prezzo. Descrittivo.
sapRates.usageType=Tipo di utilizzo
sapRates.usageTypeInfo=Classificazione del subaccount SAP che determina il prezzo: produttivo o non produttivo. SAP classifica ogni subaccount (una sandbox può essere classificata come produttiva). I prezzi vengono associati in base a questo valore nel periodo di validità.
sapRates.validFrom=Valido dal
sapRates.validFromInfo=Inizio del periodo di validità (incluso). Il costo usa il prezzo il cui periodo [Valido dal, Valido fino al] contiene l’ora dell’evento.
sapRates.validTo=Valido fino al
sapRates.validToInfo=Fine del periodo di validità (inclusa). Usare una data molto lontana nel futuro per il prezzo attualmente attivo. I periodi per lo stesso tipo di utilizzo non devono sovrapporsi.

# Tool Policies app
toolPolicies.allow=Consenti
