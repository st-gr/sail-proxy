toolPolicies.mode=Modalità
toolPolicies.modeInfo=monitor: solo registrare. strip: rimuovere gli strumenti non consentiti dalla policy. reject: rifiutare la richiesta.
toolPolicies.note=Nota
toolPolicies.owner=Proprietario
toolPolicies.pattern=Modello
toolPolicies.patternInfoAllow=function:<name>, hosted:<type>, mcp:<server> oppure mcp:<server>/<tool>; un * finale corrisponde a un prefisso. Una voce mcp:<server>/<tool> limita solo quel server: i suoi altri strumenti sono negati, tutti gli altri strumenti non sono interessati.
toolPolicies.patternInfoDeny=function:<name>, hosted:<type>, mcp:<server> oppure mcp:<server>/<tool>; un * finale corrisponde a un prefisso.
toolPolicies.period=Periodo
toolPolicies.periodInfo=I giorni il cui utilizzo registrato degli strumenti viene conteggiato. Per impostazione predefinita, gli ultimi 30 giorni, oggi incluso.
toolPolicies.recordedClientPrograms=Programmi client registrati
toolPolicies.recordedTools=Strumenti registrati
toolPolicies.requestedBy=Richiesto da
toolPolicies.requestedByInfo=I programmi client che hanno richiesto questo strumento nel periodo selezionato. Un filtro corrisponde a uno qualsiasi di essi.
toolPolicies.sensitiveInfo=Strumenti che eseguono azioni (shell, scrittura di file, invio di e-mail). Vengono trattenuti finché la conversazione contiene output di una fonte non attendibile. Stessa sintassi del modello di Consenti e Nega.
toolPolicies.sensitiveTools=Strumenti sensibili
toolPolicies.toolFilterInfo=Filtra per identità dello strumento; un nome parziale corrisponde (contiene).
toolPolicies.toolInventory=Inventario degli strumenti
toolPolicies.toolPolicies=Policy degli strumenti
toolPolicies.tools=Strumenti
toolPolicies.trustChain=Catena di fiducia
toolPolicies.untrustedInfo=Strumenti il cui output può contenere contenuti di terze parti (ricerca web, navigazione). Il loro output in una conversazione trattiene gli strumenti sensibili. Stessa sintassi del modello di Consenti e Nega.
toolPolicies.untrustedSources=Fonti non attendibili
toolPolicies.userEmail=E-mail dell’utente

