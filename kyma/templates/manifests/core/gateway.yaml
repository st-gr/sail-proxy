# Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sail-proxy
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sail-proxy
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        # Disable Istio injection for backend service
        sidecar.istio.io/inject: "false"
    spec:
      imagePullSecrets:
      - name: registry-secret
      initContainers:
      - name: wait-for-admin
        image: busybox:1.36
        command: 
        - sh
        - -c
        - |
          echo 'Waiting for Admin service to be ready...'
          ADMIN_URL="${ADMIN_SERVICE_URL:-http://admin:4004}"
          echo "Admin service URL: $ADMIN_URL"
          # Wait for Admin service
          attempt=0
          max_attempts=60
          while [ $attempt -lt $max_attempts ]; do
            if wget -q -O /dev/null "$ADMIN_URL/api/health" 2>/dev/null; then
              echo "Admin service is healthy!"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Waiting for admin service..."
            sleep 2
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: Admin service failed to become ready after $max_attempts attempts"
            exit 1
          fi
          
          # Wait for Valkey
          echo "Checking Valkey..."
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if nc -z valkey 6379 2>/dev/null; then
              echo "Valkey is ready at valkey:6379!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Waiting for Valkey..."
            sleep 2
          done
          echo "ERROR: Valkey failed to become ready after $max_attempts attempts"
          exit 1
        envFrom:
        - secretRef:
            name: gateway-env
      containers:
      - name: gateway
        image: __CONTAINER_REGISTRY__/__CONTAINER_ORGANIZATION__/sail-proxy-gateway:__CONTAINER_TAG__
        envFrom:
        - secretRef:
            name: gateway-env
        - configMapRef:
            name: gateway-config
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: DISABLE_FILE_LOGGING
          value: "true"
