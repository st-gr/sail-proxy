        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlobMigrateRequest"
      responses:
        "200":
          description: The started migration, or none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobMigrationStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"

components:
  securitySchemes:
    cockpitSession:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
      description: The cockpit session cookie oauth2-proxy sets at sign-in (its default name; neither the Docker nor the Kyma configuration renames it). Sign in to the cockpit in the same browser.
  parameters:
    StoreId:
      name: id
      in: path
      required: true
      description: The vector store id.
      schema:
        $ref: "#/components/schemas/Id"
      example: vs_example1
    FileIdInPath:
      name: id
      in: path
      required: true
      description: The file id.
      schema:
        $ref: "#/components/schemas/Id"
      example: file-example1
    StoreFileId:
      name: file_id
      in: path
      required: true
      description: The file id.
      schema:
        $ref: "#/components/schemas/Id"
      example: file-example1
    JobId:
      name: job_id
      in: path
      required: true
      description: The job id.
      schema:
        $ref: "#/components/schemas/Id"
      example: job_example1
    BatchId:
      name: batch_id
      in: path
      required: true
      description: The batch id.
      schema:
        $ref: "#/components/schemas/Id"
      example: vsfb_example1
    After:
      name: after
      in: query
      required: false
      description: The previous page's `last_id`.
      schema:
        type: string
    Before:
      name: before
      in: query
      required: false
      description: A page before this id.
      schema:
        type: string
    Order:
      name: order
      in: query
      required: false
      description: Newest first (`desc`, the default) or oldest first.
      schema:
        type: string
        enum:
          - asc
          - desc
    FilesLimit:
      name: limit
      in: query
      required: false
      description: Page size; out-of-range values are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 10000
    StoreLimit:
      name: limit
      in: query
      required: false
      description: Page size; out-of-range values are clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AdminLimit:
      name: limit
      in: query
      required: false
      description: Page size (400 `invalid_limit` outside 1 to 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Owner:
      name: owner
      in: query
      required: false
      description: Only this owner's (e-mail address).
      schema:
        type: string
      example: user@example.com
    JobStateFilter:
      name: state
      in: query
      required: false
      description: Only jobs in this state (400 `invalid_state` otherwise).
      schema:
        $ref: "#/components/schemas/JobState"
    StoreFileFilter:
      name: filter
      in: query
      required: false
      description: Only attachments with this status.
      schema:
        $ref: "#/components/schemas/StoreFileStatus"
    ChunkingType:
      name: type
      in: query
      required: false
      description: The target setting's type.
      schema:
        type: string
        enum:
          - static
          - structure
    ChunkingMaxTokens:
      name: max_tokens
      in: query
      required: false
      schema:
        type: integer
        minimum: 100
        maximum: 4096
    ChunkingOverlapTokens:
      name: overlap_tokens
      in: query
      required: false
      description: At most half of `max_tokens`.
      schema:
        type: integer
        minimum: 0
    ChunkingContextual:
      name: contextual
      in: query
      required: false
      description: A model-written context per chunk (only with `structure`).
      schema:
        type: string
        enum:
          - "true"
          - "false"
    ChunkingVision:
      name: vision
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/VisionMode"
  headers:
    Retry-After:
      description: Seconds until the quota window resets.
      schema:
        type: string
  responses:
    ConfigForbidden:
      description: The signed-in user does not have the admin role (`Forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigError"
    ConfigReadFailed:
      description: The configuration could not be read (`Internal server error` with a `message`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigError"
    ConfigFailed:
      description: The status could not be read (`Internal server error` with a `message`, or the store's own `error`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigError"
    Unauthorized:
      description: No signed-in user with an e-mail address (`authentication_required`). Behind nginx a request without a session is redirected to the sign-in page before it reaches the admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    BadRequest:
      description: Refused by the admin (`invalid_id`, `unsupported_identity`, `invalid_content_type`) or by the gateway (`invalid_request_error` with a code such as `invalid_limit`, `unsupported_parameter`, `invalid_team_id`, or the parameter of an invalid chunking setting).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnyError"
    Forbidden:
      description: The signed-in user is not allowed to (`grounding_admin_required`, `team_admin_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    NotFound:
      description: No such object of the signed-in user (`file_not_found`, `vector_store_not_found`, `not_found`); another user's object answers the same.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    Conflict:
      description: The object's state does not allow it; `code` says why (for example `file_in_use`, `job_running`, `reembed_running`, `store_current`, `concurrent_modification`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    QuotaExceeded:
      description: The payer's usage quota is used up (`quota_exceeded`); `resets_at` says when new work can start. Work already queued continues.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuotaError"
    GatewayUnreachable:
      description: The gateway could not be reached (`gateway_unreachable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    FileSearchUnavailable:
      description: File search is unavailable here (`file_search_unavailable`, with the reason in words), busy (`file_search_busy`), its content storage cannot be reached (`blob_storage_unavailable`), or a retry met files being processed (`retry_conflict`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
  schemas:
    Id:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
    AdminError:
      type: object
      description: An error answered by the admin.
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: For example `authentication_required`, `unsupported_identity`, `invalid_id`, `invalid_content_type`, `file_too_large`, `team_not_found`, `gateway_unreachable`, `invalid_request`, `price_lookup_failed`.
        message:
          type: string
    GatewayError:
      type: object
      description: An error answered by the gateway, in OpenAI's envelope. Some carry more fields beside `error` (a blob migration's `job_id` and `detail`).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - code
          properties:
            message:
              type: string
            type:
              type: string
              description: For example `invalid_request_error`, `permission_error`, `authentication_error`, `file_search_unavailable`, `server_error`.
            code:
              type: string
            param:
              type:
                - string
                - "null"
    AnyError:
      description: An error from the admin or from the gateway.
      anyOf:
        - $ref: "#/components/schemas/AdminError"
        - $ref: "#/components/schemas/GatewayError"
    QuotaError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - scope
            - dimension
            - window
            - resets_at
          properties:
            type:
              const: quota_exceeded
            code:
              const: quota_exceeded
            message:
              type: string
            scope:
              type: string
              description: Whose quota, for example `user` or `team`.
            team:
              type: string
              description: The team's name, for a team quota.
            dimension:
              type: string
              description: What is counted, for example tokens or cost.
            window:
              type: string
              description: The quota's period, for example `day` or `month`.
            limit:
              type: number
              description: Only when the payer is the caller.
            used:
              type: number
              description: Only when the payer is the caller.
            resets_at:
              type: string
              format: date-time

    ConfigError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
    ApiConfigDocument:
      type: object
      description: The gateway configuration. Its content is the gateway's `api_config` document (providers, models, rate limits, platform settings), validated on every change.
      required:
        - api_config
      properties:
        api_config:
          type: object
          additionalProperties: true
    ApiConfigRollbackRequest:
      type: object
      properties:
        reason:
          type: string
          description: Why; recorded with the rollback. Defaults to `Manual rollback via REST API`.
          example: The last change broke a model route.
    ApiConfigActivated:
      type: object
      required:
        - success
        - version
        - checksum
        - activatedAt
      properties:
        success:
          const: true
        version:
          type: string
        checksum:
          type: string
        activatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
    ApiConfigRolledBack:
      type: object
      required:
        - success
        - rolledBackFrom
        - rolledBackTo
        - rolledBackAt
      properties:
        success:
          const: true
        rolledBackFrom:
          type: string
          description: The version that was active.
        rolledBackTo:
          type: string
          description: The version that is active now.
        reason:
          type: string
        rolledBackAt:
          type: string
          format: date-time
    ConfigValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    ConfigStatus:
      type: object
      required:
        - timestamp
        - eventPublishing
        - activeConfig
      properties:
        timestamp:
          type: string
          format: date-time
        eventPublishing:
          type: boolean
          description: Whether configuration changes are published to the gateways (Valkey is reachable).
        activeConfig:
          type: object
          required:
            - hasActiveConfig
          properties:
            hasActiveConfig:
              type: boolean
            version:
              type: string
            deployedAt:
              type: string
              format: date-time
            checksum:
              type: string

    ListPage:
      type: object
      description: A page of a list. `first_id` and `last_id` are null on an empty page.
      required:
        - object
        - data
        - has_more
        - first_id
        - last_id
      properties:
        object:
          const: list
        data:
          type: array
        has_more:
          type: boolean
        first_id:
          type:
            - string
            - "null"
        last_id:
          type:
            - string
            - "null"
    VisionMode:
      type: string
      description: Which PDF pages a vision model transcribes (`off`, the default, transcribes none).
      enum:
        - "off"
        - no_text
        - auto
        - all
    ChunkingSetting:
      type: object
      description: A store's chunking setting. `max_tokens` 100 to 4096, `overlap_tokens` at most half of it; `contextual` (a model-written context per chunk) only with `structure`.
      required:
        - type
        - max_tokens
        - overlap_tokens
        - contextual
      properties:
        type:
          type: string
          enum:
            - static
            - structure
        max_tokens:
          type: integer
          minimum: 100
          maximum: 4096
        overlap_tokens:
          type: integer
          minimum: 0
        contextual:
          type: boolean
        vision:
          $ref: "#/components/schemas/VisionMode"
      example:
        type: structure
        max_tokens: 800
        overlap_tokens: 0
        contextual: true
    EmbeddingState:
      type: string
      description: A store's embedding against the configured model (`outdated`, another model; `dimension_mismatch`, another dimension, which cannot be re-embedded).
      enum:
        - current
        - outdated
        - dimension_mismatch
    GroundingStatus:
      type: object
      required:
        - available
        - reason
        - embeddingModel
        - embeddingDimensions
        - blobBackend
        - limits
        - chunking
        - vision
      properties:
        available:
          type: boolean
        reason:
          description: Why file search is unavailable, null when it is available.
          type:
            - string
            - "null"
          enum:
            - disabled
            - no_database
            - embedding_dimensions
            - schema_not_provisioned
            - schema_outdated
            - migration_failed
            - not_migrated
            - null
        embeddingModel:
          type: string
        embeddingDimensions:
          type: integer
        blobBackend:
          type: string
          enum:
            - db
            - local
            - s3
        limits:
          type: object
          required:
            - maxFileBytes
            - maxFilesPerStore
          properties:
            maxFileBytes:
              type: integer
            maxFilesPerStore:
              type: integer
        chunking:
          $ref: "#/components/schemas/ChunkingSetting"
        vision:
          type: object
          required:
            - available
            - model
            - unmaskedWarning
          properties:
            available:
              type: boolean
              description: Whether a store may use a vision mode here.
            model:
              type: string
            unmaskedWarning:
              type: boolean
              description: Page images would reach the vision model unmasked while pseudonymization applies to file search content.
    ModelCost:
      type: object
      required:
        - priced
        - capacity_units
        - cost
        - currency
      properties:
        priced:
          type: boolean
        capacity_units:
          type:
            - number
            - "null"
        cost:
          type:
            - number
            - "null"
        currency:
          type:
            - string
            - "null"
      example:
        priced: true
        capacity_units: 19.0385
        cost: 1.42
        currency: EUR
    OwnerStorage:
      type: object
      required:
        - owner_email
        - file_count
        - logical_bytes
      properties:
        owner_email:
          type: string
          example: user@example.com
        file_count:
          type: integer
        logical_bytes:
          type: integer
          description: The sum of the owner's file sizes, before content deduplication.
    OwnerStorageList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/OwnerStorage"

    FileUpload:
      type: object
      required:
        - file
        - purpose
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
        purpose:
          type: string
          enum:
            - assistants
            - user_data
        expires_after[anchor]:
          type: string
          enum:
            - created_at
        expires_after[seconds]:
          type: integer
          minimum: 3600
          maximum: 2592000
    File:
      type: object
      description: OpenAI's file object.
      required:
        - id
        - object
        - bytes
        - created_at
        - filename
        - purpose
      properties:
        id:
          type: string
          example: file-example1
        object:
          const: file
        bytes:
          type: integer
        created_at:
          type: integer
        expires_at:
          type: integer
        filename:
          type: string
          example: handbook.pdf
        purpose:
          type: string
        status:
          const: processed
        status_details:
          type: "null"
    FileList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/File"
    FileDeleted:
      type: object
      required:
        - id
        - object
        - deleted
      properties:
        id:
          type: string
        object:
          const: file
        deleted:
          const: true
    FileAttachments:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: By file id.
          additionalProperties:
            type: array
            items:
              type: object
              required:
                - store_id
                - store_name
                - status
              properties:
                store_id:
                  type: string
                store_name:
                  type:
                    - string
                    - "null"
                status:
                  $ref: "#/components/schemas/StoreFileStatus"
    AdminFileList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                required:
                  - id
                  - object
                  - bytes
                  - created_at
                  - filename
                  - purpose
                  - owner_email
                  - attachment_count
                properties:
                  id:
                    type: string
                  object:
                    const: file
                  bytes:
                    type: integer
                  created_at:
                    type: integer
                  filename:
                    type: string
                  purpose:
                    type: string
                  owner_email:
                    type: string
                  attachment_count:
                    type: integer
    FailedAttachmentList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                required:
                  - id
                  - store_id
                  - file_id
                  - owner_email
                  - last_error
                  - attempts
                  - created_at
                properties:
                  id:
                    type: string
                    description: "`<store_id>/<file_id>`, the paging cursor."
                  store_id:
                    type: string
                  store_name:
                    type:
                      - string
                      - "null"
                  file_id:
                    type: string
                  filename:
                    type: string
                  owner_email:
                    type: string
                  last_error:
                    type: object
                    properties:
                      message:
                        type:
                          - string
                          - "null"
                      name:
                        type:
                          - string
                          - "null"
                  attempts:
                    type: integer
                  batch_id:
                    type:
                      - string
                      - "null"
                  created_at:
                    type: integer

    ExpiresAfter:
      type: object
      required:
        - anchor
        - days
      properties:
        anchor:
          const: last_active_at
        days:
          type: integer
          minimum: 1
          maximum: 365
    FileCounts:
      type: object
      required:
        - in_progress
        - completed
        - failed
        - cancelled
        - total
      properties:
        in_progress:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer
    VectorStore:
      type: object
      description: OpenAI's vector store object. `status` follows the file counts (`in_progress` while a file is), except `expired`.
      required:
        - id
        - object
        - created_at
        - name
        - usage_bytes
        - file_counts
        - status
        - expires_after
        - expires_at
        - last_active_at
        - metadata
      properties:
        id:
          type: string
          example: vs_example1
        object:
          const: vector_store
        created_at:
          type: integer
        name:
          type:
            - string
            - "null"
          example: Handbooks
        usage_bytes:
          type: integer
        file_counts:
          $ref: "#/components/schemas/FileCounts"
        status:
          type: string
          enum:
            - in_progress
            - completed
            - expired
        expires_after:
          oneOf:
            - $ref: "#/components/schemas/ExpiresAfter"
            - type: "null"
        expires_at:
          type:
            - integer
            - "null"
        last_active_at:
          type:
            - integer
            - "null"
        metadata:
          type: object
          additionalProperties:
            type: string
    GroundingStore:
      description: A vector store with the Grounding fields.
      allOf:
        - $ref: "#/components/schemas/VectorStore"
        - type: object
          required:
            - is_shared
            - owned
            - owner_email
            - embedding_model
            - embedding_dim
            - active_generation
            - embedding_state
            - reembed_job_id
            - chunking
            - team_ids
          properties:
            is_shared:
              type: boolean
              description: Shared read-only with every user.
            owned:
              type: boolean
              description: The signed-in user owns it.
            owner_email:
              type: string
            embedding_model:
              type: string
            embedding_dim:
              type: integer
            active_generation:
              type: integer
            embedding_state:
              $ref: "#/components/schemas/EmbeddingState"
            reembed_job_id:
              description: The store's unfinished re-embed or re-chunk; null on another owner's store (except in the admin list).
              type:
                - string
                - "null"
            chunking:
              description: The store's chunking setting; null for a store from before the setting (static, 800 tokens, 400 overlap).
              oneOf:
                - $ref: "#/components/schemas/ChunkingSetting"
                - type: "null"
            team_ids:
              type: array
              description: The teams it is shared with; on another owner's store only the signed-in user's own teams (all of them for an admin).
              items:
                type: string
    GroundingStoreList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/GroundingStore"
    StoreDeleted:
      type: object
      required:
        - id
        - object
        - deleted
      properties:
        id:
          type: string
        object:
          const: vector_store.deleted
        deleted:
          const: true
    StoreCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: Handbooks
        file_ids:
          type: array
          maxItems: 500
          items:
            type: string
        expires_after:
          $ref: "#/components/schemas/ExpiresAfter"
        metadata:
          type: object
          additionalProperties:
            type: string
        chunking_strategy:
          $ref: "#/components/schemas/ChunkingStrategyRequest"
        chunking:
          $ref: "#/components/schemas/ChunkingSetting"
    StoreModifyRequest:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
        expires_after:
          oneOf:
            - $ref: "#/components/schemas/ExpiresAfter"
            - type: "null"
        metadata:
          type: object
          additionalProperties:
            type: string
    ChunkingStrategyRequest:
      type: object
      description: OpenAI's `chunking_strategy` for the attached files (`auto`, or `static` with its sizes); a store's own `chunking` setting applies when it is absent.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - auto
            - static
        static:
          type: object
          properties:
            max_chunk_size_tokens:
              type: integer
              minimum: 100
              maximum: 4096
            chunk_overlap_tokens:
              type: integer
              minimum: 0
    StoreFileStatus:
      type: string
      enum:
        - in_progress
        - completed
        - failed
        - cancelled
    VectorStoreFile:
      type: object
      description: OpenAI's vector store file object. In a list the cockpit gets `context_stopped` too.
      required:
        - id
        - object
        - usage_bytes
        - created_at
        - vector_store_id
        - status
        - last_error
        - chunking_strategy
        - attributes
      properties:
        id:
          type: string
          description: The file id.
        object:
          const: vector_store.file
        usage_bytes:
          type: integer
        created_at:
          type: integer
        vector_store_id:
          type: string
        status:
          $ref: "#/components/schemas/StoreFileStatus"
        last_error:
          type:
            - object
            - "null"
          properties:
            code:
              type: string
            message:
              type: string
        chunking_strategy:
          type: object
          description: The effective strategy, `static` with its sizes, or `other` for `structure`.
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - static
                - other
            static:
              type: object
              properties:
                max_chunk_size_tokens:
                  type: integer
                chunk_overlap_tokens:
                  type: integer
        attributes:
          type: object
        context_stopped:
          description: Why writing the file's chunk contexts stopped, null when it did not.
          type:
            - object
            - "null"
    VectorStoreFileList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/VectorStoreFile"
    VectorStoreFileDeleted:
      type: object
      required:
        - id
        - object
        - deleted
      properties:
        id:
          type: string
        object:
          const: vector_store.file.deleted
        deleted:
          const: true
    StoreFileCreateRequest:
      type: object
      required:
        - file_id
      properties:
        file_id:
          type: string
          example: file-example1
        attributes:
          type: object
        chunking_strategy:
          $ref: "#/components/schemas/ChunkingStrategyRequest"
    StoreFileUpdateRequest:
      type: object
      required:
        - attributes
      properties:
        attributes:
          type: object
          example:
            department: sales
    FileBatchCreateRequest:
      type: object
      description: "`file_ids`, or `files` with per-file attributes and strategy."
      properties:
        file_ids:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: object
            required:
              - file_id
            properties:
              file_id:
                type: string
              attributes:
                type: object
              chunking_strategy:
                $ref: "#/components/schemas/ChunkingStrategyRequest"
        attributes:
          type: object
        chunking_strategy:
          $ref: "#/components/schemas/ChunkingStrategyRequest"
      example:
        file_ids:
          - file-example1
          - file-example2
    FileBatch:
      type: object
      required:
        - id
        - object
        - created_at
        - vector_store_id
        - status
        - file_counts
      properties:
        id:
          type: string
        object:
          const: vector_store.file_batch
        created_at:
          type: integer
        vector_store_id:
          type: string
        status:
          type: string
          enum:
            - in_progress
            - completed
            - failed
            - cancelled
        file_counts:
          $ref: "#/components/schemas/FileCounts"
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          description: One query, or 1 to 10 queries searched together.
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              maxItems: 10
              items:
                type: string
                minLength: 1
          example: travel expense limits
        max_num_results:
          type: integer
          minimum: 1
          maximum: 50
        filters:
          type: object
          description: OpenAI's attribute filter (comparison or compound).
        ranking_options:
          type: object
          properties:
            ranker:
              type: string
              description: "`none` skips the rerank; the others rerank."
              enum:
                - none
                - auto
                - default-2024-11-15
                - default_2024_08_21
            score_threshold:
              type: number
            hybrid_search:
              type: object
              properties:
                embedding_weight:
                  type: number
                text_weight:
                  type: number
        rewrite_query:
          type: boolean
    SearchResults:
      type: object
      required:
        - object
        - search_query
        - data
        - has_more
        - next_page
      properties:
        object:
          const: vector_store.search_results.page
        search_query:
          type: array
          description: Every query searched, after an optional rewrite.
          items:
            type: string
        data:
          type: array
          items:
            type: object
            required:
              - file_id
              - filename
              - score
              - attributes
              - content
            properties:
              file_id:
                type: string
              filename:
                type: string
              score:
                type: number
              attributes:
                type: object
              content:
                type: array
                items:
                  type: object
                  required:
                    - type
                    - text
                  properties:
                    type:
                      const: text
                    text:
                      type: string
              pages:
                type: object
                description: The pages the content spans, for a file with pages.
                required:
                  - first
                  - last
                properties:
                  first:
                    type: integer
                  last:
                    type: integer
        has_more:
          type: boolean
        next_page:
          type:
            - string
            - "null"
    TeamShareRequest:
      type: object
      required:
        - teamId
      properties:
        teamId:
          type: string
          format: uuid
          example: 0b7e9c3a-4f2d-4e8a-9c1b-2d3e4f5a6b7c

    JobState:
      type: string
      enum:
        - queued
        - running
        - cancelling
        - cancelled
        - completed
        - completed_with_errors
        - failed
    Job:
      type: object
      description: A job with its counters, derived from its items on every read.
      required:
        - id
        - kind
        - store_id
        - store_name
        - batch_id
        - state
        - total
        - done
        - failed
        - cancelled
        - in_progress
        - embedding_tokens
        - target_chunking
        - reextract
        - error
        - created_at
        - started_at
        - finished_at
        - started_by
      properties:
        id:
          type: string
          example: job_example1
        kind:
          type: string
          description: "`file_batch`, `reembed_store` (also a re-chunk or re-extract), `reembed_bulk` or `blob_migration`."
          enum:
            - file_batch
            - reembed_store
            - reembed_bulk
            - blob_migration
        store_id:
          type:
            - string
            - "null"
        store_name:
          type:
            - string
            - "null"
        batch_id:
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/JobState"
        total:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        in_progress:
          type: integer
        embedding_tokens:
          type: integer
        target_chunking:
          description: A re-chunk's target setting, else null.
          oneOf:
            - $ref: "#/components/schemas/ChunkingSetting"
            - type: "null"
        reextract:
          type: boolean
          description: A re-extraction (`target_chunking` is the store's own setting).
        context_input_tokens:
          type: integer
        context_cached_tokens:
          type: integer
        context_output_tokens:
          type: integer
        context_failed_chunks:
          type: integer
        ocr_pages:
          type: integer
        ocr_skipped_pages:
          type: integer
        vision_pages:
          type: integer
        vision_skipped_pages:
          type: integer
        error:
          type:
            - object
            - "null"
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        started_by:
          type:
            - string
            - "null"
    AdminJob:
      description: A job with its owner (a blob migration also with its target storage).
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required:
            - owner_email
          properties:
            owner_email:
              type:
                - string
                - "null"
            target_storage:
              type:
                - string
                - "null"
    JobList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Job"
    AdminJobList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/AdminJob"
    JobRetried:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required:
            - retried
          properties:
            retried:
              type: integer
              description: The number of re-opened items.
    StoreFileRetried:
      type: object
      required:
        - job_id
        - job
        - retried
      properties:
        job_id:
          type:
            - string
            - "null"
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        retried:
          type: integer
    JobFailureList:
      allOf:
        - $ref: "#/components/schemas/ListPage"
        - type: object
          properties:
            data:
              type: array
              items:
                anyOf:
                  - type: object
                    description: A file a re-embed, re-chunk or re-extract job could not process; `id` is `<job_id>/<file_id>`.
                    required:
                      - id
                      - job_id
                      - store_id
                      - file_id
                      - filename
                      - last_error
                      - attempts
                    properties:
                      id:
                        type: string
                      job_id:
                        type: string
                      store_id:
                        type: string
                      store_name:
                        type:
                          - string
                          - "null"
                      file_id:
                        type: string
                      filename:
                        description: Null once the file was deleted.
                        type:
                          - string
                          - "null"
                      last_error:
                        type: object
                        properties:
                          message:
                            type:
                              - string
                              - "null"
                      attempts:
                        type: integer
                  - type: object
                    description: A blob a migration could not move; `id` is its SHA-256.
                    required:
                      - id
                      - sha256
                      - source_storage
                      - size_bytes
                      - last_error
                      - attempts
                    properties:
                      id:
                        type: string
                      sha256:
                        type: string
                      source_storage:
                        type: string
                      size_bytes:
                        type:
                          - integer
                          - "null"
                      last_error:
                        type: object
                        properties:
                          message:
                            type:
                              - string
                              - "null"
                      attempts:
                        type: integer
    ReembedEstimate:
      type: object
      required:
        - files
        - chunks
        - estimated_tokens
        - state
      properties:
        files:
          type: integer
          description: Completed files.
        chunks:
          type: integer
          description: Embedded chunks of the active generation.
        estimated_tokens:
          type: integer
        state:
          $ref: "#/components/schemas/EmbeddingState"
    SkippedStore:
      type: object
      required:
        - store_id
        - owner_email
        - reason
      properties:
        store_id:
          type: string
        owner_email:
          type: string
        reason:
          type: string
          description: Why a bulk re-embed leaves the store out (a store that changed between estimate and start is skipped with its start refusal).
    OutdatedEstimate:
      type: object
      required:
        - stores
        - files
        - chunks
        - estimated_tokens
        - skipped
      properties:
        stores:
          type: integer
        files:
          type: integer
        chunks:
          type: integer
        estimated_tokens:
          type: integer
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedStore"
    BulkReembedStarted:
      type: object
      required:
        - job
        - skipped
      properties:
        job:
          $ref: "#/components/schemas/Job"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedStore"
    ChunkingStartRequest:
      type: object
      required:
        - chunking
      properties:
        chunking:
          $ref: "#/components/schemas/ChunkingSetting"
    VisionEstimate:
      type: object
      description: The vision transcription figures (zero and null without a vision mode).
      required:
        - vision_model
        - vision_files
        - estimated_vision_pages
        - estimated_vision_input_tokens
        - estimated_vision_output_tokens
        - vision_switched_off
        - vision_unmasked_warning
      properties:
        vision_model:
          type:
            - string
            - "null"
        vision_files:
          type: integer
          description: PDFs that would be read with the vision mode.
        estimated_vision_pages:
          type: integer
          description: An upper bound, the page limit per file for each of those PDFs.
        estimated_vision_input_tokens:
          type: integer
        estimated_vision_output_tokens:
          type: integer
          description: An upper bound.
        vision_switched_off:
          type: boolean
          description: Vision is switched off on this gateway; a start with a vision mode is refused.
        vision_unmasked_warning:
          type: boolean
          description: Page images would reach the vision model unmasked while pseudonymization applies to file search content.
    RechunkEstimate:
      allOf:
        - $ref: "#/components/schemas/VisionEstimate"
        - type: object
          required:
            - store_id
            - current
            - target
            - unchanged
            - chunks_without_context
            - running_job_id
            - embedding_model
            - embedding_model_unavailable
            - files
            - current_chunks
            - estimated_chunks
            - estimated_embedding_tokens
            - context_model
            - estimated_context_input_tokens
            - estimated_context_output_tokens
          properties:
            store_id:
              type: string
            current:
              description: The store's setting now; null when the stored value is invalid.
              oneOf:
                - $ref: "#/components/schemas/ChunkingSetting"
                - type: "null"
            target:
              $ref: "#/components/schemas/ChunkingSetting"
            unchanged:
              type: boolean
              description: The target is the current setting; a start is refused unless chunks lack their context.
            chunks_without_context:
              type: integer
            running_job_id:
              description: The store's unfinished re-embed or re-chunk, which a start would be refused for.
              type:
                - string
                - "null"
            embedding_model:
              type: string
              description: The store's own model, which the re-chunk embeds with.
            embedding_model_unavailable:
              type: boolean
              description: That model was already found not served; a start would be refused.
            files:
              type: integer
            current_chunks:
              type: integer
            estimated_chunks:
              type: integer
            estimated_embedding_tokens:
              type: integer
            context_model:
              type:
                - string
                - "null"
            estimated_context_input_tokens:
              type: integer
            estimated_context_output_tokens:
              type: integer
              description: An upper bound.
    ReextractEstimate:
      allOf:
        - $ref: "#/components/schemas/VisionEstimate"
        - type: object
          required:
            - store_id
            - setting
            - running_job_id
            - embedding_model
            - embedding_model_unavailable
            - files
            - kept_files
            - ocr_available
            - files_without_text
            - current_chunks
            - estimated_chunks
            - estimated_embedding_tokens
            - context_model
            - estimated_context_input_tokens
            - estimated_context_output_tokens
            - retry_files
          properties:
            store_id:
              type: string
            setting:
              description: The store's setting the files are chunked with again; null when it is invalid (a start is refused).
              oneOf:
                - $ref: "#/components/schemas/ChunkingSetting"
                - type: "null"
            running_job_id:
              type:
                - string
                - "null"
            embedding_model:
              type: string
            embedding_model_unavailable:
              type: boolean
            files:
              type: integer
              description: Completed files read again.
            kept_files:
              type: integer
              description: Completed files kept as they are (no cost).
            ocr_available:
              type: boolean
            files_without_text:
              type: integer
              description: Of `files`, PDFs without text now that OCR or vision may read.
            current_chunks:
              type: integer
            estimated_chunks:
              type: integer
            estimated_embedding_tokens:
              type: integer
            context_model:
              type:
                - string
                - "null"
            estimated_context_input_tokens:
              type: integer
            estimated_context_output_tokens:
              type: integer
            retry_files:
              type: integer
              description: Failed files of a type this build now reads, which a start queues again.
    ReextractStarted:
      type: object
      required:
        - job
        - retried_files
        - refused_files
      properties:
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        retried_files:
          type: integer
        refused_files:
          type: array
          items:
            type: object
            required:
              - file_id
              - error
            properties:
              file_id:
                type: string
              error:
                type: string
                description: For example `job_running` or `nothing_to_retry`.

    AdminOverview:
      type: object
      required:
        - stores
        - files
        - logical_bytes
        - physical_bytes
        - savings_bytes
        - failed_ingestions
        - outdated_stores
      properties:
        stores:
          type: integer
        files:
          type: integer
        logical_bytes:
          type: integer
          description: The sum of every file's size.
        physical_bytes:
          type: integer
          description: The sum of the stored contents, one copy per distinct content.
        savings_bytes:
          type: integer
        failed_ingestions:
          type: integer
        outdated_stores:
          type: integer
    BlobStorageOverview:
      type: object
      required:
        - configured_backend
        - s3
        - storages
        - garbage
        - migration
      properties:
        configured_backend:
          type: string
        s3:
          type: object
          required:
            - configured
            - credentials_present
            - prefix
            - outside_prefix_blobs
          properties:
            configured:
              type: boolean
            credentials_present:
              type: boolean
            prefix:
              type: string
            outside_prefix_blobs:
              type: integer
              description: S3 blobs stored outside the configured prefix (unreadable until it is set back).
        storages:
          type: array
          items:
            type: object
            required:
              - storage
              - live_blobs
              - live_bytes
              - released_blobs
              - released_bytes
              - addressable
            properties:
              storage:
                type: string
              live_blobs:
                type: integer
              live_bytes:
                type: integer
              released_blobs:
                type: integer
                description: Blobs no file uses any more, waiting for deletion.
              released_bytes:
                type: integer
              addressable:
                type: boolean
        garbage:
          type: array
          items:
            type: object
            required:
              - storage
              - entries
              - due
              - failing
            properties:
              storage:
                type: string
              entries:
                type: integer
              due:
                type: integer
              failing:
                type: integer
        migration:
          description: The unfinished migration, else the most recent one; null when none was started.
          oneOf:
            - $ref: "#/components/schemas/AdminJob"
            - type: "null"
    BlobConnectionTest:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        error:
          type: object
          required:
            - reason
          properties:
            reason:
              type: string
            op:
              type: string
            status:
              type: integer
            code:
              type: string
    BlobMigrateRequest:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          enum:
            - db
            - s3
    BlobMigrationStarted:
      type: object
      required:
        - job
      properties:
        job:
          oneOf:
            - $ref: "#/components/schemas/AdminJob"
            - type: "null"
