openapi: 3.1.0
info:
  title: sail-proxy admin REST API
  version: 0.11.0
  summary: The admin service's REST routes for the gateway configuration and the cockpit's Grounding screens.
  description: |-
    The admin service's REST routes. The cockpit's other data (API keys, users, teams, usage, the Model Library and the configuration editor) is the admin's OData API, described in its own document.

    These paths are those of the Docker and Kyma admin behind nginx (`/admin/api`); a local development admin started with `cds serve` does not mount `/api`.

    **Sign-in:** every route takes the cockpit session. Behind nginx (Docker, Kyma) that is the oauth2-proxy session cookie: nginx asks oauth2-proxy about every `/admin/api/` request, redirects a request without a valid session to the sign-in page, and passes the signed-in user's identity on to the admin.

    **Configuration** (`/api-config`) is the gateway configuration as one JSON document: read the active one, replace it (the new version is validated and activated at once) or roll back to the previous one. `/api-config/status` says whether a configuration is active and whether configuration changes reach the gateways. All of them need the admin role. The cockpit edits the same configuration through the OData API.

    **Grounding** (`/grounding/...`) is the cockpit's door to the gateway's file search: files, vector stores, their jobs and their administration. The admin adds no file search logic of its own. For every route except `GET /grounding/model-cost` it:

    - refuses a caller without a signed-in e-mail address with 401 `authentication_required`, and an e-mail address that is not printable ASCII (it travels in a header) with 400 `unsupported_identity`;
    - refuses a path parameter that is not 1 to 64 letters, digits, `_` or `-` with 400 `invalid_id`, so an id cannot reach another gateway route;
    - calls the gateway (`/api/admin/grounding/...`) with its own service key, naming the signed-in user, the user's role (`admin` when the user has the cockpit's admin role, else `user`) and the user's teams as the admin's membership records list them (at most 200, the teams the user administers first; none when the records cannot be read). Identity, role or team headers the browser sends are ignored;
    - on the JSON routes (every route except the file upload and download), forwards the query's plain string values (a bracketed parameter such as `?x[a]=1` is dropped) and, on a POST, the JSON body (at most 1 MB); the upload and the download forward no query, and the upload streams its multipart body unchanged;
    - returns the gateway's status and body unchanged, errors included, and answers 502 `gateway_unreachable` when the gateway cannot be reached.

    Who may do what is decided by the gateway: a store or file of another user is a 404, the `/grounding/admin/...` routes answer 403 `grounding_admin_required` unless the signed-in user is an admin, and the routes that start paid work (embedding, context and vision calls, searches) check the payer's quota first (429 `quota_exceeded`). Errors from the admin itself are `{error, message}` with a string `error`; errors from the gateway use OpenAI's envelope `{error: {message, type, code}}`.

    Lists are paged with `limit` and `after` (the previous page's `last_id`) and answer `{object: "list", data, has_more, first_id, last_id}`. Times on file, store, batch and search objects are Unix seconds, as OpenAI's; times on jobs are ISO 8601 strings.
servers:
  - url: /admin/api
    description: Docker or Kyma, behind nginx
security:
  - cockpitSession: []
tags:
  - name: Configuration
    description: The gateway configuration and the configuration service's status.
  - name: Grounding status
  - name: Grounding files
  - name: Grounding vector stores
  - name: Grounding jobs
  - name: Grounding re-embedding, chunking and re-extraction
  - name: Grounding administration
    description: Everyone's stores, files, jobs and storage, and the blob storage. Every route answers 403 `grounding_admin_required` unless the signed-in user is an admin.
paths:
  /api-config:
    get:
      tags:
        - Configuration
      operationId: getApiConfig
      summary: Read the active configuration
      description: The active gateway configuration as one JSON document with the `api_config` wrapper, as the gateway reads it. The response headers name the configuration's version, checksum and activation time, so a caller can tell whether it changed; the checksum is also the `ETag`. Read as the signed-in user, who needs the admin role.
      x-sail-upstream: The admin's configuration store
      responses:
        "200":
          description: The active configuration.
          headers:
            X-Config-Version:
              description: The configuration's version.
              schema:
                type: string
            X-Config-Checksum:
              description: The configuration's checksum.
              schema:
                type: string
            X-Config-Deployed-At:
              description: When the configuration was activated (ISO 8601).
              schema:
                type: string
                format: date-time
            ETag:
              description: The checksum in quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiConfigDocument"
        "404":
          description: No configuration is active (`No active configuration found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigError"
        "403":
          $ref: "#/components/responses/ConfigForbidden"
        "500":
          $ref: "#/components/responses/ConfigReadFailed"
        "503":
          description: The admin's services are not up yet (`Service unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigError"
    put:
      tags:
        - Configuration
      operationId: replaceApiConfig
      summary: Replace the configuration
      description: Validates the document, stores it as a new configuration version and activates it; the gateways pick it up. A document that fails validation is refused and nothing changes. The body may be up to 10 MB. The signed-in user needs the admin role.
      x-sail-upstream: The admin's configuration store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiConfigDocument"
      responses:
        "200":
          description: The new configuration is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiConfigActivated"
        "400":
          description: The body has no `api_config`, or the configuration failed validation (`errors` lists why).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationError"
        "403":
          $ref: "#/components/responses/ConfigForbidden"
        "413":
          description: The body is larger than 10 MB.
        "500":
          description: The configuration could not be stored or activated (`Internal server error` with a `message`, or `Failed to activate configuration`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigError"
  /api-config/rollback:
    post:
      tags:
        - Configuration
      operationId: rollbackApiConfig
      summary: Roll back to the previous configuration
      description: Deactivates the active configuration and activates the one activated before it; the gateways pick it up. The body is optional. The signed-in user needs the admin role.
      x-sail-upstream: The admin's configuration store
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiConfigRollbackRequest"
      responses:
        "200":
          description: The previous configuration is active again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiConfigRolledBack"
        "400":
          description: Nothing to roll back (no active configuration, or no earlier one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigError"
        "403":
          $ref: "#/components/responses/ConfigForbidden"
        "413":
          description: The body is larger than 10 MB.
        "500":
          description: The rollback failed (`Internal server error` with a `message`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigError"
  /api-config/status:
    get:
      tags:
        - Configuration
      operationId: getConfigurationStatus
      summary: Configuration service status
      description: Whether a configuration is active (with its version, activation time and checksum) and whether configuration changes are published to the gateways (Valkey reachable). Read as the signed-in user, who needs the admin role.
      x-sail-upstream: The admin's configuration store
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigStatus"
        "403":
          $ref: "#/components/responses/ConfigForbidden"
        "500":
          $ref: "#/components/responses/ConfigFailed"

  /grounding/status:
    get:
      tags:
        - Grounding status
      operationId: getGroundingStatus
      summary: File search status
      description: Whether file search can be used here and, if not, why; the embedding model and dimensions, the blob storage, the upload and store limits, the chunking setting a new store gets, and whether a store may use vision transcription of PDF pages. Always 200 from the gateway, also when file search is unavailable.
      x-sail-upstream: The gateway's file search
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundingStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
  /grounding/model-cost:
    get:
      tags:
        - Grounding status
      operationId: getGroundingModelCost
      summary: Price an estimate's tokens
      description: |-
        What that many tokens of a model cost by the Model Library's current price, priced like a usage event (GenAI tokens × CU factor × the capacity unit price). Answered by the admin; the gateway is not called. The cockpit uses it to price the estimates of re-chunking and re-extraction.

        `priced: false` when the model has no price; `cost` and `currency` are null when no capacity unit price is maintained. Any signed-in user may call it.
      x-sail-upstream: The admin's Model Library prices
      parameters:
        - name: model
          in: query
          required: true
          description: "The model id, 1 to 100 of `A-Z a-z 0-9 . _ : -`."
          schema:
            type: string
            pattern: "^[A-Za-z0-9._:-]{1,100}$"
          example: gemini-example-flash-lite
        - name: input_tokens
          in: query
          required: false
          description: Whole input tokens (up to 13 digits); 0 when absent.
          schema:
            type: string
            pattern: "^\\d{1,13}$"
          example: "125000"
        - name: output_tokens
          in: query
          required: false
          description: Whole output tokens (up to 13 digits); 0 when absent.
          schema:
            type: string
            pattern: "^\\d{1,13}$"
          example: "4096"
      responses:
        "200":
          description: The price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCost"
        "400":
          description: No valid model id or a token count that is not a whole number (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: The price could not be read (`price_lookup_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
  /grounding/storage:
    get:
      tags:
        - Grounding status
      operationId: getGroundingStorage
      summary: The signed-in user's storage
      description: How many files the signed-in user owns and their logical size (the sum of the file sizes, before content deduplication).
      x-sail-upstream: The gateway's file search
      responses:
        "200":
          description: The user's storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerStorage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"

  /grounding/files:
    post:
      tags:
        - Grounding files
      operationId: uploadGroundingFile
      summary: Upload a file
      description: |-
        Uploads a file into the gateway's file store, owned by the signed-in user, as OpenAI's file upload does. The body is streamed to the gateway unchanged.

        The admin refuses a body that is not `multipart/form-data` (400 `invalid_content_type`) and, when the request declares its length, a body larger than the gateway's file limit plus 1 MiB for the multipart framing (413 `file_too_large`), because the gateway answers an oversized file by closing the connection. The gateway refuses a file larger than `capabilities.file_search.limits.max_file_bytes` and a `purpose` other than `assistants` or `user_data`.
      x-sail-upstream: The gateway's file search
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "200":
          description: The stored file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The file is larger than the limit (`file_too_large`), refused by the admin or the gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyError"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
    get:
      tags:
        - Grounding files
      operationId: listGroundingFiles
      summary: List the signed-in user's files
      description: The signed-in user's files, newest first unless `order=asc`, paged with `after` or `before` (OpenAI's file list; up to 10000 per page, all by default).
      x-sail-upstream: The gateway's file search
      parameters:
        - name: purpose
          in: query
          required: false
          description: Only files of this purpose.
          schema:
            type: string
            enum:
              - assistants
              - user_data
        - $ref: "#/components/parameters/FilesLimit"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Before"
      responses:
        "200":
          description: A page of files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
  /grounding/file-attachments:
    get:
      tags:
        - Grounding files
      operationId: listGroundingFileAttachments
      summary: The stores each file is attached to
      description: For each of the signed-in user's files named in `file_ids`, the user's own stores it is attached to, with the attachment's status. A file without attachments (or not the user's) maps to an empty list.
      x-sail-upstream: The gateway's file search
      parameters:
        - name: file_ids
          in: query
          required: false
          description: Up to 100 comma-separated file ids, each 1 to 64 of `A-Z a-z 0-9 _ -` (400 `invalid_file_ids` otherwise). None answers an empty map.
          schema:
            type: string
          example: file-example1,file-example2
      responses:
        "200":
          description: The attachments by file id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAttachments"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
  /grounding/files/{id}:
    parameters:
      - $ref: "#/components/parameters/FileIdInPath"
    get:
      tags:
        - Grounding files
      operationId: getGroundingFile
      summary: Read a file
      description: One of the signed-in user's files (OpenAI's file object).
      x-sail-upstream: The gateway's file search
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
    delete:
      tags:
        - Grounding files
      operationId: deleteGroundingFile
      summary: Delete a file
      description: Detaches one of the signed-in user's files from every store of the user and deletes it, in one transaction. 409 `file_in_use` when the file is attached to a store of another owner. `?detach=true`, which the cockpit sends, gives the same result.
      x-sail-upstream: The gateway's file search
      parameters:
        - name: detach
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
      responses:
        "200":
          description: The file is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
  /grounding/files/{id}/content:
    parameters:
      - $ref: "#/components/parameters/FileIdInPath"
    get:
      tags:
        - Grounding files
      operationId: downloadGroundingFile
      summary: Download a file's content
      description: The file's bytes, streamed from the gateway with its `Content-Type`, `Content-Length` and `Content-Disposition` (attachment, with the file name). A browser that stops reading stops the gateway's stream.
      x-sail-upstream: The gateway's file search
      responses:
        "200":
          description: The file content.
          headers:
            Content-Disposition:
              description: "`attachment` with the file name."
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"

  /grounding/stores:
    post:
      tags:
        - Grounding vector stores
      operationId: createGroundingStore
      summary: Create a vector store
      description: |-
        Creates a vector store owned by the signed-in user, as OpenAI's create does, and attaches `file_ids` (the user's own files, at most 500). `chunking` is the store's chunking setting; without it the store gets the installation's default (`GET /grounding/status` `chunking`). A vision mode is refused where vision transcription is switched off.

        With `file_ids` the user's quota is checked first (429).
      x-sail-upstream: The gateway's file search
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreateRequest"
      responses:
        "200":
          description: The created store (OpenAI's vector store object).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
    get:
      tags:
        - Grounding vector stores
      operationId: listGroundingStores
      summary: List the stores the user can see
      description: The signed-in user's stores and every store shared with everyone or with one of the user's teams, newest first, with the Grounding fields (sharing, embedding state, chunking). Paged forwards only; `order=asc` and `before` are refused with 400 `unsupported_parameter`.
      x-sail-upstream: The gateway's file search
      parameters:
        - $ref: "#/components/parameters/StoreLimit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: A page of stores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundingStoreList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
  /grounding/stores/{id}:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      tags:
        - Grounding vector stores
      operationId: getGroundingStore
      summary: Read a store
      description: A store the signed-in user owns or that is shared with them, with the Grounding fields. Another user's unshared store is a 404.
      x-sail-upstream: The gateway's file search
      responses:
        "200":
          description: The store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundingStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
    post:
      tags:
        - Grounding vector stores
      operationId: modifyGroundingStore
      summary: Rename or change a store
      description: Changes the name, expiry or metadata of one of the signed-in user's stores (OpenAI's modify). A shared store of another owner is a 404.
      x-sail-upstream: The gateway's file search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreModifyRequest"
      responses:
        "200":
          description: The changed store (OpenAI's vector store object).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
    delete:
      tags:
        - Grounding vector stores
      operationId: deleteGroundingStore
      summary: Delete a store
      description: Deletes one of the signed-in user's stores with its attachments and chunks. The files stay.
      x-sail-upstream: The gateway's file search
      responses:
        "200":
          description: The store is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDeleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
  /grounding/stores/{id}/files:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      tags:
        - Grounding vector stores
      operationId: attachGroundingStoreFile
      summary: Attach a file to a store
      description: Attaches one of the signed-in user's files to one of the user's stores; it is chunked and embedded in the background. The store owner's quota is checked first (429).
      x-sail-upstream: The gateway's file search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreFileCreateRequest"
      responses:
        "200":
          description: The attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorStoreFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
    get:
      tags:
        - Grounding vector stores
      operationId: listGroundingStoreFiles
      summary: List a store's files
      description: The files attached to one of the signed-in user's stores (OpenAI's list), each with `context_stopped`.
      x-sail-upstream: The gateway's file search
      parameters:
        - $ref: "#/components/parameters/StoreLimit"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/StoreFileFilter"
      responses:
        "200":
          description: A page of attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VectorStoreFileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/GatewayUnreachable"
        "503":
          $ref: "#/components/responses/FileSearchUnavailable"
