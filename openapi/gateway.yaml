      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The model, in Anthropic's format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not a Claude model the caller may use (`not_found_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
        default:
          description: "Any other error: what SAP AI Core or the deployment answered, passed on in the gateway's error format. SAP's error fields are filtered; the templated prompt is never returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
