        "503":
          description: Pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, because there is no hook for this route, the hook lacks the pseudonymization plugin, or its match does not fit the request (`pseudonymization_hook_missing`). Pseudonymization is enforced for the route or the model and the request could not be masked (`pseudonymization_failed`). Either way the request is not sent upstream.
