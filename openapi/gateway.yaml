openapi: 3.1.0
info:
  title: sail-proxy gateway
  version: 0.12.1
  summary: The client routes of the sail-proxy gateway.
  description: |-
    Every client-callable route of the sail-proxy gateway.

    The vendor-compatible routes (OpenAI, Anthropic, Google Gemini, AWS Bedrock, OpenRouter) take and return the vendor's bodies; each links the vendor's API reference in `externalDocs` and says in its description what sail-proxy changes: the credential, which models it serves, parameters it drops, refuses or rewrites, extra limits, the plugins that act on the request and its own error responses. sail-proxy's own routes (models, SAP-RPT, health, service information) carry full schemas.

    `x-sail-aliases` on a path item lists the other paths the same operations are served under, `x-sail-upstream` says what answers the request and `x-sail-credential` which credential it takes. Routes for operating the gateway are listed in internal-routes.json, not here. The realtime WebSocket is not an HTTP route and is not described here.

    Every API key route reads the key from `Authorization: Bearer sk-…`, `x-api-key`, `x-stainless-key`, `x-goog-api-key`, `?api_key=` or `?key=`.
servers:
  - url: /gateway
    description: Docker or Kyma, behind nginx
  - url: http://127.0.0.1:3000
    description: npm gateway
tags:
  - name: OpenAI
    description: The Files, Uploads and Vector Stores routes need the file search database; without it they answer `503 file_search_unavailable`.
  - name: Anthropic
  - name: Google Gemini
    description: "`{modelAndMethod}` is `<model>:generateContent`, `<model>:streamGenerateContent` or `<model>:embedContent`. Any other path or method under `/google` (for example `:countTokens`) answers `404` in the Gemini error format."
  - name: AWS Bedrock
    description: |-
      `{subpath}` is `invoke`, `invoke-with-response-stream`, `converse` or `converse-stream`; any other answers `400` with the list of valid ones.

      A model without a deployment is served through orchestration on all four subpaths, with one exception: `invoke` and `invoke-with-response-stream` take the model's native request body, which the gateway translates only for Claude models. For other models, such as Amazon Nova, use `converse` or `converse-stream`; `invoke` answers `400`.

      The two streamed subpaths answer in AWS's binary event stream (`application/vnd.amazon.eventstream`), as Bedrock does: `invoke-with-response-stream` sends each model event as a `chunk` with base64 `bytes`, and `converse-stream` sends Converse events. An error after the stream has started arrives as an exception message.
  - name: OpenRouter
  - name: SAP-RPT
  - name: Models and health
paths:
  /openai/v1/chat/completions:
    x-sail-aliases:
      - /openai/api/v1/chat/completions
    post:
      tags:
        - OpenAI
      operationId: openaiCreateChatCompletion
      summary: Create a chat completion
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        **Models:** every model `/v1/models` lists. A model id ending in `--deployed` is sent to its SAP AI Core deployment (OpenAI and Perplexity deployments; a deployment of another provider is not served on this route and the request is refused with `400` and code `model_not_supported` before the deployment is called; Anthropic deployments are served by `/anthropic/v1/messages`); every other model is served by SAP orchestration. Renames in `providers.openai.substitute_models` and `providers.perplexity.substitute_models` apply first. A model id of the form `<model>--<connection>` is served by that Connection (an administrator-defined provider such as Azure OpenAI or OpenAI), never by SAP AI Core; it is refused with 503 `connection_unavailable` when the Connection is inactive or has no usable credential, 409 `model_unpriced` when it has no list price, and 400 `model_route_mismatch` on a route that does not serve its family. Pseudonymization and its enforcement apply to Connection models as they do to SAP models.

        **What changes in the request:**

        - `model` and a non-empty `messages` are required (400 `invalid_request_error`); an embedding-only model is refused with 400 `model_not_supported`.
        - Through orchestration only `messages`, `max_tokens`, `temperature`, `top_p`, `top_k`, `stop`, `frequency_penalty`, `presence_penalty`, `tools`, `tool_choice`, `response_format`, `stream` and `stream_options.include_usage` are carried over; other fields are not forwarded.
        - For gpt-5 and o-series models `temperature`, `frequency_penalty` and `presence_penalty` are dropped and `max_tokens` is sent as `max_completion_tokens`.
        - Parameters configured as unsupported for the provider or model (`unsupported_params`) are dropped; the shipped configuration drops `tools`, `tool_choice` and `response_format` for Perplexity.
        - Image URLs sent to an Anthropic model are downloaded and sent inline.
        - A deployment is called without streaming: `stream: true` is answered as an emulated stream where streaming emulation is configured for the model, otherwise as one JSON response. The deployment receives its upstream model name instead of the `--deployed` id.

        **Pseudonymization:** in the shipped configuration (`hooks.defaults.openai`) personal data in the prompt is replaced by placeholders before the request leaves the gateway, and the placeholders in the answer are restored. The header `x-sail-proxy-pseudonymization: off` or the body field `pseudonymization_off: true` skip it only where the configuration allows a user bypass (the shipped configuration does not). The plugins run for `--deployed` models too: the deployment receives the masked prompt, with the note on placeholders in a system message, and the answer (or the emulated stream) is restored before it is returned. When pseudonymization is enforced for the route or the model but the active configuration would not run it for this request (no hook for this route, a hook without the pseudonymization plugin, or one whose match does not fit the request), the request is refused with 503 `pseudonymization_hook_missing` before anything is sent upstream. Where it is enforced, a request's own `masking` settings can add categories and patterns but never remove or exempt any. When pseudonymization is enforced for the route or the model and the request cannot be masked, it is refused with 503 `pseudonymization_failed` and not sent.

        **Tool governance:** the caller's tool policies are applied to the tools the request declares: monitored, stripped (the model is told which tools were removed) or refused with 403 `tool_not_entitled` in OpenAI's error format.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled`.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://platform.openai.com/docs/api-reference/chat/create
      x-sail-upstream: Orchestration; a --deployed OpenAI or Perplexity model goes to its deployment
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: "A chat completion, or with `stream: true` a server-sent event stream of chunks, as OpenAI defines them."
        "400":
          description: A missing `model` or `messages`, or a model that serves embeddings only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The model is not in the caller's entitlement catalog (`model_not_entitled`), or a tool policy refused a declared tool (`tool_not_entitled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "503":
          description: Pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, because there is no hook for this route, the hook lacks the pseudonymization plugin, or its match does not fit the request (`pseudonymization_hook_missing`). Pseudonymization is enforced for the route or the model and the request could not be masked (`pseudonymization_failed`). Either way the request is not sent upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        default:
          description: "Any other error: what SAP AI Core or the deployment answered, passed on in the gateway's error format. SAP's error fields are filtered; the templated prompt is never returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /openai/v1/embeddings:
    x-sail-aliases:
      - /openai/api/v1/embeddings
    post:
      tags:
        - OpenAI
      operationId: openaiCreateEmbedding
      summary: Create embeddings
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        **Models:** models with the embedding capability, served by SAP orchestration's embedding module; a `--deployed` id is sent under its base name. A model id of the form `<model>--<connection>` is served by that Connection (an administrator-defined provider such as Azure OpenAI or OpenAI), never by SAP AI Core; it is refused with 503 `connection_unavailable` when the Connection is inactive or has no usable credential, 409 `model_unpriced` when it has no list price, and 400 `model_route_mismatch` on a route that does not serve its family. The input checks and limits below are SAP AI Core's and apply to SAP models only; a Connection model's input goes to the provider as sent.

        **What changes in the request:**

        - `model` and `input` are required (400 `missing_required_fields`); a model without the embedding capability, and a model the catalogue does not list, are refused with 400 `model_not_supported`. 404 `model_not_found` comes only when the model list cannot be fetched from SAP AI Core.
        - `input` is a string or a non-empty array of strings; every element is embedded and `data[i].index` is its position in the array, `usage` counts the whole request. Token arrays (`number[]`, `number[][]`), an empty array and an array of more than 256 elements are refused with 400 `invalid_input`. SAP AI Core limits a request to 300000 tokens: when it rejects the request (any 4xx), the same status is returned with SAP's message (code `embedding_request_rejected`) and retrying cannot help; other upstream failures answer 500 `embedding_generation_failed`.
        - `encoding_format`, `dimensions` and `user` are not forwarded.
        - No plugin and no tool governance run on this route: the input is embedded as sent and never pseudonymized, also where pseudonymization is enforced for chat.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled`.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://platform.openai.com/docs/api-reference/embeddings/create
      x-sail-upstream: Orchestration embeddings
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: "An embeddings list (`object: list`, one `embedding` per returned item, `usage.prompt_tokens` and `total_tokens`), as OpenAI defines it."
        "400":
          description: A missing `model` or `input`, an `input` that is not a non-empty array of at most 256 strings (`invalid_input`), a model that is unknown or has no embedding capability (`model_not_supported`), or a request SAP AI Core rejects, such as one over its 300000-token limit (`embedding_request_rejected`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The model is not in the caller's entitlement catalog (`model_not_entitled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "404":
          description: The model list could not be fetched from SAP AI Core, so the model could not be looked up (`model_not_found`). An unknown model is answered 400 `model_not_supported`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          description: SAP AI Core did not produce the embedding (`embedding_generation_failed`), or another failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /openai/v1/responses:
    x-sail-aliases:
      - /openai/api/v1/responses
    post:
      tags:
        - OpenAI
      operationId: openaiCreateResponse
      summary: Create a model response
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        **Models:** a deployment that serves the Responses API natively (a deployed GPT-5 or later or o-series model, or one flagged with `supports_responses_api`) receives the request almost unchanged; a bare model name whose `--deployed` twin can serve it natively is moved to the twin. Every other model in the catalogue is served through SAP orchestration, with the Responses request translated to orchestration and the answer back. A deployed model that cannot serve the Responses API, and a model not in the catalogue, are refused with 400 `model_not_supported`. A model id of the form `<model>--<connection>` is served by that Connection (an administrator-defined provider such as Azure OpenAI or OpenAI), never by SAP AI Core; it is refused with 503 `connection_unavailable` when the Connection is inactive or has no usable credential, 409 `model_unpriced` when it has no list price, and 400 `model_route_mismatch` on a route that does not serve its family. Pseudonymization and its enforcement apply to Connection models as they do to SAP models.

        **What changes in the request:**

        - `model` is required (400).
        - Natively served: the deployment receives its upstream model name; configured unsupported parameters are dropped and configured parameter renames applied.
        - Through orchestration: an input item type the translation does not know is refused with 400 `unsupported_input_item`.

        **Plugins (shipped configuration, `hooks.defaults.openai.responses` and `responses-stream`):**

        - pseudonymization (as on chat completions; when it is enforced but the active configuration would not run it for this request the request is refused with 503 `pseudonymization_hook_missing`, and a request that cannot be masked with 503 `pseudonymization_failed`);
        - the `web_search` tool is run by the gateway with Perplexity sonar-pro on SAP AI Core, at most `capabilities.web_search.max_searches_per_request` searches per request (1 to 10, default 3);
        - the `file_search` tool searches the caller's vector stores in the gateway (at most `capabilities.file_search.tool.max_searches_per_request` searches, 1 to 10, default 3);
        - remote `input_image` URLs are normalised for the orchestration path, namespaced tools are flattened and custom tools translated (`capabilities.namespace_tools`, `capabilities.custom_tools`).

        **Tool governance:** the caller's tool policies are applied to the tools the request declares: monitored, stripped (the model is told which tools were removed) or refused with 403 `tool_not_entitled` in OpenAI's error format.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled`.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://platform.openai.com/docs/api-reference/responses/create
      x-sail-upstream: Deployment for a deployed GPT-5 or later or o-series model; orchestration for other models
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: "A response object, or with `stream: true` a server-sent event stream of Responses events, as OpenAI defines them."
        "400":
          description: A missing `model`, a model that cannot serve the Responses API (`model_not_supported`), or an unsupported input item (`unsupported_input_item`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The model is not in the caller's entitlement catalog (`model_not_entitled`), or a tool policy refused a declared tool (`tool_not_entitled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "503":
          description: Pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, because there is no hook for this route, the hook lacks the pseudonymization plugin, or its match does not fit the request (`pseudonymization_hook_missing`). Pseudonymization is enforced for the route or the model and the request could not be masked (`pseudonymization_failed`). Either way the request is not sent upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        default:
          description: "Any other error: what SAP AI Core or the deployment answered, passed on in the gateway's error format. SAP's error fields are filtered; the templated prompt is never returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /openai/v1/images/generations:
    x-sail-aliases:
      - /openai/api/v1/images/generations
    post:
      tags:
        - OpenAI
      operationId: openaiCreateImage
      summary: Generate an image
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        **What changes in the request (JSON body):**

        - `model` must be a Google image model with a deployment on SAP AI Core (the bare name or its `--deployed` id); any other model is answered 404 `model_not_found`.
        - Each image is one Gemini `generateContent` call to that deployment; `n` is 1 to 4.
        - `size` is `1024x1024`, `1536x1024`, `1024x1536` or `auto`; `quality` `high` asks for 2K and `max` for 4K, `standard`, `low`, `medium`, `xhigh` and `auto` are accepted and ignored.
        - `response_format` must be `b64_json` (the gateway stores no images) and `output_format` `png`. `stream`, `partial_images`, `background` and `moderation` other than their defaults, and `style`, `input_fidelity` and `output_compression` are refused with 400 `unsupported_parameter`.
        - The answer carries `b64_json` images, `output_format: png`, `size` and token `usage` summed over the calls.

        No pseudonymization or tool governance run on this route.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled`. Both the requested id and the deployment it resolves to must be entitled.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://platform.openai.com/docs/api-reference/images/create
      x-sail-upstream: Deployed Gemini image model (JSON body)
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: An images response with `b64_json` images, as OpenAI defines it.
        "400":
          description: A missing `model` or `prompt`, or a parameter the gateway does not support (`missing_parameter`, `invalid_value`, `unsupported_parameter`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The model is not in the caller's entitlement catalog (`model_not_entitled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "404":
          description: The model is not a Google image model with a deployment (`model_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          description: An internal failure of the gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "502":
          description: SAP AI Core refused or could not be reached (`upstream_error`), or the model returned no image (`no_image`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "503":
          description: SAP AI Core answered 503 (`upstream_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /openai/v1/images/edits:
    x-sail-aliases:
      - /openai/api/v1/images/edits
    post:
      tags:
        - OpenAI
      operationId: openaiCreateImageEdit
      summary: Edit an image
      description: |-
        **Credential:** a sail-proxy API key. An AWS SigV4 signature does not work here: the gateway verifies a signature against the JSON body it captured, and a multipart body is not captured.

        **What changes in the request (multipart body):**

        - The body must be `multipart/form-data` (400 `invalid_content_type`, `invalid_multipart_body`).
        - At most 4 `image` parts, each PNG, JPEG or WebP of at most 20 MiB (400 `file_too_large`); a `mask` is refused (Gemini edits by instruction).
        - Text fields such as `prompt` are limited to 32 KB each (400 `field_too_large`).
        - `model` must be a Google image model with a deployment on SAP AI Core (the bare name or its `--deployed` id); any other model is answered 404 `model_not_found`.
        - Each image is one Gemini `generateContent` call to that deployment; `n` is 1 to 4.
        - `size` is `1024x1024`, `1536x1024`, `1024x1536` or `auto`; `quality` `high` asks for 2K and `max` for 4K, `standard`, `low`, `medium`, `xhigh` and `auto` are accepted and ignored.
        - `response_format` must be `b64_json` (the gateway stores no images) and `output_format` `png`. `stream`, `partial_images`, `background` and `moderation` other than their defaults, and `style`, `input_fidelity` and `output_compression` are refused with 400 `unsupported_parameter`.
        - The answer carries `b64_json` images, `output_format: png`, `size` and token `usage` summed over the calls.

        No pseudonymization or tool governance run on this route.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled`. Both the requested id and the deployment it resolves to must be entitled.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://platform.openai.com/docs/api-reference/images/createEdit
      x-sail-upstream: Deployed Gemini image model (multipart body)
      x-sail-credential: Gateway API key (a multipart body cannot be SigV4-signed)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
      responses:
        "200":
          description: An images response with `b64_json` images, as OpenAI defines it.
        "400":
          description: Not multipart, a malformed body, an image or field over its limit, a mask, or a parameter the gateway does not support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The model is not in the caller's entitlement catalog (`model_not_entitled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "404":
          description: The model is not a Google image model with a deployment (`model_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "500":
          description: An internal failure of the gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "502":
          description: SAP AI Core refused or could not be reached (`upstream_error`), or the model returned no image (`no_image`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "503":
          description: SAP AI Core answered 503 (`upstream_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /openai/v1/files:
    x-sail-aliases:
      - /openai/api/v1/files
      - /openrouter/api/v1/files
    post:
      tags:
        - OpenAI
      operationId: openaiUploadFile
      summary: Upload a file
      description: |-
        The file lands in the gateway's own file store for the `file_search` tool; nothing is sent to OpenAI.

        **What changes in the request:**

        - `purpose` must be `assistants` or `user_data` (400 `invalid_purpose`); other purposes are not stored.
        - `expires_after[anchor]` must be `created_at` and `expires_after[seconds]` 3600 to 2592000 (400 `invalid_expires_after`).
        - The filename is at most 255 characters (400 `invalid_filename`).
        - The file is at most `capabilities.file_search.limits.max_file_bytes` (32 MiB in the shipped configuration); a larger one is refused with 413 `file_too_large` while it streams in.

        **Credential:** a sail-proxy API key that belongs to a user. Files, uploads and vector stores belong to the key's e-mail, and another owner's object is answered 404 like one that does not exist. A request without an owner (an AWS SigV4 signature carries none) is answered 401 `authentication_required`. On a standalone gateway every key shares one owner.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

