      summary: List models
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        The Claude models (provider `anthropic`, or an id containing `claude`) of the gateway's model list that the caller is entitled to, in Anthropic's list format: one page (`has_more: false`), `display_name` equal to the id, `created_at` from the model's creation time. Query parameters are ignored.

        No quota runs on this route.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://docs.anthropic.com/en/api/models-list
      x-sail-upstream: The Claude models the key may use, in Anthropic's list format
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The models, in Anthropic's list format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: "Any other error: what SAP AI Core or the deployment answered, passed on in the gateway's error format. SAP's error fields are filtered; the templated prompt is never returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /anthropic/v1/models/{model_id}:
