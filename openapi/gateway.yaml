        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://openrouter.ai/docs/api-reference/get-credits
      x-sail-upstream: "None: the gateway answers a status not_implemented placeholder"
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The placeholder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenRouterCreditsPlaceholder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
  /sap/v1/rpt/{model}/predict:
    parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - SAP-RPT
      operationId: sapRptPredict
      summary: Predict from JSON rows
      description: |-
        Tabular prediction from JSON rows. No vendor reference: the body is SAP-RPT's, which the gateway forwards as it is.

        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        **Models:** `{model}` is a SAP-RPT model with a deployment on SAP AI Core, by its bare name or `--deployed` id; renames in `providers.sap-rpt.substitute_models` apply first.

        **What the gateway does:** it resolves the deployment, adds the SAP AI Core credentials, forwards the body unchanged and relays SAP's answer unchanged: status, body and the `content-type`, `ai-inference-id`, `x-request-id` and `x-upstream-service-time` headers, including SAP's own validation errors (400, 422). It validates nothing itself. No plugin, masking or tool governance runs and nothing streams. Usage is counted in cells from the response's `metadata` (`num_rows` x `num_columns` in, `num_predictions` out); a refused call counts nothing.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled` in the SAP shape.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 in the SAP shape (the quota details in `detail[0].quota`) with `Retry-After` and `X-RateLimit-*` headers.

        **Errors:** the gateway's own refusals use SAP's error shape (`detail[]` and `status`), so a client parses one shape whichever side refused.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413 (in the gateway's error format).
      x-sail-upstream: Deployed SAP-RPT model, JSON rows
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RptPredictionRequest"
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The predictions, relayed from SAP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptPredictionResponse"
        "401":
          description: No key or an invalid key (`gateway_auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "403":
          description: The model is not in the caller's entitlement catalog (`model_not_entitled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "404":
          description: No deployment of that model (`model_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "429":
          description: A rate limit or quota is exhausted (`quota_exceeded`).
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "502":
          description: The deployment could not be reached (`upstream_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        default:
          description: "Any other status: SAP's own answer, relayed unchanged (for example its 400 and 422 validation errors)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
  /sap/v1/rpt/{model}/predict-parquet:
    parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - SAP-RPT
      operationId: sapRptPredictParquet
      summary: Predict from a Parquet file
      description: |-
        Tabular prediction from a Parquet file: the multipart request is streamed to the deployment unchanged, so the gateway cannot read it; usage is still counted from the response.

        **Credential:** a sail-proxy API key. An AWS SigV4 signature does not work here: the gateway verifies a signature against the JSON body it captured, and a multipart body is not captured.

        **Models:** `{model}` is a SAP-RPT model with a deployment on SAP AI Core, by its bare name or `--deployed` id; renames in `providers.sap-rpt.substitute_models` apply first.

        **What the gateway does:** it resolves the deployment, adds the SAP AI Core credentials, forwards the body unchanged and relays SAP's answer unchanged: status, body and the `content-type`, `ai-inference-id`, `x-request-id` and `x-upstream-service-time` headers, including SAP's own validation errors (400, 422). It validates nothing itself. No plugin, masking or tool governance runs and nothing streams. Usage is counted in cells from the response's `metadata` (`num_rows` x `num_columns` in, `num_predictions` out); a refused call counts nothing.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled` in the SAP shape.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 in the SAP shape (the quota details in `detail[0].quota`) with `Retry-After` and `X-RateLimit-*` headers.

        **Errors:** the gateway's own refusals use SAP's error shape (`detail[]` and `status`), so a client parses one shape whichever side refused.
      x-sail-upstream: Deployed SAP-RPT model, Parquet file
      x-sail-credential: Gateway API key (a multipart body cannot be SigV4-signed)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: SAP-RPT's multipart form (a Parquet file and its prediction settings), forwarded unchanged.
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
      responses:
        "200":
          description: The predictions, relayed from SAP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptPredictionResponse"
        "401":
          description: No key or an invalid key (`gateway_auth`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "403":
          description: The model is not in the caller's entitlement catalog (`model_not_entitled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "404":
          description: No deployment of that model (`model_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "429":
          description: A rate limit or quota is exhausted (`quota_exceeded`).
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        "502":
          description: The deployment could not be reached (`upstream_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
        default:
          description: "Any other status: SAP's own answer, relayed unchanged (for example its 400 and 422 validation errors)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RptError"
  /v1/models:
    x-sail-aliases:
      - /openai/v1/models
    get:
      tags:
        - Models and health
      operationId: listModels
      summary: List models
      description: |-
        The models a request can be routed to, in OpenAI's list format: the SAP AI Core foundation models with the orchestration scenario that are not deprecated, and each running deployment as `<model>--deployed`, after the overrides in `models.overrides`, and each model an administrator published on a Connection as `<model>--<connection>` (served by that Connection's provider, not by SAP AI Core). Filtered by the caller's entitlement catalog.

        - The list is cached for `SAP_MODEL_CACHE_DURATION_SECONDS` (300 by default); `?refresh=true` bypasses the cache.
        - `?include=unroutable` adds the foundation models the gateway cannot route, marked `routable: false`.
        - With `SAP_INCLUDE_EXTENDED_MODEL_ATTRIBUTES=true` each model carries SAP AI Core's attributes as well (`accessType`, `routable`, `streamingSupported`, versions, deployment details).

        **Credential:** a sail-proxy API key or an AWS SigV4 signature. No quota runs on this route.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://platform.openai.com/docs/api-reference/models/list
      x-sail-upstream: Model list from SAP AI Core
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      parameters:
        - name: refresh
          in: query
          required: false
          description: "`true` fetches the list from SAP AI Core instead of the cache."
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: include
          in: query
          required: false
          description: "`unroutable` adds the models the gateway cannot route."
          schema:
            type: string
            enum:
              - unroutable
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: SAP AI Core could not be asked for the list; its status, in the gateway's error format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /v1/models/{model_id}:
    x-sail-aliases:
      - /openai/v1/models/{model_id}
    parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Models and health
      operationId: retrieveModel
      summary: Retrieve a model
      description: |-
        One model of `GET /v1/models`, including the Connection models (`<model>--<connection>`). An id with a date or version suffix (`-20250101`, `-2025-01-01`, `-v2`) that is not listed falls back to its base name.

        An id the list does not contain, or a model the caller is not entitled to, is answered 404 `model_not_found_error`.

        `?refresh=true` bypasses the model cache.

        **Credential:** a sail-proxy API key or an AWS SigV4 signature. No quota runs on this route.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://platform.openai.com/docs/api-reference/models/retrieve
      x-sail-upstream: One model of the model list from SAP AI Core
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      parameters:
        - name: refresh
          in: query
          required: false
          description: "`true` fetches the list from SAP AI Core instead of the cache."
          schema:
            type: string
            enum:
              - "true"
              - "false"
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No model has that id, or the caller is not entitled to it (`model_not_found_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        default:
          description: SAP AI Core could not be asked for the list; its status, in the gateway's error format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
  /v1/models/cache/clear:
    x-sail-aliases:
      - /openai/v1/models/cache/clear
    post:
      tags:
        - Models and health
      operationId: clearModelsCache
      summary: Clear the gateway's model cache
      description: |-
        Empties the gateway's in-memory model list cache, so the next request fetches the list from SAP AI Core. Any valid key may call it.

        **Credential:** a sail-proxy API key or an AWS SigV4 signature.
      x-sail-upstream: The gateway's in-memory model cache, no upstream call
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The cache is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheCleared"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      tags:
        - Models and health
      operationId: getHealth
      summary: Health check
      description: The unauthenticated liveness probe of the gateway.
      x-sail-upstream: The gateway
      x-sail-credential: None
      parameters:
        - name: response_wait
          in: query
          required: false
          description: "Only when the gateway runs with `DEBUG=true`: waits this many seconds (1 to 660) before answering, to exercise client timeouts. Ignored otherwise."
          schema:
            type: integer
            minimum: 1
            maximum: 660
      security: []
      responses:
        "200":
          description: The gateway is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /:
    get:
      tags:
        - Models and health
      operationId: getServiceInfo
      summary: Service information
      description: "Static service information: the gateway's name, deploy target and the route prefixes it serves."
      x-sail-upstream: The gateway
      x-sail-credential: None
      security: []
      responses:
        "200":
          description: The service information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
components:
  securitySchemes:
    apiKeyBearer:
      type: http
      scheme: bearer
      description: "A sail-proxy API key as `Authorization: Bearer <key>`. Only a token that starts with `sk-` is read as a key."
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: A sail-proxy API key in `x-api-key`. The same key is also read from `x-stainless-key` and from the query parameter `api_key`.
    googApiKeyHeader:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: A sail-proxy API key in `x-goog-api-key`, as Gemini clients send it, or in the query parameter `key`.
    awsSigV4:
      type: apiKey
      in: header
      name: Authorization
      description: "An AWS Signature Version 4 (`AWS4-HMAC-SHA256 Credential=…`, with `X-Amz-Date`) made with AWS credentials the gateway issued. The signature covers the JSON body, so it works only on routes with a JSON body or none. A malformed header or date is answered 401, an unknown credential or a wrong signature 403, and 503 when the credential cannot be validated, each as `{error: {code, message, timestamp}}`."
  headers:
    Retry-After:
      description: Seconds until the exhausted window resets.
      schema:
        type: integer
    X-RateLimit-Limit:
      description: The limit that was exceeded.
      schema:
        type: string
    X-RateLimit-Remaining:
      description: What is left of it (0).
      schema:
        type: string
    X-RateLimit-Reset:
      description: When the window resets, in Unix seconds.
      schema:
        type: string
  responses:
    Unauthorized:
      description: No API key, an invalid one, a deactivated user (`user_deactivated`), or an AWS signature with a malformed header or date, in the gateway's error format (`authentication_error`). Every route answers this one in the gateway's format, whatever format the vendor uses.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    FileStoreUnauthorized:
      description: No key, an invalid key, or a credential without an owner (`authentication_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    FileStoreUnavailable:
      description: File search is unavailable (`file_search_unavailable`, `file_search_busy`) or its content storage cannot be reached (`blob_storage_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    PayloadTooLarge:
      description: The JSON body is larger than the configured request size (`maxRequestSize`, 10 MB by default).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    QuotaExceeded:
      description: A rate limit (`rate_limit_exceeded`) or a token or spend quota (`quota_exceeded`) of the key, user or team is exhausted.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuotaError"
  schemas:
    GatewayError:
      type: object
      description: The gateway's error format, OpenAI's envelope. Further fields depend on the error (`param`, `help`, `details`, `model`, `catalog`); a refused AWS signature has `code`, `message` and `timestamp` and no `type`.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
            type:
              type: string
              description: For example `authentication_error`, `invalid_request_error`, `model_not_entitled`, `file_search_unavailable`, `api_error`.
            code:
              type:
                - string
                - integer
                - "null"
              description: A machine-readable code, or the HTTP status.
            param:
              type:
                - string
                - "null"
    QuotaError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - scope
            - dimension
            - window
            - limit
            - used
            - resets_at
          properties:
            type:
              type: string
              enum:
                - rate_limit_exceeded
                - quota_exceeded
            scope:
              type: string
              enum:
                - user
                - key
                - team
            team:
              type: string
              description: The team's name, when the scope is `team`.
            dimension:
              type: string
              enum:
                - requests
                - tokens
                - spend
            window:
              type: string
              examples:
                - minute
                - hour
                - day
                - week
                - month
            limit:
              type: number
            used:
              type: number
            resets_at:
              type: string
              format: date-time
    AnthropicError:
      type: object
      required:
        - type
        - error
      properties:
        type:
          const: error
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
            message:
              type: string
    GeminiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - status
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
              examples:
                - INVALID_ARGUMENT
                - PERMISSION_DENIED
                - NOT_FOUND
    BedrockError:
      type: object
      required:
        - message
      description: Bedrock's error body; the error type is in the `x-amzn-ErrorType` header.
      properties:
        message:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - deployTarget
        - timestamp
        - message
      properties:
        status:
          const: healthy
        service:
          const: gateway
        deployTarget:
          type: string
          enum:
            - local
            - docker
            - btp
            - xsa
          description: "`DEPLOY_TARGET`; `local` for the npm gateway."
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        simulatedDelay:
          type: integer
          minimum: 1
          maximum: 660
          description: The seconds waited, when `response_wait` was given.
    ServiceInfo:
      type: object
      additionalProperties: false
      required:
        - message
        - version
        - service
        - deployTarget
        - status
        - endpoints
      properties:
        message:
          type: string
        version:
          type: string
          description: A fixed string, not the release version.
        service:
          const: gateway
        deployTarget:
          type: string
          enum:
            - local
            - docker
            - btp
            - xsa
        status:
          type: string
        endpoints:
          type: object
          description: Route prefixes by area.
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        availableFiles:
          type: object
          additionalProperties:
            type: string
    Model:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
      description: A model in OpenAI's format. With `SAP_INCLUDE_EXTENDED_MODEL_ATTRIBUTES=true` it carries SAP AI Core's attributes as further properties.
      properties:
        id:
          type: string
          description: The SAP AI Core model name; `<model>--deployed` for a deployment.
          examples:
            - gpt-5-mini
            - anthropic--claude-4.5-sonnet--deployed
        object:
          const: model
        created:
          type: number
          description: Unix seconds.
        owned_by:
          type: string
          description: The provider SAP AI Core names.
        accessType:
          type: string
          enum:
            - foundation
            - deployment
        routable:
          type: boolean
          description: Whether a request for the model can be routed (`false` only with `include=unroutable`).
        streamingSupported:
          type: boolean
    ModelList:
      type: object
      additionalProperties: false
      required:
        - object
        - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    CacheCleared:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          const: true
        message:
          type: string
    AnthropicTokenCount:
      type: object
      additionalProperties: false
      required:
        - input_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 1
    AnthropicModel:
      type: object
      required:
        - type
        - id
        - display_name
        - created_at
      properties:
        type:
          const: model
        id:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    AnthropicModelList:
      type: object
      required:
        - data
        - has_more
        - first_id
        - last_id
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicModel"
        has_more:
          const: false
        first_id:
          type:
            - string
            - "null"
        last_id:
          type:
            - string
            - "null"
    OpenRouterGenerationPlaceholder:
      type: object
      required:
        - status
        - message
      properties:
        status:
          const: not_implemented
        message:
          type: string
    OpenRouterCreditsPlaceholder:
      type: object
      required:
        - status
        - message
        - object
        - credits
      properties:
        status:
          const: not_implemented
        message:
          type: string
        object:
          const: credit_summary
        credits:
          type: "null"
    RptPredictionRequest:
      type: object
      required:
        - prediction_config
        - rows
      description: SAP-RPT's request, forwarded unchanged; SAP validates it (for example at most 10 target columns).
      properties:
        prediction_config:
          type: object
          required:
            - target_columns
          properties:
            target_columns:
              type: array
              items:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                  task_type:
                    type: string
                    enum:
                      - classification
                      - regression
                  prediction_placeholder:
                    type: string
                    description: The value that marks the cells to predict.
                    examples:
                      - "[PREDICT]"
            explanations:
              type: object
              description: sap-rpt-1.5 and later.
              properties:
                top_column_scores:
                  type: integer
                top_relevant_context_rows:
                  type: integer
            context_mode:
              type: string
              enum:
                - default
                - deep
        index_column:
          type: string
          description: The column that identifies a row in the predictions.
        rows:
          type: array
          description: Context rows first, then the rows to predict.
          items:
            type: object
            additionalProperties: true
        data_schema:
          type: object
          description: 'Column types, for example `{"Open Days": {"dtype": "numeric"}}`.'
    RptPredictionResponse:
      type: object
      description: SAP-RPT's answer, relayed unchanged.
      properties:
        id:
          type: string
        metadata:
          type: object
          properties:
            num_rows:
              type: integer
            num_columns:
              type: integer
            num_query_rows:
              type: integer
            num_predictions:
              type: integer
            context_mode:
              type: string
        predictions:
          type: array
          description: One entry per query row, keyed by its index value, with one list of `{prediction, confidence, confidence_interval}` per target column.
          items:
            type: object
            additionalProperties: true
        explanations:
          type: object
        status:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
    RptError:
      type: object
      required:
        - detail
        - status
      description: SAP-RPT's error shape, used for the gateway's own refusals on this route too.
      properties:
        detail:
          type: array
          items:
            type: object
            required:
              - loc
              - msg
              - type
            properties:
              loc:
                type: array
                items:
                  type:
                    - string
                    - integer
              msg:
                type: string
              type:
                type: string
                description: The gateway's are `gateway_auth`, `model_not_entitled`, `model_not_found`, `quota_exceeded` and `upstream_unavailable`.
              quota:
                type: object
                description: The quota refusal's details, on `quota_exceeded`.
        status:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
            message:
              type: string
        id:
          type: string
