  /anthropic/v1/messages:
    post:
      tags:
        - Anthropic
      operationId: anthropicCreateMessage
      summary: Create a message
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        **Models:** renames in `providers.anthropic.substitute_models` apply first. A model with a deployment (`--deployed`) is called at its SAP AI Core deployment; every other model is served by SAP orchestration. A model the catalogue does not list is answered 404 `not_found_error` in Anthropic's format.

        **What changes in the request:**

        - Through orchestration the system prompt is sent as text, and only `messages`, `temperature`, `max_tokens`, `top_p`, `top_k`, `stop_sequences`, `tools` and `tool_choice` are carried over (`frequency_penalty` and `presence_penalty` too when a rename points at a non-Anthropic model; `max_tokens` is left out for an OpenAI model). Other fields are not forwarded.
        - At a deployment, `model` and `stream` are removed from the body, `anthropic_version` is filled in from the model's configuration when missing, and the `anthropic-beta` header (or a body `anthropic_beta`) is filtered through `providers.anthropic.supported_beta_headers` and `excluded_beta_headers` and through flags SAP AI Core rejected for that model in the last 30 minutes.
        - A streamed request is streamed natively, emulated where configured, or answered without streaming when the model cannot stream.

        **Pseudonymization:** in the shipped configuration (`hooks.defaults.anthropic`) personal data in the prompt is replaced by placeholders before the request leaves the gateway, and the placeholders in the answer are restored. The header `x-sail-proxy-pseudonymization: off` or the body field `pseudonymization_off: true` skip it only where the configuration allows a user bypass (the shipped configuration does not). For the deployed Claude models the shipped configuration adds per-model hooks: the `web_search` server tool is run by the gateway with Perplexity sonar-pro on SAP AI Core (a streamed request makes at most `capabilities.web_search.max_searches_per_request` searches per request (1 to 10, default 3)), empty assistant messages are removed, responses are cached, and for newer models cache-control scopes are stripped, tool blocks repaired and oversized images resized. When pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, the request is refused with 503 `pseudonymization_hook_missing`; when it cannot be masked, with 503 `pseudonymization_failed`. Either way it is not sent.

        **Tool governance:** the caller's tool policies are applied to the tools the request declares: monitored, stripped (the model is told which tools were removed) or refused with 403 `permission_error` in Anthropic's error format.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled` (in the gateway's error format).

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.

        **Errors:** authentication, entitlement and quota refusals use the gateway's error format; everything else uses Anthropic's.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://docs.anthropic.com/en/api/messages
      x-sail-upstream: Orchestration; a --deployed Anthropic model goes to its deployment
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: "A message, or with `stream: true` a server-sent event stream, as Anthropic defines them."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A tool policy refused a declared tool (Anthropic's format, `permission_error`), or the model is not entitled (gateway format, `model_not_entitled`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AnthropicError"
                  - $ref: "#/components/schemas/GatewayError"
        "404":
          description: The model is not in the catalogue (`not_found_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "503":
          description: Pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, because there is no hook for this route, the hook lacks the pseudonymization plugin, or its match does not fit the request (`pseudonymization_hook_missing`). Pseudonymization is enforced for the route or the model and the request could not be masked (`pseudonymization_failed`). Both in the gateway's error format; either way the request is not sent upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        default:
          description: Any other error, in Anthropic's error format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/v1/messages/count_tokens:
    post:
      tags:
        - Anthropic
      operationId: anthropicCountTokens
      summary: Count the tokens of a message
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        **What the gateway does:** it estimates the count itself, with no upstream call. The request is translated to OpenAI's format and counted with a local tokenizer for the model after `providers.anthropic.substitute_models` renames; for Claude models (`claude…`, `anthropic--…`) 346 tokens are added when tools are declared (not for `mcp__` tools under a `claude-code` beta header) and the sum is multiplied by 1.15, rounded; for Grok models 480 and 1.03 the same way.

        It never fails: a body without `model` or `messages`, and any error while counting, is answered `{"input_tokens": 1}`.

        No quota, plugin or tool governance runs on this route.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://docs.anthropic.com/en/api/messages-count-tokens
      x-sail-upstream: Counted in the gateway, no upstream call
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The estimated count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicTokenCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
