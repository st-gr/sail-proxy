      - name: model_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Anthropic
      operationId: anthropicRetrieveModel
      summary: Retrieve a model
      description: |-
        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials.

        One model of `GET /anthropic/v1/models`; any other id, including one the caller is not entitled to, is answered 404 `not_found_error`.

