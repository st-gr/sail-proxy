              schema:
                $ref: "#/components/schemas/AnthropicError"
  /google/v1beta/models/{modelAndMethod}:
    x-sail-aliases:
      - /google/v1/models/{modelAndMethod}
    parameters:
      - name: modelAndMethod
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Google Gemini
      operationId: geminiModelMethod
      summary: Generate, stream or embed content ({model}:generateContent, :streamGenerateContent, :embedContent)
      description: |-
        The path segment is `<model>:<method>`, the shape the `@google/genai` SDK builds; `generateContent`, `streamGenerateContent` and `embedContent` are served (the embeddings reference is https://ai.google.dev/api/embeddings). Any other method, and any other path under `/google/v1beta` or `/google/v1`, is answered 404 in the Gemini error format.

        **Credential:** a sail-proxy API key instead of the vendor's key (see the security schemes), or an AWS SigV4 signature made with gateway-issued AWS credentials. The `x-goog-api-key` header and `?key=` that Gemini clients send are read like `x-api-key`.

        **Models:** renames in `providers.google.substitute_models` apply first. A Gemini model with a Google deployment on SAP AI Core is served natively; every other model in the catalogue (Claude, GPT, Mistral, an undeployed Gemini model) is served by SAP orchestration with a Gemini-to-orchestration translation. `embedContent` uses the orchestration embedding scenario first and a Google embedding deployment otherwise. Image output (`responseModalities` with `IMAGE`) needs a Google deployment; without one the request is refused with 400.

        **What changes in the request:** the same limits apply on both paths: tools other than `functionDeclarations` (hosted tools) are refused, `candidateCount` above 1 is refused, function calls and responses must pair up turn by turn (all 400). Through orchestration, `temperature` and `topP` are dropped for Claude and gpt-5 models where SAP refuses them.

        **Plugins:** the hooks configured for the `google` endpoint run (the shipped configuration configures none). Pseudonymization masks the system instruction, the text parts of `contents` and the tool calls and tool results in them (`functionCall.args`, `functionResponse.response`). When pseudonymization is enforced for the route or the model, `generateContent` and `streamGenerateContent` are refused with 503 `pseudonymization_hook_missing` when the active configuration would not run it for the request, and with 503 `pseudonymization_failed` when the request cannot be masked; neither is sent. `embedContent` is never pseudonymized: the pseudonymization plugin is skipped for it, enforced or not, and the other hooks run.

        **Tool governance:** the caller's tool policies are applied to the tools the request declares: monitored, stripped (the model is told which tools were removed) or refused with 403 `PERMISSION_DENIED` in the Gemini error format.

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 in the Gemini error format; both the requested id and the one it is routed to must be entitled.

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.

        **Errors:** in the Gemini format `{error: {code, message, status}}`, except authentication and quota refusals, which use the gateway's formats.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://ai.google.dev/api/generate-content
      x-sail-upstream: Deployed Gemini model, or orchestration; :embedContent goes to an embedding model
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: A `GenerateContentResponse`, a server-sent event stream of them for `streamGenerateContent`, or an `EmbedContentResponse`, as the Gemini API defines them.
        "400":
          description: A request the gateway does not accept (hosted tools, `candidateCount` above 1, unpaired function calls) or image output for a model without a Google deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The model is not entitled, or a tool policy refused a declared tool (`PERMISSION_DENIED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
        "404":
          description: An unsupported method, or a model the gateway cannot serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "503":
          description: Pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, because there is no hook for this route, the hook lacks the pseudonymization plugin, or its match does not fit the request (`pseudonymization_hook_missing`). Pseudonymization is enforced for the route or the model and the request could not be masked (`pseudonymization_failed`). Both in the gateway's error format; either way the request is not sent upstream. `:embedContent` is never pseudonymized and never refused this way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        default:
          description: Any other error, in the Gemini API's error format; a failure after the stream started arrives as one error frame.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
  /aws-bedrock/model/{modelId}/{subpath}:
    parameters:
      - name: modelId
        in: path
        required: true
        schema:
          type: string
      - name: subpath
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - AWS Bedrock
      operationId: bedrockModelOperation
      summary: Invoke or converse with a model (subpath invoke, invoke-with-response-stream, converse or converse-stream)
      description: |-
        `subpath` is `invoke`, `invoke-with-response-stream`, `converse` or `converse-stream` (400 otherwise).

        **Credential:** an AWS SigV4 signature made with gateway-issued AWS credentials (what the AWS SDKs send), or a sail-proxy API key.

        **Models:** renames in `providers.aws-bedrock.substitute_models` apply first; the model must be a Bedrock model of the catalogue (404 when unknown, 400 when it is not a Bedrock model). A model with a deployment is called at its SAP AI Core deployment: `model` and `stream` are removed from the body, `anthropic_version` is filled in when missing and `anthropic_beta` is filtered as on `/anthropic/v1/messages`. A model without one is served by SAP orchestration through the `/anthropic/v1/messages` flow: `invoke` takes an Anthropic Messages body and only for Claude models (400 otherwise), `converse` bodies are translated to Messages and the answer back.

        Streams are AWS event-stream frames, as from Bedrock.

        **Pseudonymization:** in the shipped configuration (`hooks.defaults.aws-bedrock`) personal data in the prompt is replaced by placeholders before the request leaves the gateway, and the placeholders in the answer are restored. The header `x-sail-proxy-pseudonymization: off` or the body field `pseudonymization_off: true` skip it only where the configuration allows a user bypass (the shipped configuration does not). The per-model hooks of `/anthropic/v1/messages` (web search and the rest) apply to the deployed Claude models here too. For a model served through orchestration the plugins of `/anthropic/v1/messages` run instead; pseudonymization enforced for `aws-bedrock` still applies to it. The shipped configuration runs pseudonymization on all four subpaths. For a deployed model it masks Anthropic messages bodies and Converse bodies (`converse`, `converse-stream`, and the Amazon Nova body on `invoke`): the system prompt, message text, tool-call inputs and tool results; the answer is restored, streamed or not. When pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, the request is refused with 503 `pseudonymization_hook_missing`; when it cannot be masked, or its body is one pseudonymization cannot read (a `prompt`, `inputText` or `message` body), with 503 `pseudonymization_failed`. Either way it is not sent.

        **Tool governance:** the caller's tool policies are applied to the tools the request declares: monitored, stripped (the model is told which tools were removed) or refused with 403 in Bedrock's format (`{message}`, `x-amzn-ErrorType: AccessDeniedException`).

        **Entitlement:** a model outside the caller's entitlement catalog is refused with 403 `model_not_entitled` (in the gateway's error format).

        **Quota:** the caller's rate limits and quotas apply (per key, user and team; on a standalone gateway 100 requests per minute per key unless `RATE_LIMIT_RPM` says otherwise). A refusal is 429 with `Retry-After` and `X-RateLimit-*` headers.

        **Limits:** a JSON body above the configured request size (`maxRequestSize`, 10 MB by default) is refused with 413.

        **Errors:** for a model served through orchestration in Bedrock's format, `{message}` with an `x-amzn-ErrorType` header; the gateway's own refusals and errors from a deployment in the gateway's error format.
      externalDocs:
        description: The vendor's API reference for the request and response bodies
        url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_Operations_Amazon_Bedrock_Runtime.html
      x-sail-upstream: Deployment for a --deployed model, orchestration otherwise
      x-sail-credential: Gateway API key or AWS SigV4 signature (gateway-issued AWS credentials)
      security:
        - apiKeyBearer: []
        - apiKeyHeader: []
        - googApiKeyHeader: []
        - awsSigV4: []
      responses:
        "200":
          description: The model's answer (`invoke`), a Converse response (`converse`) or an AWS event stream (`-stream` subpaths), as Bedrock defines them.
        "400":
          description: An unknown subpath, a model that is not a Bedrock model, or `invoke` on a non-Claude model without a deployment.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GatewayError"
                  - $ref: "#/components/schemas/BedrockError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The model is not entitled (gateway format), or a tool policy refused a declared tool (Bedrock format).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GatewayError"
                  - $ref: "#/components/schemas/BedrockError"
        "404":
          description: The model is not in the catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/QuotaExceeded"
        "503":
          description: Pseudonymization is enforced for the route or the model but the active configuration would not run it for this request, because there is no hook for this route, the hook lacks the pseudonymization plugin, or its match does not fit the request (`pseudonymization_hook_missing`). Pseudonymization is enforced for the route or the model and the request could not be masked, or its body is one pseudonymization cannot read (`pseudonymization_failed`). Both in the gateway's error format, also for a model served through orchestration; either way the request is not sent upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayError"
        default:
          description: "Any other error: in Bedrock's format for a model served through orchestration, otherwise in the gateway's error format."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GatewayError"
                  - $ref: "#/components/schemas/BedrockError"
